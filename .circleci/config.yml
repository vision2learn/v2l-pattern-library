version: 2
jobs:
  build:
    docker:
      - image: circleci/node:10

    working_directory: ~/repo

    steps:
      - checkout
      - attach_workspace:
          at: ~/repo

      # Download and cache dependencies
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "package.json" }}
            # fallback to using the latest cache if no exact match is found
            - v1-dependencies-

      - run: sudo apt update && sudo apt install graphicsmagick
      - run: curl -s https://packagecloud.io/install/repositories/github/git-lfs/script.deb.sh | sudo bash
      - run: sudo apt install git-lfs
      - run: yarn install

      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package.json" }}

      # run
      - run: git lfs fetch --all && git lfs pull
      - run: yarn gulp build && ELEVENTY_ENV=dev yarn eleventy
      
      # compress the output for more efficient deployment...
      - run: tar -czvf site.tar.gz dist

      - persist_to_workspace:
          root: .
          paths: 
            - dist/*
            - site.tar.gz
            
  dotnet:
    docker:
      - image: circleci/node:10

    working_directory: ~/repo

    steps:
      - checkout
      - attach_workspace:
          at: ~/repo

      # Download and cache dependencies
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "package.json" }}
            # fallback to using the latest cache if no exact match is found
            - v1-dependencies-

      - run: sudo apt update && sudo apt install graphicsmagick
      - run: curl -s https://packagecloud.io/install/repositories/github/git-lfs/script.deb.sh | sudo bash
      - run: sudo apt install git-lfs
      - run: yarn install

      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package.json" }}

      # run
      - run: git lfs fetch --all && git lfs pull
      - run: yarn gulp build && ELEVENTY_ENV=dotnet yarn eleventy
      - run: find dist/dotnet -name '*.cshtml'
      - run: find dist/dotnet -name '*.cshtml' -exec sed -i 's_href="/pdfs_href="~/pdfs_g' "{}" \;
      - run: find dist/dotnet -name '*.cshtml' -exec sed -i 's_href="/documents_href="~/documents_g' "{}" \;
      - run: find dist/dotnet -name '*.cshtml' -exec sed -i 's_href="http://_href="//_g' "{}" \;
      - run: find dist/dotnet -name '*.cshtml' -exec sed -i 's_src="/images_src="~/images_g' "{}" \;
      #- run: grep -i -R 'href="/pdf' dist/dotnet
      #- run: grep -i -R 'href="/documents' dotnet
      #- run: find dist/dotnet -type f -exec sed -i 's/href=“\/documents/href=“~\/documents/g' {} \;
      #- run: find dist/dotnet -type f -exec sed -i 's/href=“\/pdfs/href=“~\/pdfs/g' {} \;

      - persist_to_workspace:
          root: .
          paths: dist/*

      - run:
          name: Create Export Package
          command: for dir in dist/dotnet/* ; do echo $dir ; cp -R --strip-trailing-slashes src/scss $dir/scss/ ; cp -R --strip-trailing-slashes dist/js $dir/js ; done
      - run:
          name: Move Images
          command: cp -R --strip-trailing-slashes dist/images dist/dotnet/images
      - run:
          name: Zip .NET Export
          command: tar -cvf dotnet.tar dist/dotnet
      - run:
          name: Compress Images
          command: tar -cvf images.tar dist/images
      - run:
          name: Sass Assets
          command: tar -cvf scss.tar src/scss
      - run:
          name: JS
          command: tar -cvf js.tar dist/js

      - store_artifacts:
          path: dotnet.tar
          destination: dotnet.tar
      - store_artifacts:
          path: images.tar
          destination: images.tar
      - store_artifacts:
          path: scss.tar
          destination: scss.tar
      - store_artifacts:
          path: js.tar
          destination: js.tar
  staging:
    machine:
      enabled: true
    working_directory: ~/repo
    steps:
      -  add_ssh_keys:
          fingerprints:
            - "a2:aa:ee:91:eb:fe:c7:cb:a9:cc:98:40:fd:d2:6f:27"
      - attach_workspace:
          at: ~/repo
      - run:
          name: Deploy Over SSH
          command: |
            scp -r ~/repo/site.tar.gz $SSH_USER@$SSH_HOST:~/backgroundyellow.net
            ssh $SSH_USER@$SSH_HOST tar -xzvf backgroundyellow.net/site.tar.gz -C backgroundyellow.net/v2l/test

  deploy:
    machine:
      enabled: true
    working_directory: ~/repo
    steps:
      -  add_ssh_keys:
          fingerprints:
            - "a2:aa:ee:91:eb:fe:c7:cb:a9:cc:98:40:fd:d2:6f:27"
      - attach_workspace:
          at: ~/repo
      - run:
          name: Deploy Over SSH
          command: |
            scp -r ~/repo/site.tar.gz $SSH_USER@$SSH_HOST:~/backgroundyellow.net
            ssh $SSH_USER@$SSH_HOST tar -xzvf backgroundyellow.net/site.tar.gz -C backgroundyellow.net/v2l

workflows:
  version: 2
  build-and-deploy:
    jobs:
      - build:
          filters:
            branches:
              only:
                - rayner-mod
      - dotnet:
          filters:
            branches:
              only: 
                - master
      - staging:
          requires:
            - build
          filters:
            branches:
              only:
                - rayner-mod
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: master

version: 2
jobs:
  build:
    docker:
      - image: circleci/node:8.15

    working_directory: ~/repo

    steps:
      - checkout
      - attach_workspace:
          at: ~/repo

      # Download and cache dependencies
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "package.json" }}
            # fallback to using the latest cache if no exact match is found
            - v1-dependencies-

      - run: sudo apt update && sudo apt install graphicsmagick
      - run: yarn install

      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package.json" }}

      # run
      - run: yarn build
      - persist_to_workspace:
          root: .
          paths: dist/*
          
  deploy:
    machine:
      enabled: true
    working_directory: ~/repo
    steps:
      -  add_ssh_keys:
          fingerprints:
            - "a2:aa:ee:91:eb:fe:c7:cb:a9:cc:98:40:fd:d2:6f:27"
      - attach_workspace:
          at: ~/repo
      - run:
          name: Deploy Over SSH
          command: |
            scp -r ~/repo/dist $SSH_USER@$SSH_HOST:~/backgroundyellow.net/v2l
            # cd ~/repo/dist && ls -la

workflows:
  version: 2
  build-and-deploy:
    jobs:
      - build
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: master

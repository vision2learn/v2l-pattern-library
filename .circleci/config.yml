version: 2
jobs:
  build:
    docker:
      - image: circleci/node:12

    working_directory: ~/repo

    steps:
      - checkout
      - attach_workspace:
          at: ~/repo

      # Download and cache dependencies
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "package.json" }}
            # fallback to using the latest cache if no exact match is found
            - v1-dependencies-

      - run: sudo apt update && sudo apt install graphicsmagick
      - run: curl -s https://packagecloud.io/install/repositories/github/git-lfs/script.deb.sh | sudo bash
      - run: yarn install
      # - run: sudo apt install git-lfs

      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package.json" }}

      # run
      # - run: git lfs fetch --all && git lfs pull
      - run: 
          name: Build it
          command: yarn run staging
          no_output_timeout: 30m
      - run:
          name: Generate Integrity SHAs
          command: |
            printf "CSS Integrity\n" >> shas.txt
            cat dist/css/main.css | openssl dgst -sha256 -binary | openssl base64 -A >> shas.txt
            printf "\n\nJS Integrity\n" >> shas.txt
            cat dist/js/script.js | openssl dgst -sha256 -binary | openssl base64 -A >> shas.txt
      
      # compress the output for more efficient deployment...
      - run: tar -czvf site.tar.gz dist

      - store_artifacts:
          path: shas.txt
          destination: shas.txt

      - persist_to_workspace:
          root: .
          paths: 
            - dist/*
            - site.tar.gz
            - shas.txt
            
  dotnet:
    docker:
      - image: circleci/node:12

    working_directory: ~/repo

    steps:
      - checkout
      - attach_workspace:
          at: ~/repo

      # Download and cache dependencies
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "package.json" }}
            # fallback to using the latest cache if no exact match is found
            - v1-dependencies-

      - run: sudo apt update && sudo apt install graphicsmagick
      - run: curl -s https://packagecloud.io/install/repositories/github/git-lfs/script.deb.sh | sudo bash
      - run: sudo apt install git-lfs
      - run: yarn install

      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package.json" }}

      # run
      - run: git lfs fetch --all && git lfs pull
      - run: yarn gulp build && ELEVENTY_ENV=dotnet yarn eleventy
      - run: find dist/dotnet -name '*.cshtml'
      - run: find dist/dotnet -name '*.cshtml' -exec sed -i 's_href="/pdfs_href="~/pdfs_g' "{}" \;
      - run: find dist/dotnet -name '*.cshtml' -exec sed -i 's_href="/documents_href="~/documents_g' "{}" \;
      - run: find dist/dotnet -name '*.cshtml' -exec sed -i 's_href="http://_href="//_g' "{}" \;
      - run: find dist/dotnet -name '*.cshtml' -exec sed -i 's_src="/images_src="~/images_g' "{}" \;
      #- run: grep -i -R 'href="/pdf' dist/dotnet
      #- run: grep -i -R 'href="/documents' dotnet
      #- run: find dist/dotnet -type f -exec sed -i 's/href=“\/documents/href=“~\/documents/g' {} \;
      #- run: find dist/dotnet -type f -exec sed -i 's/href=“\/pdfs/href=“~\/pdfs/g' {} \;

      - persist_to_workspace:
          root: .
          paths: dist/*

      - run:
          name: Create Export Package
          command: |
            mkdir -p dist/assets
            mkdir -p dist/assets/videos/captions/vtt
            cp -R --strip-trailing-slashes src/scss dist/assets/scss
            cp -R --strip-trailing-slashes dist/js dist/assets/js
            cp -R --strip-trailing-slashes dist/images dist/assets/images
            cp -R --strip-trailing-slashes dist/videos/captions/vtt dist/assets/videos/captions
            cp -R --strip-trailing-slashes dist/pdfs dist/assets/pdfs
            cp -R --strip-trailing-slashes dist/documents dist/assets/documents
            tar -cvf dotnet.tar dist/dotnet
            tar -cvf assets.tar dist/assets
            tar -cvf videos.tar dist/videos
      - store_artifacts:
          path: dotnet.tar
          destination: dotnet.tar
      - store_artifacts:
          path: videos.tar
          destination: videos.tar
      - store_artifacts:
          path: assets.tar
          destination: assets.tar
  staging:
    machine:
      enabled: true
    working_directory: ~/repo
    steps:
      -  add_ssh_keys:
          fingerprints:
            - "a2:aa:ee:91:eb:fe:c7:cb:a9:cc:98:40:fd:d2:6f:27"
      - attach_workspace:
          at: ~/repo
      - run:
          name: Deploy Over SSH
          command: |
            scp -r ~/repo/site.tar.gz $SSH_USER@$SSH_HOST:/mnt/website/backgroundyellow.net
            ssh $SSH_USER@$SSH_HOST tar -xzvf /mnt/website/backgroundyellow.net/site.tar.gz -C /mnt/website/backgroundyellow.net/v2l/test
  tests:
    machine:
      enabled: true
    working_directory: ~/repo
    steps:
      -  add_ssh_keys:
          fingerprints:
            - "a2:aa:ee:91:eb:fe:c7:cb:a9:cc:98:40:fd:d2:6f:27"
      - attach_workspace:
          at: ~/repo
      - run:
          name: Backstop Tests
          command: |
            echo "Running Backstop JS tests"
            ssh $SSH_USER@$SSH_HOST "cd /mnt/website/backstopjs; backstop test"
  backstop-references:
    machine:
      enabled: true
    working_directory: ~/repo
    steps:
      -  add_ssh_keys:
          fingerprints:
            - "a2:aa:ee:91:eb:fe:c7:cb:a9:cc:98:40:fd:d2:6f:27"
      - attach_workspace:
          at: ~/repo
      - run:
          name: Generate Backstop References
          command: ssh $SSH_USER@$SSH_HOST "cd /mnt/website/backstopjs; backstop reference"
  deploy:
    machine:
      enabled: true
    working_directory: ~/repo
    steps:
      -  add_ssh_keys:
          fingerprints:
            - "a2:aa:ee:91:eb:fe:c7:cb:a9:cc:98:40:fd:d2:6f:27"
      - attach_workspace:
          at: ~/repo
      - run:
          name: Deploy Over SSH
          command: |
            scp -r ~/repo/site.tar.gz $SSH_USER@$SSH_HOST:/mnt/website/backgroundyellow.net
            ssh $SSH_USER@$SSH_HOST tar -xzvf /mnt/website/backgroundyellow.net/site.tar.gz -C /mnt/website/backgroundyellow.net/v2l
workflows:
  version: 2
  build-and-deploy:
    jobs:
      - build:
          filters:
            branches:
              only:
                - rayner-mod
                - master
      - dotnet:
          filters:
            branches:
              only: 
                - master
      - staging:
          requires:
            - build
          filters:
            branches:
              only:
                - rayner-mod
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: master
      - tests:
          requires:
            - build
            - staging
          filters:
            branches:
              only: rayner-mod
      - backstop-references:
          requires:
            - deploy
          filters:
            branches:
              only: master

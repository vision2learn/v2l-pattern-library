version: 2
jobs:
  build:
    docker:
      - image: circleci/node:8.15

    working_directory: ~/repo

    steps:
      - checkout
      - attach_workspace:
          at: ~/repo

      # Download and cache dependencies
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "package.json" }}
            # fallback to using the latest cache if no exact match is found
            - v1-dependencies-

      - run: sudo apt update && sudo apt install graphicsmagick
      - run: yarn install

      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package.json" }}

      # run
      - run: yarn gulp build && ELEVENTY_ENV=dev yarn eleventy
      
      # compress the output for more efficient deployment...
      - run: tar -czvf site.tar.gz dist

      - persist_to_workspace:
          root: .
          paths: 
            - dist/*
            - site.tar.gz
            
  dotnet:
    docker:
      - image: circleci/node:8.15

    working_directory: ~/repo

    steps:
      - checkout
      - attach_workspace:
          at: ~/repo

      # Download and cache dependencies
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "package.json" }}
            # fallback to using the latest cache if no exact match is found
            - v1-dependencies-

      - run: sudo apt update && sudo apt install graphicsmagick
      - run: yarn install

      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package.json" }}

      # run
      - run: yarn gulp build && ELEVENTY_ENV=dotnet yarn eleventy

      - persist_to_workspace:
          root: .
          paths: dist/*

      - run:
          name: Compress Pages
          command: tar -cvf html_pages.tar dist/dotnet
      - run:
          name: Compress Images
          command: tar -cvf images.tar dist/images

      - store_artifacts:
          path: html_pages.tar
          destination: html.tar
      - store_artifacts:
          path: images.tar
          destination: images.tar
  staging:
    machine:
      enabled: true
    working_directory: ~/repo
    steps:
      -  add_ssh_keys:
          fingerprints:
            - "a2:aa:ee:91:eb:fe:c7:cb:a9:cc:98:40:fd:d2:6f:27"
      - attach_workspace:
          at: ~/repo
      - run:
          name: Deploy Over SSH
          command: |
            scp -r ~/repo/site.tar.gz $SSH_USER@$SSH_HOST:~/backgroundyellow.net
            ssh $SSH_USER@$SSH_HOST tar -xzvf backgroundyellow.net/site.tar.gz -C v2l/test

  deploy:
    machine:
      enabled: true
    working_directory: ~/repo
    steps:
      -  add_ssh_keys:
          fingerprints:
            - "a2:aa:ee:91:eb:fe:c7:cb:a9:cc:98:40:fd:d2:6f:27"
      - attach_workspace:
          at: ~/repo
      - run:
          name: Deploy Over SSH
          command: |
            scp -r ~/repo/site.tar.gz $SSH_USER@$SSH_HOST:~/backgroundyellow.net
            ssh $SSH_USER@$SSH_HOST tar -xzvf backgroundyellow.net/site.tar.gz -C v2l

workflows:
  version: 2
  dotnetify:
    jobs:
      - dotnet:
          filters:
            branches:
              only: 
                - master
  build-and-deploy:
    jobs:
      - build
      - staging:
          requires:
            - build
          filters:
            branches:
              only: 
                - bleeding-edge
                - rayner-mod
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: master

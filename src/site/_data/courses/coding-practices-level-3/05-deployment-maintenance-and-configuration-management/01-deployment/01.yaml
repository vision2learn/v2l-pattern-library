title: Welcome to Unit 5
intro: |
  ### Deployment, Maintenance, Configuration management, and Version control
    
  Welcome to the fifth unit of your Level 3 Certificate in Coding Practices.  This unit is about deployment, maintenance, configuration management and version control.

banner: cp3_u5_s1_p1_intro.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit, you will cover the following criteria of your Level 3 Certificate in Coding Practices qualification.

      You will:

      1. Know about deployment
      2. Understand maintenance in coding
      3. Understand configuration management and version control systems

      [View the complete set of learning outcomes for this unit.](/pdfs/v2l_cp3_learning_outcomes_u5.pdf)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      
      * How to package an artefact
      * The importance of deployment planning
      * The difference between build and deploy
      * What is meant by continuous deployment
      * What is meant by deployment strategy
      * The advantages and disadvantages of canary deployment
      * What is meant by rollback strategy

    title: Build and Deploy
    theme: t-bg-primary
    copy: |
      Within a software development project, 'build' and 'deploy' are common terms but are also connected to each other as the  deployment is dependent upon the build.  See below to see the differences between the two:

    subInc: 
      type: accordion
      content:
        - 
          title: Build
          copy: |
            A version of a fully developed software product is ‘built’ into a package or form that can be deployed. For example, an executable file is a built software product; it is a compiled file of a project. Or a software build (such as a website) is a set of executable code that is ready to be tested.  There are two types of builds – a full build and an incremental build. 

            Repeated builds are known as Continuous Integration (CI) and are part of the development process which would involve collecting and packaging all the application components. CI is part of the build stage in DevOps processes; once the code has been created, committed to version control (a repository) and tested, the build would put all of the elements of the project together before continuing to the next stage. Each time the source code is built it is assigned a version. 
            
            It is at the build stage that the team compiles the source code into a binary (executable) file.
          img: /images/svg/cp3/cp3_u5_s1_p3_slide1.svg
        - 
          title: Deploy
          copy: |
            Once the build has been packaged it is ready to be deployed. The deployment would be installed, tested, and implemented as a system, application, or website. If the project is a website, deployment is making it live on the internet.  If a dedicated  system, deployment is the process of hosting the project on a server. If an application, deployment is creating the final executable (compiled) file.  

            Deployment can be to 'Development', 'Test', and 'Production' environments, and can be done manually or automatically. Deployment would take the source code from 'Version Control' and make it available to users. 
            
            Continuous Deployment (CD) is automated and would release the new or updated source code into the production (live) environment.  It would involve the whole package going through automated dependency testing, integration testing, and unit testing.  Test-driven development practices would be used if the package does not pass the tests.  

            Deployment is the final stage of the project and is when the product is ready for the customer and is ready to be deployed into the live environment. 
          img: /images/svg/cp3/cp3_u5_s1_p3_slide2.svg

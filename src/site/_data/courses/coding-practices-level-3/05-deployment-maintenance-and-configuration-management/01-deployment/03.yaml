    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to describe what is meant by continuous deployment.
  -
    title: Continuous deployment
    theme: 
    copy: |
      Continuous Deployment (CD) is the final stage in a software project.  It is a strategy that automates software releases into the production environment due to the source code passing all testing in previous phrases.  

      Whilst Continuous Integration (CI) and Continuous Delivery ensure that the program is continuously functional during production, CD goes another step further and passes all stages of the production pipeline to customers.  It aims to minimise the ‘lead time’, the time between any changes being made to the software, and the software being usable by the customer. 

      It involves the full end to end testing of the complete software package.  The whole package will go through automated dependency, integration, and unit testing.  If the package passes the tests it can be deployed, else it is revised using test-driven development practices. 

      Once signed off it will be uploaded to a central repository from which all system files are contained and can be accessed by the end user. 

      ![](/images/banners/placeholder.jpg)

      One of the main advantages with CD is that once all the manual tests and review aspects have been done in the Continuous Delivery stage there is no time-lag as it can automatically be deployed into the production environment. However, testing and monitoring are more critical in CD as there is no human (manual) approval.  Tools used in the CD stage would include those used in Continuous Delivery but with an emphasis on testing before and after deployment.

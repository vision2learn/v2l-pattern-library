      slides:
        -
          title: Build
          text: |
            A 'Build' is when a version of a fully developed software product is ‘built’ into a package or form that can be deployed. For example an executable file is a built software product.  Built is a compiled file of a project.  Build is putting the project together.  A software build is a set of executable code that is ready for use.  The team compiles the source code into a binary file.  Each time the source code is built it will be assigned a version. Repeated builds are known as continuous integration and are part of the development process which would involve collecting and packaging all of the application components.  Two types of builds – a full build and an incremental build.  
          img: placeholder_icon.svg
        -
          title: Deploy
          text: |
            Installed, tested and implemented a system, application or website. Making it runnable or live on a website.  Deployment is a process of hosting the project on a server. 
            
            Take code from version control and make it available to users – you can deploy to a dev, test, and production environments – manually or automatically.  Continuous deployment is automated and would release the new or updated source code into the production (live) environment. (_use l2 text_). 
          img: placeholder_icon.svg

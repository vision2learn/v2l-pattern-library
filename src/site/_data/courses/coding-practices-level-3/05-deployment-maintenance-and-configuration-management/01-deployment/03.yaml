  -
    title: The DevOps stages
    theme: t-bg-primary
    copy: |
      Before we go into more detail about the build, deployment, and continuous deployment, it is useful to know where these fit within the DevOps process.
      
      The DevOps process combines software development and IT operations. It consists of a set of principles and practices which aim to shorten the software development lifecyle whilst ensuring quality in the outcome.  In general, it consists of various working methodologies referred to as “toolchains” which encompass: 
      * Coding 
      * Building
      * Testing
      * Packaging
      * Release
      * Configuring 
      * Monitoring 
      
      DevOps aims to be flexible and is complimentary to a style of working called Agile.

      For building, testing, and release (deployment) toolchains, DevOps uses continuous integration, continuous delivery, and continuous deployment, respectively, which have their basis in Agile workflow. Let’s have a look at DevOps processes and how they allow development teams to specify their pipeline flows, infrastructure and deployment settings.
  -
  -
    title: DevOps processes
    theme: t-bg-supporting3
    copy: |
      DevOps processes are used to:
      1. minimize the development time between releases, and 
      2. so that up-to-date product-ready versions can be released at any moment. 

      Historically, programmers may have worked on their separate sections of code, only merging them together after extended time periods when individual pieces of work were complete. However, this meant that bugs and errors accumulated over time, which made them more time-consuming to fix, and only came to light when the work is brought together. This was also a longer process, which meant that there was extra time before the product was ready for use for the customers.

      Using continuous integration, continuous delivery, and continuous deployment, small code sections can be merged into the main program, tested, and released as they are completed as an on-going process. They refer to different stages and practices of the development cycle.

      ![](/images/svg/uc/uc_u4_s3_p1_wide_image.svg)

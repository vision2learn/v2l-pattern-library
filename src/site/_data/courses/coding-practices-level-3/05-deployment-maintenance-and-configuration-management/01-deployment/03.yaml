    title: Quick quiz
    copy: Build or Deployment?
    subInc: 
      type: word-quiz
      content:
        -
          sentence: A build will produce an executable file. 
          answer: build
        -
          sentence: A build is a packaged version of a fully developed software product. 
          answer: build
        -
          sentence: Deployment would mean that the product is installed, tested, and implemented as a system, application, or website. 
          answer: Deployment
        -
          sentence: Continuous Integration (CI) is part of the build stage in DevOps processes. 
          answer: build
        -
          sentence: Deployment is the final stage of the project and is when the product is ready for the customer. 
          answer: Deployment
        -
          sentence: Bringing the source code with all of its components together is a build.
          answer: build
        -
          sentence: Deployment is installing, testing, and implementing a system into the production environment. 
          answer: Deployment
    theme: i-quiz

title: Deployment strategy
intro: |
  On this page you will learn about deployment strategy, canary deployment, and what is meant by rollback strategy.
banner: cp3_u5_s1_p4_deployment.jpg
sections:
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to describe what is meant by deployment strategy.
  -
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Deployment strategy
      
      A deployment strategy is a process to change (or upgrade) a software product. One of the aims of a deployment strategy is to release a new version without downtime so the user is free to continue using the product. Please see the following video to learn more.

    video: cp3_u5_s1_p3_deployment_strategy.mp4
  -
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to identify the advantages and disadvantages of canary deployment.
  -
    title: Canary deployment
    theme: t-bg-primary
    copy: |
      Canary deployment (which is also known as ‘phased’ or ‘incremental rollout’) rolls out the latest version of a software product to a smaller group of users, so they can act as a test group to catch errors and issues before deploying to the wider group. 

      Canary deployment would alleviate capacity planning as the target audience is much smaller so the product would only need to be deployed to a single server or a limited set.  A subset of end users would test the update and alert the production team if there were any issues. 

      ![](/images/svg/cp3/cp3_u5_s1_p4_image.svg)

      It is quite robust because if there are any issues with the new release, users can still be directed to the existing ‘live’ version whilst updates and bug fixes are being carried out on the Canary updated version.  

      One of the disadvantages is the resources that may be needed. This is because the time it would take to complete the updated version, as it is tested and phased into production, could be slow.   

      Also, version management would be a critical consideration as more than one version would need to be managed simultaneously.  However, rollback can be quick with this type of deployment if it was found that was needed.

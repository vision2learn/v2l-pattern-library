    title: Rollback plan
    theme: 
    copy: |
      A rollback plan is a written document that outlines all the steps required to recover an application and or database to the point before the deployment.

      See below to see the difference between a deployment plan without rollback, wannabe rollback, and an actual rollback plan.
    subInc: 
      type: accordion
      content:
        - 
          title: Examples of rollback plans
          copy: |
            | No rollback plan | Wannabe rollback plan | Actual rollback plan |
            |------|------|------|
            | N/A there is not need for a rollback plan, change will be successful | | DBA Task |
            | | | Scripts are located: D:\dba\CC4562\rollback\ |
            | | | Login to the DB_APPS database as the system user and run the following scripts: |
            | | - drop the tables | 1.--drop tables - SQL>@drop tables.sql |
            | | - run the deletes and updates | 2.--run required DML to restore previous state of tables - SQL>@run delete.sql and SQL>@run update.sql |
            | | - test | 3.--verify - SQL>@post_rollback_verify.sql|
            | | | All logs need to be saved to: D:\dba\CC4562\rollback\logs |

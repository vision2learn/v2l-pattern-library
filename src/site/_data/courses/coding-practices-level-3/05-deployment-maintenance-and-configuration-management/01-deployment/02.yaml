title: Artefacts, packaging, and deployment planning
intro: |
  On this page you will learn about artefacts and packages; and the importance of deployment planning.
banner: placeholder.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to explain how to package an artefact.
  -
    title: Artefacts and packages
    theme: t-bg-supporting3
    copy: |
      An artefact is any of the single items that would be part of the software project. A package is a packaged project which would contain the artefacts.   As you can see from the below diagram, different artefacts would be created by different members of the product team at different stages of the project lifecycle. 

      ![](/images/svg/cp3/cp3_u5_s1_p2_image.svg)

      Artefacts can also include things like case studies, data models, design documents, scripts, and work products.  

      Artefacts are like roadmaps which can be used for developers to trace the project process. Artefacts are documented and would be stored in the code repository or in a separate ‘Artefact repository’ – this is a decision that a DevOps engineer would make. Keeping relevant artefacts in a repository helps developers to access artefacts as and when they need them during the project. 

      Some of the artefacts explains how the code is run but others would enable the code to run for example one artefact could be a list of resources needed for the project, whilst another could be the project source code. 
  -
  -
    title: Types of artefacts
    theme: t-bg-primary
    copy: |
      There are different types of artefacts including: 

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Code related artefacts
          text: |
            Code related artefacts would include: 
            * Test Suites, 
            * Setup scripts, 
            * Source code, 
            * Compiled code, 
            * Test output, 
            * Prototypes, and 
            * Assets such as images.
          img: placeholder_icon.svg
        -
          title: Document artefacts
          text: |
            Documents could include: 
            * Diagrams, 
            * End-User agreements, 
            * Internal Documents, 
            * Meeting notes, 
            * Software documents, 
            * Design documents, and 
            * Scripts.
          img: placeholder_icon.svg
        -
          title: Project management artefacts
          text: |
            Project Management Artefacts could include: 
            * User Cases/Stories, 
            * Criteria – Strategy, 
            * Logs and register, 
            * Plans, 
            * Hierarchy charts, 
            * Baselines, 
            * Visual data and information, 
            * Reports, 
            * Agreements and contracts.
          img: placeholder_icon.svg
  -
  -
    title: Packaging an artefact
    theme: 
    copy: |
      An artefacts package would be created during continuous integration and would be part of the build process so it could be included at the deployment stage of the project. An artefact package is a logical package that can assemble all the project artefacts that have been created in a single build (or artefacts created in multiple builds).  When identifying specific artefacts needed for a deployment an artefact version can be created in the manifest. If deployment is to multiple environments, you can also create environment artefact packages so certain artefacts are only deployed to their relevant environment.  

      The general Continuous Integration (CI) process for traditional application code is: 
      1. Merge changes to the main source branch from a feature branch 
      2. Compile code to releasable form 
      3. Run unit tests
      4. Package into a releasable artefact
      5. Publish artefact to an artefact repository 

      As you can see from the diagram, the Artefacts package would be created in step 4. 

      ![](/images/banners/placeholder.jpg)
  -
  -
    title: Example of a package management tool
    theme: t-bg-supporting3
    copy: |
      ### Docker

      Docker is a container management service. Docker uses an ‘image’ format which stores data and metadata.  A docker image make good release artefacts because the image format is a portable application package.  

      Using a package management tool such as Docker would expand on the steps 4 and 5 illustrated in the above diagram. 

      As you can see in the below diagram, custom software is packaged into a Docker image, which is tested, and then published into a releasable artifact. 

      ![](/images/banners/placeholder.jpg)

      The Docker image builds an artefact that is easy to inspect which means it can be built and tested before it is published. The Dockerfile (which is a software artifact), would contain instructions for packaging an application in a Docker image.
  -
  -
    title: Another example of a package management tool 
    layout: media
    theme: t-bg-primary
    copy: |
      ### NuGet

      NuGet packages are zip files with a manifest of metadata, data, and config files.  It is the standard packaging format for the Microsoft .NET platform.  It would typically be used within Azure DevOps which is Microsoft’s cloud CI/CD platform at the deployment stage of the project.  Once a build has been done it would show as a packaged artefact.

    img: /images/svg/placeholder_icon.svg

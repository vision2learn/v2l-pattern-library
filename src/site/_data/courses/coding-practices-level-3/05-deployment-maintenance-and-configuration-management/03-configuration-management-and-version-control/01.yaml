  -
  -
    title: Quick quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: A version control tool would be used to track code and asset changes.
          answer: version control
        -
          sentence: An asset management tool would store, classify, and manage configuration items.
          answer: asset management
        -
          sentence: A backup and recovery tool would be used if a system failed or crashed.
          answer: backup and recovery
        -

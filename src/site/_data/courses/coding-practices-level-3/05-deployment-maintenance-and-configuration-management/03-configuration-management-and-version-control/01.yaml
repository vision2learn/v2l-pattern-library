title: Configuration management and version control
intro: |
  In this session you will learn about configuration management and version control systems.  On this page we look at the tools and techniques used in configuration management systems.
banner: cp3_u5_s3_p1_config_management.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * What is meant by configuration management
      * The tools and techniques used in configuration management systems
      * The main features and benefits of version control systems
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to:
      * Explain what is meant by configuration management
      * Explain the tools and techniques used in configuration management systems
  -
  -
    title: Configuration tools
    theme: t-bg-primary
    copy: |
      A Software Configuration Management System (SCM) would have a set of software tools which would be used to track and control changes in the stages of a software project. Scroll through the slides below to learn about configuration tools.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Version control
          text: |
            A version control system tool would be used to track code and asset changes. It would also have comparison capabilities so the current state can be compared to the previous state if needed. It should be noted that __source control is specific to source code__. Version control also covers large binary files and digital assets. 
          img: cp3_u5_s3_p1_slide1.svg
        -
          title: Deployment
          text: |
            A deployment tool would automate deployment from the Continuous Delivery (CD) stage of the project.  The deployment tool would be connected to the version control tool.  
            
            A 'Deployment site' would also be used for the Continuous Integration (CI) stages of a project so the developer, testing and review teams could check the product on a Developer site or Staging site before final deployment. 
          img: cp3_u5_s3_p1_slide2.svg
        -
          title: Asset management / Configuration management database
          text: |
            Asset management would store, classify, and manage configuration assets. A Configuration Management Database (CMDB) helps to manage configuration assets. It stores the configuration records for the assets, and includes the attributes, such as type, owner, or version.  It also stores the relationships with other assets in the system.
          img: cp3_u5_s3_p1_slide3.svg
        -
          title: Configuration backup and recovery
          text: |
             If there are any issues the system can be restored from a backup.  This would also be related to version control and rollback strategy. It would improve a system recovery with its automation capabilities, and would keep an audit trail which would document any changes or update. If a system failed or crashed, the reason could be identified and avoided in future deployments.
          img: cp3_u5_s3_p1_slide4.svg
  -
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Configuration management
      
      Configuration management is a process that defines, controls, documents, and reports the configuration items in a system. Please see the following video to learn more about configuration management and Software Configuration Management (SCM) tools.
    video: cp3_u5_s3_p1_Configuration_management.mp4

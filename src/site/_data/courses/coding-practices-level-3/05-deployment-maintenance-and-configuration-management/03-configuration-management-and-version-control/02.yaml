    title: The DevOps lifecycle PLACEHOLDER
    theme: 
    
    copy: |
      _Use this as a basis to do a new one for the version control element of the lifecycle_

      Version control software (for example Git) is used to allow additions and revisions to code to be uploaded to a central repository. When an update is made to a section of code, previous versions are stored in case there is a need to revert back to these.
      
      Please see the below activity which will take you through the lifecycle and stages of DevOps.  It also defines and clarifies the steps involved in continuous integration, continuous delivery, and continuous deployment.
      
    interactive: 
      file: uc/u4_s3_p1_dev_ops

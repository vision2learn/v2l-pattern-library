title: Maintenance, Elements and Documentation
intro: |
  This session is all about maintenance.  It includes the key elements, improvements, change management, and documentation.  
banner: placeholder.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * The key elements of maintenance
      * Why documentation of maintenance is important
      * The improvements that could be made in maintenance
      * Why change management is used in maintenance
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to identify the key elements of maintenance.
  -
  -
    title: Key elements of maintenance
    theme: t-bg-primary
    copy: |
      Developing a piece of software can take a couple of years but maintenance is ongoing for the lifetime of the product and can last up to 20 years and sometimes even more. Let’s look at the four main types of software maintenance.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Corrective maintenance
          text: |
            The typical, classic form of maintenance is known as ‘Corrective software maintenance’.  Basically, if something goes wrong, a solution is identified and developed to fix it. Corrective software maintenance is necessary when a piece of software shows faults and errors, or there is a compatibility issue with another piece of newly released software. 
          img: placeholder_icon.svg
        -
          title: Adaptive maintenance
          text: |
            ‘Adaptive maintenance’ takes into consideration that technology is constantly changing, and that it is importance that software is able to keep up with these changes.  Sometimes adaptive maintenance will also take organisation’s polices and rules into consideration as well. 
          img: placeholder_icon.svg
        -
          title: Perfective maintenance
          text: |
            Perfective software maintenance is about improving the software and system performance once the product has been released.  It is normally in response to the customer feedback.  It’s focus is on features and functional enhancements that improve the user experience.
          img: placeholder_icon.svg
        -
          title: Preventative software maintenance 
          text: |
            Preventative software maintenance is about future-proofing and the shelf-life of the software product. It makes changes and adaptations to the software product with new features and updates. It reduces the risk of deterioration as new features would improve reliability, performance, maintainability, and stability.
          img: placeholder_icon.svg
  -

  -
    title: Quick quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Perfective maintenance is about improving the system performance in response to customer feedback. 
          answer: Perfective
        -
          sentence: Corrective software maintenance is necessary when a piece of software shows faults and errors, or there is a compatibility issue with another piece of newly released software. 
          answer: Corrective
        -
          sentence: Preventive software maintenance would include refining software to reduce complexity to make it easier to maintain and understand.
          answer: Preventive
        -
          sentence: Adaptive maintenance is commonly used if a new version of an operating system is launched or a new type of processor is introduced.
          answer: Adaptive
    theme: i-quiz

      type: time-to-think
      copy: |
        What do you think are the potential pitfalls for __not__ keeping maintenance documents?
  -
  -
    title: Document Tools
    theme: t-bg-supporting3
    copy: |
      ### Document tools, Live documentation / Automation

      Most development environments now include a document tool which would be used as a __Knowledge Management Tool__.  The __knowledge base__ would be updated as the software is built, bugs are fixed, new features and enhancements are added to the software, and new versions of the software application are rolled out. Take a look below to see some examples.
      
    subInc: 
      type: accordion
      content:
        - 
          title: Examples of document tools
          copy: |
            ### GitHub

            The knowledge base would be managed in different ways according to the type of document tool used. For example, __GitHub__ would treat documents as artefacts so they would have their own document folders with their own repository and can be published to their own website page. 

            ### Tettra
            
            Another tool - __Tettra__, is a flexible document tool which manages the knowledge base to share timely and accurate information amongst team members. It would create a catalog with a Q&A format which can be accesses via a collaboration tool such as Slack.
        - 
          title: Automatic documentation tool
          copy: |
            Documentation could also be automated. A system could be set to automatically generate documents each time a change is made to the software so it is always up to date. The tool could be used with a focus on:
            * High level view with a description of requirements
            * The data model
            * Cross references between functionalities, functions, and data
            * Business rules
            * Subsystem description and interaction
            * Comments

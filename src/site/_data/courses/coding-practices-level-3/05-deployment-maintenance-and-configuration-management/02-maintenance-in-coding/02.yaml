title: Maintenance Documentation
intro: |
  On this page you will learn about the documentation that is needed in maintenance.
banner: placeholder.jpg
sections:
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to explain why documentation of maintenance is important.
  -
  -
    title: Maintenance documentation
    theme: t-bg-primary
    copy: |
      Agile methodology has shaken the traditional view of software documentation as it is more aligned with the philosophy of information communication.  But the Agile model is not suitable once the development project is complete as software maintenance becomes the focus so there is a much greater need for supporting maintenance documentation. 

      It has been found that there are two extremes with maintenance support. There is either no documentation at all due to planning and budget pressures during development, or too much is written as the software is developed so it ends up out of date and irrelevant. Neither of these two scenarios support the developer who is responsible for maintaining the software. 

      The purpose of the software maintenance manual (or a digital knowledge base) is to help software engineers to understand the software so they can maintain it. 
      
      See below to learn more.
    subInc: 
      type: accordion
      content:
        - 
          title: Why it is important
          copy: |
            Up to date technical documentation will greatly increase the productivity and efficiency of the maintenance (and new features) that will be needed for a software application.  A role of technical maintenance documentation is to bring a new team member up to speed and be used as a reference for an existing developer. Developers often change as they may be working on multiple projects, have left or are new to the team.   
            
            Well written thought-out technical documents would include all of the software development from a general overview to specific details which explains how the software works.  It would include the architectural diagram, test plans, brand guidelines, maintenance plans, release processes, etc.  This document would be a working document as it would need to be updated in line with the software application most recent versions. 
            
            Maintenance of any software item need to be properly planned for.  So first of all a software maintenance plan would be created during the project build.
            
          img: /images/svg/placeholder_icon.svg
        - 
          title: Different maintenance document needs
          copy: |
            The maintenance document needs would vary according to who is using them: 
            * __Managers__ – Decision support info - e.g. the size of the system or the alteration/update costs
            * __Analysts__ – Application domain, requirements, and a global view of the system 
            * __System Designers__ – Architectural understanding, and design information such as data structures
            * __Programmers__ – A detailed understanding of the source code and the architectural	view. 
            
          img: /images/svg/placeholder_icon.svg
  -
  -
    title: Stages of experience
    theme: t-bg-supporting2
    copy: |
      There are four stages of developer experience, from newcomer to expert.  Each stage will need to be considered with maintenance documents: 
      * Newcomers – A short general view of the system 
      * Apprentices – The system architecture 
      * Graduates / Intermediates – Task orientated - e.g. requirement description, process description, examples, step-by-step instructions 
      * Experts – All levels to be included – low level documentation, requirement description, and design specification.

      ![](/images/banners/placeholder.jpg)                     
  -
  -
    title: Types of artefacts included
    layout: media
    theme: t-bg-primary
    copy: |
      Documents that should be created (or automatically generated) at the end of a project should include: stories, tests, data model, class model, business process description, user manual, and project minutes.  It is also important that the document describes the hierarchical architecture of the system.

      Documentation artefacts that are important to those software developers who maintains the software system include:
      * Source code and comments
      * Data model
      * Requirement specification
      * Architectural model

    img: /images/svg/placeholder_icon.svg

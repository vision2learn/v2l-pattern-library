  -
    title: Stretch
    layout: media
    theme: t-bg-primary2 i-stretch
    copy: |
      ###  Re-Documentation process and tool

      Another software process and tool to consider with documentation for software is __Re-Documentation__.  Many legacy systems lack documentation which makes maintenance difficult as software engineers would need to study and understand the system repeatedly.  One solution is to re-document the legacy system using tools to automate the process. Click on the owl which will take you to a website which discusses this process and tool.

    img: /images/svg/stretch_button.svg
    link: https://www.academia.edu/18057479/Software_Re_Documentation_Process_and_Tool

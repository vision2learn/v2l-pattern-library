  -
    title: Benefits and considerations
    theme: t-bg-supporting3
    copy: |
      See below for the benefits and considerations in change management.
    subInc: 
      type: accordion
      content:
        - 
          title: Benefits
          copy: |
            The benefits to change management in software maintenance would:
            * Improve the performance of the product
            * Increase engagement
            * Enhance innovation
            * Keep up to date with new technologies
            * Implement new requirements
            * Reduce costs 
            
          img: /images/svg/placeholder_icon.svg
        - 
          title: Considerations
          copy: |
            Potential issues could occur in change management if the following is not considered:
            * Reason for the change
            * Alternatives
            * Result of the change
            * Risks involved
            * Individuals involved
            * Resources needed
            * Relationships and or dependencies 
            
          img: /images/svg/placeholder_icon.svg

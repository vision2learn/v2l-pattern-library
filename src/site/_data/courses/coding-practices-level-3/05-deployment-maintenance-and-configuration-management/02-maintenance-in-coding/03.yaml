    title: Change management
    layout: media
    theme: t-bg-primary
    copy: |
      ### What is change management? 
      
      Change management in software development is a term used to describe the transition period of when an existing state of a software product moves into an improved state. So, this would describe the phase of when a software product is going from its existing version, e.g. 1.0, to the next deployed (live) version 2.0 where it would include the enhancements of the improved software. 
      
      Change management would manage changes to artefacts such as code, process, and documentation. Change could be for different reasons and from different sources such as a business reorganisation, changes to the market, technical reasons, fixes and bugs, Sales/marketing ideas, or budget restrictions. Change management tools can be used to manage the process and can also be used for project planning, creating flow charts, and data collection.

    img: /images/svg/placeholder_icon.svg
  -
  -
    title: Change management process in maintenance
    theme: t-bg-supporting2
    copy: |
      Each organisation and development team would have slightly different processes for managing change, but they would normally include the type and scope of the change needed, business justification, planning, communication, resource needs, testing, tracking of the changes, evaluate, adjust, and identifying improvements.

      A typical sequence of CCP in a software development project would include the following steps: 
      1. Change Request identification (Identify the need for the change)
      2. Review the Change Request (Assessment – is it valid)
      3. Plan the change (Assessment – resources and potential impact)
      4. Test the change (Analysis – will it work)
      5. Create a change proposal (Approval - Identify change risk, complexity, impact level)
      6. Implement changes (Update project procedures/plans, communication to team, monitor progress, record completion)
      7. Review the change performance
      8. Close the process

      _CCP Diagram_

      ![](/images/banners/placeholder.jpg)
    
      The focus of Change Control Process (CCP) for a software product is to identify the change, document, and sign-off the change request.  CCP includes activities that would improve the overall performance of the software product. Change control is useful as it helps the software product to maintain its integrity, so the proposed changes do not affect other parts of the software.        

                          double y = getNumber(2);
                          double total = multiplymethod(x,y);
                          display(total);
                          run = checkFinish();
                      }
                      else  (choice.equals("4")){
                          double x = getNumber(1);
                          double y = getNumber(2);
                          double total = divideMethod(x,y);
                          display(total);
                          run = checkFinish();
                      }
                      else {
                          System.out.println("Entry not recognised, please try again...");
                      }

                  } while (run);

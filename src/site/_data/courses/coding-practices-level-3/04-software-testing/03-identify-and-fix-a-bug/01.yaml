title: Identify and fix a bug
intro: |
  In this session you will learn how to identify and fix bugs within code. 
banner: placeholder.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * Techniques which can be used to identify and fix bugs
      * the benefits of the following techniques:
        * variable watching
        * compiler warnings
        * unit test
      * Diagnose the cause of a bug using the following techniques:
        * variable watching
        * compiler warnings
        * unit test
      * How to perform a fix on broken code
      * How the bug could have been prevented
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to explain techniques which can be used to identify and fix bugs
  -
    title: Watch 
    theme: t-bg-supporting3 i-watch
    layout: media
    copy: |
      
      Lets take a look at the different techniques that can be used to identify and fix bugs in code.
    video: cp3_u4_s3_p1_bug_fix_demo.mp4
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
       can you explain the different types of techniques that can be used to identify and fix bugs? 
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to diagnose the cause of a bug using, variable watching, compiler warnings and unit testing and perform a fix on any broken code found.
  -
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      
      Please see the following video which demonstrates how to diagnose code for bugs.
    video: cp3_u4_s3_p1_bug_fix_demo.mp4
  -
    title: Time for assessment
    theme: t-bg-primary3 i-practice
    copy: |
      As part of your assessment, you are required to show evidence that you have diagnosed the cause of a bug using the following techniques;

      *Variable watching
      *Compiler warnings
      *Unit test
      
      Using an IDE of your choice and the sample code provided, carry out a diagnosis of the code and perform fixes to any bugs identified.  

      To complete the task, you will need to upload a copy of your fixed code with your assessment.
  

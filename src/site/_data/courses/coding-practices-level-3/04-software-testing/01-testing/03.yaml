title: Functional and non-functional testing
intro: |
  On this page you learn more about functional and non-function testing and the differences between the two. 
banner: cp3_u4_s1_p3_functional_and_non.jpg
sections:
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to explain the differences between functional and non-functional testing
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Functional and non-functional testing

      So far you have learnt about different types, levels and methods of coding and we have talked about functional and non-functional testing. Lets take a look at the differences in more detail and when you would use the different methods.
    video: cp3_u4_s1_p2_functional_testing.mp4
  -
    title: Quick quiz
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        Is the following statement true or false? "Functional testing checks the performance and behaviour of an application.":
          answers:
            True: false
            False: true
        Is the following statement true or false? "An example of a functional test is whether a login page loads within 5 seconds.": 
          answers:
            True: false
            False: true
          feedback: This would be a non functional test. A functional test relating to this would be that the textboxes for the logins are displayed correctly.
        Select one option to complete the following sentence:"__________ is an example of a functional testing.":
          answers:
            performance testing: false
            volume testing: false
            Smoke testing: true
          feedback: performance testing and volume testing are both non-functional testing methods.
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
       Can you explain the difference between functional and non-functional testing? 

  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to identify different levels, types and methods of testing.
  -
    title: So what is testing?
    layout: media
    theme: t-bg-primary
    copy: |
      Testing can be defined as the process of evaluating software a system or its components with the intent to find out whether it satisfies the specified requirements or not. 
      
      To ensure that each piece of code works the way it is supposed to there are a number of different types, level and methods of testing carried out. 
      
      Most testing methods can be categorised as either functional or non-functional which you will learn more about on this page. You will also learn about how testing is a critical element within software development cycle. 

    img: /images/svg/placeholder_icon.svg

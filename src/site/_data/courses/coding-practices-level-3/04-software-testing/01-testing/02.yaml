  -
    title: Non-functional testing
    theme: t-bg-primary
    copy: |
      In the video above we have talked about the different types of functional testing, but what about non-functional testing? 
      The main non-functional testing technique is performance testing. This type of test is designed to find out how an application behaves under a range of conditions. Performance testing can be broken down in to four main types. 

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Load Testing
          text: |
           This is a process of testing the behavior of a software by applying maximum load in terms of software accessing and manipulating large input data. It can be done at both normal and peak load conditions. This type of testing identifies the maximum capacity of software and its behavior at peak time. For example;
           You have an application that is designed to handle 1000 users at any one time and the response time should be 4 seconds. Load testing will apply a load sufficient to test that if there are 1000 users the response time is 4 seconds for all users. 

          img: placeholder_icon.svg
        -
          title: Stress testing
          text: |
            Stress testing takes load testing one step further and goes beyond what the sofware was designed to handle. For example;
            Your application has a response time of 4 seconds for 1000 simultaneous users so, a stress test for this would be to test with 1100, 1200, 1300 and so on until you find the failure point, which in this case would be when the response time is greater than 4 seconds.
          img: placeholder_icon.svg
        -
          title: Endurance testing
          text: |
            This is more commonly known as Soak Testing. This is a type of software testing in which the system is tested under huge load over a continuous period to check the behavior of the system under production use. 
            Soak Testing tests that system can withstand a huge volume of the load for an extended period of time. It also tests that what would happen outside the design expectations of the system
          img: placeholder_icon.svg
        -
          title: Usability testing
          text: |
            Usability testing is a black-box testing technique and is used to identify any errors and improvements in the software by observing the users through their usage and operation. This method may also include user interface testing (UI). UI testing involves testing the Graphical User Interface of the Software. UI testing ensures that the GUI functions according to the requirements and is tested in terms of color, alignment, size, and other properties.
          img: placeholder_icon.svg  

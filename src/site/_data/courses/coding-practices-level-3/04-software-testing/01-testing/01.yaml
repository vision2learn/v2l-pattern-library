title: Welcome to Unit 4
intro: |
    ### Software testing
    
    Welcome to the fourth unit of your Level 3 Certificate in Coding Practices. This unit is about software testing. You will learn about the different levels and methods of testing and what is meant by test driven development.
banner: placeholder.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit, you will cover the following criteria of your Level 3 Certificate in Coding Practices qualification.

      You will:

      1. Understand different levels, types and methods of testing
      2. Know about test driven development
      3. Be able to identify and fix a bug

      [View the complete set of learning outcomes for this unit.](/pdfs/)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      
      * The different levels, types and methods of testing.
      * The types and methods of testing used within the stages of the Software Development Lifecycle
      * The differences between functional and non-functional testing
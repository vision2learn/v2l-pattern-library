title: Test driven development (TDD)
intro: |
  In this session you will learn about what is involved in test driven development.
banner: placeholder.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * what is meant by test driven development
      * the structural composition of a unit test
      * the advantages and disadvantages of unit testing
      * what makes a bad unit test
  -   
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to explain what is meant by test driven development
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      TDD, or test-driven development, is a process that involves creating tests before writing any code. The idea is to think critically about the goal of the code before putting pen to paper or more appropriately hand to keyboard. Having a clear idea about what a function should do makes it much easier to correctly write it out. Lets take a look at what TDD involves. 
    video: cp3_u4_s2_p1__tdd.mp4

  -
    title: Quick quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: A developer writes the ‘test case’ without any code in front of them.
          answer: test case
        -
          sentence: Developers will write only enough of a unit test to fail.
          answer: fail
        -
          sentence: Developers ‘refactor’ the code, to ensure the functionality is intact and code is refined.
          answer: refactor
        -
          sentence: Developers write only the minimum required code, to pass the test case that previously failed.
          answer: pass
        -
          sentence: Once the test ‘passes’ the developer will check for any ‘unnecessary code’ which can be removed.
          answer: unnecessary code  
    theme: i-quiz
  
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        Can you explain what is meant by test driven development? What are the steps required when taking a TDD approach?
  -
    title: On the web
    theme: t-bg-secondary2 i-on-web
    include:
      type: on-the-web
      copy: |
        _Optional item depending on content_

        Please see the following website where you can learn more about TDD

      links:
        Test driven develoment: https://www.guru99.com/test-driven-development.html
  

    title: Advantages and disadvantages of unit testing
    theme: t-bg-primary
    copy: |
      Unit testing is an important part of software development and it can have a number of advantages for your project. However there are also some disadvantages. Lets take a look at these:
    subInc: 
      type: accordion
      content:
        - 
          title: Advantages
          copy: |
           * Unit testing can help you detect and fix errors in your code early in the development process. Late discovery errors are more expensive to fix and may have serious implications for deployment.

           * Unit testing allows the programmer to refactor code at a later date, and make sure the module still works correctly (i.e. Regression testing). The procedure is to write test cases for all functions and methods so that whenever a change causes a fault, it can be quickly identified and fixed.

           * Unit testing can help you improve your development workflow by providing a feedback loop that helps you identify and fix problems early on in the development process.

           * Unit testing can help you verify the functionality of your application. This means that you can be sure that your application functions as expected and does not contain any hidden flaws.

           * Unit testing can help you improve the quality of your code by ensuring that it is well written and error-free.
        - 
          title: Disadvantages
          copy: |
            * The most notable drawback of unit testing is the time and effort required - both during the testing process itself and in maintaining and keeping up with the automated tests.
            * Unit testing can’t be expected to catch every error in a program. It is not possible to evaluate all execution paths even in the most trivial programs.
            * Unit tests may cause problems when you need to test the user interface (UI).
            * When changing or adding code as a result of unit testing it may introduce navigation issues so more time is needed to address these before integration testing can begin.
            * Unit testing on more complex systems requires more tests to be written to ensure that there is no contradiction in results. 
        - 
          title: Bad unit testing
          copy: |
            As you can see there are both advantages and disadvantages to unit testing but it is also important to ensure that the unit test is valid. There are a number of factors to consider when writing unit tests and some of the common mistakes that would result in a badly designed unit test are;
            * __Testing irrelevant things__: This is where a test is valid but it is not specific enough and tests more than one element. 
            * __Testing multiple things in assertions__: Trying to make a test with more than one assertation may be required but this violates the single responsibility priniciple. Unless absolutely neccessary tests should be only testing one feature or function at a time.
            * __Test passes but the feature does not work__: This occurs when the test is testing another feature or function than the one intended.
            * __Test which depends on excessive setup__: The more things that have occur before the test starts creates complexity which can reduce the effectiveness of the test. 
    
  

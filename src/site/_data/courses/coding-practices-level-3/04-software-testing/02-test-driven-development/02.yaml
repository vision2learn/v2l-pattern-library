    title: Advantages and disadvantages of unit testing.
    theme: t-bg-primary
    copy: |
      Unit testing is an important part of software development and it can have a number of advantages for your project. However there are also some disadvantages. Lets take a look at these:
    subInc: 
      type: accordion
      content:
        - 
          title: Advantages
          copy: |
           * Unit testing can help you detect and fix errors in your code early in the development process. Late discovery errors are more expensive to fix and may have serious implications for deployment.

           * Unit testing allows the programmer to refactor code at a later date, and make sure the module still works correctly (i.e. Regression testing). The procedure is to write test cases for all functions and methods so that whenever a change causes a fault, it can be quickly identified and fixed.

           * Unit testing can help you improve your development workflow by providing a feedback loop that helps you identify and fix problems early on in the development process.

           * Unit testing can help you verify the functionality of your application. This means that you can be sure that your application functions as expected and does not contain any hidden flaws.

           * Unit testing can help you improve the quality of your code by ensuring that it is well written and error-free.
        - 
          title: Disadvantages
          copy: |
            * The most notable drawback of unit testing is the time and effort required - both during the testing process itself, and in maintaining and keeping up with the automated tests. Additionally, unit testing can be quite disruptive to the normal flow of development - making it difficult to move forward with other tasks while the tests are running.
            Unit testing can’t be expected to catch every error in a program. It is not possible to evaluate all execution paths even in the most trivial programs
        - 
          title: Bad unit tests
          copy: |
           
    copy2: As you can see, while there are clear benefits to unit testing, it's important to keep the drawbacks in mind before deciding to invest time and effort into a unit testing approach.    
  

  -
    title: Quick quiz
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        Is the following statement true or false? "Time delays are more damaging in an Agile environment":
          answers:
            True: false
            False: true
          feedback: Time delays are more damaging in linear approach methodologies such as Waterfall or Kanban. 
       
        Select one option to complete the following sentence:"Using __________ methodolgy allows you to manage and mitigate risks more effectively.":
          answers:
            Waterfall: false
            Agile: true
          feedback: Agile methodology gives greater scope to make changes at any stage of the project as several different items can be worked on at any given time.
       
        Is the following statement true or false? "As well as the project manager, Scrum team members are responsible for making decisions.":
          answers:
            true: true
            false: false
          feedback: In Scrum environments, decision making is pushed down to the team members to give them autonomy and control over the tasks that need to be completed.

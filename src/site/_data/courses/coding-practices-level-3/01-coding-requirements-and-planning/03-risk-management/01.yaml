  -
    title: Quick quiz
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        Is the following statement true or false? "Risks always have a negative outcome":
          answers:
            True: false
            False: true
          feedback: If risks are managed effectively they can also have a positive outcome. 
       
        Select one option to complete the following sentence:"developing software that will be used in operating theatres is a __________ risk.":
          answers:
            business risk: false
            pure risk: true
          feedback: Failure or problems with software that will be used in high risk environments such as health care or emergency services can have serious consequences so will always have a high degree of pure risk.
       
        Select one option to complete the following sentence:"The most common type of risk that will be encountered are  __________risks":
          answers:
            business: true
            pure: false
          feedback: business risks are more common as they involve risks relating to financial aspects of the project.
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        Think about a project that you worked in either in the workplace, at home at school. what were the risks that could have impacted the project? how did you manage the risks to ensure the project was successful?

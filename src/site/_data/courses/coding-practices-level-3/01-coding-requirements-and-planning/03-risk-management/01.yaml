sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * What is meant by risk management
      * Potential risks that could affect project delivery
      * How to reduce risk and follow risk mitigation
      * What is meant by a project’s critical path
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to:
      * Explain what is meant by risk management
      * Describe potential risks that could affect project delivery

title: Capture and documentation of requirements
intro: |
  In this session you will learn about the different documentation that may be required to capure requirements and how these are used within a project.
banner: placeholder.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * The process of requirements capture
      * The terms: epics, features, user stories, backlogs
      * Alternative methods of documenting requirements
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to identify the process of requirements capture.
  
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      Understanding requirements capture.
      
      Please see the following video to learn about the importance of requirements capture.
    video: placeholder_pc.mp4
  -
    title: Quick quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Functional Requirements give an overview of the high level objectives and requirements of the product.
          answer: Functional
        -
          sentence: An SSL certificate would be classed as a non-functional requirement.
          answer: non-functional
        -
          sentence: Brainstorming sessions are a type of elicitation activity.
          answer: elicitation
        -
          sentence: A statement of work will be provided by a Technical writer.
          answer: Technical writer
        -
          sentence: The product owner will add any changes to the backlog.
          answer: backlog
        -
          sentence: New items are prioritised during backlog refinement.
          answer: refinement

    theme: i-quiz
  -  
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        Have you ever been involved in a project? Did you carry out requirements capture activties? If yes, what benefits did this have? If not, did this affect the project?

  -
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to describe the following terms: 
      * epics, 
      * features, 
      * user stories, 
      * backlogs.
  
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
     Agile Terminology
      
      Lets take a closer look at some of the most common terms that you hear about and use when working in an Agile environment.
    video: placeholder_pc.mp4

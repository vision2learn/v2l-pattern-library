    title: Quick quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: example one - epics
          answer: epics
        -
          sentence: example two - features
          answer: features
        -
          sentence: example three - user stories
          answer: user stories
        -
          sentence: example four - backlog
          answer: backlog
    theme: i-quiz

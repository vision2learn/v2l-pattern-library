title: Capture and documentation of requirements
intro: |
  In this session you will learn about the different documentation that may be required to capure requirements and how these are used within a project.
banner: cp3_u1_s2_p1_capture_and_documentation.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * The process of requirements capture
      * The terms: epics, features, user stories, backlogs
      * Alternative methods of documenting requirements
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to identify the process of requirements capture.
  
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      Understanding requirements capture.
      
      Please see the following video to learn about the importance of requirements capture.
    video: placeholder_pc.mp4
  -
    title: Quick quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Functional Requirements give an overview of the high level objectives and requirements of the product.
          answer: Functional
        -
          sentence: An SSL certificate would be classed as a non-functional requirement.
          answer: non-functional
        -
          sentence: Brainstorming sessions are a type of elicitation activity.
          answer: elicitation
        -
          sentence: A statement of work will be provided by a Technical writer.
          answer: Technical writer
        -
          sentence: The product owner will add any changes to the backlog.
          answer: backlog
        -
          sentence: New items are prioritised during backlog refinement.
          answer: refinement

    theme: i-quiz
  -  
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        Have you ever been involved in a project? Did you carry out requirements capture activties? If yes, what benefits did this have? If not, did this affect the project?

  -
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to describe the following terms: 
      * epics, 
      * features, 
      * user stories, 
      * backlogs.
  
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
     Agile Terminology
      
      Lets take a closer look at some of the most common terms that you hear about and use when working in an Agile environment.
    video: placeholder_pc.mp4
  -
    title: Quick quiz
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        Is the following statement true or false? "Team members move items from the sprint backlog into the product backlog":
          answers:
            True: false
            False: true
          feedback: The product backlog contains all the task for the project so items are moved into the sprint backlog by the team to be completed in the current sprint.
       
        Select one option to complete the following sentence:"high level requirements for the project would be called.":
          answers:
            User stories: false
            Epics: true
            Features: false
          feedback: Epics contains details of the ultimate aim of the project.
       
        Select one option to complete the following sentence:"creating a drop down payment selector option would be classed as an  __________":
          answers:
            Epic: false
            user story: false
            Feature: true
          feedback: This would be a feature of the payment option so is a sub task of the user story. 
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
       Think about a project that you have worked on either at work, school/college or even a personal project. Using your learning from this page think about how the project would have been broken down into epics, features and user stories.
  -
    title: On the web
    theme: t-bg-secondary2 i-on-web
    include:
      type: on-the-web
      copy: |
       

        Please see the following website where you can learn more about . . .

      links:
        stories, epics and initiatives: https://www.atlassian.com/agile/project-management/epics-stories-themes
 
title: Software methodologies in project management
intro: |
  There are several different software methodologies used in project management. In this course we are going to focus on four which are Agile, Scrum, Kanban, and Waterfall.
banner: placeholder.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to summarise the key features of the following:
      * Agile
      * Scrum 
      * Kanban 
      * Waterfall
  -
    title: Software methodologies
    theme: t-bg-primary
    copy: |
      There are many different methodologies and frameworks used in project management for software projects.  In this course we are going to focus on four - Agile, Scrum, Kanban, and Waterfall. 
      
      Select the images below to see about the four different software methodologies.

    subInc: 
      type: reveal
      content:
        -
          title: Agile
          copy: |
            Agile is an iterative, people-oriented and result-focused way of working when delivering software products. The software is built incrementally in time-boxed 'sprints'.
          img: placeholder_icon.svg
        -
          title: Scrum
          copy: |
            Scrum is an Agile methodology often called a framework to help teams to work together on a project. Scrum is quick and easy to adapt, clear visibility, low risk and fast feedback loops.
          img: placeholder_icon.svg
        -
          title: Kanban
          copy: |
            Kanban is a visual system and the flow of work is managed from using a Kanban project board.  Often these same types of project boards are used in Agile and Scrum methodology.
          img: placeholder_icon.svg
        -
          title: Waterfall
          copy: |
            Waterfall project management follows a chronological process and works on fixed dates, requirements, and outcomes. Its three main principles are low customer involvement, strong documentation, and sequential structure.
          img: placeholder_icon.svg
  -
  -
    title: Agile development
    theme: 
    copy: |
      ‘Agile Development’ which is also more commonly known as Agile Software Development, is an umbrella term for a range of frameworks, such as ‘Scrum’, and practices such as the ‘daily stand-up meeting’. It adopts the principles set out in the ‘Agile Manifesto’ and the ‘Agile 12 Principles’. 

      Agile came about as a process to address issues that software developers faced, focussing on a project being flexible, so it could respond to any changes and deal with any uncertainty. 
            
      ![](/images/svg/uc/uc_u5_s4_p1_wide_image.svg)

  -
    title: Quick quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: The Sprint is a fixed length event which has a sprint goal. 
          answer: Sprint
        -
          sentence: The Scrum Master manages the Scrum Process and remove impediments.
          answer: Scrum Master
        -
          sentence: The Product Owner would determine the priority tasks and decide on the sprint goal.
          answer: Product Owner
        -
          sentence: Sprint planning is where achievable items or user stories, are identified from the product backlog to be moved to the next sprint. 
          answer: Sprint planning
        -
          sentence: The Scrum Team organises and manages its own work. They would deliver the agreed product increment inside a sprint.
          answer: Scrum Team
    theme: i-quiz
    title: Waterfall Project Management
    theme: 
    copy: |
      The waterfall project management approach emphasises a linear approach from the beginning to the end of a project. It flows like a waterfall through all phases of a project with each phase wrapping up before the next phase begins. It is often used by engineers and is front loaded relying on careful planning, detailed documentation, and consecutive execution.
      
      It follows a chronological process and works on fixed dates, requirements, and outcomes.
      
      ![](/images/svg/cp3/cp3_u1_s1_p4_wide_image_wf.svg)

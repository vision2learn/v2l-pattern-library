title: Software methodologies
intro: |
  On the previous page we looked at the Agile and Scrum methodologies. On this page we are going to focus on the Kanban and Waterfall methodologies.
banner: cp3_u1_s1_p4_software_methodology_b.jpg
sections:
  -
    title: Kanban
    layout: media
    theme: t-bg-primary
    copy: |
      Kanban was developed (with LEAN methodology) by an engineer for Toyota in the 1940s in Japan. It was predominately used in ‘just-in-time’ manufacturing.  Kanban came to the attention of the software industry and is nowadays used in the Agile methodology. 
      
      It is a visual system and the flow of work is managed from using a Kanban project board.  Often these same types of project boards are used in Agile and Scrum methodology.  In its simplest form there are three columns which are labelled: To Do, In Progress, and Done. 
      
      The objective of Kanban is to simplify planning, manage work and inventory, and increase productivity and efficiency.

    img: /images/svg/cp3/cp3_u1_s1_p3_image3.svg

    title: Four case studies
    theme: t-bg-primary1a i-case-study
    copy: |
      Scroll through the slides below to see four examples of when each methodology is most suitable.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Agile - GE Businesses
          text: |
            General Electric (GE) needed to update its performance review management system. Since GE became an Agile organisation, it has seen significant improvements as their previous ways of working with performance reviews was unethical, unyielding, and antiquated. 

            Managers now guide and coach employees to achieve their goals, and now work under a much more flexible framework. GE also included an App that they built to facilitate employee feedback and productive performance conversations. 

            Using the App, an employee can set a series of priorities and ask for feedback which they in turn can provide to others. Employees can ask for an in-person meeting at any time, and the conversations are focused on transparency, honesty and continuous improvement.  

            Sonia Boyle from HR said: “It requires a measure of trust and vulnerability. These characteristics won’t appear overnight and will require a commitment to change and personal development.” 
          img: placeholder_icon.svg
        -
          title: Scrum - Adobe Premiere
          text: |
            Adobe Premiere Pro is video editing software and competes with Apple Final Cut Pro and Avid’s MediaComposer.  Adobe adopted the Agile Scrum methodology to improve product quality, speed to market, responsiveness, and team engagement for this product. 
            
            They used Scrum to successfully coordinate the actions of a distributed Scrum Team within an environment composed of non-Scrum Teams.  Their first release using Scrum – Adobe Premiere Pro CS5 -showed a large improvement in product quality, market perception, improved the quality of the team work-life balance, and created a sustainable pace of development for team members. 
          img: placeholder_icon.svg
        -
          title: Kanban - Spotify
          text: |
            Spotify is a music streaming service with around 60 million listeners. They decided to use Kanban after struggling to implement their projects. 

            The Spotify operations team decided to make their Kanban board simple as it was important for them to not be overwhelmed with tasks. The team only used three sections of workflows - To Do, In Progress, and Complete. 

            They also used some additional cards like the “Defer” card ( a task needs more time for completion), and “Blocked” cards to keep track of the tasks that could not be worked on. 

            Spotify manages its workflow to have time for creativity rather than wasting it with other issues. Spotify make sure that the Kanban boards are  accessible for all employees, and that they can add new tasks to them. 
          img: placeholder_icon.svg
        -
          title: Waterfall - Product Labs
          text: |
            SovTech who develop custom software uses Agile development as an overall model, however, one of their business units - Product Labs decided to use the Waterfall model in addition to the Agile model. 

            Product Labs decided on the Waterfall model in addition to the company wide Agile approach as it had proven to add value to their partners by ensuring the freedom and opportunity for change, and because it promises a  deliverable within a fixed time period and budget. This is known as an Agile/Waterfall hybrid approach.  They found that this approach accounted for risk management, product speed to market, and gave the flexibility needed for new solutions and improvements from a dedicated development team. 

            SovTech says: “Once a decision to utilise an Agile, Waterfall or Hybrid development methodology has been made, the process can be refined to best fit the project goals. Delivering a solid and maintainable product that satisfies the customer is what really counts.” 
          img: placeholder_icon.svg

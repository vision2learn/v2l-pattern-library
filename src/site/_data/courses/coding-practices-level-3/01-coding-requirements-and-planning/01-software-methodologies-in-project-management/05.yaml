title: Similarities and differences
intro: |
  On this page we are going to look at the similarities and differences, strengths and weaknesses, and finish with an example for each of the four methodologies.
banner: placeholder.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to describe the similarities and differences between:
      * Agile
      * Scrum 
      * Kanban 
      * Waterfall 
  -
  -
    title: Similarities and differences
    theme: t-bg-primary
    copy: |
      There are many similarities and differences with the four methodologies.  For example, Scrum is a 'framework' of the Agile methodology so there will be many similarities between these two; however, as Agile was created to overcome the limitations and restrictions of the Waterfall methodology, there will be many differences between the Waterfall methodology and the other three.  Please see the below table. 
    subInc: 
      type: accordion
      content:
        - 
          title: Similarities and differences table
          copy: |
            |  | Agile | Scrum | Kanban | Waterfall |
            |------|------|------|------|------|
            | Flexible and Adaptive| yes | yes | yes | no | 
            | Structured and fixed plan | no | no | no | yes | 
            | Sequential and dependencies | no | no | no | yes |  
            | Easy to use and learn | no | no | yes | yes | 
            | Low costs | no | yes | yes | no | 
            | Visual | no | maybe | yes | no | 
            | Collaborative | yes | yes | no | no | 
            | Self-organised team | yes | yes | yes | no | 
            | Managed teams | no | no | no | yes | 
            | Lean | no | yes | yes | no | 
            | Iterative process | yes | yes | no | no | 
            | Deliver quality products efficiently| yes | yes | yes | no | 
            | Strong supporting documentation | no | no | no | yes | 
            | Frequent stakeholder / customer involvement | yes | yes | maybe | no | 
            | One project at a time | no | no | no | yes | 
            | Less training needed | no | no | yes | yes | 
            | Wider business support needed | yes | yes | no | no | 
            | Advanced requirements | no | maybe | no | yes | 
  -
  -
    title: Quick quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Agile, Scrum and Kanban methodologies are adaptive and flexible.
          answer: adaptive and flexible
        -
          sentence: Waterfall and Kanban are easy to use and learn, and very little training is needed.
          answer: easy to use and learn
        -
          sentence: Scrum and Kanban methodologies are lean, visual and have low costs.
          answer: have low costs
        -
          sentence: The Waterfall methodology is structured, fixed and inflexible.
          answer: fixed and inflexible
        -
          sentence: Agile and Scrum methodologies are collaborative and have an interative process.
          answer: interative process
        -
          sentence: The Waterfall methodology is sequential and has advanced requirements.
          answer: sequential
        -
          sentence: Agile, Scrum and Kanban methodologies have self-organised teams.
          answer: self-organised
        -
          sentence: Agile and Scrum (and possibly Kanban) methodologies have stakeholders and customer involvement.
          answer: stakeholders and customer
        -
          sentence: The Waterfall methodology only has one project at a time.
          answer: one project
        -
          sentence: The Waterfall methodology has managed teams and strong supporting documentation.
          answer: supporting documentation
        -
          sentence: Agile, Scrum, Kanban and Waterfall methodologies all deliver quality products in an efficient way.
          answer: deliver quality products
    theme: i-quiz

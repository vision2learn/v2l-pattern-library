  -
    title: How can team members reflect on progress and identify improvements?
    theme: t-bg-primary
    copy: |
      it's important for everyone to find ways to reflect. Reflective practice is a conscious effort to think about the work you've done and develop future plans. 
      Managers should set up a team reflection, post-mortem, or **retrospectives** at set goalposts to move the team forward. By giving the team a chance to provide their input, standardize work, and put changes in place, you enable them to do their best work and meet project objectives. Lets take a look at how this can be achieved.
    subInc: 
      type: accordion
      content:
        - 
          title: Sprint retrospective
          copy: |
            The purpose of the Sprint Retrospective is to plan ways to increase quality and effectiveness while a project is in progress.

            The Team inspects how the last Sprint went with regards to individuals, interactions, processes, tools, and their definition of done. Inspected elements often vary with the domain of work. Assumptions that led them astray are identified and their origins explored. The Scrum Team discusses what went well during the Sprint, what problems it encountered, and how those problems were (or were not) solved.

            The Scrum Team identifies the most helpful changes to improve its effectiveness. The most impactful improvements are addressed as soon as possible. They may even be added to the Sprint Backlog for the next Sprint.

          img: /images/svg/cp3/cp3_u1_s4_p2_accordion.svg
        - 
          title: Other methods 
          copy: |
            Retrospectives are an important part of Agile methodology but what if you aren't working in an Agile environment? There are various other ways that team members can reflect on progess such as end of project evaluations or 360-degree reviews. Whichever method is used it is important that the reflection is used to make improvements to the overall effectiveness of the team and individual. If you want to learn about other methods of reflection click on the links below.           

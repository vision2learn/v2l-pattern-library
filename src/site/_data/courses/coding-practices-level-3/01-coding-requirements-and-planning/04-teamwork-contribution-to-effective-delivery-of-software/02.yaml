  -
    title: Quick quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: There are five conflict styles that can be utilised to resolve conflicts. 
          answer: five
        -
          sentence: accommodating is about putting the needs of others before your own.
          answer: accommodating
        -
          sentence: Avoiding can be useful but can also cause more problems that it solves.
          answer: Avoiding
        -
          sentence: Compromise can be useful if there are critical time factors, or it is imperative that a solution is required immediately.
          answer: Compromise
        -
          sentence: Competing is a strategy that is only effective if there is a serious issue and can only be used by those in authority.
          answer: Competing
        -
          sentence: Collaboration can be the most useful style to use as it brings those that have differing opinions together to discuss the problem with an open mind encouraging them to focus on resolving the conflict.
          answer: Collaboration
    theme: i-quiz
  

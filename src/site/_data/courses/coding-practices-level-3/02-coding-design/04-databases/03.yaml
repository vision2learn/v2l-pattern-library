  -
    title: SQL CODE example
    theme:
    copy: |
      Now you have watched the video see below the same SQL code used to list the employees whose job title is _Senior Engineer_ from our database.

    subInc:
      type: code
      lang: sql
      highlight: 
      code: |
        SELECT
          `employees`.*
        FROM
          `titles`
        LEFT JOIN `employees` ON `titles`.`emp_no` = `employees`.`emp_no`
        WHERE
          `titles`.`title` = 'Senior Engineer';

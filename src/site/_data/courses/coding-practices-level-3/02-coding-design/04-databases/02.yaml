title: Key components
intro: |
  On this page we are going to look at database structure, key components, and what to consider with table relationships.
banner: cp3_u2_s4_p2_key_components.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to:
      * Describe the structure and key components of a database table
      * Explore the use of primary and foreign keys
  -
  -
    title: Key components and database structure
    theme: 
    copy: |
      **Entity** – An object or subject with attributes are stored in a database – in our example the entity is the employee table and it’s attributes are their names, data of birth and gender. 
      
      **Table** – A set of fields and records for one type of entity, most databases have more than one table 
      
      **Attribute** – A characteristic of an entity – in our example – first name, last name, gender etc but also a characteristic of a Field.  
      
      **Field** – a column within a database table with its own attributes so for example the field ‘date_of_birth’ would have an attribute of ‘Date’ as its data would need to be in the date format. 
      
      **Record** - The data within one entity in a database which would be recorded as a row within a table – this would contain the data for each ‘employee’  Sor for example a record for one employee – 10001, 02/09/1953, Georgi Facello, Male, 26/06/1986 

      ![](/images/svg/cp3/cp3_u2_s4_p2_image1.svg)

      **Unit of data** – This is each piece of data within each record eg. ‘Facello’ – this is also known at data elements. 
      
      **Data types** – this is set for each field so for example the ‘first name’ field would have a character data type as it needs to be text.  Common data types include integers (whole numbers), floating point numbers (decimal points also known as real numbers), characters, character strings, date, and Boolean (True or False)

      **Primary key** – is a unique id value for each record – this item is a unique identification that is assigned to each record which is normally done automatically and is only used once.  Even if the record is deleted the Primary key would not be reused. 

      **Data structure** – The structure of a database is also called a _schema_ this is where you would plan and design a database taking into consideration the data type, field size, validation, primary key, and the relationships between the tables.
  -
    title: Primary and Foreign keys
    theme: t-bg-primary
    copy: |
      **Primary key** – is a unique id value for each record – this item is a unique identification that is assigned to each new record.  This is normally done automatically which is known as auto-increment and each primary key is only used once.  Even if the record is deleted the Primary key would not be reused. 

      It is a column that cannot have NULL values and is specifically generated by the database.  

      **Foreign key** – is a key used in a relational database where there needs to be a link between two tables.  It is used when it needs to reference a field (column) in a different table and provides a link between data in two tables. This field is normally the primary key as it is unique. So in our example the primary key ‘emp_no’ from the ‘employees’ table is a foreign key in the ‘titles’ table.

      See below for the differences between the two:
    subInc: 
      type: accordion
      content:
        - 
          title: Differences
          copy: |
            In a relational database:

            | PRIMARY KEY | FOREIGN KEY |
            |------|------|
            | To ensure data in the specific column is unique |  It is a column that provides a link between data in two tables |
            | It uniquely identifies a record | Refers to the field in a table which is the primary key of another table |
            | Only one primary key is allowed in a table | More than one foreign key are allowed in a table | 
            | It is a combination of UNIQUE and Not Null constraints | It can contain duplicate values and a table | 
            | It does not allow NULL values | It can also contain NULL values |
            | Its value cannot be deleted from the parent table | Its value can be deleted from the child table |
            | It constraint can be implicitly defined on the temporary tables | It constraint cannot be defined on the local or global temporary tables |
  -
  -
    title: Database Schema
    theme: 
    copy: |
      ### Relationships 

      There are three types of relationships in a relational database: 
      
      **One-to-one** – a relationship between two tables where there is only one matching record (row) in the other table 
      
      **One-to-many** – a relationship between two tables where there is multiple matching records in one of the tables linked to one record in the parent table 
      
      **Many-to-many** – a relationship where there are multiple records in both tables – in this instance a look-up table would be used (also known as a junction table).  In our example the ‘dept_emp’ table is a look-up table. 

      Take a look at the below diagram which shows the relationships in our example database:


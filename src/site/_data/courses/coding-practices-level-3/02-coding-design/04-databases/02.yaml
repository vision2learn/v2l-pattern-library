  -
    title: Integrity
    theme: t-bg-primary
    copy: |
      The data within a database needs to be valid, accurate and consistent.  This is known as *database integrity*.  This is one of the reasons why the database needs to be planned and designed before the data is entered as it is difficult to change the database structure once data has been entered.  Scroll through the slides below to learn more about database integrity.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Database integrity checks
          text: |
            The two main checks that are done to make sure a database is accurate is verification and validation. 
            
            **Validation** – checks the correct *type of data* is entered – e.g. a data of birth is in the correct ‘date’ format. Validation fields would have validation rules to ensure the data entered follows the expected format.  Different validation checks could include length check, range check, spell check, duplicates, and lookup tables.
            
            **Verification** – checks the *data* is correct – e.g. the date of birth for an employee is correct  

            It is the *primary key* that enforces integrity constraints to the table.  No duplicates or NULL values are allowed. 
          img: cp3_u2_s4_p2_slide1.svg
        -
          title: Referential integrity
          text: |
            The accuracy and consistency of data within a *relationship* is known as referential integrity.  A relationship is when two or more tables are joined together as they have linked data. In our example the ‘employees’ table is linked to the ‘titles’ table.  For these relationships to work we need to ensure that the data on both sides of the relationship is unbroken.  Referential integrity is when a foreign key value in one table references a valid existing primary key in the parent table. So in our example referential integrity would ensure that the job title for an employee is correct as the primary key ‘emp_no’ in the ‘employees’ table is a foreign key in the ‘titles’ table. 
            
            Referential integrity would prevent adding a new record (row) to a related table if that record did not exist in the parent (primary) table, changing values or deleting records in a parent table that would result in orphaned records in the related table.  So for example if we deleted a record from the employee table, the same record in the titles table would be ‘orphaned record’ as in there would be no longer be a relationship with that record. 
          img: cp3_u2_s4_p2_slide2.svg
        -
          title: Constraints
          text: |
            **Key constraints** – the Primary key needs to be Unique, it should have less number of attributes, and NULL values are not allowed.
            
            **Entity integrity constraints** - no primary key can have a NULL value.
            
            **Referential integrity constraints** – is specified between a relationship between two tables to maintain the consistency of records, it is enforced through the foreign key, and the value of the foreign key can be either the Primary key from the parent table or can take a NULL value but cannot be empty. 
          img: cp3_u2_s4_p2_slide3.svg

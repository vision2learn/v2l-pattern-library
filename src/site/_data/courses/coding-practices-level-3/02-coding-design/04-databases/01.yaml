    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        Consider some information that you have which would benefited from being more organised. This could be a list of names and addresses or a simple 'to-do list'.  Create a table and organise your information so it is structured rather than 'unstructured' data. Use the text box to make some notes.

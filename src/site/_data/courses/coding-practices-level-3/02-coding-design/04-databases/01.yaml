  -
    title: Quick quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: A database is an organised structured collection of data which can be easily managed.
          answer: structured
        -
          sentence: Data that is unstructured is not organised and can be stored in a number of ways.  
          answer: unstructured
        -
          sentence: Media such as images, video, or audio would be categorised as unstructured data.
          answer: unstructured
        -
          sentence: Names and addresses data could be stored in a structured way in a table.
          answer: structured
    theme: i-quiz

title: Databases
intro: |
  There are many types of databases that are used today. A database is an organised structured collection of data which can be easily managed. In this session we are going to look at the main aspects that would need to be considered when working with databases. 
banner: cp3_u2_s4_p1_databases.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * What is meant by structured data and unstructured data
      * What is meant by databases
      * The structure and key components of a database table
      * The use of primary and foreign keys
      * Techniques for querying databases
      * The purpose of database indexing
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to:
      * Explain what is meant by structured and unstructured data
      * describe what is meant by databases

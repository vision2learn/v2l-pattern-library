  -
    title: Quick quiz
    copy: 
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Single Responsibility Principle – every class/method is responsible for one single separate part of the program.
          answer: Single Responsibility
        -
          sentence: Dependency Inversion Principle – abstraction should be used to decouple high-level and low-level modules from each other.  
          answer: Dependency Inversion
        -
          sentence: Interface Segregation Principle – no client should be forced to depend on methods they do not use. 
          answer: Interface Segregation
        -
          sentence: Open/Closed Principle – software entities should be open for extension, but closed for modification. 
          answer: Open/Closed
        -
          sentence: Liskov Substitution Principle – properties of one original class should be replaceable with objects built from classes adapted from the original without breaking the application. 
          answer: Liskov Substitution
    theme: i-quiz

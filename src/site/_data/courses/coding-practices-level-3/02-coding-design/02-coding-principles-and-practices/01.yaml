title: Coding principles and practices
intro: |
  In this session we will be taking a look at good coding practices and principles which are used by Software Development teams.  These will include KISS and SOLID that are widely used in the software industry today.
banner: cp3_u2_s2_p1_coding_principles_practices.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      * Good coding principles and practices
      * The importance of following good coding principles and practices
      * How processes and tools can be used to promote coding standards
  -
    title: Good coding principles and practices
    layout: media
    theme: t-bg-primary
    copy: | 
      There are many different coding principles that can be used by developers. They will help to decrease complexity and using them can significantly reduce development time and assist with ongoing maintenance.  

      Two of the main coding principles that are used in the industry today are:
      * **The KISS principle** – an acronym which stands for ‘Keep it Simple and Straightforward’  
      * **S O L I D** - is a mnemonic acronym used for the five design principles which are intended to make programs more understandable, flexible and maintainable.  

    img: /images/svg/cp3/cp3_u2_s2_p1_image.svg

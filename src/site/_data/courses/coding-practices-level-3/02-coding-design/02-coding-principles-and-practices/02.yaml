title: Importance and conclusions
intro: |
  On this page we will look deeper into good coding principles and practices to determine why it is important to follow them.
banner: cp3_u2_s2_p2_importance_conclusions.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to explain why it is important to follow good coding principles and practice.
  -
  -
    title: Importance of following good coding practices
    theme: t-bg-primary
    copy: |
      Scroll through the slides below to learn more about why it’s important to follow good coding principles and practices:

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Standardised code
          text: |
            Good quality standardised code is easy to edit and is highly readable. It allows others to edit and can be used across software platforms. It is less complex and takes less time to write. Code that is easier to understand becomes easier to change. The more simple the code is, the more flexible it will be which will make it easier to be adapted if there are future changes.   
            
            For example ‘keep your variable name simple and make sure it clearly describes the variable that it holds’ e.g. ‘Age’ - would relate to the KISS principle. 
          img: cp3_u2_s2_p2_slide1.svg
        -
          title: Reduced maintenance
          text: |
            Developing software is costly and spending time fixing bugs and errors adds to this. By using good coding principles and practices, maintenance is reduced and if security is breeched it’s easier to find and fix the vulnerability. With developers spending 45% of their time fixing bugs, a standardised approach is essential.   

            For example ‘writing only enough code to pass a unit test’ would relate to the SOLID principle ‘Single Responsibility’. 
          img: cp3_u2_s2_p2_slide2.svg
        -
          title: Improved workflow and communication
          text: |
            Workflow is improved and teams communicate better by understanding the standardised principles universally used within the company. Everyone is able to understand what everyone else is doing and this leads to better collaboration and less conflict.  
            
            The SOLID principles are useful for teams working together on a single project as they are designed to avoid well-known issues and make it easier to make changes to the code. As most businesses want to see a faster turnaround, this means in coding projects there is less need for peer corrections.  
          img: cp3_u2_s2_p2_slide3.svg

    title: The difference between submitting and performing a coding review
    theme: t-bg-primary
    copy: |
      Text
    
      Scroll through the slides below to learn more about ... 3.5

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Submitting a request for a coding review
          text: |
            Code is submitted for review as each section is completed, after automated checks have been performed and before it’s merged with the main branch. The coder should consider the reviewer’s time and split large files to allow for multiple short reviews.  Using the Agile process, the coder should initiate the review request, include information for what the code is for and allocate a team member or team members as reviewers.
          img: placeholder_icon.svg

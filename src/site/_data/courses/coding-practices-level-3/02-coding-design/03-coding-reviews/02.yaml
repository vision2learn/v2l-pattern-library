      type: on-the-web
      copy: |
          Please see the following website where you can learn more about the importance of carrying out reviews.

      links:
        The importance of coding reviews: https://www.3pillarglobal.com/insights/the-importance-of-code-reviews/
  -
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to distinguish the difference between submitting and performing a coding review.
  -
    title: The difference between submitting and performing a coding review
    theme: t-bg-primary
    copy: |
      So what is the difference between submitting and performing a coding review?

      Scroll through the slides below to learn about these differences.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Submitting a request for a coding review
          text: |
            Code is submitted for review as each section is completed, after automated checks have been performed and before it’s merged with the main branch. The coder should consider the reviewer’s time and split large files to allow for multiple short reviews.  Using the Agile process, the coder should initiate the review request, include information for what the code is for and allocate a team member or team members as reviewers.
          img: placeholder_icon.svg
        -
          title: Performing a coding review
          text: |
            When the reviewer receives notification of the review request they will begin the review. They should consider the functionality of the code and how sections fit into the project. The reviewer will need to know the coding guides being used and ensure that the coder has followed these whilst examining that the code is correct. 

            The reviewer should only comment on the code and not the coder themselves. They should advise any improvements that can be made and suggest where code can be simplified and structure can be strengthened. The reviewee can benefit from the critical evaluation and should look at this as a way to develop their knowledge and skills. 

          img: placeholder_icon.svg

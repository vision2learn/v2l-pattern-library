title: Importance of coding reviews
intro: |
  on this page you will learn about the importance of reviews and providing effective feedback.
banner: placeholder.jpg
sections:
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to:
      * Explain why it is important to undertake a coding review
      * Explain the importance of effective feedback in a coding review
  -
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      Lets take a look at the importance of coding reviews and the importance of feedback.
    video: cp3_u2_s3_p2_importance_coding_review.mp4
  -
    title: Quick quiz
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        Is the following statement true or false? "Code reviews can cause significant delays to project timelines":
          answers:
            True: false
            False: true
          feedback: Code reviews allow any problems or issues to be identified and rectified while still in the development stage which will save time.
       
        Select one option to complete the following sentence:"Peer reviews are a defining principle of __________ .":
          answers:
            Agile: true
            Lean: false
          feedback: Peer reviews are a defining principle of Agile, playing a critical role in creating consistency in the source code, and setting the stage for better ‘QA testing’ and smoother integration.
       
        Is the following statement true or false? "effective feedback demands change ":
          answers:
            True: false
            False: true
          feedback: Effective feedback asks questions instead of demanding changes. It gives guidance based on common rules, not just personal opinion and should always ‘add value’.
  -        
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
       Think of a time that you took part in a review. This could have been a project at work, school or college. What was the result of the review? What benefit did it have? How was feedback given on the findings of the review?

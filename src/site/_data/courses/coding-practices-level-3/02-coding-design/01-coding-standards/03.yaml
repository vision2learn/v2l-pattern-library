title: Processes and tools for coding standards
intro: |
  On this page we will look at the processes and tools that can be used in coding standards.
banner: cp3_u2_s1_p3_coding_standards_tools.jpg
sections:
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to explain the processes and tools that could be used to promote coding standards.
  -
  -
    title: Processes and tools for coding standards
    theme: t-bg-primary
    copy: |
      There are style guides, tools, reviews and automatic checks which can be used to help promote coding standards within a developer team.  These include:

    subInc: 
      type: reveal
      content:
        -
          title: Style guides and tools
          copy: |
            Rules and guidance for the coding requirements. Includes naming conventions, code format and storage of source files.
          img: cp3_u2_s1_p3_reveal1.svg
        -
          title: Code review
          copy: |
            Having other developers check your written code for consistency and to ensure that it’s meeting the agreed standards and style.
          img: cp3_u2_s1_p3_reveal2.svg
        -
          title: Static analysis
          copy: |
            Using automated tools the code is checked for vulnerabilities that could lead to security weaknesses.
          img: cp3_u2_s1_p3_reveal3.svg
  -
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      As we have already discussed coding standards are essential when working with a team, but how does this work in practice? Please see the following video to learn more.
    video: cp3_u2_s1_p3_coding_standards_processes_tools.mp4
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        Take a look at the following websites listed below which were featured in the video.  For each process and tool, explain how you think they would help to promote a coding standard using one of the aspects. So for example you could select _variables_ within the _airbnb style guide_ and explain how that particular standard would help a Developer Team.
  -
  -
    title: On the web
    theme: t-bg-secondary2 i-on-web
    include:
      type: on-the-web
      copy: |
        Please see here the following websites which were listed in the video:

      links:
        Airbnb style guide: https://github.com/airbnb/javascript
        Codeguide: https://codeguide.co
        ESlint: https://eslint.org/
        Prettier: https://prettier.io/
        Microsoft.NET official guide: https://docs.microsoft.com/en-us/previous-versions/dotnet/netframework-1.1/czefa0ke(v=vs.71)?redirectedfrom=MSDN
  -
  -
    title: Quick quiz
    copy: Optional item - only one quiz if used - this type or the one below
    subInc: 
      type: word-quiz
      content:
        -
          sentence: A code review which is also known as a peer review, is a form of software quality assurance. 
          answer: code review
        -
          sentence: A tool that is used to automatically check code for weaknesses that may cause issues later on is known as static analysis. 
          answer: static analysis
        -
          sentence: A static analysis finds potential quality issues in the code before the program is run.
          answer: static analysis
        -
          sentence: A code review is when one or more of the developer team would check each other’s source code in a given project.
          answer: code review
        -
          sentence: Typical elements of a code review would be to include which standards would be used, first passes, using a ticketing system and run tests.
          answer: code review
        -
          sentence: A code review would check any changes made and complete the review with an in-depth pass.
          answer: code review
        -
          sentence: A static analysis would be used to find and fix vulnerabilities, bugs, code errors, security risks, memory leaks, null pointers, and buffer overflow.
          answer: static analysis
        -
          sentence: A static analysis would be used to find any violations of the coding standard whilst the code is not being run.
          answer: static analysis
    theme: i-quiz

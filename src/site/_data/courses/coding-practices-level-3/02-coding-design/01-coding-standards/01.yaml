title: Welcome to Unit two
intro: |
    ### Coding design
    
    Welcome to the second unit of your Level 3 Certificate in Coding Practices.  This unit is all about understanding coding design. You will learn about the purpose and use of coding standards, good coding principles and practices, coding reviews, databases, and interface design.

banner: cp3_u2_s1_p1_intro.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit, you will cover the following criteria of your Level 3 Certificate in Coding Practices qualification.

      You will:

      1. Understand the use of coding standards
      2. Understand the purpose of good coding principles and practices
      3. Know about coding reviews
      4. Understand databases
      5. Understand the principles of interface design
      6. Understand the importance of building security by design into software at the development stage

      [View the complete set of learning outcomes for this unit.](/pdfs/v2l_cp3_learning_outcomes_u2.pdf)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about the:
      
      * Importance of coding standards
      * Consequences of not following coding standards
      * Processes and tools that could be used to promote coding standards
  -
    title: Case study
    layout: media
    theme: t-bg-primary1a i-case-study
    copy: |
      ### ACE Software Development Agency - Consequences

      Two months into the project, the lead developer, Malika, noticed that there were inconsistencies with two new developers' code. Tom’s variable declarations and variable names did not match with Dimitris's code. This caused delays at the review and testing stage of the project. Other developers also found Tom's code difficult to follow. 
      
      Upon further investigation Malika discovered that Tom is a Junior Developer and he starting a day later than Dimitris. Therefore, Tom missed the training on the agency's coding standards and he was unaware of the most up to date guides.

    img: /images/svg/cp3/cp3_u2_s1_p2_case_study_2.svg

  -
    title: Case study
    layout: media
    theme: t-bg-primary1a i-case-study
    copy: |
      ### ACE Software Development Agency - Consequences

      Two months into the project that both of the developers were assigned to, Malika the lead developer noticed that there were inconsistencies with Tom’s and the other developers' code who were also working on the same project.  Tom’s variable declarations and variable names did not match the other developers’ code. 
      
      This caused delays at the review and testing stage of the project.  The other developers’ also found his code difficult to follow.  
      
      Upon further investigation Malika realised that on their first day unfortunately she hadn’t been told that Tom was going to be starting a day later, and that he was a junior developer, and it transpired that he never got shown (or told to use) the agency’s most up to date coding standard guides.  

    img: /images/svg/cp3/cp3_u2_s1_p2_case_study_2.svg

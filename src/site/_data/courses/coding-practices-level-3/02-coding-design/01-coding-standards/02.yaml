  -
    title: Case study
    layout: media
    theme: t-bg-primary1a i-case-study
    copy: |
      ### ACE Software Development Agency

      The ACE Software Development Agency has decided to increase it’s team and employ two new Developers. The first day's training includes an introduction to the agency’s Coding Standards guide. Malika, the lead developer, had just completed updating the guide that morning and only had a PDF version ready for the training, which included several sections for the agency's practice for variable names, such as:
      * A variable name should describe what its purpose is
      * Remember that ease of reading is more important than speed of writing 
      * Minimise the overthinking with small decisions from following consistent standards. 

      ACE Coding Standard guide for Variable example:
      
      - use _const_  or  _let_  to declare variables.  
      Not doing so will result in global variables. We want to avoid polluting the global namespace. 
      e.g. 
      const variableName = new VariableName(); 

    img: /images/svg/cp3/cp3_u2_s1_p2_case_study_1.svg

title: Understand the use of coding standards
intro: |
  In this session we will cover the importance of coding standards and the consequences of not following them.  We will also look at processes and tools that are used.
banner: cp3_u2_s1_p2_understand_coding_standards.jpg
sections:
  -
    title: Coding standards
    layout: media
    theme: t-bg-primary
    copy: |
      ### What are coding standards and the importance of them.

      Coding standards are agreed guides for best practice that the team of developers have decided to follow for a given project.  They include rules, best practice and guidelines and help to maintain consistency for coding.  

      Coding standards are important as they help your code be easier to:
      * **Read** – by allowing others to understand your code  
      * **Understand** – everyone following the coding standards will understand the same practices in use  
      * **Maintain** – It will be easier to fix bugs and reduce development time 

    img: /images/svg/cp3/cp3_u2_s1_p2_image1.svg

    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to explain the methods that can be used to secure software.
  -
  -
    title: Methods to keep software secure.
    theme: t-bg-primary
    copy: |
      So how can you protect systems from the attacks that we have looked at so far? As the complexity and sophistication of attacks develop, methods to secure systems and software are constantly developing and improving. Let’s take a quick look at some of these methods.
    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Encode and Escape data
          text: |
            These are both techniques that are designed to stop injection attacks. Encoding is transforming data from one format into another format. 
            
            This involves translating special characters into some different but equivalent character that cannot be recognised by the attacking software, which will present no danger to the target interpreter. For example translating the < character into the &lt; string when writing to an HTML page. 
           
            Escaping is a subset of encoding, where not all characters need to be encoded. Only some characters are encoded (by using an escape character).

          img: cp3_u2_s6_p2_slide6.svg
        -  
          title: Input validation
          text: |
            Input validation is a powerful tool that is used to ensure that the data entered by a user is acceptable. For example, if a program were to ask for a score between 0 and 50, an input validation would be used to ensure that values below 0 and above 50 were rejected.
          img: cp3_u2_s6_p2_slide7.svg
        -
          title: HTTPS
          text: |
            Hypertext transfer protocol (HTTP) is the protocol that is used to send data from a web browser to a website. Hypertext Transfer Protocol Secure (HTTPS) is a secure version that enables visitors to the website to transmit sensitive data such as banking or payment details and login credentials securely over the internet.
          img: cp3_u2_s6_p2_slide8.svg
        -
          title: Passwords
          text: |
            Poor password security is one of the most common and easiest ways that attackers gain access to a system. More sophisticated and secure methods to access sites and systems are becoming more common and features such as multi factor authentication and the ability for auto generated complex passwords can greatly increase system and software security.
          img: cp3_u2_s6_p2_slide9.svg
        -
          title: Error handling
          text: |
            Understanding error messages is an important part of application development and troubleshooting. Error messages provide valuable information to the developer when something goes wrong, allowing them to fix problems with their application. Unfortunately, when errors are not handled in a secure manner, they can expose sensitive information. For example, an error message that includes information on the structure of a SQL database table may give attackers everything they need to know in order to carry out a successful SQL injection attack.
          img: cp3_u2_s6_p2_slide10.svg

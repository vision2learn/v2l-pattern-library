  -
    title: Quick quiz
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        Is the following statement true or false? "HTTP indicates that it is safe to transfer sensitive information.":
          answers:
            True: false
            False: true
          feedback: Only when a website is showing HTTPS can you be confident that the website is secure to transfer sensitive information.
        Select one option to complete the following sentence:"Social engineering is carried out by targeting __________ to carry out malicious activities.":
          answers:
            Systems: False
            Individuals: true 
            Software: false 
        Is the following statement true or false? "SQL injection flaws are introduced during the software testing stage.":
          answers:
            True: false
            False: true
          feedback: SQL injection flaws are introduced during the software development stage.

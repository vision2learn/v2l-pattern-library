    copy: |
      ### Security by design

      Lets take a look at software development and security by design in more detail.
    video: cp3_u2_s6_p1_security_by_design.mp4
  -
  -
    title:  SSDLC v’s SDLC
    theme: t-bg-primary
    copy: |
      In recent years software developers have had to consider software security rather than just focusing on delivering functional software in the agreed timeframe. Previously there wasn’t a great deal of emphasis on security, so checks for flaws in the software were only carried out at the testing stage of the SDLC.  This had the potential to cause serious issues relating to the timely deployment of the software. What was needed was a way to incorporate a security element within the SDLC. 
      
      Let’s look at an example of a secure software development life cycle for a team creating a membership renewal portal:

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Stage 1:Requirements 
          text: |
            In this early phase, requirements for new features are collected from various stakeholders. It’s important to identify any security considerations for functional requirements being gathered for the new release.

            *	__Sample functional requirement:__ user needs the ability to verify their contact information before they are able to renew their membership. 
            *	__Sample security consideration:__ users should be able to see only their own contact information and no one else’s.

          img: cp3_u2_s6_p1_slide1.svg
        -
          title: Stage 2:Design 
          text: |
           This phase translates in-scope requirements into a plan of what this should look like in the actual application. Here, functional requirements typically describe what should happen, while security requirements usually focus on what shouldn’t.
           * __Sample functional design:__ page should retrieve the user’s name, email, phone, and address from CUSTOMER_INFO table in the database and display it on screen.
           * __Sample security concern:__ we must verify that the user has a valid session token before retrieving information from the database. If absent, the user should be redirected to the login page.
          img: cp3_u2_s6_p1_slide2.svg
        -
          title: Stage 3:Development
          text: |
            When it’s time to actually implement the design and make it a reality, concerns usually shift to making sure the code is well-written from the security perspective. As the vast majority of modern applications aren’t written from scratch, modern application developers can’t be concerned only with the code they write. Instead, developers rely on existing functionality, usually provided by free open source components to deliver new features.  These  therefore give value to the organisation as quickly as possible.
            Secure coding guidelines, in this case, may include:
            * Using parameterised, read-only SQL queries to read data from the database and minimize chances that anyone can ever commandeer these queries for malicious purposes
            * Validating user inputs before processing data contained in them
            * Sanitising any data that’s being sent back out to the user from the database
            * Checking open source libraries for vulnerabilities before using them
            
          img: cp3_u2_s6_p1_slide3.svg
        -
          title: Stage 4:Testing
          text: |
            This stage is where applications go through a thorough testing cycle to ensure they meet the original design & requirements. This is also a great place to introduce automated security testing using a variety of technologies. The application is not deployed unless these tests pass. This phase often includes automated tools like CI/CD pipelines to control verification and release.
            * Automated tests that express the critical paths of your application
            * Automated execution of application unit tests that verify the correctness of the underlying application
            * Automated deployment tools that dynamically swap in application secrets to be used in a production environment
          img: cp3_u2_s6_p1_slide4.svg
        -
          title: Stage 5:Deployment and Evolution
          text: |
            The story doesn’t end once the application is released. In fact, vulnerabilities that slipped through the cracks may be found in the application long after it’s been released. These vulnerabilities may be in the code developers wrote, but are increasingly found in the underlying open-source components that comprise an application. This leads to an increase in the number of “zero-days”—previously unknown vulnerabilities that are discovered in production by the application’s maintainers.

            These vulnerabilities then need to be patched by the development team, a process that may in some cases require significant rewrites of application functionality. Vulnerabilities at this stage may also come from other sources, such as external penetration tests conducted by ethical hackers or submissions from the public through what’s known as “bug bounty” programs. Addressing these types of production issues must be planned for and accommodated in future releases.
          img: cp3_u2_s6_p1_slide5.svg
  -       
    title: Quick quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Unless security has been considered during the SDLC, the organisation will be left to take a reactive approach.
          answer: reactive
        -
          sentence: Companies should always do a risk analysis beforehand to assess where the potential problems might lie and what the consequences might be if security is not considered from the beginning of the SDLC.
          answer: risk analysis
        -
          sentence: It is always important that structure data can be validated or else it should be transformed, or it needs to be rendered carefully.
          answer: validated 
        -
          sentence: Unauthorised access may mean that the system has been modified or had its data destroyed, meaning that if a backup is not available all that data may be lost.
          answer: backup
        -
          sentence: If validation and transformation are not possible rendering information in a disposable environment not linked to the system is the best option.
          answer: disposable
        -
          sentence: The complexity of malicious code in documents means that it is safer to transform the file or content into another format. 
          answer: transform
          
    theme: i-quiz

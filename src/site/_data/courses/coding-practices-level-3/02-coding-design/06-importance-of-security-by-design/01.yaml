  -
    title: What is security by design? CYBER 3 PAGE
    theme: t-bg-primary
    copy: |
      Security by design is an approach to cybersecurity that focuses on preventing a breach rather than just responding to one after the event! It enables an organisation to automate its data security by formalising the design of its infrastructure by building security into the IT system and subsequently the management processes. The security is in place from the beginning of a project so therefore is more likely to reduce the chance of flaws that may compromise an organisations information security.

      So let’s take a look at the principles of security by design as set out by the NCSC ( National Cyber Security Centre).

      Select the images below to read 

    subInc: 
      type: reveal
      content:
        -
          title: Establish the context before designing a system
          copy: |
            Before creating a secure system there needs to be an understanding of what the system is for and address any short comings or issues.
          img: cs3_u1_s3_p1_reveal1.svg
        -
          title: Make compromise difficult
          copy: |
            Designing a system with security in mind means applying concepts that make it harder for any attackers to compromise data or systems.
          img: cs3_u1_s3_p1_reveal2.svg
        -
          title: Reduce the attack surface
          copy: |
            This refers to reducing the number of places where hackers can get in. You can take a number of steps to do this.
          img: cs3_u1_s3_p1_reveal3.svg
        -
          title: Make Disruption Difficult
          copy: |
            Having standby systems can help by always making sure high value or critical services can be relied on.
          img: cs3_u1_s3_p1_reveal4.svg
        -
          title: Make compromise detection easier
          copy: |
            Even when all precautions are taken systems can still become compromised. By having the right security systems in place this can be prepared for and spotted before any damage takes place.
          img: cs3_u1_s3_p1_reveal5.svg  
        -
          title: Reduce the impact of compromise
          copy: |
            By designing a system which is more segmented or zoned this can help minimise the severity of a compromise.
          img: cs3_u1_s3_p1_reveal6.svg  

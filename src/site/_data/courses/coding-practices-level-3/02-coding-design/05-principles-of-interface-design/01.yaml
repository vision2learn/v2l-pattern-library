    title: Wide image OR Interactivity (Infographic)
    theme: 
    copy: |
      
      _more content to be included here_

      UX is the combination of the user’s attitude and emotions while using your product, service, application, or system.

      UI deals with the interaction of your consumer to your service, system, or application. 
      
      ![](/images/banners/placeholder.jpg)
  -
  -
    title: Quick quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: A user-friendly experience would be in the category of UI.
          answer: UI
        -
          sentence: Prototyping to test for quality results would be in the category of UX.
          answer: UX
        -
          sentence: Human-computer interaction would be in the category of UI.
          answer: UI
        -
          sentence: Visual elements and graphical control would be in the category of UI.
          answer: UI
        -
          sentence: User testing would be in the category of UX.
          answer: UX
        -
          sentence: Usability and ease of use would be in the category of UX.
          answer: UX
    theme: i-quiz

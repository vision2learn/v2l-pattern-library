title: Principles of interface design
intro: |
  The principles of interface design involve many considerations.  UX and UI designers would need to consider not only the design of the product but also the experience of the user.  This session will help you to understand user experience design, user interface design, information architecture, and creative problem solving.
banner: cp3_u2_s5_p1_interface_design3.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about the:
      * Elements of UX (User Experience) design
      * Differences between UX and UI (User Interface)
      * Key skills required for creative problem-solving
      * Key methods and techniques used in creative problem-solving 
      * Importance of information architecture and UX
      * Principles of good user interface design
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to identify the elements of UX (User Experience) design.
  -
  -
    title: The elements of User Experience (UX) design
    theme: 
    copy: |
      The goal of a User experience (UX) project is to make sure that the end user has a positive experience with a product. To enable this to happen, the 5 elements of UX design acts as a guide for UX designers as it provides structure and direction to their decision making for any given project. 

      They were created by a UX designer called Jesse James Garrett. In the below Read item you can see the original diagram from his book which was published in 2000.

      As can be seen in the diagram below the 5 elements of UX are on 5 separate planes. Each one is positioned on top of the previous one to create an outline of the full process from the bottom to the top.

      ![](/images/svg/cp3/cp3_u2_s5_p1_ux_wideimage.svg)
  -
  -
    title: The five elements of UX design
    theme: t-bg-primary
    copy: |
      Scroll through the slides below to learn more about the five elements of UX design.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Strategy
          text: |
            Strategy is the bottom plane of the model.  This is the most abstract and has the least constraints.  It is where the decisions are made to determine the objectives of the project and how they should be met with the design. The objectives would include the goals of the clients and stakeholders, and they would decide at this stage why the site is needed, how it will be used, and who will be using it.
          img: cp3_u2_s5_p1_slide1.svg
        -
          title: Scope
          text: |
            The scope of the product can be determined once the strategy has been decided.  It is on this plane that the product features, content, and functionality are decided upon. It will include the requirements for the functions and features in the product and how they would work together.  Every single feature and list of content requirements of the product would be included at this stage. The requirements would be aligned with the project’s strategy. 
          img: cp3_u2_s5_p1_slide2.svg
        -
          title: Structure
          text: |
            The structure of the product can be worked on once the scope has been outlined.  This is where information architecture (IA) and  interaction design would be considered. IA is the practice of deciding how to arrange the parts of the product (structure) so it can be understood. Interaction design is how users will interact with the site and how the system will respond. This would include deciding each element of navigation.
          img: cp3_u2_s5_p1_slide3.svg
        -
          title: Skeleton
          text: |
            Once the structure has been defined the skeleton of the site (also known as a wireframe) can be designed. It would be decided where the navigation and functional elements (which were determined from the previous plane) would be placed for each product page.  Wireframes and prototypes would be created at this stage to arrange each part of the product e.g. buttons, images, text etc.  Interface design (ID), Navigation design, and Information design would be considered on this plane.  
          img: cp3_u2_s5_p1_slide4.svg
        -
          title: Surface
          text: |
            The wireframes and prototype that was created on the Skeleton plane would be used on the final Surface plane.  The Surface plane is the top and most concrete plan and this is where the final pages for the product are created. Users’ sensory experience is considered at this stage and would include how colour and textures within the visual design would help them to navigate and interact with the site.  
          img: cp3_u2_s5_p1_slide5.svg
  -
  -
    title: Read 
    theme: t-bg-primary2 i-read
    copy: | 
      Take a look at the following document to see the original 5 elements diagram from the UX designer Jesse James Garrett which was published in 2000.

      [Jesse James Garrett - 5 elements design](/pdfs/cp3_u2_s5_p1_jesse_james_garrett_five_elements.pdf).
  -
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        Take a look at a site (website or App) that you are familiar with and see if you can identify each of the five planes within that site.
  -
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to describe the differences between UX and UI (User Interface).
  -
  -
    title: User experience and User interface
    theme: 
    copy: |
      UI and UX design are different, but are also related design disciplines. A user interface is where a ‘human would interact with a machine’.  User experience is the experience a person has when they interact with a product. UX design is more analytical and would consider cognitive behaviour and human psychology.

      ![](/images/svg/cp3/cp3_u2_s5_p1_image2.svg)
  -
  -
    title: Differences between UI and UX
    theme: 
    copy: |
      See below to see the differences between UI and UX:
    subInc: 
      type: accordion
      content:
        - 
          title: User experience (UX)
          copy: |
            UX is the experience a user would have when interacting with a product, service, application, or system. It would consider the user’s attitude and emotions when designing products that are easy to use and understand.

            UX focuses on:
            * Customer Research
            * User Testing
            * Development
            * Content
            * Usability
            * Ease of use
            * Pleasure
            * Prototyping to test for quality results
        - 
          title: User interface (UI)
          copy: |
            UI deals with the interaction of the individual to a service, system, or application. It will allow a user to operate a device such as a computer, tablet or phone to complete a task or achieve a specific goal (e.g. use an online website to purchase an item).   

            The three main forms of user interfaces are:
            * graphic user interface (GUI),
            * command line interface,
            * or a voice-enabled user interface.  

            They are composed of input hardware (e.g. a mouse or keyboard), and output hardware such as a monitor or audio speakers. 

            UI focuses on: 
            * User-friendly experience
            * Human-computer interaction
            * Graphical controls
            * Layout
            * Design 
            * Branding 
            * Visual elements
  -
    title: Quick quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: A user-friendly experience would be in the category of UI.
          answer: UI
        -
          sentence: Prototyping to test for quality results would be in the category of UX.
          answer: UX
        -
          sentence: Human-computer interaction would be in the category of UI.
          answer: UI
        -
          sentence: Visual elements and graphical control would be in the category of UI.
          answer: UI
        -
          sentence: User testing would be in the category of UX.
          answer: UX
        -
          sentence: Usability and ease of use would be in the category of UX.
          answer: UX
    theme: i-quiz

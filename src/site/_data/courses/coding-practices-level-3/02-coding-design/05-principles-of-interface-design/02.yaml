title: Creative problem-solving
intro: |
  On this page you will learn about creative problem-solving and the key methods and techiniques used in creative problem-solving.
banner: cp3_u2_s5_p2_creative_problem.jpg
sections:
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to:
      * Explain the key skills required for creative problem-solving
      * Describe the key methods and techniques used in creative problem-solving
  -
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      Please see the following video on creative problem solving and the methods and techniques that would be used.
    video: cp3_u2_s5_p2_ux_creative_problem_solving.mp4
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        Think of a problem or issue that you wish to find a solution for. Make some notes on which methods and techniques you feel would help you to resolve the problem.
  -
  -
    title: On the web
    theme: t-bg-secondary2 i-on-web
    include:
      type: on-the-web
      copy: |
        Please see the following website where you can learn more about creative problem solving.

      links:
        Creative problem solving for UX designers: https://www.webdesignerdepot.com/2021/11/creative-problem-solving-for-ux-designers/
        Developing problems solving skills in design: https://uxdesign.cc/develop-your-problem-solving-skills-in-design-48ec6b47ed75
        Solving the right problem: https://uxmag.com/articles/solving-the-right-problem
  -
  -
    title: Quick quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Possibly the most important skill in creative problem solving is to be open minded.
          answer: open minded
        -
          sentence: You would need to think outside of the box as the most obvious reason for something is not always the solution.
          answer: think outside of the box
        -
          sentence: A creative thinker needs to use a range of different soft skills such as communication, intutitive and innovative thinking.
          answer: different soft skills
        -
          sentence: There are key methods and techniques that can be considered as a framework which help to ensure all the elements of an issue are considered. 
          answer: key methods and techniques
    theme: i-quiz

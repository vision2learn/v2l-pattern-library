  -
    title: Quick quiz
    copy: See if you can identify each of the UI design principles
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Clarity – All UI element need to be clear for users to interpretate correctly.  
          answer: Clarity
        -
          sentence: Consistency – The UI design needs to be uniform such as the branding colours and typography. 
          answer: Consistency
        -
          sentence: Tolerance – Users needs to be forgiven of their mistakes that they make especially when first using the interface. 
          answer: Tolerance
        -
          sentence: Efficiency – The interface should plan for minimal input and provide shortcuts for experienced users so they can be more productive. 
          answer: Efficiency
        -
          sentence: Ease of use – The interface needs to be intuitive and minimises confusion such as using simple navigation.
          answer: Ease of use
        -
          sentence: Comfort - The UI should allow for previous experiences of the users, use simple language and include inclusivity. 
          answer: Comfort
        -
          sentence: Accessibility – UI design needs to take motor, cognitive, hearing, or visual impairments into consideration.
          answer: Accessibility
    theme: i-quiz

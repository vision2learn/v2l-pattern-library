title: Information architecture and interface design
intro: |
  On this page you will learn about the importance of information architecture and UX, and the principles of good user interface design (UI).
banner: cp3_u2_s5_p3_information_architecture2.jpg
sections:
  -
    title: Summary
    theme: t-bg-primary1a i-summary
    copy: |
      “Information architecture is the practice of deciding how to arrange the parts of something to be understandable.”  

      — The Information Architecture Institute 
  -

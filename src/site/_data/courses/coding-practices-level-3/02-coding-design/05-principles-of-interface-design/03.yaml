  -
  -
    title: Importance of information architecture and UX
    theme: t-bg-primary
    copy: |
      Information architecture (IA) and User experience (UX) are part of a wider design field called Human computer interaction (HCI). HCI concentrates on the interface (user interaction) between people (humans) and computers. It would include many different specialties including technology, psychology, ergonomics, and human factors. Fundamentally, HCI makes interactions more human. 

      Good IA helps users to navigate through the piles of data and information that is available today in our modern digital world. Good IA is critical as it provides us with a logical way to organise and navigate through the vast amount of data. The key factor to consider in IA is the user; to understand how they think, what problems they are trying to solve, and presenting information in a logical way to support this.  A good site should be visually appealing with logical navigation and intuitive to use. 

      Scroll through the slides below to see reasons why good IA is important:

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: User focused
          text: |
            Good IA will help to keep the user focussed and less likely to be distracted on what they are trying to achieve if the task they are looking at is easy to follow.
          img: cp3_u2_s5_p3_slide1.svg
        -
          title: Cognitive load and process speed
          text: |
            It reduces cognitive load as a simple well-laid out page with clear navigation will help the user to focus, make choices, and speed up the process. Too much information and too many options will likely deter the user from making any choices at all.
          img: cp3_u2_s5_p3_slide2.svg
        -
          title: Context addition
          text: |
            It will make it easier to understand and analyse information as a visual navigation path will provide more context for the content that the user is viewing.  So if the user can see the ‘bigger picture’ of where they are within a process, then the user is more likely to more comfortable with the task they are doing. 
          img: cp3_u2_s5_p3_slide3.svg
        -
          title: Duplication of information
          text: |
            Good IA would ensure that similar or the same content is not duplicated.  This is a risk with websites which have a lot of information so understanding and documenting the content structure would prevent this issue.
          img: cp3_u2_s5_p3_slide4.svg
        -
          title: Support needs
          text: |
            It would reduce frustration for the user and would mean that there would be less support needed. This would also mean reduced cost of support to a business as they would have reduced requirements to provide support if a user does not have any issues in finding what they need.
          img: cp3_u2_s5_p3_slide5.svg
        -
          title: Less bounce time
          text: |
            It would keep customers on a website for longer which would equal ‘less bounce time’ and support the business.  Research has shown that the average time of visitors to a website is 10-20 seconds.
          img: cp3_u2_s5_p3_slide6.svg
        -
          title: Create new customers
          text: |
            It could create new customers and reduce the risk of a customer going to a competitor website.  This would also lead to better return on investment (ROI). 
          img: cp3_u2_s5_p3_slide7.svg

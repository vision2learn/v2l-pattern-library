      ### Practice task
      
      Have a go at writing out the above example coding solutions on the following online compiler practice website.

      [Python Online Compiler](https://replit.com/languages/python3)

      [C# Compiler](https://replit.com/languages/csharp)


      ## Assessment task

      In your assessment you will be required to show evidence that you have implemented two coding solutions. Using your own IDE or an online service, write out two coding solutions using the Interpreted language Python, and the Compiled code language C#.  You can use the above code examples or come up with your own.

      To complete the task, you will need to upload your 'compiled' file and your python code file with your assessment:
      * .exe file for the Compiled solution and
      * .py file for the Interpreted solution.
      
      You can either do this with your own systems and software as demonstrated in the video, or you can use an online service called _Replit_.  
      
      Sign up for a free version of _Replit_, create the same two examples (or create your own) and download your python and C# files to include in your submission to your Tutor. (Within Replit to download your files you would click the 3 dots above the file list.)

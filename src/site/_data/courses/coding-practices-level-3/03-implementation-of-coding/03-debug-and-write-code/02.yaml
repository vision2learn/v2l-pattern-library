    title: Differences between compile and interpreted languages
    theme: t-bg-supporting3
    copy: |
      One of the main differences between a compiled and interpreted language is that one would need to be ‘compiled’ into an independent file (.exe) before it can be executed (run); and the other would need an intermediate program called an 'interpreter' as the code would need to be translated line-by-line so the program could run.

      See below to learn more:
    subInc: 
      type: accordion
      content:
        - 
          title: Compiled code
          copy: |
            To work on a system a program written in compiled language would need to be ‘compiled’ into an executable file.

            __Testing:__ With compiled code, testing can take longer, as this must be done every time a change is made which requires a new test. 

            __Speed:__ Compiled code can run faster as the conversion to machine code is done during the process of generating an executable file.  

            __Debugging:__ The compiler will run a check for syntax on the original source code. If there are errors, it will flag a message and it will not be able to compile; but if there are no syntax errors, it continues compiling the program.  
            
          img: /images/svg/cp3/cp3_u3_s3_p2_accordion1.svg
        - 
          title: Interpreted code
          copy: |
            With interpreted code the program is written in the source language. When the program is executed, the original source code is run line by line through a separate program called an interpreter in real time code. As it runs, the interpreter “translates” the source code into actions which are then executable line by line. 
            
            __Testing:__ Interpreted code can be easy to debug, as the code can be run whilst it is being written.

            __Speed:__ Larger programs written in interpreted code could run slower as it needs to be ran in 'real time' line-by-line.

            __Debugging:__ When the code is run, the interpreter runs the program line by line, checking for syntax errors, then performing the operations directly. If an error is encountered on any line, the operation of the program will halt in the state that it is in when the error occurs, unless instructions on how to deal with the error are written in. 
            
          img: /images/svg/cp3/cp3_u3_s3_p2_accordion2.svg     

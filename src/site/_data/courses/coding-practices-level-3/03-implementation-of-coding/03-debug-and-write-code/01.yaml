    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to identify issues that can occur cross-platform.
  -
  -
    title: Cross-platform issues
    theme: t-bg-primary
    copy: |
      Most software nowadays is designed to work across different computing platforms such as smartphones, servers, tablets, desktop, and laptop computers using the operating systems Mac OS and Microsoft Windows.  Some software require separate builds for each platform but most will output a file that will work on both platforms. 

      Developing code that needs to be compatible on different platform could have cross-platform issue such as: 

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: UI / UX considerations
          text: |
            User interface (UI) and User experience (UX) are big considerations if the program needs to work across different platforms so there is a consistency with the design and user interaction.  This would include the program resizing correctly with correct placement of items, and the inputs and interactions such as touchscreen controls and or physical buttons which could be used on the different devices.
          img: placeholder_icon.svg
        -
          title: Asset availability
          text: |
            If there are shared assets that sit outside of the program such as typefaces, then this would be considered.  For example, there are fonts that are available on one operating system but not another.
          img: placeholder_icon.svg
        -
          title: Storage
          text: |
            Storage is a consideration if the program needs to run across different devices as smaller devices, such as a smartphone, has less storage so if the program is large this could cause issues and slow it down.   Data storage is another consideration as issues could occur if the program is using a cloud-based storage and there is no internet. 
          img: placeholder_icon.svg
        -
          title: Security and compliance
          text: |
            Vulnerabilities and potential security issues could occur with the program if it is not kept up to date with the operating systems which would have regular security updates.  Compliance is another consideration if the program is to be used throughout the world as different regions have different laws and regulations for data handling. 
          img: placeholder_icon.svg
        -
          title: Interpreted code
          text: |
            Interpreted code can essentially be run on any operating system or CPU, providing that there is an interpreter for that system. This means that the programs themselves can be much more “portable”, but that they may take longer to run that compiled programs as they are translated as they are run. 
          img: placeholder_icon.svg
        -
          title: Compile code
          text: |
            Compilers must convert source code to a binary, which runs on the specific operating system that they are being compiled for. Compiled programs are therefore not cross-platform, meaning that they cannot be run directly from the source code on incompatible operating systems/CPUs. However, it is possible to generate binaries from the source code which run on different systems using the appropriate compiler.
          img: placeholder_icon.svg
  -
  -
    title: Quick quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: If a program needs to use a cloud-based resource then data storage would need to be a cross-platform consideration. 
          answer: data storage
        -
          sentence: If there are shared items that sit outside of the program then asset availability would need to be a cross-platform consideration.  
          answer: asset availability
        -
          sentence: A consistency with the design and user interaction of a program would be a UI and UX cross-platform consideration.
          answer: UI and UX
        -
          sentence: Cross-platform security considerations would be needed as operating systems release new updates on a regular basis.
          answer: security
    theme: i-quiz

    title: Getting started with compiled and interpreted code
    theme: t-bg-supporting3
    copy: |
      See below to learn how to get started with the Python and C# languages.
    subInc: 
      type: accordion
      content:
        - 
          title: Compiled code - Python
          copy: |
            Download the latest version of Python and run the installer file. During the install process, choose the path where Python is installed. Once you finish the installation process, you can run Python in two ways: 

            __1. Run Python in Immediate mode__ - You can type  ‘python’ in the command line – this will invoke the interpreter in immediate mode. We can directly type in Python code, and press Enter to get the output. 

            __2. Run Python in the Integrated Development Environment (IDE)__ - You can use any text editing software to write a Python script file, make sure you save it with the .py extension.  Write your code in the file and save it, go to Run > Run Module or F5 to run, the debugging will occur whilst the file is being ran through the interpreter.

            ### Debugging
            
            The compiler will run a check for syntax on the original source code. If there are errors, it will flag a message and it will not be able to compile; but if there are no syntax errors, it continues compiling the program.
            
          img: /images/svg/placeholder_icon.svg
        - 
          title: Interpreted code - C#
          copy: |
            Install an IDE to edit and compile code such as Visual Studio – from the 'Workload' choose the .NET framework.

            On the start window choose ‘Create a new project’, select the 'install more tools and features' button to select ‘Console App’ from the list and name your project. 

            The IDE will generate some automatic code. Write your code, click 'Debug' to start debugging which will compile and execute your code.  If there are any errors, the compiler will stop and display a message in the ‘Terminal’ window. 
            
            ### Debugging

            Interpreted code can be easy to debug, as the code can be run whilst it is being written. When the code is run, the interpreter runs the program line by line, checking for syntax errors, then performing the operations directly. If an error is encountered on any line, the operation of the program will halt in the state that it is in when the error occurs, unless instructions on how to deal with the error are written in. 
            
          img: /images/svg/placeholder_icon.svg     

title: Debug and write code
intro: |
  In this session you will learn how to write and debug interpreted and compiled code.  You will also learn about the issues that could occur cross-platform, and the differences between the two types of code.
banner: placeholder.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn:
      * How to write and debug interpreted and compiled code
      * The differences between the coding solutions
      * Issues that could occur cross-platform
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to identify how to write and debug:
      * Interpreted code
      * Compiled code
  -
  -
    title: What is meant by compiled code and interpreted code?
    theme: t-bg-primary
    copy: |
      For a program to run (execute) successfully, the human readable code which has been written by the programmer (the source code) must be translated into commands that are directly executable by the hardware (machine code). This can occur in different ways depending on the language. The main way this happens is through programs called compilers or interpreters, which do this in different ways. 

      ### Compiled code

      Compiled code is source code that has been processed by a program called compiler. The compiler will read the source code, then generate a separate program called an executable program from it. The executable program is self-contained in that it is run by the operating system, rather than the original language. This executable program is involved in converting the instructions in the source code of the original program into machine code.
         
      ![](/images/svg/cp3/cp3_u3_s3_p1_image1.svg)

      ### Interpreted code

      Interpreted code is source code that effectively gets translated into machine code line-by-line as the program executes through a intermediate program called an interpreter. 
            
      The interpreter converting source code to machine code is somewhat like a translator translating from French to English between two languages during a speech or conversation.

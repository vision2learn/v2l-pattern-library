      content:
        -
          sentence: Debugging tools would check and highlight syntax, runtime, logic, and compilation errors. 
          answer: Debugging tools
        -
          sentence: Integrated development environments provides a single program which can be used for all aspects of programming 
          answer: Integrated development environments
        -
          sentence: A compiler will read source code and generate a separate program called an executable program from it. 
          answer: compiler
        -
          sentence: Source code control is a software system that helps developers to collaborate on code and keep track of changes.
          answer: Source code control
        -
          sentence: Code that gets translated into machine code line-by-line as the program executes is done through a program called an interpreter.
          answer: interpreter
    theme: i-quiz

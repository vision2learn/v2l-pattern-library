title: Tools used in coding
intro: |
  In this session you will learn about the tools used in coding, development environment for different languages, and source code control.

banner: cp3_u3_s1_p2_tools_used.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to identify tools used in coding.
  -
  -
    title: Tools used in coding
    theme: t-bg-primary
    copy: |
      Scroll through the slides below to learn about the different tools used in coding.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Text editors
          text: |
            A text editor is a common developer environment for coding, although similiar to an Integrated Development Environment (IDE), its functionality is much lighter with less integrated tools, and its main purpose would be for coding.  It is a good tool to start with as a new developer and there are several choices of which most are open-source.
          img: cp3_u3_s1_p2_slide1.svg
        -
          title: Integrated Development Environment (IDE)
          text: |
            The main environment that would be used to write code in a typical Software project team would be an integrated development environment (IDE).  They provide a single program which can be used for all aspects of programming which would include several features for authoring, compiling, debugging, and deployment software.

            Some IDEs are designed for specific programming languages but there are also ones that will support multiple languages.
          img: cp3_u3_s1_p2_slide2.svg
        -
          title: Source control
          text: |
            Source code control (SCM) is a software __version control__ system that helps developers to collaborate on code and keep track of changes. This is useful and important in a team of developers working on the same software project. There are two main types of source control – distributed and centralised.  
            
            Source code control would allow developers to work on their own section of code on their own 'feature branch', which would mean that they could work independently, and 'commit' their own work (along with other team members) to the main 'Dev branch' without any conflicts.

            Some of the more popular ones are Git, GitHub and Azure. 
          img: cp3_u3_s1_p2_slide3.svg
        -
          title: Debugger
          text: |
            Debugging is the process of identifying and removing existing and potential errors or ‘bugs’ in code and debugging and testing are process which occur hand in hand.  Debugging tools would check and highlight syntax, runtime, logic, and compilation errors.  Most debuggers are run internally in the developer environment. 
            
            Testing aims to identify what happens when there are errors in the code. Debugging aims to locate and rectify mistakes. Often tests are written to identify bugs as the program is written. One way to do this is by writing unit tests. 
          img: cp3_u3_s1_p2_slide4.svg
        -
          title: Compiler / Interpreter
          text: |
            The code which has been written by the programmer (the source code) needs to be translated into commands that can be executed (ran) by the hardware (machine code). The main way this happens is through programs called 'compilers' or 'interpreters' (depending on the language), which do this in different ways. 

            Compiled code is source code that has been processed by a program called compiler. The compiler will read the source code, then generate a separate program called an executable program from it. The executable program is self-contained in that it is run by the operating system, rather than the original language.

            Interpreted code is source code that effectively gets translated into machine code line-by-line as the program executes through a intermediate program called an interpreter.
          img: cp3_u3_s1_p2_slide5.svg

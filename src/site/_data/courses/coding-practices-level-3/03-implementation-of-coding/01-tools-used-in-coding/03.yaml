    include:
      type: on-the-web
      copy: |
        ### Why it is important
        
        Source control allows a team of developers to work on the same codebase.  It enables them to work independently on their own piece of code (feature branch) which means that they can commit and merge code without conflicts. Please see the below websites to learn more.

      links:
        Benefits of version control: https://reqtest.com/requirements-blog/what-are-benefits-of-version-control/ 
        Why you should use source control: https://betterprogramming.pub/9-reasons-even-solo-developers-should-use-source-control-c4f5939e2a36

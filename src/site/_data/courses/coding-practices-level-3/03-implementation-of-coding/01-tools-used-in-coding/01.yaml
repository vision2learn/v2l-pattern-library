title: Welcome to Unit 3
intro: |
  ### Implementation of coding
    
  Welcome to the third unit of your Level 3 Certificate in Coding Practices.  This unit is about implementation of coding. You will learn about tools, key concepts, and how to write and debug code.

banner: cp3_u3_s1_p1_intro.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit, you will cover the following criteria of your Level 3 Certificate in Coding Practices qualification.

      You will:

      1. Understand tools used in coding
      2. Understand key concepts in coding
      3. Be able to write and debug code

      [View the complete set of learning outcomes for this unit.](/pdfs/v2l_cp3_learning_outcomes_u3.pdf)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      
      * Tools used in coding
      * Development environment for different languages
      * Source code control
  -
    title: Constructors (Methods)
    theme:
    copy: |
      A Class Constructor is called to instantiate (i.e. create in memory) an object of its Class (‘blueprint’) type (e.g. Dog or Student).  Constructor methods therein also setup the initial state of the instantiated object (i.e. the starting values for name, gender, birthday etc).  Constructors have the same name as their class. 
    subInc:
      type: code
      lang: java
      highlight: 
      code: |
          public class Student { 

            String name; 
            char gender; 
            Date birthday; 
            Preference pref; 
            Boolean matched; 
            public Student (String n, char g, Date b, Preference p){ 
            name = n;  
            gender = g;  
            birthDay = b;  
            pref = p; 
            }

  -
  -
    title: Types of Constructors
    theme: t-bg-supporting3
    copy: |
      A _Default Constructor_ does not contain any parameters and provides the default values to all object attributes depending on each attributes datatype, e.g int = 0, String = null etc. 
      
      A _Parameterised Constructor_ contains parameters  (possibly from user input) that are used to set the initial state of an object's attributes upon instantiation (i.e. creation in memory). 

    subInc:
      type: code
      lang: java
      highlight: 
      code: |
          // Default Constructor example

          // code here


          
          // Parameterised Constructor example

          package exams;

          public class StudentResults {
            private String Full_Name;
            private String Exam_Name;
            private String Exam_Score;
            private String Exam_Grade;

            StudentResults() {

            }
          }    
  -
  -
    title: Get and Set Methods
    theme:
    copy: |
      ### Getters and Setters

      The Get method returns the current value of its associated attribute from a specified object. 

      The Set method allows an attribute of a specified object to be changed at run time (thus changing the State of the object).  This also allows values passed in to be validated prior to setting the attribute (e.g. age >= 0). 
    subInc:
      type: code
      lang: java
      highlight: 
      code: |
          // Java bean for Person
          public class Person {
            
            // Private variable
            private String fullName;
            
            // Constructor
            public Person(String fullName){
              setFullName(fullName);
            }

            // Getter and setter for variable
            public String getFullName() {
              return fullName;
            }
            public void SetFullName(String fullName){
              this.fullName=fullName;
            }

          }

    copy2: |
      Important: Allows object attributes to be set as private, thus protecting these attributes, by controlling access through their Get and Set methods, to retrieve and amend an attributes value.  
  -
  -
    title: Behavioural Methods 
    theme: t-bg-supporting3
    copy: |
      The Behavioural Method contains behaviour functionality.  A Class can contain many Behavioural Methods.  These methods change the state of an object at run time (e.g. increasing a Person’s age attribute on their birthday).
    subInc:
      type: code
      lang: java
      highlight: 
      code: |
          class Car{
            String colour;
            int numberOfDoors;

            void startEngine(){
              // Some code goes here
            }
            void stopEngine(){
              int tempCounter=0;
              // Some code goes here
            }
          }

    copy2: |
      __Fields__ represent some attributes (properties) of a car - number of doors or colour.

      __numberOfDoors__ is a variable of type _int_ - to store integers; 
      __colour__ can hold a string of characters (text)

      __Local variables__ are declared inside methods, 
      __Fields__ (aka member variables) are outside.

      __Methods__ describe what our car can do: stop and start the engine.

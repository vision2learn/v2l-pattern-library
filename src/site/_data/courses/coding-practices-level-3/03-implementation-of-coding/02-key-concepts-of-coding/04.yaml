title: Object oriented programming - Methods
intro: |
  On this page you will learn about the object orientate programming Method which is also known as a Constructor.  We will cover the the types of Constructors, Get and Set Methods, and Behavioural Methods.
banner: placeholder.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to explain the Method (Constructor) object orientated programming concept.
  -
    title: Constructors (Methods)
    theme:
    copy: |
      A Class Constructor is called to instantiate (i.e. create in memory) an object of its Class (‘blueprint’) type (e.g. Dog or Student).  Constructor methods therein also setup the initial state of the instantiated object (i.e. the starting values for name, gender, birthday etc).  Constructors have the same name as their class. 
    subInc:
      type: code
      lang: java
      highlight: 
      code: |
          public class Dog {
          // Private attributes can only be accessed via the class
              // and cannot be modified outside the class.
              // All related constructors, getters and setters are all
              // public to allow for changes to these attributes when
              // the object is built.
          private String name;
              private String breed;
              private int age;
          }

  -
  -
    title: Types of Constructors
    theme: t-bg-supporting3
    copy: |
      A _Parameterised Constructor_ contains parameters (possibly from user input) that are used to set the initial state of an object's attributes upon instantiation (i.e. creation in memory).

      A _Default Constructor_ does not contain any parameters and provides the default values to all object attributes depending on each attributes datatype, e.g int = 0, String = null etc. 
      
    subInc:
      type: code
      lang: java
      highlight: 
      code: |
          // This constructor is passing in the attributes from information
            // declared when the object is created. This is known as a
            // parameterised constructor
          public Dog(String name, String breed, int age) {
          this.name = name;
                  this.breed = breed;
                  this.age = age;
          }

          // When no data is passed when the object is created the constructor
              // is called a default constructor and is normally empty.  These types
              // of constructors are only useful if there is a setter for all the attributes.
          public Dog(){
          name = "";
          breed = "";
          age = 0;
          } 
  -
  -
    title: Get and Set Methods
    theme:
    copy: |
      ### Getters and Setters

      The Get method returns the current value of its associated attribute from a specified object. 

      The Set method allows an attribute of a specified object to be changed at run time (thus changing the State of the object).  This also allows values passed in to be validated prior to setting the attribute (e.g. age >= 0). 
    subInc:
      type: code
      lang: java
      highlight: 
      code: |
          // Getter, allows the software to get the name of an object
            // because it is public it is accessible outside the class
          public String getName() {
          return name;
          }

          // This setter allows the software to change the name of an object
              // if you do not wish the software to alter the name don't add a setter
          public void setName(String name) {
          this.name = name;
          }

          public String getBreed() {
          return breed;
          }

          public void setBreed(String breed) {
          this.breed = breed;
          }

          public String getAge() {
          return (age + " years old!");
          }

          public void setAge(int age) {
          this.age = age;
          }

    copy2: |
      Important: Allows object attributes to be set as private, thus protecting these attributes, by controlling access through their Get and Set methods, to retrieve and amend an attributes value.  
  -
  -
    title: Behavioural Methods 
    theme: 
    copy: |
      A Behavioural Method contains behaviour functionality.  A Class can contain many Behavioural Methods.  These methods change the state of an object at run time (e.g. increasing a Person’s age attribute on their birthday).
    subInc:
      type: code
      lang: java
      highlight: 
      code: |
          // Examples of class methods.
          public void gettingOlder(){
          age++;
          }

          public void eat(){
                  System.out.println("Nom nom nom!");
          }

          public void sleep(){
                  System.out.println("Zzzzzzzzzzzz!");
          }
          }

    copy2: |
      
  -
  -
    title: Calling the class
    theme: 
    copy: |
      Here’s a class calling the Dog class and creating an object called myDog.
    subInc:
      type: code
      lang: java
      highlight: 
      code: |
          public class createDog {

            public static void main(String[] args) {
                // Creating a dog from the dog class called myDog.  This is created using 
                // the parameterised constructor.
                Dog myDog = new Dog("Fred","Jack Russell",5);
                
                // Using the getter getName to display the name of the dog
                System.out.println(myDog.getName() + " is " + myDog.getAge());

                // Calling a method from the Dog class called gettingOlder
                myDog.gettingOlder();
                
                // Demonstrating the impact of running the gettingOlder method on the dog
                System.out.println(myDog.getName() + " is now " + myDog.getAge());
                
                // Calling the method from the Dog class called sleep().  Note how all
                // method calls from another class must use the object, which in this case
                // is myDog, which we created above.
                myDog.sleep();
            }
          }
  -
  -
    title: Result
    theme: 
    copy: |
      
    subInc:
      type: code
      lang: text
      highlight: 
      code: |
          Running the above:
          Fred is 5 years old!
          Fred is now 6 years old!
          Zzzzzzzzzzzz!

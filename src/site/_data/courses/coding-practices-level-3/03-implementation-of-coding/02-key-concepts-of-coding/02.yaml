  -
    title: Sequences, Selection and Control flow
    theme:
    copy: |
      Sequence is the first programming construct. Statements are executed one after another and the sequence is the order in which those statements are executed.

      Selection is the second programming construct and is used to make choices. It would use statements such as _If Then Else_ to repeat instructions or move to a different part of the code. Selection is also known as a decision - a question is asked and the answer determines the where the program moves next. For example IF Condition A is true, THEN do Action A, ELSE do Action B.
      
      Selection is a kind of __Control flow__.
      
      Control flow is the order in which a computer executes statements in a script. Code runs from the first line to the last unless the computer comes across structures like conditionals and loops which change the control flow. 
      
      For example say a script is used to validate user data for a webpage but if a field is left empty the script prompts them to fill it in.   The script uses a conditional structure so different code will be executed. Javascript amongst others includes many control structures including conditionals, loops and functions. 
      
      Control flow means that when a script is read, it must be read from start to finish, but also the program structure should be read to know how it affects the order of execution. 
      
      Control Flow is often represented in a control flow graph (CFG) during the execution of programs or applications.
      
      Take a look at the following *Java example* and see if you can follow the control flow:
    subInc:
      type: code
      lang: js
      highlight: 
      code: | 
          public class V2L22 {
          //The main method is needed to successfully run the application
            public static void main(String[] args) {

              // Declare some variables
              int num1 = 25; // creating an integer variable
              float num2 = 28.01f; // creating a float variable
              String name = "Joe Bloggs"; // creating a string variable
              boolean gender = true; // creating a boolean variable
              int[] arr = new int[5]; // creating a blank array with 5 slots
              int[] arr2 = {5, 2, 6, 3, 7, 2}; // creating an array with values

                      // Selection using a conditional statement
              if (num1 == 25) {
                  System.out.println("The value of the variable is 25");
              } else {
                  System.out.println("The value of the variable does not equal 25");
              }

              // Example of iteration (a loop)
              for (int i = 0; i < 5; i++) {
                  System.out.println("This line will be printed 5 times, this is number: " + (i+1));
              }

              // Calling a method
              int myAge = 16;
              yourNextBirthday(myAge);
            }

              // A method which exists outside the main method
              public static void yourNextBirthday(int age){
                  age++;
                  System.out.println("On your next birthday, you will be " + age + " years old.");
              }
          }

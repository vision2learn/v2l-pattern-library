    title: Iterations
    theme: 
    copy: |
      Iteration in programming is the process of repeating sequential steps or instructions over and over in order to generate an intended outcome. Each repetition of the process is a single iteration, and the outcome of each iteration forms the starting point for the next one. 
      
      Algorithms consist of instructions that are carried out one after another. Sometimes an algorithm needs to repeat certain steps until it is told to stop, or a desired condition has been met. Iteration allows algorithms to be simplified by making them repeat until told otherwise. 
      
      Incorrect definition of an end condition will usually only cause the process to repeat on itself and will form a never-ending loop. However, this would only ever exist within CPU cycles and shouldn’t cause a system crash.
      
      Here is a very simple iteration in Java where we start with a variable of value 1, then using a While loop, check whether our variable is less than 10. If it is not, we add 1 to it, and then carry on until our input variable reaches 10. Otherwise we use a ‘while’ statement and ‘break’ statement to break out of the loop and print the value of the input variable.

    subInc:
      type: code
      lang: java
      highlight: 
      code: |
          public class UsingIteration {
            public static void main(String[] args) {
              int num1 = 1;
              System.out.println("Loop will stop when num1 = 10");

              while (num1 < 10) {
                  System.out.println("Condition not met, num1 is " + num1);
                  num1++;
              }
              System.out.println("Condition met, num1 is " + num1);
            }
          }

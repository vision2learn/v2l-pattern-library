      In your assessment you will be required to explain the coding concepts:
      * Sequences
      * Selection
  -
  -
    title: Sequences, Selection and Control flow
    theme:
    copy: |
      Sequence is the first programming construct. Statements are executed one after another and the sequence is the order in which those statements are executed.

      Selection is the second programming construct and is used to make choices. It would use statements such as _If Then Else_ to repeat instructions or move to a different part of the code. Selection is also known as a decision - a question is asked and the answer determines the where the program moves next. So for example in the statement IF Condition A is true, THEN do Action A, ELSE do Action B.
      
      Selection is a kind of __Control flow__.
      
      Control flow is the order in which a computer executes statements in a script. Code runs from the first line to the last unless the computer comes across structures like conditionals and loops which change the control flow. 
      
      For example say a script is used to validate user data for a webpage but if a field is left empty the script prompts them to fill it in.   The script uses a conditional structure so different code will be executed. Javascript amongst others includes many control structures including conditionals, loops and functions. 
      
      Control flow means that when a script is read, it must be read from start to finish, but also the program structure should be read so as to know how it affects the order of execution. 
      
      Control Flow is often represented in a control flow graph (CFG) during the execution of programs or applications.
      
      Take a look at the following *Javascript example* and see if you can follow the control flow:


    subInc:
      type: code
      lang: js
      highlight: 
      code: |
          // Declare some variables

          var variable_1 = 25
          var variable_2 = 28
          var list_1 = [5, 2, 6, 3, 7, 2]

          // A conditional statement

          if (variable_1 === variable_2){
            console.log('the variables are equal.');
          } else {
            console.log('the variables are not equal.');
          }
        
          // A type of iteration (a loop)

          for (let i = 0; i < list_1.length; i++) {
            console.log('List item ', i, ' = ', list_1[i])
          }

          // A function

          function myFunction (input_1, input_2) {
            sum_of_inputs = input_1 + input_2
            console.log('The sum of inputs = ', sum_of_inputs);
          }

          // A function call

          myFunction(variable_1, variable_2);

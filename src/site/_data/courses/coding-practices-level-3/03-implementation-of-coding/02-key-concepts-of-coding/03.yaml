  -
  -
    title: Object orientated programming principles
    theme: t-bg-primary
    copy: |
      Object orientated programming (OOP) is a widely used concept in modern programming languages such as Java.

      It is a programming concept that uses four principles. These are Encapsulation, Abstraction, Inheritance, and Polymorphism.  Using these principles programmers can create objects, and they would methods to handle the objects. The objects can be reused throughout a program and results are given from manipulating those objects in some way.
    
      Scroll through the slides below to learn more about four principles.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Encapsulation
          text: |
            In programming languages, encapsulation is used to refer to one of two related but distinct notions, and sometimes to the combination thereof: 

            A language mechanism for restricting direct access to an object's components. 

            A language construct that facilitates the bundling of data with the associated methods (or other functions) operating on that data. 
          img: placeholder_icon.svg
        -
          title: Abstraction
          text: |
            Abstraction is a process where you show only “relevant” details and “hide” the unnecessary details of an object from the user. 
          img: placeholder_icon.svg
        -
          title: Inheritance
          text: |
            Inheritance enables new objects to take on the properties of existing objects. A class that is used as the basis for inheritance is called a superclass or base class. A class that inherits from a superclass is called a subclass or derived class. 
          img: placeholder_icon.svg
        -
          title: Polymorphism
          text: |
            Polymorphism refers to a programming language's ability to process objects differently depending on their data type or class. More specifically, it is the ability to redefine methods for derived classes. 
          img: placeholder_icon.svg

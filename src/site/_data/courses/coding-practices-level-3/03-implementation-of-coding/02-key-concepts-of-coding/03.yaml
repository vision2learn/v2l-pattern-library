    title: Classes
    theme:
    copy: |
      A Class is a ‘blueprint’ that defines the attributes and methods common to all objects of this kind (e.g. dog or car).   

    subInc:
      type: code
      lang: java
      highlight: 
      code: |
          <Access-Modifier> class MyClass 
          { 
            // attribute, constructor, getter/setter 
            and behavioural method declarations 
          } 
    copy2: |
      To instantiate (create (in memory)) an Object from a Class: 
      
      MyClass instance = new MyClass(<constructor parameters>);

      We can instantiate an infinite number of objects from a class (i.e. multiple different cars, dogs, people etc.).      
  -
  -
    title: P L A C E H O L D E R - Abstract Class
    layout: media
    theme: t-bg-supporting3
    copy: |
      A class that is restricted and cannot be used to create objects is know as Abstract class.

    img: /images/svg/placeholder_icon.svg
  -
  -
    title: Interfaces
    layout: media
    theme: t-bg-primary
    copy: |
      Interfaces are _Classes_ without code.  Interfaces can define properties and methods but do not store data.  
      
      So for example, in the programming language Java it is used to define a collection of method definitions and constant values. This means it can be implemented by classes that define this interface with the 'implements' keyword.  this is useful because it can implement multiple interfaces.

      _Do we more information here?_

    img: /images/svg/placeholder_icon.svg

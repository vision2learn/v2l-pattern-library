  -
    title: Objects
    theme: t-bg-supporting3
    copy: |
      
      An object is a self-contained component that would have methods and properties. So in our example:
      
      * Class: Dogs
      * Attributes: Breed, Size, Age, and Colour
      * Methods: Eat(), Sleep(), Sit(), and Run()

      _one image (dogs) for objects - wide image or accordion?_

      ![](/images/banners/placeholder.jpg)
  -
  -
    title: Differences between Class and Object
    theme: t-bg-supporting2
    copy: |
      See below to see a table that outlines the differences between Class and Object.
    subInc: 
      type: accordion
      content:
        - 
          title: Class and Object
          copy: |
            | Class | Object |
            |------|------|
            |A class is a template for creating objects in program.  | The object is an instance of a class. |
            |A class is a logical entity  | Object is a physical entity |
            |A class does not allocate memory space when it is created. | Object allocates memory space whenever they are created. |
            |You can declare class only once.  | You can create more than one object using a class. |
            |Example: Car.  | Example: Jaguar, BMW, Tesla, etc. |
            |Class generates objects | Objects provide life to the class. |
            |Classes can’t be manipulated as they are not available in memory. |	They can be manipulated. |
            |It doesn’t have any values which are associated with the fields. | Each and every object has its own values, which are associated with the fields. |
            |You can create class using “class” keyword. | You can create object using “new” keyword in Java |
  -
  -
    title: Properties and Attributes
    layout: media
    theme: t-bg-primary
    copy: |
      ### Attributes

      Attributes are the _data members_ inside a class or an object.  Attributes may also be referred to as _fields_ or _class variables_ this will largely depend on which programming language is used. Attributes can be _Instance_ and _Class_ types.

      So in our Objects Dog example the attributes for the _Class_ Dog would be: Breed, Size, Age, and Colour.


      ### Properties

      A Property is a broad concept and used to determine a particular characteristic of a class. Properties are a way to attach custom behaviours to writing or reading a field.  Properties are an _abstraction_. It is a special sort of _class_ and its functinality is somewhere between a _data member_ and a _method_.

      Properties are a special kind of attribute that provide _getter, setter_ and _deleter_ functionality to an attribute.

    img: /images/svg/placeholder_icon.svg

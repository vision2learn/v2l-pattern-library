  -
  -
    title: Classes
    theme:
    copy: |
      A Class is a ‘blueprint’ that defines the attributes and methods common to all objects of this kind (e.g. dog or car).   

    subInc:
      type: code
      lang: java
      highlight: 
      code: |
          <Access-Modifier> class MyClass 
          { 
            // attribute, constructor, getter/setter 
            and behavioural method declarations 
          } 
    copy2: |

  -
  -
    title: Instantiate an Object
    theme:
    copy: |
      To instantiate (create (in memory)) an Object from a Class: 

    subInc:
      type: code
      lang: java
      highlight: 
      code: |
          MyClass instance = new MyClass(<constructor parameters>); 
    copy2: |
      We can instantiate an infinite number of objects from a class (i.e. multiple different cars, dogs, people etc.).      
  -
  -
    title: Abstract Class
    theme: t-bg-supporting2
    copy: |
      A class that is restricted and cannot be used to create objects is know as an Abstract Class.

      ![](/images/svg/cp3/cp3_u3_s2_p3_image2_1.svg)

  -

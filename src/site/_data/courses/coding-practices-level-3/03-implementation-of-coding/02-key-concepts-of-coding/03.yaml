  -
  -
    title: Interfaces
    theme: 
    copy: |
      Interfaces are _Classes_ without code.  Interfaces can define properties and methods but do not store data.
      
      ![](/images/svg/cp3/cp3_u3_s2_p3_image3_2.svg)

      So for example, in the programming language Java, it is used to define a collection of method definitions and constant values. This means it can be implemented by classes that define this interface with the 'implements' keyword.  This is useful because it can implement multiple interfaces.
  -
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media

title: Welcome to Unit 3
intro: |
    ### Continuous improvement (Kaizen)
    
    Welcome to the second unit of your Level 2 Certificate in Business Improvement Techniques qualification.  This unit is all about understanding continuous improvement techniques (Kaizen) and their application in the workplace. It also covers the benefits of standard working methods and standardised work documents.

banner: placeholder.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit, you will cover the following criteria of your Level 2 Certificate in Business Improvement Techniques qualification.

      You will:

      1. Understand continuous improvement techniques (Kaizen)

      [View the complete set of learning outcomes for this unit.](/pdfs/v2l_bit_learning_outcomes_u3.pdf)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      
      * The main Kaizen principles and their application
      * The 8 wastes of lean and how to eliminate them
      * How to carry out a Kaizen activity and establish measurable movements
      * Waste, problems or conditions within a work area or activity where improvements can be made
      * The benefits of standardised working methods
      * The information required to create a standard operating procedure (SOP)
      * How to eliminate variance to process

title: Standardised working methods
intro: |
  On this page you will learn about standardised working methods and how they can benefit the workplace.
banner: bit_u3_s1_p4_banner.jpg
sections:
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to describe the benefits of standardised working methods.
  -
  -
    title: Introduction
    layout: media
    theme: t-bg-primary
    copy: |
      Standardised working methods are another key principle of Kaizen. These are documented procedures that outline the steps required to complete a task or process. By documenting a task or process an organisation can ensure that all staff are doing the same thing and producing the same quality. 
      
      It promotes consistency and improved quality, increases efficiency, and reduces waste. When it comes to improvements, this is easier if everyone is following the same processes and procedures, allowing areas of improvement to be identified and incremental changes to be made.

    img: /images/svg/bit/bit_u3_s1_p4_image1.svg

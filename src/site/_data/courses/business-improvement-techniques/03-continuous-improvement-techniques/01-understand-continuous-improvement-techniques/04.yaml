    title: Case study FROM LEAN
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Case study - Automotive and Hotel industries

      The automotive and hotel industries are both examples of industries which use standardisations to make themselves more competitive.
    subInc: 
      type: accordion
      content:
        - 
          title: The automotive industry
          copy: |
            In the early years of the automotive industry, vehicles were manufactured with non-interchangeable parts. When a part needed to be replaced, the old part had to be measured and manufactured to suit the old part. Today, all components are standardised within a set of serial numbers. 

          img: /images/svg/placeholder_icon.svg
        - 
          title: The hotel industry
          copy: |
            When a new hotel is built, rooms are built to very accurate dimensions and even the size of the bathroom tiles is standardised. This makes the tiling process much faster than if each bathroom were different in size and all the tiles had to be cut to different sizes.

          img: /images/svg/placeholder_icon.svg

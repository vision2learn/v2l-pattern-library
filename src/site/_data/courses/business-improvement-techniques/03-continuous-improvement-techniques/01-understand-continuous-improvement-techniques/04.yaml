  -
  -
    title: Introduction
    layout: media
    theme: t-bg-primary
    copy: |
      Standardised working methods are another key principle of Kaizen. These are documented procedures that outline the steps required to complete a task or process. By documenting a task or process an organisation can ensure that all staff are doing the same thing and producing the same quality. It promotes consistency and improved quality, increased efficiency and reduced waste. When it comes to improvements, this is easier if everyone is following the same processes and procedures, allowing areas of improvement to be identified and incremental changes to me made.

    img: /images/svg/placeholder_icon.svg

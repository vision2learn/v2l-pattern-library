  -
    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Case study - Starbucks continuous improvements

      Starbucks, which was established in 1971, has remained a thriving enterprise for 37 years, continuously making minor adjustments to its products and operations in order to enhance the quality of its offerings and services. Read below for one such example of a continuous improvement.

    subInc: 
      type: accordion
      content:
        - 
          title: A richer sweeter taste of coffee
          copy: |
            Whilst a latte was being prepared one morning, a customer noticed that instead of the espresso shots being poured into shot glasses, they were going straight into the cardboard cup. Curious, she asked the barista about the absence of the shot glasses, and he explained that Starbucks had decided to direct the coffee residue, known as "crema," into the cup with the espresso, as it contributes to a richer, sweeter taste. 
            
            This small change not only improves the quality of the product but also saves up to five seconds per drink, and reduces waste.

            _(Source of case study: https://www.fastcompany.com/1054623/starbucks-and-kaizen)_

          img: /images/svg/bit/bit_u3_s1_p4_case_study.svg
  -
  -
    title: Sustainability
    layout: media
    theme: t-bg-primary1b
    copy: |
      Whilst applying the Kaizen principles reduces waste, it often increases sustainability by reducing environmental impact. For example, in the Starbuck’s case study above, by no longer using the shot glasses they no longer need washing, or even to be purchased anymore. This is better for the environment and saves the business even more time and money. 
      
      There are often even more environmental savings such as less electricity used for machinery or lighting, this could be the case for Physical 3D in their case study on page 3.

    img: /images/svg/bit/bit_u3_s1_p4_image2.svg

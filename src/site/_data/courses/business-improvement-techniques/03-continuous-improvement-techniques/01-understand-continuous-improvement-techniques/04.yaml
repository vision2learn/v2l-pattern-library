    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to describe the benefits of standardised working methods.
  -
  -
    title: Standardisation FROM LEAN
    theme: 
    copy: |
      Standardisation is in operation in every aspect of organisations. There are certain standards that we all tend to accept automatically. These standards are described as universal For example, photocopiers have a setting for A4 paper and organisations usually use A4 copier paper. This consistency and predictability saves people time and energy. 

      Organisations may also use other standards in addition to these ‘universal standards’. 

      Scroll through the slides below to learn more about these additional standards.
    subInc:
      type: slider
      title: 
      slides:
        -
          title: Standardisation and design
          text: Components may be designed so that they could be used in a range of products/models. For example, a car door lock may be standardised so that it could be used in a variety of cars and models.
          img: LM_U2_S4_P1_Slide_1.svg
        -
          title: Standardisation and processes
          text: Using similar methods to produce similar components makes it possible to standardise machine tooling. 
          img: LM_U2_S4_P1_Slide_2.svg
        -
          title: Standardisation and systems 
          text: Using the same systems (such as computer systems) across plants and/or countries enables companies to use standard approaches to training, maintaining and upgrading.
          img: LM_U2_S4_P1_Slide_3.svg
        -
          title: Standardisation and components 
          text: It is possible to have components that are identical in shape and size but made in different materials. They could be colour-coded for prompt identification. 
          img: LM_U2_S4_P1_Slide_4.svg
        -
          title: Standardisation and procedures
          text: Organisations may introduce standard procedures in order to solve problems, reduce set up times or identify improvements. The **PDSA** approach (Plan, Do, Study, Act) is often used in business improvement organisations. 
          img: LM_U2_S4_P1_Slide_5.svg
  -
  -
    title: The benefits of standardisation FROM LEAN
    layout: media
    theme: t-bg-primary
    copy: |
      Organisations seek to standardise in order to improve reliability and cut wasted time, materials and labour.

      The elimination of waste and errors, and the consistent delivery of a product or service, improves the quality of the outputs of an organisation.

      Consider a multi-plant organisation where each plant uses different software systems. Information transfer takes a long time and costs a lot of money to move around. There is also scope for errors in transfers. However, if all the plants used the same standardised systems, information could be transferred almost instantaneously, at very little cost and with few or no errors.

      Another potential benefit of standardisation is reduced stock levels carried in organisations. If one component can be standardised and used for all models produced by a business, reducing stock, then storage, monitoring and the potential for error can be achieved cost-effectively.

    img: /images/svg/placeholder_icon.svg
  -
  -
    title: Benefits of standardisation FROM LEAN
    theme: t-bg-primary
    copy: |
      In addition to improving reliability and eliminating waste, standardisation is also used to reduce costs, eliminate problems and aid in health and safety

      The process of standardisation can make a significant contribution to quality, efficiency and safety in the workplace. It may be used in all types of organisation and for all types of business functions.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Reduced costs FROM LEAN
          text: |
            One aim of standardisation is to reduce costs. In a manufacturing environment, one way to reduce costs is to use the same component for several models. This creates demand for a larger volume of the component and makes it possible to get economies of scale and volume discounts. It also makes it possible to carry lower overall inventory (over the full range of models).
          img: placeholder_icon.svg
        -
          title: Problem elimination FROM LEAN
          text: |
            In both product and service industries, standard procedures can help to eliminate the likelihood of problems recurring, and provide the basis for a consistently delivered process. A standard procedure makes it possible to track the process and identify anything that may cause undesirable outcomes.
          img: placeholder_icon.svg
        -
          title: Health and Safety FROM LEAN
          text: |
            Most organisations have clear instructions procedures for the operation of equipment and handling of potentially hazardous substances. If instructions are ignored, people’s health and safety can be put at risk. There are legal, moral and commercial reasons for maximising health and safety. It is logical to reduce variation and standardise health and safety processes. For example, organisations may emphasise the need for appropriate protective clothing for carrying out certain tasks.
          img: placeholder_icon.svg
        -
          title: Reduced waste

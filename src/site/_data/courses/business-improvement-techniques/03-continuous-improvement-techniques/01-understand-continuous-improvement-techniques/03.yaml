title: Kaizen activity and improvements
intro: |
  On this page you will learn how to carry out a Kaizen activity, and identify where improvements can be made within a work area or activity.
banner: bit_u3_s1_p3_banner.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to explain how to carry out a Kaizen activity and establish measurable movements.
  -
    title: Introduction
    layout: media
    theme: t-bg-primary
    copy: |
      We’ve had a brief look at Kaizen on the previous page and seen some of the principles employed within the improvement process. An important part of this is having measurable movements, or to put it simply – ways to measure progress. These should be identified within the planning stage when the goal is known. E.g., if the goal is to reduce waste, how much is there to begin with and what is the target? Once changes have been implemented, it’s then possible to measure if the waste has reduced by the target amount and if the change was successful.
      
      Remember the case study for Physical 3D on page 2? They had a measurable movement and reduced their assembly time by 20 minutes.

    img: /images/svg/bit/bit_u3_s1_p3_image1.svg

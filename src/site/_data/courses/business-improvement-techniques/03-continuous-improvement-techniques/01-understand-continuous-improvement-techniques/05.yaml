    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to prepare a standardised work document suggesting how to eliminate variance to process.
  -
  -
    title: Eliminate variance in process
    layout: media
    theme: t-bg-primary
    copy: |
      "Eliminate variance in process" means to reduce or remove any inconsistencies, variations, or deviations from the established standard or desired outcome of a process. It aims to create a consistent and predictable workflow where all steps are performed consistently and produce similar results each time.

      Organisation’s may use SOPs to eliminate variance, strive to achieve greater efficiency, quality, and reliability in their operations. Using a SOP can help with identifying and addressing factors that contribute to variations, such as inadequate training, unclear instructions, equipment issues, or external influences.

      SOPs allow for standardised processes, clear guidelines, and quality control measures; all of which may be used to eliminate variance in a process.

    img: /images/svg/bit/bit_u3_s1_p5_image1.svg

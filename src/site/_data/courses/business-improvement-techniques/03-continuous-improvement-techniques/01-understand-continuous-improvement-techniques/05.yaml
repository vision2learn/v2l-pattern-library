    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to prepare a standardised work document suggesting how to eliminate variance to process.
  -
  -
    title: Eliminate variance in process
    layout: media
    theme: t-bg-primary
    copy: |
      "Eliminate variance in process" means to reduce or remove any inconsistencies, variations, or deviations from the established standard or desired outcome of a process. It aims to create a consistent and predictable workflow where all steps are performed consistently and produce similar results each time.

      By eliminating variance, organisations strive to achieve greater efficiency, quality, and reliability in their operations. It involves identifying and addressing factors that contribute to variations, such as inadequate training, unclear instructions, equipment issues, or external influences. 
      
      Standardising processes, providing clear guidelines, and implementing quality control measures are some of the approaches used to eliminate variance in a process. 

    img: /images/svg/placeholder_icon.svg

title: Standardised working document (SOP)
intro: |
  On this page you will learn about standard operating procudures (SOPs) and how to create one.
banner: placeholder.jpg
sections:
  -
    title: Key point
    theme: t-bg-supporting2 i-keypoint
    copy: |
      In your assessment you will be required to describe the information required to create a standard operating procedure (SOP).
  -
  -
    title: Things to consider when creating a SOP
    theme: t-bg-primary
    copy: |
     When creating a Standard Operating Procedure (SOP), several important factors should be considered. SOPs play a crucial role in organisations by providing a structured framework for operations, and they offer numerous benefits, including reducing variability, ensuring consistency, and improving overall efficiency.

     By considering these factors during the creation of SOPs, organisations can establish a solid foundation for standardisation and improvement. SOPs serve as a valuable resource for employees, enabling them to perform their duties consistently and efficiently. They provide a framework for continuous enhancement, ensuring that processes evolve and adapt to changing needs and industry standards. Ultimately, well-designed SOPs contribute to the overall success and effectiveness of an organisation.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Features of SOPs
          text: |
            SOPs possess several key features that contribute to their effectiveness and usefulness. These features include:
            * Documented format - SOPs are documented guidelines or instructions that are typically written in a clear, structured format. 
            * Applicable to all business and work areas - SOPs can be developed and implemented across various types of businesses and work areas.
            * Blueprint for operations - SOPs serve as a blueprint or roadmap for carrying out repetitive tasks or processes within an organisation. 
            * Emphasis on repetitive tasks - SOPs are particularly beneficial for documenting and guiding repetitive tasks or processes that occur frequently within a business. 

          img: placeholder_icon.svg
        -
          title: Creating a SOP
          text: |
            SOPs should be written by teams that include some, or all, of the following people:
            * Those who will perform the job
            * Those who will perform maintenance on equipment involved in the SOP
            * Engineers or others who design equipment and processes
            * Technical writers
            * Safety personnel
            * Environmental personnel
            * Equipment manufacturers.

          img: placeholder_icon.svg
        -
          title: Team writing
          text: |
            Team writing improves SOPs by incorporating diverse perspectives and fostering ownership. It develops coaching skills and encourages adherence to SOPs. Teams can independently write sections, merge them into a cohesive document, and seek input from members. Safety considerations are prioritised. Ideally, SOPs are created before new processes, but can also be implemented later for improved performance.

          img: placeholder_icon.svg
        -
          title: Developing a procedure
          text: |
            Developing a procedure involves considering key aspects: area layout, involving relevant individuals, defining actions, estimating time, identifying tools, and recognising key components.
          img: placeholder_icon.svg
        -
          title: Refinement and improvement
          text: |
            Process refinement and improvement involve continuous assessment to optimise performance, safety, and effectiveness.
            * Sub-dividing processes breaks them into manageable components
            * Seek efficiency and hazard reduction opportunities
            * Plan for contingencies to address unexpected events or failures
            * Date and issue number documentation for version control and traceability.
          img: placeholder_icon.svg

  -
    title: Quick quiz
    copy: See if you can identify the 8 wastes of Lean in the following quiz questions.
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Transport waste occurs when movement of any material isn’t part of the immediate production.
          answer: Transport
        -
          sentence: Motion waste is usually caused by ineffective layout and workplace organisation.
          answer: Motion
        -
          sentence: Unutilised talent is the only waste relating to management.
          answer: Unutilised
        -
          sentence: Overproduction waste may be down to poor planning, teams working at different speeds, or incorrectly placed automation. 
          answer: Overproduction
        -
          sentence: Defects detected early in the production can stop difficulties occurring for teams further along, which can impact on overproduction, wating and inventory.
          answer: Defects
        -
          sentence: Any unnecessary work that results in more time and effort than is needed is considered overprocessing.
          answer: overprocessing
        -
          sentence: Any waiting time in the production process is waste. 
          answer: waiting
        -
          sentence: Inventory waste can be a result of inefficient processes and unbalanced production processes. 
          answer: Inventory
    theme: i-quiz

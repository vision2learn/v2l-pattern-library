intro: |
  intro text
banner: placeholder.jpg
sections:
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to describe the factors to be considered when selecting a visual management system.
  -
    title: Selecting a visual management system
    theme: t-bg-primary
    copy: |
      _1.3 - factors to be considered - text is not final - ideas only_
    
      Scroll through the slides below to learn more about ...

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: What is the purpose?
          text: |
            _What do you wish to acheive with the visual management system? for example - increase efficiency or reduce errors?_
          img: placeholder_icon.svg
        -
          title: Who are the audience?
          text: |
            _Who will be using the system? Choose one that is useful for all the users and one that is easy to understand._
          img: placeholder_icon.svg
        -
          title: What information needs to be displayed?
          text: |
            _Visual management systems can display a wide range of information such as production schedules.  What information do you need to convey and is the system you are choosing fit for purpose?_
          img: placeholder_icon.svg
        -
          title: Is it accessible to everyone that needs to use it?
          text: |
            _Is it placed in a position that everyone can access? Does it need to be mobile or used remotely?_
          img: placeholder_icon.svg
        -
          title: Cost
          text: |
            _Purchase price, ongoing maintenace or support costs; Return of investment._
          img: placeholder_icon.svg
        -
          title: Future proof / Adaptability
          text: |
            _How long is it needed for? Can it be adapted if needed? Or can it be customised or does it come with pre-made templates?_

          img: placeholder_icon.svg

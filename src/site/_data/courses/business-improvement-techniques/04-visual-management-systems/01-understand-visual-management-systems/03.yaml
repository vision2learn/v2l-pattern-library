  -
    title: Quick quiz
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        What is the primary purpose of a visual management system?:
          answers:
            To automate business processes: false
            To track employee attendance: false
            To enhance communication within the organisation: true
        Which of the following is an example of information that can be displayed using a visual management system?:
          answers:
            Employee performance evaluations: false
            Production schedules: true
            Customer complaints: false
        Is the following statement true or false? "Visual management systems are only applicable to large organisations.":
          answers:
            True: false
            False: true
        What is the role of visual controls in a visual management system?:
          answers:
            To present information in a clear and easily understandable manner: true
            To ensure privacy and confidentiality of data: false
            To provide physical barriers to access information: false      

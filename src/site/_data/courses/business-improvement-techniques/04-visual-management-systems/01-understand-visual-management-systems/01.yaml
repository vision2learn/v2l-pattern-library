title: Welcome to Unit 4
intro: |
    ### Visual Management Systems
    
    Welcome to the fourth unit of your Level 2 Certificate in Business Improvement Techniques qualification.  This unit is all about understanding visual management systems and how they can be used to improve the work environment.

banner: bit_u4_s1_p1_banner.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit, you will cover the following criteria of your Level 2 Certificate in Business Improvement Techniques qualification.

      You will:

      1. Understand visual management systems

      [View the complete set of learning outcomes for this unit.](/pdfs/v2l_bit_learning_outcomes_u4.pdf)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      
      * The purpose of a visual management system
      * Appropriate parts of a process or work area that would benefit from visual controls
      * The factors to be considered when selecting a visual management system
      * The visual management systems available to create ‘the visual workplace’
      * Elements that contribute to good visual management in the workplace
      * Appropriate visual indicators for parts of a process or work area
          answer: purposeful and relevant
        -
          sentence: Visual management should have an intuitive and simple design so the audience can understand it quickly and easily.
          answer: intuitive and simple design
        -
          sentence: Visual management should use appropriate colours to emphasise important information.
          answer: appropriate colours

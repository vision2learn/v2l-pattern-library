  -
  -
    title: Good visual management elements
    theme: t-bg-primary
    copy: |
      Good visual management in the workplace involves utilizing visual cues and displays to effectively communicate information, promote understanding, and support productivity. Here are some key elements that contribute to good visual management.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Purposeful and relevant information
          text: |
            Ensure that the visual displays convey information that is meaningful and aligned with the goals of the organisation. Avoid clutter and focus on essential information that helps employees understand their roles, tasks, and objectives.

            Regularly update visual displays to reflect the most recent information. Outdated or inaccurate information can lead to confusion and undermine the effectiveness of visual management. Set up mechanisms to review and update displays on a timely basis.

            Visual management should convey information quickly and clearly. Use concise text, symbols, and graphics to communicate essential messages without ambiguity.
          img: placeholder_icon.svg
        -
          title: Involve Team members and encourage continuous improvement
          text: |
            Engage employees in the creation and maintenance of visual management displays. By involving team members, you can gather diverse perspectives, improve accuracy, and increase ownership and commitment to the visual management process.

            Encourage a culture of continuous improvement by displaying improvement suggestions, feedback, or recognition visually. Utilise boards or displays that facilitate employee contributions, such as suggestion boards or recognition walls.

            Display key performance indicators (KPIs) or metrics related to productivity, quality, or safety to keep employees informed and engaged. Use visual displays like graphs, charts, or digital dashboards to highlight trends, targets, and actual performance.
          img: placeholder_icon.svg
        -
          title: Simple and intuitive design
          text: |
            Keep the design of visual displays simple, intuitive, and easy to understand. Use clear and concise language, uncluttered layouts, and intuitive symbols or graphics. A visually pleasing and user-friendly design facilitates quick comprehension and reduces the chances of misinterpretation.

            Arrange information hierarchically to guide the viewer's attention. Use size, color, and position to highlight important elements and create a logical flow of information.

            Establish consistent visual standards across the workplace to ensure uniformity and avoid confusion. Use standardized colors, symbols, and formats for different types of information.
          img: placeholder_icon.svg
        -
          title: Visual controls and instructions
          text: |
            Utilise visual cues to indicate the status, progress, or conditions of processes, equipment, or tasks. This can include visual indicators, such as color-coded labels, charts, or graphs, to provide immediate feedback and promote self-regulation.

            Display step-by-step instructions or standard operating procedures visually to facilitate easy comprehension and reduce errors. Use diagrams, photographs, or infographics to clarify complex procedures.

            Arrange tools, equipment, and supplies in a visually organised and easily accessible manner. Utilise visual cues like shadow boards, color-coded labels, or floor markings to ensure items are returned to their designated places.
          img: placeholder_icon.svg
        -
          title: Problem identification and Safety
          text: |
            Implement visual tools to identify and highlight problems or abnormalities quickly. For example, use Andon boards or visual alert systems to signal issues that require immediate attention, ensuring swift response and resolution.

            Promote workplace safety by using visual cues to indicate potential hazards, emergency procedures, and safety protocols. Clearly mark safety equipment, evacuation routes, and first aid stations with appropriate signage.
          img: placeholder_icon.svg
        -
          title: Customer focused approach
          text: |
            Consider the needs and expectations of customers when designing visual displays. Ensure that the information presented aligns with customer requirements, preferences, and quality standards. By emphasising a customer-centric approach, you can enhance service delivery and customer satisfaction.
          img: placeholder_icon.svg
    copy2: | 
      Remember, effective visual management should be tailored to the specific needs and context of your workplace. Regular evaluation and feedback from employees can help refine and improve visual management practices over time.

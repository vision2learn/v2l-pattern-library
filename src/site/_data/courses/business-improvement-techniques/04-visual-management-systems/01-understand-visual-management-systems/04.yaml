    title: Quick quiz
    copy: 
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Visual management should provide clear and concise information so the audience can easily understand the message being conveyed.
          answer: clear and concise
        -
          sentence: Visual management should provide purposeful and relevant information so it helps the audience to make better decisions.
          answer: purposeful and relevant
        -
          sentence: Visual management should have an intuitive and simple design so the audience can understand it quickly and easily.
          answer: intuitive and simple design
        -
          sentence: Visual management should use appropriate colours to emphasise important information.
          answer: appropriate colours
    theme: i-quiz

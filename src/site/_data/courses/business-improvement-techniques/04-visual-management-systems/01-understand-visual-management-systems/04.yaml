    title: Real-life visual indicators
    theme: t-bg-primary1a i-casestudy
    copy: |
      _Rewritten but original case studies from Lean - https://www.vision2learn.com/courses/lean-management/2/3/2_

      All businesses who wish to continually improve must focus on controlling **health** and **safety** as well as **quality**, **cost** and **delivery**. Effective visual indicators can help when it comes to the control and feedback of these five factors.

      However, in order to be effective, there should be a balance between visual and verbal indicators.

      Read the case studies on this page to see how this might work in real work environments.

    subInc: 
      type: accordion
      content:
        - 
          title: AlphaTech Industries
          copy: |
            At AlphaTech Industries, an assembly line dedicated to white goods faced delays due to the accessibility of a specific component. To address this issue, a practical solution was devised. 
            
            A square-shaped area was designated on the assembly floor, and initially marked off with tape before being permanently painted. This designated area was strategically placed in a safe location, ensuring both worker convenience and operational efficiency. The square was further divided into two halves, providing a visual cue for the assembly team. When one half of the square remained empty, it served as an indicator for the team to request additional component deliveries to replenish their work area. 
            
            Through comprehensive training, AlphaTech Industries' staff became familiar with the designated storage area and were aware that the necessary components were stored within it. This innovative approach will be subject to a thorough review in three months, allowing for necessary refinements and adjustments to be made as needed. AlphaTech Industries is committed to continuous improvement and adaptability in optimizing our assembly processes for enhanced productivity and customer satisfaction.
          img: /images/svg/ln/LM_U2_S3_P2_CaseStudy_1.svg
        - 
          title: HarvestTech Solutions
          copy: |
            At HarvestTech Solutions, a leading provider of farming equipment, occasional challenges arose concerning delivery times. Upon investigation, it was identified that the issue stemmed from inexperienced drivers and insufficient fuel management. The drivers would often wait until the petrol light illuminated before refueling, leading to complications when operating in remote country areas devoid of accessible petrol stations. 
            
            Recognising the importance of timely deliveries, HarvestTech Solutions implemented a proactive solution to address this problem. A comprehensive training program was introduced to educate drivers on fuel management best practices, emphasizing the significance of regular refueling to avoid running out of petrol during deliveries. Additionally, a proactive approach was adopted, instructing drivers to refuel before embarking on long-distance routes or entering remote areas. 
            
            By ensuring that all drivers are well-versed in efficient fuel management and pre-emptive refueling, HarvestTech Solutions aims to minimize delivery delays and optimize customer satisfaction.
          img: /images/svg/ln/LM_U2_S3_P2_CaseStudy_2.svg
        - 
          title: SwiftLine Productions
          copy: |
            At SwiftLine Productions, the assembly team faced challenges in monitoring and understanding their reject rates on a weekly basis. Due to the lack of clear visibility into their performance history, they struggled to recall previous week's outcomes and gauge their progress accurately. Additionally, the delayed feedback system meant that if a high reject figure was observed, it took a week to identify and address the underlying problem. 
            
            In an effort to foster a culture of continuous improvement and empower the team, SwiftLine Productions implemented a new approach. They introduced a weekly tracking system to plot the average reject figures over time, providing the team with a visual representation of their performance trends. This updated chart, displaying reject rates per week, was prominently displayed on the team notice board. As a result, the team gained valuable insights into their performance and were able to make informed adjustments to enhance their productivity and quality. 
            
            Building on this success, SwiftLine Productions further refined their feedback mechanism by transitioning to daily figures, enabling more frequent analysis and timely corrective measures. By leveraging this time series data, updated daily by the team leader, the company aimed to assess if more regular feedback could further improve overall performance. SwiftLine Productions remains committed to empowering its team members with transparent and actionable information to drive continuous improvement in their production line operations.
          img: /images/svg/ln/LM_U2_S3_P2_CaseStudy_3.svg

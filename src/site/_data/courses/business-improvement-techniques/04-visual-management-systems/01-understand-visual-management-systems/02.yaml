    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Case study - Compact Kitchen

      Compact Kitchen is a small company specialising in the manufacturing of small items for kitchens, such as kitchen utensils, gadgets, and storage containers. With a growing customer base and increasing demand for their products, the company aims to enhance productivity, improve quality, and ensure efficient workflow within their manufacturing processes.

    subInc: 
      type: accordion
      content:
        - 
          title: Challenges
          copy: |
            As Compact Kitchen expands its operations, they had several challenges related to process efficiency and standardisation. To address these challenges, the company aims to implement visual controls within their process workflow and work areas. The objectives include:
            1. Streamlining workstation organisation
            2. Enhancing Quality control
            3. Improving equipment operation and maintenance
            4. Visualising process sequencing
            5. Ensuring safety compliance
          img: /images/svg/placeholder_icon.svg
            

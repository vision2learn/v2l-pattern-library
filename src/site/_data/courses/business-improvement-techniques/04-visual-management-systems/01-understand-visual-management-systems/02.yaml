  -
    title: Visual Management Systems
    layout: media
    theme: t-bg-primary
    copy: |
      One of the first thing to consider when selecting a visual management system is the purpose. What are the goals? What do you wish to achieve with the visual management system? For example, is it needed to increase efficiency, improve communication, or reduce errors?

      A Visual Management System uses visual cues, such as charts, graphs, and signs, to make information easy to understand and help teams work more efficiently. It allows for quick communication, helps to identify problems, and promotes improvement.

    img: /images/svg/placeholder_icon.svg

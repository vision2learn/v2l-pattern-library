    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Case study - Physical 3D

      Through the implementation of visual controls in a dedicated work area, Physical 3D successfully improved process efficiency, quality control, equipment operation, workflow management, and safety compliance. By effectively utilising visual cues, the company enhanced organisation, productivity, and overall performance within their manufacturing and office processes and dedicated work areas.

    subInc: 
      type: accordion
      content:
        - 
          title: Results and benefits
          copy: |
            __Enhanced organisation and efficiency:__
            By using color-coded markings, labeled storage systems, and designated workstations, Physical 3D improved organisation, reduced clutter, and increased productivity. Operators can quickly locate tools and materials, leading to smoother workflow and reduced setup time.

            __Improved Quality Control:__
            Visual controls at quality checkpoints enabled operators to visually identify quality standards and promptly address any deviations. This resulted in improved product quality, reduced defects, and increased customer satisfaction.

            __Effective equipment operation and maintenance:__
            Equipment-specific visual controls, such as diagrams and instructions, helped operators operate machinery correctly and perform routine maintenance tasks. This led to increased equipment reliability, reduced downtime, and improved overall equipment effectiveness (OEE).

            __Streamlined process sequencing:__
            Visual controls, such as flowcharts or digital displays, provided operators with a clear visual representation of process sequencing. This minimised errors, improved task coordination, and facilitated efficient workflow management.

            __Enhanced safety awareness:__
            Visual controls, including safety signs, labels, and color-coded markings, heightened safety awareness among employees. Operators could easily identify safety procedures, equipment locations, and potential hazards, resulting in a safer working environment and reduced accident risks.

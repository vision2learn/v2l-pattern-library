    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Case study - Physical 3D

      In unit 3, Physical 3D did a great job of applying Kaizen techniques to improve efficiency and reduce errors in its assembly.  They are looking at how they can further enhance productivity, improve quality, and ensure efficient workflow within their manufacturing processes.  To do this they needed to identify where in their current process and/or work areas would benefit from visual controls.

    subInc: 
      type: accordion
      content:
        - 
          title: Challenges
          copy: |
            After further reviewing the assembly of the prosthetic hands, Physical 3D found several challenges related to process efficiency and standardisation. To address these challenges, the company aims to implement visual controls within a particular process workflow and dedicated work area. 

            First of all the company needed to:

            Identify which part of the process or work area would benefit from visual controls.
            
            The objectives include:
            1. Streamlining workstation organisation
            2. Enhancing Quality control
            3. Improving equipment operation and maintenance
            4. Visualising process sequencing
            5. Ensuring safety compliance
          img: /images/svg/bit/bit_u4_s1_p2_case_study.svg         

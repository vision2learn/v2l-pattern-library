title: Welcome to Unit 6
intro: |
    ### Flow process analysis
    
    Welcome to the sixth unit of your Level 2 Certificate in Business Improvement Techniques qualification.  This unit is all about understanding flow process analysis which includes how to map a process using symbols, value added and non-value added activities, improvements, and action plans.

banner: bit_u6_s1_p1_banner.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit, you will cover the following criteria of your Level 2 Certificate in Business Improvement Techniques qualification.

      You will:

      Understand flow process analysis

      [View the complete set of learning outcomes for this unit.](/pdfs/v2l_bit_learning_outcomes_u6.pdf)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn:
      
      * How to carry out flow process analysis
      * How to map out a process using recognised symbols
      * How to produce a process map using appropriate symbols and terminology within a given work area
      * About the difference between value added and non-value added activities
      * About value added and non-value added steps in the process and any waste that may occur
      * How to identify opportunities for improvements to the process
      * How to provide recommendations as to where improvements can be made
      * About the purpose of an action plan

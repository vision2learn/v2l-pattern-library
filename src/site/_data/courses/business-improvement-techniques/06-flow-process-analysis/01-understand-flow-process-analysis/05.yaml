    layout: media
    copy: |
      ### Purpose of an action plan

      By following an action plan, we can work together to make things better. We focus on important areas, set goals, make a plan, assign tasks, keep track of time, check our progress, and make changes if needed. This way, we can improve and make things even more efficient.

      Please see the following video to learn more.

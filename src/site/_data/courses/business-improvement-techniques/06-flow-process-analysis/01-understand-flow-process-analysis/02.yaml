    copy: |
      In your assessment you will be required to explain how to carry out flow process analysis.
  -
    title: Flow process analysis
    theme: t-bg-primary
    copy: |
      Flow process analysis involves studying and improving how things are done. Here are the steps to follow:
    subInc: 
      type: accordion
      content:
        - 
          title: 1. Understand the process
          copy: |
            Figure out what you want to analyze and who is involved. Think about the beginning and end of the process and what happens in between.
        - 
          title: 2. Draw a picture
          copy: |
            Make a diagram or flowchart to show the steps in the process. This helps you see the sequence of activities.
        - 
          title: 3. Get information
          copy: |
            Collect data about the process. You can watch how things are done, ask questions, or use tools to gather information.
        - 
          title: 4. Look for problems
          copy: |
            Study the process and see if there are any parts that are slow, inefficient, or not needed. Find out if there are things that can be improved.
        - 
          title: 5. Measure performance
          copy: |
            Measure how well the process is working. You can use numbers to see how long it takes, how many things get done, or how resources are used.
        - 
          title: 6. Find ways to improve
          copy: |
            Think of ideas to make the process better. It could be simplifying steps, removing unnecessary things, or using technology to make things faster.
        -
          title: 7. Try the solutions
          copy: |
            Pick the best ideas and give them a try. See if they work and make the process better. Keep an eye on how things are going and make adjustments if needed.
        -
          title: 8. Keep improving
          copy: |
            Keep an eye on the process even after making changes. Collect feedback and check if things are getting better. Make more improvements if necessary.
    copy2: Remember, flow process analysis is about finding ways to make things easier and more efficient. It's like solving a puzzle to make things work better!

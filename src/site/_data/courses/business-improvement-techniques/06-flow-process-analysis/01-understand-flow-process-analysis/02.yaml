title: Flow process analysis
intro: |
  On this page we will take a look at flow process analysis and how to map out a process using recognised symbols.
banner: bit_u6_s1_p2_banner.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to explain how to carry out flow process analysis.
  -
  -
    title: Flow process analysis
    theme: t-bg-primary
    copy: |
      Flow process analysis is a method used to analyse and understand the sequence of activities and interactions within a process. By visually mapping out the flow of a process and examining the relationships between different steps, flow process analysis provides valuable insights into process efficiency, bottlenecks, and opportunities for improvement. 

      It helps identify areas of waste, delays, or redundancies, enabling organizations to streamline operations, optimise resource utilisation, and enhance overall productivity. With a focus on understanding the movement of information, materials, or individuals through a process, flow process analysis is a powerful tool for enhancing process performance and driving continuous improvement. 

      The steps included with a flow chart maybe informative or directive: 

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Informative Flow Process Analysis
          text: |
            Informative Flow Process Analysis focuses on gathering information, mapping the sequence of activities, and identifying bottlenecks or inefficiencies. This results in the creation of process maps, flowcharts, and documentation that describe the current state of the process. It may also highlight areas of concern or improvement opportunities based on the gathered data. 

          img: bit_u6_s1_p2_slide1.svg
        -
          title: Directive Flow Process Analysis
          text: |
            Directive Flow Process Analysis aims to identify areas of improvement, streamline activities, and suggest changes for increased efficiency. This is a more proactive approach and includes a redesigned process flow, with specific recommendations for process improvement. It may include a new process map, revised standard operating procedures, or a proposed implementation plan for the suggested changes. 

          img: bit_u6_s1_p2_slide2.svg
  -
  -
    title: Steps
    theme: t-bg-primary
    copy: |
      The following steps are commonly found within flow process analysis. These may vary depending on the overall object with some analysis including either more or less steps. E.g. if multiple problems are discovered, there may be more steps included to measure and resolve these.
    subInc: 
      type: accordion
      content:
        - 
          title: 1. Understand the process
          copy: |
            Set out the purpose of the process analysis and define the boundaries and objectives of the analysis. Think about the beginning and end of the process and what happens in between. 
        - 
          title: 2. Identify Stakeholders
          copy: |
            Identify the key stakeholders who are involved in or affected by the process. Ensure their active participation throughout the analysis and redesign phases. 
        - 
          title: 3. Map the current process
          copy: |
            Create a visual representation of the process flow. This can be done using flowcharts, process maps, or other process modelling techniques. Document each step in the process, including decision points, loops, and feedback mechanisms 
        - 
          title: 4. Gather information
          copy: |
            Collect relevant information about the process. This can be done through various methods such as interviews, surveys, observations, and document reviews. The goal is to understand how the process currently operates and gather data on inputs, outputs, activities, decision points, cycle times, and any associated metrics. 
        - 
          title: 5. Analyse the current process
          copy: |
            Evaluate the current process to identify inefficiencies, bottlenecks, redundancies, delays, and any areas for improvement. Look for non-value-added activities, handoffs, unnecessary approvals, or other factors that hinder the process's efficiency. 
        - 
          title: 6. Set performance goals
          copy: |
            Define specific performance goals and metrics for the redesigned process. This could include targets for cycle time reduction, cost reduction, quality improvement, customer satisfaction, or any other relevant performance indicators. 
        -
          title: 7. Identify improvements
          copy: |
            Generate Redesign Ideas: Brainstorm and generate ideas for process redesign. Encourage creative thinking and explore different possibilities for optimizing the process. Consider automation, simplification, elimination of non-value-added activities, and resequencing of tasks. 
        -
          title: 8. Evaluate and select redesign options
          copy: |
            Evaluate the generated redesign ideas and select the most promising options for implementation. Assess each option based on feasibility, potential impact, risks, resource requirements, and alignment with the defined performance goals. 
        -
          title: 9. Develop implementation plan
          copy: |
            Create a detailed plan for implementing the redesigned process. Identify the necessary resources, responsibilities, timelines, and potential barriers to implementation. Develop a strategy for change management and communication to ensure smooth adoption of the new process. 
        -
          title: 10. Continuous improvement
          copy: |
            Informative flow process analysis is often part of a continuous improvement cycle. Encourage ongoing monitoring, measurement, and feedback to track the impact of implemented changes and identify further areas for improvement.

    copy2: Remember, flow process analysis is about finding ways to make things easier and more efficient. It's like solving a puzzle to make things work better.
  -
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to explain how to map out a process using __recognised symbols__.
  -
  -
    title: Mapping out a process
    theme: t-bg-primary
    copy: |
      Mapping out a process using recognised symbols is commonly known as process mapping or flowcharting. It's a visual representation of a sequence of steps, decisions, and interactions within a process. 
    subInc:
      type: slider
      title: Starting to map a process
      slides:
        -
          title: Identify the key steps
          text: |
            Break down the process into individual steps or activities. These steps should represent the major actions or decisions involved in completing the process.
          img: bit_u6_s1_p2_slide3.svg

        -
          title: Select appropriate symbols
          text: |
            Choose recognised symbols to represent different elements of the process. There are various symbols used in process mapping, and they have specific meanings.
          img: bit_u6_s1_p2_slide4.svg
        -
          title: Draw the process map
          text: |
            Using a software tool or pen and paper, start drawing the process map. Begin with the start symbol, then add the process/activity symbols, decision symbols, input/output symbols, and connectors as needed. Connect the symbols with arrows to show the flow of the process.

            Add relevant information to each symbol. This may include labels, descriptions, data inputs/outputs, decision criteria, and any other important details that clarify the process steps.
          img: bit_u6_s1_p2_slide5.svg
        -
          title: Review and refine
          text: |
            Review the process map for accuracy, clarity, and completeness. Ensure that the map accurately reflects the actual process and that it is understandable to others. Validate it with subject matter experts or stakeholders to confirm its accuracy.

            If necessary, make revisions to the process map based on feedback and further analysis. Refine the symbols, clarify the steps, or adjust the flow as needed.
          img: bit_u6_s1_p2_slide6.svg
        -
          title: Share it
          text: |
            Once the process map is finalised, share it with the relevant stakeholders or team members. Use it as a visual tool for discussions, process improvement, training, or documentation purposes.

            Remember, process mapping is a flexible technique, and there is no one-size-fits-all approach. Adapt the symbols and level of detail to suit your specific needs and audience.
          img: bit_u6_s1_p2_slide7.svg
    copy2: |
      Process mapping is a flexible technique, and there is no one-size-fits-all approach. Adapt the symbols and level of detail to suit your specific needs and audience.
  -
  -
    title: Symbols and terminology
    theme: t-bg-supporting3
    copy: |
      One popular method of process mapping is the creation of **flowcharts**. 

      A flowchart provides a method for mapping the interlinked activities and tasks that form a process. It can help organisations to detect any problems that occur in processes.

      Flowcharts work using symbols. Select each symbol below to learn more. 

    subInc: 
        type: reveal
        content:
          -
            title: Start or End flow
            copy: |
              Represents the beginning or end of the process. It is typically represented by a rounded rectangle or oval shape. Examples include:
              * Receive complaint
              * Receive request
              * Proposal

            img: bit_u6_s1_p2_reveal1.svg
          -
            title: Operation, Process or Activity
            copy: |
              Represents a specific action or task within the process. It is usually depicted as a rectangle with rounded corners. Examples include:
              * Hold a meeting
              * Make a phone call
              * Send a request
            img: bit_u6_s1_p2_reveal2.svg
          -
            title: Inspection
            copy: |
              The inspection symbol represents a step in the process where a quality check or inspection takes place. It is often depicted as a diamond-shaped symbol. 
            img: bit_u6_s1_p2_reveal3.svg
          -
            title: Storage
            copy: |
              Examples:
              * Store documents
              * stack envelopes
              * File contacts
            img: bit_u6_s1_p2_reveal4.svg
          -
            title: Transport
            copy: |
              The transport symbol represents the movement of materials, products, or information from one location to another. It is commonly depicted as an arrow or a line with an open arrowhead.
            img: bit_u6_s1_p2_reveal5.svg
          -
            title: Waiting
            copy: |
              The waiting symbol represents a pause or delay in the process where no active work is being done. It indicates a period of waiting for a resource, information, or completion of a preceding task. It is typically depicted as a half-circle or a dashed line.
            img: bit_u6_s1_p2_reveal6.svg
    copy2: Please note that these symbols can vary depending on the specific process mapping methodology or notation being used. The examples provided here are general representations commonly used in process flowcharts. 

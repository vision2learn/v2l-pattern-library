    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to explain how to map out a process using __recognised symbols__.
  -
  -
    title: Beginning the process (LEAN)
    theme: 
    copy: |
      Here you will be introduced to process maps. A process map is a **picture** of the sequence of steps in a process.
      
      Scroll through the slides below to learn more about mapping processes.
    subInc:
      type: slider
      title: Starting to map a process
      slides:
        -
          title: Symbols to represent
          text: It is possible to use different boxes or symbols to represent different types of activity or different steps.
          img: LM_U1_S3_p1_slide_start_1.svg

        -
          title: Pictures to describe
          text: Step-by-step pictures can be used to describe a workplace process as it currently operates or as it could operate in the future.
          img: LM_U1_S3_p1_slide_start_2.svg

        -
          title: Helps understanding
          text: This helps people to understand what is currently happening in a process and helps identify what needs to be done to make improvements. 
          img: LM_U1_S3_p1_slide_start_3.svg
        -
          title: Purpose of the process
          text: It is important to know that before starting to map a process you need to be clear about the **purpose** of the process. 
          img: LM_U1_S3_p1_slide_start_4.svg
        -
          title: Identifying output
          text: This means identifying the **output** (product or service) that the work process is designed for, who receives the outputs and understanding what happens to inputs (materials, information or documents).
          img: LM_U1_S3_p1_slide_start_5.svg
        -
          title: Clarity of flow
          text: The aim is to be clear about what is **flowing** through the process and to be able to follow this activity.
          img: LM_U1_S3_p1_slide_start_6.svg
  -
    title: Symbols and terminology (LEAN)
    theme: t-bg-supporting3
    copy: |
      One popular method of process mapping is the creation of **flowcharts**. 

      A flowchart provides a method for mapping the interlinked activities and tasks that form a process. It can help organisations to detect any problems that occur in processes.

      Flowcharts work using symbols. Select each symbol below to learn more. 

    subInc: 
        type: reveal
        content:
            -
                title: Start or End flow
                copy: |
                    Example:
                    * Receive complaint
                    * Receive request
                    * Proposal

                img: LM_U1_S3_p1_Symbol_StartEnd_1.svg
            -
                title: Process or activity
                copy: |
                    Example:
                    * Hold a meeting
                    * Make a phone call
                    * Send a request
                img: LM_U1_S3_p1_Symbol_Process_1.svg
            -
                title: Decision
                copy: |
                    Example:
                    * Yes / No
                    * Agree / Disagree
                    * Pass / Fail
                img: LM_U1_S3_p1_Symbol_Decision_1.svg
            -
                title: Document
                copy: |
                    Example:
                    * Report is completed 
                    * Meeting minutes 
                    * Form is filled out
                img: LM_U1_S3_p1_Symbol_Document_1.svg
            -
                title: Storage
                copy: |
                    Example:
                    * Store documents
                    * stack envelopes
                    * File contacts
                img: LM_U1_S3_p1_Symbol_Storage_1.svg
            -
                title: Database
                copy: |
                    Example:
                    * Stock files
                    * Order files
                    * Sales record
                img: LM_U1_S3_p1_Symbol_Database_1.svg
    
  -
    title: The flow chart process (LEAN)
    theme: t-bg-primary
    copy: |
      ### Main Steps

      1. Identify all of the key processes or activities. You may write these on cards or sticky notes.
      2. Sequence these processes on a large piece of paper.
      3. Work through the sequence from start to finish, identifying key decisions and resulting documentation.
      4. Finalise the sequence. Focus on links between processes, decisions and outputs.
      5. Produce the final flowchart, checking you’ve involved all key personnel.

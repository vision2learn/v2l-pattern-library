title: What did you learn? 
intro: Well done, you’ve now completed the first session of this unit! 
banner: summary.jpg
sections:
  -
    title: Summary
    theme: t-bg-primary i-summary
    copy: |
      In this session, you have learnt:
      * about the business need for problem identification and removal
      * about the benefits of adopting a formalised problem solving process
      * about the impact of unresolved problems
      * how to identify and verify the root cause of a problem
      * how to prevent reoccurrence of the problems
      * how to apply a structured approach to problem solving
  
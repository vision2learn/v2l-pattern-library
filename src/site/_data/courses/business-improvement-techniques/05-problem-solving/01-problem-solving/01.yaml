title: Welcome to Unit 5
intro: |
    ### Problem solving
    
    Welcome to the fifth unit of your Level 2 Certificate in Business Improvement Techniques.  This unit is all about problem solving. You will learn how to identify and solve problems using formalised problem solving processess, and how to identify and verify the root cause of a problem to prevent recurrence.

banner: placeholder.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit, you will cover the following criteria of your Level 2 Certificate in Business Improvement Techniques qualification.

      You will:

      1. Understand how to identify and solve problems

      [View the complete set of learning outcomes for this unit.](/pdfs/v2l_bit_learning_outcomes_u5.pdf)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn:
      
      * about the business need for problem identification and removal
      * about the benefits of adopting a formalised problem solving process
      * about the impact of unresolved problems
      * how to identify and verify the root cause of a problem
      * how to prevent reoccurrence of the problems
      * how to apply a structured approach to problem solving

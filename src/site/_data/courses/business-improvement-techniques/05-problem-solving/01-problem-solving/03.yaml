    title: Key point
    theme: t-bg-supporting2 i-keypoint
    copy: |
      In your assessment you will be required to explain how to identify and verify the root cause of a problem.
  -
  -
    title: Techniques to find the root cause of a problem
    theme: t-bg-primary
    copy: |
      To effectively solve a problem, it's important to find its root cause. This helps address the underlying source instead of just dealing with the symptoms. Several techniques can help uncover the root cause, such as the 5 Whys, Fishbone Diagram, Pareto Analysis, and Failure Mode and Effects Analysis (FMEA). These methods provide valuable insights and aid in developing targeted solutions for lasting results.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Brainstorming
          text: |
            This technique involves gathering a group of people to generate ideas and to identify the possible causes of a problem. It encourages open discussion and creative thinking, allowing for a broad range of ideas to be considered.
          img: placeholder_icon.svg
        -
          title: The 5 Whys
          text: |
            This technique involves asking a series of "why" questions to identify the underlying cause of the problem. By asking "why" repeatedly, the root cause can be uncovered.
          img: placeholder_icon.svg
        -
          title: Ishikawa diagrams
          text: |
            Ishikawa diagrams are also known as fishbone diagrams. These diagrams help identify possible causes of a problem by breaking down the issue into categories such as people, processes, materials, and equipment. This visual representation helps to identify the underlying causes of the problem.
          img: placeholder_icon.svg
        -
          title: Root cause paths
          text: |
            This method involves mapping out the sequence of events that led to the problem. By tracing the events back to their origin, the root cause can be identified.
          img: placeholder_icon.svg
        -
          title: Testing decisions
          text: |
            This method involves testing different scenarios to see which one leads to the problem. By systematically testing different factors, the root cause can be isolated.
          img: placeholder_icon.svg
        -
          title: Verification techniques
          text: |
            This method involves verifying the assumptions made during the problem-solving process. By testing the assumptions, the root cause can be confirmed or ruled out. This can include techniques such as data analysis, observation, and experimentation.
          img: placeholder_icon.svg
  -
  -
    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Case study - Physical 3D and the Iskikawa diagram

      Physical 3D faced a problem with their assembly line production process. The team wanted to find ways to make the process more efficient and improve productivity. They decided to use the Ishikawa diagram to help them identify the causes of the problem and come up with solutions.

      Physical 3D's assembly line production process was not running smoothly, causing delays and affecting the overall productivity. The company aimed to uncover the reasons behind these issues and find ways to make the production line more efficient.

    subInc: 
      type: accordion
      content:
        - 
          title: Solving the problem with the Ishikawa diagram
          copy: |
            To solve the problem, the team used the Ishikawa diagram, also known as the fishbone diagram. It helped them identify different categories of potential causes that could be contributing to the production issues. By organising their thoughts using this diagram, they hoped to find solutions.

            From using this technique, the team found potential causes, mapped the causes onto the diagram, analysed the diagram and made recommendations, implemented the solutions one by one, and tracked the results.  
            
            Physical 3D successfully addressed their production issues by using the Ishikawa diagram to identify causes and implement targeted solutions. Through their efforts, the company improved the efficiency of their assembly line production process, resulting in smoother operations and increased productivity.
          img: /images/svg/placeholder_icon.svg
        - 
          title: The 6Ms in Ishikawa diagram used in Manufacturing
          copy: |
            
            1. Manpower - Refers to the physical or mind/knowledge work of personnel. 
            2. Method - Refers to the production process. 
            3. Machine - Refers to all the equipment, tools, and facilities used for the production. 
            4. Material - Refers to the raw materials used for the production of a final product. 
            5. Medium (Environment) - Refers to the effect of unpredictable environmental factors such as weather, floods, humidity, etc. 
            6. Measurement - Refers to inspections and physical measurements such as volume or temperature, etc.

            ![](/images/banners/placeholder.jpg)

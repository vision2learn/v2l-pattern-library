      ### The impact of unresolved problems
      
      Unresolved problems can have various impacts on individuals and organisations. Let's explore some of these effects in the following video.
    video: bit_u5_s1_p3_unresolved_problems.mp4
  -
  -
    title: Quick quiz
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        Is the following statement true or false? "Unresolved problems can hinder productivity and efficiency.":
          answers:
            True: true
            False: false
          feedback: Unresolved problems can hinder productivity and efficiency. They create roadblocks and distractions, diverting attention and resources away from important tasks. As a result, work may be delayed, goals may be missed, and overall performance may suffer.
        What could possibly create tension and erode trust resulting in strained relationships at work?:
          answers:
            Teamwork: false
            Collaboration: false
            Communication breakdowns: true
          feedback: Problems left unresolved can strain relationships among team members, colleagues, or even with customers or clients. Communication breakdowns, misunderstandings, and unresolved conflicts can create tension and erode trust. This can negatively affect collaboration, teamwork, and the overall work environment.
        Select one option to complete the following sentence - "When ____________ linger without a solution, individuals may feel overwhelmed, anxious, and frustrated.":
          answers:
            negative issues: false
            unprofessionalism: false
            unresolved problems: true
          feedback: Unresolved problems can lead to increased stress levels. When problems linger without a solution, individuals may feel overwhelmed, anxious, and frustrated. This can negatively impact mental and emotional well-being, leading to decreased productivity and overall dissatisfaction.

    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Case study - American Express - using a formalised problem-solving process

      As we saw earlier "The Workforce Transformation Group" program allowed senior employees to enjoy their final years of work, share their knowledge, and facilitate the development of the current workforce. AMEX's program used a __formalised problem-solving process__, resulting in a successful job handoff strategy and yielded significant benefits. 
    
    subInc: 
      type: slider
      title:
      slides:
        - 
          title: Clear and simple steps
          text: |
            The program followed a clear and simple step-by-step process. Retiring employees had the option to transition gradually, reducing their workload over time. Simultaneously, they were encouraged to mentor and teach their successors, ensuring a smooth transfer of knowledge. This structured approach ensured that important aspects of the job handoff were not overlooked. 
          img: placeholder_icon.svg
        - 
          title: Informed decision-making
          text: |
            AMEX's program enabled retiring employees to make informed decisions about their retirement transition. They were provided with the opportunity to plan and design their phased retirement, balancing their desire for reduced responsibilities with the satisfaction of continuing to contribute through mentorship. This empowered them to make choices that aligned with their personal and professional goals. 
          img: placeholder_icon.svg
        - 
          title: Time-saving
          text: |
            The phased retirement option offered by the program allowed retiring employees to gradually reduce their workload, resulting in time savings. They could enjoy increased free time while still being engaged in the workforce through mentoring and teaching. This balanced approach ensured a smooth transition without abruptly losing the expertise and guidance of senior employees. 
          img: placeholder_icon.svg
        - 
          title: Consistent results
          text: |
            "The Workforce Transformation Group" program ensured consistent results in job handoffs. By following a structured process, retiring employees and their successors were guided through the transition, reducing the risk of critical knowledge gaps. The program fostered a consistent and reliable transfer of expertise, ensuring continuity and minimising disruption. 
          img: placeholder_icon.svg
        - 
          title: Teamwork and collaboration
          text: |
            AMEX's program emphasised teamwork and collaboration between retiring employees and their successors. By engaging retiring employees as mentors, the program encouraged knowledge sharing and collaboration with the current workforce. This created a supportive environment where experiences were exchanged, ideas were developed, and relationships were strengthened, leading to a more seamless transfer of skills and expertise.  
          img: placeholder_icon.svg
        - 
          title: Continuous improvement
          text: |
            The formalised program provided opportunities for continuous improvement. Retiring employees, as mentors, could reflect on their experiences and identify areas for enhancement in the job handoff process. This iterative learning allowed AMEX to refine and improve the program over time, resulting in increasingly effective knowledge transfer and mentorship practices. 
          img: placeholder_icon.svg
        - 
          title: Empowerment
          text: |
            By participating in the program, retiring employees felt empowered to take charge of their retirement transition. They could shape their final years of work by gradually reducing their responsibilities while providing guidance to their successors. This sense of empowerment increased their engagement and satisfaction, creating a positive and fulfilling end to their careers. 
          img: placeholder_icon.svg
        - 
          title: Long-lasting solutions
          text: |
            The program ensured long-lasting solutions by enabling the transfer of critical knowledge and skills to the current workforce. Through mentorship and teaching, retiring employees passed on their expertise, contributing to the development and success of the next generation of employees. This approach reduced the risk of knowledge loss and enhanced the organisation's capacity to address future challenges effectively. 
          img: placeholder_icon.svg
        
    copy2: |
      American Express' "The Workforce Transformation Group" program serves as a successful example of a __formalised problem-solving process__ in the context of job handoffs. By implementing a phased retirement option combined with mentoring and teaching responsibilities, AMEX effectively addressed the challenge of managing the departure of senior employees while ensuring knowledge transfer and continuity. 
      
      The program's clear steps, informed decision-making, time savings, consistent results, teamwork, continuous improvement, empowerment, and long-lasting solutions exemplify the benefits of a structured problem-solving approach. 

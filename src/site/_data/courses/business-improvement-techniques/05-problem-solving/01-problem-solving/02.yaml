title: Problem solving
intro: |
  On this page we take a look at the business need for problem identification and removal; and a formalised problem solving process.
banner: bit_u5_s1_p2_banner.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to describe the business need for problem identification and removal.
  -
  -
    title: The benefits for identifying and removing problems
    theme: t-bg-primary
    copy: |
      Identifying and removing problems is a critical business need that can impact the overall success and growth of a company.

      See below four reasons on why the identification and removal of a problem within a business is important:
    subInc: 
      type: slider
      title:
      slides:
        -
          title: Efficiency
          text: |
            Problems within a business can lead to inefficiencies that waste valuable time, resources, and money. By identifying and removing problems, companies can streamline processes and operations, which can lead to increased productivity and save costs.
            
          img: placeholder_icon.svg
        - 
          title: Customer satisfaction
          text: |
            Problems within a business can also negatively impact customer satisfaction. For instance, issues with product quality or customer service can lead to unhappy customers who may take their business elsewhere. By addressing these problems, companies can improve customer satisfaction, which can lead to positive word-of-mouth and repeat business.
            
          img: placeholder_icon.svg
        - 
          title: Compliance
          text: |
            Many industries have regulations and standards that businesses must comply with. Failure to comply with these requirements can result in fines, legal issues, and damage to the business's reputation. By identifying and removing problems that may lead to non-compliance, companies can avoid these consequences.
            
          img: placeholder_icon.svg
        - 
          title: Reputation
          text: |
            Problems within a business can damage its reputation, which can impact its ability to attract and retain employees and customers. By addressing issues quickly and effectively, companies will keep a positive reputation and build trust with stakeholders, customers, employees, and investors.
        
          img: placeholder_icon.svg
  -
  -
    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Case study - American Express - Retiring Employees

      When retirees depart, they take with them years of experience and expertise, leaving businesses without that vital information. However, American Express has devised a solution to this problem.

    subInc: 
      type: accordion
      content:
        - 
          title: The Workforce Transformation Group
          copy: |
            American Express launched a program called "The Workforce Transformation Group" that allowed retiring employees to gradually reduce their daily responsibilities. In exchange, these employees spend some of their time mentoring and teaching their successors. This program offers a phased retirement option, allowing employees to leave their jobs gradually, enjoy more free time, and still receive a portion of their previous salary and benefits. 
            
            As a result, some individuals continue working beyond the traditional retirement age. AMEX considers this program successful because it allows senior employees to enjoy their final years of work while also educating the current workforce for future success. Consultant David DeLong praises this program as an excellent example of how job handoffs should be done.

          img: /images/svg/placeholder_icon.svg

title: Problem solving
intro: |
  On this page we take a look at the business need for problem identification and removal; and a formalised problem solving process.
banner: placeholder.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to describe the business need for problem identification and removal.
  -
  -
    title: The business need to identify and remove problems
    theme: t-bg-primary
    copy: |
      _Identifying and removing problems is a critical business need that can impact the overall success and growth of a company._

      See below four reasons on why the identification and removal of a problem within a business is important:
    subInc: 
      type: slider
      title:
      slides:
        - 
          title: Efficiency
          text: |
            _Problems within a business can lead to inefficiencies that waste valuable time, resources, and money. By identifying and removing problems, companies can streamline processes and operations, which can lead to increased productivity and save costs._
            
          img: placeholder_icon.svg
        - 
          title: Customer satisfaction
          text: |
            _Problems within a business can also negatively impact customer satisfaction. For instance, issues with product quality or customer service can lead to unhappy customers who may take their business elsewhere. By addressing these problems, companies can improve customer satisfaction, which can lead to positive word-of-mouth and repeat business._
            
          img: placeholder_icon.svg
        - 
          title: Compliance
          text: |
            _Many industries have regulations and standards that businesses must comply with. Failure to comply with these requirements can result in fines, legal issues, and damage to the business's reputation. By identifying and removing problems that may lead to non-compliance, companies can avoid these consequences._
            
          img: placeholder_icon.svg
        - 
          title: Reputation
          text: |
            _Problems within a business can damage its reputation, which can impact its ability to attract and retain employees and customers. By addressing issues quickly and effectively, companies will keep a positive reputation and build trust with stakeholders, customers, employees, and investors._
            
          img: placeholder_icon.svg
  -
  -
    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Case study - American Express - Retiring Employees

      _Case study of a problem and how it was identified and resolved_

      _Example:_

      _When retirees depart, they take with them years of experience and expertise, leaving businesses without that vital information. However, American Express has devised a solution to this problem._

    subInc: 
      type: accordion
      content:
        - 
          title: The Workforce Transformation Group
          copy: |
            _American Express initiated a pilot program called The Workforce Transformation Group, which enables retiring employees to gradually relinquish some of their daily responsibilities. In return, these individuals spend some of their time mentoring and teaching classes to their successors._
      
            _This approach results in a phased retirement, allowing employees to exit gradually and enjoy more free time while still receiving a portion of their previous salary and standard benefits. Consequently, some individuals continue working for a year or more beyond the traditional retirement age._
            
            _AMEX considers this program a success since it permits senior employees to enjoy their last years of work while educating the existing workforce for future triumphs. Consultant David DeLong commends this program, citing it as an exemplar of how job handoffs ought to function._

            _Research source: https://www.onlinecollege.org/2011/10/03/20-classic-case-studies-every-business-student-should-know/_

          img: /images/svg/placeholder_icon.svg

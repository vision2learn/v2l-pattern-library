    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to describe the benefits of adopting a formalised problem solving process.
  -
  -
    title: A formalised problem-solving process
    theme: t-bg-primary
    copy: |
      Having a formalised problem-solving process can be really helpful. Let's see why: 
    subInc: 
      type: accordion
      content:
        - 
          title: Easy steps
          copy: |
            It gives us a clear and simple way to solve problems. We follow the steps one by one to make sure we don't miss anything important. 
        - 
          title: Better choices
          copy: |
            With a structured process, we can think carefully about our options and make smart decisions. We gather information, look at different possibilities, and choose the best solution. 
        - 
          title: Saves time
          copy: |
            Following a process helps us work faster and smarter. We know what to do and when to do it, so we don't waste time figuring things out. This means we can solve problems quicker and move on to other things. 
        - 
          title: Gets the same results
          copy: |
            When we use the same process every time, we get consistent results. This means we can trust that our solutions will work well. It helps us feel confident and know what to expect. 
        - 
          title: Teamwork and sharing
          copy: |
            Using a problem-solving process helps us work better with others. We can work together, share ideas, and help each other find solutions. It's like being on a team where everyone has a role to play. 
        - 
          title: Always getting better
          copy: |
            When we have a process, we can learn from our mistakes and make improvements. We look back at what we did and find ways to do it even better next time. This helps us grow and become better problem solvers. 
        - 
          title: Taking charge
          copy: |
            Having a process makes us feel in control. We can take charge of the problem and find our own solutions. It helps us feel more confident and responsible for finding answers. 
        - 
          title: Long-lasting solutions
          copy: |
            The process helps us find solutions that last. Instead of just fixing the problem for now, we look for the main cause and solve it. This way, the problem is less likely to happen again. 
        
    copy2: So, having a formalised problem-solving process is like having a map that guides us to find the best solutions. It helps us make good choices, work well with others, and keep getting better at solving problems. 

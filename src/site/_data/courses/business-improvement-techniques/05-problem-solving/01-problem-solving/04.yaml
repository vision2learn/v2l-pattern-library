title: Apply a structured approach to problem solving
intro: |
  On this page we will look at how to apply a structured approach to solve a problem.
banner: placeholder.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to apply a structured approach to problem solving.
  -
    title: A structured approach to problem solving
    theme: t-bg-primary
    copy: |
      _A structured approach to problem solving is essential in identifying, analyzing, and resolving business problems effectively._
      
      _A structured approach to problem-solving helps businesses to identify, analyze, and resolve problems in a systematic and effective manner. It enables them to make informed decisions and take actions that result in positive outcomes._

      _See below for an example of a structured approach to problem solving:_
    subInc: 
      type: accordion
      content:
        - 
          title: 1. Identify the problem
          copy: |
            _The first step is to identify the problem that needs to be solved. For example, a company may identify a decline in sales revenue or a decrease in customer satisfaction._
        - 
          title: 2. Gather information
          copy: |
            _Once the problem is identified, gather relevant data and information to understand the problem thoroughly. For instance, the company may conduct surveys to understand why customers are not satisfied or analyze sales data to identify the root cause of revenue decline._
        - 
          title: 3. Define the problem
          copy: |
            _Based on the information gathered, define the problem precisely. This helps to avoid confusion and ensures that everyone involved in the problem-solving process has a clear understanding of the problem. For instance, the company may define the problem as "The decline in sales revenue is due to a decrease in customer loyalty caused by poor customer service."_
        - 
          title: 4. Develop potential solutions
          copy: |
            _Brainstorm potential solutions to address the defined problem. For instance, the company may consider improving customer service by providing staff training, enhancing online customer support, or offering loyalty programs._
        - 
          title: 5. Evaluate potential solutions
          copy: |
            _Evaluate the potential solutions based on the feasibility, impact, and costs associated with each solution. For example, the company may consider the cost of training staff, the impact of loyalty programs on sales, and the feasibility of implementing online customer support._
        - 
          title: 6. Implement the chosen solution
          copy: |
            _Once a solution is selected, implement it with a plan to measure its effectiveness. For instance, the company may monitor customer satisfaction levels and sales revenue to measure the impact of its new loyalty program._
        - 
          title: 7. Monitor and adjust
          copy: |
            _Monitor the implemented solution regularly and adjust as needed to ensure it is effective in resolving the problem._

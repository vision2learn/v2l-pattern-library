    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Case study - Sweet Delights

      See below to see what changes __Sweet delights__ made to prevent the problem from reoccurring, 
    subInc: 
      type: accordion
      content:
        - 
          title: Changes
          copy: |
            The bakery invested in a tracking system that allowed customers to monitor their orders in real-time. This way, customers could see when their deliveries were on the way and expected to arrive. The bakery also provided additional training to the delivery team to ensure they were familiar with the routes and customer requirements.

            Mrs. Eclair and her team regularly monitored the delivery process to check if the plan was working. They reviewed feedback from customers and made adjustments as needed. By keeping a close eye on the delivery service, they were able to address any emerging issues promptly and find solutions.
            
          img: /images/svg/placeholder_icon.svg
        - 
          title: Results
          copy: |
            The results were remarkable. Customers started receiving their orders on time and with greater accuracy. The number of complaints decreased significantly, and positive feedback began pouring in. Sweet Delights' reputation improved, and more customers started ordering from them.

            The successful resolution of the delivery problem had a lasting impact on the bakery. It not only improved customer satisfaction but also increased their loyalty. The bakery became known for its reliable and efficient delivery service, which attracted more customers and boosted sales.
            
          img: /images/svg/placeholder_icon.svg

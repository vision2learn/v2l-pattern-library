    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### High employee turnover

      _A common business problem is high employee turnover, which can result in lost productivity, decreased morale, and increased costs associated with hiring and training new employees. A structured approach can help to identify the underlying causes of high employee turnover and develop effective solutions to address the problem._

      _Here is an example of how a structured approach was used to address high employee turnover._
    subInc: 
      type: accordion
      content:
        - 
          title: Seven steps to solve the problem
          copy: |
            1. Identify the problem: A company identified high employee turnover as a significant problem affecting its productivity and bottom line.
            2. Gather information: The company conducted exit interviews and surveyed current employees to gather data on the reasons for turnover. They also analysed hiring and onboarding processes, employee engagement levels, and compensation and benefits packages.
            3. Define the problem: Based on the information gathered, the company defined the problem as "High employee turnover is due to a lack of career development opportunities and inadequate compensation and benefits packages."
            4. Develop potential solutions: The company brainstormed potential solutions, including implementing a career development program, improving employee benefits, and conducting regular employee engagement surveys.
            5. Evaluate potential solutions: The company evaluated each potential solution based on feasibility, impact, and cost. They decided to implement a career development program and improve employee benefits, which they believed would have the most significant impact on employee retention.
            6. Implement the chosen solution: The company implemented a career development program that included training, mentoring, and coaching opportunities for employees. They also improved employee benefits by offering health insurance, retirement plans, and additional paid time off.
            7. Monitor and adjust: The company monitored employee turnover rates and conducted regular employee engagement surveys to measure the effectiveness of the new programs. They adjusted the programs as needed based on employee feedback.
            
          img: /images/svg/placeholder_icon.svg
    copy2: As a result of this structured approach, the company was able to reduce employee turnover, improve productivity and morale, and save costs associated with hiring and training new employees.

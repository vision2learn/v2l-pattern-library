    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Case study - Sweet Delights

      A small bakery called Sweet Delights had a problem with their delivery service. Many customers complained that their orders arrived late or were sometimes incorrect. This caused frustration and affected the bakery's reputation.

      The bakery's owner, Mrs. Eclair, realised the seriousness of the problem and decided to take action. She gathered her team and implemented a formalised problem-solving process.

    subInc: 
      type: accordion
      content:
        - 
          title: A formalised problem-solving process
          copy: |
            First, they identified the root causes of the delivery issues. They discovered that the bakery's delivery schedule was not well-organised, leading to delays and mix-ups. Additionally, there was a lack of communication between the bakery and the delivery team.

            With the causes identified, Mrs. Eclair and her team created a plan. They established a clear delivery schedule and assigned specific responsibilities to each team member involved in the process. They also implemented a communication system to keep everyone updated on any changes or special requests.
            
          img: /images/svg/placeholder_icon.svg

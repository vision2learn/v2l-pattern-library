title: How to work safely
intro: |
  In this session you will develop your understanding of how to work safely and effectively as part of a team. 
  
  You will also learn about regulations, safe working practices and procedures that apply to a work area, and be able to identify hazards and risks and how they can be reduced.
banner: placeholder.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to describe the specific regulations, safe working practices and procedures that apply to a work activity 
  -
    title: Introduction
    theme: t-bg-primary
    copy: |
      All workplaces must adhere to certain regulations. To do this they must have safe working practices and procedures in place. Some of these will be very familiar to you e.g. Health and Safety.  To understand what the difference is between regulations, safe working practices and procedures, you can think about the overall legislation which is The Health and Safety at Work Act 1974. This tells employers what they must do, it’s then up to the employer to ensure that their staff comply. Safe working practices are what’s done day to day by everone, often they will have a writtten procedure for all staff to follow.  
  
  -
    title: Health, safety and wellbeing
    theme: t-bg-supporting3
    copy: |
      Health, safety and wellbeing is a vital aspect in our daily lives, and it is taken very serious in the workplace through laws and regulations aimed at protecting employers, employees, visitors, customers and public at large. lets take a look at some key reasons why health and safety is important.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Key reasons
          text: |
            **Legal** &rarr; Employer and employee have a legal responsibility to minimise and eliminate hazards and unsafe practices that could cause injuries or death.

            **Morale** &rarr; The physical harm to any employee; resulting in pain, suffering, potential loss of future earning capacity, and high staff turnover from low morale

            __Financial__ &rarr; Not operating safely can seriously affect the balance sheet and profitability of an organisation.



          img: placeholder_icon.svg
        -
          title: What does it Mean?
          text: |
            Under health and safety law, every employer must ensure, so far as reasonably practicable, the health and safety of all their employees and others who could be affected by their business.

             __Health__ &rarr; No illness or risk of illness due to working conditions. 

             __Safety__ &rarr; No injury or accident or risk of accident or death due to work.

             __Welfare__ &rarr; Good working conditions – washing, toilets, rest breakout area, refreshment facilities, ventilation etc.

             __Environment__ &rarr; Controlling pollution to the air, water and land.


          img: placeholder_icon.svg
        -
          title: Main ‘Employer’ Health and Safety Responsibilities
          text: |
            There may be specific measures that your employer shall need to provide protection for you and others against any risks arising from the particular work being carried out, the environment being worked in or the tools, materials or equipment being used. Under the __Health and Safety at Work Act (HASAWA)__, the ‘employer’ must cover the following:

            __Risk Assessment__ &rarr; Assess the risks to your health and safety and take action to minimise or remove the risks identified, making the workplace safe. 

            __Standards__ &rarr; Set up safe working practices, mitigating any risk identified in the health and safety risk assessment and ensure these are followed.
          
            __Training__ &rarr; Provide you with health and safety training you need to do your job.

            __Protective Equipment__ &rarr; Provide you with any personal protective equipment (PPE) clothing free of charge and ensure it is properly looked after and stored. 

            __Safety Representative__ &rarr; Appoint somebody competent to assist with health and safety responsibilities.

            __Hazard Awareness__ &rarr; Tell you about any potential hazards, ensuring chemicals and other substances are handled and stored safely in accordance with instructions.

            __Welfare facilities__ &rarr; Provide adequate first-aid facilities and break out area, e.g. toilets, washing rest and refreshment facilities.

            __Emergency Procedures__ &rarr; Set up emergency procedures, with clear signage, together with HSE or local authority reporting processes of injuries and dangerous occurrences

          img: placeholder_icon.svg
        -
          title: What about employee responsibilities?
          text: |
            Health and safety is about preventing you getting injured or ill through work tasks. Your employer is responsible for health and safety provision and management, but you have a legal obligation to help too. Your responsibilities include:

            &rarr; Take reasonable care for your own health and safety and that of others who may be affected by what you do or don’t do.

            &rarr; Co-operate with your employer on health and safety.

            &rarr; Correctly use work items provided by your employer including personal protective equipment, in accordance with training or instructions.

            &rarr; Not to interfere with or misuse anything provided for your health, safety, or welfare.

            &rarr; Report any accidents or near misses as they happen.

          img: placeholder_icon.svg
        -
          title: 
          text: |
          
          img: placeholder_icon.svg   
         
  -
    title: Reveals
    theme: t-bg-primary
    copy: |
     There are many pieces of legislation in place to help keep the workplace as safe possible. The ones that are relevant to you will depend on the type of work you do, but let’s take a look at some of the most common:

    subInc: 
      type: reveal
      content:
        -
          title: MHSWR
          copy: |
            Management of Health and Safety at Work Regulations 1999 - Covers risk assessments in the workplace 
          img: placeholder_icon.svg
        -
          title: WHSWR
          copy: |
            Workplace (Health, Safety and Welfare) Regulations 1992 - Covers slipping and tripping hazards such as trailing cables, floor cleaning and spillages
          img: placeholder_icon.svg
        -
          title: MHOR
          copy: |
            Manual Handling Operations Regulations 1992 - Covering manual lifting practices and mechanical lifting aids.
          img: placeholder_icon.svg
        -
          title: EAWR
          copy: |
            Electricity at Work Regulations 1989 - Covers making sure electrical equipment is safe to use, applies to all aspects of the use of electricity within the workplace.
          img: placeholder_icon.svg
        -
          title: DSE
          copy: |
            Health & Safety (Display Screen Equipment) Regulations 1992 (2002) - Covers making sure electrical equipment is safe to use, applies to all aspects of the use of electricity within the workplace.
          img: placeholder_icon.svg
        -
          title: WAHR
          copy: |
            Work at Height Regulations 2005 - covers falls from height including stepladders and lifting equipment.
          img: placeholder_icon.svg
        -
          title: COSHH
          copy: |
            Control of Substances Hazardous to Health Regulations 2002 - Regulations require employers to control exposure to substances that can harm workers health.
          img: placeholder_icon.svg
        -
          title: PPE
          copy: |
            Personal Protective Equipment Regulations 2002 - As required, employers must provide personal protective equipment to reduce the risk of injury free of charge.
          img: placeholder_icon.svg  
        -
          title: RIDDOR
          copy: |
            Reporting of Injuries, Diseases & Dangerous Occurrences Regulations 1995 - Requires employers, self-employed and those in control of premises to report specified workplace incidents to the HSE or Local authority. 
          img: placeholder_icon.svg               

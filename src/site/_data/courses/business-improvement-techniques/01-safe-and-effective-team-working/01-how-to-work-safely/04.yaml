title: Workplace hazards and risks
intro: |
  On this page you will learn about
  * The difference between hazards and risks
  * How to identify hazards and risk
  * How to reduce hazards and risks
banner: bit_u1_s1_p4_banner.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to explain what constitutes a hazard and what constitutes a risk in the workplace.
  -
    title: Workplace hazard
    layout: media
    theme: t-bg-primary
    copy: |
      The meaning of the word hazard can be confusing. Often dictionaries do not give specific definitions or combine it with the term "risk". For example, one dictionary defines hazard as "a danger or risk" which helps explain why many people use the terms interchangeably. There are many definitions for hazard but the most common definition when talking about workplace health and safety is:

      A __hazard__ is any source of __potential__ damage, harm or adverse health effects on something or someone, (for example, to people as health effects, to organizations as property or equipment losses, or to the environment). 

      So what about Risks?
      A __risk__ is the __chance__ or __probability__ that a person will be harmed or experience an adverse health effect if exposed to a hazard. It may also apply to situations with property or equipment loss, or harmful effects on the environment. 
    img: /images/svg/bit/bit_u1_s1_p4_image1.svg

  -
    title: Quick quiz
    theme: i-quiz
    copy: Remember the case study on page 3, where Sonia found some boxes on the stairway? If not, go back and refresh your memory, then answer the following questions.
    subInc:
      type: quick-quiz
      content:
        In this Scenario the hazard is:
          answers:
            The stairs are not used often: false 
            Sonia is using the wrong exit to leave the building: false
            Boxes on the stairs: True
        The risk is:
          answers:
            The boxes might fall: false
            Someone using the stairs might trip on the boxes: false
            The boxes could block the access in an emergency: false
            All of the above: true

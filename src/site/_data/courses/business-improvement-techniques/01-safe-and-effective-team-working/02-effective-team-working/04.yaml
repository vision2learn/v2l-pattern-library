title: What did you learn? 
intro: Well done, you’ve now completed the second session of this unit! 
banner: summary.jpg
sections:
  -
    title: Summary
    theme: t-bg-primary i-summary
    copy: |
      In this session, you have learnt about:
      * The characteristics of an effective team 
      * The factors that contribute to effective team working
      * The importance of creating and maintaining effective working relationships 
      * How the principle of team role theory is used in team building
      * The types of problem that can occur with working relationships
      * The actions that can be taken to deal with specific problems in working relationships 
      * The importance of sharing knowledge, information and performance measures with other people in the team and with other groups

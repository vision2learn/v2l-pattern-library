    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to describe the importance of creating and maintaining effective working relationships.
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Effective working relationships

      When describing the importance of creating and maintaining effective working relationships, learners could consider the benefits of doing so and the consequences of ineffective working relationships. Lets take a look at the importance of creating and maintaining effective working relationships in the following video.
    video: bit_u1_s2_p1_effective_working_relationships.mp4
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        Think of a time or situation when it was important to you to create and maintain an effective working relationship. Make some notes on how well (or not) the working relationship worked, and what you would do differently taking in consideration the points raised in the above video.
  -
  -
    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Physical 3D - New contract

      Physical 3D have recently won a new contract and are expanding their products to provide some medical devices, starting with 3D printed hands. They gather their best designers and engineers together with the shared aim of producing a hand suitable for the new client’s requirements. 
    subInc: 
      type: accordion
      content:
        - 
          title: Working as a team
          copy: |
            Because everyone has the same goal – developing the 3D printed hand – this is an example of a team. 
            
            The team work well together, each member has an assigned role, they know what they need to do, and there is a team leader that ensures everyone is kept up to date with the whole team’s progress. 
            
            Small problems are dealt with quickly and trust between the team members is quickly established.
            
          img: /images/svg/bit/bit_u1_s2_p1_image2.svg
  -
  -
    title: Personal professional development & developing relationships 
    layout: media
    theme: t-bg-primary1b
    copy: |
      On this page we’ve considered the importance of developing relationships within the workplace. We can see how good relationships help teams and individuals work towards their objectives, enjoy their work and allow everyone to develop. In the video we see how negative attitudes bring difficulties and prevent progress. We can therefore conclude that developing positive relationships are beneficial to everyone and can aid you to achieve your personal goals.

    img: /images/svg/placeholder_icon.svg

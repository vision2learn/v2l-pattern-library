  -
    title: Quick quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Conflict within a team could occur if there are personality clashes, internal rivalry, or philosophical differences.
          answer: Conflict
        -
          sentence: If a team member is withholding information this could cause problems if the other team members are trying to complete the project with incomplete information.
          answer: withholding information
        -
          sentence: A lack of trust could break down a team as it threatens productivity and slows down communication.
          answer: lack of trust
        -
          sentence: Poor communication can lead to a lack of understanding between team members and misunderstandings could happen.
          answer: Poor communication
    theme: i-quiz
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        Think of a time when you were in a team (work or personal) where there was a problem or a challenge.  Make some notes on how you dealt with it at the time, and what you would do differently now taking the above information into consideration.

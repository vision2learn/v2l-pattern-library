    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Case study - Physical 3D

      When the new development team at Physical 3D was initially formed, they each spent time completing the Belbin team roles questionnaire. This informed the team leader, Ash of each individual’s strengths and weaknesses and helped her to understand which roles were best suited to each person. 
    subInc: 
      type: accordion
      content:
        - 
          title: The results
          copy: |
            Some people came out as expected e.g. Ash herself as team worker and co-ordinator, which are both good for a team leader. The results also showed that Ash isn’t so good as a resource investigator or plant which are useful qualities for a team leader. 
            
            The information allowed Ash to understand who else in the team is strong in these areas. She was then able to utilise their strengths to help the innovation within the team. 
            
            This helped the team remain successful and allowed the individuals to feel valued as they could contribute to the team using their strengths.
          img: /images/svg/placeholder_icon.svg

title: Team roles
intro: |
  On this page you will learn about Belbins team role theory and the importance of sharing knowledge, information and performance measures with other people in the team and with other groups. 
banner: placeholder.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to explain how the principle of team role theory is used in team building
  -
    title: Team roles
    layout: media
    theme: t-bg-primary
    copy: |
      Understanding each individuals strengths and weakness can help a team work more effectively, reduce conflict and achieve a better result for the team. It helps to allocate the right task to the right person e.g. there’s no point in expecting an introvert that dislikes communicating with clients the role of client liaison, this is better suited the person that has strong communication skills. Likewise by knowing who the **Completer Finisher** is, this person can work best on the finer detail of the task leaving the initial ideas and creativity to the **Resource Investigator**.

    img: /images/svg/placeholder_icon.svg
  -
  -
    title: Belbin Roles
    theme: t-bg-supporting2
    copy: |
     The roles named here are part of Belbin’s Theory of Teamwork. You can read more about each of the 9 roles below: 
    subInc: 
      type: accordion
      content:
        - 
          title: Resource investigator 
          copy: |
            Excels in research and coming up with new ideas. They can be good problem solvers and help team to keep innovation flowing for the team 
            
          
        - 
          title: Teamworker 
          copy: |
            Like to keep everyone in the team happy and working together harmoniously. They are keen to avoid and resolve conflicts, often putting other people’s needs before their own.
            
          
        - 
          title: Co-ordinator
          copy: |
            Good at managing people and keeping the team working towards their goals. They are calm and can successfully identify which people fit each task/situation and help to delegate support when needed
            
        - 
          title: Plant 
          copy: |
            Known as creative lateral thinkers, plants are very creative and a good source of inspiration for a team that needs new direction. They’re the person to solve problems.
            
          
        - 
          title: Monitor evaluator 
          copy: |
            A logical thinker that uses strategy to make objective decisions. Focusing on facts they can make realistic decisions that fit with the long term goal of the project.
            
          
        - 
          title: Specialist 
          copy: |
            As an expert in their field, they may be brought into a project as a consultant for a period of time, rather than be a long-term team member. They are highly focused and can offer specific advice and ideas based on their knowledge and experience. 


        - 
          title: Shaper
          copy: |
            A driver that likes to keep the project moving forward, ensuring that deadlines are met. They enjoy a challenge and are optimistic with a positive attitude that can overcome obstacles. 

        -
         
          title: Implementer
          copy: |
            Is very organised and a good planner, they focus on the practical elements of the project, ensuring that everyone can follow the action plan with clear direction.  
        -
          title: Complete finisher 
          copy: |
            Most important at the end of the project, they ensure that there are no errors in the project and that all tasks are completed to the correct standards.  
        

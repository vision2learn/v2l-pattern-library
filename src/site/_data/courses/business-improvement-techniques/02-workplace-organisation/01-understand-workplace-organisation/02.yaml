title: Principles and techniques in the workplace - NOT FOR REVIEW - WORK IN PROGRESS
intro: |
 On this page you will learn about the principles and techniques that support workplace organisation and the benfits of having an organised workplace environment.
banner: placeholder.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to explain the principles and techniques of workplace organisation.
  -
    title: Workplace organisation
    layout: media
    theme: t-bg-primary
    copy: |
      Workplace organisation is important for any business because it can directly impact the safety, health, and well-being of employees, as well as the efficiency and productivity of a business. A well-organised workplace can help reduce the risk of accidents, minimize the spread of illnesses, and prevent injuries. It can also make it easier for employees to locate tools and equipment, reduce clutter, and increase morale. By establishing clear processes and procedures, workplace organization can also help improve communication, reduce confusion, and prevent errors.

    img: /images/svg/placeholder_icon.svg
  -
    title: Principles and techniques of workplace organisation
    theme: t-bg-supporting2
    copy: |
      Workplace organisation involves the arrangement of resources, tools, and equipment in a way that promotes efficiency, safety, and productivity. Lets take a look at some of the principles and techniques of workplace organisation:

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Layout and design
          text: |
            The layout and design of the workplace should be designed to optimize the flow of materials and people. This can be achieved through the use of flow diagrams and process mapping, which helps to identify inefficiencies and bottlenecks in the workflow.
          img: placeholder_icon.svg
        -
          title: 5S principles
          text: |
            5S is a workplace organisation methodology that includes five key principles: Sort, Set in Order, Shine, Standardize, and Sustain. The 5S principles involve decluttering, cleaning, organizing, and labeling the work environment. It helps to create a clean and orderly workplace that is safe and easy to navigate.
          img: placeholder_icon.svg
        -
          title: Standardisation
          text: |
            Establishing standard procedures for tasks, processes, and equipment helps to ensure that everyone is working with the same information and following the same procedures. This can help to reduce errors, improve efficiency and safety.
          img: placeholder_icon.svg
        -
          title: Kanban
          text: |
            Kanban is a workplace organisation technique that is used to control the flow of materials and equipment. It involves the use of cards, boards, or electronic systems to signal when a new batch of materials is needed. This can help to minimize waste and improve the flow of materials.
          img: placeholder_icon.svg  
        -
          title: Visual management
          text: |
            Visual management is a technique that uses visual cues, such as signs, labels, or color-coding, to communicate information and instructions. This can help to improve communication and reduce errors in the workplace.
          img: placeholder_icon.svg
        -
          title: Employee involvement
          text: |
            Employee involvement is critical to the success of workplace organisation. By involving employees in the process of organizing their own workspaces, they will take ownership and be more motivated to maintain a safe and productive environment.
          img: placeholder_icon.svg  
  -
  -
    title: The 5C/5S technique
    theme: t-bg-supporting3
    copy: |
      When aiming to create a clean, orderly and logical workplace, it helps to have a structured, **systematic approach** in order to identify where and how improvements can be made. 

      The **5C/5S technique** approach enables workers to set appropriate workplace **standards** then identify any negative variations or abnormalities. Once these have been identified, it is possible to take action to correct them. 

      ### Factors that influence an organised workplace

      * The people
      * The jobs that are done
      * The order in which jobs are done
      * The physical space required to do jobs
      * The tools, equipment and materials needed to carry out jobs
      * The use of shared resources
      * Storage space
  -
    title: The 5C/5S technique
    theme: t-bg-primary
    copy: |
      
      The 5C/5S technique is based on five Japanese words: seiri, seiton, seiso, seiketsu and shitsuke. 

      These words can be translated into English to make up the 5C and 5Ss. Select the following images to discover what they are:

    subInc: 
      type: reveal
      content:
        -
          title: Seiri
          copy: |
              5S: Sort  
              5C: Clear out
          img: placeholder_icon.svg
        -
          title: Seiton
          copy: |
              5S: Straighten/Simplify  
              5C: Configure
          img: placeholder_icon.svg
        -
          title: Seiso
          copy: |
              5S: Sweep/Shine/Scrub  
              5C: Clean and check
          img: placeholder_icon.svg
        -
          title: Seiketsu
          copy: |
              5S: Standardise  
              5C: Conformity 
          img: placeholder_icon.svg
        -
          title: Shitsuke
          copy: |
              5S: Sustain/Self-discipline  
              5C: Custom and practice
          img: placeholder_icon.svg

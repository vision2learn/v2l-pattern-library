    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Workplace organisation audit

      Do you remember that Physical 3D created a new meeting area? If you recall, it was very successful. However, during the building work the staff became distracted and the main office, which has never been the tidiest, become a bit messy – actually, that’s being polite. As you can see from the image below, it is now a risk to anyone entering the room.


    subInc: 
      type: accordion
      content:
        - 
          title: Before scenario environment
          copy: |
            
            Sonia isn’t happy about this. She went on annual leave after sorting the boxes that were causing a hazard at the top of the stairs and is appalled to see the state of the office on her return. “It’s not just my responsibility to keep the office free from hazards” she thinks to herself.
      
            ![](/images/banners/placeholder.jpg)
            
            After a chat with some of the staff, Sonia makes this her first priority and begins by conducting a workplace audit. 
            
  -
    title: Time for an assessment task
    theme: t-bg-primary3 i-practice
    copy: |
      ### Perform a workplace organisation audit

      Taking the above case study into consideration, use the above image to recommend what changes Sonia should make to Physical 3D’s standard operating procedures (SOPs) and what visual controls could be implemented.

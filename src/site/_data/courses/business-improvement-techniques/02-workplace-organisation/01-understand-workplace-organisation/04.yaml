  -
    title: Quick quiz
    copy: 
    subInc: 
      type: word-quiz
      content:
        -
          sentence: A workplace organisation audit is a systematic evaluation of the cleanliness, organisation, and efficiency of a workplace.  
          answer: systematic evaluation
        -
          sentence: The first step in scoring and auditing a workplace organisation is to develop a scoring system.
          answer: scoring system
        -
          sentence: The purpose of an audit is to identify areas for improvement and to ensure that the workplace is operating safely and efficiently.  
          answer: safely and efficiently
        -
          sentence: When conducting a workplace audit, the 5S principles can be incorporated into the scoring system.
          answer: 5S principles
    theme: i-quiz
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        Can you carry out a workplace audit of your current surroundings? This could be in your own workplace or at home. Think about the 5Ss principles and how you would score the items within each stage.
  -
  -
    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Workplace organisation audit

      Do you remember that Physical 3D created a new meeting area? If you recall, it was very successful. However, during the building work the staff became distracted and the main office, which has never been the tidiest, became a bit messy – actually, that’s being polite. As you can see from the image below, it is now a risk to anyone entering the room.

      Sonia isn’t happy about this. After soring the boxes at the top of the stairs that were causing a hazard, she went on annual leave and is appalled to see the state of the office on her return. “It’s not just my responsibility to keep the office free from hazards” she thinks to herself.

      After a chat with some of the staff, Sonia makes this her first priority and begins by conducting a workplace audit. 

    subInc: 
      type: accordion
      content:
        - 
          title: 5S - Sort, Set in Order, Shine
          copy: |
            ![](/images/svg/bit/bit_u2_s1_p4_image1.svg)
            _Image showing the hazardous office environment at Physical 3D_
        - 
          title: 5S - Standardise and Sustain
          copy: |
            ![](/images/svg/bit/bit_u2_s1_p4_image2.svg)
            _Image showing the office environment at Physical 3D after the audit_      

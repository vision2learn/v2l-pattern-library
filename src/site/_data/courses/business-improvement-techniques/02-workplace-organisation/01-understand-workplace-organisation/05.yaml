  -
    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Case study - TableArt Industries

      TableArt Industries is a small startup business which had grown a lot faster than expected.  Although this is good, it caused several issues on the production floor as the team were no longer able to work in their initial organic way which suited a smaller business. They were now overworked and disorganised due to the increased demand for the products.  This was causing quality issues and considerable stress.
      
      The manager and the team had a meeting to see what they could do to resolve these issues. They decided that they needed to simplify their operations, maintain the quality of their products, and maintain and promote the positive culture and working environment.
    subInc: 
      type: accordion
      content:
        - 
          title: Implementation of Visual Controls
          copy: |
            1. __Standardised Work Instructions__: TableArt Industries created visual work instructions with clear illustrations and color coding. These instructions were displayed at each work station to ensure consistent operations.

            2. __Andon System__: An andon system was introduced, featuring lights that workers could activate to signal production issues. This allowed for quick response and resolution by supervisors and maintenance staff.

            3. __Kanban System__: a kanban system was implemented using visual cards to manage inventory. These cards provided real-time information on part numbers and quantities, enabling just-in-time production.

            4. __Visual Quality Controls__: Visual controls were used to improve quality. Color-coded tags were used to indicate the status of components or products, identifying defects, rework needs, or acceptance.
          img: /images/svg/bit/bit_u2_s1_p5_case_study1.svg
        - 
          title: Benefits and results
          copy: |
            * __Enhanced Communication__: Visual controls improved communication among team members, reducing errors and promoting collaboration.

            * __Improved Efficiency__: The visual controls streamlined workflows, reducing delays and improving overall efficiency.

            * __Increased Quality__: Visual quality controls helped identify and address defects promptly, resulting in improved product quality and customer satisfaction.

            * __Empowered Workforce__: The visual controls empowered employees by providing clarity in their tasks, leading to increased engagement and contributions to process improvements.
            
          img: /images/svg/bit/bit_u2_s1_p5_case_study2.svg
    copy2: |
      By implementing visual controls, TableArt Industries successfully improved efficiency, communication, and quality. Standardised work instructions, the andon system, the kanban system, and visual quality controls played vital roles in achieving operational excellence. 
      
      This demonstrates the effectiveness of visual controls in simplifying operations and delivering positive outcomes for businesses.

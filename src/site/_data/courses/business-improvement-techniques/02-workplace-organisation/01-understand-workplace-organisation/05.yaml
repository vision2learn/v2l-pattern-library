title: Standard Operating Procedures (SOPs) and Visual Controls
intro: |
  On this page you will learn about standard operating procedures and how to provide recommendations.  We will also look at visual controls.
banner: bit_u2_s1_p5_banner.jpg
sections:
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to provide recommendations for the creation of, or changes to, standard operating procedures (SOPs) and visual controls.
  -
  -
    title: Visual controls
    theme: t-bg-primary
    copy: |
      When creating a Standard Operating Procedure (SOP), visual controls can help make things easier to understand.

      Visual controls are part of visual management, which is a way of sharing information using pictures, signs, and other visual means.  (We take a look at visual mangement systems in more depth in Unit 4).
      
      Scroll through the slides below to learn more.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Visual displays
          text: |
            Visual displays, such as posters and diagrams, share information but don't tell you what to do. On the other hand, __visual controls__ not only share information but also give you directions on what actions to take based on what you see.

            Visual displays provide information, but __visual controls__ are designed to drive specific behaviors or actions. Displays and controls can be as simple or complicated as needed, starting from simple posters to detailed work instructions.
          img: bit_u2_s1_p5_slide1.svg
        -
          title: Using visuals controls to help understand the SOP
          text: |
            Visual controls should make things easier for you to understand and help you follow the SOP better. Visuals can include: Flowcharts, Checklists, Diagrams, Visual examples, Colour coding, Icons and symbols. For example, you could use a flowchart to show the order of steps, a diagram to explain complicated systems, or a checklist to mark off completed steps.
          img: bit_u2_s1_p5_slide2.svg
        -
          title: Visual controls in a production process
          text: |
            Visual controls are like special tools and signs that show you how well a production process is going. They can be things like charts, boards, lights, labels, and symbols which help to share information, give instructions, give feedback, and send warnings to the workers and managers. They also help to quickly find and fix mistakes or problems that might happen. Visual controls are like helpers that make it easier to see and understand what's happening in the production process.
          img: bit_u2_s1_p5_slide3.svg
        -
          title: Examples of visual controls in a production environment
          text: |
            A simple shadow board for tools is a visual control because it guides you to put each tool in its designated spot, matching its shape.
            
            Color-coding is another type of visual control used on equipment. A flashing red light indicates a problem that needs inspection and intervention, while a flashing green light means everything is working fine and no action is required.
          img: bit_u2_s1_p5_slide4.svg
        -
          title: Types of visual controls used in Industry
          text: |
            Typical types of visual controls used in industry include:
            * Color coding - can be used to communicate status.
            * Andon - is a system that indicates quality or a process issues.
            * Standard work - ensures that employees understand allocated tasks, sequence of task, timings and outcome.
            * Floor lines and signs - show pathways, intersections, vehicle lanes, working cells and ensure flow and safety.
            * Kamishbai board and Tee Cards - are a simple way to determine if a task is complete or not.
          img: bit_u2_s1_p5_slide5.svg      

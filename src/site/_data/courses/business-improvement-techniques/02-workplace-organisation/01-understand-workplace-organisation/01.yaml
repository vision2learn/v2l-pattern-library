title: Welcome to Unit 2
intro: |
    ### Workplace organisation
    
    Welcome to the second unit of your Level 2 Certificate in Qual title.  This unit is all about understanding workplace organisation.

banner: bit_u2_s1_p1_banner.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit, you will cover the following criteria of your Level 2 Certificate in Business Improvement Techniques qualification.

      You will:

      1. Explain the principles and techniques of workplace organisation
      2. Describe the factors to be considered when selecting a work area for an activity
      3. Describe the benefits of having an organised working environment
      4. Explain how to score and audit a workplace organisation
      5. Perform a workplace organisation audit using appropriate tools and techniques
      6. Provide recommendations for the creation of, or changes to, standard operating procedures (SOPs) and visual controls

      [View the complete set of learning outcomes for this unit.](/pdfs/v2l_bit_learning_outcomes_u2.pdf)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      
      * the principles and techniques of workplace organisation
      * the factors to be considered when selecting a work area for an activity
      * the benefits of having an organised working environment
      * how to score and audit a workplace organisation

title: Understand workplace organisation
intro: |
  On this page you will learn about selecting a work area for an activity, and the benefits of having an organised working environment. 
banner: bit_u2_s1_p3_banner.jpg
sections:
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to describe the factors to be considered when selecting a work area for an activity.
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Selecting a work area for an activity
      
      This video will look at why it’s important that the area selected for a work activity should be carefully chosen and what to consider when making your decision. 
    video: bit_u2_s1_p3_activity_work_area.mp4
  -
  -
    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Case study - Selecting a work area for an activity

      Physical 3D's new project team is collaborating with many people to ensure that their design for the prosthetic hand is exactly right for the client’s requirements. As such they need a regular meeting place to bring together a range of specialists, the client and project team members. This is an expansion that they’ve not given thought to previously and have found the cramped upstairs office unsuitable, particularly as the space must be accessible for one of the client’s team. 
      
      The production area downstairs is more spacious and is not fully utilised, therefore it seems a simple solution to build a partition here for a new meeting space to be created. However, even this isn’t as simple as first thought and there are many obstacles to overcome e.g.: the designated space is at the back of the production area and involves walking through a noisy, dusty area. There is no natural light once the area is partitioned and a fire exit hasn’t been considered. 
    subInc: 
      type: accordion
      content:
        - 
          title: The Solution
          copy: |
            After a more thorough evaluation of the space available, Physical 3D decided that moving some of the existing production area was possible. This created space near the front entrance of the building and allowed the room divider to be built in a place that included a window to the new meeting room, as well as easy access directly into the room. Noise was still an issue and soundproofing was added to create a final safe environment that met all of the conditions needed for a meeting room. 
            
          img: /images/svg/bit/bit_u2_s1_p3_case_study.svg
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        When planning a new area for the meeting room, what do you think Physical 3D considered? 
        See the list below for areas that were discussed in the video, this may help you with your notes. 
        * Health & Safety 
        * Cleanliness 
        * Product quality 
        * Accessibility 
        * Noise level 
        * Environmental conditions 

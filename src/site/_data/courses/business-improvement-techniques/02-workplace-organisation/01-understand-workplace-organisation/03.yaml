    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Case study - Selecting a work area for an activity

      Physical 3Ds’s new project team are collaborating with many people to ensure that their design for the prosthetic hand is exactly right for the client’s requirements, as such they need a regular meeting place to bring together a range of specialists, the client and members of the project team. This is an expansion that they’ve not given thought to previously and have found the cramped upstairs office unsuitable, particularly as the space must be accessible for one of the client team.  
      
      The production area downstairs is more spacious and is not fully utilised, therefore it seems a simple solution to build a partition here for a new meeting space to be created. However, even this isn’t as simple as first thought and there are many obstacles to overcome e.g.: the designated space is at the back of the production area and involves walking through a noisy, dusty area. There is no natural light once the area is partitioned and a fire exit hasn’t been considered.  
    subInc: 
      type: accordion
      content:
        - 
          title: The Solution
          copy: |
            After a more thorough evaluation of the space available, Physical 3D decided that moving some of the existing production area was possible. This created space near to the front entrance of building and allowed the room divider to be built in a place that included a window to the new meeting room, as well as easy access directly into the room. Noise was still an issue and soundproofing was added to create a final safe environment that met all of the conditions needed for a meeting room. 
            
          img: /images/svg/placeholder_icon.svg

    layout: media
    copy: |
      ### Organised working environment
      
      We’re now going to look at why having an organised working environment is beneficial to you, the team and the organisation.
    video: bit_u2_s1_p3_organised_work_environment.mp4
  -
  -
    title: Quick quiz
    copy: 
    subInc: 
      type: word-quiz
      content:
        -
          sentence: By having an organised workspace, you're better able to prioritise your tasks and manage your time effectively.
          answer: manage your time
        -
          sentence: When your workspace is organised, you know exactly where everything is and you spend less time searching for things which increases productivity.
          answer: increases productivity
        -
          sentence: An organised workspace can help to create a calm and productive environment, which can lead to improved creativity and problem-solving skills.
          answer: improved creativity
        -
          sentence: When you work in an organised environment, it's easier for you and your colleagues to have better collaboration.
          answer: better collaboration
    theme: i-quiz
  -
  -
    title: Physical and Mental Health
    layout: media
    theme: t-bg-primary1b
    copy: |
      So far in this unit we have considered different factors for making a workplace environment organised and efficient. These have mostly consisted of the physical environment such as health & safety, location, layout and accessibility, all of which are important and impact an individual’s physical health, but what about mental health? This can suffer if people find the environment difficult and although this can be individual e.g., some people like to work with background noise and thrive in busy, noisy environments. Others would have difficulty concentrating and prefer quiet, smaller, more relaxed spaces. 
      
      Although accommodating all differences is difficult, it’s important that individuality is taken into consideration and adaptions made where needed. E.g., if the noisy, busy environment can’t be avoided, then a quiet, relaxed, and comfortable breakout room could help those that need it. 

    img: /images/svg/bit/bit_u2_s1_p3_image1.svg

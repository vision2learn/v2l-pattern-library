title: "Diversity"
intro: |
  On this page you will learn about:
  * Diversity
  * Equality
  * Being sensitive to others
  
banner: ba-u1-s1-p5.jpg
sections:
  -
    title: Diversity
    theme: t-bg-primary
    copy: |
      Everyone is diﬀerent. People often assume that all employees in the workplace are the same. However, when you think about this in more detail, it's obvious that a huge amount of diﬀerences (or diversity) can exist in a workplace.  Diversity can add real value to an organisation and should be seen as a positive thing.
  -
    title: Equality
    theme: 
    copy: |
      ### Equal rights for all

      In all organisations, it's important that all employees are treated in an equally fair way and are given equal opportunities.  Also, people doing the same job equally well should be rewarded fairly.

      Select the images below to read three key reasons for maintaining equality in the workplace. 

    subInc: 
      type: reveal
      content:
        -
          title: Preventing unfair discrimination
          copy: |
            It is morally right to treat people fairly and to avoid unfair discrimination.
          img: ba_u1_s1_p5_reveal_1.svg
        -
          title: Laws
          copy: |
            There are many laws created to punish unfair and discriminatory behaviour.
          img: ba_u1_s1_p5_reveal_2.svg
        -
          title: Social and economic benefits
          copy: |
            There are social and economic benefits of equal treatment. 
          img: ba_u1_s1_p5_reveal_3.svg
    copy2: There is a moral and legal obligation to treat people on their merits and their ability to do the job. Both employers and employees should make sure that inappropriate labelling, stereotyping and prejudice do not influence the way an organisation operates. 
    
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      For your Unit 1 assessment, you must be able to identify employer and employee responsibilities for equality and diversity in a business environment. Looking over the information on this page will help you when it comes to tackling this question in your assessment.
  -
    title: Being sensitive to others
    theme: t-bg-primary
    copy: |
      ### Politeness and respect

      To be sensitive to to others, there are some simple steps to follow.
      
      Scroll through the slides below to see each point
    subInc:
      type: slider
      title: 
      slides:
        -
          title: 1. 
          text: Be aware of judgements you make about others. Are you prejudiced or prone to pre-judge other people? Are you likely to generalise about (stereotype) a category of people?
          img: ba_u1_s1_p5_slide_1.svg
        -
          title: 2. 
          text: Focus on the actual person and not the ‘label’ that may be put on them.
          img: ba_u1_s1_p5_slide_2.svg
        -
          title: 3.
          text: Always look for the positive attributes people may bring to a situation.
          img: ba_u1_s1_p5_slide_3.svg
        -
          title: 4.
          text: Be willing to learn about people ‘who are different’.
          img: ba_u1_s1_p5_slide_4.svg
        -
          title: 5.
          text: Recognise that some differences of opinion will exist. As long as these do not interfere with work, then the differences should be tolerated. If differences interfere with work, then they need to be discussed and addressed in a civil manner.
          img: ba_u1_s1_p5_slide_5.svg
        -
          title: 6.
          text: Be polite, patient and treat people with the respect that you would expect.
          img: ba_u1_s1_p5_slide_6.svg
  - 
    title: "Quick quiz: What are the benefits?"
    theme: i-quiz
    copy: |
      ### Equality and diversity

      Read the following and then try the question.  Think about the beneﬁts of equality and diversity procedures.

      Business A always chooses people from the same family for its senior management jobs. Some of the original managers employed from this family were very competent. However, others have proven less capable.

      Business B always employs the person with the best skills and competences. Factors such as family ties, race, gender, etc are of little importance compared with ability.
    subInc: 
      type: quick-quiz
      content: 
        Which business do you think is more likely to be successful?:
          answers:
            Business A: false
            Business B: true
          feedback: | 
            It is likely that Business B will be more successful than Business A. In Business A, less competent family members may get important jobs. This can have a negative impact on the performance of the business. It is also likely that talented employees who aren't family members will be disappointed, disgruntled and think about leaving the organisation. In Business B, competent people will fill senior management roles and they will be able to perform effectively. The organisation is more likely to attract talented people who want to progress.
            
            This makes Business B a more diverse organisation and one which has an equal opportunities environment. A diverse organisation provides opportunities to learn new things from people with different experiences and perspectives, and an equal opportunities environment enables people to feel that the organisation is treating them fairly. When equality and diversity are considered, the workforce is likely to be better motivated, more competent and more productive.
  -
    title: Summary
    theme: t-bg-primary i-summary
    copy: |
      To ensure that people are treated fairly, an employer can

      - Train staﬀ on equality and diversity topics
      - Develop policies and procedures to address equality and diversity issues
      - Ensure that line managers appreciate diversity and promote fair treatment.
      - It is very important that employees understand the equality and diversity policies and procedures that apply to their organisation.
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: Explain the benefits of making sure equality and diversity procedures are followed.  Make sure you include benefits for the employer, the employee, and the overall organisation.

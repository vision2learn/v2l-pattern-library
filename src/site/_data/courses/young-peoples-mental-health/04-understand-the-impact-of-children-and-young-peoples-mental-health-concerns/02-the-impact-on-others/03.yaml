    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to describe how cultural beliefs and social attitudes can affect expectations of diagnosis of mental health concerns for the child or young person; and for others.
  -
  -
    title: Cultural beliefs and social attitudes
    layout: media
    theme: t-bg-primary
    copy: |
      Cultural beliefs and social attitudes play a big role in how people view mental health and the stigma that surrounds mental illness prevents many from seeking help. Shame, the fear of discrimination and rejection, and the lack of understanding can prevent them seeking diagnosis and effective treatment. The support of family and friends therefore can be really important in helping children and young people to cope with a diagnosis of mental health concerns.


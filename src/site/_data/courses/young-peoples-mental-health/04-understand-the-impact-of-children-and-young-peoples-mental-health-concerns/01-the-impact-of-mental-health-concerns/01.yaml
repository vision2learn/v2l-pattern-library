title: Welcome to Unit 4
intro: |
    ### Understand the impact of children and young people’s mental health concerns
    
    Welcome to the fourth unit of your Level 2 Certificate in Understanding children and young people's mental health.  This unit is all about the impact of children and young people's mental health concerns.

banner: placeholder.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit, you will cover the following criteria of your Level 2 Certificate in Understanding children and young people's mental health qualification.

      You will:

      1. Understand the impact mental health concerns can have on children and young people
      2. Understand the impact of children and young people’s mental health problems on others
      3. Understand the importance of being diagnosed with a mental health problem

      [View the complete set of learning outcomes for this unit.](/pdfs/v2l_ypmh_learning_outcomes_u4.pdf)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      
      * Potential effects of mental health concerns on family life, relationships and education
      * Potential impact of mental health concerns both short and long term

title: Potential impact in both the short and long term
intro: |
  intro text
banner: ypmh_u4_s1_p3_potential.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to identify the potential impact of mental health concerns for children and young people in both the short term and long term.
  -
    title: The potential Impact of Mental Health Concerns
    theme: t-bg-primary
    copy: |
      Let’s look at the potential impact of mental health concerns for children and young people in the short term and in the long term:

    subInc: 
      type: reveal
      content:
        -
          title: Family
          copy: |
            If someone in the family is diagnosed with a mental illness, it can be hard to deal with.
          img: ypmh_u4_s1_p3_reveal1.svg
        -
          title: Relationships
          copy: |
            Mental health concerns can cause serious problems with relationships and may cause them to breakdown.
          img: ypmh_u4_s1_p3_reveal2.svg
        -
          title: Employment
          copy: |
            Mental health concerns can hinder employment prospects or cause problems in the workplace causing subsequent dismissal.
          img: ypmh_u4_s1_p3_reveal3.svg
        -
          title: Physical well-being
          copy: |
            Mental health issues may cause an individual to to neglect their physical well-being or engage in destructive behaviours.
          img: ypmh_u4_s1_p3_reveal4.svg
        -
          title: Future mental health
          copy: |
            Mental health problems in children and young people can be long-lasting and progress through their adult life.
          img: ypmh_u4_s1_p3_reveal5.svg
        -
          title: Life changes
          copy: |
            Mental ill health can seriously impact on an individual’s life changes.
          img: ypmh_u4_s1_p3_reveal6.svg
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      Let’s look at the potential impact of mental health concerns for children and young people and how can we address them in the short term and long term. 
    video: ypmh_u4_s1_p3_short_and_long_term.mp4
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        What do you think the impact of  mental health concerns are in the short and long term? Make a note of your answer in the  box to the right.
  -
  -
    title: Quick quiz
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        Is the following statement true or false? "Emotional wellbeing is a key indicator of academic achievement, and subsequently improved outcomes in later life.":
          answers:
            True: true
            False: false
        How many times is it more likely for Children and young people from the poorest households to have a mental health problem?:
          answers:
            Two: false
            Three: true
            Four: false
          feedback: Children and young people from the poorest households can be up to three times more likely to have a mental health problem than those growing up in better-off homes. This may be related to the financial strains and stresses put on the family.
        Select one option to complete the following sentence:"________________ is a great way to improve mental wellbeing as it can help the release of the feel-good chemicals - endorphins - in the brain.":
          answers:
            Education: false
            Financial help: false
            Physical well-being: true
          feedback: Physical well-being is a great way to improve mental wellbeing and If children and young people are encouraged to get involved with physical exercise this can help as it influences the release and uptake of the feel-good chemicals ‘endorphins’ in the brain. By preventing or handling mental health problems and building resilience in children and young people their future mental health and well-being can be improved.
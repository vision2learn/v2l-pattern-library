title: Welcome to Unit 5
intro: |
    ### Understand how to support children and young people with mental health concerns
    
    Welcome to the final unit of your Level 2 Certificate in Understanding children and young people's mental health.  This unit is all about understanding the support available for children and young people’s mental health.

banner: placeholder.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit, you will cover the following criteria of your Level 2 Certificate in Understanding children and young people's mental health qualification.

      You will:

      1. Understand person-centred approaches to supporting children and young people with mental health concerns
      2. Understand how to promote mental well-being in children and young people
      3. Understand services and treatment involved with children and young people’s mental health

      [View the complete set of learning outcomes for this unit.](/pdfs/v2l_ypmh_learning_goals_u5.pdf)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      
      * What is meant by person-centred support for children and young people
      * The recovery model which applies to children and young people with mental health concerns
      * How the rights of a child or young person with mental health concerns can be upheld
      * Strategies that can be used to support a child or young person experiencing mental health concerns

    copy: |
      In your assessment you will be required to identify strategies that can be used to support a child or young person experiencing mental health concerns.
  -
  -
    title: Strategies to support those experiencing mental health concerns
    theme: t-bg-primary
    copy: |
      Let’s have a look at some strategies that can support children and young people experiencing mental health concerns.

    subInc: 
      type: reveal
      content:
        -
          title: Psychological therapies
          copy: |
            Psychological therapies such as talking therapies or counselling. 
          img: ypmh_u5_s1_p3_slide1.svg
        -
          title: Medication
          copy: |
            Psychiatric medication such as antidepressants, tranquillisers or mood stabilisers.
          img: ypmh_u5_s1_p3_slide2.svg
        -
          title: Coping strategies
          copy: |
            Coping strategies like distraction, engaging in physical activities or taking time to relax.
          img: ypmh_u5_s1_p3_slide3.svg
        -
          title: Emotional support
          copy: |
            Emotional support from family or friends during times of stress or when feeling lonely.
          img: ypmh_u5_s1_p3_slide4.svg
        -
          title: Positive life changes
          copy: |
            Making positive life changes to improve mood, reduce stress, and manage day-to-day mental health.
          img: ypmh_u5_s1_p3_slide5.svg
  -

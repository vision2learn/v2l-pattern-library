title: Rights of a child and strategies to support
intro: |
  On this page you will learn about:
  * The rights of the child
  * Strategies that can be used to support a child or young person experiencing mental health concerns
banner: placeholder.jpg
sections:
  -
    title: The rights of a child
    theme: t-bg-primary
    copy: |
      The United Nations Convention on the Rights of the Child (UNCRC) is an international human rights treaty granting all children and young people up to the age of 18 a comprehensive set of rights. It sets out the civil, political, economic, social and cultural rights of all children everywhere and explains how governments and adults must work together to make sure all children can enjoy all the rights they are entitled to. Every child has rights, whatever their ethnicity, gender, religion, language, abilities or any other status.
      
      The four articles in the convention that are seen as special are:
    subInc: 
      type: reveal
      content:
        -
          title: Article 2
          copy: |
            Non-discrimination 
          img: placeholder_icon.svg
        -
          title: Article 3
          copy: |
            the best interest of the child
          img: placeholder_icon.svg
        -
          title: Article 6
          copy: |
            Right to life survival and development 
          img: placeholder_icon.svg
        -
          title: Article 12
          copy: |
            Right to be heard
          img: placeholder_icon.svg

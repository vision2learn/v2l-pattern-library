  -
    title: Quick quiz
    copy: 
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Cognitive Behavioural therapy is where goals are set by the therapist for the individual to carry out tasks between sessions.
          answer: Cognitive Behavioural
        -
          sentence: Mindfulness based cognitive therapy helps individuals focus on thoughts and feelings as they happen moment by moment.
          answer: Mindfulness
        -
          sentence: Interpersonal therapy is a talking treatment that helps people with depression identify and address problems in their relationships with family, partners and friends. 

          answer: Interpersonal
        -
          sentence: Counselling is a talking therapy where an individual can talk in confidence to a counsellor. 
          answer: Counselling
    theme: i-quiz
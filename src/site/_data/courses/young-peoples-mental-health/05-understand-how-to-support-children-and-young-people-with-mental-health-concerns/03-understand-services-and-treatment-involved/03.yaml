title: Medication used to treat mental health issues
intro: |
  What types of medication can be used to treat children and young people experiencing mental health issues.
banner: ypmh_u5_s3_p3_medicine.jpg
sections:
  -
    title: Types of medication used
    layout: media
    theme: t-bg-primary
    copy: |
      GP’s are often the first professional to go to with a mental health issue for a child or young person and they can offer help and guidance through referral to a professional for therapy or prescribe medication if that may be more suitable at this stage. Psychiatrists are specialists in mental illness and work with the individual to decide what care and support will best help them. They can also prescribe medication that may help, such as medication to reduce anxiety once the individual’s condition has been diagnosed. There are so many different types of medications, and so many options so it’s really important that a young person, or parent or carer discusses with a GP or Psychiatrist what options are available to them.

    img: /images/svg/ypmh/ypmh_u5_s3_p3_image.svg
  -
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to identify types of medication used to treat children and young people experiencing mental health problems.
  
  -
    title: Types of medication
    theme: t-bg-primary
    copy: |
      Let’s look at some of the types of medication that are available for different mental health problems.

    subInc: 
      type: reveal
      content:
        -
          title: Anti-anxiety
          copy: |
            Anti-anxiety medication is used to treat the symptoms of anxiety. It includes drugs such as
          img: ypmh_u5_s3_p3_reveal1.svg
        -
          title: Antidepressant
          copy: |
            A medicine to help lift mood by rebalancing chemicals in the brain. There are different groups of antidepressants, like SSRIs and tricyclics
          img: ypmh_u5_s3_p3_reveal2.svg
        -
          title: Antipsychotic and Atypical antipsychotics
          copy: |
            Medicines used to treat psychosis and newer medicines used to treat psychosis, sometimes called second-generation antipsychotics.
          img: ypmh_u5_s3_p3_reveal3.svg
        -
          title: Benzodiazepines
          copy: |
            A group of medicines used to treat anxiety and sleep problems
          img: ypmh_u5_s3_p3_reveal4.svg
        -
          title: Mood stabiliser
          copy: |
            A group of medicines used to treat bipolar affective disorder. They help to balance moods to avoid periods of mania or depression, usually taken long-term.
          img: ypmh_u5_s3_p3_reveal5.svg
        -
          title: SSRIs & SNRIs
          copy: |
            ‘Selective Serotonin Reuptake Inhibitors’ and ‘Serotonin-Noradrenaline Reuptake Inhibitors’, antidepressants which works on serotonin in the brain, and serotonin and noradrenaline in the brain respectively.
          img: ypmh_u5_s3_p3_reveal6.svg

    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### What is meant by ‘Care Programme Approach’

      The Care Programme Approach or CPA, is used in secondary specialist mental health services which are part of the NHS to assess needs and then plan, implement and evaluate the care that is needed let’s look at this in more detail.

    video: ypmh_u5_s3_p1_cpa.mp4

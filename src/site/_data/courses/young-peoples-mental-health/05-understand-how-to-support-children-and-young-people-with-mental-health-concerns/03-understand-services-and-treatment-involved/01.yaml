    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to explain the importance of early intervention, support and treatment.
  -
  -
    title: Early intervention
    theme: t-bg-primary
    copy: |
      Let’s look at why early intervention is important, please scroll through the information below.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Mentally healthy
          text: |
            Most children grow up mentally healthy, but surveys suggest that more children and young people are having problems with their mental health than 30 years ago, probably due to the changes in the way we live today. 
          img: ypmh_u5_s3_p1_slide1.svg
        -
          title: Long term consequences
          text: |
            Early intervention can help support a child or young person who is experiencing or demonstrating any of the early symptoms of mental illness, reducing its progress and improving their mental well-being for the future warding off potential long-term consequences.
          img: ypmh_u5_s3_p1_slide2.svg
        -
          title: Infants or children
          text: |
            Early intervention can include the identification of infants or children with a higher risk of developing mental illness or severe behavioural and developmental disturbances.
          img: ypmh_u5_s3_p1_slide3.svg
        -
          title: Adolescents
          text: |
            For adolescents, mental illness is a significant risk factor for not completing school and subsequent study, and for longer-term mental and physical health outcomes as well as impacting on their families, friends and others around them.
          img: ypmh_u5_s3_p1_slide4.svg  
  -

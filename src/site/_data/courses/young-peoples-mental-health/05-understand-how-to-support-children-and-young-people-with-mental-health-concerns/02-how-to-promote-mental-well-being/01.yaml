title: Understand how to promote mental well-being
intro: |
  In this session you will learn about promoting mental well-being in children and young people, looking at interaction, behaviour and lifestyle choices and expressing their emotions.
banner: placeholder.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * Ways in which a calm and nurturing environment can be created to promote well-being
      * Promoting interactions between children and young people
      * How to respond to behaviour and lifestyle choices in a way that respects a child’s or young person’s self-esteem
      * Supporting children and young people to express their emotions and concerns within a safe environment

  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to describe ways in which a calm and nurturing environment can be created to promote the well-being of children and young people.
  -
    title: Different environments that promote well-being
    theme: t-bg-primary
    copy: |
      Let’s look at the different environments that can be calming and nurturing to promote the well-being of children and young people and allowing them to express their emotions and concerns safely.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Emotional environment
          text: |
            An emotional environment is one that promotes emotional wellbeing and provides stability for the children according to their individual needs, with adults who will provide them with emotional support, understanding their feelings and showing empathy.
          img: ypmh_u5_s2_p1_slide1.svg
        -
          title: Inclusive environment
          text: |
            An inclusive environment helps to promote harmony where everyone is valued and can freely express who they are, their own opinions and points of view and feel safe from abuse, harassment or unfair criticism. It embraces all cultures, genders, ethnicity, language, religion, special educational needs and disabilities.
          img: ypmh_u5_s2_p1_slide2.svg
        -
          title: Learning environment
          text: |
            With a positive emotional learning environment, children will flourish across all areas of their development as they will have a positive disposition to learning, learn to share and work co-operatively with others, be well behaved and learn to become independent. They will be better able to deal with major transitions in their life, for example starting school or moving on to the next phase of their education.
          img: ypmh_u5_s2_p1_slide3.svg
        -
          title: Safe and nurturing environment
          text: |
            A sense of feeling safe and secure enables them to learn and develop, gaining confidence to explore and overcome any challenges they may face. Knowing that the adults around them are supportive and accepting helps them to develop how they express their feelings over a range of emotions, positive and negative in a warm, safe and nurturing environment.
          img: ypmh_u5_s2_p1_slide4.svg
  -
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to describe how to support children and young people to express their emotions and concerns within a safe environment.
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      Please see the following video about the emotional health of children and young people.
    video: ypmh_u5_s2_p1_emotional_health.mp4
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        Can you think of ways that you can promote a calm and nurturing environment to promote the well-being of children and young people? Make a note of your answer in the box to the right. 

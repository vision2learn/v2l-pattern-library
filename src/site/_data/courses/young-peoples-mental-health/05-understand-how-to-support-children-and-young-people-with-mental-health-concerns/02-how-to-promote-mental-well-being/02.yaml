    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to describe how to respond to behaviour and lifestyle choices in a way that respects a child’s or young person’s self-esteem.
  -
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      Let’s look at how adults and parents can help children and young people make good lifestyle choices to help with self-esteem.
    video: ypmh_u5_s2_p2_responding_to_behaviour.mp4
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        Can you think of ways that you can support children and young people to express their emotions and concerns within a safe enviroment? Make a note of your answer in the box to the right. 
  -
  -
    title: Quick quiz
    copy: 
    subInc: 
      type: word-quiz
      content:
        -
          sentence: How a person feels about themselves and many different pressures growing up can affect a child’s or young person’s self-esteem.
          answer: self-esteem
        -
          sentence: Children and young people with high self-esteem often have a positive image of themselves and are confident, make friends easily, and will try new things and adapt to change. 
          answer: positive image
        -
          sentence: Having a healthy self-esteem is essential in making safe and healthy choices.   
          answer: healthy choices
        -
          sentence: Children and young people may need to be guided to make good lifestyle changes for the benefits of their mental well-being.
          answer: mental well-being
    theme: i-quiz
title: Responding to behaviour and lifestyle choices
intro: |
  There are different ways to respond to behaviour and lifestyle choices of children and young people whilst still respecting their self esteem.
banner: ypmh_u5_s2_p2_self_esteem.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to describe how to promote interactions between children and young people and others to develop their well-being.
  -
    title: How to respond to behaviour and lifestyle choices in a way that respects a child’s or young person’s self-esteem
    theme: t-bg-primary
    copy: |
      Lets look at how to respond to behaviour and lifestyle choices in a way that respects a child’s or young person’s Self-Esteem

    subInc: 
      type: reveal
      content:
        -
          title: Show empathy
          copy: |
            When things distress a child a parent or carer should show empathy and understanding for their concerns
          img: ypmh_u5_s2_p2_reveal1.svg
        -
          title: Give attention
          copy: |
            Children should not have to seek attention they should receive undivided attention whenever they need it
          img: ypmh_u5_s2_p2_reveal2.svg
        -
          title: Love a child
          copy: |
            A child should be loved unconditionally and always accepted for who they are
          img: ypmh_u5_s2_p2_reveal3.svg
        -
          title: Learning experience
          copy: |
            A child should be given a chance to contribute and if they make a mistake, they can learn from that experience
          img: ypmh_u5_s2_p2_reveal4.svg
        -
          title: Solving problems
          copy: |
            A child should learn to solve problems for themselves and make decisions when needed but with help where necessary
          img: ypmh_u5_s2_p2_reveal5.svg
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      Please see the following video to learn more.
    video: ypmh_u5_s2_p2_lifestyle_choices.mp4

title: What did you learn? 
intro: Well done, you’ve now completed the third session of Understanding children and young people's mental health in context Level 2! 
banner: ba-u1-s1-p6.jpg
sections:
  -
    title: Summary
    theme: t-bg-primary i-summary
    copy: |
      In this session, you have learnt about:
      * Types of abuse which a child or young person may experience
      * Ways bullying can occur
      * Why some are more vulnerable to abuse and/or bullying
      * Witnessing abuse or bullying can affect a child or young person
      * How abuse or bullying directed at a child or young person may affect their mental health and well-being

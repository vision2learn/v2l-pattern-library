    layout: media
    theme: t-bg-primary
    copy: |
      How does bullying affect children and young people and why are some more vulnerable to it. The effects of bullying can last into adulthood and at its worst, bullying can cause children and young people to self-harm and eventuate their own lives.There are no sure indicators that someone is being bullied but there are tell tale signs and some seem more vulnerable than others.


title: Witnessing abuse or bullying, mental health and well being
intro: |
  On this page you will learn how witnessing abuse or bullying directed at others may affect a child or young person; and how abuse or bullying directed at a child or young person may affect their mental health and well-being. 
banner: ypmh_u2_s3_p2_wellbeing.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to describe how witnessing abuse or bullying directed at others may affect a child or young person. 
  -
  -
    title: Witnessing abuse or bullying
    theme: t-bg-primary
    copy: |
      Witnessing abuse or bullying can have a serious affect on children and young people’s mental health. It can potentially make them feel vulnerable to abuse or bullying themselves, but can also make them feel guilty for witnessing the abuse, not preventing it and in turn feeling helpless.

      Lets look at the effects witnessing domestic abuse can have on a child or young person.


    subInc: 
      type: reveal
      content:
        -
          title: Domestic abuse
          copy: |
            Domestic abuse is any type of controlling, bullying, threatening or violent behaviour in a relationship. Witnessing domestic abuse can seriously harm children and young people and is in itself child abuse. 

          img: ypmh_u2_s3_p2_reveal1.svg
        -
          title: Serious impact
          copy: |
            Living in a home where domestic abuse happens can have a serious impact on a child or young person's mental and physical wellbeing, as well as their behaviour and this can last through into adulthood.
          img: ypmh_u2_s3_p2_reveal2.svg
        -
          title: Keeping abuse to themselves
          copy: |
            It can be difficult to tell if domestic abuse is happening and those carrying out the abuse can act very different when other people are around. Children and young people who witness abuse may feel frightened and confused, and keep the abuse to themselves.

          img: ypmh_u2_s3_p2_reveal3.svg
        -
          title: Stable environment
          copy: |
            What is important is to make sure that the domestic abuse stops and that children have a safe and stable environment to grow up in.
          img: ypmh_u2_s3_p2_reveal4.svg
  -

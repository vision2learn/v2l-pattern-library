    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Interview with a professional

      Please see the following video of a professional's responce to the following question:

      How do you feel witnessing abuse or bullying of others can affect a child or young person?
    video: ypmh_u2_s3_p2_interview_bullying.mp4
  -
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to explain how abuse or bullying directed at a child or young person may affect their mental health and well-being. 
  -
  -
    title: The Effects of Bullying
    layout: media
    theme: t-bg-primary
    copy: |
      How does bullying affect children and young people and why are some more vulnerable to it. The effects of bullying can last into adulthood and at its worst, bullying can cause children and young people to self-harm and eventuate their own lives. There are no sure indicators that someone is being bullied but there are tell tale signs and some seem more vulnerable than others.

    img: /images/svg/ypmh/ypmh_u2_s3_p2_image1.svg
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      Please see the following video for more information on the effects of bullying.
    video: ypmh_u2_s3_p2_effects_of_bullying.mp4

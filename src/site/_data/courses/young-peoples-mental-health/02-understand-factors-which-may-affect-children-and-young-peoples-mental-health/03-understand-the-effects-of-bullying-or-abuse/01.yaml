title: Understand the effects of bullying or abuse
intro: |
  In this session you will learn about how abuse and bullying affects the mental health of children and young people.
banner: ypmh_u2_s3_p1_effects.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * Types of abuse which a child or young person may experience
      * Ways bullying can occur
      * Why some are more vulnerable to abuse and/or bullying
      * Witnessing abuse or bullying can affect a child or young person
      * How abuse or bullying directed at a child or young person may affect their mental health and well-being

  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to outline different types of abuse which a child or young person may experience.
  -
  -
    title: Types of abuse
    theme: t-bg-primary
    copy: |
      Let’s look at some of the types of abuse that children and young people may experience. Scroll through the slides below to learn more.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Bullying
          text: |
            Bullying is behaviour that hurts someone else. It includes name calling, hitting, pushing, spreading rumours, threatening or undermining someone. It can happen anywhere such as at school or at home. It's usually repeated over a long period of time and can hurt a child both physically and emotionally. Cyberbullying is bullying takes place online and unlike offline bullying and can follow the child wherever they go, via social networks, gaming and mobile phone.

          img: ypmh_u2_s3_p1_slide1.svg
        -
          title: Neglect
          text: |
            Neglect is the ongoing failure to meet a child's basic needs. A child might be left hungry or dirty, or without proper clothing, shelter, supervision or health care. Physical neglect is  where the child’s basic needs aren’t met. Educational neglect is where parents don’t ensure a child is educated. Emotional neglect is where a child is ignored, humiliated, in-timidated or isolated, and medical neglect where the child gets no real health care or dental care.

          img: ypmh_u2_s3_p1_slide2.svg
        -
          title: Domestic abuse
          text: |
            Domestic abuse is any type of controlling, bullying, threatening or violent behaviour in relationships either inside or outside the home. Children and young people who witness domestic abuse are in turn being subjected to child abuse. Physical abuse is any way of intentionally causing physical harm to a child or young person. This can happen in a domestic situation or elsewhere. It also includes making up the symptoms of an illness or causing a child to become unwell.

          img: ypmh_u2_s3_p1_slide3.svg
        -
          title: Sexual abuse
          text: |
            Sexual Abuse is forcing or tricking a child or young person in to sexual activities. Often they are too young to know what is happening and that it’s wrong. Sexual abuse can also involve ‘child sexual exploitation', ‘grooming’, and ‘child trafficking’. When a child or young person is exploited they're given things, in exchange for performing sexual activities. Grooming involves being tricked into thinking they are in a loving relationship either in person or online. Children and young people can be trafficked into or around the country to be sexually exploited using intimidation.

          img: ypmh_u2_s3_p1_slide4.svg
        -
          title: Criminal exploitation
          text: |
            Criminal exploitation is child abuse where children and young people are manipulated and coerced into committing crimes. Children and young people can get involved with gangs through no fault of their own. They might become victims of violence or pressured into doing things like stealing or carrying drugs or weapons. They might be abused, exploited and put into dangerous situations.

          img: ypmh_u2_s3_p1_slide5.svg
  -
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to state different ways bullying can occur; and explain why some children or young people may be more vulnerable to abuse and/or bullying.
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      Not all bullies are the same and each one has a different style and uses different tactics to intimidate and control their victims. Some are very sly while others are really mean. There are also many more types of bullying than the standard physical bullying or name-calling that most people think of.

      Lets have a look in this video at the different ways bullying can occur and how some are more vulnerable.

    video: ypmh_u2_s3_p1_bullying.mp4
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
          What are the different ways can bullying occur? Can you think why some people may be more vulnerable to abuse and/or bullying? Make a note of your answers in the box to the right.
  -
  -
    title: Quick quiz
    copy: 
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Domestic abuse is any type of controlling, bullying, threatening or violent behaviour in relationships either inside or outside the home. 
          answer: Domestic abuse
        -
          sentence: Neglect is the ongoing failure to meet a child's basic needs. A child might be left hungry or dirty, or without proper clothing, shelter, supervision or health care.
          answer: Neglect
        -
          sentence: Criminal exploitation is child abuse where children and young people are manipulated and coerced into committing crimes.  
          answer: Criminal exploitation
        -
          sentence: Cyberbullying is bullying takes place online and unlike offline bullying and can follow the child wherever they go, via social networks, gaming and mobile phone.
          answer: Cyberbullying
    theme: i-quiz
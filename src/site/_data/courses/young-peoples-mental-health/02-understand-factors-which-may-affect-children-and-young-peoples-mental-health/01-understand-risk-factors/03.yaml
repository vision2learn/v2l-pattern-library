title: The role of resilience and support
intro: |
  Let’s now look at some protective factors which could help to limit the impact of the risk factors.
banner: ypmh_u2_s1_p3_resilience.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to explain the role of resilience in relation to children and young people’s mental health.  
  -
    title: The role of resilience
    layout: media
    theme: t-bg-primary
    copy: |
      Resilience is the capacity to ‘bounce back’ from adversity and protective factors increase resilience, whereas risk factors increase vulnerability. Resilient children and young people and their families are more able to deal with difficulties and adversities than those with less resilience. It is therefore necessary for all authorities to support children and young people by recognising risk and protective factors that may enable them to have a resilient response when faced with adversity and help them to recognise the signs for themselves.

    img: /images/svg/ypmh/ypmh_u2_s1_p3_image.svg

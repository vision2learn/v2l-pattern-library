title: The role of resilience and support
intro: |
  Let’s now look at some protective factors which could help to limit the impact of the risk factors.
banner: placeholder.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to explain the role of resilience in relation to children and young people’s mental health.  
  -
    title: Protective factors
    layout: media
    theme: t-bg-primary
    copy: |
      Protective factors can help keep children and young people mentally well. For example, If they are in good physical health, eat a well balanced diet and get regular exercise and are part of a family that gets along well, most of the time, they are going to feel safe and benefit from a more stable life. If they have the time and freedom to play, regularly attend school and take part in local activities, they are more than likely going to have good men-tal health and well being. This will help them to be interested in life, enjoy themselves, and be hopeful, optimistic and have a sense of belonging in their family, school and community, with some control over their own life.

    img: /images/svg/placeholder_icon.svg

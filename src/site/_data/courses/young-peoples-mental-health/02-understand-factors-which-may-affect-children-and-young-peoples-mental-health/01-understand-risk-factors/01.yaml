title: Welcome to Unit two
intro: |
    ### Understand factors which may affect children and young people’s mental health
    
    Welcome to the second unit of your Level 2 Certificate in Understanding children and young people's mental health.  This unit is all about 

banner: ypmh_u2_s1_p1_factors.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit, you will cover the following criteria of your Level 2 Certificate in Understanding children and young people's mental health qualification.

      You will:

      1. Understand risk factors which may affect the mental well-being of children and young people
      2. Understand the potential effects of puberty and developmental changes on the mental health of children and young people
      3. Understand how abuse or bullying may affect the mental health of a child or young person

      [View the complete set of learning outcomes for this unit.](/pdfs/)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      
      * Risk factors and their impact on children and young people
      * How protective factors can limit the impact of risk factors
      * The role of resilience in children’s and young people’s mental health
      * Ways to support children and young people to recognise risk factors and signs of distress in themselves.

title: Puberty and developmental changes
intro: |
  In this session you will learn about the potential effects puberty and developmental changes can have on children’s and young people’s mental health. We will start by first looking at how puberty effects children and young people.

banner: placeholder.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      * The effects of puberty on children and young people
      * How identity, self esteem and body image can affect mental well-being
      * Opportunities and challenges faced during transition to adulthood
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to describe the effects of puberty on children and young people. 
  -
  -
    title: Puberty and its affect on children and young people
    theme: t-bg-primary
    copy: |
      Puberty is when a child's body begins to develop and change as they become an adult and affects children physically, hormonally and mentally so let’s look at how these changes can affect them.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Start of puberty
          text: |
            Girls develop breasts and start their periods around the age of 11. Boys develop a deeper voice and facial hair will start to appear around the age of 12. But it's different for everyone and it's completely normal for puberty to begin at any point from the ages of 8 to 14. and the process can take up to 4 years.
 
          img: ypmh_u2_s2_p1_slide1a.svg
        -
          title: Puberty in girls
          text: |
            The first sign of puberty in girls starts when their breasts begin to develop and they may notice pubic hair start to grow, and for the next couple of years breasts continue to grow and become fuller and they usually have their first period, body hair will increase and they will start to sweat more and get acne. They will have a growth spurt until they reach adult height and gain weight as their body shape changes.
          img: ypmh_u2_s2_p1_slide2a.svg
        -
          title: Puberty in boys
          text: |
            First signs of puberty in boys starts in the genital area and over the next few years this develops further and more body hair appears. Boys start to sweat more and their voice will break. They will often develop acne and have growth spurts of around 3 inches a year and become more muscular. After about 4 years of puberty boys they will take on an adult shape, start shaving, stop growing in height, but may fill out further reaching adult maturity at about 18.

          img: ypmh_u2_s2_p1_slide3a.svg
        -
          title: Puberty and psychological and emotional changes
          text: |
            Puberty can be a difficult time for children as they are coping with changes in their body, possibly acne or body odour as well feel self-conscious in general. They often compare themselves to others of the same age but not necessarily at the same developmental stage. As hormones kick in children develop new emotions and feelings which can have psychological and emotional effects, such as unexplained mood swings, low self-esteem, aggression and depression. They can also become sulky, suddenly start dieting, have crushes on friends, and crave excitement.

          img: ypmh_u2_s2_p1_slide4a.svg
  -
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to describe how children and young people’s identity, self-esteem and body image can affect their mental well-being. 
  -
    title: How Puberty and the changes it brings can affect mental well-being
    layout: media
    theme: t-bg-primary
    copy: |
      The changes caused by puberty can affect personal identity because as the body grows, so the young person becomes more mature and takes more things into consideration and how they look comes more important to them and their body image can cause them to worry. Poor body image is feeling a pressure to live up to an ‘ideal’ body type or appearance and being unhappy when they don’t. 
      
      The physical changes that occur during puberty give rise to a variety of social and emotional changes as well and directly affect the body and brain to alter children's needs, interests, as well as mood. As they start to look and act differently, an array of social influences further accelerate those social and emotional changes.


    img: /images/svg/placeholder_icon.svg

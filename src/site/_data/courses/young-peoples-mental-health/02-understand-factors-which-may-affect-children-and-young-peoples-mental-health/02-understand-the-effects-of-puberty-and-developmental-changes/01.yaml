    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to describe the opportunities and challenges young people may face during the transition to adulthood. 
  -
  -
    title: Developmental changes
    theme: t-bg-primary
    copy: |
      Let’s look at how developmental changes affect the mental health of children and young people. Scroll through the following slides to find out more.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Well developed self-esteem
          text: |
            Young people who are transitioning to adulthood need to have well developed self-esteem to help equip them to manage relationships in different contexts, including education and employment settings, as well as with family and friends.
          img: ypmh_u2_s2_p1_slide1b.svg
        -
          title: Additional problems to cope with
          text: |
            Those who have lived through multiple traumas and disruptive events by the time they begin their transition to adulthood, including abuse, neglect, bereavement, poverty or homelessness, lack of continuity in education, have additional problems to cope with on top of growing up.
          img: ypmh_u2_s2_p1_slide2b.svg
        -
          title: Support of a parent or caring adult
          text: |
            Young people who had the support of a parent or caring adult are less likely to get involved in unhealthy behaviours, such as unprotected sexual activity, alcohol and substance abuse, and crime.
          img: ypmh_u2_s2_p1_slide3b.svg
        -
          title: Permanent relationships
          text: |
            Permanent relationships with supporting adults are a powerful protective factor against the challenges life may throw at them as they transition to adulthood.
          img: ypmh_u2_s2_p1_slide4b.svg

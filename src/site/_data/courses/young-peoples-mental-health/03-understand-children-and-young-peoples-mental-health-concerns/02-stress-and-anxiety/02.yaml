  -
    title: Resilience, stress and anxiety
    theme: t-bg-primary
    copy: |
      _Optional item depending on content_
    
      Scroll through the slides below to learn more about the relationship between resilience stress and anxiety.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Stress
          text: |
            Most people experience stress and anxiety at some point in their lives and this varies depending the age of the person and on the level of severity but they can detrimentally impact on ‘quality of life’. Generally, stress is a response to an external cause whereas anxiety is often caused as a reaction to stress. 
          img: placeholder_icon.svg
        -
          title: Anxiety
          text: |
            Anxiety is typically a persistent feeling of apprehension even when the situation is not threatening or the stressor has gone. Anxiety can also progress to further problems affecting general health and wellbeing such as creating phobias, panic attacks and obsessive compulsive disorder.
          img: placeholder_icon.svg
        -
          title: Resilience
          text: |
            Resilience is the ability to adapt well and recover quickly from stress, adversity, trauma or tragedy. It helps a child or young person to adapt to adversity without lasting difficulties and those who deal with minor stresses are more likely to be able to handle major crises with greater ease. Refer back to unit 1 to find out more about how resilience can help.
          img: placeholder_icon.svg

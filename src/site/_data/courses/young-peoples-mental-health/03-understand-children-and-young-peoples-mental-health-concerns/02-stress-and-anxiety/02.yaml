  -
    title: Quick quiz
    copy: Take a look at the statements below and choose from the drop-down list if it is 'Good' or 'Bad' stress.
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Good stress is more likely to result in positive outcomes if it is seen as a challenge or something to strive to overcome and therefore can help motivate. 
          answer: Good stress
        -
          sentence: The more success children and young people have with dealing with stress; the more confident and in-control they’ll feel and when they are feeling successful, they don’t experience Bad stress. 
          answer: Bad stress
        -
          sentence: Bad stress happens when a threatening situation goes on and on, and that can erode confidence and may seem overwhelming. 
          answer: Bad stress
        -
          sentence: Good stress is more likely to result in positive outcomes if it is seen as a challenge or something to strive to overcome and therefore can help motivate. 
          answer: Good stress

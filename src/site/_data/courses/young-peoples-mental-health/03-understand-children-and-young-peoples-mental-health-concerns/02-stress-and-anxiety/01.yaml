    title: Possible causes of stress and anxiety
    theme: t-bg-primary
    copy: |
      Let’s look at some of the things that might cause stress and anxiety choose from the images below to find out more.

    subInc: 
      type: reveal
      content:
        -
          title: Moving house
          copy: |
            changes in an environment may bring up fear of the unknown. 
          img: placeholder_icon.svg
        -
          title: Bereavement
          copy: |
            Death of a family member may cause fear of the death of others or themselves.
          img: placeholder_icon.svg
        -
          title: New life changes
          copy: |
            Starting nursery, school or moving to senior school brings fear of what to expect.
          img: placeholder_icon.
        -
          title: Family break up
          copy: |
            Family arguments or family breakups creates changes in family life.
          img: placeholder_icon.svg
        -
          title: Traumatic events
          copy: |
            Distressing events such as a house fire or car accident can create great trauma.
          img: placeholder_icon.svg
        -
          title: Family illness
          copy: |
            Family illness can lead to great changes and more responsibilities.
          img: placeholder_icon.svg

title: Stress and Anxiety
intro: |
  In this session you will learn about stress and anxiety in children and young people and how to recognise the signs and symptoms.
banner: ypmh_u3_s2_p1_stress.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * Definition of the terms stress and anxiety
      * The relationship between resilience and stress
      * Possible causes of stress and anxiety
      * Why stress can be both helpful and harmful
      * How to recognise signs of stress and anxiety
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to define the terms stress and anxiety.
  
  -
    title: What is meant by stress and anxiety
    theme: t-bg-primary
    copy: |
      Let’s first look at what is meant by stress and and anxiety, look at the following slides for more information.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: What is stress and anxiety
          text: |
            Stress and anxiety share many of the same physical symptoms, making it difficult to spot the differences between them. Stress can cause individuals to experience mental and physical symptoms. Anxiety, however is defined by persistent, excessive worries that don't go away even in the absence of a stressor.
          img: ypmh_u3_s2_p1_slider1.svg
        -
          title: Stress signs and symptoms
          text: |
            Signs and symptoms of stress can be physical, emotional and behavioural and include aches and pains, headaches and dizziness, tiredness, stomach or digestive troubles, and difficulty sleeping.
          img: ypmh_u3_s2_p1_slider2.svg
        -
          title: Stress causes
          text: |
            Childhood stress can be present in any setting that requires the child to adapt or change. Stress may be caused by positive changes, such as starting a new activity, but it is most commonly linked with negative changes such as illness or death in the family.
          img: ypmh_u3_s2_p1_slider3.svg
        -
          title: Anxiety signs and symptoms
          text: |
            Signs of anxiety in children can include behavioural changes such as moodiness, aggression, short temper or clinginess. They can develop a nervous habit, have difficulty concentrating or heightened fears. Symptoms can include not sleeping well or waking with bad dreams, constantly worrying and having negative thoughts, not eating properly, feeling tense, being irritable and prone to outbursts.
          img: ypmh_u3_s2_p1_slider4.svg
        -
          title: Anxiety causes
          text: |
            Some children are more likely to suffer from anxiety than others. Some children find change difficult and may suffer from anxiety after a period of change, after a distressing or traumatic experience or through insecurity in their life.
          img: ypmh_u3_s2_p1_slider5.svg
  -
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to describe possible causes of stress and anxiety for children and young people.
  -
    title: Possible causes of stress and anxiety
    theme: t-bg-primary
    copy: |
      Let’s look at some of the things that might cause stress and anxiety choose from the images below to find out more.

    subInc: 
      type: reveal
      content:
        -
          title: Moving house
          copy: |
            changes in an environment may bring up fear of the unknown. 
          img: ypmh_u3_s2_p1_reveal1.svg
        -
          title: Bereavement
          copy: |
            Death of a family member may cause fear of the death of others or themselves.
          img: ypmh_u3_s2_p1_reveal2.svg
        -
          title: New life changes
          copy: |
            Starting nursery, school or moving to senior school brings fear of what to expect.
          img: ypmh_u3_s2_p1_reveal3.svg
        -
          title: Family break up
          copy: |
            Family arguments or family breakups creates changes in family life.
          img: ypmh_u3_s2_p1_reveal4.svg
        -
          title: Traumatic events
          copy: |
            Distressing events such as a house fire or car accident can create great trauma.
          img: ypmh_u3_s2_p1_reveal5.svg
        -
          title: Family illness
          copy: |
            Family illness can lead to great changes and more responsibilities.
          img: ypmh_u3_s2_p1_reveal6.svg
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to describe how to recognise signs of stress and anxiety in children and young people.

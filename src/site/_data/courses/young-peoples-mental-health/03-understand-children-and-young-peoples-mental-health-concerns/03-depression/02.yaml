  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to give examples of how depression may affect children and young people.
  -
  -
    title: Case study
    layout: media
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Example of how depression may affect children and young people

      Kate was a sensitive child who would worry that something bad might happed to family members. However she was reasonably sociable and would not be afraid to do things such as play sports or meet with her friends.  In her teens she developed a medical problem and needed hospital treatment and this is when she really started to suffer from depression. Kate lost contact with her friends who were going out and socialising, whilst she remained at home due to complications with her treatment. This semi-confinement made her become anxious of any social situations and have really low moods. She could easily loose her temper and become quite incommunicative. She was also obsessed with the way people saw her which she always thought was negatively. 

      Kate eventually agreed to see the doctor who suggested talking to a counsellor, but she found this difficult to engage with. She also tried cognitive behaviour therapy privately, but gave that up as she felt she was just saying what the therapist wanted her to. 

      Kate was eventually prescribed anti-depressants and after trying different ones found some to suit her. She now feels moderately in control and there are more highs than lows but she needs to maintain the medication, to do this.


    img: /images/svg/ypmh/ypmh_u3_s3_p2_image.svg
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        Can you think of other ways that depression might affect children and young people? Use the box to the right to make some notes.
  -
  -
    title: Quick quiz
    copy: Signs and symptoms of depression in children and young people.  Complete the sentences below using the drop-down list.
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Feeling sad, in a low mood that doesn’t go away, or being irritable or grumpy all the time.
          answer: Feeling sad
        -
          sentence: Interacting less with friends and family and not being interested in things in general.
          answer: Interacting less
        -
          sentence: Lacking confidence or talking about feeling worthless.
          answer: Lacking confidence
        -
          sentence: Constantly feeling tired, sleeping more than usual or maybe having trouble sleeping all.
          answer: feeling tired
    theme: i-quiz

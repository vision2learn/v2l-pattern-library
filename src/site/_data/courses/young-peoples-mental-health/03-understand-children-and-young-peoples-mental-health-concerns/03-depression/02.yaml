  -
    title: Quick quiz
    copy: Signs and symptoms of depression in children and young people.  Complete the sentences below using the drop-down list.
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Feeling sad, in a low mood that doesn’t go away, or being irritable or grumpy all the time.
          answer: Feeling sad
        -
          sentence: Interacting less with friends and family and not being interested in things in general.
          answer: Interacting less
        -
          sentence: Lacking confidence or talking about feeling worthless.
          answer: Lacking confidence
        -
          sentence: Constantly feeling tired, sleeping more than usual or maybe having trouble sleeping all.
          answer: feeling tired
    theme: i-quiz
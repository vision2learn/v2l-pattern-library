title: Recognising the signs of depression
intro: |
  intro text
banner: ypmh_u3_s3_p2_signsof.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to describe possible causes of depression for children and young people.
  -
    title: Possible causes of depression
    theme: t-bg-primary
    copy: |
      Why does a child or young person become depressed? Sometimes depression is triggered by one thing, often it's caused by a mixture of things, such as the child may have a tendency to get depression but has also experienced some difficult life events. Let’s look at some of the things that may increase the chance of depression. 

    subInc: 
      type: reveal
      content:
        -
          title: Family difficulties
          copy: |
            Sometimes depression is triggered by life changing events such as parents separating, a bereavement or a change in the family dynamic.
          img: ypmh_u3_s3_p2_reveal1.svg
        -
          title: Bullying
          copy: |
            Sometimes problems may stem from bullying at school or problems outside of school with other children involved.
          img: ypmh_u3_s3_p2_reveal2.svg
        -
          title: Abuse
          copy: |
            Sometimes there may be abuse in the home involving a close family member or a family friend or externally by someone who should be a trusted person such as a sports coach. This can involve any physical, emotional or sexual abuse.
          img: ypmh_u3_s3_p2_reveal3.svg
        -
          title: Family health
          copy: |
            When there is a family history of depression, other mental health problems or general ill health and pain within the family which can affect the child or young person directly or indirectly.
          img: ypmh_u3_s3_p2_reveal4.svg
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to describe how to recognise signs that a child or young person could be depressed.
  -

title: Harmful behaviour and coping with feelings
intro: |
  Let’s look at harmful behaviour and how children and young people may demonstrate this as a way of coping with their feelings. 
banner: placeholder.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to describe harmful behaviour that children and young people may demonstrate as a way of coping with their feelings.
  -
    title: Harmful behaviour
    theme: t-bg-primary
    copy: |
      Children and young people can develop really harmful behaviour if their feelings are not identified as an issue. Let’s look at this harmful behaviour in a bit more detail in the following slides.
    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Anxiety disorders
          text: |
            Anxiety disorders in children and young people are persistent fears, worries or anxiety that disrupt their ability to participate in play, school or social situations and can cause harmful behaviours. These can include social anxiety, generalised anxiety and obsessive-compulsive disorders.
          img: ypmh_u3_s1_p3_slide1.svg
        -
          title: Self-harm
          text: |
            Self-harm is a very common problem among young people. Some find it helps them manage intense emotional pain if they harm themselves, for example through cutting or burning. However they may not wish to take their own life.
          img: ypmh_u3_s1_p3_slide2.svg
        -
          title: PTSD
          text: |
            Post-traumatic stress disorder (PTSD) can follow any physical or sexual abuse, being the victim of violence or severe bullying. Also witnessing something extremely traumatising, or surviving a disaster can seriously affect children and young people. PTSD can in turn cause harmful behaviours.
          img: ypmh_u3_s1_p3_slide3.svg
        -
          title: Eating disorders
          text: |
            Eating disorders usually start in the teenage years and are more common in girls than boys. The number of young people who develop an eating disorder is relatively small, but eating disorders such as Anorexia and Bulimia can have serious consequences for their physical health and development and can in extremes threaten life.
          img: ypmh_u3_s1_p3_slide4.svg
        -
          title: Depression and mood disorders
          text: |
            Depression is the persist feeling of sadness and loss of interest that disrupts a child or young person’s ability to function to interact with others. Bipolar disorder results in extreme mood swings between depression and extreme emotional or behavioural highs that may cause the individual to be unguarded, and indulge in risky or unsafe behaviours.
          img: ypmh_u3_s1_p3_slide5.svg
  -

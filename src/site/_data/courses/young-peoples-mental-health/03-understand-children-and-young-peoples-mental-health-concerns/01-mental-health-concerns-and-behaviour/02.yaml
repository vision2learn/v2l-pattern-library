title: Mental health concerns and behaviours
intro: |
  In this session you will learn about behaviour that is associated with mental health concerns in children and young people and how early intervention can help when identifying behavioural concerns. 
banner: ypmh_u3_s1_p2_behaviour.jpg
sections:
  -
    title: Range of behaviours that may indicate concerns about a child’s or young person’s mental health
    layout: media
    theme: t-bg-primary
    copy: |
      Mental illness in children can be hard to identify. As a result, many children who could benefit from treatment don't immediately get the help they need but by recognising the warning signs early intervention can be arranged. 

    img: /images/svg/placeholder_icon.svg
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to identify a range of behaviours that may indicate concerns about a child’s or young person’s mental health. 
  -
    title: Reveals
    theme: t-bg-primary
    copy: |
      Let’s look at some of the ways a child’s or young person’s behaviour may change select from the images below to learn more.

    subInc: 
      type: reveal
      content:
        -
          title: Persistent sadness
          copy: |
            Persistent sadness for more than couple of weeks and withdrawing from social interactions.
          img: ypmh_u3_s1_p2_reveal1.svg
        -
          title: Change in personality
          copy: |
            Outbursts or extreme irritability, harmful out-of-control behaviour, drastic changes in mood or personality.
          img: ypmh_u3_s1_p2_reveal2.svg
        -
          title: Loss of concentration
          copy: |
            Difficulty concentrating on things and/or difficulty sleeping.
          img: ypmh_u3_s1_p2_reveal3.svg
        -
          title: Eating problems
          copy: |
            Changes in eating habits, binging and/or loss of weight.
          img: ypmh_u3_s1_p2_reveal4.svg
        -
          title: Medical complaints
          copy: |
            Complaining of frequent headaches or persistent stomachaches.
          img: ypmh_u3_s1_p2_reveal5.svg
        -
          title: Education problems
          copy: |
            Changes in academic performance, or avoiding or missing school.
          img: ypmh_u3_s1_p2_reveal6.svg
  -
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to explain how a child or young person expresses how they are feeling through their behaviour. 
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      _Presentation style - video on behavioural issues intro with presenter and interview_
      
      Mental health issues in children are generally defined as delays or disruptions in development related to age-appropriate thinking, behaviours, social skills or regulation of their emotions. These problems are distressing to children and disrupt their ability to function well in the home, in school or in other social interactions.
      
      Let’s now watch a video on how a child or young person expresses how they are feeling.
    video: ypmh_u3_s1_p2_behavioural_issues.mp4

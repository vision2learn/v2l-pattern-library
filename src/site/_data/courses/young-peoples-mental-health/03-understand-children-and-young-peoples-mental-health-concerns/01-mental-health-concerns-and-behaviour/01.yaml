title: Welcome to Unit 3
intro: |
    ### Understand children and young people’s mental health concerns 
    
    Welcome to the third unit of your Level 2 Certificate in Understanding children and young people's mental health.  This unit is all about understanding behaviours that are associated with mental health concerns in children and young people.

banner: ypmh_u3_s1_p1_concerns.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit, you will cover the following criteria of your Level 2 Certificate in Understanding children and young people's mental health qualification.

      You will:

      1. Understand behaviour that is associated with mental health concerns in children and young people
      2. Understand stress and anxiety in children and young people
      3. Understand depression in children and young people
      4. Know about specific mental health conditions that children and young people may experience

      [View the complete set of learning outcomes for this unit.](/pdfs/v2l_ypmh_learning_outcomes_u3.pdf)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      
      * Behaviours that may indicate concerns about a child’s or young person’s mental health
      * How a child or young person expresses how they are feeling through their behaviour
      * Harmful behaviour that children and young people may demonstrate as a way of coping with their feelings
      * The importance of early intervention when identifying behavioural concerns

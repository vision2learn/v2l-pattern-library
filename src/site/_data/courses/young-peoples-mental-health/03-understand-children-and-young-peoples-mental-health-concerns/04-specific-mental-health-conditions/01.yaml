title: Specific mental health conditions
intro: |
  In this session you will learn about specific mental health conditions that children and young people may experience an how they can impact on their lives.
banner: placeholder.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * Other mental health conditions that may present in children and young people
      * How to recognise a range of mental health conditions in children and young people
      * How other mental health conditions may impact children and young people
      * What might constitute a mental health ‘crisis’ or emergency

  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to outline a range of other mental health conditions that may present in children and young people.
  -
    title: Other mental health conditions
    layout: media
    theme: t-bg-primary
    copy: |
      In the other sessions of this unit we have looked at the more common mental health conditions associated with children and young people such as mood, stress, anxiety and depression and we have seen that many of the causes, signs and symptoms are related or even the same to some degree. But we have also learnt that each child or young person is different in the way they handle things depending on their background, and/or mental and physical make up.


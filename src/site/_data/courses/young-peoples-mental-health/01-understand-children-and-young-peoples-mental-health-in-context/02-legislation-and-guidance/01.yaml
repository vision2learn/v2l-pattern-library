title: Legislation and guidance
intro: |
  In this session you will learn about legislation and guidance and how this can be used to support children and young people with mental health issues. Let’s start by looking at the key points of legislation.

banner: placeholder.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * The key points of legislation
      * Safeguarding
      * How legislation and guidance can be used to support children and young people
      * Duty of care
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to state the key points of legislation in relation to children and young people's mental health.
  -
    title: Legislation and guidance
    theme: t-bg-primary
    copy: |
      Let’s look at the key points of legislation for ‘Mental Health’ in the following slides:

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Two key legislations
          text: |
            There are two specific pieces of legislation that relate to how people with mental health conditions receive care and treatment. They are the Mental Health Act (1983) updated in 2007 and the Mental Capacity Act 2005.
          img: ypmh_u1_s2_p1_slide1.svg
        -
          title: The Mental Health Act
          text: |
            The Mental Health Act sets out when an individual can be admitted, treated and detained in hospital against their wishes and the code of practise for this is clear that this will only be done, if an individual is at risk of harming themselves or others. 

            Being sectioned is the term often used for being held under this Act and for this to happen three people must be in agreement. This should be an approved professional, a nearest relative, a doctor with specialist training such as a psychiatrist or a GP. An interview will take place with the individual to see how they are feeling at the time.
          img: ypmh_u1_s2_p1_slide2.svg
        -
          title: The Mental Capacity Act
          text: |
            Following the Mental Capacity Act code of practise, anything done on behalf of the individual must be carried out with their best interests at heart.

            The Mental Capacity Act aims to empower and protect people who may not be able to make some decisions for themselves and to plan ahead for the future.

          img: ypmh_u1_s2_p1_slide3.svg
        -
          title: Human Rights Act
          text: |
            All services that provide mental health support to children and young people have a legal duty under the Human Rights Act to respect, protect and fulfil their human rights.
            
            This means that those working with a child or young person in a mental health setting have  to take reasonable steps to protect them where they are known to be at immediate risk, for example taking their own life.
          img: ypmh_u1_s2_p1_slide4.svg
        -
          title: Parental Responsibility
          text: |
            Parental Responsibility is defined in the Children Act 1989 and attempts to focus on the parent’s duties towards their child rather than the parent’s rights over their child.
            
            When certain decisions have to be taken about a child, all those with ‘parental responsibility’, are allowed to have a say. This should be about the upbringing of the child but day to day decisions should be taken by the parent or carer who looks after and lives with the child.

          img: ypmh_u1_s2_p1_slide5.svg
        -
          title: Data Protection
          text: |
            The Data Protection Act (DPA) was originally passed in 1988. It was developed to control how personal information is used by organisations or government bodies. It protects how data about people can be used. The Data Protection Act 2018 is the UK's implementation of the General Data Protection Regulation (GDPR). 
          img: ypmh_u1_s2_p1_slide6.svg

    copy: |
      In your assessment you will be required to describe how discrimination can affect the mental health of children and young people.
  -
    title: Discrimination
    theme: t-bg-primary
    copy: |
      When children are treated unfairly and discriminated against, this can have a detrimental effect on their mental health, their self-esteem, and their educational performance.

      Select the images below to learn more:

    subInc: 
      type: reveal
      content:
        -
          title: Schools and organisations
          copy: |
            It is important that schools and organisations understand who might be at risk of discrimination and what can be done to minimise that. Also how they can support children and families who may be at risk of being discriminated against.

          img: placeholder_icon.svg
        -
          title: REWORD or REMOVE?
          copy: |
            It doesn’t matter why the child is being discriminated against, when they are treated differently at school or in their community, this is direct discrimination and negatively affects them, however they can be affected indirectly if they are put at a disadvantage because of who they are and their social, economic or environmental background. 

          img: placeholder_icon.svg
        -
          title: Resilience
          copy: |
            Being discriminated against is a risk factor for poor mental health. Children who experience discrimination will be affected and will react in different ways depending on  how resilient the child is.

          img: placeholder_icon.svg
        -
          title: Feeling different
          copy: |
            Children who experience discrimination may feel different to other children in some way, or “less than” and this can impact their feelings of belonging, their identity, self-belief or self-worth making them feel powerless and frustrated. 

          img: placeholder_icon.svg
        -
          title: Reduce aspirations
          copy: |
            It can reduce aspirations and make them struggle to reach their full potential and may make them at higher risk of being bullied.
          img: placeholder_icon.svg
        -
          title: Ethnicity, faith, culture or language
          copy: |
            Children can experience discrimination due to their ethnicity, as well as their faith, beliefs, culture or language whether perceived or real. They may feel isolated from society and can be at risk of becoming radicalised when they are seen to be vulnerable.
          img: placeholder_icon.svg
    copy2: So it becomes obvious that discrimination can impact a child or young persons mental health but also mental health issues can make a child or young person open to discrimination. This can then become an ever increasing spiral of issues that can impact on their future, and their chances in life if not addressed.


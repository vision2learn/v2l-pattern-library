      Please watch the following video showing how attitudes to mental health have changed over time. 
    video: placeholder_pc.mp4
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to describe how social and cultural attitudes can affect a child or young person’s perception of their own mental health.

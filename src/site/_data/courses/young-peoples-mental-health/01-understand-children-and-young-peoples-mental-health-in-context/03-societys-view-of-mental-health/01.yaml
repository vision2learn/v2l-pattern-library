  -
    title: Definition of terms
    theme: t-bg-primary
    copy: |
      Let’s define some of the terms used when we talk about how society views people with mental health problems negatively.
      Scroll through the slides below to learn more.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Prejudice
          text: |
            Prejudice is a ‘pre-formed’ negative judgment or attitude leading to views that certain individuals or groups are inferior. This can lead to stereotyping and discrimination from others. People without a mental illness can often feel fear, anxiety and avoidance from those who do. People with mental illness can sometimes anticipate this and feel rejection and discrimination and therefore impose stigma upon themselves.

          img: placeholder_icon.svg
        -
          title: Discrimination
          text: |
            Discrimination is often the outcome of prejudice, and can blight the life for many people with mental illness, making a ‘normal’ social, family and work life much more difficult. 
            
            Actions must be taken to redress the social exclusion of people with mental illness, and use the legal measures intended to support all disabled people such as the Disability Discrimination Act to address this.

          img: placeholder_icon.svg
        -
          title: Stigma
          text: |
            Stigma projects the fear and anxiety felt by people onto the person with the diagnosis of mental ill health and ‘shows a mark of disgrace’ associated with a particular person, ill-ness or disorder. Social stigma is the discrimination against, a person based on perceivable social characteristics that serve to distinguish them from other members of a society. The concept of stigma helps in understanding of experiences of social exclusion, but does not give the whole picture and show what is needed to promote social inclusion. 

          img: placeholder_icon.svg
        -
          title: Stereotyping
          text: |
            Stereotyping is fuelled by ignorance and is an obstacle to competent communication, it is ignorance or the lack of correct information that means many people have little knowledge about mental illnesses. To combat this there is a pressing need to convey more useful information, for example about how to recognise the features of mental illness and where to get help.

          img: placeholder_icon.svg
        -
          title: Common
          text: |
            Mental health problems are very common and can affect thousands of people at some time in their life directly or indirectly. Most people who experience mental health prob-lems recover fully, or are able to live with and manage them, especially if they get help early on. 
          img: placeholder_icon.svg
        -
          title: Strong social stigma
          text: |
            But even though so many people are affected, there is still a strong social stigma at-tached to mental ill health.  Many people's problems are made worse by the stigma and discrimination they experience from society, but also from families, friends and employ-ers.
            
            People with mental health problems say that the stigma attached to mental ill health and the discrimination they experience can make their difficulties worse and make it harder to recover. So stigma and discrimination can trap people in a cycle of illness.

          img: placeholder_icon.svg

title: Prevalence of mental health problems
intro: |
  In this section we are going to look at the prevalence of mental health problems amongst children and young people.
banner: placeholder.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to state the prevalence of mental health problems in children and young people.
  -
    title: Prevalence of mental health problems
    layout: media
    theme: t-bg-primary
    copy: |
      More children and young people have problems with their mental health today than 30 years ago and that’s more than likely down the changes in how lives are lived and awareness in mental health issues.  Many of the risk factors for mental health problems in children and young people are based on inequality which may be social, economic or environmental and these inequalities can make them vulnerable to developing a mental health problem.

    img: /images/svg/placeholder_icon.svg
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      Please watch the following video showing up to date data about the prevalence of mental health problems in children and young people.
    video: placeholder_pc.mp4
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        Using the link below carry out some research on current trends and statistics relating to mental health problems in children and young people. Make a note of your findings in the “Time to think” box to the right. 
        
      links:
        Mental health statistics: https://www.mentalhealth.org.uk/statistics/mental-health-statistics-children-and-young-people

  -
    title: Quick quiz
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        Is the following statement true or false? "Sleep problems aren't prevalent with mental ill health":
          answers:
            True: false
            False: true
        Is the following statement true or false? "Family breakup can affect mental health":
          answers:
            True: true
            False: false
        Is the following statement true or false? "50 percent of lifetime mental health problems start in the mid teens":
          answers:
            True: true
            False: false
        Is the following statement true or false? "Emotional well being is not as important as physical wellbeing":
          answers:
            True: false
            False: true
        Is the following statement true or false? "Social media always gives good advice on mental health ":
          answers:
            True: false
            False: true
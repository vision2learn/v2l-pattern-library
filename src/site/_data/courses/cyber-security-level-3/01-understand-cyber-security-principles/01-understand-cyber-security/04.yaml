title: Inadequate cyber security
intro: |
  On this page you will learn about the consequences and implications of inadequate cyber security.
banner: placeholder.jpg
sections:

  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      Make sure that you understand the consequences and implications of inadequate cyber security as you will be asked about this in your assessment.
  -
    title: The consequences and implications of inadequate cyber security
    theme: t-bg-primary
    copy: |
      A successful cyber attack can cause major damage to an organisation or individual. It can lead to a loss of revenue, as well as the time and money spent on fixing the problem, and can also cause a loss of trust and even regulatory fines.

      Select the images below to read what the possible consequences of an attack can include:

    subInc: 
      type: reveal
      content:
        -
          title: Sensitive data
          copy: |
            This can be sold on for money or used by competitors.
          img: placeholder_icon.svg
        -
          title: Personally identifiable information (PII)
          copy: |
            This includes information that can be used to identify specific individuals for attacks such as spear phishing.
          img: placeholder_icon.svg
        -
          title: Protected health information (PHI)
          copy: |
            This is often the target of cyber blackmailers.
          img: placeholder_icon.svg
        -
          title: Personal information
          copy: | 
            This includes information such as birthdates and addresses that can be used in phishing attacks.
          img: placeholder_icon.svg
        -
          title: Intellectual property
          copy: |
            This can be sold on for money or used by competitors.
          img: placeholder_icon.svg
        -
          title: Industry information systems.
          copy: |
            Detailed information on this can be used to launch more sophisticated and damaging attacks.
          img: placeholder_icon.svg    

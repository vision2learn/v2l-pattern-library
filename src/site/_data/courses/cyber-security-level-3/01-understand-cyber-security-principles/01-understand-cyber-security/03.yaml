    title: Key point
    theme: t-bg-supporting3
    copy: 
      Make sure that you understand the concepts of cyber security as you will be asked about these in your assessment.
  - 
    title: The Concepts of Cyber Security
    theme: t-bg-primary
    copy: |
     Cyber Security is the application of technologies, processes and controls that are used to protect systems, networks, programs, devices and data. In short, the aim of security is to assure that all information is safe, protected from the threat of cyber attack. It is a wide term, but the fundamental principles or concepts are Confidentiality, Integrity, Availability and Authentication. 

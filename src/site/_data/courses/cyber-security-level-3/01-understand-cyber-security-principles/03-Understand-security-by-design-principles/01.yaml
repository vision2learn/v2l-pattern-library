title: "Understand security by design principles"
intro: |
  In this session you will learn about:
  What security by design means, the principles behind it and its advantages and disadvantages
banner: placeholder.jpg
sections:
  -
    title: Your learning goals
    theme: t-bg-primary
    copy: |
      By working through this session, you will cover the following criteria of your Level 3 Certificate in the Principles of Cyber Security.
    
      1. Describe the term security by design
      2. Explore the principles of security by design
      3. State the consequences of not considering cyber security during the design phase
      4. Evaluate the advantages and disadvantages of security by design


  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to define the following:
      * Autistic spectrum disorder 
      * Asperger syndrome 
      * High-functioning autism (HFA) 
  -
  -
    title: Social and Communication Disorders
    theme: t-bg-primary
    copy: |
      Let’s look at three social and communication disorders, what they mean and how they relate to each other. Scroll through the slides below to learn more.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Autism spectrum disorder
          text: |
            'Autism spectrum disorder’ is a lifelong developmental condition, relative to brain development and impacts how a person perceives others, causing problems with communication and social interaction. It can also include limited and repetitive patterns of behaviour.  

          img: ua_u1_s1_p3_slide1.svg
        -
          title: Asperger syndrome
          text: |
            Those with ‘Asperger syndrome’ don't have the learning disabilities that many autistic people have, but may have specific learning difficulties with understanding and processing language. Some with Asperger syndrome say the world feels overwhelming and this can cause considerable anxiety especially relating to other people, and taking part in everyday family, school, work and social life.

          img: ua_u1_s1_p3_slide2.svg
        -
          title: High functioning autism
          text: |
            'High-functioning’ autism isn’t an official medical term but its seen as more informative. It describes a milder form of autism or level 1 on the autism spectrum. Those with Asperger syndrome are often described as having high functioning autism showing symptoms but with little need for support and mostly living independent lives.
          img: ua_u1_s1_p3_slide3.svg

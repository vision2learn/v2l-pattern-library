  -
    title: Why is autism considered a spectrum disorder?
    layout: media
    theme: t-bg-primary
    copy: |
      What is meant by autism, the definition of autism has changed and will probably keep on changing as we understand more. Autism is a ‘spectrum’ condition and this refers to the wide range of symptoms and the severity. All autistic people share certain difficulties, but being autistic will affect them in different ways. 
      
      Some feel that the spectrum is too broad, as a person who needs full time support cannot be compared with someone who just finds things ‘too bright’ or ‘too loud’. But what is needed by all is understanding of what it is to be Autistic.
    img: /images/svg/ua/ua_u1_s1_p3_image.svg

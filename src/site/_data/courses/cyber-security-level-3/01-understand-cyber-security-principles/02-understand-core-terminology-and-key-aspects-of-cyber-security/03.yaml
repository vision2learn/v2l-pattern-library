title: Key Sector Vulnerabilities
intro: |
  On this page you will learn about;
  * Sector vulnerabilities
  * Motivations for cyber attacks in key sectors
  * How attacks are carried out 
 

banner: cs3_u1_s2_p3_vulnerabilities.jpg
sections:
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: | 
       Make sure that you understand the key sectors that are vulnerable to cyber attacks and the motivations for attacks in these areas as you will be asked about this in your assessment. 
  - 
    title: Key sectors
    theme: t-bg-primary
    copy: |
      Anyone and any sector is vulnerable to a cyber attack. However, some sectors are more vulnerable than others. This may be because they hold a great deal of personal data or valuable information, or because they tend to have less secure systems. Here are some of the key sectors that are most vulnerable to a cyber attack.

      Select the images below to read 

    subInc: 
      type: reveal
      content:
        -
          title: Health
          copy: |
            Cyber criminals can access personal data from medical records that can be sold on.
          img: cs3_u1_s2_p3_reveal1.svg
        -
          title: Manufacturing
          copy: |
            Can be held to ransom after having their data breached bringing companies to a standstill. 
          img: cs3_u1_s2_p3_reveal2.svg
        -
          title: Finance
          copy: |
            Financially motivated data breaches and server attacks are top concerns.
          img: cs3_u1_s2_p3_reveal3.svg
        -
          title: Government agencies and departments
          copy: |
            Cyber attacks can often be foreign state sponsored aiming to destabilise.
          img: cs3_u1_s2_p3_reveal4.svg
        -
          title: Educational institutions
          copy: |
            Online learning due to the pandemic created greater threats from ransomware attacks.
          img: cs3_u1_s2_p3_reveal5.svg

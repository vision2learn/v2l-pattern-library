    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: | 
       Make sure that you understand how an actor may carry out a cyber attack as you will be asked about this in your assessment. 
  -
    title: Did you know?
    layout: media
    theme: t-bg-primary1a
    copy: |
      A large UK company’s internal network was attacked through their externally managed corporate website. The attackers gained access through the company’s network service provider, which contained a known vulnerability. 
      
      They used software designed to exploit that vulnerability, which was purchased on the Dark Web. 
      
      See below for the following steps that were taken to facilitate the attack.
    img: /images/svg/cs3/cs3_did_you_know.svg
  -
    title: Plan of attack
    theme: t-bg-primary1a
    copy:
    subInc: 
      type: accordion
      content:
        - 
          title: Steps
          copy: |
              __Survey stage:__ As part of their survey of the victim’s network and services, the attackers discovered that the corporate website was hosted by a service provider whose    systems contained a known vulnerability. 

              __Weaponisation:__ The attackers exploited the vulnerability they found to add a specialised exploit delivery script to the corporate website. The script compared the IP addresses of the website’s visitors against the IP range used by the company. 

              __Delivery stage:__ The attackers then infected a number of computers within the company by downloading malware to visitors’ computers within a directory that allowed file execution. More than 300 computers were infected during the delivery stage with remote access malware. 

              __Exploitation:__ The malware then delivered network information to domains owned by the attackers. 

              __Anti-forensics/command and control:__ Once in the system, the attackers installed further tools and were consolidating their position and identified high value users.

              __Detection and repair:__ While the breach was successful, it was detected using network security monitoring. The organisation had an incident response plan in place, which made it possible to investigate the incident using system and network logs, plus forensic examinations of many computers.
    copy2: Click [here](https://www.sentinelone.com/cybersecurity-101/cyber-kill-chain/) to learn more about how attacks are planned and carried out.
  - 
    title: Time to think
    include: 
      type: time-to-think
      copy: |

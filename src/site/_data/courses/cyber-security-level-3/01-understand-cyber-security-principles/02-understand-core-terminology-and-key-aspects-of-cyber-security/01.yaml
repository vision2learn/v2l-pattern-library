title: "Core Terminology"
intro: |
  In this session you will learn about:
  
  Core terminology and the key aspects of cyber security including good and bad actors, their motivations and behaviours and the sectors most vulnerable to cyber attack.
banner: placeholder.jpg
sections:
  -
    title: Your learning goals
    theme: t-bg-primary
    copy: |
      By working through this session, you will cover the following criteria of your Level 3 Certificate in the Principles of Cyber Security.
      
      * Define core terminology used in cyber security
      * Explain the terms good actors and bad actors
      * Distinguish typical behaviours of good actors and bad actors
      * Explain the motivations of good actors and bad actors
      * Identify key sectors that are most vulnerable to a cyber-attack
      * Compare the motivations for a cyber-attack in key sectors
      * Consider how an actor may carry out a cyber-attack

  -
    

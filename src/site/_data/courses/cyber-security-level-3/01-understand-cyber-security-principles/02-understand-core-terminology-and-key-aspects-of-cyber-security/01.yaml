title: "Core Terminology"
intro: |
  In this session you will learn about:
  * The need for cyber security and the impact of cyber crime on individuals, businesses or nations
  * Why issues should be reported promptly so as to minimise that impact.
banner: placeholder.jpg
sections:
  -
    title: Your learning goals
    theme: t-bg-primary
    copy: |
      By working through this session, you will cover the following criteria of your Level 3 Certificate in the Principles of Cyber Security.
    
      1. Common cyber crime vulnerabilities of an individual, business or nation
      2. Impact of cyber crime on an individual, business or nation.
      3. The importance of cyber security for an individual, business or nation.
      4. Why cyber security issues should be reported promptly


title: Welcome to Unit 2
intro: |
    ### Threat intelligence in cyber security
    
    Welcome to the second unit of your Level 3 Certificate in Cyber Security.  In this unit you will guided towards gaining an understanding of threat intelligence, Open Source Intelligence, and the importance of using reliable sources of information. You will also learn about threat models and the effects of malicious software. 

banner: cs3_u2_s1_p1_unit2.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit, you will cover the following criteria of your Level 3 Certificate in Cyber Security qualification.

      You will:

      1. Understand cyber security
      2. Understand core terminology and key aspects of cyber security
      3. Understand security by design principles

      [View the complete set of learning outcomes for this unit.](/pdfs/v2l_cs3_learning_outcomes_u2.pdf)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      
      * Identifying key concepts of cyber threat intelligence
      * These terms in relation to cyber security: Threats, Exploits, Vulnerabilities and Risk 
      * The threat intelligence lifecycle
      * How to find out about and recognise emerging attack techniques
      * What could be included in Open Source Intelligence data sets
      * The importance of using reliable and valid sources of Open Source Intelligence information
      * The importance of using reliable sources of information in relation to cyber security threats
      * Analysis of relevant cyber threat intelligence information requirements for an organisation

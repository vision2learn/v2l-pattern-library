    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to identify key concepts of cyber threat intelligence, and explain cyber security terms.
  -
  -
    title: Key concepts of cyber threat intelligence
    theme: t-bg-primary
    copy: |
      Threat intelligence is the activity of gathering, processing analysing and distributing information related to threats that may target applications and systems. Cyber security, instead of monitoring the threats, actively combats them. It attempts to keep ahead of the attacks by preventing them and responding to attacks to mitigate any damage as soon as possible. 
      
      Let’s look at this in more detail in the following slides.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Cyber threat
          text: |
            A Cyber threat is an intentional malicious act perpetrated by a threat actor or hacker that seeks to damage systems, steal data or disrupt organisations in general. It is important that all businesses and organisations understand the risks that they face. These are made up of the threat, any vulnerability and the impact this could have. Cyber threats include acts of Phishing, Denial of Service attacks (DoS), Virus and Malware etc. 

          img: placeholder_icon.svg
        -
          title: Cyber threat intelligence
          text: |
            Cyber threat intelligence is the process of collecting and analysing information on potential cyber threats, including the motivation behind them the methods being s and the capability of the threat actors in making their attack. There are different types of threat intelligence which use different methods for different purposes.
          img: placeholder_icon.svg
        -
          title: Operational threat intelligence
          text: |
            Operational threat intelligence uses tools, techniques and procedures to try to understand threat actors and their potential attacks. It also is used to assess where resources are needed to prevent future attacks.
          img: placeholder_icon.svg
        -
          title: Tactical threat intelligence
          text: |
            Tactical threat intelligence informs about current TTPs techniques, tactics and procedures that threat actors use. This information can see when an organisation or business has already been attacked, by monitoring logs and incident reports, to inform on how to defend against the threat.
          img: placeholder_icon.svg
        -
          title: Strategic threat intelligence
          text: |
            Strategic threat intelligence informs about changes in the threat landscape seeing if a new threat has emerged. This is usually done by strategic threat experts who publish their reports allowing senior management to make decision on organisation security and protection going forward.
          img: placeholder_icon.svg

    title: Quick quiz
    copy: 
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Threats take many different forms such as malware, data breaches and DoS attacks. 
          answer: Threats
        -
          sentence: Vulnerabilities refers to any weak spots within the cyber security of an organisation, that allows anyone to enter their systems and steal anything of value like data that may compromise and adversely impact an organisations operation. 
          answer: Vulnerabilities
        -
          sentence: Risk refers to the level of impact a cyber attack may have on an organisation and its operations for example financial loss, disruption, and damage to reputation.  
          answer: Risk
        -
          sentence: Exploits are codes that take advantage of a software vulnerability or flaw. 
          answer: Exploits
    theme: i-quiz

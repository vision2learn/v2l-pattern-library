    title: Quick quiz
    copy: Try this quiz to see if you can identify the type of attack.
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Phishing is a term that covers a broad range for cyber attacks that involve tricking victims into sharing sensitive information such as passwords, usernames and financial (credit card and bank account) details for malicious reasons.  
          answer: Phishing
        -
          sentence: Ransomware is malware that encrypts and holds a victim’s information for ransom. 
          answer: Ransomware
        -
          sentence: A (DoS) denial of service attack is where a computer is used to flood or crash a system due by creating too much internet traffic causing it to slow down and eventually stop. 
          answer: (DoS) denial of service
        -
          sentence: Viruses are by nature designed to spread from computer to computer and are able to reproduce themselves. 
          answer: Viruses
    theme: i-quiz

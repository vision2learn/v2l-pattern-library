  -
    title: Case study
    layout: media
    theme: t-bg-primary1a i-case-study
    copy: |
      ### Case study - 

      _Consider the current threat status and make possible recommendations based upon cyber threat intelligence information_

      _Learners must cover information on at least four different types of attack, a business to consumer (B2C) business is easier to focus on. Types of attack could include: phishing, ransomware, Denial of Service ( DOS) & DDoS, virus - slides recommended but feel that this needs to be more challenging as its a L3 - put in quiz??_

    img: /images/svg/ypmh/placeholder_icon.svg
  -
  -
    title: Quick quiz
    copy: Try this quiz to see if you can identify the type of attack.
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Phishing is a term that covers a broad range for cyber attacks that involve tricking victims into sharing sensitive information such as passwords, usernames and financial (credit card and bank account) details for malicious reasons.  
          answer: Phishing
        -
          sentence: Ransomware is malware that encrypts and holds a victim’s information for ransom. 
          answer: Ransomware
        -
          sentence: A (DoS) denial of service attack is where a computer is used to flood or crash a system due by creating too much internet traffic causing it to slow down and eventually stop. 
          answer: (DoS) denial of service
        -
          sentence: Viruses are by nature designed to spread from computer to computer and are able to reproduce themselves. 
          answer: Viruses
    theme: i-quiz
  
  -
    title: Quick quiz
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        Is the following statement true or false? "statement":
          answers:
            True: true
            False: false
          feedback: text
        Question 2:
          answers:
            Receiving calls: false
            Summarising calls: false
            Asking about the weather: true
          feedback: text
        Select one option to complete the following sentence:"text __________ text.":
          answers:
            Negative: false
            Unprofessional: false
            Positive: true
          feedback: text

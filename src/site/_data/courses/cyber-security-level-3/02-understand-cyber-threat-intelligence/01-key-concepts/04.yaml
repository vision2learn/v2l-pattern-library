title: Recommendations
intro: |
  On this page you will learn about recommendations you can make to combate threat models and the effects of malicious software. 
banner: cs3_u2_s1_p4_recommendations.jpg
sections:
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to:
      * Consider the current threat status and make possible recommendations based upon cyber threat intelligence information
      * Analyse relevant cyber threat intelligence information requirements for an organisation.
  -
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### What is threat status?
      
      Cyber security professionals are responsible for analysing the current threat status and making recommendations for action. They have to take into consideration the intelligence information they have gathered and how it may impact the organisation or business and their systems. So, what exactly is threat status? Let’s look at this in the following video.
    video: cs3_u2_s1_p4_recommendations.mp4
  -
    title: Case study
    layout: media
    theme: t-bg-primary1a i-case-study
    copy: |
      ### The Suez Canal blockage

       The blockage of the Suez Canal by the cargo ship Ever Given (EverGreen) in the narrow Suez Canal blocked billions of dollars of shipping and commerce between the Mediterranean Sea and the Middle East and South Asia.
       
       The Suez canal, enables approximately 12% of global shipping to bypass the long trip around the continent of Africa which saves around 2 weeks shipping time. If there is a blockage of this canal, it can have a serious impact in disrupting global commerce.
       
       Take a look at the website below to see what was gathered from open source intelligence sources.
    img: /images/svg/cs3/cs3_u2_s1_p4_casestudy.svg

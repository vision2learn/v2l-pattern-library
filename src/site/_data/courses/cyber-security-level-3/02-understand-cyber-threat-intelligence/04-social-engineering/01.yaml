  -
    title: Did you know?
    theme: t-bg-primary1a
    copy: |
      
    subInc: 
      type: accordion
      content:
        - 
          title: For attacks against companies
          copy: |
            Threat actors can use corporate websites and directory listings to find targets, as well as Google dorking or LinkedIn.
            
            For example, LinkedIn has a special URL where you can quickly identify targets of interest: http://linkedin.com/title/<job-title>-at-<company>/
            
            Example:
            The following URL would list all directors at example-company (fictitious company)
            http://linkedin.com/title/director-at- example-company /
            
          img: /images/svg/cs3/cs3_did_you_know.svg

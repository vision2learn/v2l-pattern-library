  -
    title: Social engineering
    theme: t-bg-primary
    copy: |
      So what exactly is social engineering and how do cyber criminals like to use it?  

    subInc: 
      type: accordion
      content:
        - 
          title: What is Social engineering?
          copy: |
            Social engineering is the name given to techniques used by cyber criminals to manipulate and trick people into giving out confidential information, transferring money or downloading malware. 

            Social engineers use psychology to manipulate a victim’s feelings of curiosity or fear to draw them into a trap. They often find it is easier to exploit a person’s willingness to trust rather than go to the trouble of trying to discover ways to hack their software.

            As technology and subsequently cyber security gets more advanced, cyber criminals are now turning more to social engineering, to make their initial attack on a system by exploiting the weakest link in an organisational chain the user. 

          img: cs3/cs3_u2_s4_p1_accordian1.svg
        - 
          title:  How do cyber criminals use it?
          copy: |
            Unlike cyber attacks that rely on system vulnerabilities to gain access to unauthorised devices, social engineering targets human vulnerabilities. They can use a variety of methods both online and offline such as phone calls, emails, text messages or other means to con unsuspecting users into compromising their own systems or their work-based systems by installing malware and handing over access to their sensitive and personal information and potentially that of their employer. 
            
            We have already looked at OSINT or open source intelligence information in previous videos but let’s have a quick recap and look at how open source information can help cyber criminals with social engineering.

          img: cs3/cs3_u2_s4_p1_accordian2.svg  

  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        Conduct research to find some specific examples of attacks using the malicious software mentioned here. What type of software was used in the attack? How was it used? What was the outcome? How was it discovered?
  -
    title: Quick quiz
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        Is the following statement true or false? "Every individual is a potential target of malicious software attacks as well as every business or organisation, no matter what the size.":
          answers:
            True: true
            False: false
          feedback: By attacking one individual a threat actor can have access to so many others and the potential to access whole systems.
        How can you stop malicious software infecting a system?:
          answers:
            Have anti-malware software installed: true
            Do not use the internet: false
            Do not download items from websites: false
          feedback: Make sure that a system is protected by legitimate 'anti-malware' purchased from a reputable company even if it is a mobile system and that it is kept up to date, both the operating system and any software installed on it such as a web browser. 
        Select one option to complete the following sentence:"If malware removal is unsuccessful, it may be that the ________________ may need to be reinstalled along with applications and programs from scratch.":
          answers:
            software programs: false
            document folders: false
            operating system: true
          feedback: If malware removal is unsuccessful, it may be that the operating system may need to be reinstalled along with applications and programs from scratch. If everything is backed up it shouldn't be a problem but contacting the system suppliers help desk may be necessary.
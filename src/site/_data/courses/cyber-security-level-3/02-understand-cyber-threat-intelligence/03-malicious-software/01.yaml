    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to:
      * Describe the effects of different types of malicious software on an infected system 
      * Describe the motives for using specific malicious software attacks
      * Identify how specific malicious software attacks are made more effective due to human factors 

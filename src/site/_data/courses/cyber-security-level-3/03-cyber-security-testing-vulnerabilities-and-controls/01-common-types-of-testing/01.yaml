title: Welcome to Unit 3
intro: |
    ### Cyber security testing, vulnerabilities and controls
    
    Welcome to the third unit of your Level 3 Certificate in Cyber Security.  In this unit you will learn about the common types of testing in cyber security including mitigations following testing. You will also learn about vulnerabilities and the steps taken when a vulnerability is identified, and the use of controls within cyber security.

banner: placeholder.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit, you will cover the following criteria of your Level 3 Certificate in Cyber Security.

      You will:

      1. Understand common types of testing in cyber security
      2. Be able to reduce or remove potential cyber security vulnerabilities
      3. Understand controls in cyber security
      4. Be able to apply a cyber security control

      [View the complete set of learning outcomes for this unit.](/pdfs/)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      
      * Different types of cyber security testing
      * Why cyber security testing is important
      * Comparisons of different types of cyber security testing
      * Mitigations following cyber security testing
      * Why it is important to retest following any changes made
      * How the outcomes of cyber security testing can be reported
      * Why the outcomes of cyber security testing must be reported
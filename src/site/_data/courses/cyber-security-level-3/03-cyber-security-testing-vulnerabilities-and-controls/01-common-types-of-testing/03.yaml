  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        What are some of the risks of not reporting the results of cyber security testing?
  -
  -
    title: Quick quiz
    copy: 
    subInc: 
      type: word-quiz
      content:
        -
          sentence: A penetration test validates that an organisations IT systems are not vulnerable to any known issues as of the day of the test. 
          answer: A penetration test
        -
          sentence: Remediation verification testing makes sure that any vulnerabilities identified during pen testing have been dealt with successfully. 
          answer: Remediation verification testing
        -
          sentence: A summary version of a report can be more widely shared detailing the scope and approach of an attack and how this can be mitigated.
          answer: summary version of a report
        -
          sentence: Once testing is done the most common form of reporting is a detailed report usually sent to senior management. 
          answer: detailed report
    theme: i-quiz

title: Retesting and reporting outcomes
intro: |
  On this page we will look at the importance of retesting and reporting outcomes.
banner: cs3_u3_s1_p3_retesting_and_reporting.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to:
      * Explain why it is important to retest following any changes made
      * How the outcomes of cyber security testing can be reported
      * Why the outcomes of cyber security testing must be reported
  -
  -
    title: Testing
    theme: t-bg-primary
    copy: |
      Scroll through the slides below to learn more about testing.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Importance
          text: |
            When changes are made to a system or network there is the potential to create new vulnerabilities. It is therefore imperative that further testing and retesting is done to mitigate this. This may be done on a regular basis and is called remediation verification testing.
          img: cs3_u3_s1_p3_slide1.svg
        -
          title: How
          text: |
            Once testing is done the most common form of reporting is the detailed reports usually sent to senior management. Smaller tests and regular scans may be reported as memos, incident logs or as a short report. 
          img: cs3_u3_s1_p3_slide2.svg
        -
          title: Why
          text: |
            Reporting testing results is the best way that an organisation can regain trust after a breach and reassure their clients and customers that their system is secure. This can also help an organization to better plan for any future threats and allocate the appropriate resources to help prevent this happening.
          img: cs3_u3_s1_p3_slide3.svg
  -
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Importance of retesting and reporting outcomes
      
      Please see the following video on retesting and reporting outcomes.
    video: cs3_u3_s1_p3_retest_reporting.mp4
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        What can happen if an organisation does not conduct remediation verification testing?
  -
  -
    title: Read
    theme: t-bg-primary2 i-read

          copy: |
            According to a report by McKinsey, many companies report thousands of attacks every month, ranging from the trivial to the extremely serious. Several billion data sets are breached annually.

            Every year, hackers produce some 120 million new variants of malware. At some global companies, the chief information security officer (CISO) has a team of more than 2,000 people.
            

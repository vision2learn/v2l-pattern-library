title: Understand common types of testing in cyber security
intro: |
  In this session we will look at the common types of testing in cyber security, why testing is important and the mitigations that follow testing.
banner: cs3_u3_s1_p2_common_types.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to:
      * Explain different types of cyber security testing
      * Identify why cyber security testing is important
  -
  -
    title: Cyber security testing
    theme: t-bg-primary
    copy: |
      Cyber security testing uses a range of methodologies and different tactics to measure how effective cyber security strategy is against a potential attack.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Vulnerability scanning
          text: |
            Is using automated software to scan for and find system vulnerabilities identifying security weaknesses and flaws in systems and software running on them. A simple vulnerability scan may involve checking software against lists of known issues, or trying a brute force attack to see if they are secure.
          img: cs3_u3_s1_p2_slide1.svg
        -
          title: Security scanning
          text: |
            Uses both manual tools and automated software to assesses the general security level such by detecting weak points and loopholes in the security of a website, web-based program or network system. The more intricate the system the more complicated the security scan will be, and these can be done regularly or as a one-time check.
          img: cs3_u3_s1_p2_slide2.svg
        -
          title: Penetration testing
          text: |
            Combines automated and manual techniques and is done by trusted, certified security experts. The two most common forms are application penetration testing, to detect technical vulnerabilities, and infrastructure penetration testing, which examines servers, firewalls, and other hardware. Pentesters simulate a malicious attack and their goal is to expose unknown vulnerabilities such as zero-day threats and business logic flaws. They use vulnerability identification for web applications and Scenario-driven testing.
          img: cs3_u3_s1_p2_slide3.svg
        -
          title: Social engineering testing
          text: |
            Is the practice of attempting to perform social engineering scams on a company’s employees to check out the level of vulnerabilities and to test the employees use of security policies and guidance. The goal is to find out how successful security training is and where there is need for improvement. Tests that may be tried may involve looking for physical vulnerabilities, or phishing scams.
          img: cs3_u3_s1_p2_slide4.svg
        -
          title: Ethical hacking / Red teaming
          text: |
            Is designed to take a hacker like approach to detect vulnerabilities. It involves a simulation test in which a hacker or group of hackers try to break into a system. A red team attack is a team exercise designed to see how well an organisation responds to an attack, and the rules of engagement will be agreed in advance.
          img: cs3_u3_s1_p2_slide5.svg

    title: Case study
    layout: media
    theme: t-bg-primary1a i-case-study
    copy: |
      ### Case study - ANU ?? THIS ONE OR A DIFFERENT ONE??

      In 2018, a threat actor launched an attack on Australia National University (ANU) and gained access to the system containing confidential information about student administration, financial management and human resources. This breach allowed the attacker to steal an unknown quantity of information.

      The attack was launched at first with spear phishing emails, to try and gain the login credentials of an administrator or someone with access to targeted systems. A senior staff member received this email and did not click on or open the window, only previewing it before deleting the email. But the malicious code in the email did not require more interaction from the staff member in order to steal their login credentials as well as access their calendar.

      All the emails sent by the attacker looked legitimate and used information from ANU’s website to create believable emails. With each extra piece of information, the attacker found it easier to gain the next login credentials and more access to the network. 
      In late November 2018, ANU put in place a remediation plan that included a routine firewall change, which removed the attacker’s access to the system. The actor, however, immediately began activity to get back into the network, and successfully regained access after two weeks. ANU was able to detect the next spear phishing campaign and remove the actor again. There were several more attacks after this, but the attacks were unsuccessful and stopped in March 2019.

    img: /images/svg/ypmh/placeholder_icon.svg

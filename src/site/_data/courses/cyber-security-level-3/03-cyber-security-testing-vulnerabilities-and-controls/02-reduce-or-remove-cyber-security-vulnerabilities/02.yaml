  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        What methods might you use to report the following vulnerabilities, and why?
        * software that needs a regular security update from the manufacturer
        * a serious hacking attempt where attackers gained access to the system from a subnet
        * an employee who clicked on a link in an email from someone they did not know
  -
  -
    title: Case study
    layout: media
    theme: t-bg-primary1a i-case-study
    copy: |
      ### Case study - ABC Zipper 
      
      _To be replaced by Grange Secondary School case study - this left in for reference purposes_

      In your work for ABC Zipper, you use testing to discover a number of different security vulnerabilities: 
      * a software backdoor (a way for hackers to gain access) that has been in the system for the past 5 years and has never been used by hackers; 
      * software that does not have the latest patch (it is 1 week out of date); 
      * an insecure application user interface that could make all of ASC’s top-secret zipper designs and customer information accessible to hackers; 
      * and a back entrance to the building that is never locked because workers like to sneak in and out of it to go for smoke breaks. 
      
      How would you prioritise which vulnerabilities to fix first and why? Which steps would you use to manage these vulnerabilities?

    img: /images/svg/ypmh/placeholder_icon.svg
  -
  -
    title: Time to practice
    theme: t-bg-primary3 i-practice
    copy: |

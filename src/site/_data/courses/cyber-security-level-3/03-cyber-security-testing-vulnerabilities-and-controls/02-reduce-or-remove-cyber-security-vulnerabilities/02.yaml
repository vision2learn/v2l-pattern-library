title: Reduce or remove potential cyber security vulnerabilities
intro: |
  On this page the focus will be on demonstrate the steps to be taken, how to apply the correct responses to a vulnerability, and how to develop the appropriate communications strategy to mitigate future vulnerabilities.
banner: cs3_u3_s2_p2_reduce_or_remove.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to 
      * demonstrate the steps to be taken when a vulnerability has been identified
      * apply the correct response to the vulnerability
      * develop an appropriate communication to mitigate future vulnerabilities
  -
  -
    title: Symbols and terminology
    theme: t-bg-supporting3
    copy: |
      One way of demonstrating  the steps that need to taken when a vulnerability has been identified is to use a **process map**.
      
      One popular method of process mapping is the creation of **flowcharts**. 

      A flowchart provides a method for mapping the interlinked activities and tasks that form a process. It can help organisations to detect any problems that occur in processes.

      Flowcharts work using symbols. Select each symbol below to learn more. 

    subInc: 
        type: reveal
        content:
            -
                title: Start or End flow
                copy: |
                    Example:
                    * Receive complaint
                    * Receive request
                    * Proposal

                img: lm_u1_s3_p1_symbol_startend_1.svg
            -
                title: Process or activity
                copy: |
                    Example:
                    * Hold a meeting
                    * Make a phone call
                    * Send a request
                img: lm_u1_s3_p1_symbol_process_1.svg
            -
                title: Decision
                copy: |
                    Example:
                    * Yes / No
                    * Agree / Disagree
                    * Pass / Fail
                img: cs3_u3_s2_p2_reveal3.svg
            -
                title: Document
                copy: |
                    Example:
                    * Report is completed 
                    * Meeting minutes 
                    * Form is filled out
                img: lm_u1_s3_p1_symbol_document_1.svg
            -
                title: Storage
                copy: |
                    Example:
                    * Store documents
                    * stack envelopes
                    * File contacts
                img: lm_u1_s3_p1_symbol_storage_1.svg
            -
                title: Database
                copy: |
                    Example:
                    * Stock files
                    * Order files
                    * Sales record
                img: lm_u1_s3_p1_symbol_database_1.svg
    
  -
    title: The flow chart process
    theme: t-bg-primary
    copy: |
      ### Main Steps

      1. Identify all of the key processes or activities. You may write these on cards or sticky notes.
      2. Sequence these processes on a large piece of paper.
      3. Work through the sequence from start to finish, identifying key decisions and resulting documentation.
      4. Finalise the sequence. Focus on links between processes, decisions and outputs.
      5. Produce the final flowchart, checking you’ve involved all key personnel.
  -

    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Response and communication to a vulnerability

      Please see the following video on applying the correct response to a vulnerability, and developing an appropriate communication to mitigate future vulnerabilities.
    video: cs3_u3_s2_p1_vulnerability_response.mp4
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        What methods might you use to report the following vulnerabilities, and why?
        * software that needs a regular security update from the manufacturer
        * a serious hacking attempt where attackers gained access to the system from a subnet
        * an employee who clicked on a link in an email from someone they did not know
  -
  -
    title: Case study
    layout: media
    theme: t-bg-primary1a i-case-study
    copy: |
      ### Case study - Grange Road Secondary School
      
      You’ve been recently begun working within the IT department of Grange Road Secondary school. The school has restricted computer access for staff and pupils and has procedures in place for security and GDPR. However, you’ve been unable to find a policy specifically for cyber security and recently there’s been an increase of pupils accessing unsecure sites and more phishing emails are being received. 
      
      Think about what steps will you need to take for the identified vulnerability and open the PowerPoint document in the below 'Time for assessment task' to produce a flow chart to demonstrate the steps. This will form part of your assessment. 


    img: /images/svg/cs3/cs3_u3_s2_p2_case_study.svg
  -
  -
    title: Time for assessment task
    theme: t-bg-primary3 i-practice
    copy: |
      For the Grange Road Secondary School Case study use the following [Unit 3 Section 2 Assessment - Flow Chart](/pdfs/cs3_u3_s2_assessment_workbook.pptx) document to show the following:
      * the steps that need to be taken
      * response to the vulnerability
      * communications to mitigate future vulnerabilities.

      Remember that this document will be part of your Unit 3 assessment so make sure you save it with your name.

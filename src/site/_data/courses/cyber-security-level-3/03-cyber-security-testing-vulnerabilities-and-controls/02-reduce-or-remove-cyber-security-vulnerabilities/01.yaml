    title: Cyber security vulnerabilities
    theme: t-bg-primary
    copy: |
      There are many different types of cyber security vulnerabilities these are based on where a vulnerability exists but they can be broken down into 4 types.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Network vulnerabilities
          text: |
            Issues with a networks hardware or software exposing it to attack form an external source. Examples would be insecure WiFi access points and poorly configured firewalls.
          img: placeholder_icon.svg
        -
          title: Operating System vulnerabilities
          text: |
            These are found within assets that the OS is installed on and offer attackers access by hidden backdoor programs.
          img: placeholder_icon.svg
        -
          title: Human vulnerabilities
          text: |
            Humans are often the weakest link in the cybersecurity architecture as they can easily expose sensitive data and inadvertently give access to hackers. They may also do this maliciously.
          img: placeholder_icon.svg
        -
          title: Process vulnerabilities
          text: |
            Some organisations have weak processes in place or lack an organized cyber security system. An example of this could be weak passwords easily hackable, this can also fall under human vulnerabilities.
          img: placeholder_icon.svg

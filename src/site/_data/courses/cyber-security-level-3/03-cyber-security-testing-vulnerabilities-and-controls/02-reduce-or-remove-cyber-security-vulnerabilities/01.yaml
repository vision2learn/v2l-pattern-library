title: Reduce or remove potential cyber security vulnerabilities
intro: |
  In this session, you will learn how to identify cyber security vulnerabilities, the steps to take once a vulnerability has been identified, how to apply the correct responses to a vulnerability and how to develop the appropriate communications strategy to mitigate future vulnerabilities.
banner: placeholder.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      * Cyber security vulnerabilities
      * The steps to be taken when a vulnerability has been identified
      * How to apply the correct response to the vulnerability
      * How to develop an appropriate communication to mitigate future vulnerabilities

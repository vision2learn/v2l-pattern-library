    title: Case study
    layout: media
    theme: t-bg-primary1a i-case-study
    copy: |
      ### Case study - example of a control

      Read through this case study and then do the tasks below.
      
      In your role as a cyber security professional for the ABC Zipper Company, you have now identified that the files and folders stored on the company’s shared drive are accessible to all personnel, regardless of their position within the company. As this is a breach of GDPR and poses a security threat, you need to implement a system to ensure that the correct personnel only access the folders and files that they need.


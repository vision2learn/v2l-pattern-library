  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to identify cyber security controls.
  -
  -
    title: What are cyber security controls?
    theme: t-bg-primary
    copy: |
      Security controls are systems used to protect data and infrastructure in fact any way of safeguarding an organization from security risks. These may be: 

    subInc: 
      type: reveal
      content:
        -
          title: Physical security controls
          copy: |
            Such as perimeter fencing, locks, entry controls, surveillance equipment and cameras, and intrusion detection.
          img: cs3_u3_s3_p1_reveal1.svg
        -
          title: Cyber security controls
          copy: |
            Such as usernames and passwords, multifactor authentication, anti-malware, and firewalls.
          img: cs3_u3_s3_p1_reveal2.svg
        -
          title: Cloud security controls
          copy: |
            Such as measures taken in conjunction with cloud services providers.
          img: cs3_u3_s3_p1_reveal3.svg
  -
  -
    title: Cyber security controls
    theme: t-bg-primary
    copy: |
      Scroll through the slides to learn more about cyber security controls in more detail.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Encryption and Back Up of Data
          text: |
            Encryption is used to protect data confidentiality whilst in transit and whilst stored on devices. Backing up data means that permanent loss can be prevented, and the impact of a breach lessened as data can be replaced but these backups must also be encrypted to also keep them safe from breach.
          img: placeholder_icon.svg
        -
          title: Antivirus, Antimalware and Patch Management
          text: |
            Antivirus and antimalware can help to protect against malware infection and setting up regular update for all software and firmware can help to keep things protected from the latest threats.
          img: placeholder_icon.svg
        -
          title: Usernames, Passwords, and Multi Factor Authentication
          text: |
            Adding multi factor authentication to usernames and passwords can help to create a more robust system of access making it harder for hackers to gain entry.
          img: placeholder_icon.svg
        -
          title: Access Controls and Permissions
          text: |
            Users should only be granted access to areas that they specifically need to use and at a level appropriate to their role. Privileges and permissions should only be granted as they are needed for individuals to perform their role.
          img: placeholder_icon.svg
        -
          title: Network Perimeter Defences
          text: |
            Network perimeter defences such as firewalls can filter network traffic and restrict access to websites deemed malicious and Virtual Private Networks (VPN) can be used to hide online users from potential attackers.
          img: placeholder_icon.svg

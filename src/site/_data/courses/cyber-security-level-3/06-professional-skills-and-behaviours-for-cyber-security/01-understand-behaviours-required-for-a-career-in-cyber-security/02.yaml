  -
    title: Case study
    layout: media
    theme: t-bg-primary1a i-case-study
    copy: |
      ### Case study - background check

      A candidate named Bob applied for a senior IT architect role with a large IT firm that specialises in cyber security. He seemed very well qualified, but in the online application form, Bob’s CV and LinkedIn profile, he stated that he had worked for several years on government projects with a high level of clearance. He gave enough detail to appear credible, but he claimed he could not provide documents to prove the contracts or names of line managers because of the secret status of the projects.
      
      Criminal record checks showed that Bob had actually been previously arrested for hacking, fraud, and money laundering and had been in prison during the time he claimed to be working for the government. Bob had simply fabricated a CV that he hoped would never be challenged. 

    img: /images/svg/cs3/cs3_u6_s1_p2_case_study.svg

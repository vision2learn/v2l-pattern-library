    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to:
      * Describe possible employee screening checks that an employer might carry out
      * Consider potential consequences of unsatisfactory findings as a result of employer checks
  -
  -
    title: Employee screening checks
    theme: t-bg-primary
    copy: |
      Some employers operate screening checks for employees so what exactly are these?

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Disclosure and Barring Service (DBS) check
          text: |
            A basic DBS check can be used for any position or purpose, and it can be requested by an individual. An employer may also be requested one to be provided. A DBS is a basic criminal record check which contains details of convictions and conditional cautions.
          img: placeholder_icon.svg
        -
          title: Guilty by Association check
          text: |
            REWRITE - Incorrect (JM)
            
            Guilty by Association refers to an individual being guilty because of their association with a person who has committed a crime or has extreme beliefs even if they themselves have not broken the law. This may involve checking out social media to see if any worrying allegiances apply.
          img: placeholder_icon.svg
        -
          title: Security checks (terror lists, address checks, employment verification checks)
          text: |
            Security checking is done as a screening process 
            
            REWRITE - Incorrect (JM) 'specially to check individuals who may have access to government assets'. 
            
            These may vary according to the role the individual is applying for and what area they will be working in. It may include previous employment checks, criminal record checks, address checks and checks against belonging to any terrorist groups or organisations.
          img: placeholder_icon.svg
        -
          title: Credit Checks
          text: |
            Businesses that involve law and finance are legally required to perform credit checks on their potential employees, but other companies may also do this 
            
            REWRITE - Incorrect (JM) 'if the role involves working with money'.
          img: placeholder_icon.svg
  
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Screening checks and potential consequences
      
      Please see the following video to learn more about employee screening checks and the potential consequences of unsatisfactory findings as a result of employer checks.
    video: placeholder_pc.mp4
  -
  -
    title: Case study
    layout: media
    theme: t-bg-primary1a i-case-study
    copy: |
      ### Case study - background check

      A candidate named Bob applied for a senior IT architect role with a large IT firm that specialises in cyber security. He seemed very well qualified, but in the online application form, Bob’s CV and LinkedIn profile, he stated that he had worked for several years on government projects with a high level of clearance. He gave enough detail to appear credible, but he claimed he could not provide documents to prove the contracts or names of line managers because of the secret status of the projects.
      
      Criminal record checks showed that Bob had actually been previously arrested for hacking, fraud, and money laundering and had been in prison during the time he claimed to be working for the government. Bob had simply fabricated a CV that he hoped would never be challenged. 

    img: /images/svg/cs3/cs3_u6_s1_p2_case_study.svg

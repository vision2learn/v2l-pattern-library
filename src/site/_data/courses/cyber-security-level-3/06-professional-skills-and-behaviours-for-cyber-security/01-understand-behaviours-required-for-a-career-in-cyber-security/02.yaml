title: Positive digital identity and screening checks
intro: |
  In this session we will look at the behaviours required for a career in cyber security. On this page we will look at the importance of managing and promoting a positive digital identity, and employee screening checks.
banner: placeholder.jpg
sections:
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to explain the importance of managing and promoting a positive digital identity.

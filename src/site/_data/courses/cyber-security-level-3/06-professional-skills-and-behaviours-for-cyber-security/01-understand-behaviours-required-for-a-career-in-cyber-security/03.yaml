title: Security clearance and Bias
intro: |
  On this page we will look at the different levels of security clearance, at how bias can influence cyber security, and the benefits of a security by design mindset. 
banner: cs3_u6_s1_p3_security_clearence_o2.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to describe the following security clearance levels:
      * BPSS (Baseline Personnel Security Standard)
      * SC (Security Checked)
      * DV (Developed Vetting)
  -
  -
    title: Levels of security clearance
    theme: t-bg-primary
    copy: |
      When working with or for a government organisation there will always be some form of security screening. This involves anyone in the civil service, armed forces, government contractors or even temporary staff. These are usually much more involved than just pre-employment checks and are more security oriented.
      
      Let’s look at the different levels of security clearance
 
    subInc: 
      type: accordion
      content:
        - 
          title: BPSS (Baseline Personnel Security Standard)
          copy: |
            This level of clearance is the baseline for pre-employment security screening.  It is not formal security clearance, but is enough for most jobs. It can also be used with more rigorous vetting procedures.

            It covers checks for:
            * Identity
            * Nationality and immigration status
            * Employment history (past 3 years)
            * Criminal record 
            * and reasonable account of significant time spent abroad (6 months or more in the past 3 years)
            
            Documents will need to be supplied as proof.

          img: /images/svg/cs3/cs3_u6_s1_p3_accordian1.svg 
        - 
          title: SC (Security Checked)
          copy: |
            This level of clearance is required for those with long term frequent uncontrolled access to secret information, and supervised access to top secret assets. This also includes anyone in a position who could learn about secret plans, policies, or projects.

            Checks include a: 
            * BPSS
            * Security questionnaire
            * Company records check 
            * Criminal records check 
            * Credit and financial history check
            * Security service check (MI5)
            * May also include a third part security questionnaire check
            
            For overseas posts with a significant espionage threat they may also need an Enhanced Security Check.

          img: /images/svg/cs3/cs3_u6_s1_p3_accordian2.svg 
        - 
          title: DV (Developed Vetting)
          copy: |
            Is used for individuals employed in posts that often require access to top secret assets or code word material. Also, for those who work with category 1 nuclear material or have access to classified material that originates overseas.
            
            DV checks include:
            * BPSS
            * DV security questionnaire
            * Departmental and company records check
            * Criminal records check
            * Credit and financial check
            * Security service check (MI5)
            * Review of personal finances assets and liabilities.
            * Detailed interview with self and referees by trained investigating officer.
            * Security questionnaire of third parties such as family members.
            
            Some positions may involve an EDV or Enhanced Developed Vetting

          img: /images/svg/cs3/cs3_u6_s1_p3_accordian3.svg
        - 
          title: CTC (Counter Terrorist Check)
          copy: |
            This involves those who work in close proximity to public figures who may be at particular risk from terrorist attack or are given access to material that may be of value to terrorists.
            
            CTC checks include:
            * BPSS
            * Security questionnaire
            * A records check including personal files and security records
            * Criminal records
            * Security service check (MI5)
            * Possibly an interview

          img: /images/svg/cs3/cs3_u6_s1_p3_accordian4.svg     

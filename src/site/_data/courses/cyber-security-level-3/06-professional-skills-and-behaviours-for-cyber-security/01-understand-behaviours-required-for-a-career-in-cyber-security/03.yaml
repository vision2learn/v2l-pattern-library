    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to describe the benefits of a security by design mindset.
  -
    title: Security by design mindset
    layout: media
    theme: t-bg-primary
    copy: |
      ### What are the benefits of a security by design mindset? 

      Security by design is a system or product that has been designed from the beginning to emphasis security. It is not a set plan or specific standard it is more of a philosophy or mindset which focusses on building in security from conception. Security shouldn’t be something that is reactive it should be proactive and continuous through the whole design process. It should be able to work in a reliable manner and be constantly evolving to meet and defeat any new threats. It should also be implicit in all processes.
      
      It is always a more cost-effective process to create a system using security by design as assessing any potential business risk at this stage means it can offer more stability to a system and meet the specific needs of an organisation. Building a secure system to start with is always better than trying to patch up the holes in an existing one later down the line.

    img: /images/svg/ypmh/placeholder_icon.svg

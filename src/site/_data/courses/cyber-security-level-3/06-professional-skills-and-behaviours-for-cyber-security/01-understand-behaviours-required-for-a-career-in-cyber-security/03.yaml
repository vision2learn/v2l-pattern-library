  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        Bias in decision-making can be difficult to recognise and correct. One strategy that may help is to ask yourself questions whenever you need to make a decision. For example:
        * Are we making assumptions about individuals?
        * Am I hung up on one forensic detail and struggling to move away from it?
        * Has the recent news cycle influenced my decision?
        * When you run into the same problem over and over again, do you always come up with the same solution or answer, if it has not worked in the past?
        * When offered new services and products, do you take the manufacturer’s or salesperson’s word at face value, or do you look at it in a balanced way from multiple perspectives?
        * Does your team recognise all the possible sources of error before coming to a conclusion?

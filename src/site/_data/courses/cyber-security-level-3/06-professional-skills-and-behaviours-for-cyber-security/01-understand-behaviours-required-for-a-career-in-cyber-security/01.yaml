title: Welcome to Unit 6
intro: |
    ### Professional skills and behaviours for cyber security
    
    Welcome to the sixth unit of your Level 3 Certificate in Cyber Security. In this unit you will explore the behaviours that are required to have a career in cyber security whilst looking at security clearance and screening checks that employers may carry out. This will help you to assess your own skills and identify what you need to have a career in cyber security and how you can enhance this using continuous professional development.

banner: placeholder.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit, you will cover the following criteria of your Level 3 Certificate in Cyber Security qualification.

      You will:

      1. Understand behaviours required for a career in cyber security
      2. Be able to identify skills required for a career in cyber security
      3. Understand the importance of continuous professional development

      [View the complete set of learning outcomes for this unit.](/pdfs/)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      
      * The importance of managing and promoting a positive digital identity
      * Possible employee screening checks that an employer might carry out
      * Potential consequences of unsatisfactory findings as a result of employer checks
      * Security clearance levels

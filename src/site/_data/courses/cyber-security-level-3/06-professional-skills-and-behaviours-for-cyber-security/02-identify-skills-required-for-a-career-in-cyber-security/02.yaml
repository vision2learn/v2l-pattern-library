title: Personal development plan
intro: |
  On this page you will learn about assessing your own skills, personal development plans, and how to create your own personal development plan.
banner: placeholder.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to assess own skills against those required for a career in cyber security.
  -
    title: Assessing your own skills
    layout: media
    theme: t-bg-primary
    copy: |
      After conducting ‘a skills review’ you should look at the skills you have identified and relate them to some roles within this field. You might find that you do not have all the skills needed at the moment, but you can identify where you might need to gain some or build on those you already have.
      
      Try to be specific and not vague and identify areas that are relevant. For example, don’t just say you can code! Say what languages you know and are proficient in and how you have applied them.
      
      Think about your strengths and weaknesses and any assessments and performance reviews you have had and how you have improved your skills and performance in the past.

    img: /images/svg/placeholder_icon.svg
  -
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        Research the skills you need for a career in cyber security and use these along with the personal skills analysis conducted in the previous exercise to see if you have the skills required for a career in cyber security. Make a list of the skills you need to develop or improve.
  -
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Creating a personal development plan
      
      So we have discussed the skills needed for a position in cyber security and we have looked at how you can identify what skills you have and what you need to work on. It’s time now to Create a personal Development plan.
    video: placeholder_pc.mp4
  -
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to create a personal development plan.
  -
  -
    title: Time for assessment task
    theme: t-bg-primary3 i-practice
    copy: |
      Once you have conducted a personal skills analysis and assessed your skills against those required for a career in cyber security, you are ready to create a personal development plan. You can think of this as a roadmap for acquiring the skills you need in order to achieve your goal of a position in cyber security. 

      Use the same document that you downloaded on the previous page [Unit 6 Section 2 Assessment - Personal development plan](/pdfs/cs3_u6_assessment_workbook.pptx) to complete.

      _ID question - two separate documents as content is accross two pages or one document with instructions?_

      Remember that this document will be part of your Unit 6 assessment so make sure you save it with your name.

title: Skills required for a career in cyber security
intro: |
  In this session you will learn about the skills that are required to have a career in cyber security.  You will also learn how to create a personal development plan.
banner: placeholder.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * Skills required for a career in cyber security  
      * Performing a personal skills analysis
      * Assessing your skills against those required for a career in cyber security
      * Creating a personal development plan
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |

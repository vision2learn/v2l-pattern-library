      In your assessment you will be required to perform a personal skills analysis.
  -
  -
    title: Time for assessment task
    theme: t-bg-primary3 i-practice
    copy: |
      So, do you have the skills to become a cyber security professional? To check this out you should perform a personal skills analysis. You would use one of these approaches to do this:
      * SWOT (Strength, Weakness, Opportunity, Threat) Method.
      * SOAR (Strength, Opportunity, Aspirations, Results) Method.

      Use the following [Unit 6 Section 2 Assessment - Personal skills](/pdfs/cs3_u6_s2_assessment_workbook.pptx) document to conduct a SWOT analysis or SOAR analysis of your skills. Then evaluate your results to find ways of turning your weaknesses into strengths.

      Remember that this document will be part of your Unit 6 assessment so make sure you save it with your name.

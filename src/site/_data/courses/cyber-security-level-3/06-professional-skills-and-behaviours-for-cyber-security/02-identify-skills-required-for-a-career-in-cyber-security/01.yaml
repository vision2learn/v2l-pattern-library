  -
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Skills required for a cyber security career
      
      It is not essential to have a degree in computer science or maths to become a cyber security professional, but it can help you to enter the profession at a higher level. However, some organisations will take on those with a more general range of technical skills and experience and train them up. What is important to an employer is your ability to think in a logical manner and your ability to analyse things. It also helps if you are calm when it comes to stressful situations and are willing to develop your skills and knowledge base.
      
      The skills needed can be divided into hard technical skills, such as working with networks and data, and soft skills like interpersonal skills that are of benefit in most roles. 
      
      Let’s have a look at these in more detail in the following video.

    video: cs3_u6_s2_p1_skills.mp4

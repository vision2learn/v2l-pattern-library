  -
    title: CPD
    layout: media
    theme: t-bg-primary
    copy: |
      So what is CPD? 

      CPD or Continuous Professional Development is the term given to ‘learning activities’ that all professionals engage in to develop their skills, knowledge and capabilities whilst following their career pathway. It is the way a professional can enhance their work based and personal skills and proficiency throughout their career and document the process. It combines different methodologies such as training events, workshops, conferences e-learning programs offering both academic and practical qualifications allowing individuals to up-skill and maintain their competitive advantage in their field.

    img: /images/svg/placeholder_icon.svg
  -
  -
    title: Did you know?
    theme: t-bg-primary1a
    copy: |
      
    subInc: 
      type: accordion
      content:
        - 
          title: Examples of cyber security CPD courses?
          copy: |
            * National Online Safety Certificate in Cyber Security in Schools
            * GDPR – Access Control and Intruder Detection: This course looks at GDPR regulation and its effect on data collection for access control and intruder detection systems.
            * Introduction to Intruder Detection Systems: This course introduces Intruder Detection Systems, covering the basic components of a solution and describing the ancillary devices and their operation. The course begins by exploring the principles of security in the context of an intruder detection system and its component parts. There is an explanation of the technologies used in different types of detectors, a description of their operation and where each would
            be used. Finally, contacts and panic alarms are covered, concluding with a section on wiring configurations.
            * Integration v Interoperability – What is integration in the context of Security? This course provides an understanding of the benefits of an integrated security system versus individual products from different manufacturers.
            * GDPR – Video Surveillance and Cloud Based Systems: This course covers the effects of GDPR regulations on data collection and storage for video surveillance and cloud based systems.
            
          img: /images/svg/cs3/cs3_did_you_know.svg

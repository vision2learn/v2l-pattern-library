    title: Quick quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Maliciously spreading information or images can seriously damage the reputation of a colleague or business.  
          answer: Maliciously spreading information
        -
          sentence: As cyber security professional have access to a great deal of personal confidential data there is a risk of them disclosing or misusing confidential information.
          answer: disclosing or misusing confidential
        -
          sentence: Sabotage is rather an obvious form of unethical conduct and this can be seen when an employee intentionally damages a system.  
          answer: Sabotage
    theme: i-quiz

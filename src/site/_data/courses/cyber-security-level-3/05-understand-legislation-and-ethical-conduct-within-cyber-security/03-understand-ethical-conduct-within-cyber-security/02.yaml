    title: Case study
    layout: media
    theme: t-bg-primary1a i-case-study
    copy: |
      ### Case study - The ethics of whistleblowing

      Whistleblowing is when an employee who knows their employer has done something wrong  or unethical brings this to the attention of the authorities or the media, and it has become an important ethical issue. For example, suppose you work for a company as a security professional and in the course of your work you discover information that one part of the company is involved in something you think is ethically wrong. If you steal electronic documentation of the business’s shady practices and provide it to the media or law enforcement, you could shine a light on their wrongdoing and hopefully put a stop to it. However, in order to do this, you need to steal proprietary information. Have you behaved ethically?

      The answer, of course, is not clear. For example, to many people, Edward Snowden is a hero who discovered that the National Security Agency was conducting unethical surveillance on innocent Americans. However, he committed a crime when he stole the documentation of these practices and provided them to the public, and his actions put the lives of many people, and the security of the entire United States, in danger.

    img: /images/svg/cs3/cs3_u5_s3_p2_case_study.svg

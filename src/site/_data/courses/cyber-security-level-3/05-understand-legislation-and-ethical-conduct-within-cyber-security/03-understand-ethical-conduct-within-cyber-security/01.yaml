  -
    title: Case study
    layout: media
    theme: t-bg-primary1a i-case-study
    copy: |
      ### Case study - The ethics of resource use

      Dave works as a programmer for a large software company. He writes and tests utility programs such as compilers. His company operates both day and night. At night, batch production jobs are completed. Dave learns that the night shift has extra programming capacity, so that extra work could be done during the night shift that would not adversely affect performance of the computers.
      
      Dave comes back after normal hours to develop a program to manage his own stock portfolio. He uses very few expendable supplies, such as printer paper. Is Dave’s behaviour ethical? Please see below time to think to answer further questions.

    img: /images/svg/cs3/cs3_u5_s3_p1_case_study.svg
  -
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        In the above case study is Dave’s behaviour ethical? Would the ethics of the situation be different if:
        * Dave began a business managing stock portfolios for many people for profit?
        * Dave’s salary was below average for his experience, so that he felt he was due the computer use as a fringe benefit?
        * Dave’s employer knew of other employees doing similar things and did not say anything or try to stop them?
        * Dave worked for a government office instead of a private company and reasoned that the computer belonged ‘to the people’?

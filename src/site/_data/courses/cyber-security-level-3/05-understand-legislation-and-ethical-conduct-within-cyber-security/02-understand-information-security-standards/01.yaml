title: Understand information security standards
intro: |
  This session focusses on ISO standards that relate to and support cyber security.
banner: cs3_u5_s2_p1_understand_information_security_standards.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn:
      * About ISO standards related to cyber security
      * How ISO standards are used to support cyber security
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to identify ISO standards related to cyber security.
  -
  -
    title: ISO standards for Cyber Security
    theme: t-bg-primary
    copy: |
      As stated on the ISO website, The ISO is an independent, non-governmental international organisation with a membership of 167 national standards bodies and it is based in Geneva in Switzerland. ISO standards are agreed internationally by experts as the best way of doing something. They cover a range of areas and IT security is one of them.
      
      There are many standards in the ISO/IEC 27000 family which are responsible for keeping information assets secure. Using them helps to manage financial information, intellectual property, employee details or information entrusted by third parties. (ISO.org) 


    subInc: 
      type: slider
      title: 
      slides:
        -
          title: ISO/IEC 27032:2012
          text: |
            This standard provides guidance for improving cyber security looking in particular at: information security, network security, internet security and critical information infrastructure protection (CIIP). It also covers baseline security practices for stakeholders in cyberspace.
          img: placeholder_icon.svg
        -
          title: ISO/IEC 27000:2018
          text: |
            Provides an overview of information security management systems (ISMS) as well as the terms and definitions more commonly used. This document applies to all types and sizes of organisations.
          img: placeholder_icon.svg
        -
          title: ISO/IEC 27001:2013
          text: |
            This specifies the requirements for establishing, implementing, maintaining and continually improving an information security management system. The requirements are generic and applicable to all organisations but should be tailored to the needs of the organisation.
          img: placeholder_icon.svg

    title: Quick quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: ISO/IEC 27032:2012 is used with ISO 270001 and provides guidance for improving cybersecurity.
          answer: ISO/IEC 27032:2012
        -
          sentence: ISO/IEC 27001:2013 includes the specification for information security management systems (ISMS) and businesses must meet this to become ISO27000 certified.
          answer: ISO/IEC 27001:2013
        -
          sentence: Cyber falls within the security series ISO/IEC 27000, which is responsible for keeping information assets secure and provides the overview of information security management systems.
          answer: ISO/IEC 27000
        -
          sentence: ISO/IEC 271017:2015 is specifically for cloud services.
          answer: ISO/IEC 271017:2015
    theme: i-quiz

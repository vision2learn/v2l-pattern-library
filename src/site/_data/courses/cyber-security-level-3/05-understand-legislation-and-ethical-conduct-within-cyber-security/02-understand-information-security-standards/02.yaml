      In your assessment you will be required to explain how do the ISO standards support cyber security.
  -
    title: Why ISO standards are important in Cyber security
    layout: media
    theme: t-bg-primary
    copy: |
      The ISO standards provide what is called ‘best practice’ for cyber security. Best practice means that the procedures that are used have been tested and found to be best or most effective for that industry or
      use. So, having ISO 27000 certification is a way for organisations to show that they are using the best and
      most effective security practices and procedures. This gives employees and clients more assurance that their data is safe with the company. 

      Implementing the ISO standards also shows regulatory bodies that an organisation takes information security seriously and is doing everything possible to reduce and manage risks. This, in turn, will help draw in new customers and clients, reduce the organisation’s information security and data protection risks and improve the reputation of the organisation.

    img: /images/svg/placeholder_icon.svg

    title: Case study
    layout: media
    theme: t-bg-primary1a i-case-study
    copy: |
      ### Case study - The importance of ISO standards for business

      Worldpay provides technology-led payment products and services to over 400,000 businesses around the world, enabling them to accept 300 different payment types. On a typical day, Worldpay processes 31 million mobile, online and in-store transactions. It has over 5,000 employees in 13 countries around the world. 
      
      Worldpay needs very high standards of security and reliability, and they wanted a recognised standard to prove they were the best in their field. They implemented ISO 27031 because it is closely tailored to the company’s specialty in the field of payment processing. 
      
      The company rolled out its certifications gradually, with its technology hubs being made a priority. For example, ISO 22301 was initially achieved by four offices, then later a further five, with the ultimate aim to have all its global locations covered by the standard, and a similar pattern was being adopted for ISO/IEC 27001 and ISO 27031. 
      
      The standards gave the company a structure to identify risks to their business and manage those risks. According to company head of Business Continuity, Ian Crossley, “They prove that we are doing everything we can. They also bring vital reassurance to customers and help the company win business because customers can see they’re resilient. If a customer comes in and says, ‘Great, you’ve got ISO 22301’, we can also show them we are aligned to ISO 27031. We can explain what it covers, and that we have been externally audited to it. And that we’re the only company in Europe to have this independent verification.” 

    img: /images/svg/cs3/cs3_u5_s2_p2_case_study.svg

title: Welcome to Unit 5
intro: |
    ### Understand legislation and ethical conduct within cyber security
    
    Welcome to the fifth unit of your Level 3 Certificate in Cyber Security.  In this unit you will gain an understanding of the legislation surrounding cyber security, international law relating to cyber security, the importance of information security standards, and ethical conduct within cyber security. 

banner: cs3_u5_s1_p1_unit5.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit, you will cover the following criteria of your Level 3 Certificate in Cyber Security qualification.

      You will:

      1. Understand legislation relating to cyber security
      2. Understand information security standards
      3. Understand ethical conduct within cyber security

      [View the complete set of learning outcomes for this unit.](/pdfs/)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn:
      
      * How legislation impacts on cyber security
      * About trends in international law for cyberspace
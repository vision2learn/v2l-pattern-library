  -
    title: International law for cyberspace
    layout: media
    theme: t-bg-primary
    copy: |
      One of the big benefits of the internet is the way that it connects people from almost anywhere on the planet. But in terms of law enforcement, this is also one of the big drawbacks. Threats can come from anywhere, and tracking down and stopping threat actors in other countries can be extremely difficult – especially if the laws in the host country differ from those in the country where the attack took place, or where the attack is international in scope. 
      
      For this reason, the main challenge in international law for cyberspace is to craft binding laws that apply internationally and do not violate the sovereignty of individual states.
     
      While there are no clear answers for how to regulate cyberspace internationally, there are some clear trends.  

    img: /images/svg/cs3/cs3_u5_s1_p3_image.svg

title: Develop a cyber security incident response plan
intro: |
  In this session you will learn about the importance of maintaining an up-to-date cyber security incident log and maintaining incident response plans.
banner: placeholder.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * Why it is important to maintain an up-to-date cyber security incident log
      * The steps to be included within a cyber security incident response plan
      * Why it is important to have a cyber security incident response plan
      * How to develop a cyber security incident response plan for an organisation
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to explain:
      * Why it is important to maintain an up to date cyber security incident log
      * The steps to be included within a cyber security incident response plan
      * Why it is important to have a cyber security incident response plan
  -
    title: Introduction
    theme: t-bg-primary
    copy: |
      it is important for Companies to maintain an up-to-date cyber security incident log and to have a cyber security incident response plan in place.

    subInc: 
      type: reveal
      content:
        -
          title: Incident Log
          copy: |
            A cyber security incident log is a short document created and maintained by cyber security professionals that indicates most of the relevant information about a security incident.
          img: cs3_u4_s2_p1_reveal1.svg
        -
          title: Incident Response Plan
          copy: |
            An incident response plan is a set of instructions to follow which would include key contacts, escalation criteria, a basic flowchart, and basic guidance on legal and regulatory.
          img: cs3_u4_s2_p1_reveal2.svg
        -
          title: Importance of an IR Plan
          copy: |
            It is important to have an incident response plan to help teams respond quickly, follow guidelines, to identify their role in the process, and know who to escalate the incident to.
          img: cs3_u4_s2_p1_reveal3.svg
  -
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Cyber Security Incident Log and Incident Response Plan
      
      When dealing with cyber security incidents it is important to maintain an up-to-date cyber security incident log, but what does this consist of? 

      And what steps should be included within a cyber security incident response plan?
      
      Please see the following video to learn more.

    video: cs3_u4_s2_p1_incident_log.mp4
  -
    title: Quick quiz
    copy: Select one of the drop-down options to complete the sentences.
    subInc: 
      type: word-quiz
      content:
        -
          sentence: A cyber security incident log is a short document created and maintained by cyber security professionals.
          answer: short document
        -
          sentence: A cyber security incident log indicates most of the relevant information about a security incident.
          answer: relevant information
        -
          sentence: A cyber security incident log provides audit trails for tracking elements, processes or users involved in an attack.
          answer: audit trails
        -
          sentence: It is important to keep the cyber security incident log up to date to maintain control to prevent breaches and loss of data. 
          answer: up to date
        -

title: Develop a cyber security incident response plan
intro: |
  In this session you will learn about the importance of maintaining an up-to-date cyber security incident log and maintaining incident response plans.
banner: placeholder.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * Why it is important to maintain an up-to-date cyber security incident log
      * The steps to be included within a cyber security incident response plan
      * Why it is important to have a cyber security incident response plan
      * How to develop a cyber security incident response plan for an organisation
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to explain:
      * Why it is important to maintain an up to date cyber security incident log
      * The steps to be included within a cyber security incident response plan
      * Why it is important to have a cyber security incident response plan

  -
    title: Case study
    theme: t-bg-primary1a i-case-study
    copy: |
      ### Case study - CREST

      Findings from a research project by the not-for-profit cyber security group CREST found that the top ten challenges organisations face in responding to a cyber security incident are:
    subInc: 
      type: accordion
      content:
        - 
          title: CREST - top ten challenges
          copy: |
            1. Identifying a suspected cyber security incident (e.g. monitoring evidence of unusual occurrences and assessing one or more trigger points).
            2. Establishing the objectives of any investigation and clean-up operation.
            3. Analysing all available information related to the potential cyber security incident.
            4. Determining what has actually happened (e.g. a DDoS, malware attack, system hack, session hijack, data corruption, etc).
            5. Identifying what systems, networks and information (assets) have been compromised.
            6. Determining what information has been disclosed to unauthorised parties, stolen, deleted or corrupted.
            7. Finding out who did it (i.e. which threat agent or agents) and why (e.g. financial gain, hacktivism, espionage, revenge, challenge or just for fun).
            8. Working out how it happened (e.g. how did the attacker gain entry to the system).
            9. Determining the potential business impact of the cyber security incident.
            10. Conducting sufficient investigation (e.g. using deep dive forensic capabilities) to identify (and prosecute, if appropriate) the perpetrator(s).

          img: /images/svg/cs3/cs3_u4_s2_p1_case_study.svg

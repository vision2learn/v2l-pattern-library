    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to develop a cyber security incident response plan for an organisation.
  -
  -
    title: Cyber security incident response plans
    theme: t-bg-primary
    copy: |
      Organisations come in different sizes and purposes and therefore require different cyber security incident plans. But what needs to be considered in all cases that an IR plan can help everyone in an organisation know what to do if an attack happens. 
      
      When designing a plan, the first thing to think about is who will be using it and how many stages of escalation will there be. The plan should also include how to categorise each incident and lay down the ground rules appropriately.

  -

  -
    title: Case study
    layout: media
    theme: t-bg-primary1a i-case-study
    copy: |
      ### Case study - Grange Road Secondary school

      You’ve been working within the IT department of Grange Road Secondary school for a number of years. Recently there’s been an increase of pupils accessing unsecure sites and more phishing emails are being received. Although the school has restricted access for staff and pupils and has procedures in place for security and GDPR, they have never carried an analysist of their cyber attack risk. 
      
      You have now been promoted to the role of __Cyber Security Officer__ in order that you can minimise the school’s risk and you’ve identified the need for a cyber security incident response plan. 

      Remember that this should contain:
      * a system, such as a checklist, to prioritise possible incidents
      * how to respond to the different incidents
      * who should be contacted for each incident
      * how to document the response
      * when to inform regulators
      * steps for a post-incident review process.

      Use the downloadable document in the above 'Time to practice' to create your incident response plan. 

    img: /images/svg/cs3/cs3_u4_s2_p2_case_study.svg
  
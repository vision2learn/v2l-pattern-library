title: Create a Cyber security incident response plan activity
intro: |
  On this page we are going to look at an example of a cyber security incident response plan, and a case study to help you to create a cyber security incident response plan which you will use as part of your assessment.
banner: cs3_u4_s2_p2_create_an_activity.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to develop a cyber security incident response plan for an organisation.
  -
  -
    title: Cyber security incident response plans
    theme: t-bg-primary
    copy: |
      Organisations come in different sizes and purposes and therefore require different cyber security incident plans. In all cases an IR plan can help everyone in an organisation know what to do if an attack happens. 
      
      When designing a plan, the first thing to think about is who will be using it and how many stages of escalation will there be. The plan should also include how to categorise each incident and lay down the ground rules appropriately.
  -
  -
    title: Read
    theme: t-bg-primary2 i-read
    copy: | 
      ### Example of an Incident Response Plan

      The following is a fairly detailed IR plan. Many organisations would use a much simpler IR plan. It would likely be contained in a physical folder, as well as online, so it can be referred to in the event of an incident.

      [Incident Response Plan Example](/pdfs/cs3_u4_s2_p2_read.pdf).

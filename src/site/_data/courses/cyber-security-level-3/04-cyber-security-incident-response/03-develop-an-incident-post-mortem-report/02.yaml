title: Create a post mortem report of an incident activity
intro: |
  On this page we are going to look at an example of a cyber security incident post-mortem report, and a case study to help you to create a cyber security incident post-mortem report (with recommendations) which you will use as part of your assessment.
banner: placeholder.jpg
sections:
  -
    title: Post mortem report
    theme: t-bg-primary
    copy: |
      As we have already discussed once an incident or attack has taken place the Incident response team will conclude the post-mortem process by creating a written report. The organisation may already have a template for this, but you may need to be prepared to create your own, so let’s have a look at what is involved.
  -
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to create a post mortem report of an incident.
  -
  -
    title: Read
    theme: t-bg-primary2 i-read
    copy: | 
      ### Incident Post mortem report - example
      
      Take a look at the following document which shows an example of a Cyber Security Incident post-mortem report.

      [Incident post mortem report - example](/pdfs/cs3_u4_s3_p2_read.pdf).
  -
    title: Case study
    layout: media
    theme: t-bg-primary1a i-case-study
    copy: |
      ### Family-owned construction company

      A small family-owned construction company regularly used online banking. Employees logged in with both a company and user-specific ID and password. Two challenge questions had to be answered for transactions over £1,000.

      One day, the owner was notified that a transfer of £10,000 was initiated by an unknown source. They contacted the bank and identified that in just one week, cyber criminals had made six transfers from the company bank accounts, totalling £550,000. An investigation found that one of their employees had opened an email from what they thought was a materials supplier but was instead a malicious email that contained malware from an imposter account.
      
      The attackers were able to install malware onto the company’s computers, using a keylogger to capture the banking credentials. They used this info to access banking and other financial services online, using valid account numbers and passwords.

      The bank was able to retrieve only £200,000 of the stolen money in the first weeks, leaving a loss of £350,000. Not having a cyber security plan in place delayed the company response to the fraud. The company shut down their bank account and pursued legal action to recover its losses.

    img: /images/svg/cs3/cs3_u4_s3_p2_case_study.svg
  -
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to reflect upon the report and make recommendations based on the findings
  -
    title: Reflect and make recommendations
    layout: media
    theme: t-bg-primary
    copy: |
      There is no right or wrong way to put together a post-mortem report as every incident is different. However, all reports should reflect on the incident and make recommendations based on findings. When reflecting on the report many things need to be taken into consideration such as:
      * support from senior management,
      * the exact threats and risks to an organisation, 
      * the current security capabilities, 
      * the organisations available budget, 
      * and who will ultimately make the decisions.

    img: /images/svg/cs3/cs3_u4_s3_p2_image1.svg
  -
  -
    title: Time for an assessment task
    theme: t-bg-primary3 i-practice
    copy: |
      Taking the above case study into consideration, write up a very brief incident post-mortem for this incident using the following [Cyber Security Incident Post Mortem Report]() template document.

      You will also need to reflect on the incident post-mortem and make recommendations based on the findings - this is in your main Unit 4 Assessment document.
      
      Remember to 'Save As' and add your name as you will be using this document as part of your assessment.

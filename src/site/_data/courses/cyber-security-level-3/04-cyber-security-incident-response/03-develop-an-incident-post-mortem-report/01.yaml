title: Incident post mortem report
intro: |
  In this session we will look at incident post-mortems and their structure. We will look at some important features and how to create and analyse them.
banner: placeholder.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * What is meant by incident post-mortem
      * The structure of an incident post-mortem
      * The importance of the following when carrying out an incident post-mortem
      * How to create a post-mortem report of an incident  
      * Reflecting upon the report and making recommendations based on findings

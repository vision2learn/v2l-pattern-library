title: Incident post mortem report
intro: |
  In this session we will look at incident post-mortems and their structure. We will look at some important features and how to create and analyse them.
banner: placeholder.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * What is meant by incident post-mortem
      * The structure of an incident post-mortem
      * The importance of integity, rigour and discipline when carrying out an incident post-mortem
      * How to create a post-mortem report of an incident  
      * Reflecting upon the report and making recommendations based on findings
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to explain:
      * what is meant by an incident post-mortem
      * the structure of an incident post-mortem
      * the importance of integity, rigour and discipline when carrying out an incident post-mortem
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### What is meant by an incident post mortem?

      This is a process by which organisations as soon as possible after an incident will analyse and discuss its consequences to be better prepared should another occur in the future. Let’s have a look at this in more detail in this video.
    video: cs3_u4_s3_p1_incident_post_mortem.mp4

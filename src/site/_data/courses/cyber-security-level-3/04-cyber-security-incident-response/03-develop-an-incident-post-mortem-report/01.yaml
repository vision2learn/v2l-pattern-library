  -
    title: Importance of Integrity, Rigour, and Discipline
    theme: t-bg-primary
    copy: |
      When carrying out an incident post-mortem those involved need to thoroughly identify the issues looking at the bigger picture rather than a single vulnerability. They also must be prepared to act on any findings however expansive they may be.
      
      Finding all the causes of an incident can only occur if the post-mortem process has integrity, rigour and is a disciplined approach. Scroll through the slides below to learn more.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Integrity
          text: |
            Integrity is important in cyber security as a lack of it from an employee or department can lead to a security breach. Any broken link in the chain can lead to a breach and most of it is preventable with foresight and training. Mistakes make by individual employees can have an impact on a business.

            To deal with integrity issues a company could focus on building a company culture with well-defined principles.
          img: cs3_u4_s3_p1_slide1.svg
        -
          title: Rigour
          text: |
            Looking at the attack in a rigorous way is also an important part of incident post-mortems. For example, you can ask questions such as: 
            1. Was the organisation caught out by making assumptions? Did monitoring fail? 
            2. Was something not specified clearly enough to ensure that everyone was on the same page? 
            3. Did something go unmaintained because in-house staff were under-resourced? 
            4. Were staff under-trained so that they didn’t recognise something they should have? 
            5. Was someone in charge of staying up to date on threats?
          img: cs3_u4_s3_p1_slide2.svg
        -
          title: Discipline
          text: |
            Discipline is another important component of the post-mortem process. This means, in part, making sure that you are being thorough and comprehensive, rather than just finding obvious signs of vulnerability. Vurlnerablilities such as incorrect firewall configurations, software bugs, rootkits, and so on without looking at the bigger picture of what may be causing those things to happen. 
            
            For example, is poor software engineering practice, lax employee security or not having the right anti-virus tools an underlying cause? Is overwork of the IT team or a lack of configuration management for systems causing mistakes?
          img: cs3_u4_s3_p1_slide3.svg
        
  -

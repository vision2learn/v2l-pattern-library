    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### What is meant by an incident post mortem?

      This is a process by which organisations as soon as possible after an incident will analyse and discuss its consequences to be better prepared should another occur in the future. Let’s have a look at this in more detail in this video.

      Please see the following video on 3.1 3.2 3.3
    video: placeholder_pc.mp4
  

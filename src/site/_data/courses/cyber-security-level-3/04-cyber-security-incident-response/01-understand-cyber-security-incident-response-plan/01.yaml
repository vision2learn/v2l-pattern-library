title: Welcome to Unit 4
intro: |
    ### Cyber security incident response
    
    Welcome to the fourth unit of your Level 3 Certificate in Cyber Security.  You will gain an understanding of a cyber security incident response plan and checklist. And will also cover the knowledge required to be able to develop an incident post mortem report.

banner: cs3_u4_s1_p1_unit4.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit, you will cover the following criteria of your Level 3 Certificate in Cyber Security.

      You will:

      1. Understand what is meant by a cyber security incident response plan
      2. Be able to develop a cyber security incident response plan
      3. Be able to develop an incident post mortem report

      [View the complete set of learning outcomes for this unit.](/pdfs/v2l_cs3_learning_outcomes_u4.pdf)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      
      * What a cyber security incident response plan is used for
      * When a cyber security incident response plan is used
      * The stages of a cyber security incident response lifecycle
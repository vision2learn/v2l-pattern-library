    title: Case study
    theme: t-bg-primary1a i-case-study
    copy: |
      ### Case study - SANS Institute

      Another industry standard is the one developed by the SANS Institute, a private organisation that offers information security research and education.

      Organisations may also want to develop their own incident response lifecycle. For each stage of the lifecycle, organisations should also have a checklist. This helps teams to know exactly what to do. The SANS Incident Response Lifecycle has six steps:
    subInc: 
      type: accordion
      content:
        - 
          title: SANS Incident Response Lifecycle
          copy: |
            __1. Preparation:__ The organisation’s security policy is reviewed or established, a risk assessment is carried out, sensitive assets are identified and a Computer Security Incident Response Team is formed (CSIRT).

            __2. Identification:__ The IT team tracks and identifies any deviations from standard activities to identify any safety incidents. This also includes gathering information about the form and severity of any breach.
            
            __3. Containment:__ This includes short-term containment by isolating the portion of the network that is under threat, as well as long-term containment.
            
            __4. Eradication:__ Remove malware from all infected devices, identify the root cause of the attack and take steps to avoid similar attacks in the future.
            
            __5. Recovery:__ Put the affected systems back online and ensure there are no further breaches by testing the affected systems.
            
            __6. Lessons learned:__ Conduct a post mortem of the incident. This could include preparing a full incident report, conducting further investigation and analysis, and updating the incident response plan.
            
          img: /images/svg/cs3/cs3_u4_s1_p3_case_study.svg     

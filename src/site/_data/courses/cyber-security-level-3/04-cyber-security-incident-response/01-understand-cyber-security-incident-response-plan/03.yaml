    title: The Incident Response lifecycle
    theme: 
    
    copy: |
      ### What is the Incident Response Lifecycle?
      
      The whole process of the cyber security incident response lifecycle is the process by which an organisation sets up their framework and it involves four phases:
      * Preparation, 
      * Detection and Analysis, 
      * Containment, Eradication and Recovery 
      * Post Event Activity

      There are organisations who have developed standards for this such as ‘NIST’ National Institute of Standards and Technology and ‘SANS’ institute. To find out more about these check out the case study and link below.

      Let's look at the different stages involved in the following activity.

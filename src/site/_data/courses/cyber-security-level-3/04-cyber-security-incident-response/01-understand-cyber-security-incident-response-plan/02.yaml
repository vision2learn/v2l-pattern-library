  -
    title: Did you know?
    theme: t-bg-primary1a
    copy: 
    subInc: 
      type: accordion
      content:
        - 
          title: Implications of not haveing a cyber incident response plan
          copy: |
            * The average amount of time that a threat goes undetected in a network is 175 days.
            * 70% of organisations don’t have a cyber incident response plan in place and are unprepared to respond to a cyber attack.
            * Organisations must report data breaches/incidents under the GDPR and the NIS Regulations within 72 hours, or face heavy fines.
            * The average cost for an organisation that has suffered a data breach is £2.94m.
            
          img: /images/svg/cs3/cs3_did_you_know.svg

    title: Case study - Incident Response Lifecycle
    layout: media
    theme: t-bg-primary1a i-case-study
    copy: |
      ### Case study - SANS Institute

      Another industry standard is the one developed by the SANS Institute, a private organisation that offers information security research and education. The SANS Incident Response Lifecycle has six steps:

      1. Preparation: The organisation’s security policy is reviewed or established, a risk assessment is carried out, sensitive assets are identified and a Computer Security Incident Response Team is formed (CSIRT).
      2. Identification: The IT team tracks and identifies any deviations from standard activities to identify any safety incidents. This also includes gathering information about the form and severity of any breach.
      3. Containment: This includes short-term containment by isolating the portion of the network that is under threat, as well as long-term containment.
      4. Eradication: Remove malware from all infected devices, identify the root cause of the attack and take steps to avoid similar attacks in the future.
      5. Recovery: Put the affected systems back online and ensure there are no further breaches by testing the affected systems.
      6. Lessons learned: Conduct a post mortem of the incident. This could include preparing a full incident report, conducting further investigation and analysis, and updating the incident response plan.
      
      Organisations may also want to develop their own incident response lifecycle. For each stage of the lifecycle, organisations should also have a checklist. This helps teams to know exactly what to do.


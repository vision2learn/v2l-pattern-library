title: Cyber security incident response plan
intro: |
  In this session you will learn about the cyber security incident response plan.  You will also learn about the stages of a cyber security incident response lifecycle.
banner: placeholder.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to:
      * Describe what a cyber security incident response plan is used for
      * Explain when a cyber security incident response plan is used
  -
    title: What is a cyber security incident response plan is used for?
    layout: media
    theme: t-bg-primary
    copy: |
      It doesn’t matter how large an organisation is, putting guidance in place to handle potential incidents can help to respond appropriately if an incident does actually happen. Taking time to create a plan can help to access any gaps that there may be in capabilities to handle an incident and the plan should be the starting point for handling any incident that might take place.

    img: /images/svg/placeholder_icon.svg
  -
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      _Presentation style .... _
      
      What exactly is a cyber security incident response plan? Please see the following video to learn more.
    video: placeholder_pc.mp4
  -
    title: Quick quiz
    copy: 
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Incident response planning can protect an organisations reputation by helping to show that they are prepared. 
          answer: prepared
        -
          sentence: A plan should consist of a series of actions to follow. 
          answer: actions
        -
          sentence: A plan should provide a checklist approach so that actions are consistent across all areas appropriate to the plan.
          answer: checklist
        -
          sentence: example four
          answer: four
    theme: i-quiz

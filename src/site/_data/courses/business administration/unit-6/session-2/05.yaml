
title: What did you learn? 
intro: Well done, you’ve now completed the second session of this unit! 
banner: ba-u1-s1-p6.jpg

sections:
  -
    title: Learning points
    theme: t-bg-primary
    copy: |
      
      ### In brief

      By working through this session, you have learned about the purpose of:

      * Agreeing the format in which a budget will be presented
      * Using estimations when developing a budget and ways of doing so
      * Identifying timescales, priorities and financial resources needed when preparing a budget and ways of doing so
      * Negotiating and agreeing a budget
  -
    title: Session Quiz
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        Is the following statement true or false? "The format of a budget is not important.":
          answers:
            True: false
            False: true
        Which of the following is NOT an example of something which an organisation should identify when preparing a budget?:
          answers:
            Timescales: false
            Prorities: false
            Seating plan: true
            Financial resources: false
        Select one option to complete the following sentence - "The failure to have clear and agreed budgets can be very ____________.":
          answers:
            Beneficial: false
            Favourable: false
            Damaging: true

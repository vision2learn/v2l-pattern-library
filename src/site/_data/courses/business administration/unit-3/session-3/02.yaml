    title: Different types of documents
    theme: 
    copy: |
      There are several types of document listed that may be used to report information, along with their **main features** and the **likely recipients**.  Select the images below.
    subInc: 
      type: reveal
      content:
        -
          title: Business letter
          copy: |
            * Slower than electronic delivery
            * Very formal
            * A permanent written document
            * Weaker if large quantities of information are being delivered.

            **Likely recipients:** External
          img: ba_u3_s3_p2_reveal_1.svg
        -
          title: Email
          copy: |
            * Less formal
            * Documents easily attached
            * Can be sent instantly worldwide
            
            **Likely recipients:** Internal and external
          img: ba_u3_s3_p2_reveal_2.svg
        -
          title: Fax
          copy: |
            * Faster than letters
            * Once good for sending graphics and images
            * Being superseded by emails
            * Cumbersome if large quantities of information are being delivered
            
            **Likely recipients:** External / colleagues at other branches
          img: ba_u3_s3_p2_reveal_3.svg
        -
          title: Formal report
          copy: |
            * Can give a clear account of things
            * Can present more complex and linked information
            
            **Likely recipients:** External and sometimes internal
          img: ba_u3_s3_p2_reveal_4.svg
        -
          title: Informal report
          copy: |
            * Can give a clear account of things
            * Can present more complex and linked information
            
            **Likely recipients:** Internal
          img: ba_u3_s3_p2_reveal_5.svg
        -
          title: Memo
          copy: |
            * Formal
            * Permanent record
            * Good for small chunks of information or bullet points
            
            **Likely recipients:** Internal
          img: ba_u3_s3_p2_reveal_6.svg
        -
          title: Note
          copy: |
            * Informal
            * Permanent record
            * Good for very small chunks of information or a bullet point
            
            **Likely recipients:** Internal
          img: ba_u3_s3_p2_reveal_7.svg
        -
          title: Text
          copy: |
            * Immediate
            * Best suited for small chunks of information
            
            **Likely recipients:** Internal and external 
          img: ba_u3_s3_p2_reveal_8.svg

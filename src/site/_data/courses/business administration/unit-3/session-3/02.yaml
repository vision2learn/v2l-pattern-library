    copy: |
      ### Different documents, different purposes

      There are many different types of documents that a business can use. The correct document to be used will be determined by the purpose of the document and the person receiving it.
      
      It's important to remember that there is no single document that can be used for all written communication. Instead much will depend on what the user needs.

      Select the letter and report icons in the below interactivity to see two different types of documents used in business.


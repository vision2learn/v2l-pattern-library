
title: Research, processes and importance
intro: |
    On this page you will learn about: 
    * Researching information
    * Organising research
    * key processes
    * The importance of information
banner: ba_u3_s2_p2_maninfo_2.jpg
sections:
  -
    title: Researching information
    theme: t-bg-primary
    copy: |
      ### What needs to be done? 
      When researching information, there are several things that need to be done if the research is to be successfully completed. These are listed below and you can select each image to learn more.

    subInc: 
      type: reveal
      content:
        -
          title: Ensure the researcher knows what they are looking for
          copy: |
            It helps to make accurate notes on the information that is required. A written record helps as both a reminder and a focus for action.
          img: ba_u3_s2_p2_reveal_1.svg
        -
          title: Discover how the information should be presented
          copy: |
            This may include options such as a verbal presentation, a text, email, fax or hard copy report. It should be clear whether the recipient wants a few bullet points or a detailed document. The purpose of the information should be clear.
          img: ba_u3_s2_p2_reveal_2.svg
        -
          title: Source the correct document
          copy: |
            The initial briefing may identify the key documents or information sources. Or it may be left to the researcher to find the key documents. It is also often worth checking that a document is correct before going further.
          img: ba_u3_s2_p2_reveal_3.svg
        -
          title: Confirm the document is up to date
          copy: |
            Many documents are regularly amended and updated. It is important to establish that the most recent version is being used. Failure to do this can result in information being out of date.
          img: ba_u3_s2_p2_reveal_4.svg
        -
          title: Use documents efficiently
          copy: |
            When researching, it helps to check indexes and content pages for the information needed, rather than trawling through page upon page of unnecessary information.
          img: ba_u3_s2_p2_reveal_5.svg
        -
          title: Read relevant information carefully
          copy: |
            Take time to read things slowly so that you have understood what has been read.
          img: ba_u3_s2_p2_reveal_6.svg
    copy2: |
        Before research can be provided to a recipient, the following must also be established:

        * The recipient and what they already know
        * The type of information required
        * Why it is required
        * When it is required.
  -
    title: Organising research
    layout: media
    theme: t-bg-supporting3
    copy: |
        When carrying out research, it is important that the information being collected is kept in an organised fashion. Ideally the information should be kept in clearly marked files (either paper or electronic).

        Within the files, the information should be kept in an order that will make it easy to use when the information is passed on to the recipient. Information can be organised in several different ways, such as alphabetically or numerically. The most important thing is for a researcher to be able to find the information they need quickly.

        It helps to have in mind the way the information will be reported.

    img: /images/svg/ba/ba_u3_s2_p2_image_1.svg
  -
    title: Key processes
    theme: 
    copy: |
      ### Archiving, retrieving and deleting information
      
      All businesses benefit from being able to store, retrieve and handle information in a consistent way. There are generally three different processes that businesses go through when dealing with information – archiving, retrieving and deleting information.

      Scroll through the slides below to learn more.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Archiving
          text: |
            There will be information where there is a legal or long-term business obligation to keep it for an extended period – this is known as archiving. By archiving you can free up storage space for information that needs to be accessed on a more regular basis.
          img: ba_u3_s2_p2_slide_1.svg
        -
          title: Retrieving
          text: |
            When information is used from a file or folder, it has been retrieved. It is important that information used on a regular basis can be retrieved easily.
          img: ba_u3_s2_p2_slide_2.svg
        -
          title: Deleting
          text: |
            There will also be information that does not need to be kept as it has no value to the organisation. This information may be deleted and shredded. It is important that staff have guidance on deleting information in case they get rid of important documents by mistake.
          img: ba_u3_s2_p2_slide_3.svg
  -
    title: Benefits of an efficient information system
    theme: 
    copy: |
      See below to read through the key benefits of an efficient information system with well-established procedures and processes.
    subInc: 
      type: accordion
      content:
        - 
          title: 
          copy: |
            1. The system is easily understood
            2. The system is flexible and able to adapt to future demands
            3. All information is kept safely
            4. The information is stored quickly in order to prevent loss and make it readily accessible
            5. Information can be found quickly
            6. All paper documents are maintained in good condition
            7. Spare copies and duplication is kept to a minimum
            8. Paper files that are borrowed and moved are signed in and out to keep track of their location
            9. Legal requirements on security and confidentiality are met
            10. Archiving is done to free up space.   
  -
    title: The importance of information
    layout: media
    theme: t-bg-primary
    copy: |
        ### The value of information

        When making decisions and developing procedures on the management of information, it helps to consider two different aspects: importance and inactivity.

        **Importance** indicates the value of information for the organisation. The higher the value, the higher the importance.

        **Inactivity** indicates whether the organisation needs to access this information to actively use it. The more likely the organisation is to want quick access, the higher the level of activity.

    img: /images/svg/ba/ba_u3_s2_p2_image_2.svg
  -
    title: Information management
    theme: t-bg-supporting2
    copy: |
      When something is archived it is put into storage. Traditionally this applied to paper-based files but in today’s business world more and more documents are in a digital format.  Both formats can cause issues when it comes to archiving and storage and several examples are listed below.
    subInc: 
      type: accordion
      content:
        - 
          title: Problems with paper-based storage
          copy: |
            *	Folders get full quickly
            * Cabinet drawers and whole cabinets become full, with no space for new files
            * There is no space for new cabinets
            * There is no space for important files.
        - 
          title: Periodically reviews 
          copy: |
            To avoid paper-based storage problems a business can periodically review its information systems and take appropriate actions. These may include:
            *	Removing and deleting duplicate documents and leaving a single copy
            *	Removing and deleting unimportant documents that will never be used again
            *	Using offsite document storage for files that have to be retained.
        - 
          title: Problems with electronic storage
          copy: |
            *	Infrastructure
            * Cost
            * Security
            * Corruption
            * Compatibility
            * Scale
        - 
          title: Electronic storage solutions
          copy: |
            There are several solutions which should minimise the impact of archiving and storing digital documents, these include
            * Use cloud-based storage and hosting
            * Outsource to a data storage provider
            * Ensure all documents are encrypted
            * Have multiple backups of data
            * Make sure that systems are compatible and future proofed

    copy2: Most well-run businesses specify in their procedures when archiving and deleting can take place and who has the authority to make decisions on what can be archived.
  -
    title: Quick quiz
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        Is the following statement true or false? "Archiving frees up storage space":
          answers:
            True: true
            False: false
        Which of the following is NOT an example of an electronic storage system?:
          answers:
            Cloud-based storage: false
            External storage drive: false
            A paper based filing cabinet: true
        Select one option to complete the following sentence "When carrying out research, it is important that the ____________ being collected is kept in an organised fashion.":
          answers:
            Information: true
            Decisions: false
            Processes: false

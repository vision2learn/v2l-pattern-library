  -
    title: Sending and receiving emails
    theme: t-bg-primary
    copy: |
      See below to see a few important dos and don’ts when using email.

    subInc: 
      type: accordion
      content:
        - 
          title: Don't
          copy: |
            * Be informal or use slang in business emails
            * Use email to send highly confidential information
            * Over use capitals and end up SHOUTING
            * Use emoticons or informal abbreviations
            * Unnecessarily forward emails to people or “reply to all”
            * Use language or technical phrases the recipient may not understand
            * Be too hasty to delete messages that may be useful at a later date
            * Reply to spam
            * Unnecessarily create hard copies of emails
            * Forward chain mail (just delete them)
            * Request delivery receipts unless necessary.

          img: /images/svg/ba/ba_u3_s1_p2_accordion_1.svg
        - 
          title: Do
          copy: |
            * Reply promptly to emails
            * Be sure to follow the company format
            * Use accurate subject headings so recipients know the purpose of the email
            * Use correct spelling / grammar and avoid text speak
            * Be concise
            * If you have more than one topic, use more than one email
            * Use spell checkers and then check it yourself
            * Be sure the email makes sense before sending it
            * Be selective in using priority levels for emails
            * Be sure the recipient’s name is correct
            * Be sure any promised attachments have been attached.

          img: /images/svg/ba/ba_u3_s1_p2_accordion_2.svg
        
  -
    title: Case study - Finding information
    theme: t-bg-primary1a i-case-study
    copy: |
      ### Be specific

      When you do Internet research, it helps to be as specific as possible in your keyword search.
      
      If you're not specific, you might end up with results that are meaningless or lead you on the wrong path. Whichever search engine you use, try to be precise in your search criteria. 
      
      Let's take a look at an example:
    subInc: 
      type: accordion
      content:
        - 
          title: Example search
          copy: |
            A student wants to know the **total number of trade union members in the UK in 2018**. 
            1. First she types "Union membership" into Google. This generates a lot of interesting results but the required information is not obvious. 
            2. Next, she types in "British trade union membership 2018". This generates a number of results. 
            3. The fourth **result** is "Trade union membership 2018: statistical bulletin". This gives her the information she needs.

            Use [Google](https://www.google.co.uk) to try this search out and find the above pdf document. 
            
            (_Select the back button to return to this course_)
          img: /images/svg/ba/ba_u3_s1_p2_image_2.svg


title: IT at work
intro: |
    On this page you will be introduced to: 
    * Types of IT
    * Information exchange
    * Finding information
banner: ba_u3_s1_p2_itwork_1.jpg
sections:
  -
    title: Types of IT
    layout: media
    theme: t-bg-primary
    copy: |
        ## Tools and software    
        
        Businesses will use many different types of IT, and rapid developments mean that there are new technologies being introduced all the time. Some of the most popular uses of IT are:
        * Information exchange
        * Word processing
        * Spreadsheets
        * Databases
        * Presentation software
        * Mobile information technology.
        
        You will learn more about each of these as you work through the rest of this session.
    img: /images/svg/ba/ba_u3_s1_p2_image_1.svg
  -
    title: Information exchange
    theme: t-bg-supporting3
    copy: |
        ### The flow of information

        The fast, accurate and efficient flow of information is the lifeblood of any business. There are two important aspects to information exchange using IT. Scroll through the slides below to learn more.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Sending and receiving emails
          text: |
            Many businesses now use email (these are electronic messages sent via computer) to send and receive information. Emails are useful as the sender can attach documents to the email they send. These can be Word documents, spreadsheets, sound files or images. 
            
            It helps to bear in mind the level of competence of the recipient of the email – there is little point in sending an email if the person receiving it can't understand it or doesn't know how to open it.
          img: ba_u3_s1_p2_slide_1.svg
        -
          title: Using the Internet to find information
          text: |
            An important starting point when using the Internet to find information is to use a search engine. These look for websites based on the criteria a person enters in the search box. 
            
            The best known search engine is Google. Other popular search engines include Yahoo! Search and Bing.
          img: ba_u3_s1_p2_slide_2.svg
        -
          title: Other sources of information
          text: |
            Technology has advanced rapidly over the last few years and as well as the traditional methods of information exchange discussed in the previous slides, online storage and collaboration tools have become integral in the sharing and management of information. Advances in the development of secure high-speed internet connections and the growth of online storage mediums have created a range of tools that ensure that information is available anywhere at anytime. Software such as Microsoft SharePoint, Google Drive, Workzone and Dropbox provide secure environments where users can access and share documents and large amounts of data can be transferred almost instantly.

          img: ba_u3_s1_p2_slide_3.svg
        

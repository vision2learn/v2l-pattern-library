title: What did you learn? 
intro: Well done, you’ve now completed the fifth session of this unit! 
banner: ba-u1-s1-p6.jpg

sections:
  -
    title: Learning points
    theme: t-bg-primary
    copy: |
      
      ### In brief

      By working through this session, you have learned all about:

      * Different types of meetings
      * The information and requirements needed for meetings
      * How to arrange meetings.
  -
    title: Session Quiz
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        Is the following statement true or false? "The purpose of meetings depends upon the type of meeting taking place.":
          answers:
            True: true
            False: false
        Which of the following is NOT a type of meeting?:
          answers:
            Problem solving: false
            Decision making: false
            Lecturing: true
        Select one option to complete the following sentence - "Information about the practicalities of meetings, such as the date and time of the meeting, is known as _______________________.":
          answers:
            Special requirements: false
            Logistical information: true
            Resources and requirements: false

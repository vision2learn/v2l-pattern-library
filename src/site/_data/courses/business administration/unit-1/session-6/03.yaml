
title: What did you learn?
intro: Well done, you've now completed session 6 of this unit! By working through this session, you have learned all about Improving performance, Describing ways of improving your performance, and Identifying different types of career path available.
banner: ba-u1-s1-p6.jpg
sections:
  -
    title: Session Quiz
    subInc:
      type: quick-quiz
      content:
        True or false? "Organisational improvement encourages individual improvement.":
          answers:
            True: true
            False: false
        Which of the following is a positive way to respond to a mistake you have made?:
          answers:
            Apologise and inform the relevant people: true
            Blame other people: false
        Select one option to complete the following sentence "Every 6 – 12 months businesses take a systematic look at what each employee does on a day to day basis. This is known as an ______________.":
          answers:
            Appraisal: true
            Criticism: false
            Analysis: false

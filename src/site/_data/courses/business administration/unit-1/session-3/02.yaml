    title: Choosing the right method
    theme: t-bg-primary
    copy: |  
      Which method will you use?
      
      With so many communication methods to choose from, the main challenge is to select the most effective option.
      When you are choosing the right communication method, there are some important factors to consider. It's clear that there is not a single communication method that can meet all needs. Instead, you need to think carefully about which one is appropriate. Spoken communication, for example, works better in face-to-face contexts than written communication. If you're not sure, ask a manager or experienced colleague.
    
      To communicate successfully with others, you should
      - Try and understand what the recipient wants / needs to know.
      - Try and understand how they like / need the information to be presented.
  -
    title: Quick quiz - Getting the message across
    theme: i-quiz
    copy: |
      Take a look at the scenarios below and select the most appropriate response 
    subInc:
      type: quick-quiz
      content:
        You have been asked to inform a colleague that the location of the meeting they are attending has changed and they are already on their way. Do you...:
          answers:
            Send an email: false
            Call them: true
            Leave a memo on their desk: false
        You see a large box is about to fall and if it does so it will land on the head of a friend and colleague. Do you...:
          answers:
            Send a text: false
            Immediately shout a warning: true
            Send an email: false
        You have been asked to brief a senior management team on the options for a computerised customer service system. Do you...:
          answers:
            Mention your thoughts as and when you find some interesting information and see each manager: false
            Prepare a written report to send to all managers and arrange a meeting with the management team to answer any questions: true
            Telephone each manager when you have reached your conclusions: false
        You need to invite several potential candidates for an interview. Do you...?:
          answers:
            Call them and tell them the time, place and what they need to bring: true
            Email them all of the details and ask for confirmation: false

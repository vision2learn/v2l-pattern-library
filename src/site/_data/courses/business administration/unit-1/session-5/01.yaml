
title: Planning your own work
intro: |
  In this session, you will learn about three key areas of workplace communication:
  - Meeting work standards and deadlines
  - Planning your work
  - Keeping people informed of your progress


banner: BA_U1_S5_p1_Planning.svg
sections:
  -
    title: Your learning goals
    theme: t-bg-primary
    copy: |
      By working through this session, you will cover the following criteria of your Level 2 Certificate in the Principles of Business and Administration qualification.

      1. Know how to plan own work and be accountable to others
      2. Explain the purpose of meeting work standards and deadlines when completing tasks
      3. Identify ways of planning own work
      4. Compare ways of keeping other people informed about progress

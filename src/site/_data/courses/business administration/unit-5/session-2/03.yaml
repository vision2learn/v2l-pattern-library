sections:
  -
    title: Learning points
    theme: t-bg-primary
    copy: |
      
      ### In brief

      By working through this session, you have learned all about:

      * Why it's important to display professional and helpful behaviour when supporting business events
      * Ways of exhibiting professional and helpful behaviour while supporting business events
  -
    title: Session quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: In some organisations a checklist may be created to help staff who are supporting an event.
          answer: checklist
        -
          sentence: Smiling, making eye contact and looking attentive are all examples of non-verbal communication.
          answer: attentive
        -
          sentence: The main consequences of professional and helpful behaviour will include less conflict, no wasted resources and more cooperative people.
          answer: resources
        -
          sentence: How you behave can affect the success of the event.
          answer: behave
        -
          sentence: Behaving unprofessionally and unhelpfully can have a disastrous effect on people.
          answer: disastrous

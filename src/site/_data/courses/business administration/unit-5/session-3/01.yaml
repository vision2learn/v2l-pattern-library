  -
    title: People problems
    theme: t-bg-supporting2
    copy: |
      It is possible for each and every aspect of each type of event to have a problem but to list every possibility here would take up a lot of room. Problems can fit into more than one category, too. A few typical examples of problems are described below.

      Select the images below to see examples of people problems:

    subInc: 
      type: reveal
      content:
        -
          title: Late or absent attendees
          copy: |
             If people turn up late then they may miss things such as registration or early parts of the event. Staff that are expected to move onto other roles are forced to wait for late attendees.
          img: ba_u5_s3_p1_reveal_1.svg
        -
          title: Late or absent speakers
          copy: |
            Many events rely upon speakers. If they fail to attend or turn up late for their slot the event may be significantly diminished and attendees will be disappointed or worse.
          img: ba_u5_s3_p1_reveal_2.svg
        -
          title: Failure by suppliers
          copy: |
            If a supplier fails to deliver something on time and to an agreed standard then the event may be compromised. For example failure to deliver equipment, refreshments or printed materials could lead to an event failing completely.
          img: ba_u5_s3_p1_reveal_3.svg
    copy2: |
      If parts of an event are dependent on the participation of attendees these may be impossible to do or be less effective due to the smaller numbers. 
      
      There are similar problems when people are absent and there may be further administrative costs of chasing up absent people after the event.
  -
    title: Process problems
    theme: t-bg-supporting3
    copy: |
      Scroll through the slides below to see examples of process problems:

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: The wrong people invited / the right people are not invited
          text: |
            If the wrong people are invited then it will be virtually impossible to achieve the objectives of an event. 
            
            For example if the event aims to sell human resource management services then attendees should ideally be budget holders with control in human resource management areas of a business. If the attendees have other specialisms / do not hold relevant budgets then the event may have a reduced level of success.
          img: ba_u5_s3_p1_slide_1.svg
        -
          title: Special requirements overlooked
          text: |
            When organising an event it is important to ask about any special needs of the attendees. 
            
            For example people may have limited mobility, be visually impaired or have dietary restrictions. Failure to acknowledge these needs may result in attendees having a very poor experience.
          img: ba_u5_s3_p1_slide_2.svg
        -
          title: Insufficient documentation / papers / delegate packs
          text: Failure to get documents, paperwork and delegate packs right can undermine an event and deliver a poor service to delegates / attendees. This may be incorrect numbers, poor quality materials and incorrect delivery dates.
          img: ba_u5_s3_p1_slide_3.svg
        
  -
    title: Equipment problems
    theme: t-bg-supporting2
    copy: |
      Select the images below to see examples of equipment problems:

    subInc: 
      type: reveal
      content:
        -
          title: Failure of audio visual equipment
          copy: |
            For many events, such as conferences and concerts, a failure in the audio visual equipment will result in an inferior or failed event.
          img: ba_u5_s3_p1_reveal_4.svg
        -
          title: Failure of computers / computer aided activities
          copy: |
            Many events rely significantly upon computers. Activities such as ticketing and audio visual presentations are frequently dependent upon specialised hardware and software.
          img: ba_u5_s3_p1_reveal_5.svg
        -
          title: Failure of kitchen equipment
          copy: |
            If the event requires catering then the failure of kitchen equipment may result in people not being properly refreshed and fed.
          img: ba_u5_s3_p1_reveal_6.svg
  -
  -
    title: Case study - When things go wrong
    theme: t-bg-primary1a i-case-study
    copy: |
      ### Deal with problems effectively

      There are many things that can go wrong in events – and there is often no second chance to get things right. If things go wrong it is often impossible to quickly reschedule an event. See below to read an example.
    subInc: 
      type: accordion
      content:
        - 
          title: Company one-day conference
          copy: |
            A business with nationwide branches hires a large London venue and brings 250 senior managers from around the UK to a one-day conference. The keynote speaker flies in from Germany to make the final contribution. 
            
            The audio-visual equipment fails.
            
            In this case the managers and the speaker must return home and the event finishes with a failure. The time and cost of reassembling the delegates and the speaker may not be viable.
          img: /images/svg/ba/ba_u5_s3_p1_accordion_1.svg
    copy2: So getting things right first time is very important when organising a business event and the ability to deal with problems effectively is an important one.
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: Can you think of an event that you have attended were things did not go to plan? Think about whether the cause of the problems were people, equipment or process failures, Make a note of your thoughts in the box to the right. 

  -
    title: Quick quiz
    copy: How to make a positive impression on the phone
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Always clearly identify yourself and your organisation.
          answer: identify
        -
          sentence: Do not use slang words.
          answer: slang
        -
          sentence: Speak naturally at a sensible speed.
          answer: naturally
        -
          sentence: When providing or receiving information containing numbers or statistics, always double-check them.
          answer: double-check
        -
          sentence: Summarise the points you made and be willing to help a caller summarise their points.
          answer: Summarise
        -
          sentence: Thank the person you have called for their time.
          answer: Thank
        
    theme: i-quiz
    # Submit button needed with ticks/crosses at end of sentences
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: Make two lists. In one list give examples of how you would create a positive image, and how a negative image can easily be created.

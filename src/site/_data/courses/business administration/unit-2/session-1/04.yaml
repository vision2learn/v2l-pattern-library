title: What did you learn? 
intro: Well done, you’ve now completed the ﬁrst session of this unit! 
banner: ba-u1-s1-p6.jpg

sections:
  -
    title: Learning points
    theme: t-bg-primary
    copy: |
      
      ### In brief

      By working through this session, you have learned all about:

      * Features of telephone systems
      * Procedures for making and receiving calls
      * Giving a positive image when using phones.
  -
    title: Session Quiz
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        Is the following statement true or false? "The type of telephone system each employer has depends on a number of things, including the size and type of the business.":
          answers:
            True: true
            False: false
        Which of the following is NOT an important procedure when taking or making phone calls?:
          answers:
            Receiving calls: false
            Summarising calls: false
            Asking about the weather: true
        Select one option to complete the following sentence:"When you answer the telephone you are representing the business. It is therefore important to create a __________ image.":
          answers:
            Negative: false
            Unprofessional: false
            Positive: true

  -
    title: Learning points
    theme: t-bg-primary
    copy: |
      
      ### In brief

      By working through this session, you have learned all about:

      * Dealing with incoming and outgoing mail
      * Finding services to deal with mail
      * Calculating postage charges.
  -
    title: Session Quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: The flow of mail in and out of businesses is essential to the function of the business.
          answer: essential
        -
          sentence: Incoming mail can include invoices from suppliers.
          answer: suppliers
        -
          sentence: Poor mail handling can result in loss of customers and money, as well as insufficent business.
          answer: customers
        -
          sentence: Mail can be sorted by confidentiality, urgency or class of delivery.
          answer: urgency
        -
          sentence: Most external mail services take between 24 - 72 hours to deliver. The best known mail service in the UK is the Royal Mail.
          answer: Royal Mail
    theme: i-quiz
  -

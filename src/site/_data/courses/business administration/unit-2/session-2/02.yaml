
title: Mail services and Calculating charges
intro: |
  On this page you will learn about
  * External and internal mail services
  * Calculating postage charges
  * Comparing costs
banner: ba_u2_s2_p2_mail_2.jpg
sections:
  -
    title: External and internal mail services 
    layout: media
    theme: t-bg-primary
    copy: |
      ###  Royal Mail and others

      The best known external mail service is Royal Mail. This organisation accounts for the majority of mail and parcel delivery in the UK.

      There are smaller, private businesses that deliver parcels and larger items locally, nationally and internationally. In most cases items are delivered in 24-72 hours.  There are times when documents and packages need to be delivered on the same day, often within a few hours.

      Specialist courier mail services collect and deliver to these timescales but they are more expensive than mainstream postal delivery – it depends on the sort of service you want.
    img: /images/svg/ba/ba_u2_s2_p2_image_1.svg
  -
    title: Internal mail services
    theme: 
    copy: |
      Internal mail services handle mail between departments and branches. Staff often deliver internal mail in secure pouches and bags, and use delivery vans to get it from branch to branch.

      Internal mail can be handled in many different ways – Scroll through the slides below to see some examples:

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Electronic internal mail
          text: |
             In business today, the most common form of internal mail service is email. While it is unlikely that this method will replace completely the more traditional methods of internal mail services that you will see on the slides to follow, email matches all their features as well as having several benefits. Sending messages to individuals or groups instantly, recipients can be asked to confirm receipt, confidential or sensitive messages can be encrypted, and levels of importance can be indicated.
          img: ba_u2_s2_p2_slide_4.svg
        -
          title: Unsealed envelopes
          text: Internal mail (post) is often sent in unsealed, A4-size envelopes (if the mail is confidential, the envelope will be sealed and marked with a confidential label).
          img: ba_u2_s2_p2_slide_1.svg
        -
          title: List of recipients
          text: |
            If the internal mail (post) needs to be circulated to a number of people, a list of recipients may be attached to the envelope.
          img: ba_u2_s2_p2_slide_2.svg
        -
          title: Sensitive information
          text: In some organisations, the internal mail (post) will be particularly sensitive (such as in legal businesses, etc.) and will need to be circulated in more secure containers rather than simple envelopes. Delivery drivers may require someone to sign for confidential internal mail.
          img: ba_u2_s2_p2_slide_3.svg
  -
    title: Summary
    theme: t-bg-primary i-summary
    copy: |
      * The aim of mail services is to ensure that information and material is delivered to the recipient.
      * Increasing competition in the market should encourage businesses to shop around for the best deal.

  -
    title: Calculating charges
    theme: t-bg-primary
    copy: |
      ### Do your sums
      When calculating postage charges, it helps to ask some questions about the mail you're sending out. Then you can choose which method is best for you and work out the cost of the postage.

      Some businesses specify budgets or unit costs for mail. They can then look at the delivery options available to them and select the most appropriate one.

      See below to see some questions to ask when caluclating postage charges:
    subInc: 
      type: accordion
      content:
        - 
          title: What
          copy: |
            * Time/date is it now and when does the mail need to be delivered?
            * Is the destination of the mail?
            * Is the size, weight and shape of the mail?
        - 
          title: How
          copy: |
            * Specific is the delivery time?
        - 
          title: Does
          copy: |
            It need to be:
            * trackable throughout the delivery journey?
            * signed for when delivered?
            * insured?
  -
    title: Case study - Calculating postage charges
    theme: t-bg-primary1a i-case-study
    copy: |
      Calculating postage charges

      Sometimes you need to work to a budget when calculating postage charges.

      Imagine that you have to post leaflets UK-wide to promote a new product. The following are the types of questions that you need to consider regarding mail charges. Select each image to see an example question and answer.
    subInc: 
      type: reveal
      content:
        -
          title: Question 1
          copy: |
            Q. What time/date is it now and when does the mail/package need to be delivered?  

            A. It's Tuesday 22 March and the leaflets need to be delivered within the next two weeks.
          img: ba_u2_s2_p2_reveal_1.svg
        -
          title: Question 2
          copy: |
            Q. What is the destination of the mail?  

            A. UK-wide.
          img: ba_u2_s2_p2_reveal_2.svg
        -
          title: Question 3
          copy: |
            Q. What is the size, weight and shape of the mail?

            A. Small leaflets going in standard-sized envelopes.
          img: ba_u2_s2_p2_reveal_3.svg
        -
          title: Question 4
          copy: |
            Q. Does it have to be trackable?
            
            A. No.
          img: ba_u2_s2_p2_reveal_4.svg
        -
          title: Question 5
          copy: |
            Q. Does it have to be signed for on delivery?
            
            A. No.
          img: ba_u2_s2_p2_reveal_5.svg
        -
          title: Question 6
          copy: |
            Q. Does it need to be insured?
            
            A. No.
          img: ba_u2_s2_p2_reveal_6.svg
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      For your Unit 2 assessment, you must be able to describe the methods of calculating postage charges for mail or packages. Looking back over the information on this page will help you when it comes to tackling this question in your assessment.
  -
    title: Activity
    theme: t-bg-primary3
    copy: |
      See below to read the following scenario, and then do the Time to Think below.
    subInc:
      type: accordion
      content:
        -
          title: Scenario
          copy: |
            1. Imagine you work for a computer components company. You must send a sample to a client.
            2. It is 10am now and the package must arrive before 10am tomorrow.
            3. You're in Luton and the package must go to Glasgow.
            4. The package is a USB drive, it will fit in a standard padded envelope and will weigh no more than 100g.
            5. It does not need to be tracked but does need to be signed for.
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        Check the prices for sending this package with two different couriers. You can use a comparison site such as [www.parcelmonkey.co.uk](http://www.parcelmonkey.co.uk/compare-prices)  

        _Right click on link to open new tab_

        Write your findings in the box to the right.
  -
    title: Comparisons
    layout: media
    theme: t-bg-primary
    copy: |
      ### What are your mail options?
      Comparing costs can mean you get a cheaper deal.  Once you understand the postal requirements for whatever needs to be sent, you can compare costs and choose the best package.

      Here are two ways you can do this:
      * Compare two or three providers
      * Use a comparision website

      It's worth remembering that some providers offer discounts for large volumes of post. This way, a business may be able to negotiate a good deal with the provider.
    img: /images/svg/ba/ba_u2_s2_p2_image_2.svg

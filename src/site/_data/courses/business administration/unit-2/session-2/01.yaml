
title: Handling mail
intro: |
  In this session, you will learn about three key aspects of handling mail.  These are: 
  * Dealing with incoming and outgoing mail
  * Finding services to deal with mail
  * Calculating postage charges.
banner: ba_u2_s2_p1_mail_1.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-primary
    copy: |
      By working through this session, you will cover the following criteria of your Level 2 Certificate in the Principles of Business and Administration qualification:

      You will:
      1. Understand how to handle mail

      At the end of the session you can:
      1. Explain the purpose of correctly receiving, checking and sorting incoming and outgoing mail or packages
      2. Identify different internal and external mail services available to organisations
      3. Describe the methods of calculating postage charges for mail or packages.

  -
    title: Dealing with mail
    theme: t-bg-supporting2
    copy: |
      ### The lifeblood of business
      Mail is essential for an efficient business.

      The flow of mail and packages into and out of a business is important as these are the lifeblood of all businesses, whether incoming or outgoing.  Select the images below to find out what can count as incoming and outgoing mail.

    subInc: 
      type: reveal
      content:
        -
          title: Incoming mail and packages include
          copy: |
            * Requests for information about products and services
            * Orders for products/services
            * Payments for products/services
            * Invoices from suppliers
            * Important documents such as legal papers
            * Parts, materials and equipment delivered by post
            * Magazines.
          img: ba_u2_s2_p1_reveal_1.svg
        -
          title: Outgoing mail and packages include
          copy: |
            * Purchase orders
            * Payments made to suppliers
            * Invoices to customers
            * Important documents
            * Products sent to customers by post.
          img: ba_u2_s2_p1_reveal_2.svg
    copy2: |
      ### The purpose of correctly receiving checking and sorting mail.

      Over the last 20 years developments in technology have brought about a huge increase in the use of electronic communication which has had a dramatic impact on how businesses and people communicate and do business. Letters and documents which traditionally would have taken at least 24 hours to be delivered, can now be sent instantly via email, and the ability to store and share files online, has reduced the need for the traditional post rooms or a specific person to deal with post that most organisations used to have. 
      
      However, while physical mail services have seen a decline there will always be documents, parcels and packages that have to be sent via traditional mail services. 

  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: Can you think of any consequences of not dealing with mail and packages professionally? Write your ideas in the box to the right.
  -
    title: Poor mail handling
    theme: t-bg-supporting3
    copy: |
      ### What are the outcomes?
      Some of the likely consequences of poor mail handling are:
      * Lost customers
      * Lost money
      * Inefficient business

      See below to take a look at the table that shows how a business can be affected by the poor handling of incoming mail.

    subInc: 
      type: accordion
      content:
        - 
          title: How a business can be affected by the poor handling of incoming mail
          copy: |
            |Incoming mail affected| Potential damage caused|
            |-||
            |Requests for information about products and services| Potential lost business|
            |Orders for products/services | Lost business and income – short and long term |
            |Payments for products/services | Actual money not paid into the business – this can affect cash flow and means that effort must go into recollecting money |
            |Invoices from suppliers | Irritation to suppliers who chase up payments |
            |Important legal documents | Vital information and opportunities lost |
            |Parts, materials and equipment delivered by post | Workers unable to complete work tasks, unsatisfied customers and wasted time. |
  -
    title: Quick quiz
    copy: Choose the **Potential damage caused** from one of the options to complete the sentences. In each case think about the effects of **poor mail handling**.
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        Outgoing mail affected by poor handling - Invoices for customers = Potential damage caused by __________.:
          answers:
            lack of information/delays: false
            supplies are not delivered: false
            suppliers not paid: false
            delay in payment and invoices need to be re-issued: true
            documents need to be resent: false
            dissatisfied customers: false
        Outgoing mail affected by poor handling - Requests for information from potential suppliers = Potential damage caused by __________.:
          answers:
            lack of information/delays: true
            supplies are not delivered: false
            suppliers not paid: false
            delay in payment and invoices need to be re-issued: false
            documents need to be resent: false
            dissatisfied customers: false
        Outgoing mail affected by poor handling - Sending products to customers by post = Potential damage caused by __________.:
          answers:
            lack of information/delays: false
            supplies are not delivered: false
            suppliers not paid: false
            delay in payment and invoices need to be re-issued: false
            documents need to be resent: false
            dissatisfied customers: true
        Outgoing mail affected by poor handling - Purchase orders for buying from suppliers = Potential damage caused by __________.:
          answers:
            lack of information/delays: false
            supplies are not delivered: true
            suppliers not paid: false
            delay in payment and invoices need to be re-issued: false
            documents need to be resent: false
            dissatisfied customers: false
        Outgoing mail affected by poor handling - Import legal documents = Potential damage caused by __________.:
          answers:
            lack of information/delays: false
            supplies are not delivered: false
            suppliers not paid: false
            delay in payment and invoices need to be re-issued: false
            documents need to be resent: true
            dissatisfied customers: false
        Outgoing mail affected by poor handling - Payments to suppliers = Potential damage caused by __________.:
          answers:
            lack of information/delays: false
            supplies are not delivered: false
            suppliers not paid: true
            delay in payment and invoices need to be re-issued: false
            documents need to be resent: false
            dissatisfied customers: false

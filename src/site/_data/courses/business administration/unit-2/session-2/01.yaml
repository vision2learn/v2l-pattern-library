      ### What must be done?
      A range of actions must be taken when dealing with mail.

      Select the images below to see some examples of these actions.

    subInc: 
      type: reveal
      content:
        -
          title: Incoming mail
          copy: |
            * Receiving
            * Checking
            * Sorting
          img: ba_u2_s2_p1_reveal_3.svg
        -
          title: Outgoing mail
          copy: |
            * Collect
            * Sort
            * Price up
          img: ba_u2_s2_p1_reveal_4.svg
    copy2: |
      See below to find out more about incoming mail and dealing with outgoing mail.
  -
    title: Incoming mail
    theme: t-bg-supporting3
    copy: |
      Incoming mail is mail that comes into a business. 
    subInc: 
      type: accordion
      content:
        - 
          title: Sort mail
          copy: |
            You can sort this mail into:
            * Private/personal/confidential
            * Urgent/non-urgent
            * First class/second class/special or recorded delivery
          img: /images/svg/ba/ba_u2_s2_p1_accordion_1.svg
        - 
          title: Deal with mail
          copy: |
            You can deal with mail in this way:
            * Open mail (not private/confidential unless cleared to do so)
            * Remove contents
            * Date-stamp mail when received
            * Check and attach enclosures
            * Sort mail according to departments
          img: /images/svg/ba/ba_u2_s2_p1_accordion_2.svg
        - 
          title: Procedures
          copy: |
            Procedure for dealing with internal mail:
            * Mail is delivered to or collected by different departments, by designated staff
            * It is put into the recipient's in-tray
          img: /images/svg/ba/ba_u2_s2_p1_accordion_3.svg     
  -
    title: Outgoing mail
    theme: t-bg-supporting3
    copy: |
      Outgoing mail is mail that a business sends out (for example, to suppliers and customers). You can deal with outgoing mail in these ways:
    subInc: 
      type: accordion
      content:
        - 
          title: Collection
          copy: |
            * Collect mail from each department or
            * Deliver mail to the mail room at an agreed time
          img: /images/svg/ba/ba_u2_s2_p1_accordion_4.svg
        - 
          title: Sorting mail
          copy: |
            * Sort mail into first/second/special or recorded delivery
            * Other categories such as parcel delivery/couriers/insurance requirements
          img: /images/svg/ba/ba_u2_s2_p1_accordion_5.svg
        - 
          title: Deal with mail costs
          copy: |
            * Weigh letters/packages
            * Calculate postage costs
            * Stamp or frank the items at the correct cost
            * Take mail to an appropriate post box/post office
          img: /images/svg/ba/ba_u2_s2_p1_accordion_6.svg 
  -
    title: Summary
    theme: t-bg-primary i-summary
    copy: |
      * The consequences of poor mail handling are very serious and can ultimately undermine the long-term future of a business.
      * A carefully thought-through and systematic approach to mail should ensure that the majority of mail and packages get to the correct person quickly.    

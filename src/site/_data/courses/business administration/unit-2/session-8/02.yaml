
title: Good customer service
intro: |
  On this page you will learn about: 
  * The importance of good customer service
  * How poor customer service can affect company business
  * Great customer service
banner: ba_u2_s8_p2_customer2.jpg
sections:
  -
    title: Good service
    theme: t-bg-supporting3
    copy: |
      When customer service is good, there are benefits to be had for all.  But bad customer service can have the opposite effects.

      See below to learn more:
    subInc: 
      type: accordion
      content:
        - 
          title: Benefits and the opposite effects
          copy: |
            | Benefits | Opposite effects |
            | -- |  |
            | A sense of trust  | Distrust |
            | Customer loyalty | One-off, one-time custom |
            | Recommendations | Warnings not to use a business |
            | Good publicity | Negative publicity |
            | Job satisfaction | Employee retention |
            | Business growth | Business contraction due to lack of customers |
            | Greater job security | Uncertain job future |
          img: /images/svg/ba/ba_u2_s8_p2_accordion_1.svg
  -
    title: Case study - Poor customer service costs operator millions
    theme: t-bg-primary1a i-case-study
    copy: |
      This fictional news article demonstrates the effects of poor customer service.

      See below to learn more:
    subInc: 
      type: accordion
      content:
        - 
          title: AB Business
          copy: |
            An employee at the region's largest employer has been sacked after receiving a record number of complaints from customers.

            Tim Brown, a customer service manager at AB Business, was sacked from his post of two years after bosses discovered a backlog of customer complaints spanning six months.

            The discovery was made after another worker tipped off bosses that Brown had been unprofessional on the phone and was leaving customers with a bad impression of the firm.

            AB Business, previously a winner of 'Best Customer Service UK' award, prides itself on giving customers the best experience possible. Manager Ellie Black commented: So what are the consequences of poor customer service?
          img: /images/svg/ba/ba_u2_s8_p2_accordion_2.svg
  -
    title: Quick quiz
    copy: What are the consequences of poor customer service?
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Higher levels of customer dissatisfaction
          answer: dissatisfaction
        -
          sentence: Higher levels of complaints
          answer: Higher
        -
          sentence: More resources allocated to dealing with problems
          answer: resources
        -
          sentence: Higher costs
          answer: Higher
        -
          sentence: Reduced orders
          answer: Reduced
        -
          sentence: A bad reputation
          answer: reputation
        -
          sentence: A dip in sales
          answer: sales
        -
          sentence: A less competitive business
          answer: competitive
    theme: i-quiz
  -
    title: Did you know?
    layout: media
    theme: t-bg-primary
    copy: |
      * It's generally more expensive to win new customers than to keep existing ones
      * On average an unsatisfied customer will tell ten people about their experience.
      * Almost a quarter of customers have taken their business elsewhere after a bad customer experience.
      * Almost one in five businesses does not respond to email complaints from customers.

    img: /images/svg/ba/ba_u2_s8_p2_image_3.svg
  -
    title: On the web
    theme: t-bg-secondary2 i-on-web
    include:
      type: on-the-web
      copy: |
        Please see the following websites for further information:

      links:
        improving principles: https://www.business.qld.gov.au/running-business/consumer-laws/customer-service/improving/principles
        what is good customer service: https://www.salesforce.com/blog/2014/04/what-is-good-customer-service.html

  -
    title: Consequences
    theme: t-bg-primary1a i-case-study
    copy: |
      AB Business Manager Ellie Black gave some further statements:

    subInc: 
      type: accordion
      content:
        - 
          title: Backlog
          copy: |
            _"We're working to clear the backlog of customer complaints left by Tim. Please be patient with us, as I know we promise to always deal with issues within two working days. I can only apologise to the customers who had expected their problems to be resolved."_
        - 
          title: Lost customers
          copy: |
            _"A major consequence for us has been that, as we work through the backlog, we're discovering that some customers have just given up and have gone elsewhere."_
        - 
          title: Possible Cutbacks
          copy: |
            _"We've lost out and we've lost the trust of customers who had previously been with us for ten years or more. We don't have the demand that we did in certain geographical areas, so we might even have to look at reducing the number of staff in those areas."_
  -
    title: Great service
    theme: t-bg-primary
    copy: |
      ### Exceeding demands and expectations
      Scroll through the slides below:

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Delight your customer
          text: |
            If you meet customer expectations then the customer will be satisfied. If you exceed customer expectations then you could even delight your customer.
          img: ba_u2_s8_p2_slide_1.svg
        -
          title: Dissatisfied customer
          text: |
            If expectations are not met then the customer may be dissatisfied and disappointed.
          img: ba_u2_s8_p2_slide_2.svg
        -
          title: Low expectations
          text: |
            Some businesses may believe that the solution is to get customers to have very low expectations so that the business can exceed these.

            But in many cases, this is not a workable solution because if a customer believes they will be given an inferior product or service, they may simply take their business elsewhere.
          img: ba_u2_s8_p2_slide_3.svg
        -
          title: Meet or exceed expectations
          text: It is very important for businesses to meet or exceed customer expectations – most businesses try their utmost to work out these expectations so they can be met and exceeded regularly.
          img: ba_u2_s8_p2_slide_4.svg
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: Has a business or organisation exceeded your expectations before? Were you surprised and delighted by this?  Make a note in the box to the right.
  -
    title: Summary
    theme: t-bg-primary i-summary
    copy: |
      The bottom line is that poor customer service can result in fewer external customers, fewer sales, inefficiency and wasted resources.

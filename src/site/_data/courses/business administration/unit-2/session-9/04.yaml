
title: What did you learn? 
intro: Well done, you’ve now completed the seventh session of this unit! 
banner: ba-u1-s1-p6.jpg

sections:
  -
    title: Learning points
    theme: t-bg-primary
    copy: |
      
      ### In brief

      By working through this session, you have learned all about:

      * The purpose of the receptionist role as the first point of contact between the public / client and an organisation
      * How to present a positive image of yourself and the organisation and the purpose of doing so
      * How to carry out entry, departure, security and confidentiality procedures in a reception area
  -
    title: Unit Quiz
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        Select one option to complete the following sentence - "The method for greeting callers with pre-recorded messages is called ________________.":
          answers:
            Call logging: false
            Call sequencing: true
            Caller display: false
        Is the following statement true or false? "When identifying a caller, a useful piece of equipment is a pencil.":
          answers:
            True: true
            False: false
        Which one of the following is a likely result of poor mail handling?:
          answers:
            No effect on the business: false
            Decreased business: true
            Increased business: false
        Is the following statement true or false? "When calculating mail costs the weight and delivery deadline are irrelevant.":
          answers:
            True: false
            False: True
        Which one of the following is a result of waste in the workplace?:
          answers:
            Lower efficiency: true
            Lower costs: false
            Higher efficiency: false
        Select one option to complete the following sentence - "The type of meeting with experts and a large audience is _________________.":
          answers:
            An AGM: false
            A team briefing: false
            A conference: true
        Is the following statement true or false? "It is important to confirm travel and accommodation details before making bookings.":
          answers:
            True: true
            False: false
        Is the following statement true or false? "An internal customer is a work colleague.":
          answers:
            True: true
            False: false
        Select one option to complete the following sentence - "If a printer can do 40 copies per minute but the department needs 55, customers will be __________________.":
          answers:
            Neutral: false
            Dissatisfied: true
            Satisfied: false
        Select one option to complete the following sentence - "Sending out a questionnaire to customers is an example of ________________.":
          answers:
            A focus group: false
            A customer survey: true
            Informal feedback: false

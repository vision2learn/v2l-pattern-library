
title: What did you learn? 
intro: Well done, you’ve now completed the third session of this unit! 
banner: ba-u1-s1-p6.jpg

sections:
  -
    title: Learning points
    theme: t-bg-primary
    copy: |
      
      ### In brief

      By working through this session, you have learned all about:

      * The different types of equipment and their purpose
      * Following manufacturers' instructions
      * Keeping equipment clean, hygienic and ready for the next user.
      
  -
    title: Session Quiz
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        Is the following statement true or false? "Laser printers are more suitable for high-volume printing than inkjet printers as they provide high-quality copies at a faster rate.":
          answers:
            True: true
            False: false
        Which of the following is NOT a feature of photocopiers?:
          answers:
            Copier memory: false
            Caller ID: true
            Speed: false
        Select one option to complete the following sentence - "It is important to follow the manufacturer’s instructions and keep equipment clean because this ensures equipment runs at its most ______________.":
          answers:
            Unhygienic: false
            Efficient: true
            Inefficient: false

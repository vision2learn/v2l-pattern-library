title: What did you learn? 
intro: Well done, you’ve now completed the seventh session of this unit! 
banner: ba-u1-s1-p6.jpg

sections:
  -
    title: Learning points
    theme: t-bg-primary
    copy: |
      
      ### In brief

      By working through this session, you have learned all about:

      * Using a diary to plan activities
      * How to maintain a diary system.
  -
    title: Session Quiz
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        Is the following statement true or false? "Using a diary system helps to minimise the possibility of confusion and error. This comes in especially handy if arrangements change frequently or there are conflicting priorities.":
          answers:
            True: true
            False: false
        Which of the following is NOT a potential use for a work diary?:
          answers:
            Recording commitments for each day: false
            Organising what you are doing after work: true
            Managing your time more efficiently: false
        Select one option to complete the following sentence - "Office diary systems can provide information on employee whereabouts, customer appointments and ___________________.":
          answers:
            Personal information about employees: false
            Resource availability: true
            Employment contracts: false

      Now you have watched the videos, have a go at creating the above mathematical and statistical functions in your practice document that you worked in on the previous page.
  -
  -
    title: Recalculating your data
    layout: media
    theme: t-bg-primary
    copy: |
      You should be careful when changing the content of cells that make up part of a function or formula. Changes made to these cells may make your calculations incorrect and this can invalidate your work.

      For example, if one of the values for a sales team was changed to 20 (cell B4), then the total for January (cell B7) would also change as this cell uses a formula which includes that value.

      You should remember that whenever a cell is updated in Excel, it will automatically recalculate any function or formula that contains data from that cell.
    img: /images/svg/it1/it1_u4_s2_p3_sectionimage.svg
  -
  -
    title: Sorting data
    theme: t-bg-supporting2
    copy: |
      As you add more data to your spreadsheet, you might find it useful to be able to sort in either ascending or descending order. Sorting your data can be a very useful option when analysing and interpreting your data, as you can re-order the information on screen and make it easier to spot patterns and trends.  
      
      Scroll through the slides below to learn more. 

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Simple sorting
          text: |
            Sorting data rearranges it to make it more accessible. 
            The two simple sorting options are:
            * Sort Z to A Highest to lowest (sorts data from highest to lowest) and 
            * Sort A to Z Lowest to highest (sorts data from lowest to highest)
            
            These options are useful if you want, for example, to quickly arrange a list of names alphabetically.

          img: it1_u4_s2_p3_slide1b.svg
        -
          title: Perform a simple sort
          text: |
            1. Click on a cell in the column you want to sort
            2. Go to the *Data* tab and the *Sort & Filter* group
            3. Click the *Sort A to Z* or *Sort Z to A* button. Excel sorts all the data in your selected column and moves the rows of data in adjacent columns to keep data together. 

          img: it1_u4_s2_p3_slide2b.svg
  -
  -
    title: Stretch
    layout: media
    theme: t-bg-primary2 i-stretch
    copy: |
      ###  Complex sorting

      There are also more complex sorting options in Excel. These options let you sort your data by multiple criteria. This is useful if you want to arrange data by dates and then by alphabetical order. 

      If you like you can see how to do this and try it out on your own spreadsheet.  Click on the owl to your right to go to a website which will show you how.

    img: /images/svg/stretch_button.svg
    link: https://www.excel-easy.com/examples/date-filters.html 

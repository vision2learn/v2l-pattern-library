    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Using functions

      Please see the following video for a demonstration on how to use the most commonly used functions in your spreadsheet.
    video: it2_u3_s3_p2_maths_stats.mp4

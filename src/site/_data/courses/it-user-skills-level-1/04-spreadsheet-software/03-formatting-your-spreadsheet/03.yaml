title: Formatting cells, rows and columns
intro: |
  Carefully changing borders, shading and sizes of rows and columns can make the entire worksheet easier to follow.
banner: it1_u4_s3_p3_formatting3.jpg
sections:
  -
    title: Select the area first
    theme: t-bg-primary
    copy: |
      Before you apply any formatting, you need to make sure that you select the cells, row or column that you want to format. You can select a row by clicking on the row number. To select a column, click on the column letter.
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      key point text
  -
  -
    title: Using Borders and shading
    theme: t-bg-primary
    copy: |
      You can highlight a particular cell, row or column in your spreadsheet by applying borders and shading to your work. For example, you might want to highlight a particularly important piece of data in your spreadsheet in order to draw attention to it.

      To apply borders and shading to a cell, row or column, you must first select the area of the spreadsheet that you want to format.  Select the images below to see more.

    subInc: 
      type: reveal
      content:
        -
          title: Borders
          copy: |
            In the *Format Cells* dialogue window you would go to the *Border* tab and select the border that you want.
          img: it1_u4_s3_p3_reveal1.png
        -
          title: Shading
          copy: |
            In the *Format Cells* dialogue window you would go to the *Fill* tab and select the colour and pattern that you want.
          img: it1_u4_s3_p3_reveal2.png
  -
  -
    title: Changing height and width
    theme: 
    copy: |
      You can quickly and easily alter the height of rows and the width of columns in your spreadsheet.

      Select the images below to read 

    subInc: 
      type: reveal
      content:
        -
          title: Row height
          copy: |
            On the *Home* tab simply select the *Format* button, select *Row Height*, and type your the new height value in the dialogue box that appears.
          img: it1_u4_s3_p3_reveal3.png
        -
          title: Column width
          copy: |
            On the *Home* tab simply select the *Format* button, select *Column Width*, and type your the new width value in the dialogue box that appears.
          img: it1_u4_s3_p3_reveal4.png
  -
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Formatting

      Please see the following video for a demonstration on how to format your spreadsheet.
    video: it2_u3_s4_p2_formatting.mp4
  -
  -
    title: Time to practice
    theme: t-bg-primary3 i-practice
    copy: |
      Now you have tried the activity and seen the video, have a go at editing rows and columns in your practice document that you worked in from the first page of this session.

title: Welcome to Unit four
intro: |
    ### Spreadsheet software
    
    Welcome to the forth unit of your Level 1 Certificate in IT User Skills.  This unit is all about Spreadsheet software. This unit is suitable for you if your work involves entering data into cells, using simple formulae / functions and tools to edit, sort, present and check spreadsheets. 

banner: it1_u4_s1_p1_exceltitle.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit, you will cover the following criteria of your Level 1 Certificate in IT User Skills qualification.

      You will:

      1. Use a spreadsheet to enter, edit and organise numerical and other data
      2. Use appropriate formulas and tools to summarise and display spreadsheet information
      3. Select and use appropriate tools and techniques to present spreadsheet information effectively

      [View the complete set of learning outcomes for this unit.](/pdfs/v2l_it1_learning_goals_u4.pdf)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about the following in Spreadsheet software:
      
      * Microsoft Excel
      * Uses for spreadsheets
      * What type of spreadsheet
      * Spreadsheet key components
      * Amending your spreadsheet
      * Editing techniques
      * Using images
  -

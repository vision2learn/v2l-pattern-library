title: Planning an IT task
intro: |
  Being able to plan your work effectively is an essential skill to have. On this page you will learn about:
  * Planning a task
  * Planning form example
  * Barriers to success

banner: it1_u3_s1_p3_ipu_planning.jpg
sections:
  -
    title: Key point
    theme: t-bg-supporting2 i-keypoint
    copy: |
      You will be asked to plan a task as part of your assessment.
  -
  -
    title: Why is planning so important?
    theme: t-bg-primary
    copy: |
      When you are working on a task, you will be aiming to produce work that is:

    subInc: 
      type: reveal
      content:
        -
          title: High quality
          copy: |
            
          img: it1_u3_s1_p3_ipu_reveal_1.svg
        -
          title: Fit for purpose 
          copy: |
            Fit for purpose as it achieves the outcomes and or requirements
          img: it1_u3_s1_p3_ipu_reveal_2.svg
        -
          title: Meets the deadline
          copy: |
            Ready on or before the deadline date
          img: it1_u3_s1_p3_ipu_reveal_3.svg
    copy2: If you are going to satisfy these requirements, then planning is needed.
  -
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Planning a task

      Please see the following video which will help you to plan a task taking the following into consideration:
      * Key outcomes
      * Information sources
      * Software choices
      * Skills and resources
      * Content, structure and layout

    video: it2_u2_s1_p3_ipu_planning.mp4
  -
  -
    title: Quick quiz
    copy: Depending on the task you are working on, you will need to decide what IT tools you are going to use to help you complete the task. You will find that a lot of the Microsoft Office programs are designed for very specific tasks, which makes it easier for you to choose which one is best for the job. Have a go at the quiz questions to see if you can guess which software to use.
    subInc: 
      type: word-quiz
      content:
        -
          sentence: If you are producing a report, Word would be the most suitable software application to use.
          answer: Word
        -
          sentence: f you are putting together financial information and calculations, Excel would be the most suitable software application to use.
          answer: Excel
        -
          sentence: If you are creating a presentation, PowerPoint would be the most suitable software application to use.
          answer: PowerPoint
    theme: i-quiz
  -
  -
    title: Read - Planning in practice
    theme: t-bg-primary2 i-read
    copy: |
      Lets return to the example that we looked at in the Word unit.  
      
      After the meeting with his manager, Bill started to put together a plan for his task. He created a planning form that he could use to list out all of the relevant information needed.

      Select to see a copy of Bill’s [planning form](/pdfs/it1_u3_s1_p3_ipu_planning_form.pdf)
  -
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        Can you think of anything that could have a negative impact on the task you are working on?
  -
  -
    title: Barriers to success
    theme: t-bg-primary
    copy: |
      When you are planning a task, it is important to remember that there are certain factors that can have a negative impact on the work you are doing and may prevent you from achieving your goals.

      Scroll through the slides below to learn more.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Data protection
          text: |
            Any personal data that you include in your work is covered by **The Data Protection Act (2018)**. If you need to include personal information in your work, you should make sure that you have permission to use it. As you can imagine, your task could be affected if you aren’t able to get permission to use the information you want to or if you use data without permission and get into trouble for it!

            Click to read more about [The Data Protection Act](https://www.legislation.gov.uk/ukpga/2018/12/contents)

          img: it1_u3_s1_p3_ipu_slide_1.svg
        -
          title: Copyright
          text: |
            If your work includes any content that is not your own, you need to be aware of copyright laws. If you do want to use content (some text, an image, etc) that belongs to someone else, you may need to ask their permission before using it. The owner of the content might also want you to include an acknowledgement in your work, in order to confirm the source of the content.

            **The Copyright, Designs and Patents Act 1988** is the main piece of legislation relating to the use of other people’s content.

          img: it1_u3_s1_p3_ipu_slide_2.svg
        -
          title: Organisational guidelines
          text: |
            Your organisation may have specific guidelines that you need to stick to when working on a task. For example, you might need to follow an organisational house style or a set of specific brand guidelines.

            A house style and/or brand guidelines will give you information about how to make sure your work reflects the brand of the organisation. This might include things like how to use the company logo or apply company colours to text, etc.
          img: it1_u3_s1_p3_ipu_slide_3.svg
        -
          title: Accessibility
          text: |
            Another factor to consider is accessibility.  
      
            It is always a good idea to think about people who may have dyslexia or sight impairment when producing spreadsheets, documents or presentations.
          img: it1_u3_s1_p3_ipu_slide_4.svg
  -
  -

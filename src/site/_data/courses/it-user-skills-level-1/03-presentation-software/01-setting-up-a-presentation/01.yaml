title: Welcome to Unit three
intro: |
    ### Presentation software
    
    Welcome to the third unit of your Level 2 Certificate in IT User Skills.  This unit is all about Presentation software. This unit is suitable for you if need to produce simple presentations.

banner: it1_u3_s1_p1_powerpointtitle.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit, you will cover the following criteria of your Level 1 Certificate in IT User Skills qualification.

      You will:

      1. Input and combine text and other information within presentation slides
      2. Use presentation software tools to structure, edit and format slides
      3. Prepare slides for presentation to meet needs

      [View the complete set of learning outcomes for this unit.](/pdfs/)
  -
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about the following in Presentation software:
      
      * How to set up your presentation
      * Presentation guidelines
      * Maintaining consistency
      * What type of presentation to create
  -

title: More presentation skills
intro: |
    As well as adding text to your presentation, you can also include images, sound, charts, tables and colour to enhance the content of your slides.

banner: it1_u3_s3_p1_images.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about the following in Presentation software:
      
      * Using images, shapes and icons
      * Formatting shapes
      * Using Sound or Video
      * Using charts
      * Using tables
      * Adding notes to your presentation
      * Timing and slide transitions
  -
  -
    title: Key point
    theme: t-bg-supporting2 i-keypoint
    copy: |
      As part of your assessment you will need to prepare slides for presentation.
  -
  -
    title: Using images
    theme: t-bg-primary
    copy: |
      As well as adding text to your presentation, you can also include images to enhance the content of your slides. 
      
      It’s easy to change the size and position of the images you insert into your presentation. For example, you might want to make the image a bit smaller or move it so that it is aligned with the text on the slide. 

      Scroll through the slides below to learn more.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Using images
          text: |
            They say a picture is worth a thousand words, and using images in your presentation can really help you to get your message across or add extra impact to the points you are making.
          img: it1_u3_s3_p1_slide1.svg
        -
          title: Resize images
          text: |
            The first thing you need to do to resize an image is click on the image to select it. When the image is selected, it will appear with small circular handles around the edge. To resize your image, simply click and drag any of these handles, then release your mouse button once your image is the desired size.
          img: it2_u2_s3_p3_slide1.png
        -
          title: Position images
          text: |
            ## Position images

            If you want to move your image around the slide, first click on the image so that it is selected (as with resizing, you will see the small circular handles around the image). Now, click on the main image and drag it into its new location on the slide. When you’re happy with the position of the image, release your mouse button to ‘drop’ it into place.
        -
          title: Order
          text: |
            Sometimes, it may be useful to change the order of any images that you insert into your presentations. To do this:

            1. Click on the image you want to order, and then click on the *Format* tab.
            2. Use the *Bring Forward* and *Send Backward* buttons in the *Arrange* group to change the order of your images.

          img: it1_u3_s3_p1_slide2.svg
        -
          title: Crop images
          text: |
            To crop your object, click on it so that the *Format* tab appears. Then click on the *Crop* button in the *Size* group.
            
            Your image will now appear with black handles around it – use these to crop your image as you want. 
          img: it1_u3_s3_p1_slide3.svg
  -
  -
    title: Sound / Video
    layout: media
    theme: 
    copy: |
      Inserting a sound or video / movie clip into your presentation can be a useful addition to a presentation. Just like images and tables, audio and video can make your presentation more interesting and help to keep your audience engaged.

    img: /images/svg/it1/it1_u3_s3_p1_image.svg
  -
  -
    title: Using shapes and icons
    theme: t-bg-primary1a
    copy: |
      As well as inserting images into your presentation, you can also use the shape and icon tools in PowerPoint.

      Select the images below for more information.
    subInc: 
      type: reveal
      content:
        -
          title: Shapes
          copy: |
            Shapes can be used to create diagrams and graphics.  These can be easy to change using the various tools on the Shape Format toolbar including colour, position, size and effects.
          img: it1_u3_s3_p1_reveal1.svg
        -
          title: Formatting shapes
          copy: |
            When formatting shapes, you can also click on the shape with your right mouse button and select *Format Shape* from the menu that appears – this will give you the option to change the way your shape looks (for example, by changing the colour of the shape or rotating it).
          img: it1_u3_s3_p1_reveal2.svg
        -
          title: More flexibility
          copy: |
            Inserting graphic images into your presentation can lead to a large file size for your final presentation document.  As an alternative, using shapes and icons in PowerPoint gives you more flexibility and more control over the look and feel of your presentation as well reducing the file size.
            
          img: it1_u3_s3_p1_reveal3.svg
  -

title: Notes, slide transitions and timing
intro: |
  On this page you will learn about speaker notes, slide transitions and how to automate the timing of your presentation.
banner: it1_u3_s3_p3_timings.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      key point text
  -
  -
    title: Speaker notes
    theme: t-bg-supporting3
    copy: |
      When you are creating a presentation, you have the option to add speaker’s notes to each slide. You can use these notes as a prompt to remind you what to say for each slide.

      Scroll through the slides below to learn more.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Adding speaker notes
          text: |
            1. In PowerPoint, open up the presentation that you want to add notes to.
            2. At the bottom of the window, you will see a white box that says, ‘Click to Add Notes’:
            blank presentation with the box ‘click to add notes’ highlighted
            3. Click in this box and begin typing to add notes to your presentation.

          img: it1_u3_s3_p3_slide1.svg
        -
          title: Enlarging the notes box
          text: |
            If you want to enlarge the notes box, simply move your mouse over the grey line that separates the notes area from the main slide area – your cursor should change to a black double-headed arrow. Now click and drag this line upwards to increase the size of the notes area that is displayed.

          img: it1_u3_s3_p3_slide2.png
        -
          title: Viewing speaker notes
          text: |
            1. Click on the *View* tab.
            2. In the *Presentation Views* group, click on *Notes Page*.
            *View* tab with the notes page icon highlighted
            3. Your presentation will now change to display the speaker’s notes as they will appear when printed.

            To change your presentation view back to normal, simply click on the *View* tab and then click on the *Normal* button in the *Presentation Views* group.

          img: it1_u3_s3_p3_slide3.svg
  -
  -
    title: The timing and slide transition of your presentation
    theme: t-bg-primary1a
    copy: |
      When you are delivering your presentation, you don’t always want to have to click your mouse every time you want to move from one slide to another.

      Select the images below for more information.

    subInc: 
      type: reveal
      content:
        -
          title: Timing
          copy: |
            Instead of clicking through the slides in your presentation, you can add timings to your slide show so that PowerPoint automatically moves through the slides for you at a suitable speed for your presentation.
          img: it1_u3_s3_p3_reveal1.svg
        -
          title: Transitions
          copy: |
            A slide transition is the way in which one slide of your presentation moves on to the next. Rather than slides just appearing one after one, you can choose a range of effects as each new slide appears. Using transitions can add a really professional feel to your presentation and can be used on every slide.
          img: it1_u3_s3_p3_reveal2.svg
        

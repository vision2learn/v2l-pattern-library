    title: Session Quiz
    theme: i-quiz
    subInc: 
      type: quick-quiz
      content:
        Which one of the following is NOT a tool for inputting data?:
          answers:
            Keyboard: false
            Voice recognition software: false
            Mouse: true
        True or false? "Word processors are used for creating text documents. They cannot incorporate pictures or graphic elements.":
          answers:
            True: false
            False: true
        Complete the following sentence - "If you want to type capital letters you can press the caps lock key, or you can hold the ___________ key down and then press the relevant letter key.":
          answers:
            Shift: true
            Alt: false
            Tab: false

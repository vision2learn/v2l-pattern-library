    title: Time to practice
    theme: t-bg-primary3 i-practice
    copy: |
      ### Insert and format image
      
      Now that you have learnt about inserting images, its time to try this out.  Download the following image file and insert it into your practice document.
      
      [Balloon.jpg](/pdfs/it2_u1_s5_p2_image_balloon.jpg) (*Right click on this item with your mouse to download*)

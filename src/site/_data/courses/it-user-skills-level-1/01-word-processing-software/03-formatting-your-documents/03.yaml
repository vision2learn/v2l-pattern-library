    copy: |
      ### Inserting an image

      You can also integrate images into your documents. 
      
      Images are very useful as they allow us to present data in a highly visual format that is easy to understand.
      
      Please see the following video for a demonstration on how to insert and format images:

    video: it2_u1_s5_p2_images_video_pc.mp4

title: Using images
intro: |
  You can insert image files into your document. Using images is a really good way to add interest to your document – for example, you could include an image to illustrate a particular point, or maybe add a company logo or a photograph.
banner: it1_u1_s3_p3_images.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      text
  -
  -
    title: Inserting an image
    theme: t-bg-primary
    copy: |
      Using images is a really good way to add interest to your document – for example, you could include an image, such as a company logo or photograph, to illustrate a particular point.

      You can insert a range of image files into your document – for example, you can include .jpg, .bmp, .png and .gif files, which are some of the most commonly used image formats.
    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Step 1
          text: |
            Position your cursor at the point in the document where you would like to insert the image.
      
            Click on the *Insert* tab, and then click on the *Picture* icon in the *Illustrations* group.

            You can choose a picture from your computer, stock images or online.
          img: it1_u1_s3_p3_slide1.svg
        -
          title: Step 2
          text: |
            The *Insert Picture* dialog box will appear where you can choose your image.  (How this window looks will depend on your choice.)

            Use the main window to navigate to an image file you want to insert and then click to select the file.
      
            Click the *Insert* button to insert the file into your Word document.
          img: it1_u1_s3_p3_slide2.png
  -
    title: Formatting an image
    theme: 
    copy: |
      Once you have inserted your image, there are a number of things that you can do to format your images. 
      
      These tools can be found on the *Picture Format* tab that will appear **when you click on an image.** 
      
      You can use this formatting tab for a number of different things. Click on the different buttons in the *Format* tab below to learn more about the tools you can use to format your images.
    interactive: 
      file: it2/u1_s5_p2_format_tab_pc
      width: 2000
      height: 430
      composition: 1A9338FEE8584755AB48BB991EF417A3

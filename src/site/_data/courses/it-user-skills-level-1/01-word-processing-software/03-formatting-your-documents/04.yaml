title: Checking your work
intro: |
  When creating your document, it is important to make sure that your content is accurate.
banner: it1_u1_s3_p4_spell.jpg
sections:
  -
    title: Spelling and grammar check
    theme: t-bg-primary
    copy: |
      When you have finished typing a document, you can use the Spelling and Grammar tool in Word to check the accuracy of the text you have entered.
    subInc: 
      type: slider
      title: 
      slides:
        - 
          title: Spelling errors
          text: |
            When you use Microsoft Word, you may have noticed that red wavy lines appear on your document. These indicate a spelling mistake or a word that is not in the spell check dictionary.

            Take a look at this example to see what this could look like:

            "Spelling and grammar checks are really importan as they make sure your work is acurat"

          img: it1_u1_s3_p4_slide1a.svg
        - 
          title: Grammatical errors
          text: |
            You may notice that Word underlines some words and phrases with two blue lines. This means that although words are spelt correctly, there is a grammatical error with the word or phrase.

            "It were really important for the grammar to be checked."
          img: it1_u1_s3_p4_slide2a.svg
        - 
          title: Spelling and Grammar checks
          text: |
            To check your work in Word:

            1. Click the *Review* tab to open up the *Review* tab. On this tab, Select either the *Editor* or *Spelling* button.
            2. Office will begin checking your document for errors and a dialog box will appear to highlight any suggested corrections.

            In the *Spelling and Grammar* dialog box, you can use several options to help you correct your document. 
          img: it1_u1_s3_p4_slide3a.svg
  -
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      As part of your assessment you will be asked to check your document using IT tools and making corrections as necessary.
  -
  -
    title: Proofreading
    theme: t-bg-primary
    copy: |
      The spell checker does have its limitations, so you shouldn’t rely on it to spot every error in your document.

      You should always take care to ensure that the data you enter into your documents is accurate – this will cut down on the number of errors in your work and make your document more professional.

      Scroll through the slides below to learn more.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Proofread your document
          text: |
            As you won’t always be able to ensure 100% accuracy and your spell checker may have missed certain mistypes, you should always proofread your document. You can begin by checking your work on-screen; however, it is often easier to proofread your work once you have printed the document out.
          img: it1_u1_s3_p4_slide1.svg
        -
          title: Document appearance
          text: |
            You should also check the way your document looks. For example, pay attention to the page layout, margins, line breaks and page breaks. These things all make a difference to the way your finished document looks, so it’s important to get them right. Remember, you can use the Print Preview option to check the layout of your document.
          img: it1_u1_s3_p4_slide2.svg
  -
  -
    title: Watch a demonstration
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Checking your work

      Please see the following video for a demonstration on things to consider when checking your work:

    video: it2_u1_s6_p2_findreplace_video_pc.mp4
  -
  -
    title: Time to practice
    theme: t-bg-primary3 i-practice
    copy: |
      Now that you have learnt about checking your work, try this out in your practice document.

    title: Session Quiz
    theme: i-quiz
    subInc: 
      type: quick-quiz
      content:
        Which one of the following is NOT an example of data that could benefit from being presented in a table?:
          answers:
            Numerial data: false
            Lists: false
            Pictures: true
        True or false? "‘Text wrapping’ refers to the method of ‘wrapping’ your content with headers and footers.":
          answers:
            True: false
            False: true
        Complete the following sentence - "By default, Microsoft Word will assume you’re using A4 sized paper in ________ orientation.":
          answers:
            Portrait: true
            Landscape: false

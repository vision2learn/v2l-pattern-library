  -
  -
    title: How to take appropriate security precautions
    theme: 
    copy: |
      There are a number of precautions that can be taken to ensure that the system security threats described in the section above can be avoided or, at the very least, minimized. Please see the slides below for details of these precautions.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Antivirus software
          text: |
            Installing Antivirus software will provide a high level of protection against a number of security threats. Initially developed to detect and remove Viruses, modern antivirus software can provide real time protection from a wide range of malicious software. Installing antivirus and ensuring that the software is kept up to data with patches and software updates will provide a high level of protection from a wide range of threats.
          img: it1_u2_s1_p2_slide1b.svg
        -
          title: Firewalls
          text: |
            While a firewall can provide some protection, on its ownit will not provide protection against security threats. However this doesn’t mean that it isn’t important. A firewall is only one part of a security shield and when configured correctly and used in conjunction with other security software will make a significant contribution to system security.
          img: it1_u2_s1_p2_slide2b.svg
        -
          title: Browser security settings
          text: |
            Web browsers are the gateway to the online world and as such can provide opportunities for a wide range of security threats. By configuring the security settings in your chosen browser you can reduce the potential risks from malware and other types of malicious attacks.
          img: it1_u2_s1_p2_slide3b.svg
        -
          title: Report security threats or breaches
          text: |
            Everyone in an organisation is responsible for following guidelines and procedures to help protect from security threats. It’s important that any security threat or breach is reported to the security team so that the potential risks can be investigated and appropriate action take to minimize or eliminate the threat.
          img: it1_u2_s1_p2_slide4b.svg
        -
          title: Email security
          text: |
            Emails can potentially provide an easy way for a cyber threat to gain access to your systems. While email filtering can catch and isolate most suspicious messages, making sure that everyone understands the risks from clicking on the wrong link or opening the wrong attachments will ensure that security breaches from this method of attack can be eliminated.
          img: it1_u2_s1_p2_slide5b.svg

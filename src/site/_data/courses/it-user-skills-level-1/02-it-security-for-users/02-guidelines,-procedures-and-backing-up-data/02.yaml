title: The importance of backing up data
intro: |
  On this page you will learn about the:
  * Importance of information, and
  * Importance of backing up data
banner: it1_u2_s2_p2_backup.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Describe why it is important to backup data securely.
  -
  -
    title: The importance of information
    layout: media
    theme: t-bg-supporting3
    copy: |
        ### The value of information

        When making decisions and developing procedures on the management of information, it helps to consider two different aspects: importance and inactivity.

        **Importance** indicates the value of information for the organisation. The higher the value, the higher the importance.

        **Inactivity** indicates whether the organisation needs to access this information to actively use it. The more likely the organisation is to want quick access, the higher the level of activity.

    img: /images/svg/it1/it1_u2_s2_p2_image1.svg
  -
  -
    title: The importance of backing up data
    theme: t-bg-primary
    copy: |
      It is important to carry out regular backups to prevent loss of data. As more and more important and sensitive information is stored, you can always reinstall software if you have a critical system failure, but data could be completely erased and lost forever. Scroll through the slides below to find out more.
    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Why backup?
          text: |
            There are various causes of data loss such as a  hardware breakdown, virus attack, power surges or even human error or equipment theft so it is important to have a backup and recovery plan in place. This will ensure that if any data is lost or corrupted you can quickly restore your data from the last backup point which will minimise any loss. 

          img: placeholder_icon.svg
        -
          title: Schedule regular backups
          text: |
            Once you have made a full backup of the entire system you should then set automated incremental backup points. This will ensure that only new data, or changes to existing backed up data, are added to the backup. Having incremental backups will save time and diskspace as only the latest changes are added. These backup points should be set for the end of each day at least or more frequently if required. 
          img: placeholder_icon.svg
        -
          title: Backup to an external space
          text: |
            It is a good idea to backup your data to a removable drive or a network drive as this will ensure that if the computer suffers physical damage you can restore to a new computer as your backups are separate to your system. As well as backing up to appropriate media you can also now backup to the cloud.  
          img: placeholder_icon.svg
        -
          title: Encription
          text: |
            text

          img: placeholder_icon.svg

  -
    title: Access to confidential information
    layout: media
    theme: t-bg-supporting2
    copy: |
      The business should make it clear who has access to which items of data and for which purposes. The issues of access may apply to people other than staff – it can apply to people outside the organisation.

      Access to confidential information should be on a need-to-know basis. This means no-one should have access to information unless it is relevant to their work. Limits of confidentiality must also be set.
    img: /images/svg/it1/it1_u2_s2_p1_image1.svg 
  -
  -
    title: Why is information confidential?
    theme: t-bg-primary
    copy: 
    subInc: 
      type: accordion
      content:
        - 
          title: Certain information is kept confidential for several reasons 
          copy: |
            These include:

            * Legal requirements, including complying with legislation such as the Data Protection Act (2018) or the content of legally enforceable contracts.
            * Commercial requirements, such as keeping confidential information secret. A lack of confidentiality can show a lack of competence and/or trust.
            * Moral requirements. There is a strong moral obligation to respect people's privacy and confidentiality. If this is broken then people will withhold information and lack trust.
            
            People need to know what they can and cannot access and the repercussions that may follow if confidence and trust are broken.
  -

  -
    title: Formatting charts and graphs
    theme: t-bg-primary
    copy: |
      Once you have created your chart, you can improve it by giving it a title, labelling its axes and using legends.

      Chart titles provide an overall title for your chart, letting others know what your chart or graph is for. Labelling axes helps the reader to interpret the units that each axis represents. A graph commonly has an X axis and a Y axis.

      The legend is the key to interpreting your graph. It represents the different variables in the graph or chart (such as different coloured ‘slices’ in a pie chart!). 

title: What did you learn? 
intro: Well done, you’ve now completed the final session of Spreadsheets Level 2! 
banner: ba-u1-s1-p6.jpg

sections:
  -
    title: Summary
    theme: t-bg-primary i-summary
    copy: |
        In this session, you have learnt about:
        * The importance of checking your work, including how to check text and data
        * Errors in numbers and formula, and how to use Excel error checker
        * How to solve problems in Excel; including how to display formula, remove circular references and use validation lists
        * How to present your spreadsheet effectively and ensure that it is fit for purpose
        * How to evaluate the productivity and efficiency of different IT methods
        * How to improve your productivity and efficiency by creating macros
        * The different ways of testing your improvements

title: What did you learn? 
intro: Well done, you’ve now completed the final session of Presentations Level 2! 
banner: ba-u1-s1-p6.jpg

sections:
  -
    title: Summary
    theme: t-bg-primary i-summary
    copy: |
        In this session, you have learnt about:
      
        * The importance of reviewing the aims of your presentation
        * Preparing your slides, including how to check slide order, timings and design
        * How to check the accuracy of your presentation using spelling check and proofreading
        * Other factors that might affect your presentation, including copyright law, acknowledging sources, local guidelines and equal opportunities
        * How to evaluate the strengths and weaknesses of your work
        * How to improve your work, making corrections and working with others and training as necessary
        * The different things that you need to look at when reviewing your outcomes
        * How to evaluate the productivity and efficiency of different IT methods

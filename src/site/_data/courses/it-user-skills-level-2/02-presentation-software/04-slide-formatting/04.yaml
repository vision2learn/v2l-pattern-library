    title: Summary
    theme: t-bg-primary i-summary
    copy: |
        In this session, you have learnt about:
      
        * The ways that you can format slides including how to hide slides
        * How to edit slide structure such as slide backgrounds, orientation and slide order
        * The ways that you can format slides including templates, themes, designs and styles and lines and borders
        * How to use master slides as part of your presentation
        * How to evidence your editing skills



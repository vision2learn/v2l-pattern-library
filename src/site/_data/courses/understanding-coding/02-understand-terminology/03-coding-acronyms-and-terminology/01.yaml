  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      * What is meant by a unit of code 
      * Key characteristics of DRY code 
      * Key characteristics of WET code 
      * Key differences between DRY and WET code
      * What is meant by open source code 
      * What is meant by closed source code 

  -
  -
    title: Key point
    theme: t-bg-grey i-keypoint

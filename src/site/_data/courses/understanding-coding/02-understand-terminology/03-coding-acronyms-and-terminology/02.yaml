    title: Case study
    layout: media
    theme: t-bg-primary1a i-case-study
    copy: |
      ### Case study - WordPress and Weebly

      Let’s compare 2 free website building software programs:
      * WordPress - open source website builder
      * Weebly - free software but not open source

      Let’s look at 2 website builders that are free to use and their code can be amended but one is open source and the other is not.

      Weebly is a closed-source website builder, but it gives freedom to customise designs by editing the HTML and CSS codes. However, all the website tools are controlled by Weebly and closely monitored within its own environment. It is easy to use with all its drag and drop features and offers help guides and extra support in its paid for plans.  As Weebly is a closed system they manage all the technical issues.

      WordPress however is an open source website builder which gives a lot of freedom to modify a website and decide how website tools should work. But saying that you need to be knowledgeable about codes as any modifications will need good coding skills and although there is a large community offering free plugins not all of these are well built. 

    img: /images/svg/uc/uc_u2_s3_p2_casestudy.svg

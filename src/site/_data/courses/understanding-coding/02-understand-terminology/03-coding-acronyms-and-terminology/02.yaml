    title: Stretch - Case Study 2
    layout: media
    theme: t-bg-primary2 i-stretch
    copy: |
      ### How Google's Android Open Source Project became largely proprietary.

      In 2005 Google purchased Android and in 2007 Google announced and launched (2008) their Android open source project in response to the new iPhone by Apple which started the new smart phone era. Google had formerly been an app partner for the original iPhone but was worried about being limited to one company.

      Android consists of both open source and closed source elements. The open source part of Android is the AOSP and the closed source part is all the google branded apps. 

      To keep control of Android and to stop their competitors using their public source code Google has had to take more control creating its own proprietary versions. 

      This has culminated in *The EU antitrust* ruling which imposed a penalty on Google for stifling competition through their dominance of the Android operating system. Select the owl to see greater detail about this case study.

    img: /images/svg/stretch_button.svg
    link: https://www.npr.org/2021/09/27/1040889789/google-eu-Android-appeal-antitrust?t=1634645020669
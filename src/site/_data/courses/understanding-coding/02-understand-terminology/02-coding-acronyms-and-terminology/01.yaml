  -
    title: What is a unit of code?
    theme: t-bg-supporting3
    copy: |
      _See Tom's notes about 'variable' and 'function' text needed_

      Units are the smallest groups of code that can be maintained, executed, reused and tested independently. A unit can be almost anything such as a line of code. 
      
      In most programming languages it is a:
      * function,
      * subroutine, 
      * method, or 
      * a property. 
      
      A *unit test* is a way of testing the smallest piece of code that can be logically isolated in a system. Smaller tests give a granular view of how the code is performing and by being small test can be run fast.

      See below to learn more about 
    subInc: 
      type: accordion
      content:
        - 
          title: Unit testing
          copy: |
            Identifying units makes it possible to check code through a process called unit testing. Specific test are written to test whether a unit is functioning as it should. This allows developers to write a test script, which is essentially a piece of code separate to the main program that runs a specific test for each unit in the main program. 
            
            Each unit is tested to see if it runs as expected based on criteria, and summarises this in a report. Each time the program is updated, the test script will be run to ensure that all units are functioning correctly. This helps to debug the whole program as new units are added.
            
            The Python code below shows a simple function (lines 4-7), and an example of where unit testing is useful.
 
            ![](/images/banners/uc/placeholder.jpg)

            _this example will be displayed as 'actual code' text which the user can copy_

            The output is seen at the bottom, below line 23.
            * The first test resulted in the output 8.
            * The second test gave us the output ‘goatgoat’. 

            If we wanted to make sure to make sure that the answer was always an integer, a unit test could report this when the multiply_values function gave us an output we did not expect.

  -
    title: What is WET and Dry code?
    theme:
    copy: |
      WET and DRY are acronyms used in software development to explain coding principles.

      WET = 'Write Everything Twice'
      
      DRY = 'Don't Repeat Yourself'
      
      When writing a program, we want our code to be as easy to debug and understand as possible. We therefore use certain conventions when we write code to ensure this. Let’s use the example of the website for a taxi firm. Using Python and HTML, on 3 separate pages, we want a banner at the top (masthead) with links that are the same on each page, and a title which is different on each page.
  -
    title: WET code
    theme:
    copy: |
      When code is ‘WET’, code segments are repeated. In our taxi firm example, the masthead is defined over 5 lines 3 separate times on lines from lines 2, 12, and 22.
    subInc:
      type: code
      lang: python
      highlight: 
      code: |
        def goHome():
          print('<div class="masthead">')
          # more code here - get text from Tom



    copy2: |
      But let’s say that the company want to change their name or the slogan. With the WET code above, they would have to make changes in 3 different places. In a large program, there is a high risk of missing somewhere that changes should have been made.     
  -
  -
    title: DRY code
    theme:
    copy: |
      The ‘DRY’ code principle aims to reduce repetition of any kind. In the code below, we add an extra function, masthead(), to print just the masthead. Each other function contains this bit that was repeated before, then content which is specific to each page. This way, we only have to make changes at ONE place in the script to change the masthead on every page, not one on each page.
    subInc:
      type: code
      lang: python
      highlight: 
      code: |
        def mastHead():
          print('<div class="masthead">')
          # more code here - get text from Tom



    copy2: |
      This has the advantages of being easier to read as well as only needing to be changed in one place.
        
  -
    title: Key characteristics
    theme: supporting3
    copy: |
      So the key characteristics of WET code are:
      *	repeated code sections

      And the key characteristics of DRY code:
      *	code is *generalised* (by making it into a separate function, or another way) to avoid repetition

      However, it is not always possible to write DRY code, as it can be difficult in some languages, such as low-level machine languages and procedural languages (such as C and FORTRAN). But the key difference is that WET code may have repeated code sections whereas DRY code is generalised.

title: Open and closed source code
intro: |
  On this page you will learn about the differences between open and closed source code.
banner: placeholder.jpg
sections:
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to describe what is meant by:
      * open source code, and
      * closed source code.

  -
  -
    title: Open and closed source code
    theme: t-bg-primary
    copy: |
      Select the images below to read an introduction on open and closed source code.

    subInc: 
      type: reveal
      content:
        -
          title: Open source code
          copy: |
            Open source code is usually stored in a public repository and shared with the public. Anyone can access it and use the code independently or contribute to the design or functionality of the project.
          img: placeholder_icon.svg
        -
          title: Closed source code
          copy: |
            Closed software (proprietary) containing closed source code is owned by commercial organisations with creators having copyright over whatever they create.
          img: placeholder_icon.svg

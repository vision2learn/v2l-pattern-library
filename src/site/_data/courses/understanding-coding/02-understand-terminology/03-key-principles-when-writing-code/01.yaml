    title: Variables
    theme: t-bg-supporting3
    copy: |
      A variable is a container of a specific type of data which has the potential to alter during the running of a program. Unlike a constant which is fixed, a variable needs to have the flexibility to change under certain conditions.

      See below to see an example of how variables can be used.
    subInc: 
      type: accordion
      content:
        - 
          title: Computer game example
          copy: |
            Thinking about this in the context of a computer game, you may have a constant in that you have 1 life or health bar for your character, however a variable would be the amount of health in that health bar. As you played the game you may lose or gain health and as you did, that variable would need to change based on what it was being told by the code, whereas the constant would need to stay the same for the game to function correctly.
            
            When a variable is introduced, this is called a “declaration”. This occurs differently in different languages. In C++, the variable type must be specified upon the declaration:

            ![](/images/banners/uc/placeholder.jpg)

            _this example will be displayed as 'actual code' text which the user can copy_

            In contrast, Python infers the data type automatically: 


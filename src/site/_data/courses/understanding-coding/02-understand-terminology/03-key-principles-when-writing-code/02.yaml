      In your assessment you will be required to describe the principles of functions.
  -
    title: Functions
    layout: media
    theme: t-bg-primary
    copy: |
      Functions or as they are sometimes referred to depending on the programming language or context in which they are being used, ‘Procedures’ or ‘Methods’, are a select grouping of individual instructions that are packaged together to achieve a specific outcome, or “function”.
      
      They often work to avoid repetition within lines of code allowing the coder to add shortcuts into their code to achieve a pre-arranged result.

    img: /images/svg/placeholder_icon.svg
  -
  -
    title: Code example
    theme:
    copy: |
      Let’s say for example you knew you would require a lot of numerical sorting throughout your code, perhaps always requiring the program to find the lowest value from a selection. Well instead of every time that requirement was needed, writing several lines of code to tell the program how to do that, you could create or use a pre-existing function, in this case, a formula to find the lowest value, that function would be written as one simple thing and any time you needed its use, you would just need to reference the function rather than the whole code.

    subInc:
      type: code
      lang: python
      highlight: 
      code: |
        # Here is our function:
        def print_lowest_and_sort(input_list):
            print(min(a_list_of_numbers))
            output_list = sorted(input_list)
            return(output_list)
        
        # Here is ......
        

    copy: |
      In your assessment you will be required to define what is meant by iterations.
  -
    title: Iterations
    theme: t-bg-supporting3
    copy: |
      Iteration in programming is the process of repeating sequential steps or instructions over and over in order to generate an intended outcome. Each repetition of the process is a single iteration, and the outcome of each iteration forms the starting point for the next one. Algorithms consist of instructions that are carried out one after another. Sometimes an algorithm needs to repeat certain steps until it is told to stop, or a desired condition has been met. Iteration allows algorithms to be simplified by making them repeat until told otherwise. Incorrect definition of an end condition will usually only cause the process to repeat on itself forming a never-ending loop though this would only ever exist within CPU cycles and shouldn’t cause a system crash. Iterations however can be large in terms of code, though are faster in terms of execution to their counterpart Recursion.

      See below to see for an example.
    subInc: 
      type: accordion
      content:
        - 
          title: A simple iteration in Python
          copy: |
            Here is a very simple iteration in Python whereby we start with a variable of value 1, then using a While loop, check whether our input_variable multiplied by 2 is greater than 15. If it is not, we add 1, to it then carry on until our input variable reaches 10, otherwise we use an ‘if’ statement and ‘break’ statement to break out of the loop and print the value of the input variable.

            ![](/images/banners/uc/placeholder.jpg)

            _this example will be displayed as 'actual code' text which the user can copy_

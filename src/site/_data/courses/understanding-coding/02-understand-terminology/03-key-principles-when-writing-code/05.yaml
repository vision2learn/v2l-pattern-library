    title: Recursions
    theme:
    copy: |
      Recursion in programming is the process of solving complex problems by breaking them down into simpler ones or smaller instances of the same problem, until we reach a base. Recursions occur when a function, module or an entity calls back to itself and is often controlled by external parameters within a stack or queue. Recursive constructs are used in several algorithms and most programming languages implement recursion by allowing a function to call itself. A recursion ends when the Base State becomes true as per the definition put in place, but if incorrectly defined can lead to an infinite loop that may cause the stack or queue to overflow and can crash the system as it balloons out of control. Recursion due to its nature however is smaller in terms of amounts of code, though due to the process is slower in execution.

      Here is a recursive function in Python. The function will take a list of integers and a threshold. If the sum of the list of integers is larger than the threshold, the list is shortened by one value (the first value – an example of First In First Out, discussed later). It then calls itself (this is the recursion) until the base state is reached. We have 2 criteria here for the base state: either (1) there are only 2 values in the remaining list, or (2) the sum of the remaining values in the list is less than the threshold.


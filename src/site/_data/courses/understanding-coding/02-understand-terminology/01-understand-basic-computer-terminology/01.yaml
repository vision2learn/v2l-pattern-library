title: Welcome to Unit 2
intro: |
  ### Understand terminology used in coding 
    
  Welcome to the second unit of your Level 2 Certificate in Understanding coding.  In this unit, you will learn about basic computer terminology in relation to coding. You will also learn about coding acronyms, terminology, and the key principles of writing code.
banner: uc_u2_s1_p1_terminology.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |

      By working through this unit, you will cover the following criteria of your Level 2 Certificate in Understanding coding qualification.

      You will:

      1. Understand basic computer terminology
      2. Understand coding acronyms and terminology
      3. Understand key principles when writing code

      [View the complete set of learning outcomes for this unit.](/pdfs/v2l_uc_learning_outcomes_u2.pdf)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |

      In this session you will learn about:
      
      * What is meant by Central Processing Unit (CPU)
      * The function of Random-Access Memory (RAM) 
      * What is meant by Data
      * The key purpose of data types used in coding 
      * Ways that data can be stored
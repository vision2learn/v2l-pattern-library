title: Coding languages used in this course
intro: |
  On this page you will learn about the three different coding languages we will be using as examples throughout this course.  Some of the features discussed on this page will also be covered later in this session.
banner: uc_u2_s1_p4_code_used.jpg
sections:
  -
    title: Examples of coding languages
    theme: t-bg-primary
    copy: |
      In the remaining sections of the course, we will be using examples of code to demonstrate the concepts we are discussing.
      
      We will use three different coding languages - select the following icons to see more:

    subInc: 
      type: reveal
      content:
        -
          title: Python3
          copy: |
            A high-level, general purpose language, mainly used for object-oriented programming, though with procedural capabilities. Due to its accessibility and versatility, one of the most popular languages, used for everything from scientific analysis, web-scraping, to program development.
          img: uc_u2_s1_p4_reveal1.svg
        -
          title: JavaScript
          copy: |
            A high-level language with objected-orientated and functional programming capabilities, one of the most-used languages for website building development and browsers.
          img: uc_u2_s1_p4_reveal2.svg
        -
          title: C++
          copy: |
            A general purpose middle-level language with objected-orientated and functional programming capabilities often implemented in desktop applications and video games.
          img: uc_u2_s1_p4_reveal3.svg
  -
  -
    title: Coding features
    theme: 
    
    copy: |
      To show how the code looks, we are going to show three general features which are common to all code in each language:
      
      1.	__Comments:__ sections of code to inform the programmer which are ignored by the program
      2.	__A variable declaration:__ variables are containers for data. A declaration is where one is introduced for the first time in a program.
      3.	__Printing an output to the console:__ a console is text interface from which inputs/outputs can be managed when a program is run. A “print” statement is a simple operation where an output is printed to the console.

      Please see in the below activity how these features differ according to each language:


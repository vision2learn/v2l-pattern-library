    title: Interactivity - 
    theme: 
    
    copy: |
      To show how the code looks, we are going to show three general features which are common to all code in each language:
      
      1.	Comments: sections of code to inform the programmer which are ignored by the program
      2.	A variable declaration: variables are containers for data. A declaration is where one is introduced for the first time in a program.
      3.	Printing an output to the console: a console is text interface from which inputs/outputs can be managed when a program is run. A “print” statement is a simple operation where an output is printed to the console.

      Please see in the below activity how these features differ according to each language:


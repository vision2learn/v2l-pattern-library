title: Coding languages used in this course
intro: |
  On this page you will learn about the three different coding languages we will be using as examples throughout this course.
banner: uc_u2_s1_p3_data.jpg
sections:
  -
    title: Examples of coding languages
    theme: t-bg-primary
    copy: |
      In the remaining sections of the course, we will be using examples of code to demonstrate the concepts we are discussing.
      
      We will use three different coding languages:

    subInc: 
      type: reveal
      content:
        -
          title: Python3
          copy: |
            A high-level, general purpose language, mainly used for object-orientated programming, though with procedural capabilities. Due to its accessibility and versatility, one of the most popular languages, used for everything from scientific analysis, web-scraping, to program development.
          img: placeholder_icon.svg
        -
          title: JavaScript
          copy: |
            A high-level language with objected-orientated and functional programming capabilities, one of the most-used languages for website building development and browsers.
          img: placeholder_icon.svg
        -
          title: C++
          copy: |
            A general purpose middle-level language with objected-orientated and functional programming capabilities often implemented in desktop applications and video games.
          img: placeholder_icon.svg

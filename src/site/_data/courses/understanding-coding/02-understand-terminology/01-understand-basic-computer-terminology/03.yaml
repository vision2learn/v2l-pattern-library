title: Data
intro: |
  On this page you will learn about data, data types used in coding, and ways that data can be stored.
banner: uc_u2_s1_p3_data.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to define the term ‘data’.
  -
    title: What is Data?
    layout: media
    theme: t-bg-primary
    copy: |
      In computing Data is information that has been translated into a form that can be read, moved and processed by the computer. Data is any collection of numbers, characters or other symbols that have been coded into a format that can be inputted into a computer and processed. On it's own data means nothing but after processing in becomes information.  The main types of data that can be inputted into a computer are numeric, text, dates, graphics and sound. Raw data is a term used to describe data in its most basic digital form. 
      
      Data is digitally written, stored, and read on physical units such as CPUs, hard drives, and RAM. Data is stored by electrical circuits on the disk which are defined by binary inputs. To create these circuits, transistors within the processing units determine which binary state (on, ‘1’s or off, ‘0’s) parts of the memory are in. We will discuss exactly how this occurs later. 

    img: /images/svg/placeholder_icon.svg
  -
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to identify the key purpose of data types used in coding.
  -
  -
    title: What is the purpose of data types in coding?
    theme: t-bg-primary
    copy: |
      Data types in computing vary and can come in all shapes and sizes. Some are used to store numbers, some are used for text and some for more complicated types of data. A data type tells a computer system how to interpret its value.
      
      Let's have a look at some of the common data types.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Integer (int)
          text: |
            This is the most common numeric data type used to store whole numbers without fractions. Some examples of int’s are: 1, 0, -5, 263

          img: placeholder_icon.svg
        -
          title: Float (or Real)
          text: |
            This is also a numeric data type used to store numbers that contain decimal points (like money) or for fractions. Float means ‘floating point’ number. Some examples of floats are: 0.3, 5.28568, -743.34854, 0.0


          img: placeholder_icon.svg
        -
          title: Character (char)
          text: |
            Is used to store a single letter, digit, punctuation mark, symbol or blank space. There are different types of blank spaces including a single space ‘ ‘, a new line character (known as a carriage), as well as tabs. Different characters specify upper/lower case characters. Some examples of chars are: y, T, @, !, 1

          img: placeholder_icon.svg
        -
          title: String (str or text)
          text: |
            Is the most common data type used to store text. It is a sequence of characters that can appear on a keyboard such as letters, numbers and symbols. Strings can contain any combination of characters: upper case, lower case, numerals, and symbols. The limit of how long a string depends on the language. Some example of strings are: Dog, sALamI, jump!, 21*&*("1

          img: placeholder_icon.svg
        -
          title: Boolean (bool)
          text: |
            It used where data is restricted to true/false or yes/no options, also using binary true (1) or false (0).  Examples of Boolean are: TRUE, FALSE or 1, 0
          img: placeholder_icon.svg

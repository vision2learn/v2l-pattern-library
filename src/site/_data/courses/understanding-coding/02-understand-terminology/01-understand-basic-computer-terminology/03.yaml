    title: Data type rules
    theme: t-bg-supporting3
    copy: |
      Different coding languages have different rules and ways of dealing with different data types. For example, when creating a string in Java from data that already exist in the memory (variables), you must use formatting specifiers to tell the program what sort of data type you are including in the string.

      | Format Specifier | Data Type| Output |
      |------|------|------|
      |text  | text | text |
      |text  | text | text |
      |text  | text | text |


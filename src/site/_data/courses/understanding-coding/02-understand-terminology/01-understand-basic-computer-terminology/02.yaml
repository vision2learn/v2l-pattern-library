    title: The function of Random-Access Memory (RAM) PLACEHOLDER
    layout: media
    theme: t-bg-primary
    copy: |
      RAM stands for random access memory which is short term memory where data is stored for use as the processor needs it. It is working memory that is used as it is needed to perform a task and is lost when a computer is turned off. This is not the same as long term memory which can be stored permanently on a hard drive and then deleted by a user or software when no longer required. 
      
      RAM is one of the most important components in determining a systems performance and gives applications a place to store and access data on a short term basis. The more programs a system runs the more RAM a system will need or it will become slow and sluggish.
      
      So what exactly does RAM do? It allows a computer to perform many of its everyday tasks such as loading applications, browsing the internet, editing a spreadsheet or playing a game. It also allows the user to swap between tasks remembering where they are at the time when they switch to another. Memory is always being used by a computer.

      RAM essentially provides a place where data can be stored/exchanged whilst it is being used by a program or process, then emptied when this has finished. This allows operations to be completed without trying to accomplish this on the hard disk, where it might cause data loss and therefore loss of function
      
      Coders need systems with enough RAM that allows them to operate whilst programming. It is not always the coding that uses up the RAM it is the other programs working in the background. Some coding languages will also use more RAM than others.



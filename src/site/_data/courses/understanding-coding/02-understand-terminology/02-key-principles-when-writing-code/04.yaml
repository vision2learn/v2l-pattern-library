  -
    title: What is meant by the term collection
    layout: media
    theme: t-bg-primary
    copy: |
      In programming, a collection represents a set of similar data type items in a single unit and these are used for grouping and managing related objects. This grouping of data items will have some shared significance to the problem being solved that need to be worked upon together. The data items will be of the same type or in the same languages.
      
      A collection has an underlying structure that is used for efficient data manipulation and storage. When collections are used in logical constructs this can help with code readability and maintenance. Examples of collections are linked lists, stacks, queues or dictionaries.

    img: /images/svg/placeholder_icon.svg

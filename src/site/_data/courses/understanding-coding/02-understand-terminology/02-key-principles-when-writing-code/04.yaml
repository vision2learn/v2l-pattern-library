  -
    title: Iterations
    theme: t-bg-primary
    copy: |
      Iteration in programming is the process of repeating sequential steps or instructions over and over in order to generate an intended outcome. Each repetition of the process is a single iteration, and the outcome of each iteration forms the starting point for the next one. Algorithms consist of instructions that are carried out one after another. Sometimes an algorithm needs to repeat certain steps until it is told to stop, or a desired condition has been met. Iteration allows algorithms to be simplified by making them repeat until told otherwise. Incorrect definition of an end condition will usually only cause the process to repeat on itself forming a never-ending loop though this would only ever exist within CPU cycles and shouldn’t cause a system crash. 
      
      In our *JavaScript example* code contains an example of iteration using a for loop. This means that we repeat an operation (in this case printing a list index to the console) for a defined number of times (in this case once for each index, starting with the first item in the list and ending with the last).


    subInc:
      type: code
      lang: js
      highlight: 
      code: |
        // Control flow: Loop (interation)

          for (let i = 0; i < list_1.length; i++) {
            console.log('List item ', i, ' = ', list_1[i])
          }
  -
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to explain what is meant by control flow.
  -
  -
    title: Control flow
    theme:
    copy: |
      Control flow is the order in which a computer executes statements in a script. 
      
      Code runs from the first line to the last unless the computer comes across structures like conditionals and loops which change the control flow. 
      
      For example say a script is used to validate user data for a webpage but if a field is left empty the script prompts them to fill it in The script uses a conditional structure so different code will be executed. Javascript amongst others includes many control structures including conditionals, loops and functions. 
      
      Control flow means that when a script is read, it must be read from start to finish, but also the program structure should be read so as to know how it affects the order of execution. 
      
      Control Flow is often represented in a graph (CFG) during the execution of programs or applications.
      
      Take a look at our *Javascript example* again and see if you can follow the control flow:


    subInc:
      type: code
      lang: js
      highlight: 
      code: |
        // Declare some variables

          var variable_1 = 25
          var variable_2 = 28
          var list_1 = [5, 2, 6, 3, 7, 2]


        // Control flow: Conditional

          if (variable_1 === variable_2){
            console.log('the variables are equal.');
          } else {
            console.log('the variables are not equal.');
          }
        
        // Control flow: Loop (interation)

          for (let i = 0; i < list_1.length; i++) {
            console.log('List item ', i, ' = ', list_1[i])
          }


        // Function

          function myFunction (input_1, input_2) {
            sum_of_inputs = input_1 + input_2
            console.log('The sum of inputs = ', sum_of_inputs);
          }


        // Control flow: Function call

          myFunction(variable_1, variable_2);
  -

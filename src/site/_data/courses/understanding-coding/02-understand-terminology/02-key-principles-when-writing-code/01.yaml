    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to explain the use of variables.
  -
  -
    title: Variables
    theme:
    copy: |
      A variable is a container of a specific _type of data_ which has the potential to alter during the running of a program. Unlike a constant which is fixed, a variable needs to have the flexibility to change under certain conditions.

      Thinking about this in the context of a computer game, you may have a constant in that you have 1 life or health bar for your character, however a variable would be the amount of health in that health bar. As you played the game you may lose or gain health and as you did, that variable would need to change based on what it was being told by the code, whereas the constant would need to stay the same for the game to function correctly.
            
      Our example code starts with some variable declarations. Can you identify what _data types_ the variables called variable_1 and variable_2?

    subInc:
      type: code
      lang: js
      highlight: 
      code: |
        // Declare some variables

          var variable_1 = 25
          var variable_2 = 28
          var list_1 = [5, 2, 6, 3, 7, 2]

  -
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to define operands/operations.
  -
    title: Operand and operator
    theme: t-bg-primary
    copy: |
      ###Operand
      An Operand is the term used to describe an object within the code that is capable of being changed or manipulated in some way.

      ###Operator
      
      An Operator is the term used to define those objects within the code that affect that change or manipulation to the Operands. This is either done as a prefix (before the operand) an infix (between operands) or a postfix (after the operands).

      So, when looked at together the Operands are the elements which the operators operate upon. In its simplest form, think, 1 + 1, in this case the ones are both Operands and the plus symbol the Operator as that is the thing that affects the two numbers to complete the sum.
      
      Take a look at a snippet of code below from our *Javascript example*, can you identify which elements are operators and which are operands?
    subInc:
      type: code
      lang: js
      highlight: 
      code: |
        sum_of_inputs = input_1 + input_2

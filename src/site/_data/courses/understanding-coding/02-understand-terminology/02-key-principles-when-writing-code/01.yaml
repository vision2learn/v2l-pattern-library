title: Understand key principles when writing code
intro: |
  In this session you will learn about what is meant by a range of terms used in writing code. To explain this section, we will use 2 short examples of code. 
banner: uc_u2_s2_p1_key_principles.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      * The use of variables
      * Define what are operands/operations
      * The principles of functions
      * The use of queues, stacks and lists
      * What is meant by the term ‘collection’ 
      * What is meant by iterations 
      * What is meant by control flow
      * What is meant by recursions
  -
  -
    title: A JavaScript example
    theme:
    copy: |
      On pages 1 to ? we are going to use a simple JavaScript program to demonstrate some of the concepts we are discussing.
      
      Take a look at our *Javascript example* below:

    subInc:
      type: code
      lang: js
      highlight: 
      code: |
        // Declare some variables

          var variable_1 = 25
          var variable_2 = 28
          var list_1 = [5, 2, 6, 3, 7, 2]


        // Control flow: Conditional

          if (variable_1 === variable_2){
            console.log('the variables are equal.');
          } else {
            console.log('the variables are not equal.');
          }
        
        // Control flow: Loop (interation)

          for (let i = 0; i < list_1.length; i++) {
            console.log('List item ', i, ' = ', list_1[i])
          }


        // Function

          function myFunction (input_1, input_2) {
            sum_of_inputs = input_1 + input_2
            console.log('The sum of inputs = ', sum_of_inputs);
          }


        // Control flow: Function call

          myFunction(variable_1, variable_2);


    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to define operands/operations.
  -
    title: Operand and operator
    theme: t-bg-supporting3
    copy: |
      
    subInc: 
      type: accordion
      content:
        - 
          title: Operand
          copy: |
            An Operand is the term used to describe an object within the code that is capable of being changed or manipulated in some way.
        - 
          title: Operator
          copy: |
            An Operator is the term used to define those objects within the code that affect that change or manipulation to the Operands.

            This is either done as a prefix (before the operand) an infix (between operands) or a postfix (after the operands).
        - 
          title: Together
          copy: |
            So, when looked at together the Operands are the elements which the operators operate upon. 
            
            In its simplest form, think, 1 + 1, in this case the ones are both Operands and the plus symbol the Operator as that is the thing that affects the two numbers to complete the sum.
  -
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to explain the use of variables.
  -
  -
    title: Variables
    theme:
    copy: |
      A variable is a container of a specific type of data which has the potential to alter during the running of a program. Unlike a constant which is fixed, a variable needs to have the flexibility to change under certain conditions.

      Thinking about this in the context of a computer game, you may have a constant in that you have 1 life or health bar for your character, however a variable would be the amount of health in that health bar. As you played the game you may lose or gain health and as you did, that variable would need to change based on what it was being told by the code, whereas the constant would need to stay the same for the game to function correctly.
            
      When a variable is introduced, this is called a “declaration”. This occurs differently in different languages. In C++, the variable type must be specified upon the declaration:

    subInc:
      type: code
      lang: cpp
      highlight: 
      code: |
        int myInt = 5;
        float myFloat = 5.65;
        char myChar = 'A string';
        bool myBool = TRUE;
  -
  -
    title: Python example
    theme:
    copy: |
      In contrast, Python infers the data type automatically:
    subInc:
      type: code
      lang: python
      highlight: 
      code: |
        myInt = 5;
        myFloat = 5.6;
        myString = 'String text';
        
        print(type(myInt))
        print(type(myFloat))
        print(type(myString))
  -
  -
    title: Result
    theme:
    copy: |
      
    subInc:
      type: code
      lang: text
      highlight: 
      code: |
        class 'int'
        class 'float'
        class 'str'

sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to describe the principles of functions.
  -
    title: Functions
    layout: media
    theme: t-bg-primary
    copy: |
      Functions, or as they are sometimes referred to depending on the programming language or context in which they are being used, ‘Procedures’ or ‘Methods’, are a select grouping of individual instructions that are packaged together to achieve a specific outcome, or “function”.
      
      They often work to avoid repetition within lines of code allowing the coder to add shortcuts into their code to achieve a pre-arranged result.

    img: /images/svg/uc/uc_u2_s2_p2_image.svg
  -
  -
    title: Function code example
    theme:
    copy: |
      Let’s say for example you knew you would require a lot of numerical sorting throughout your code, perhaps always requiring the program to find the lowest value from a selection. Well instead of every time that requirement was needed, writing several lines of code to tell the program how to do that, you could create or use a pre-existing function. 
      
      In this case, a formula to find the lowest value, that function would be written as one simple thing and any time you needed its use, you would just need to reference the function rather than the whole code.

      In our *JavaScript example* we are using a function to find the total value of two input values.  

    subInc:
      type: code
      lang: js
      highlight: 
      code: |
        // Function

          function myFunction (input_1, input_2) {
            sum_of_inputs = input_1 + input_2
            console.log('The sum of inputs = ', sum_of_inputs);
          }
    copy2: |
      What do you think will be the output of the function in the code above if input_1 is set to 7 and input_1 is set to 18? 
      
      There will be an opportunity to practice this on page 4. 


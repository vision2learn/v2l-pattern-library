    theme: t-bg-primary
    copy: |
      Whilst iterations can be fast, they can also require a lot of code. Alternatively, we can use recursion, which can simplify code. 
      
      Recursion in programming is the process of solving complex problems by breaking them down into simpler ones or smaller instances of the same problem, until we reach a base. 
      
      Recursions occur when a function, module or an entity calls back to itself and is often controlled by external parameters within a stack or queue. 
      
      Recursive constructs are used in several algorithms and most programming languages implement recursion by allowing a function to call itself. A recursion ends when the _Base State_ becomes true as per the definition put in place, but if incorrectly defined can lead to an infinite loop that may cause the stack or queue to overflow and can crash the system as it balloons out of control. 
      
      Recursion due to its nature however is smaller in terms of amounts of code, though due to the process is slower in execution.


    img: /images/svg/placeholder_icon.svg

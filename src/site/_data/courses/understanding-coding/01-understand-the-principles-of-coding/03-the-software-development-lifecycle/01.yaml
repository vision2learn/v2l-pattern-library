title: The software development lifecycle
intro: |
  In this session we will explore the software development lifecycle. You will learn about what takes place at each of the stages, from planning through to implementation and maintenance. 
banner: uc_u1_s3_p1_software_dev.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * The key stages of the software development lifecycle
      * What the different stages involve
      * The importance of planning
      * Actions that may take place during implementation
      * The importance of testing
      * Actions that may take during deployment
      * The importance of maintenance

  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to identify the key stages of the software development lifecycle (SDLC).
  -
  -
    title: The software development lifecycle
    theme: 
    
    copy: |
      The software development cycle (SDLC) also known as the software development lifecycle process, is the different stages of software development practiced in software development companies. It can be used to improve workflow and remove typical pitfalls and guide the team developing the software whilst taking into consideration timing and costs. Some companies may use different terminology but essentially it is the same process and every project will go through it.

      Let's look at the different stages involved in the following activity.


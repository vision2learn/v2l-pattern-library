title: The software development lifecycle
intro: |
  In this session we will explore the software development lifecycle. You will learn about what takes place at each of the stages, from planning through to implementation and maintenance. 
banner: placeholder.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * The key stages of the software development lifecycle
      * What the different stages involve
      * The importance of planning
      * Actions that may take place during implementation
      * The importance of testing
      * Actions that may take during deployment
      * The importance of maintenance

  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to identify the key stages of the software development lifecycle.

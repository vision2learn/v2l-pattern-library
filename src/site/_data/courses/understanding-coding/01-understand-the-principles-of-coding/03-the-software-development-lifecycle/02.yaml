    title: On the web
    theme: t-bg-secondary2 i-on-web
    include:
      type: on-the-web
      copy: |        
        Please see the following website where you can learn more information on UAT:

      links: 
        What is user acceptance testing: https://www.softwaretestinghelp.com/what-is-user-acceptance-testing-uat/
  -
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to explain the importance of the maintenance stage.
  -
  -
    title: Maintenance stage
    layout: media
    theme: t-bg-primary
    copy: |
      When the product is released, it must then be maintained. Support is often included as part of the agreement between the client and the company who actually developed the software. It is vital to ensure that the product is maintained to ensure:

      1.	To provide support when bugs or errors arise in the software.
      2.	The product keeps up with changing software compatibility and dependencies
      3.	To add extra functionality.
      4.	Possibly to adapt the software or write modules or plugins based on the users needs.

    img: /images/svg/uc/uc_u1_s3_p2_image2.svg
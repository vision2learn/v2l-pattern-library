  -
    title: Quick quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: JavaScript allows for creating dynamic features on web pages that cannot be done with only HTML and CSS.
          answer: JavaScript
        -
          sentence: C++ is a general-purpose programming language.
          answer: C++
        -
          sentence: Python is an interpreted high-level general-purpose programming language.
          answer: Python
        -
          sentence: C# is a member of the 'C' language family it shares similar logic to C++ but is regarded as easier to use.
          answer: C#
        -
          sentence: SQL stands for Structured Query Language and is used to communicate with a database. 
          answer: SQL
        -
          sentence: Scala is a popular programming language often seen as an alternative to Java.
          answer: Scala
        -
          sentence: Ruby is most often used to build websites and web applications.  
          answer: Ruby
        -
          sentence: Java is a general purpose, class based, object-oriented programming language designed for application development and has less implementation dependencies.
          answer: Java
        -
          sentence: Swift is relatively new and the language behind most modern IOS applications.
          answer: Swift
        -
          sentence: PHP is a programming language mostly used for web development. 
          answer: PHP
    theme: i-quiz

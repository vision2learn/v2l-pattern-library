    title: What is meant by Syntax?
    theme: t-bg-primary
    copy: |
      A languages surface form is known as it's syntax. In English and other spoken languages, we use the word *syntax* to describe the arrangement of words and phrases to create a well-formed sentence. 
      
      In **computer language** it is similarly used to describe the structure of ```'statements'``` made up of words and characters. It is the rules that control the structure of the symbols, punctuation, and words, that tells the computer system what to do. Each language will have its own rules that define how it should be written. If it is not written correctly in this manner, then it will not function as intended.
      
      Most programming languages are purely textual, but some languages are more graphical in nature.

      See below for some examples of syntax:
    subInc: 
      type: accordion
      content:
        - 
          title: Syntax examples
          copy: |
            Some syntax examples:
            
            *	Whether an indent is required to define blocks (Python)
            *	What characters can, cannot, or must appear in variable names (e.g. variable names cannot start with numbers in C)
            *	Opening and closing tags e.g. PHP  ```<?php and ?>```
            *	End of statement characters e.g. C#  ```;```

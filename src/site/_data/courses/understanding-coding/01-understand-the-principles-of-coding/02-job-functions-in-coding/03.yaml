    theme: t-bg-primary1a i-case-study
    copy: |
      ### Case study - How people become backend developers

      To be a backend developer, it is often a requirement to have a bachelor’s degree in computer science or another closely related field, and have often worked in a more junior role before they start. Backend developers must have a good technological skills, and are often well-versed in several different programming languages. 

      As the job involves a lot of problem solving, this job role fits someone who is methodological and enjoys logical challenges. 

      Another good reason for choosing the role is that it pays well.

      The work can be very fulfilling, and developers are constantly updating their knowledge/learning new skills. However, work often overruns outside of normal hours, or have to get taken home because of problems which arise as you are working/do not get resolved before the end of the work day.

      Please see the below interview to learn more about this role.

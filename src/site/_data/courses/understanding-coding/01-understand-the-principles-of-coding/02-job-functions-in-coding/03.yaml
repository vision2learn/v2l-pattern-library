  -
    title: Quick quiz
    copy: See if you can identify the different coding roles in the following questions.
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Front end developers combine technology and design to create inviting, easy-to-use websites.
          answer: Front end developers
        -
          sentence: Game developers turns ideas into code and is involved in coding, programming, audio, design, production and visual arts.
          answer: Game developers
        -
          sentence: AI programmers helps develop operating software that can be used for robots and artificial intelligence applications.
          answer: AI programmers
        -
          sentence: Back end developers are the programmers focused mainly on developing logic and data layers, they deal with databases and/or storage solutions that connect to the functionality of the front end.
          answer: Back end developers
        -
          sentence: Mobile app developers uses programming languages and development skills to create, test, and develop applications on hand-held devices.
          answer: Mobile app developers
    theme: i-quiz
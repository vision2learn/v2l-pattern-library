  -
    title: Quick quiz
    copy: See if you can identify the key skills a coding professional would have in the following questions.
    subInc: 
      type: word-quiz
      content:
        -
          sentence: example one - positive attitude
          answer: positive attitude
        -
          sentence: Communication is important as Coders are often required to write code so that others including other coders will be able to understand and maintain it. 
          answer: Communication
        -
          sentence: Most developers are part of a team and should be able to share their ideas and support the ideas of others. 
          answer: team
        -
          sentence: Time management is essential for a coding professional not getting distracted from the task at hand knowing what is needed and being able to stick to deadlines and produce high quality work consistently. 
          answer: Time management
        -
          sentence: Problem solving is important as being able to brake down a problem into its component parts the finding a solution is a vital skill.
          answer: Problem solving
        -
          sentence: A programmer has to be able to motivate themselves to stick to it even when things go wrong. 
          answer: motivate
        -
          sentence: Coders need to draw analytical conclusions from things that may on the surface seem straightforward. 
          answer: analytical
    theme: i-quiz
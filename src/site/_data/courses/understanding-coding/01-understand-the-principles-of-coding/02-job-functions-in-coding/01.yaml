    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * The key job functions of a coding professional 
      * The key skills requirements for a coding professional 
      * Why project management skills are important in coding 
      * Different roles within a coding team
      * Why team working is important in coding
      * Different careers and career progression available

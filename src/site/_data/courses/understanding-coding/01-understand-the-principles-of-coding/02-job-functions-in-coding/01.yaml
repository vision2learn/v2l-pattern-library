    title: Interactivity - Job functions
    theme: 
    
    copy: |
      ### What are the key job functions of a coding professional?

      Coding professionals are always in demand and programming is one of the most important roles in the fast growing technical industries. There are many different types of coding professionals and each will specialise in a different areas using different languages.
      
      Let's look at what it takes to be a coding professional and what key skills are needed.




      _Interactivity will show in a space below_


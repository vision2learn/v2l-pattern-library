    title: Quick quiz
    copy: See if you can dentify some of the Software development team / coding team roles in the following questions.
    subInc: 
      type: word-quiz
      content:
        -
          sentence: The Project Manager is responsible for budgets, risk, scheduling and contract management. 
          answer: Project Manager
        -
          sentence: The Product Owner is more or less analysts and concentrate on a product and it's features.
          answer: Product Owner
        -
          sentence: Developer roles include Full Stack, Back End, and Front End.  They specialise in different areas of programming and create the environments that make programs and websites possible.
          answer: Developer
        -
          sentence: Quality roles are....
          answer: Quality
        -
          sentence: Testers are responsible for conducting manual tests doing system verification. 
          answer: Testers
        -
          sentence: UI and UX Designers are responsible for preparing designing the user interface, and for the users experience analysing user behaviour.
          answer: UI and UX Designers
    theme: i-quiz
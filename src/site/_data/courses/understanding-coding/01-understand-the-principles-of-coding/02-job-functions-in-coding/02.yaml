    copy: |
      _Presentation style - Presenter with text to the side for each role, imagery to support._
      
      ### Coding Teams, Project Development, and team working

      Some large organisations may have their own coding teams or use freelancers many may outsource a project to a development team working remotely. In software development there are a range of different methodologies which are used to make sure a project is resilient and on time and budget. They allow for feedback and ideas which can subsequently improve quality.

      Let's look at some software development team/coding team roles and why team working is important in coding in the following video.
    video: placeholder_pc.mp4

    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to explain why project management skills are important in coding.
  -
    title: Project management
    theme: t-bg-primary
    copy: |
      One of the really important skills for a coding professional is project management. Scroll through the slides below to learn more.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Skills
          text: |
            Project management skills include being organised, having the ability to stay cool under pressure,  being adaptable, able to solve problems and being able to communicate well to others or those in their team. These are all skills that should also be inherent in a coding professional as they directly link to their work role as we have already discussed.
      
            Many of the skills in coding transfer across to project management and visa versa.
            
            Most coding and programming professionals will have knowledge of project management as they  are accustomed to working with digital tools, clients, teams and competing deadlines.
          img: placeholder_icon.svg
        -
          title: Processess
          text: |
            Many organisational and workflow methodologies of project management also follow the process of software development.
      
            Whether working on the development of a new app or creating a new operating system the same steps will be followed. 
            PRODUCE. TEST. OPTIMISE. REPEAT.  
            
            Programmers will be fully aware and used to this process and this includes to imagining and designing a website where the same kinds of production cycles will be used.
          img: placeholder_icon.svg

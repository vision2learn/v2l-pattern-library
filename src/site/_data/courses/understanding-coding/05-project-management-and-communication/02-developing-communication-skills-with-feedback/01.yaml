title: Developing communication skills with feedback
intro: |
  In this session you will learn about the purpose of feedback in developing communication skills.
banner: placeholder.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * Ways of seeking feedback on communications
      * The purpose using feedback to develop communication skills
      * What is meant by productive feedback
  -
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to describe ways of seeking feedback on communications.
  -
    title: Seeking feedback
    layout: media
    theme: t-bg-primary
    copy: |
      Feedback is a part of how we work and is an important part of communication. It can be a simple comment or a detailed and structured discussion on how and what we communicate to each other. Feedback may seem a little intimidating at first as it may involve criticism, but it can also help to develop skills and offer opportunities to learn from others. Especially when it is presented in a positive and supporting manner.


    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        Think of a situation that would require feedback and ask yourself the following questions:
        * What do we want from the feedback?
        * Who do we seek it from?
        * What are our requirements from the feedback?

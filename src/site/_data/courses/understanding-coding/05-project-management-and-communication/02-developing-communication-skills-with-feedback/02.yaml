title: Productive feedback
intro: |
  On this page we will look at productive feedback, and feedback in Agile and the Scrum framework.
banner: placeholder.jpg
sections:
  -
    title: Productive feedback
    theme: t-bg-primary
    copy: |
      Select the images below to read about ways of giving productive feedback.

    subInc: 
      type: reveal
      content:
        -
          title: Safety
          copy: |
            Add civility and safety into feedback approach – most people need to feel comfortable when receiving feedback for it to be productive.
          img: placeholder_icon.svg
        -
          title: Positive
          copy: |
            Try to keep your feedback positive even when giving ‘negative or corrective’ feedback - follow ‘corrective’ feedback with a solution suggestion.
          img: placeholder_icon.svg
        -
          title: Specific
          copy: |
            Try to be specific and positive rather than be too general as that could be interpreted in different ways depending on the persons point of view.
          img: placeholder_icon.svg
        -
          title: Immediate
          copy: |
            Give feedback frequently and at the same time as for the action it is needed.
          img: placeholder_icon.svg
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to explain what is meant by productive feedback.
  -
    title: Feedback in Agile and the Scrum framework
    theme: t-bg-primary
    copy: |
      Scroll through the slides below to learn more about where productive feedback is used in Agile development and the Scrum framework.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Feedback in the 'Sprint Review'
          text: |
            The sprint ‘Review’ is where a demonstration of the product is given to the wider team and stakeholders in a meeting at the end of a sprint. This is one of the main areas of the Scrum framework where feedback is given and is important.  
            
            The review Feedback is encouraged and helps the team to determine: if the product is meeting set criteria, fit for purpose, and for identification of areas of change or improvement.
          img: placeholder_icon.svg
        -
          title: Feedback in the 'Sprint Retrospective'
          text: |
            The Retrospective is another aspect of Scrum where feedback is important – it is feedback from the current sprint in as what went right, what went wrong, learnings,  and actions.  It is a safe space for sharing – one common term is ‘what is said in the Retro stays in the retro’ – so there is no blame, judgements, or blatant negativity and it is advised that things are kept light but focused.  

            One of the biggest benefits of working in Agile is ‘continuous improvement’, and in Scrum - the driver of improvement is the ‘Retrospective’.

            We will be taking a much more detailed look at Agile development and the Scrum framework in Session 4.

          img: placeholder_icon.svg

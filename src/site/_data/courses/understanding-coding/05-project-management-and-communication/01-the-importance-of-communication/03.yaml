  -
  -
    title: Methods of active listening
    theme: t-bg-primary
    copy: |
      So how can someone become an active listener?

    subInc: 
      type: reveal
      content:
        -
          title: Undivided attention
          copy: |
            To become a more active listener a person must give the speaker their undivided attention and acknowledge the fact that they are listening by non-verbal communication. 
          img: placeholder_icon.svg
        -
          title: Look directly at the speaker
          copy: |
            It helps to look directly at the speaker and put aside any distracting thoughts. 
          img: placeholder_icon.svg
        -
          title: Body language
          copy: |
            Using body language and responding using expressions can show can help to show engagement. 
          img: placeholder_icon.svg
        -
          title: Questions and paraphrasing
          copy: |
            Asking questions and paraphrasing can also help to show that the listener understands.
          img: placeholder_icon.svg
        -
          title: Allow speaker to finish
          copy: |
            Allowing the speaker to finish before making judgements also makes sure that the message and information is fully absorbed.
          img: placeholder_icon.svg
        -
          title: Responding respectfully
          copy: |
            Being respectful in any responses is also an important part of being an active listener.
          img: placeholder_icon.svg

  -
  -
    title: Release notes
    layout: media
    theme: t-bg-primary
    copy: |
      Release notes are a good way of software companies communicating with customers about improvements and new features. A release note refers to the technical documentation which accompanies a new software release or update and communicates information on recent changes, feature enhancements or bug fixes or describes a new product. 
      
      The primary target for release notes is the product user, but they can also be used internally within a company.
      
      Release notes can be distributed through a range of channels such as email, app stores, blog posts, social media or in app messaging.

    img: /images/svg/uc/uc_u5_s1_p4_image.svg

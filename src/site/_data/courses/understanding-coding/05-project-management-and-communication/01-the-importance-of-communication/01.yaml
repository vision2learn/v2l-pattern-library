title: Welcome to Unit 5
intro: |
    ### Understand the importance of communication and project management in coding
    
    Welcome to the fifth unit of your Level 2 Certificate in Understanding coding.  In this unit you will learn about the importance of communication for those working in a coding environment. You will also learn about project management principles and Agile developments. 

banner: placeholder.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit, you will cover the following criteria of your Level 2 Certificate in Understanding coding qualification.

      You will:

      1. Understand the importance of communication
      2. Understand the purpose of feedback in developing communication skills
      3. Understand the principles of project management
      4. Understand Agile developments

      [View the complete set of learning outcomes for this unit.](/pdfs/)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      
      * The importance of communication
      * Different methods of communication and when to use them
      * Adapting communication for different audiences
      * Active listening and the methods involved
      * Ways of verbally presenting information and ideas clearly
      * How release notes are used to communicate information to others

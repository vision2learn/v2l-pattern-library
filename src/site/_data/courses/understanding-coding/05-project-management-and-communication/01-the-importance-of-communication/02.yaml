  -
  -
    title: Quick quiz
    copy: 
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Verbal communication involves speaking with others it may be face-to face, over the telephone or via digital media and the internet. 
          answer: Verbal
        -
          sentence: Informal communication is based on personal interactions and relationships. It can be unstructured and unplanned.
          answer: Informal
        -
          sentence: Written communication can traditionally be in the form of a letter but often now involves emails, texts, memos, reports, Tweets, reports, contracts etc.
          answer: Written
        -
          sentence: Visual communication is all around us from posters and ads on a wall to images on a TV screen. 
          answer: Visual
        -
          sentence: Non-verbal communication includes facial expressions, posture, eye contact, hand movements and touch and can be used on its own or alongside verbal communication. 
          answer: Non-verbal
        -
          sentence: Formal communication is the flow of information through formal channels and can be verbal or written. 
          answer: Formal
    theme: i-quiz
title: Understand the importance of communication
intro: |
  In this session you will learn about the importance of communication and methods used to communicate to different audiences.
banner: uc_u5_s1_p2_communication.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to explain the importance of communication.
  -
  -
    title: The importance of communication
    theme: t-bg-primary
    copy: |
      Communication involves passing information from one person to another and in turn understanding that information. Communication skills are a necessary part of life and are required both in the workplace and in personal interactions. 
    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Communicating in business
          text: |
            In all businesses we spend our days communicating verbally, non-verbally and in written form by various methods such as by emails, meetings, conference calls, creating and sending reports, giving presentations, and by general face to face discussion. To do this effectively we need to make sure that our communication is clear, concise and accurate.

          img: uc_u5_s1_p2_slide1.svg
        -
          title: Why communication is important in a coding environment
          text: |
            The skill of communication is important in coding and programming as often the information that needs to be communicated is highly technical and not everyone involved in the process has the same technical knowledge or may be conversant with the terminology and coding languages used. 
          img: uc_u5_s1_p2_slide2.svg
        -
          title: Importance of effective communication when working in a team
          text: |
            Clear, concise communication is fundamental to the success of project management and those working in a coding environment as it is essential that teams collaborate effectively when striving to achieve successful results. Poor communication can lead to unnecessary costs to put things right.
          img: uc_u5_s1_p2_slide3.svg

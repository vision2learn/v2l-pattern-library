  -
    title: Quick quiz
    copy: 
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Agile has an iterative approach which makes it possible for the customer feedback to be taken into consideration.
          answer: customer feedback
        -
          sentence: Development tasks are broken down into bite size chunks, which can be achieved in a certain period.
          answer: Development tasks
        -
          sentence: Agile is people-oriented and result-focused in respect to software delivery.
          answer: people-oriented
        -
          sentence: Instead of delivering all the product at the end of the project, the software is built incrementally from the start in time-boxed 'sprints'. 
          answer: incrementally
    theme: i-quiz
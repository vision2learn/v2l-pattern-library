title: Agile developments
intro: |
  In this session you will learn about Agile developments, their advantages and disadvantages and the Scrum framework.  On this page we will take a closer look at Agile development.
banner: uc_u5_s4_p1_agile_developments.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * What is meant by an Agile development
      * Key characteristics of an Agile development
      * Advantages and disadvantages of an Agile development
      * What is meant by Scrum
      * The roles of: Product Owner, Scrum Master, Scrum team
      * Different Scrum events
  -
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to:
      * define what is meant by an Agile development
      * identify the key characteristics of an Agile development
      * identify the advantages and disadvantages of an Agile development
  -
  -
    title: Agile development
    theme: 
    copy: |
      Agile is an iterative, people-oriented and result-focused way of working when delivering software products. The software is built incrementally in time-boxed 'sprints'.
            
      ![](/images/svg/uc/uc_u5_s4_p1_wide_image.svg)

  -
  -
    title: Scrum roles
    theme: t-bg-primary
    copy: |
      Scroll through the slides below to learn more about the roles within a scrum team.
    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Product Owner
          text: |
            The Product Owner manages the Product Backlog and optimises the value of the Product.  They would have direct relationships with the Business Owner and the Stakeholders.  Before the Planning meeting can take place, the Product Owner would need to determine the priority tasks and decide the sprint goal.  The set of tasks that a product owner does is often referred to as product ownership.
          img: uc_u5_s4_p2_slide1.svg
        -
          title: Scrum Master
          text: |
            The Scrum Master manages the Scrum Process and remove impediments.  The Scrum Master would predominately manage the Planning meeting taking into consideration priority, capacity, and the wider business expectations.  
            
            They would ensure the agile values and principles are followed by clearing obstacles, support team effectiveness, address team dynamics, support good relationships between the team and others, and protect the team from outside interruptions and distractions. 

          img: uc_u5_s4_p2_slide2.svg
        -
          title: The Scrum team
          text: |
            The Scrum Team (also known as the Scrum Development Team) organises and manages its own work.  They would deliver the agreed product increment inside a sprint. The team would consist of different skillsets and abilities needed to deliver the product which would likely to include programming, designing, testing, content writing, and/or business skills depending on the project.
          img: uc_u5_s4_p2_slide3.svg

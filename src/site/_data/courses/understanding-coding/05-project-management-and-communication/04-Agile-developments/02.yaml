    theme: 
    
    copy: |
      Benefits of using Scrum:
      * Quick & easy to adapt
      * Continuous learning cycle
      * Enables fast feedback loop
      * Focused on delivering value
      * Clear visibility & low risk
      * Protects the team from un-prioritised work requests


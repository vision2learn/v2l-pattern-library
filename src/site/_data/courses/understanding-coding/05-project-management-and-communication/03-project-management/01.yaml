  -
    title: What is project management?
    theme: t-bg-primary
    copy: |
      Project management involves the application of processes, skills, knowledge, and experience used together to achieve specific project objectives according to agreed guidelines and parameters which fit in with a specific timescale and budget. The skills that are often involved in project management are technical skills, people management skills and good business awareness. 
      
      Project management involves a project manager and a team around them to initiate and carry out the project according to the needs of the client or stakeholders.
      
      Project management can also be split into five key stages: 
    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Initiating
          text: |
            This is the process of visualising what is to be accomplished and the initial ideas identified with the client and or stakeholders.
          img: placeholder_icon.svg
        -
          title: Planning
          text: |
            This is the basis of the project activity cycle where plans are documented for the development and execution of the project, and a schedule created. Plans are also drawn up to manage timing, costs, and risks and related issues.
          img: placeholder_icon.svg
        -
          title: Executing
          text: |
            This is also known as the implementation stage where plans are put into action. This is normally the longest stage of the process of project management and when any unexpected events will have to be dealt with by the team involved.
          img: placeholder_icon.svg
        -
          title: Monitoring and control
          text: |
            This process oversees all tasks to guarantee that the project keeps to plan and follows timing and budget guidelines.
          img: placeholder_icon.svg
        -
          title: Closing
          text: |
            This is the last process of the project activity cycle and a report is created to review the overall success of the project and delivery of the desired outcome to the client or stakeholders.
          img: placeholder_icon.svg

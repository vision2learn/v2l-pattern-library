  -
    title: Triple constraint
    layout: media
    theme: t-bg-primary
    copy: |
      Triple constraint is a model that describes the three most significant restrictions on any project and is often called the project management triangle. The sides of the triangle are Scope, Schedule and Cost and quality sits in the middle. 
      
      These three constraints are interdependent, and none can be altered without affecting one or both others:
      * __Scope__ - It’s important to define project goals and requirements before work begins.
      * __Schedule__ - A detailed scope document defines the schedule and project deadline.
      * __Cost__ - Time spent affects budget along with other resource costs.

    img: /images/svg/uc/uc_u5_s3_p2_image1.svg

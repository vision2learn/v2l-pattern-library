    title: What is Lean project management?
    theme: t-bg-primary
    copy: |
      ‘Lean’ originated as part of manufacturing practices but has now transformed the areas of knowledge and management. 
      
      The five principles of Lean are: 

    subInc: 
      type: reveal
      content:
        -
          title: Defining value
          copy: |
            This is what the customer is willing to pay for. What they need and what they can afford to pay.
          img: uc_u5_s3_p2_reveal1.svg
        -
          title: Mapping the value stream
          copy: |

title: Coding types
intro: |
  On this page you will learn about functional coding, object-orientated coding, and other coding types.  This page gives examples of some new programming paradigms with their key features and whether or not they follow a mainly imperative or declarative paradigm.
banner: uc_u3_s1_p3_coding_types_b.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to define:
      * Define what is meant by functional coding
      * Define what is meant by object-orientated coding
      * Identify other coding types
  -
  -
    title: Coding types
    theme: t-bg-primary
    copy: |
      Scroll through the slides below to learn more about the different types of coding.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Functional coding
          text: |
            A type of declarative paradigm composed of functions which have no effect on variables which are not part of the function. 

            As a declarative language, it focuses on “what to solve” rather than the imperative “how to solve”, through the use of expressions, rather than statements.
            
            A key point is that functions take in EXISTING inputs (values, data structures, or functions) and return NEW values or data structures.

          img: uc_u3_s1_p3_slide1.svg
        -
          title: Object-orientated coding
          text: |
            Object-orientated programming (OOP) is a type of imperative programming. 

            What distinguishes OOP is that it focuses on “objects” (a collection of data and functions) which change state, rather than actions which operate on separate pools of data.

            Commonly, the objects are “classes”. These are data structures definitions which contain inbuilt data and class-specific functions (known as methods).  _We will be looking at Classes later on in Unit 4._

          img: uc_u3_s1_p3_slide2.svg
        -
          title: Procedural code
          text: |
            As previously described, type of imperative language. Composed of a set of procedures that run in a pre-determined order.
          img: uc_u3_s1_p3_slide3.svg
        -
          title: Logic programming
          text: |
            A type of declarative paradigm based on formal logic. Rules and details are based on mathematical system of reasoning.
          img: uc_u3_s1_p3_slide4.svg
        -
          title: Parallel process
          text: |
            A type of imperative paradigm. It allows processes to run concurrently rather than in sequence (sequential programming) like more fundamental paradigms.
          img: uc_u3_s1_p3_slide5.svg
        -
          title: Database processing approach
          text: |
            Database processing approach is declarative. Users can create and edit database systems using declarative control statements. They can also make queries to retrieve results matching specific criteria.
          img: uc_u3_s1_p3_slide6.svg
        -
          title: Event-driven programming
          text: |
            Technically both imperative and declarative languages support this approach. This is where the control flow of a program is determined by events (such as change in value of a variable) which determine the subsequent processes.
          img: uc_u3_s1_p3_slide7.svg
  -

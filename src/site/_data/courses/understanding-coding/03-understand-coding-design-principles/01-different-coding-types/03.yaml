      ### Code type - advantages and disadvantages

      Let's take a look at the advantages and disadvantages of each code type in the following video.
    video: placeholder_pc.mp4
  -
  -
    title: Quick quiz
    copy: See if you can identify the advantages of code types in the following questions.
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Object Oriented Programming is very mature and professionally appreciated, and is good for making sophisticated software.
          answer: Object Oriented
        -
          sentence: Functional coding is easy to debug - as there are no side effects or hidden inputs/outputs.
          answer: Functional
        -
          sentence: Imperative coding is a relatively simple concept, and it simplifies code by reusing code sections.
          answer: Imperative
        -
          sentence: Procedural coding is easy to track the flow of a program and it is also easy to implement, debug and adapt. 
          answer: Procedural
        -
          sentence: Logic programming is a rather high level of coding which has good memory management being fast and efficient. 
          answer: Logic
        -
          sentence: Parallel processing is more efficient than with sequential programming as it reaches the outcome quicker.
          answer: Parallel
    theme: i-quiz

title: Welcome to Unit 3
intro: |
  ### Understand coding design principles 
    
  Welcome to the third unit of your Level 2 Certificate in Understanding coding.  In this unit you will learn about different coding types and the advantages and disadvantages of their use. You will also learn about pure functions. 
banner: placeholder.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |

      By working through this unit, you will cover the following criteria of your Level 2 Certificate in Understanding coding qualification.

      You will:

      1. Know about different coding types 
      2. Understand what is meant by compiled and interpreted code
      3. Understand what is meant by a pure function

      [View the complete set of learning outcomes for this unit.](/pdfs/)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |

      In this session you will learn about:
      
      * What is meant by imperative coding 
      * What is meant by declarative coding 
      * What is meant by functional coding 
      * What is meant by object-orientated coding 
      * Identifying other coding types 
      * The advantages and disadvantages of functional, object-orientated and other coding types 

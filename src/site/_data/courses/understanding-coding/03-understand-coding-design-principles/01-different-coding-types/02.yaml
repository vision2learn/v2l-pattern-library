title: Know about different coding types
intro: |
  In this session you will learn about the different coding types, on this page we will take a look at imperative and declarative coding.
banner: placeholder.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to define what is meant by imperative coding and declarative coding.
  -
    title: Programming paradigms
    layout: media
    theme: t-bg-primary
    copy: |
      To choose what language to code in, programmers must assess how a language works in relation to what they want to achieve. Different programming languages have different rules, strategies, and principles which govern how they work. We refer to this as its “programming paradigm”. Whilst there are many paradigms, which can overlap, most fall in to one of two main fundamental paradigms: Imperative or Declarative. 
      
      There are many different categories and mixtures of imperative/declarative programming. When programming language has capabilities of more than one paradigm, we refer to this as multi-paradigm.


    img: /images/svg/placeholder_icon.svg
  -
  -
    title: Imperative and declarative coding
    theme: t-bg-supporting3
    copy: |
      
      Select the images below.

    subInc: 
      type: reveal
      content:
        -
          title: Imperative coding
          copy: |
            Imperative coding is the oldest programming paradigm and focuses on exactly HOW a computer should achieve the desired result. The source code of imperative languages consists of a series of commands or step by step instructions detailing the control flow for how to deliver the desired result. 
          img: placeholder_icon.svg
        -
          title: Declarative coding
          copy: |
            In Declarative programming, the focus is on WHAT the desired result is that is needed from the computer. The source code is more abstracted from the underlying operations than with imperative coding. To get a solution, the program will automatically identify and apply appropriate methods which are written into the language in order to achieve the result expressed by the declarative code.
          img: placeholder_icon.svg

title: Know about different coding types
intro: |
  In this session you will learn about the different coding types, on this page we will take a look at imperative and declarative coding.
banner: uc_u3_s1_p2_different_coding_c.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to define what is meant by imperative coding and declarative coding.
  -
    title: Programming paradigms
    layout: media
    theme: t-bg-primary
    copy: |
      To choose what language to code in, programmers must assess how a language works in relation to what they want to achieve. Different programming languages have different rules, strategies, and principles which govern how they work. We refer to this as its “programming paradigm”. Whilst there are many paradigms, which can overlap, most fall in to one of two main fundamental paradigms: Imperative or Declarative. 
      
      There are many different categories and mixtures of imperative/declarative programming. When programming language has capabilities of more than one paradigm, we refer to this as multi-paradigm.


    img: /images/svg/uc/uc_u3_s1_p2_image.svg
  -
  -
    title: Imperative and declarative coding
    theme: t-bg-supporting3
    copy: |
      Scroll through the slides below to learn about imperative and declarative coding.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Imperative coding
          text: |
            Imperative coding is the oldest programming paradigm and focuses on exactly HOW a computer should achieve the desired result. 
            
            The source code of imperative languages consists of a series of commands, or step by step instructions, detailing the control flow for how to deliver the desired result.
          img: uc_u3_s1_p2_slide1.svg
        -
          title: Declarative coding
          text: |
            In Declarative programming, the focus is on WHAT the desired result is that is needed from the computer. 
            
            Rather than describing the underlying operations, the source code of declarative languages read more like human language where top-level instructions are given. 
            
            To get a solution, the program will automatically identify and apply suitable methods which are written into the language, in order to achieve the result expressed by the declarative code.
          img: uc_u3_s1_p2_slide2.svg

    subInc: 
      type: word-quiz
      content:
        -
          sentence: Imperative statements are grouped into sections which are called procedures. 
          answer: Imperative
        -
          sentence: Most forms of Declarative programming do not support change to the ‘State’ of a program.
          answer: Declarative
        -
          sentence: Imperative coding or programming can directly change the ‘State’ of the program through statements which provide instructions.
          answer: Imperative
        -
          sentence: The programs in Declarative programming are run based on a series of ‘expressions’ which specify exactly WHAT the program should accomplish, rather than HOW it does it.
          answer: Declarative

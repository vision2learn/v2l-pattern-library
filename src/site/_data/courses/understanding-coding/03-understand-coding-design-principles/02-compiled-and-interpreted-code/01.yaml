  -
    title: Source code and Machine code
    theme: t-bg-primary
    copy: |
      To understand this session, we first need to understand what machine code and source code are.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Source code
          text: |
            Source code is human-readable text written in a specific programming language. This is the part the human interacts with and uses to generate a program. It is composed of a set of functions and syntax rules that the user can enter in the main language to get it to do something. The code sections in Unit 2 are examples of source code.
          img: uc_u3_s2_p1_slide1.svg
        -
          title: Machine code
          text: |
            Machine code is binary (1's and 0's) code that can be executed directly by the CPU. This is not edited directly by the programmer and the source code of a program must be translated to machine code to control the hardware. To a human, it might look a bit like the green text in the film “the Matrix”.
          img: uc_u3_s2_p1_slide2.svg
  -

  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      * What is ‘pure function’ 
      * What is ‘impure function’ 
      * Potential dependencies/needs in pure function
      * The benefits of pure function 
      * What is parallelisation 
      * How parallelisation is managed 

  -
  -
    title: Terminology
    layout: media
    theme: t-bg-primary
    copy: |
      To understand pure functions, it is helpful to understand some terminology.
      * __Local variable__: when a variable is only held in memory INSIDE a of a function, this is called a LOCAL variable.
      * __Global variable__: a GLOBAL variable is a variable which is held in memory OUTSIDE of a function.
      * __Scope__: this refers to the name of an entity in the code, such as a variable, and where in the code that name can be used. For example a variable would be considered 'out of scope' if it was called and no longer in the memory.
      * __Side effects__: this is when a function changes a variable which is not one of the output variables of the function. For example, changing a global variable from within a function.

    img: /images/svg/uc/uc_u3_s3_p1_image.svg
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to define the term:
      * pure function,
      * impure function.
  -
    title: Pure and impure functions
    theme: t-bg-primary
    copy: |
      The capabilities, restrictions, and efficiency of programs depends on how they are written. Using different paradigms and coding styles, we can incorporate specific characteristics that we want from our program. For example, by using pure functions, it is easier to achieve parallelisation. Here we discuss ‘pure’ and ‘impure’ functions, and their benefits.

    subInc: 
      type: reveal
      content:
        -
          title: Pure functions
          copy: |
            1.	They always give the same return value for a given input
            2.	They do not change anything unrelated to the function (no side effects)
            3.	They do not modify any arguments which are passed to them 

          img: uc_u3_s3_p1_reveal1.svg
        -
          title: Impure functions
          copy: |
            An impure function is essentially a function that violates the criteria for a pure function. For example, this could be a function which changes a variable which is being held in the memory OUTSIDE of a function call which is not one of the output variables.
          img: uc_u3_s3_p1_reveal2.svg
  -
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to:
      * identify potential dependencies/needs in pure function,
      * explain the benefits of pure function.
  -
  -
    title: Potential dependencies / needs in pure function
    theme:
    copy: |
      Pure functions are not dependent on global variables. The output only depends on the input values, and the computation that occurs INSIDE the function. They hold no internal state between calls. This guarantees that a given function ALWAYS returns the same results for a given set of inputs.

      Pure functions have no side effects. They also do not change the input variable(s). They therefore only have local effects (e.g. whatever action the function is called to perform), or only change the output variables.

      If the function is dependent on a global variable that changes between function calls, the exact same inputs could return a different value. This violates our rule 1 above (same input for same output), as is illustrated in the following Python code:

    subInc:
      type: code
      lang: python
      highlight: 
      code: |
        # Define a pure function
        def pure_function(input_a, input_b):
            # Define a local variable (cannot be changed outside of function)
            loc_x = 3
            output = ((input_a/input_b) + loc_x)
            print('Pure output =', output)
            return 

        # Call the pure function
        pure_function(8, 2)

        # Define an impure function
        def impure_function(input_a, input_b):
          
            # The global variable defined below is called here
            global glob_x
            
            output = ((input_a/input_b) + glob_x)
          print('Impure output =', output)
          return 

        # Define a global variable then set its value
        global glob_x
        glob_x = 3

        # Call the impure function
        impure_function(8, 2)

        # Change the value of the global variable
        glob_x = 6

        # Then call the impure function again with exactly the same inputs
        impure_function(8, 2)
  -
    title: Result
    theme:
    copy:

    subInc:
      type: code
      lang: text
      highlight: 
      code: |
        Pure output = 7.0
        Impure output = 7.0
        Impure output = 10.0
        [Finished in 139ms]
    copy2: |
      Note: in Python, indents at the start of the line indicate blocks of codes. The indents below the line in which the function is defined using ‘def’ indicate that they are within the function. The code runs from the top to the bottom.
      
      With exactly the same inputs, the impure function gives a different result the second time.

      This is because the calculation in our impure function is dependent on the global variable 'glob_x', which can be changed EXTERNALLY to the function.

      However, in our pure function, the factor ‘loc_x’ is determined INTERNALLY in the function. It therefore cannot be changed from outside.

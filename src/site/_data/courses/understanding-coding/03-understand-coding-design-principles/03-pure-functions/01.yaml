  -
    title: The benefits of pure functions
    theme: t-bg-primary
    copy: |
      There are a number of benefits of functional and practical benefits to using pure functions.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Readability
          text: |
            Easier to read as they are self-contained, so all inputs and dependencies are provided within the function. To understand the function, you do not have to look through the code for variables which are affected by the function call like you might with an impure function. 
          img: placeholder_icon.svg
        -
          title: Reusability
          text: |
            The same function can be used in different contexts as it only depends on what occurs inside the function. In contrast, you might have to write a separate impure functions for each global variable that is changed, rather than relying on pure functions which do not access these.
          img: placeholder_icon.svg
        -
          title: Testing
          text: |
            Pure functions have no side effects, making them much easier to test. We only need to check the state of internal variables, not global variables. 
          img: placeholder_icon.svg
        -
          title: Referential transparency
          text: |
            This is where you can replace a function call with whatever the corresponding output value would be without changing the behaviour of a program. This compiles faster and helps readability.
          img: placeholder_icon.svg
        -
          title: Caching
          text: |
            This is where results of functions are stored and so only need to be calculated once. As pure functions’ outputs are always constant, caching is possible with pure functions.
          img: placeholder_icon.svg
        -
          title: Parallelisation
          text: |
            This is where results of functions are stored and so only need to be calculated once. As pure functions’ outputs are always constant, caching is possible with pure functions.
          img: placeholder_icon.svg


    title: Parallelisation
    theme: t-bg-primary
    copy: |
      Pure functions allow multiple threads working on the same function simultaneously as they do not rely on external variables. This can massively increase the speed at which a program can be executed.
  -
  -
    title: Parallelisation and how is it managed
    theme: 
    copy: |
      Pure functions are particularly useful when you want to implement parallel processing. Parallel processing is a way of allocating processes that are happening in a program so that they can make the most use of the computational resources available. It differs from sequential (typical) programs in that it allows multiple processes to occur at once. 


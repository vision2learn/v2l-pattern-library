    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to:
      * define what is meant by the single responsibility principle,
      * describe what is meant by separation of concerns,
      * define what is meant by abstraction.
  -
    title: Principles relating to best practice

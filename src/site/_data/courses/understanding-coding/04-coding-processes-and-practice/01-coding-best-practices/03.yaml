  -
    title: Introduction to Classes and Modulation
    theme: t-bg-supporting3
    copy: |
      Let’s look at some more principles related to best practice in coding. For this, we need to further understand some programming concepts. 

      See below to learn more.
    subInc: 
      type: accordion
      content:
        - 
          title: Classes
          copy: |
            Classes are the main feature of object oriented programming languages, and generally they constitute the main ‘object’. 
            
            A class is a piece of code which acts like a template for something that might be created many different times in slightly different terms throughout the program.
            
            For example, we could have a piece of code which describes different types of cars.
            
            We could make a class called ‘car’, then add the defining features (such as make, model) through class-related variables called attributes. These attributes would then be specific to the ‘instance’ of the class we are creating. Functions which are built into a class are called methods.
            
            For example, our class definition (template) could look like this:
  
            | Class: car(make, model, colour) | 
            |------|
            |self.make = make | 
            |self.model = model |
            |self.colour = colour |

            We could then make different 'instances’ like this:

            bmw = car(‘BMW’, ‘X5’, ‘red’) 
            
            ferrari = car(‘Ferrari’, ‘GT4’, ‘black’)


            _DIAGRAM ?_

            Classes can have ‘public’ and ‘private’ attributes. Public attributes can be accessible from outside the of class. Private attributes can only be accessed from the environment within the class.            
        -
          title: Modulation
          copy: |
            To keep code maintainable, we aim to make it modular. Modularity is when small units of code, such as functions, modules, and even libraries, do not overlap and therefore can be edited separately from the rest of the code. If programs are designed and written well, this can make it much easier to debug as you do not have to go through the whole program to make the changes you need, just the section of code you are interested in. This principle is key for the concepts we will explain in the following sections.   
  -
  -
    title: Principles relating to best practice
    theme: t-bg-primary
    copy: |
      
    subInc: 
      type: slider
      title: 
      slides:
        -
          title: The Single Responsibility Principle (SRP)
          text: |
            The Single Responsibility Principle states that every class or method is responsible for one single, separate part of a program’s functionality.
          img: placeholder_icon.svg
        -
          title: Separation of Concerns (SoC)
          text: |
            Separation of concerns, also known as SoC, is a principle for separating a computer program into distinct sections which each address a separate concern or set of information that affects the code of a program.
          img: placeholder_icon.svg
        -
          title: Abstraction
          text: |
            Abstraction is one of the key principles of object-oriented programming where the programmer hides all but the relevant data about an object so as to reduce its complexity and increase efficiency. 
          img: placeholder_icon.svg

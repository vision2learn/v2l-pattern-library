    title: Abstraction
    theme: t-bg-primary
    copy: |
      For further clarity on Abstraction please see the table below:
      
      **Access to public and private attributes of classes**
      
      | Attribute | From OUTSIDE of the class...| From WITHIN the class...|
      |------|------|-----|
      | Public | Yes | Yes |
      | Private | No | Yes |

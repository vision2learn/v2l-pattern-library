title: Understand the processes and practice of coding
intro: |
  In this session you will learn about the principles of best practice in coding.  On this page you will learn about the KISS principle and the disadvantages of writing complicated code.
banner: placeholder.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to describe what is meant by the KISS principle - KISS – Keep It Simple Stupid.
  -
    title: The KISS principle
    layout: media
    theme: t-bg-primary
    copy: |
      KISS is an acronym for a design principle noted by the US Navy in 1960 and it stands for ‘Keep it Simple and Straightforward’ and covers many different areas of design including engineering and programming. There are other variations of this including ‘keep it short and simple’ and ‘keep it simple, stupid’. Whatever way it is used it means the same thing.
      
      ‘Keep it simple stupid’ or even ‘keep it stupid simple’ are used in programming. By keeping the programming simple, service and maintenance are much easier and there are no hard and fast rules regarding the implementation of code, only that it should be simple and therefore easily modified.
    img: /images/svg/placeholder_icon.svg

title: Understand the processes and practice of coding
intro: |
  In this session you will learn about the principles of best practice in coding.  On this page you will learn about the KISS principle and the disadvantages of writing complicated code.
banner: uc_u4_s1_p2_processes_and_practtice.jpg
sections:
  -
  -
    title: Best practices in coding
    theme: t-bg-primary
    copy: |
      Best practices in programming are achieved by using a variety of principles, which may initially seem tedious and time consuming but may be advantageous long term. 
      
      Collectively, we refer to these practices as Devops which combines software development (Dev) and IT operations (Ops). Cluttered code can cause problems when it is further extended so this is why there are rules for writing good code. 
      
      Let’s have a look at this in more detail.
  -
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to describe what is meant by the KISS principle - KISS – Keep It Simple and Straightforward.

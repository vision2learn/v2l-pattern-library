      ### The KISS principle

      KISS is an acronym for a design principle noted by the US Navy in 1960 and it stands for ‘Keep it Simple and Straightforward’ and covers many different areas of design including engineering and programming. Please see the following video to learn more.
    video: placeholder_pc.mp4

    title: Continuous monitoring
    layout: media
    theme: t-bg-primary
    copy: |
      Continuous Monitoring is at the end of the DevOps lifecycle. Once the software is released into production, Continuous Monitoring will notify Dev and QA teams if there are any issues and give feedback on what is going wrong enabling issues to be fixed quickly.
      

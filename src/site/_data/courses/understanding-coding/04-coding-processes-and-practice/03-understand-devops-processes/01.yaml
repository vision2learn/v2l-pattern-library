title: Understand DevOps processes
intro: |
  In this session you will learn about DevOps processes and what is meant by continuous integration, delivery and deployment and the differences between these processes.
banner: uc_u4_s3_p1_devops.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * What is meant by continuous integration, continuous delivery and continuous deployment
      * The **steps** required for continuous integration, continuous delivery and continuous deployment
      * The **differences** between continuous integration, continuous delivery and continuous deployment

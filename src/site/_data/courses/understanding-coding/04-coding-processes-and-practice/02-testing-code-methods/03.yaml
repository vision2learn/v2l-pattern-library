  -
  -
    title: Test Driven Development
    theme: t-bg-supporting3
    copy: |
      So, what are the characteristics of a Test Driven Development or TDD. 

      The Test Driven Development approach creates test cases to specify and validate what the code will do. Test cases for each function are created and tested first before the actual development of the application or program and if the test fails new code is written.

      ![](/images/svg/uc/uc_u4_s2_p3_wide_image.svg)

      See below to learn more:
    subInc: 
      type: accordion
      content:
        - 
          title: 3 main principles of TDD
          copy: |
            TDD is written around 3 main principles:
            1.	Do not write any production code unless it is to make a failing unit test pass.
            2.	Do not write any more of a unit test than is sufficient to fail.
            3.	Do not write any more production code than is sufficient to pass the one failing unit test.

            Since points 1 and 3 are both involve “refactoring” of code, this can be simplified to 2 points:
            1.	Write only enough of a unit test to fail.
            2.	Write only enough production code to make the failing unit test pass.
    copy2: In TDD, the tests are written before the code, then refactored afterwards.  
  -
  -
    title: Benefits of a test driven development
    layout: media
    theme: t-bg-primary
    copy: |
      TDD constrains the complexity and effort which is put into the initial coding. This comes with several benefits:
      * Reduces rework time, and enhances productivity
      * Allows quick exploration of bugs and errors
      * Makes it quick to get feedback, and encourages knowledge sharing and collaboration as anyone should be able to make a start on any section of code
      * Allows programmers to easily change overarching program architecture, and encourages cleaner program design 
      * Results in the creation of extensive code that is flexible and easy to maintain
      * Means that requirements in the design spec are addressed directly during implementation.

    img: /images/svg/uc/uc_u4_s2_p3_image2.svg

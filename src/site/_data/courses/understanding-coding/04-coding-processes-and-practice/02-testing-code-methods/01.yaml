    title: Testing code
    theme: t-bg-primary
    copy: |
      We have talked about different code and how it should be written but to make sure it works it must be tested so let’s look at what is meant by testing code. 

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: What is testing in coding?
          text: |
            Testing is the process by which the code of a program is checked to see that it works by executing the program with the aim of finding any errors. If testing is done successfully then it should remove all the errors from the software.
          img: placeholder_icon.svg
        -
          title: Why is it important to test code?
          text: |
            Testing is a fundamental process that helps to create reliable and usable software. It helps to check adaptability, identify errors, avoid future extra costs and risks and ultimately give confidence in the program.
          img: placeholder_icon.svg

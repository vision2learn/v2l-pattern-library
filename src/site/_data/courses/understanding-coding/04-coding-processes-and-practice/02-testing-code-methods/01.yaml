title: Understand the methods of testing code 
intro: |
  In this session the learner will learn about the different methods used to test code.
banner: placeholder.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * What is meant by testing code
      * Why it is important to test code
      * Methods of testing code
      * Characteristics of a test driven development
      * Benefits of a test driven development
      * What is a bug in relation to code
      * What is debugging

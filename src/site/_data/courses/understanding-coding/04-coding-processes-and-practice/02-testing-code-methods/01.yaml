    title: Methods of testing code
    theme: t-bg-primary
    copy: |
      Let’s look at some of the details and methods of software testing.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Who tests the code?
          text: |
            White box testing: product testing where the source code is provided to the person doing the testing. This person may have knowledge about the software itself, or at least domain-specific knowledge.
            
            Black box testing: product testing where source code is not provided to the tester, who is a likely end-user of the product. No more technical expertise would be expected than from the average user.

          img: uc_u4_s2_p1_slide1.svg
        -
          title: How do they test the code?
          text: |
            Unit testing: testing of individual units of code to check for errors. Often run as a whole program. This is functional testing.
            
            Integration testing: testing of system as a whole when new units are added (e.g. interactions of units). This is functional testing.
            
            Regression testing: testing that new changes made to previously tested software do not affect the existing functionality. This is maintenance testing.

          img: uc_u4_s2_p1_slide2.svg
        -
          title: When do they test the code?
          text: |
            Smoke test: also known as “sanity testing”, this is a dry run of the software in its environment, often carried out by the test manager.
            
            Alpha testing: pre-release testing involving both white box and black box testing.
            
            Beta testing: testing by a small sample of potential end-users who have agreed to report bugs, and involves black box and functionality testing.
            
            These can encompass functional, non-functional, and maintenance testing.

          img: uc_u4_s2_p1_slide3.svg
  -
  -
    title: Quick quiz
    copy: 
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Functional testing is to ensure that the software operates in line with the specifications. 
          answer: Functional
        -
          sentence: Aspects which are not related to software architecture such as performance and reliability but still need to be tested are known as Non-functional testing.
          answer: Non-functional
        -
          sentence: Maintenance testing is for the post-release to ensure compatibility with new hardware/software
          answer: Maintenance
        -
          sentence: White box product testing is where the source code is provided to the person doing the testing. 
          answer: White box
        -
          sentence: Black box product testing is where source code is not provided to the tester, who is a likely end-user of the product. 
          answer: Black box
        -
          sentence: Alpha testing is when the pre-release testing is done which involves both white box and black box testing.
          answer: Alpha
        -
          sentence: Beta testing is a small sample of potential end-users who have agreed to report bugs, and involves black box and functionality testing.
          answer: Beta
    theme: i-quiz
title: Bugs in code and debugging
intro: |
  On this page you will learn about bugs in code and debugging.
banner: uc_u4_s2_p2_debugging.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to identify what is meant by a bug in relation to code.
  -
    title: Bugs in Code
    theme: t-bg-primary
    copy: |
      Developers will write unit tests for their code to make sure it works correctly, and this can help to prevent against bugs. Software bugs are errors or flaws in computer programs or systems. 
      
      So what exactly is meant by bugs in relation to code?
    subInc: 
      type: reveal
      content:
        -
          title: Syntax error
          copy: |
            This is when the syntax is incorrect, such as missing end of line characters/indents, unrecognised characters or variable names, or incorrect case sensitivity.
          img: placeholder_icon.svg
        -
          title: Runtime errors
          copy: |
            Runtime errors occur when a program is run or executed. They can be caused by problems such as infinite loops, memory leaks, or corrupt files.
          img: placeholder_icon.svg
        -
          title: Semantic (also known as logic errors)
          copy: |
            These occur when no error message is created, but the functionality is not what the programmer intended. For example, when datatypes are not converted correctly (such as float to int), or inadvertently using a function name as a variable name.
          img: placeholder_icon.svg
        -
          title: Compilation
          copy: |
            This is when there is an error for the building the machine code for the program, most commonly caused by basic syntax errors.
          img: placeholder_icon.svg
    copy2: When there is a bug in the code, this can cause the program to crash, function incorrectly, or become non-functional.
  -

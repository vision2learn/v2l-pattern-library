  -
    title: Example of code
    theme:
    copy: |
      The Python code below shows a simple function (lines 4-7), and an example of where __unit testing__ is used to __debug__ a program.
    subInc:
      type: code
      lang: python
      highlight: 
      code: |
        """ Python code to show examples of a unit test """

        # Here we define a function to multiply two input values then return the answer.
        def multiply_values(a, b):
            c = a * b
            return(c)

        # Now we test the function. First with integers:
        test_1 = multiply_values(2, 4)

        # Now with an integer and a string:
        test_2 = multiply_values(2, 'goat')

        # Now we check each variable by printing it:
        print('test_1 is: ', test_1)
        print('test_2 is: ', test_2)

        # Here we print the results of the tests to the console
        print('Are the outputs integers?') 
        print('test_1: ', isinstance(test_1, int))

        print('test_2: ', isinstance(test_2, int))      
  -
  -
    title: Result
    theme:
    copy: |
      
    subInc:
      type: code
      lang: text
      highlight: 
      code: |
        test_1 is: 8
        test_2 is: goatgoat
        Are the outputs integers?
        Test 1: True
        Test 2: False
    copy2: |
      The output is seen at the bottom, in the Result window.

      The first test resulted in the output is 8.
      
      The second test gave us the output ‘goatgoat’. 
      
      This second test gives us the example of a **semantic error**, as the program continues to run, but not in the way that we intended. If we wanted to make sure to make sure that the answer was always an **integer**, a **unit test** could report this when the multiply_values function gave us an output we did not expect.

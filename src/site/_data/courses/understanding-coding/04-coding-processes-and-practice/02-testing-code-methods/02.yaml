    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to identify what is meant by a bug in relation to code.
  -
    title: Bugs in Code
    theme: t-bg-primary
    copy: |
      Developers will write unit tests for their code to make sure it works correctly, and this can help to prevent against bugs. Software bugs are errors or flaws in computer programs or systems. 
      
      So what exactly is meant by bugs in relation to code?
    subInc: 
      type: reveal
      content:
        -
          title: Syntax error
          copy: |
            This is when the syntax is incorrect, such as missing end of line characters/indents, unrecognised characters or variable names, or incorrect case sensitivity.
          img: placeholder_icon.svg
        -
          title: Runtime errors
          copy: |
            Runtime errors occur when a program is run or executed. They can be caused by problems such as infinite loops, memory leaks, or corrupt files.
          img: placeholder_icon.svg
        -
          title: Semantic (also known as logic errors)
          copy: |
            These occur when no error message is created, but the functionality is not what the programmer intended. For example, when datatypes are not converted correctly (such as float to int), or inadvertently using a function name as a variable name.
          img: placeholder_icon.svg
        -
          title: Compilation
          copy: |
            This is when there is an error for the building the machine code for the program, most commonly caused by basic syntax errors.
          img: placeholder_icon.svg
    copy2: When there is a bug in the code, this can cause the program to crash, function incorrectly, or become non-functional.
  -
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to describe what is meant by debugging.
  -
  -
    title: What exactly is meant by Debugging? PLACEHOLDER
    layout: media
    theme: t-bg-primary
    copy: |
      Debugging and testing are process which occur hand in hand. Testing aims to identify what happens when there are errors in the code. Debugging aims to locate and rectify mistakes.

      Often tests are written to identify bugs as the program is written. One way to do this is by writing **unit tests**. A unit test is a way of testing the smallest piece of code that can be logically isolated in a system. Smaller tests give a granular view of how the code is performing and by being small, the test can be run fast. Specific test are written to test whether a unit is functioning as it should. 

      This allows developers to write a test script, which is essentially a piece of code separate to the main program that runs a specific test for each unit in the main program. Each unit is tested to see if it runs as expected based on criteria, and summarises this in a report. 

      Each time the program is updated, the test script will be run to ensure that all units are functioning correctly. This helps to debug the whole program as new units are added.

    img: /images/svg/placeholder_icon.svg

title: Defensive Programming
intro: |
    On this page you will learn about defensive programming.

banner: uc_u4_s4_p2_defensive.jpg
sections:
  -
    title: What is Defensive Programming?
    theme: t-bg-primary
    copy: |
      Defensive programming is broad term which encompasses program design that ensures the continuing function of a piece of software under unforeseen circumstances so that it still behaves in a predictable manner despite unexpected actions. 
      
      Exception handling is one form of defensive programming. In our previous example, this dealt specifically with an error which caused a terminal error in the program. But what if we could anticipate a semantic error, where the program doesn’t but the functionality is not what was intended?
      
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to explain what is meant by defensive programming.
  -
  -
    title: Defensive Programming example
    theme:
    copy: |
      Let’s say in the program on the previous page, we wanted to ensure that the two inputs to our function were always both integers, and never floating point numbers. In this scenario, we could use defensive programming to write in checks to see if this occurs, and act accordingly when it does.
    subInc:
      type: code
      lang: python
      highlight: 
      code: |
        """ Python code with exception handling """

        # Here we define a function to add two input values then print the answer.
        def add_values_and_print(a, b):

          # Here, we defensively program to ensure numbers are Ints with 'if' statements
          if isinstance(a, float) == True:
            print("Input 'a' was Float type not Int. Converted to Int.")
            a = int(a)

          if isinstance(b, float) == True:
            print("Input 'b' was Float type not Int. Converted to Int.")
            b = int(b)

          try:				# This is where we try the operation
            c = a + b
          except TypeError:	# This is where we state what to do (the exception) in case of a TypeError
            print('TypeError. Please ensure that both input variables are Ints.')
            return
          else:
            c = int(c)

            print('The output is equal to: ', c)

          return(c)

        # Now we test the function. First with integers:
        test_1 = add_values_and_print(2, 4)

        # Now with an integer and a string:
        test_2 = add_values_and_print(2, 'goat')

        # Now with an integer and a float:
        test_3 = add_values_and_print(2, 3.7)
  -

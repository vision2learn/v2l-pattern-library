    title: Result
    theme:
    copy: |
      
    subInc:
      type: code
      lang: text
      highlight: 
      code: |
        The output is equal to:  6
        TypeError. Please ensure that both input variables are Ints.
        Input 'b' was Float type not Int. Converted to Int.
        The output is equal to:  5

        [Finished in 134ms]
    copy2: |
      Now, test_1 and test_2 still act as expected. However, using the ‘if’ statements starting on lines 7 and 11, whenever inputs ‘a’ and ‘b’ are 'floating point numbers', and if they are, print a message to the console to inform the user that they are converted to 'Ints'. 
      
      Using defensive programming, we can minimize the occurrence of bugs and errors, and make sure that we deal with them appropriately when they do occur.

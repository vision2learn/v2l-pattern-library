    title: So, what exactly is Exception Handling?
    theme:
    copy: |
      Exception Handling refers to the way a program handles exceptional circumstances and continues to run in situations where it would otherwise crash. Different programming languages have different causes for errors which would cause the code to crash, as we discussed in Unit 4, Session 2. Using exception handling, if we can anticipate the specific type of error which may occur, we can code ways to deal with it rather than a terminal error occurring which causes the program to crash.

      Lets use a simple example of some code to illustrate how we can use exception handling to prevent a program from crashing.

      We have a function in Python that we want to add two numbers together, and then print the output to the console. As we can from the output of this example from test_1, this works fine when the input variables are both Ints.

    subInc:
      type: code
      lang: python
      highlight: 
      code: |
        """ Python code with NO exception handling """

        # Here we define a function to add two input values then print the answer.
        def add_values_and_print(a, b):
          c = a + b
          print('The output is equal to: ', c)
          return(c)

        # Now we test the function. First with integers:
        test_1 = add_values_and_print(2, 4)

        # Now with an integer and a string:
        test_2 = add_values_and_print(2, 'goat')

title: Understand the importance of robust coding
intro: |
  _PLACEHOLDER PAGE - Need further information - Draft 1 document_
  
  In this session you will learn about the importance of robust coding.  Robust coding and programming focusses on handling unexpected errors and actions. It utilises specific code to handle these by displaying accurate and unambiguous error messages.


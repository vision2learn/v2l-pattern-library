        TypeError. Please ensure that both input variables are Ints.

        [Finished in 132ms]
    copy2: |
      Now, when a “TypeError” occurs due to one of the inputs being a string and not a number, the program throws an error and prints a custom error message, but it continues to run through to completion rather than causing an terminal error.

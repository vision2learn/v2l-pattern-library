  -
  -
    title: Quick quiz
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        Which kind of resolution is being described here?  "The two sides of the conflict agree to put aside some of their objectives so that they can both achieve some of their other objectives.":
          answers:
            Avoid: false
            Accommodate: false
            Overrule: false
            Compromise: true
            Collaborate: false
        Which kind of resolution is being described here?  "The people involved agree the conflict is about a minor issue which will fix itself in time.":
          answers:
            Avoid: true
            Accommodate: false
            Overrule: false
            Compromise: false
            Collaborate: false
        Which kind of resolution is being described here?  "The conflict is about a very difficult and emotional issue and no other solution is possible - a single choice of action is enforced regardless of how people feel.":
          answers:
            Avoid: false
            Accommodate: false
            Overrule: true
            Compromise: false
            Collaborate: false
        Which kind of resolution is being described here?  "One side in the conflict backs down because the issue is much less important to them than it is to the other side.":
          answers:
            Avoid: false
            Accommodate: true
            Overrule: false
            Compromise: false
            Collaborate: false
        Which kind of resolution is being described here?  "Everyone involved puts aside their own interests and objectives and  works together to fix the problem in a lasting way.":
          answers:
            Avoid: false
            Accommodate: false
            Overrule: false
            Compromise: false
            Collaborate: true

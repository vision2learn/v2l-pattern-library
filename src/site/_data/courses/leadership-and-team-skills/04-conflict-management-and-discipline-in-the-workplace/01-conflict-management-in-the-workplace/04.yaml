title: Minimising and resolving conflict
intro: |
  On this page, you'll learn about a recognised technique to minimise and resolve conflict in the workplace.
banner: placeholder.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure you can explain a recognised technique to minimise and resolve conflict in the workplace.  
  -
  -
    title: The responsibilities as a team leader
    layout: media
    theme: t-bg-primary
    copy: |
      A team leader would be expected to take steps to resolve conflicts that occur in their team, and minimise the effects that conflicts have. This is because, as a team leader, it's their duty to make sure the team is productive and hitting its targets, which it can't do if it's wracked with conflicts.  

      But the other reason why it's up to them is because of their duty of care to their team. Conflicts cause stress and anxiety, which are bad for mental and physical health. And on rare occasions, conflicts can escalate from angry words to physical actions. But if the team leader is there to de-escalate, resolve, and minimise conflicts, the  team will be happier, more efficient, and safer. 
    img: /images/svg/placeholder_icon.svg
  -
  -
    title: Resolving conflict - the main steps
    theme: t-bg-primary
    copy: |
      There are different kinds of conflict resolution, which we'll look at shortly. But each kind of conflict resolution involves these main steps.

      __1. Acknowledge:__ There should always be some acknowledgement that the conflict exists, even if you agree to let it sort itself out (this is __avoid__ as we discussed above). Refusing to acknowledge the conflict at all means it can grow out of control quickly. 

      __2. Clarify:__ Sometimes the sides in a conflict can't even agree on what they're disagreeing about! By encouraging everyone involved to share their opinions, and looking at evidence and data if it's available, you can identify what the conflict is actually about. 

      __3. Communicate:__ It can be a good idea to initially speak to the different sides in a conflict separately first, but they've eventually need to talk to each other too. Set up a meeting or a channel where everyone can communicate with each other clearly. You might need to intervene if people get emotional or aggressive.  

      __4. Identify:__ With the conflict acknowledged and clarified and everyone communicating, it's time to identify a solution. The solution should be acceptable to everyone involved, but there might be situations where the only solution is to overrule one side. We've discussed these below. 

      __5. Monitor:__ Monitoring the situation will mean you can tell if the solution is working or not. If it isn't then it may be necessary to find a new approach. For major issues, you may need to monitor constantly, but minor issues won't require more than the occasional check-in.  

  -
  -
    title: Resolutions
    theme: t-bg-supporting2
    copy: |
      The best way to resolve and minimise conflicts is to proactively prevent them in the first place, and we'll look at how you can do that later.  
      
      There are five main kinds of conflict resolution. The right method will depend on the nature of the conflict, so you'll have to use your best judgement about which method to use. 
    subInc: 
      type: accordion
      content:
        - 
          title: Avoid
          copy: |
            If the conflict is about something relatively minor, and there are good reasons to believe it will resolve itself, it is sometimes appropriate to take no action to address it. This can be risky though, as small problems can escalate unexpectedly if left unaddressed. For example, a minor argument can be something the parties forget about, but it can also grow into a clash of personalities.  
        - 
          title: Accommodate
          copy: |
            Sometimes in a conflict, one side decides to let the other have their way. This is called accommodation. It occurs when the issue is much more important for one side than it is for the other. The side that backs down might also want to appear fair and understanding, or feel it's more important to be seen to change their mind. A manager might decide to let someone try a new idea they don't agree with, for example, to show the team they're willing to take chances.  
        - 
          title: Overrule
          copy: |
            There are occasions when resolving conflicts through other methods can't or won't work. If an unpopular decision has to be made, like redundancies, or if there's an emergency situation, there will always be conflict. But in situations like this, the only step that can be taken to resolve the conflict is to overrule the competing ideas and suggestions and enforce a single choice of action. This should only be done if it's necessary, as it can appear authoritarian and domineering.  
        - 
          title: Compromise
          copy: |
            If both sides of a conflict agree to abandon some of their objectives while achieving some of their other objectives, this is a compromise. It can be a very effective solution to conflicts because it often feels fair. For example, if there's a disagreement about who should run the team's social events, a compromise would be to let one person run half of the social events and another person the other half.  
        - 
          title: Collaborate
          copy: |
            This is the most difficult form of conflict resolution, but it can be the most effective and long-term. It occurs when everyone involved decides to put aside their personal interests and look for a solution together, as one group, rather than as opposing sides in a conflict. It requires a great deal of commitment and trust to achieve, and can take a long time to work. An example of this might be if a team has come to acknowledge that their whole way of working simply isn't suitable for their current project, meaning they have to change their whole approach.         

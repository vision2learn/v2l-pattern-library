  -
    title: Physical and mental health
    theme: t-bg-primary
    copy: |
      Physical and mental health are important things to be mindful of at work, as well as in your personal life. Your own physical and mental health needs – and those of your team and colleagues – should always be a priority for you.  

      You should make sure that your team know that you’re available to support them if they have physical or mental health problems that impact on their wellbeing and work. These can be delicate and sensitive conversations, so treat them with discretion, privacy, and respect. Bear in mind that information about people’s health is sensitive, so data about it must be stored in a way that conforms to the law. 

      If you have concerns about your own mental or physical health, or that of people you work with, speak to your HR team. They can direct you towards support that can help. 

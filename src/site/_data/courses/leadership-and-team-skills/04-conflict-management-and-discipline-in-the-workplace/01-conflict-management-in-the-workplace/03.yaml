title: Effects of conflict on individuals and teams 
intro: |
  On this page, you will learn about the effects of conflict on individual and team performance at work. 
banner: lts_u4_s1_p3_effects_of_conflict.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure you explain the effects of conflict on individual and team performance at work. 
  -
  -
    title: Conflict - The consequences for teams and individuals 
    theme: t-bg-supporting3
    copy: |
      Conflict will often affect people who aren't directly involved with it. That's because, in the workplace, everyone's actions have some effect on everyone else. It's so important to try and resolve conflicts and minimise their effects because, left unchecked, the effects of a conflict can make future conflict more likely.  
    subInc: 
      type: accordion
      content:
        - 
          title: Low morale
          copy: |
            Teams and individuals that are experienced or have recently experienced conflict may have a low morale. That means people – and the teams they form – will have less enthusiasm and spirit. They won't see the point in doing their best or going the extra- mile. 
            
          img: /images/svg/lts/lts_u4_s1_p3_accordion1.svg 
        - 
          title: Reduced performance and loss of revenue 
          copy: |
            Conflicts mean work isn't getting done, or it's being done to a poor standard. That's because time and resources that would usually be spent getting the job done are being spent resolving a conflict. And although it's very important conflicts don't go unresolved, this inevitably means that less money is being made.  
            
            Also, sometimes conflicts can only be fixed by spending money to prevent certain problems from re-occurring. There are also situations where a conflict may result in financial compensation to the parties involved.  
            
          img: /images/svg/lts/lts_u4_s1_p3_accordion2.svg 
        - 
          title: Absenteeism and high turnover
          copy: |
            Because of the negative atmosphere conflicts produce, people may simply not want to come to work. This can cause cases of absenteeism, where employees are taking time off without permission or a good reason. It may also result in people simply quitting their jobs. If this happens a lot, you'll have a high staff turnover, which isn't desirable.
            
          img: /images/svg/lts/lts_u4_s1_p3_accordion3.svg 
        - 
          title: Physical and mental health problems 
          copy: |
            Conflict is inevitably stressful, and stress is a leading cause of work-related physical and mental health problems. Being involved in a conflict, directly or indirectly, can leave people feeling anxious, stressed, and depressed. They may no longer feel safe at work. All of this can leave people struggling with their mental health. Stress, anxiety and depression also all have physical effects, such as insomnia and lethargy. 
            
          img: /images/svg/lts/lts_u4_s1_p3_accordion4.svg 
        - 
          title: Bad reputation
          copy: |
            If your team has suffered from a major conflict, or has experienced several conflicts, this will leave it with a bad reputation. People may not want to work in your team if they hear it's prone to conflicts. They may not want to use you as a supplier for the same reason. 
            
          img: /images/svg/lts/lts_u4_s1_p3_accordion5.svg     
  -
  -
    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Case study - Magic Co.

      Magic Co. wants to create a new app that lets users stream music of their choice while they game. They assemble a new team with some of their best developers, including Sandra and Cody.  

      Sandra and Cody are great developers, and their managers often give them a lot of autonomy. They are both very confident in their abilities, but they have different philosophies when it comes to design. Cody believes in trusting your gut, while Sandra thinks you should listen to your head. 

      Because their manager wants to leave them to work in the way that best suits them, their job roles aren't clearly defined. And there's overlap in their responsibilities. One day, Sandra is looking over her code and she realises that Cody has made some edits to it – without asking her… 
    subInc: 
      type: accordion
      content:
        - 
          title: The results
          copy: |
            Sandra and Cody have a very public row in the office. Sandra accuses Cody of undermining her. Cody accuses Sandra of incompetence, and says he wouldn't have needed to edit her code if she'd done it right in the first place. The argument quickly escalates and the two are separated by their manager, who sends them both home.  

            This public blow-up involving two respected developers leaves the rest of the team with low morale. Sandra and Cody were both liked by the team, and people didn't like seeing them hurling insults at each other. It made the team feel like they might not be able to safely approach either of them if they needed their help.  

            The next day, two of the junior developers request to be moved to different teams, and the manager becomes aware there's a general atmosphere of suspicion around his decision-making. A couple of days later, he's called into a meeting and is told the new app project has been deprioritised, and his team will be halved and won't include Sandra or Cody. 

          img: /images/svg/lts/lts_u4_s1_p3_casestudy1.svg

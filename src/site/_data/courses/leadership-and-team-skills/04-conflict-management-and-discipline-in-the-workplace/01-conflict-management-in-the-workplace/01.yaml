title: Welcome to Unit 4
intro: |
    ### Conflict management and discipline in the workplace
    
    In Unit 4, you will learn about the causes of conflict at work, the stages in the development of conflict, and the effects of conflict on individual and team performance.

banner: lts_u4_s1_p2_conflict_causes_stages.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit you will gain the knowledge and understanding required to be able to meet the learning outcomes in your learning goals. 

      You will understand the importance of:

      1. Conflict management in the workplace 
      2. The legal aspects of disciplinary procedures, organisational policies about discipline, and how to monitor discipline in the workplace 

      [View the complete set of learning outcomes for this unit.](/pdfs/v2l_lts_learning_outcomes_u4.pdf)
  -
  -
    title: Introduction
    theme: t-bg-primary
    copy: |
      We will look at a recognised technique that managers can use to minimise and resolve conflict at work, and how you can promote a positive atmosphere at work.

      We'll also look at the legal aspects of the disciplinary process, the employment policies and procedures that can guide you in dealing with disciplinary issues, and look at the purpose of disciplinary procedures. We will also look at the interpersonal behaviour and support skills a manager needs to monitory discipline in the workplace.
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      
      * The causes of conflict at work 
      * The stages in the development of conflict 
      * The effects of conflict on individual and team performance at work 
      * Recognised techniques to minimise and resolve conflict in the workplace 
      * How a manager can promote a positive atmosphere to minimise the adverse effects of conflict 
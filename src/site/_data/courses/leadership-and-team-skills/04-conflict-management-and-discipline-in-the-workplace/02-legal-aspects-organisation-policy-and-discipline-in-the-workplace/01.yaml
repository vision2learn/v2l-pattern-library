title: Legal aspects of conflict in the workplace
intro: |
  In this session we will be taking a look at the legal aspects and common organisational policies around discipline, and how to monitor discipline in the workplace.
banner: lts_u4_s2_p1_legal_aspects.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * The legal aspects of the disciplinary process 
      * Employment policies and procedures that could guide a manager in dealing with disciplinary issues 
      * The purpose of disciplinary procedures 
      * The interpersonal behaviour or support skills required by a manager to monitor discipline in the workplace  
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure you can describe the legal aspects of the disciplinary process. 
  -
    title: What is a disciplinary process? 
    layout: media
    theme: t-bg-primary
    copy: |
      A disciplinary process is a set of clearly defined steps that an organisation takes if someone's behaviour is inappropriate or if their work is not to the right standard.  
      
      Organisations must carry out their disciplinary process in a way that's fair and respectful to the people involved. Organisations are expected to have their disciplinary process written out so anyone in the organisation can read it.  

    img: /images/svg/lts/lts_u4_s2_p1_image1.svg
  -
  -
    title: The legal aspects
    theme: t-bg-supporting3
    copy: |
      An organisation can't just develop whatever disciplinary process they want. There are legal requirements that they have to cover.  
    subInc: 
      type: accordion
      content:
        - 
          title: Available to be read 
          copy: |
            In your employment contract, there must be a reference to the organisation's disciplinary, dismissal, and grievance procedures. The contract doesn't have to actually describe the procedures though, as long as they're supplied elsewhere (like in an employee handbook or a PDF on the intranet). 
            
          img: /images/svg/lts/lts_u4_s2_p1_accordion1.svg
        - 
          title: ACAS Code of Practice 
          copy: |
            ACAS is the Advisory, Conciliation and Arbitration Service. It is a public body run by the Government. Its job is to make sure that organisations all follow the same standards for disciplinary, grievance, and dismissal procedures. This is called the ACAS Code of Practice. 
            
            Organisations can develop their own procedures, but these have to reflect the fundamentals of the ACAS Code of Practice. If an employee is disciplined or dismissed unfairly, or their grievance isn't processed properly, they can take the organisation to a tribunal. If the organisation is found to have acted wrongly and didn't follow the ACAS Code of Practice, up to 25% more compensation can be awarded to the victim. 
            
          img: /images/svg/lts/lts_u4_s2_p1_accordion2.svg
        - 
          title: Misconduct and capability 
          copy: |
            Disciplinary procedures should be used by an organisation if an employee is acting inappropriately (misconduct) or in matters relating to their performance (capability). If you tried to use the disciplinary procedure for any other reason, that would be wrong and potentially illegal.  
            
          img: /images/svg/lts/lts_u4_s2_p1_accordion3.svg
        - 
          title: Fairness 
          copy: |
            The procedure has to be carried out in a way that is fair. That means it should follow the steps in the ACAS Code of Practice, which is designed to be as fair as possible. Not being subject to unfair dismissal is a statutory employee right – if someone felt that the way the disciplinary procedure was used was unfair, this could result in regulatory or possibly even legal action against their organisation. 
            
          img: /images/svg/lts/lts_u4_s2_p1_accordion4.svg     
  -
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        Make a note of the legal aspects of the disciplinary process. You could also carry out additional research to find examples that you could use in your assessment. Make a note of these in the box provided.


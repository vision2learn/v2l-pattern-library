title: Why do we have disciplinary procedures? 
intro: |
  On this page, you will learn about the purpose of disciplinary procedures. 
banner: lts_u4_s2_p3_disciplinary_procedures.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure you can describe the purpose of disciplinary procedures. 
  -
  -
    title: Why do we have disciplinary procedures?
    layout: media
    theme: t-bg-primary
    copy: |
      Disciplinary procedures exist to resolve issues around conduct and performance. Because these are issues around someone's behaviour, work standard, and their relationships with colleagues and employer, they can be difficult to resolve. In particular, because employees have certain rights guaranteed in law to protect them against being treated unfairly by their employer, organisations need to strictly follow the established procedures. 

      Formal disciplinary procedures exist to make sure that everyone is treated fairly. By following ACAS guidelines, an employer's disciplinary procedure will use the same standards for everyone, whoever they are. This protects the employer from legal repercussions by making sure they don't act unfairly, and protects employees from being treated in a way that violates their rights to not be discriminated against or dismissed unfairly.  

    img: /images/svg/lts/lts_u4_s2_p3_image1_b.svg
  -
  -
    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Case study - The Pickled Cucumber

      Jamie is a new manager at The Pickled Cucumber. He's moved to the area and used to work in a restaurant which was famous for being very high-pressure. He believes that any business, including a restaurant, will only work if people are kept in line.  
      
      He's going through the inventory one day and he notices an expensive jar of olives and a box of wine glasses are both missing, although they were there yesterday. He checks the shift rota and sees that a waiter called Justin was on duty yesterday. Jamie doesn't like Justin very much – he thinks he's sloppy and talks to customers too much.  
    subInc: 
      type: accordion
      content:
        - 
          title: What Jamie does next 
          copy: |
            Next time Justin is in the restaurant, Jamie suddenly calls a meeting and gathers all the staff together before they open. He tells them that a jar of olives and some wine glasses have gone missing, and he points to Justin and accuses him of theft. 

            Justin is mortified. He angrily defends himself and when he starts to cry, he shouts "I quit!" and storms out of the restaurant. Everyone is shocked and embarrassed by what's happened, except for Jamie. He sees what's just happened as proof Justin was the culprit. 

            But a few hours later, another member of staff approaches him, Hannah. She tells him that she knocked the jar of olives off the shelf by accident. They landed on the box of wine glasses and everything was smashed. She knew Justin doesn't like mistakes like that, so she thought if she hid everything it would be okay.  

            If Jamie had followed a proper disciplinary process here, which would have included an investigation to try and find out what had actually happened, all of this could have been avoided. Now they've lost two members of staff, and Jamie will have to answer some difficult questions about how he treats his colleagues…  

          img: /images/svg/lts/lts_u4_s2_p3_casestudy1.svg

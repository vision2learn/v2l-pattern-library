title: Accurate records
intro: |
  On this page, you will learn about methods for maintaining accurate records of electronic and oral communication.
banner: placeholder.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure you can describe methods for maintaining accurate records of electronic and oral communication. 
  -
  -
    title: Recording methods
    theme: t-bg-primary
    copy: |
      We're going to look at some methods for recording both electronic and oral communication. 
    subInc: 
      type: accordion
      content:
        - 
          title: Chat logs
          copy: |
            If you use instant messaging, such as WhatsApp, logs will be generated automatically in the app you're using. Some apps automatically delete messages after they've been sent, which means they're probably not appropriate for work. Likewise, people can manually delete conversations on some apps, so consider this when choosing how you're communicating.
        - 
          title: Email inbox
          copy: |
            Your email inbox is a record of all your emails. You can refer back to important emails you've received. Your inbox will also have a "sent email" folder, where you can check through emails you've sent. It's also possible to delete emails from your inbox, but these can sometimes be recovered.
        - 
          title: Video and audio recordings
          copy: |
            If you use apps like Microsoft Teams for work, you can record and automatically generate a transcript of video and audio calls made from your computer. Other video and audio call apps have this feature as well. Oral conversations can also be recorded with voice recording apps or devices.
        - 
          title: Photocopies and scans
          copy: |
            Letters and other pieces of written information can be photocopied or scanned to produce records. Remember that photocopies are just paper copies and are vulnerable to loss or destruction.
        - 
          title: Minutes and shorthand
          copy: |
            Often during a meeting, it'll be someone's job to "take minutes". That means they write a high-level summary of what people said and agreed to during the meeting. They also make a note of everyone in attendance, the agenda of the meeting, and people who weren't able to attend. Sometimes a special writing system called shorthand is used, but this is rare nowadays and requires special training.
        - 
          title: Written records of conversations
          copy: |
            The simplest kind of record of a conversation is just to sit down and write down what was said, and by who. This can be in different formats, as long as it's accurate and to the point. You **don't** need to write down that it was sunny, but you **do** need to write down an agreed change in your hours!
  -

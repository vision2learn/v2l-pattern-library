    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure you can explain the importance of keeping a record of oral communication. 
  -
  -
    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Case study - Who said what? 

      Magic Co.'s app development team are in a sticky situation. 

      Two days after the app was released, they realised an important feature hasn't been enabled. They've had to issue an update to fix this, and the team behind the app feel very embarrassed that this happened.  

      Micky, the member of the team responsible for that feature, is insisting that no one told him that it was needed. He's getting very defensive.  

      Carl, the team leader, figures out that there was a meeting two weeks ago where that feature was meant to be discussed. He's going to look at the records. 
    subInc: 
      type: accordion
      content:
        - 
          title: What does the record say?
          copy: |
            
            Carl realises that Micky was right.  

            The meeting took place via video call and it was recorded. He watches the recording and realises that the missing feature was never mentioned.  

            Micky has also shown Carl his emails from after that meeting – no one ever sent him an email asking him to prepare that feature for the app. 

            Thanks to accurate record keeping, Micky has been proved right and feels relieved that people realise the missing feature wasn't his fault.  

          img: /images/svg/lts/lts_u2_s2_p1_casestudy1.svg
  -
  -
    title: Keeping records of oral communication 
    layout: media
    theme: t-bg-primary
    copy: |
      As you've just seen in the case study above, keeping records of oral communication in particular is very important. People can often remember conversations differently from one another. As time goes on, the differences in memory can become bigger and bigger. You can even end up forgetting the conversation happened in the first place.  

      Even a short conversation can involve important agreements being made. Making sure that an accurate record of oral conversations is kept means that you and other people can refer back to what was actually said and agreed. This can clear up misremembering, clarify the details, and make sure there isn't disagreement about what was said.  

      In the above example, if a record of that meeting hadn't been kept, Micky could have been held responsible for a mistake that wasn't his fault. But because there was a recording of the whole meeting, he could prove that he wasn't in error. 

    img: /images/svg/lts/lts_u2_s2_p1_image2.svg
  -
  -
    title: Quick quiz
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        Is the following statement true or false? "If you can rely on your memory, you don't have to worry about keeping records of communication.":
          answers:
            True: false
            False: true
        Is the following statement true or false? "If there's a record of a conversation, this can form part of a legal defence.":
          answers:
            True: true
            False: false
        Is the following statement true or false? "It's not important to keep records of oral conversations because people generally remember what was said.":
          answers:
            True: false
            False: true

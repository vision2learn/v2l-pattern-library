title: The importance of records
intro: |
  In this session you will learn about the importance of maintaining accurate records of communication.
banner: lts_u2_s2_p1_records.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * Why it is important to have a record of communication. 
      * The importance of keeping a record of oral communication. 
      * Methods of maintaining accurate records of electronic and oral communication. 
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure you can explain why it is important to have a record of communication.
  -
    title: Reasons to keep records
    theme: t-bg-supporting3
    copy: |
      After an email has been sent or a conversation has been concluded, it's important that a record of the communication is kept. We're going to look at some reasons why. 
    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Double-checking instructions
          text: |
            It's useful to have a record of communications that contain instructions. You might need to double-check details or deadlines, especially if the instructions are about a new task or activity.
          img: lts_u2_s2_p1_slide1.svg
        -
          title: Reference for other people
          text: |
            Sometimes people who weren't there when communication took place need to know what was said or written. For example, people who couldn't attend an important meeting. 
          img: lts_u2_s2_p1_slide2.svg
        -
          title: Legal reasons
          text: |
            Sometimes there are specific legal reasons why records need to be kept. This could be to prove that work processes are at the expected standard or because the content of a meeting needs to be in the public record. Records of communications can even be used as a legal defence in some situations.  
          img: lts_u2_s2_p1_slide3.svg
        -
          title: Proof of what was said
          text: |
            Sometimes, the parties involved in communication can have different interpretations of what was said. There are even some occasions where people involved might want to lie about this. Keeping accurate records can act as proof of what was – and what wasn't – said.  
          img: lts_u2_s2_p1_slide4.svg
  -
  -
    title: What could happen if records aren't kept?
    layout: media
    theme: t-bg-primary
    copy: |
      There are a lot of potentially very bad consequences if records aren't kept.

      * Without a record of instructions, people can forget what tasks they're expected to perform, how, where, and by when.  This can be very damaging to productivity.
      * If other people can't find out about communications relevant to them after they've happened, it can be extremely difficult to give everyone access to the information they need.
      * There can serious legal consequences if records the law requires to be kept are not created or are deleted or lost.
      * Records can be offered as proof of what was said and agreed. In commercial transactions, like contract negotiations, if these records aren't kept it can result in products and services not being delivered.

    img: /images/svg/lts/lts_u2_s2_p1_image1.svg
  -
  -

title: The right impression
intro: |
  In this session, you will learn how to present a positive impression to those outside the team.
banner: lts_u2_s5_p1_impression.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * Why it is important to give a positive impression to internal and external customers 
      * Why product/service knowledge is important in presenting a positive impression to those outside the team 
      * Why it is important to observe legal, organisational and ethical rules when providing information to customers 
      * Communication skills that could improve the relationship with customers 
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure that you can outline why it is important to give a positive impression to internal and external customers.
  -
    title: What are internal and external customers?
    theme: t-bg-primary
    copy: |
      * An internal customer is someone who receives a specific service from a member of their own organisation. 
      * An external customer is someone who receives a specific service, but who doesn't belong to the organisation providing that service. 
      
      For example, an internal customer in Magic Co. is the marketing team for the app – they rely on the development team to create the app which they can then start to advertise. The external customers are the people who are downloading and using the app.  
  -
  -
    title: The importance of making a positive impression
    theme: t-bg-supporting3
    copy: |
      These are the reasons it's important to give a positive impression to internal and external customers.  
      
      For internal customers, it's important to make a positive impression because it will reflect well on the competency of your team. This will raise their profile and may mean they're in line for bonuses and greater responsibilities. Internal customers aren't likely to pay for your services, unlike external customers who would be expected to pay. 
    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Turn interest into purchase
          text: |
            If you create a positive impression, customers who are interested in your services – but who haven't made the commitment to use them – are more likely to make the purchase.
          img: lts_u2_s5_p1_slide1.svg
        -
          title: Create repeat customers
          text: |
            Creating a positive impression means people who've already used your service are more likely to come back and use it again.
          img: lts_u2_s5_p1_slide2.svg
        -
          title: Recommendations
          text: |
            If you've created a good impression, customers are more likely to recommend your services, potentially creating even more customers. A good impression can also mean people will want to join your organisation.
          img: lts_u2_s5_p1_slide3.svg
  -
  -
    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Case study - Magic Co.'s negative impression  

      Let's check in again with Magic Co.  

      Unfortunately, it looks like they're not making a very good impression on their external customers.

      The app has suffered a lot of problems, and the technical support the company provides hasn't been very helpful to people. Messages through the chat service are short and vague; phone operators are rude and impersonal; and the company's social media presence has become defensive.

      These are potential outcomes of creating a negative impression.
    subInc: 
      type: accordion
      content:
        - 
          title: Loss of customers
          copy: |
            Reviewers on the app store have said that they're deleting the app. A lot of them said that although they were annoyed the app wasn't working, the reason they were deleting is that Magic Co. was so bad at communicating with them.  
        - 
          title: Failure to find new customers
          copy: |
            A lot of people are only hearing about Magic Co. for the first time right now, but it's not because of their good reputation. What people are hearing is that they're a company producing an unreliable product who don't care about customer communication.  
        - 
          title: Collapse of recommendations
          copy: |
            A faulty app, a rude helpline, and aggressive behaviour on social media – right now, who would want to recommend Magic Co. to anyone?
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        What do you think Magic Co. are doing wrong here? What could they have done instead?
        
        Make a note of why it is important to give a positive impression to internal and external customers. You could also carry out additional research to find examples that you could use in your assessment. Make a note of these in the box provided.

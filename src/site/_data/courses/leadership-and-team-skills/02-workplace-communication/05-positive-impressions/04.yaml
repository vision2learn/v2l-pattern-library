title: Communication skills
intro: |
  On this page, you will learn about communication skills that could improve your relationship with customers. 
banner: lts_u2_s5_p4_skills.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure that you can outline communication skills that could improve your relationship with customers.
  -
  -
    title: Communication skills
    theme: t-bg-supporting3
    copy: |
      These are some of the communication skills that can help you improve relationships with internal and external customers. 
    subInc: 
      type: accordion
      content:
        - 
          title: Appear engaged
          copy: |
            If you're talking to a customer and you appear to be distracted or uninterested, they're very likely to find that rude. Keep your attention focused on them, show that you're interested, and keep eye contact. It's a good idea to remove potential distractions, like putting your phone on silent and out of reach.  
        - 
          title: Informing
          copy: |
            When you're communicating with customers, they'll expect you to be able to answer their questions. Make sure you have all the knowledge you need to inform them what they need to know. 
        - 
          title: Ask questions
          copy: |
            All communication is two-way and asking questions will bring the customer into the conversation. Even simple questions like "How did you hear about us?" can help the customer feel closer. Just be careful not to ask questions that seem too forward or personal. Asking questions is an important part of active listening. 
        - 
          title: Negotiate
          copy: |
            Negotiating means finding an outcome that's acceptable to everyone. For example, a customer might agree to purchase your services, but only at a reduced rate. Or, a customer agrees to the original rate but you include an extra service that isn't a high cost to you to provide. 
        - 
          title: Remember and make a note of information
          copy: |
            This is vital if you want to create repeat customers. You're not expected to write a book's worth of notes after every customer interaction, but if you have people who keep using your services, try to remember personal details about them, at the very least their name. This is another part of active listening. 
        - 
          title: Be professional
          copy: |
            Have you ever been in a café waiting to be served and saw the staff were watching a video on someone's phone together and laughing, instead of taking your order? We've probably all encountered situations like this – the staff are being unprofessional. When you interact with customers, **be professional**. Show your interest, avoid distractions, and make them feel like they're at the centre of your attention.  
        - 
          title: Treat the customer as an individual
          copy: |
            All customers are unique, no matter if they're internal or external. Treat them like the individual they are. That means being attentive to their needs, responding to their worries, and not making them feel like you're rushing them. Be respectful of their decisions, even if they decide not to use your services.  
  -
  -
    title: Communication methods 
    theme: t-bg-primary
    copy: |
      The principles we described above can be used in different communication methods. Here are some of the methods you might use to communicate with customers. 

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Face-to-face
          text: |
            This help customers feel like they're the centre of your attention. It allows for a great deal of flexibility in negotiating, but it can also be tiring for both parties over time. 
          img: lts_u2_s5_p4_slide1.svg
        -
          title: Email
          text: |
            This is more suitable for long-distance customer relationships, especially with established customers. Emails are universally used so customers are likely to understand them, but they can also be impersonal.  
          img: lts_u2_s5_p4_slide2.svg
        -
          title: Instant messaging
          text: |
            A lot of companies use instant messaging as a form of customer communication. Instant messaging feels more personal than emails, while retaining the advantage of allowing long-distance communication. However, some companies rely on using scripts for instant messaging which can sound forced or alien. 
          img: lts_u2_s5_p4_slide3.svg
        -
          title: Phone and video calls
          text: |
            Phone calls have long been a part of customer relationships, though video calls are mostly used in professional services. They allow for long-distance communication and are highly flexible, but tend to have to be scheduled in advance and depend upon technology working properly. 
          img: lts_u2_s5_p4_slide4.svg
  -

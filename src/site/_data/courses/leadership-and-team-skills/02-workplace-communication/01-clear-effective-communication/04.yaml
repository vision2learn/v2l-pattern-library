title: Communication methods
intro: |
  On this page, you will learn about the best use of methods of communication. 
banner: placeholder.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure you explain communication methods and their best uses when communicating with the team.
  -
  -
    title: Methods of communication
    theme: t-bg-primary
    copy: |
      We've already discussed the main categories of communication: written, oral, nonverbal, and visual.  
      
      Now, we're going to look at the specific methods in these categories in more detail, and give you some advice about how to best use them. 

    subInc: 
      type: reveal
      content:
        -
          title: Email
          copy: |
            Emails are a great method for sending long and important communications, but don't make them longer than needed. If you have to send someone a long message, such as briefing them about a new project, email is ideal for this.
          img: placeholder_icon.svg
        -
          title: Instant messages
          copy: |
            These are great for casual and social chatting, or to quickly talk about specific work queries, such as asking where a file or piece of equipment is located. Instant messaging isn't suitable for more formal or important communication, such as disciplinary matters.
          img: placeholder_icon.svg
        -
          title: Phone and video calls
          copy: |
            These are best if you have to talk to people who aren't in the same location as you are. Often, phone and video calls are best suited if a longer conversation has to be had about an element of work or performance. It's best to have an agenda in place and a cut-off time to keep the call focused.
          img: placeholder_icon.svg
        -
          title: Face-to-face discussions
          copy: |
            The most flexible method! These are suitable for almost everything – informal catchups, discussions about career decisions, briefings on new projects, and so on. For formal conversations, you should spend time thinking about what you're going to say in advance. Preparing and bringing notes with you can be appropriate sometimes too, but think about the situation first.
          img: placeholder_icon.svg
        -
          title: Letters
          copy: |
            Letters are often used for very important and formal communications. Think very carefully about your audience before writing and sending a letter. If you're posting it, consider which class of post to use. If you're sending something sensitive, received post is recommended. Remember that letters can often be sent as attachments to emails, too.
          img: placeholder_icon.svg
  -
  -
    title: Advantages and disadvantages
    theme: t-bg-supporting3
    copy: |
      Here are the main advantages and disadvantages of each of these methods of communication. Remember, think carefully about the context and audience of each communication when choosing the method.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Emails
          text: |
            The main advantage is that emails are instantaneous, can carry almost unlimited information, and can have attached files. But they can feel impersonal, can't be taken back when they're sent, and can be prone to causing information overload. 
          img: placeholder_icon.svg
        -
          title: Instant messages
          text: |
            The main advantage of instant messages is they're instant! They can be sent and read almost at the same time, meaning you can have real-time conversations. But it can be easy to accidentally give someone the wrong impression if you word your messages wrongly. 
          img: placeholder_icon.svg
        -
          title: Phone and video calls
          text: |
            Phone and video calls are the closest you can get to face-to-face conversations without actually being in the same room, meaning they can feel very personal, and you can allow lots of different people to take part. But they can become unfocused or overlong too. 
          img: placeholder_icon.svg
        -
          title: Face-to-face conversations
          text: |
            They are a very natural way of communicating which we're all used to. But it can be difficult to talk about important or personal topics this way, and like phone and video calls they can lose their focus too. 
          img: placeholder_icon.svg
        -
          title: Letters
          text: |
            Sometimes, the parties involved in communication can have different interpretations of what was said. There are even some occasions where people involved might want to lie about this. Keeping accurate records can act as proof of what was – and what wasn't – said.
          img: placeholder_icon.svg
  -
  -
    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Case study - Body language

      Fatima, the team leader at The Pickled Cucumber needs to have a conversation with Mark, one of the waiters, about his performance. He's been frequently late to his shift, often appears tired and anxious, and some customers have said he's been irritable with them. 
      
      She's going to have a conversation with him face-to-face to find out what's going on.
    
    subInc: 
      type: accordion
      content:
        - 
          title: Appearance
          copy: |
            Your appearance should be appropriate for the conversation you're having. In interviews or formal procedures, you should dress smartly and sensibly. Casual wear is more appropriate for informal conversations and can help everyone feel at ease. 
            
            Fatima has decided she wants to appear semi-formal. This is going to be an informal conversation because it relates to Mark's performance, but she doesn't want to intimidate him.
        - 
          title: Body language
          copy: |
            Body language is everything we do physically in a conversation. How we sit, how we stand, and what we do with our arms, legs, and hands. Your body language should reflect the context of the conversation, for example, in an interview, it wouldn't be appropriate to lean back in your chair and stretch!  
            
            Fatima has decided it'll be best for her and Mark to talk while sitting down in her office. But she's brought in two chairs so they can sit opposite each other, away from her desk. Sitting down together can help people feel more equal, and being away from her desk makes her feel more approachable.  
        - 
          title: Impact
          copy: |
            This is the overall impression you want to give someone in a conversation. You might want to impress them with your confidence, put them at ease, or reassure them that you're calm and controlled.  
            
            Fatima is worried about Mark's wellbeing and how that relates to his performance. She wants him to feel like he's in a conversation where he can express himself and will be heard.  
        - 
          title: Outcome
          copy: |
            Fatima can see that Mark is nervous when he comes into the office. She's made sure that there's a bottle of water and two glasses to hand. 

            Once they've sat down, she explains to Mark that there have been concerns raised about his performance and wellbeing. She uses a soft, but formal tone, because this conveys her authority without making Mark feel worried. She makes sure she isn't taking a defensive posture, so she keeps her arms and legs uncrossed.  

            During their conversation, Mark explains that he and his partner recently broke up and he's having to find a new flat. He didn't want to tell people at work because he was embarrassed, and he's sorry it's impacted on his performance. Fatima reassures him that his wellbeing is her priority, so they agree he can take a week off while he finds a new flat, and to give himself time to reset.
          img: /images/svg/lts/lts_u1_s1_p3_slide2.svg
  -
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        What do you think Fatima did right when she was communicating with Mark? Which methods did she use?  
        
        Make a note of communication methods and their best uses when communicating with the team. You could also carry out additional research to find examples that you could use in your assessment. Make a note of these in the box provided.

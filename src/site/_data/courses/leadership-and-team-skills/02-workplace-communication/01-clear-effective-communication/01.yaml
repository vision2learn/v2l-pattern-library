title: Welcome to Unit 2
intro: |
    ### Communication in the workplace
    
    In Unit 2, you will learn about the importance of effective communication in the workplace, methods of communication, maintaining accurate records of communication, and presenting a positive impression to those outside the team. 

banner: lts_u2_s1_p1_communication1.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit you will gain the knowledge and understanding required to be able to meet the learning outcomes in your learning goals. 

      You will understand the importance of:

      1. Effective communication
      2. Methods of communication in the workplace and with people outside the team
      3. Maintaining accurate records of communication
      4. Presenting a positive impression to those outside the team
      [View the complete set of learning outcomes for this unit.](/pdfs/)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      
      * Why clear and effective communication is essential in the workplace 
      * The key stages in the communication process 
      * Potential barriers to communication and outline how these could be overcome 
      * The best methods of communication
  -
    title: Methods of communication in the workplace
    theme: t-bg-primary
    copy: |
      We've talked about different methods of communication already, but now we're going to look at them in the workplace. 
    subInc: 
      type: accordion
      content:
        - 
          title: Oral
          copy: |
            * Group meetings: These can be regular catch-ups, briefings about new projects, or discussions about important changes. These are helpful when a lot of people need to hear about something or are expected to contribute. 

            * One-to-ones: These are more intimate and personal. They're suitable for conversations which might be a bit delicate, such as performance or pay issues, or just if there's a specific issue not relevant to other people. 

            * Phone calls: These can be used for lots of different work purposes between people who aren't in the same location, such as long briefings or short catch-ups. 
            
          img: /images/svg/lts/lts_u2_s3_p2_accordion1.svg
        - 
          title: Written
          copy: |
            * Reports: Many workplaces require written reports to be made to document usual business practices. They also usually require them to be written if serious incidents occur, like injuries, criminal conduct, or gross misconduct.

            * Memos: You may find that memos – small pieces of paper with a sticky back – are used by different workplaces as a way of informally recording ideas or conversations.  

            * Letters: There are different situations where employers may communicate via letter, such as job offers, formal warnings, or dismissals.  
            
          img: /images/svg/lts/lts_u2_s3_p2_accordion2.svg
        - 
          title: Electronic
          copy: |
            * Email: Many workplaces heavily rely on email as a form of communication for all manner of business processes, such as briefings, company updates, important events, and so on. 

            * Instant messenger: Often used in workplaces where employees work at a distance from each other and need to communicate quickly, such as if they're coordinating a project.  

            * Video calls: These are often used as a surrogate for physical meetings or one-to-ones if people aren't in the same location as one another. 
          img: /images/svg/lts/lts_u2_s3_p2_accordion3.svg

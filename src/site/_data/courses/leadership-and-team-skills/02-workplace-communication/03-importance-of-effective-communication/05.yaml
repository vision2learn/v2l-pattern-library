title: What did you learn? 
intro: Well done, you’ve now completed the third session of this unit! 
banner: summary.jpg
sections:
  -
    title: Summary
    theme: t-bg-primary i-summary
    copy: |
      In this session, you have learnt about:
      * The importance of effective communication in the workplace
      * The possible impacts of poor communication in the workplace
      * Methods to communicate in the workplace
      * The advantages and disadvantages of identified communication methods and their best use
      * Barriers to communication and explain how these could be overcome
      * The positive benefits of effective communication

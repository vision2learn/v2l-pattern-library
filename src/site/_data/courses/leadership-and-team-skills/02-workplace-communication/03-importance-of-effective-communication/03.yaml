  -
    title: Quick quiz
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        Which of the following are advantages of group meetings?:
          answers:
            Can bring together a lot of people and cover a lot of information: true
            Suitable for dispersed workforces: false
            Instantons record always available: false
        Which of these is NOT a disadvantage of emails?:
          answers:
            Generate wastepaper : true
            Can cause information overload : false
            Can be impersonal : false
            Can be sent to the wrong people by accident : false
        Which of the following is an advantage of reports?:
          answers:
            Instantaneous: false
            Very flexible: false
            Can be highly targeted and precise: true
            There is no record of events: false    

title: The importance of effective communication
intro: |
  In this session you will learn about the importance of effective communication in the workplace.
banner: lts_u2_s3_p1_effective_comms.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * The importance of effective communication in the workplace
      * The possible impacts of poor communication in the workplace
      * Methods to communicate in the workplace
      * The advantages and disadvantages of identified communication methods and their best use
      * Barriers to communication and explain how these could be overcome
      * The positive benefits of effective communication 
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      Make sure you can explain the importance of effective communication in the workplace.
  -
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Communicating in the workplace
      
      In this video, you'll find out about importance of effective communication in the workplace. 

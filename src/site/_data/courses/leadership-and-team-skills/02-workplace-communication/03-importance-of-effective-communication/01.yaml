  -
    title: Quick quiz
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        Is the following statement true or false? "Effective communication isn’t relevant for employee engagement.":
          answers:
            True: false
            False: true
        Is the following statement true or false? "Effective communication encourages loyalty.":
          answers:
            True: true
            False: false
        Is the following statement true or false? "Effective communication doesn’t help with employee wellbeing.":
          answers:
            True: false
            False: true
        Is the following statement true or false? "Effective communication boosts productivity.":
          answers:
            True: true
            False: false

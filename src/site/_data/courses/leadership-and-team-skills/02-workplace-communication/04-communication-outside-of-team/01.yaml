title: Communicating outside the team
intro: |
  In this session, you will learn about the importance of effective communication with people outside the team. 
banner: placeholder.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * Why effective communication with those outside the team is important
      * Methods of communicating with those outside of the team
      * The advantages and disadvantages of each method
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure you can explain why effective communication with those outside the team is important.
  -
    title: Communicating with people outside of the team
    layout: media
    theme: t-bg-primary
    copy: |
      Businesses create teams because they're efficient. They allow businesses to chunk up their business processes (anything from creating an app to running a kitchen) into smaller, distinct elements with people dedicated to them. But teams can sometimes become too inward-looking.  

      It's not only important that teams can communicate effectively within themselves. They need to be able to do that with people outside of the team. 

      Here are some reasons why that's important: 

      * It means teams don't become too insular – they're opening themselves up to new ideas coming from outside, which they might not have thought of themselves.
      * It helps stop teams from forgetting where they are – just like the people in a team need to all pull together, the teams in a business need to all be working together too, otherwise, business goals will be missed. 
      * It humanises the team – people might think of uncommunicative teams as being unsociable or distant; regular communication softens the image and makes the team easier to understand and appreciate. 
      * It builds relationships – being able to communicate outside of the team can reveal career opportunities, help with networking, and produce new opportunities for working together. 

    img: /images/svg/placeholder_icon.svg
  -
  -
    title: How to communicate with those outside of the team
    theme: t-bg-supporting2
    copy: |
      There are some simple things to remember about communicating with those outside of the team. 
    subInc: 
      type: accordion
      content:
        - 
          title: Why
          copy: |
            Why do you need to communicate? Identifying this will help you target the communication. Maybe the team has run into an unexpected problem, or you just want to build bridges.
        - 
          title: Who
          copy: |
            You need to know who you should be talking to. Is it the leadership of another team, people in a particular job role or who have a certain skillset, or is it the entire business?
        - 
          title: What
          copy: |
            You need to know what it is you're saying. Make it clear why you're reaching out and what it is you're trying to say. Be as precise as possible.
        - 
          title: How
          copy: |
            When you've determined the why, who, and what, you need to decide how you're going to communicate. It's very important that you figure this out because using the wrong channel or method can ruin the message.           
  -
  -
    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Case study - The Pickled Cucumber's teams 

      There are two main teams at The Pickled Cucumber – the kitchen staff and the servers. The kitchen staff's shared goal is cooking tasty meals that meet the customer's expectations. The servers' shared goal is making sure the customers' orders are accurately communicated to the kitchen and the food is delivered to the right customers. 
      
      Here's what can go wrong when teams aren't communicating effectively outside of themselves.  
    subInc: 
      type: accordion
      content:
        - 
          title: Imprecise and bad channels
          copy: |
            Nicky, one of the waitresses, was dealing with too much at once. 

            "One of the customers knocked over a bottle of wine and it broke on the floor. At another table, a child had been sick. And the order I'd just taken had some special dietary requirements. But I was so focused on making sure the glass got picked up and the table cleaned, I forgot to mention it to the kitchen staff. Thankfully I noticed the dish had peanuts on it before it went to the customer…" 

            This is an example of what happens when communication between teams isn't precise and doesn't have good channels. For important information like this, there should be a specific method of communication to make it harder for that information to get lost. 
          
        - 
          title: Failure to coordinate
          copy: |
            Gary is one of the chefs in the kitchen. His dish, stuffed aubergine with chilli sauce, has proved so popular that he's run out of ingredients. He can only make another two dishes… 

            "I told the serving team that we couldn't accept more orders for that dish, but three more customers had already ordered it by the time the servers were told. The customers had to be told they couldn't have what they'd ordered. They weren't happy, I can tell you…" 

            This is an example of teams not coordinating with each other. If the servers had been told earlier, they could have taken it off the menu to avoid disappointing the customers. When there are parallel processes between teams, it's very important to make sure there are channels for them to coordinate easily.
        - 
          title: Conflict
          copy: |
            Sarah is the head server. The head chef is Ranu. 

            Sarah has heard what's happened with the order containing peanuts and the other orders not being delivered. Ranu has also heard about this. The two of them have a short meeting three times a week; when they next sit down they both start blaming each other. This damages their working relationship.  

            This could have been avoided altogether if better channels had been set up in the first place.  
          img: /images/svg/lts/lts_u1_s1_p3_slide2.svg
  -

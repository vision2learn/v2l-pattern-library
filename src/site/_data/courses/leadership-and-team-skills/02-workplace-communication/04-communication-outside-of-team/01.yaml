    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        What communication problems occurred at The Pickled Cucumber? How do you think they could have been avoided? 
        
        Make a note of why effective communication with those outside the team is important. You could also carry out additional research to find examples that you could use in your assessment. Make a note of these in the box provided. 

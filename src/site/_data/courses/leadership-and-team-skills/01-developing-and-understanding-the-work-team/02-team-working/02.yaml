title: Working in a team - pros and cons 
intro: |
  On this page you will learn about the advantages and disadvantages of working in a team. 
banner: lts_u1_s2_p2_pros_cons.jpg
sections:
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Advantages and disadvantages of working in a team

      In this video, we’re going to talk about the strengths and the weaknesses of working in a team.
    video: lts_u1_s2_p2_strengths_weaknesses.mp4
  -
    title: Key point
    theme: i-keypoint
    copy: |
      Make sure you can list the advantages and disadvantages of working in a team. 
  -
    title: Quick quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Shaper is the person who gives the team momentum and direction.
          answer: Shaper
        -
          sentence: Plant is the creative lateral thinker who finds unexpected solutions.
          answer: Plant
        -
          sentence: The curious one who is always on the hunt for new ideas is Resource investigator.
          answer: Resource investigator
        -
          sentence: Teamworker prioritises the harmony of the team. 
          answer: Teamworker
        -
          sentence: Specialist is the expert in a relevant field.
          answer: Specialist
        -
          sentence: The logical analyst who likes to keep things objective is Monitor evaluator.
          answer: Monitor evaluator
        -
          sentence: Complete finisher makes sure all the work is up to the right standard. 
          answer: Complete finisher
        -
          sentence: Co-ordinator keeps the team’s focus on its objectives and makes appropriate delegations.
          answer: Co-ordinator
        -
          sentence: Implementer is creates the strategic plan that gets the team’s objectives done.
          answer: Implementer
    theme: i-quiz
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        Make a note of the advantages and disadvantages of working in a team. You could also carry out additional research to find examples that you could use in your assessment. Make a note of these in the box provided.
  -
  -
    title: Teams, individuals, organisations

    theme: t-bg-primary
    layout: media
    copy: |
      It’s important to remember that when weighing up the advantages and disadvantages of team working, you shouldn’t just be thinking about what’s good for individuals – you need to think about what’s good for the organisation too.  
      
      But that doesn’t mean you shouldn’t override the preferences and opinions of the people involved either – the important thing is to find the right balance between organisational and individual needs when it comes to working in teams.
    img: /images/svg/lts/lts_u1_s2_p2_image1.svg

    copy: |
      ### Creating and maintaining an effective team 
      
      In this video, you’ll find out about how to create and maintain an effective team. 

    video: lts_u1_s3_p3_effective_team.mp4
  -
  -
    title: Maths and English skills 
    theme: t-bg-primary
    copy: |
      In all workplaces, it’s important to possess basic skills in maths and English. These skills have universal value, meaning that they are useful in every industry, role, and walk of life.  
      
      For example:
      * Maths skills will make you confident when dealing with money or thinking about timekeeping and resourcing 
      * English skills will make a better communicator, helping you understand other people and make yourself understood to them 
      
      If you don’t feel like you’re confident with your maths and English skills, you might want to explore options for additional training or qualifications in those areas.  

title: Welcome to Unit one
intro: |
  Welcome to the course!
  
  This Leadership and Team Skills course contains six mandatory units. To achieve your Level 2 Certificate in this subject, you need to complete all six units.

  These units are going to cover topics including developing the work team, workplace communication, diversity and legal guidelines in the workplace, conflict management and discipline, meeting customer needs, and innovation and change.
  

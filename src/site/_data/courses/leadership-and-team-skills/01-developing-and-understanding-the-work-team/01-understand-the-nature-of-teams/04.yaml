  -
    title: Developing relationships
    theme: t-bg-primary1a
    copy: |
      A very important part of having a healthy, positive, and successful workplace environment is for people to develop relationships with each other. That means learning to see people as more than just colleagues, but as people too. This helps us respect each other, and it encourages us to work together better with less chance of conflict.
      
      Relationships should be kept appropriate to the workplace. People should remain mindful of the standards they’re expected to work to, and what conduct is and isn’t appropriate in a place of work. 

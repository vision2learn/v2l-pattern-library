title: Understand the advantages of team working
intro: |
  In this session you will learn about the advantages and disadvantages of team working. 
banner: placeholder.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about the:
      * responsibilities of team members 
      * advantages of working in a team 
      * disadvantages of working in a team 
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure you can identify the responsibilities of team members.
  -
  -
    title: Team roles
    theme: t-bg-supporting3
    copy: |
      In a team, you’ll find that similar roles and behaviours tend to organically develop. This is generally true of all healthy teams, regardless of the industry or area of work. 

      We’ve used the Belbin model for this example. In the Belbin model, there are nine team roles.

      See below to learn more.
    subInc: 
      type: accordion
      content:
        - 
          title: Resource investigator
          copy: |
            The resource investigator is the curious one – they’re the one in your team who’s always researching new approaches, methods, and ideas, and then sharing them with the rest of the team. 
        - 
          title: Teamworker
          copy: |
            The teamworker puts the team first. Their priority is keeping the team happy and harmonious, and they will go the extra mile to prevent conflicts and friction in the team.  
        - 
          title: Co-ordinator
          copy: |
            The co-ordinator is highly focused on the objectives the team is working towards. They make sure that tasks are being delegated to the right people and that the team’s goals are properly explained to everyone.  
        - 
          title: Plant
          copy: |
            The plant is the lateral thinker – they’re the one who finds the solution to the problem that no one expected. They’re a creative free thinker who’s great at solving knotty problems.
        - 
          title: Monitor evaluator
          copy: |
            The logical analyser – they focus on the facts so they can make decisions as objectively as possible.
        - 
          title: Specialist
          copy: |
            They’re the expert in a particular field that’s relevant for the team. 
        - 
          title: Shaper
          copy: |
            The shaper is the engine that keeps the team moving. They give direction and motivation to the team.
        - 
          title: Implementer
          copy: |
            The implementer is the planner – they’re the ones who look at the team’s goals and figure out the best way to get there.  
        - 
          title: Complete finisher
          copy: |
            The complete finisher is the quality controller. They look at the work that has been done to make sure it is to the correct standard.
                
  -
  -
    title: Benefits of taking on responsibility
    theme: t-bg-primary
    copy: |
      Understanding team roles is the first step to giving team members responsibilities. Being able to effectively delegate is a key skill for a team leader. 
      
      Team members taking on responsibilities reduces the amount of time you need to spend micro-managing your team. It allows you to focus on more important, strategic tasks. It also empowers team members, making them feel in control of their own work and encouraging them to think about their future career development.
  -

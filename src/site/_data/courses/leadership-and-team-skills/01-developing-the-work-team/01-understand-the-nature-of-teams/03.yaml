  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        Make a note of the differences between a team and a group. You could also carry out additional research to find examples that you could use in your assessment. Make a note of these in the box provided. 
  -
  -
    title: The benefits of teams
    theme: t-bg-supporting2
    copy: |
      Although there are situations where groups are appropriate, there are several benefits to teams.

      See below to learn more.
    subInc: 
      type: accordion
      content:
        - 
          title: Communication
          copy: |
            Because individuals in a group are all pursuing individual goals, they have little incentive to communicate with each other. However, as a team is a collective pursuing a shared goal, communication is a constant feature. This means people in a team will be transparent with one another, keeping clean lines of communication open, so that everyone can work together.
            
          img: /images/svg/placeholder_icon.svg
        - 
          title: Collaboration
          copy: |
            A shared goal requires shared effort. If it was possible for one person to achieve it, there wouldn’t be a team! Achieving a shared goal means that people with different skill sets, talents, and specialisms collaborate. This encourages an environment where people help each other because they understand it isn’t possible for one person to do all the work. Teamwork is collaboration in practice.
            
          img: /images/svg/placeholder_icon.svg
        - 
          title: Problem solving
          copy: |
            Achieving a shared goal means solving a problem. How do we get to the goal? What’s the best way to get it? What are the blockers? By embodying the collaborative spirit, along with good communication, teams are problem-solving machines. If everyone contributes their effort and knowledge, there are few problems the right team can’t solve.
            
          img: /images/svg/placeholder_icon.svg
  -

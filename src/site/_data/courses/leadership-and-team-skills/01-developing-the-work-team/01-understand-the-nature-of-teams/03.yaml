title: Understand the nature of teams
intro: |
  On this page you will learn how teams differ from groups in the workplace.
banner: lts_u1_s1_p3_teams.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure you can explain how teams differ from groups in the workplace.
  -
    title: Teams vs groups
    layout: media
    theme: t-bg-primary
    copy: |
      Groups and teams may appear superficially similar. Both involve more than one individual, and both involve individuals having to work together. But the difference between them is important to grasp.  

      A group is a collection of individuals who have individual goals. These goals may overlap somewhat, but there isn’t a single, shared goal that brings everyone in the group together. There are different reasons why a group might exist – it may be more convenient for the organisation to group individuals together so they can share ideas, even when working towards different goals, for example creating an informal brainstorming group of people from related disciplines. But the important thing is, whatever the shared identity in the group, the individuals aren’t all working towards the same goal.  

      In a team, the individuals involved share a common goal that they are working together to achieve. This is a specific and clearly defined goal which requires joint effort and coordination to achieve. For example, a team might be a group of individuals with IT experience working to migrate their company from one suite of software to another. 

    img: /images/svg/lts/lts_u1_s1_p3_image1.svg
  -
  -
    title: What’s the difference between teams and groups?
    theme: t-bg-primary1a i-casestudy
    copy: |
      To help you understand, here are two examples each of teams and groups.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Team - Developing an app
          text: |
            Magic Co. is a gaming platform. They want to provide an app to give gamers who use their platform a more flexible experience by allowing them to play their games on the go. They gather a group of their best developers together with the shared aim of producing a new app. Because everyone has the same go – developing the app – this is an example of a team.
          img: lts_u1_s1_p3_slide1.svg
        -
          title: Team - Kitchen staff
          text: |
            The staff in the kitchen at The Pickled Cucumber, a vegetarian restaurant, form a team as well. They’ve all got the same shared goal – preparing and delivering their customers’ orders correctly, to the right standard, and in good time. The key thing is that everyone in the team shares the same goal, whatever that goal is.
          img: lts_u1_s1_p3_slide2.svg
        -
          title: Group - work social club 
          text: |
            Lots of workplaces recognise that people who work together will also want to get to know each other socially. This helps colleagues find out what they have in common and feel more relaxed with each other. A workplace social club, like a book club or a baking club, is an example of a group because everyone involved shares something in common, but they’re not working towards a shared goal.
          img: lts_u1_s1_p3_slide3.svg
        -
          title: Group - support at work
          text: |
            In modern workplaces, diversity is recognised as very important. To be more inclusive, and to encourage wellbeing, workplaces often have support groups. Examples include LGBTQ+ groups and groups for people who belong to ethnic minorities. These are groups, rather than teams, because everyone involved has something in common but there isn’t a particular target or goal they’re trying to achieve.
          img: lts_u1_s1_p3_slide4.svg

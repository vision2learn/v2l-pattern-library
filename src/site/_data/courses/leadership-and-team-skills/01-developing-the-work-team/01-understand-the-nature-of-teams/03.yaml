  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      Make sure you can describe the stages of team development using a recognised model.
  -
  -
    title: Stages of team development
    theme: t-bg-primary
    copy: |
      Every team is unique and will follow its own development path. And there are also more than one ways of modelling team development too. But there are general principles that apply to most teams, and you need to understand at least one model of team development.  
      
      We’ve used Tuckman’s Model for this example of the stages of team development.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Forming
          text: |
            In the initial stage of team development, the individuals in the team will need guidance from their leader. They’ll have a lot of questions about the team’s purpose, how they fit in with it, and what the expectations are for them. Some people are likely to feel nervous, so be aware of that and make sure you’re available to answer questions and reassure.  
          img: placeholder_icon.svg
        -
          title: Storming
          text: |
            Once the team gets settled and its purpose becomes clear, conflicts may emerge. This may be partly because the plan has started to encounter reality (and things never go entirely to plan!) and because people’s personalities and ways of working are making themselves felt. It’s important that people are very clear on what their roles and responsibilities are, and that you make it clear that you have authority over the team too.  
          img: placeholder_icon.svg
        -
          title: Norming
          text: |
            At this point, things have settled down and the team has found its groove. People are working together, differences are less important than similarities, and your authority is clear. Because everyone should be more comfortable with one another, it’s good to encourage asking for and giving out constructive feedback.  
          img: placeholder_icon.svg
        -
          title: Performing
          text: |
            The team is now achieving its expected goals and has met its efficiency targets. The roles and responsibilities that were initially allocated may have altered somewhat by this stage, and team members will be happier working outside their comfort zone. 
          img: placeholder_icon.svg
  -
  -
    title: Quick quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: A Group is a collection of individuals who have individual goals. 
          answer: Group
        -
          sentence: Communication, Collaboration, and problem solving are all benefits of teams. 
          answer: Collaboration
        -
          sentence: Storming is the stage in team development where conflicts may start emerging. 
          answer: Storming
        -
          sentence: Forming is the initial stage of team development. 
          answer: Forming
        -
          sentence: Norming is the stage in team development where your team’s structure is more or less settled. 
          answer: Norming
        -
          sentence: Performing is the stage in team development where your team is achieving its goals. 
          answer: Performing
    theme: i-quiz 

    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        Make sure you can give examples of the kind of policies organisations have in place to protect employees’ statutory rights under UK law. These could be examples from your own workplace. You could also carry out additional research to find examples that you could use in your assessment. Make a note of these in the box provided.


title: Organisational policies 
intro: |
  On this page, you’ll learn about organisational policies that cover employee statutory rights under UK law. 
banner: lts_u3_s1_p3_organisational_polices.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure you can explain organisational policies that cover employee statutory rights under UK law. 
  -
  -
    title: Organisational policies
    theme: t-bg-primary
    copy: |
      In order to follow the law and respect the statutory rights of their employees, organisations will have policies in place that cover these rights. These policies are not laws – they are the protocols the organisation has developed that makes sure they’re not breaking any laws. 
      
      Here are some policies which organisations need to have in order to obey the laws around statutory employee rights. 

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Equal opportunities and diversity
          text: |
            Equal opportunities policies mean that everyone employed or seeking employment by an organisation is treated fairly. This protects people from being discriminated against.  
            
            Diversity policies are about recognising and respecting the differences between people, and making sure that people from minority groups (such as gender, sexual, or racial minorities) are represented throughout the organisation.  
          img: lts_u3_s1_p3_slide1.svg
        -
          title: Health and safety 
          text: |
            A health and safety policy describes the steps an organisation takes to make sure its employees are safe at work. The policy should clearly describe who is responsible for each part of the policy. It should always be shared with all employees, and employees should be told if there are any changes. 
          img: lts_u3_s1_p3_slide2.svg
        -
          title: Discipline and dismissal
          text: |
            Matters relating discipline and dismissal are often very delicate. There always should be a policy in place describing the mechanisms at play to avoid acting arbitrarily and violating statutory rights. 
            
            It should always be obvious to employees what standard they’re expected to reach with their work, what behaviour and language is acceptable, and what enforcement measures are in place. Disciplinary measures always ought to be proportional and respectful of statutory rights. Likewise, dismissals should be carried out in a way respectful of the law and the employee’s rights and dignity.  
          img: lts_u3_s1_p3_slide3.svg
        -
          title: Grievances
          text: |
            If an employee has a problem at work, they always should to feel like they can raise it safely. There should be policies in place that allow employees to honestly express how they feel if they’re concerned about work practices, health and safety, their relationship with colleagues, or if they feel unsafe or harassed for any reason. These policies should be clear to everyone and effective.
          img: lts_u3_s1_p3_slide4.svg

title: Welcome to Unit 3
intro: |
    ### Workplace diversity and legal guidelines
    
    In this unit you will learn about the statutory rights of employees under UK law, organisational policies that cover these rights, the purpose and importance of contracts, and the importance of diversity in the workplace.

banner: lts_u3_s1_p1_diversity_and_legal.jpg
sections:
  -
    title: Introduction
    theme: t-bg-primary1a
    copy: |
      In Unit 3, you will learn about the statutory rights of employees under UK law, organisational policies that cover these rights, and the purpose and importance of contracts. You will also learn about the responsibilities of a team leader under an organisation’s dismissal and disciplinary policy, organisational policies around equality and diversity in the workplace, and how to promote equality and diversity in the team.
      
      We will also look at the referral process when inappropriate behaviour that is outside the team leader’s authority to deal with, and the possible implications for a team leader when individuals’ views clash with organisational expectations.
  -
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit you will gain the knowledge and understanding required to be able to meet the learning outcomes in your learning goals. 

      You will understand:

      1. The importance of working with organisational and legal guidelines
      2. The importance of diversity in the workplace
      3. How to contribute to a positive workplace environment

      [View the complete set of learning outcomes for this unit.](/pdfs/v2l_lts_learning_outcomes_u3.pdf)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      
      * The statutory rights employees have under UK law
      * Organisational policies that cover employee statutory rights under UK law
      * Why a contract of employment is important

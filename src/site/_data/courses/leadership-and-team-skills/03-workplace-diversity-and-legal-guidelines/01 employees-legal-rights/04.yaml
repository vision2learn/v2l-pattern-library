title: Contracts
intro: |
  On this page, you will learn why a contract of employment is important.
banner: lts_u3_s1_p4_contracts.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure you explain why a contract of employment is important.
  -
    title: What is a contract? 
    layout: media
    theme: t-bg-primary
    copy: |
      A contract is a legally binding agreement that precisely explains the responsibilities two parties have towards one another. An employment contract explains what the employee’s duties and responsibilities are, which includes a job description, working hours, place of work, and the various standards they are expected to follow. It also describes the obligation the employer has towards the employee, including pay, holiday allowance, guarantees of fair and lawful treatment, and so on. 

    img: /images/svg/lts/lts_u3_s1_p4_image1.svg
  -
  -
    title: Why are contracts important?
    theme: t-bg-supporting3
    copy: |
      Now we’ve defined what contracts are, we can talk about what they’re important. 
    subInc: 
      type: accordion
      content:
        - 
          title: Legally enforceable 
          copy: |
            Contracts are legally enforceable. That means that the promises made in them have to be carried out otherwise there can be legal consequences. For example, if an employer say in an employment contract that everyone who works for them are guaranteed a certain number of breaks every day, but in practice the employer doesn’t provide those breaks, the employees have grounds to take matters to court if they’re not resolved. 
            
          img: /images/svg/lts/lts_u3_s1_p4_accordion1.svg 
        - 
          title: Formal record 
          copy: |
            A contract provides an official, formal record of the agreement between an employee and their employer. Verbal agreements are usually something that come before formal contracts, but these aren’t enforceable or official. By putting it into a contract, both parties can refer to the contract if there’s a disagreement.
            
          img: /images/svg/lts/lts_u3_s1_p4_accordion2.svg 
        - 
          title: Guarantor of pay 
          copy: |
            Contracts state in black and white the pay that employees should receive. This is very important because if an employer underpays an employee, whether deliberately or not, they can point to their contract and demand they be paid what’s been agreed. 
            
          img: /images/svg/lts/lts_u3_s1_p4_accordion3.svg
        - 
          title: Protection
          copy: |
            The contract protects before the employer and the employee. For the employer, it makes it clear what it expects from their employees, so if an employee acts inappropriately or fails to live up to the right standard, the employer can take the steps they need to protect their business. 
            
            Likewise, the employee can use their contract to protect them against mistreatment, unfair expectations, underpayment, and wrongful dismissal.  
            
          img: /images/svg/lts/lts_u3_s1_p4_accordion4.svg
  -
  -
    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Case study - The Pickled Cucumber

      Fatima at The Pickled Cucumber is devoted to the business, but she feels her goodwill is being exploited by the owner. She looks at her contract in preparation for the meeting. 
    subInc: 
      type: accordion
      content:
        - 
          title: Fatima's contract
          copy: |
            Fatima is a teamleader and she doesn’t mind working slightly longer than her contracted hours. She understands that she plays an important role in the business and a lot of people look to her for help.  

            But her contract also makes it clear that her working week is officially only 37.5 hours, and over the last month she’s had unofficial pressure put on her by the owner to work longer and longer. So she arranges a meeting with the owner and brings along a copy of her contract. 

            Fatima points out to Sarah the owner that she is contracted for 37.5 hours, and although there’s a clause in her contract stating that she may be occasionally expected to work outside of her normal hours, she feels that pressure that’s been put on her is unfair.  

            “I love working here and I don’t mind going the extra-mile, but there is a limit and I feel like my contract is being respected. So from now on, I won’t be intending to work outside of my normal hours unless you personally ask me 48 hours in advance.” 

            Sarah doesn’t want to upset or, even worse, lose Fatima. She apologises for making Fatima feel taken advantage of, and promises to show more respect for her time. They agree to Fatima’s request. 

            Because she had a contract and spent time familiarising herself with it, Fatima was able to leverage a reasonable demand and get the outcome she wanted from her employer.  
          img: /images/svg/lts/lts_u3_s1_p4_casestudy.svg

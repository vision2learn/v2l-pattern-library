title: Organisational policies, equality and diversity
intro: |
  In this session you will learn about team leaders responsibilities, employee grievance process, and equality and diversity in the workplace.
banner: lts_u3_s2_p1_policies_diversity.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * The team leader’s responsibilities under an organisation’s dismissal and disciplinary policy
      * The employee grievance process as defined in an organisation’s policy
      * The organisational policy on equality and diversity in the workplace and key legislation on this topic 
      * How a team leader can promote equality and diversity in their team
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      Make sure you can explain the team leader’s responsibilities under an organisation’s dismissal and disciplinary policy. 
  - 
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Team leader responsibilities
      
      In this video you’re going to learn about the responsibilities team leaders tend to have around an organisation’s dismissal and disciplinary policy. Bear in mind that this varies between organisations, and what we’re describing here is the general responsibiliites most team leaders will have. 

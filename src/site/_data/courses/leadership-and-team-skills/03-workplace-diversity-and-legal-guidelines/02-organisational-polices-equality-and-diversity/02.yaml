title: Accurate records
intro: |
  On this page, you will learn about the employee grievance process as defined in an organisation’s policy. 
banner: lts_u3_s2_p2_accurate_records.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure you can describe the employee grievance process as defined in an organisation’s policy. 
  -
    title: Grievance policies
    layout: media
    theme: t-bg-primary
    copy: |
      Grievances are situations where an employee is unhappy, often because they feel like their statutory and/or contractural rights aren’t being respected. 

      Organisations maintain formal grievance policies so that their employees can safely report problems or incidents. It’s important that a policy like this be in place because no one should ever have to feel scared to speak out if something is wrong – this is a statutory right.  

      The specifics will vary between organisations depending on their size, location, industry, and so on, so we’re going to be speaking in general terms about what a grievance policy should contain.

    img: /images/svg/lts/lts_u3_s2_p2_image1.svg
  -
  -
    title: What should a grievance policy contain? 
    theme: t-bg-supporting3
    copy: |
      Employers must have a grievance policy which is set out in writing and accessible by all employees. This is what it should contain.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Contacts
          text: |
            The grievance policy should state who an employee should contact if they have a grievance, and how they can do this. The policy should also give the details for an alternative person to contact if that person is unavailable.
          img: lts_u3_s2_p2_slide1.svg
        -
          title: Grievance hearing
          text: |
            The policy should say that if the grievance can’t be resolved informally – for example if two colleagues have a sharp disagreement and both of them feel like they’re firmly in the right – there should be a formal meeting with the employee who raised the grievance. This is called a grievance hearing.
          img: lts_u3_s2_p2_slide2.svg
        -
          title: Time limits
          text: |
            The grievance policy should give a time limit for each stage of the grievance process. This means the employee knows roughly how long it will take for their grievance to be addressed.
          img: lts_u3_s2_p2_slide3.svg
        -
          title: Appeal
          text: |
            The policy should explain how an employee can appeal a decision made about their grievance if they’re not happy about the outcome, such as if they feel their grievance hasn’t been viewed as serious enough to warrant action.  
          img: lts_u3_s2_p2_slide4.svg
        -
          title: Representation
          text: |
            The policy must state that employees can be accompanied in any meetings by another colleague or a union representative. 
          img: lts_u3_s2_p2_slide5.svg
        -
          title: Disciplinary action and grievances
          text: |
            The policy must explain what will happen if a grievance is raised during a disciplinary action. 
          img: lts_u3_s2_p2_slide6.svg
        -
          title: Grievances and contracts 
          text: |
            Although all employers have to have grievance procedures in place, these don’t have to be contained in an employment contract. However, if the grievance procedure is written into the contract, it has to be followed as described. If it isn’t, the employee can bring breach of contract against their employer.
          img: lts_u3_s2_p2_slide7.svg
  -
  -
    title: A grievance procedure
    theme: t-bg-primary
    copy: |
      Although the details will vary between organisations, this is a typical example of the steps followed in a grievance procedure.
    subInc: 
      type: accordion
      content:
        - 
          title: Informal discussion 
          copy: |
            Lots of organisations encourage their employees to try and resolve grievances informally at first. This doesn’t mean it would just be a chat over coffee though. It would still be correct to involve a manager to witness the discussion. If the parties don’t feel they can resolve the grievance informally, the formal process should be used.
            
            There are also situations where the grievance is so severe or sensitive it cannot be resolved informally. In which case, you’d skip this step altogether.
            
          img: /images/svg/lts/lts_u3_s2_p2_accordion1.svg
        - 
          title: Raising a formal grievance 
          copy: |
            If a grievance has to be raised formally, this should be done as soon as possible. The report should be detailed and precise. It should include examples of the problem, witnesses, and the employee’s preferred outcome.  

            The employee should contact the person designated for handling grievances in their organisation’s grievance policy. This is probably their line manager or a member of HR. The grievance will probably have to be raised in writing, or written down by the contact for the employee.  

            There will be a time limit for the contact to formally respond to the employee, usually within five days or a week. 
            
          img: /images/svg/lts/lts_u3_s2_p2_accordion2.svg
        - 
          title: Grievance meeting 
          copy: |
            The meeting should be held as soon as possible, usually between a week and a fortnight after the grievance is raised. The employee will be reminded that they can bring another colleague or a trade union representative with them for support and advice, and the organisation must make sure they can do this if they want. 

            The reasons behind the grievance and the employee’s preferred outcome will be discussed. Following the meeting, it may be necessary to investigate further before reaching a decision.  
            
          img: /images/svg/lts/lts_u3_s2_p2_accordion3.svg
        - 
          title: Investigations  
          copy: |
            Investigations usually involve fact finding, interviewing people involved, and reviewing the evidence that’s been submitted. People interviewed can include witnesses and the person the grievance has been made against. 
            
            Even if it isn’t necessary to formally interview them, if the grievance has been made against another employee, they must be informed about this and told what the allegations are, although it may not always be appropriate to share the written report of the grievance. 
            
          img: /images/svg/lts/lts_u3_s2_p2_accordion4.svg
        - 
          title: Grievance outcome 
          copy: |
            The outcome must be given to the employee who’s raised the grievance as soon as possible, such as within 14 days of the investigation being concluded. If the outcome affects other people, they must be told, but confidentiality around the people involved should still be respected.    
            
          img: /images/svg/lts/lts_u3_s2_p2_accordion5.svg
        - 
          title: Appeal 
          copy: |
            If the employee who raised the grievance isn’t happy with the outcome, they can appeal it. They’ll usually have a time window in which they need to do this, such as within a week of the outcome being given. They have to state the reason why they’re appealing the outcome. The case is then reviewed by their employer. 
            
          img: /images/svg/lts/lts_u3_s2_p2_accordion6.svg
  -
  -
    title: Quick quiz
    copy: 
    subInc: 
      type: word-quiz
      content:
        -
          sentence: An appeal occurs if the employee who raised the grievance is unhappy with the outcome.  
          answer: appeal
        -
          sentence: An informal discussion is a step that may be taken before the formal grievance procedure begins. 
          answer: informal discussion
        -
          sentence: The result of the investigation is the grievance outcome.
          answer: grievance outcome
        -
          sentence: Raising a formal grievance initiates the formal grievance process. 
          answer: Raising a formal grievance
        -
          sentence: A grievance meeting take place after the formal grievance has been raised. 
          answer: grievance meeting
        -
          sentence: Investigations determines what the outcome of the grievance should be.
          answer: Investigations
    theme: i-quiz

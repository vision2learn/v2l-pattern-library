    copy: |
      In this session, you have learnt about:
      * The team leader’s responsibilities under an organisation’s dismissal and disciplinary policy
      * The employee grievance process as defined in an organisation’s policy
      * The organisational policy on equality and diversity in the workplace and key legislation on this topic 
      * How a team leader can promote equality and diversity in their team 
  
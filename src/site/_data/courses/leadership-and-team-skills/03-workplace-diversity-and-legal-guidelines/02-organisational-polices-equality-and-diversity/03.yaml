title: Equality and diversity
intro: |
  On this page, you will learn about organisational policy on equality and diversity in the workplace and key legislation on this topic.
banner: lts_u3_s2_p3_equality_diversity.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure you can describe the organisational policy on equality and diversity in the workplace and key legislation on this topic. 
  -
    title: What does equality and diversity mean?
    layout: media
    theme: t-bg-primary
    copy: |
      Equality and diversity means treating everybody fairly. It’s against the law to discriminate against people based on protected characteristics like age, sex, sexual orientation, gender reassignment, or racial background. Diversity means making sure that people from minority groups have representation in a workplace.  
      
      Organisations are expected to have equality and diversity policies in place to make sure they obey antidiscrimination laws. This is part of the policies that cover statutory employee rights in the UK. And many organisations also have policies around making sure they hire people from minority backgrounds, because diverse workplaces are fairer and more creative. 

    img: /images/svg/lts/lts_u3_s2_p3_image1.svg
  -
  -
    title: Equality Act 2010
    theme: t-bg-supporting3
    copy: |
      The most important piece of legislation around equality and diversity is the Equality Act 2010. It replaced several older antidiscrimination laws and brought all their protections together into one act.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Protected characteristics
          text: |
            It’s against the law to discriminate against people based on: 
            * Age 
            * Sex 
            * Sexual orientation 
            * Gender reassignment  
            * Marrital or civil partnership status 
            * Being pregnant or on maternity leave 
            * Race, colour, nationality, ethnic or national origin 
            * Religious beliefs 
            This protection applies to work, education, using public services, and in many other areas.  
          img: lts_u3_s2_p3_slide1.svg
        -
          title: Types of discrimination
          text: |
            The Equality Act 2010 defines four kinds of discrimination. 
            * __Direct discrimination:__ Treating people with protected characteristics unfavourably compared with other people. An example of this would be refusing to hire someone because they’re transgender.  
            * __Indirect discirimination:__ Putting rules or policies in place which apply to everyone, but in practice are discriminatory against people with a protected characteristic. For example, a dresscode might inadvertently discriminate against some Muslim women who cover their hair for religious reasons.  
            * __Harassment:__ Unwanted behaviour connected to a protected characteristic that is offensive or undermines someone’s dignity. A manager who repeatedly makes fun of an employee for being bisexual would be committing harassment.  
            * __Victimisation:__ This is when someone is treated unfairly because they’ve complained about discrimination or harassment. If an employee complained they’re being harassed because they’re Black, and then found that people are making jokes about them being a whiner, they’re being victimised.  

          img: lts_u3_s2_p3_slide2.svg
        -
          title: Actions
          text: |
            The Act describes three actions you can take if you feel you’re being discriminated against. 
            * Complaining directly to the person or the organisation, such as by using the organisation’s grievance mechanism.  
            * Mediation or alternative dispute resolution, which is when someone is brought in to help sort out the situation.  
            * Making a claim in court at a tribunal. 
          img: lts_u3_s2_p3_slide3.svg
  -
  -
    title: An example policy
    theme: t-bg-primary
    copy: |
      As with grievances, equality and diversity policies vary between organisations, so we’re going to talk about what’s generally included in one. You may find that these policies are called “diversity and inclusion” or something similar.  
    subInc: 
      type: accordion
      content:
        - 
          title: Commitment
          copy: |
            The policy should explain the employer’s commitments to equality, diversity and inclusion. It should make it clear that protected characteristics will be respected. They should make it clear how they will react to discrimination or harassment in the workplace and refer to their grievance policy.  

            The employer may state they’re committed to only working with suppliers and clients who value equality and diversity, or refuse to do business in countries that don’t respect equal rights. 
            
          img: /images/svg/lts/lts_u3_s2_p3_accordion1.svg
        - 
          title: Expectations
          copy: |
            The policy will explain the expectations that employees should have from their employer about equality, diversity and inclusion. It will also explain what the employer’s expectations from their employees are.  

            For example, it should state that everyone who works for them can expect to feel protected and valued, with support available if they feel discriminated against or victimised. And likewise it should state that the employer expects all its employees to show one another grace and respect. 
            
          img: /images/svg/lts/lts_u3_s2_p3_accordion2.svg
        - 
          title: Achievement
          copy: |
            The policy should explain how it will achieve its commitments and expectations. It should describe the concrete steps it takes to create a safe and inclusive environment for all its employees.  

            For instance, they may collect data about their employees’ backgrounds so they can assess if there is evidence of unconscious bias. They may also have quotas in place around hiring and promotion, such as making sure that at least 40% of managers are women or come from a minority background. 
            
          img: /images/svg/lts/lts_u3_s2_p3_accordion3.svg

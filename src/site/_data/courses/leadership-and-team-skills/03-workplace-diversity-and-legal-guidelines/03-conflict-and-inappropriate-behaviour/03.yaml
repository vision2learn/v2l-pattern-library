title: When views clash
intro: |
  On this page, you will learn about situations where an individual’s views may clash with organisational expectations. 
banner: lts_u3_s3_p3_clashed_views.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure you can describe situations where an individual’s views may clash with organisational expectations. 
  -
  -
    title: Differences in perspective 
    theme: t-bg-primary
    copy: |
      Everybody has their own opinions, beliefs, and perspectives.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Tolerance
          text: |
            Tolerance of different beliefs is a British value that must always be respected. Tolerance dosen’t mean we all have to agree – it means living in a society where people can have differences of opinion and can express those opinions. 
          img: lts_u3_s3_p3_slide1.svg
        -
          title: Limits to expression 
          text: |
            However, there are limits to the kinds of views that can be tolerated. Beliefs that go against fundamental British values of democracy, tolerance, the rule of law, and individual liberty are not among the beliefs that should be tolerated and protected.  
          img: lts_u3_s3_p3_slide2.svg
        -
          title: It can be complicated
          text: |
            We live in a free and open society, which often means that different belief systems conflict with each other. It isn’t always easy to balance one group’s right to freedom of speech with another group’s right to live free of fear. Note though that open calls to violence or terror are never a matter of “free speech” – __they are hate crimes.__  
          img: lts_u3_s3_p3_slide3.svg
        -
          title: In the workplace
          text: |
            Many organisations have descriptions of their values as a body as part of their code of conduct. This will often involve commitments to quality delivery, and building a tolerant and inclusive environment. It’s inevitable that every organisation will experience situations where people with conflicting beliefs work together.  
          img: lts_u3_s3_p3_slide4.svg
  -
  -
    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Case study - The pickled cucumber

      The Pickled Cucumber is hosting an event for LGBTQI+ Pride. They’re going to be teaching people about healthy eating and vegetarian and vegan cooking at home. 

      But one colleague feels uncomfortable about the event… 
    subInc: 
      type: accordion
      content:
        - 
          title: The disagreement
          copy: |
            Katherine belongs to a church that teaches same-sex relationships are wrong. They’ve been involved with protests against LGBTQI+ events in the past. Katherine is a good employee – she works hard, she’s never late, and is well-liked by her colleagues.  
            
            However after the event was announced, Katherine began to  express discomfort about being involved. She explained to her colleagues that although she wouldn’t object to working with LGBTQI+ people or serving them as customers, participating in a Pride event goes against her religious convictions.  
          img: /images/svg/lts/lts_u3_s3_p3_casestudy1.svg
  -
  -
    title: A difficult situation
    layout: media
    theme: t-bg-primary
    copy: |
      When something like this occurs, it’s tricky to navigate. Katherine hasn’t said she thinks LGBTQI+ people should be treated differently or discriminated against in any way. But she has said that participating in a Pride event would contradict with her sincerely held religious beliefs. This is a __conflict of values__.

    img: /images/svg/lts/lts_u3_s3_p3_image1.svg
  -
  -
    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Case study - The pickled cucumber

      Fatima has to think hard about what to do. She doesn’t want to lose Katherine as an employee but she also wants to show support to the LGBTQI+ community. 
    subInc: 
      type: accordion
      content:
        - 
          title: The outcome
          copy: |
            Eventually they reach the compromise position that Katherine can have the day of the event off, even though she had been scheduled to work that day. 

            This causes some other employees to criticise Fatima because they think this undermines The Pickled Cucumber’s values as an inclusive workplace. But Fatima feels like, given the circumstances, she made the only decision she could.  
          img: /images/svg/lts/lts_u3_s3_p3_casestudy2.svg
  -
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        Make a note of situations where an individual’s views may clash with organisational expectations. You could also carry out additional research to find examples that you could use in your assessment. Make a note of these in the box provided.

title: Dealing with conflict and inappropriate behaviour
intro: |
  In this session you will understand how to contribute to a positive workplace environment by learning how to deal with conflict and inappropriate behaviour. 
banner: lts_u3_s3_p1_conflict.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * Inappropriate behaviour in relation to equality and diversity in the workplace and how it should be addressed 
      * Referral processes for dealing with inappropriate behaviour that is beyond the team leader’s authority 
      * Situations where an individuals’ views may clash with organisational expectations 
      * Possible implications for a team leader in dealing with a clash between individual values and organisational expectations 
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure you can give an example of inappropriate behaviour in relation to equality and diversity in the workplace and how it should be addressed.
  -
    title: Inappropriate behaviour around equality and diversity 
    layout: media
    theme: t-bg-primary
    copy: |
      The British values of individual liberty, the rule of law, democracy, and mutual respect regardless of belief and background are expected to be seen in every workplace. Treating everyone with respect whatever their background or beliefs is an important British value that should always be encouraged. 

      Inappropriate behaviour around equality and diversity includes all types of direct and indirect discrimination, harassment, and victimisation.  

      This can range from actions like making inappropriate jokes about someone’s sexual orientation or gender reassignment, making racist comments about someone because of their background, or even criminal offences like assasult.  

    img: /images/svg/lts/lts_u3_s3_p1_image1.svg
  -
  -
    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Case study - Magic Co.

      Magic Co. are a large and diverse company. They value inclusivity and have strong policies in place to ensure equal treatment for people with protected characteristics. 

      Meet Marcus. He’s a developer at Magic Co. He joined the company straight out of university and has been advancing quickly. 
    subInc: 
      type: accordion
      content:
        - 
          title: Marcus' story
          copy: |
            Marcus was born in the UK. His parents are Brazilian and they emigrated shortly after marrying. He’s always been very proud of both his British and Brazilian heritage and speaks fluent Portuguese. Both his parents belong to the Pardo ethnic group in Brazil, and Marcus identifies as Pardo too.  

            Magic Co. have an affirmative action policy in place, which is in accordance with the Equality Act 2010. That means that when it comes to hiring and promotion, they will favour candidates with protected characteristics if they’re equally qualified for a role as someone who isn’t from a minority community.  

            Marcus is a very skilled developer, but he’s learned one of his colleagues is spreading a rumour that he’s only been promoted to his current level to “fill the diversity quota”, because he’s a person of colour. He’s found this very hurtful because he’s proud of his achievements. 
          img: /images/svg/lts/lts_u3_s3_p1_casestudy1.svg
  -
  -
    title: Quick quiz
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        Marcus is a victim of discrimination here. Which form of discrimination has he experienced?:
          answers:
            Direct descrimination: true
            Harassment: false
            Indirect discrimination: false
            Victimisation: false
          feedback: text
  -
  -
    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Case study - Magic Co.

      Marcus is feeling very upset by the rumours. 
      
      He decides to call his team leader as soon as he gets home. 
    subInc: 
      type: accordion
      content:
        - 
          title: Marcus' team leader
          copy: |
            Marcus’ team leader is a woman named Shannon.  

            He tells her about the racist rumour that’s been spread about him, and the colleague he knows started it. He’s very upset, so Shannon makes sure he’s able to express everything he needs to without interruption.  

            Marcus wants to try and deal with this informally, so he and Shannon agree that she will speak to the colleague for him as a first step. 
          img: /images/svg/lts/lts_u3_s3_p1_casestudy2.svg
  -
  -
    title: What Shannon does next 
    theme: t-bg-supporting3
    copy: |
      Shannon set up a meeting with the employee who spread the rumour about Marcus, whose name is Jason. 

      These are the steps she took to make sure she was prepared. These are good steps to take if you’re ever in a situation like Shannon’s. 

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Know what you’re going to say 
          text: |
            You don’t have to have a prepared statement before you speak to the people involved, but you should have some notes written about what you want to cover.
          img: lts_u3_s3_p1_accordion1.svg
        -
          title: Be brief, but not hurried
          text: |
            You should keep to the specific topic you want to discuss, so keeping the meeting short will help you stay on target. But don’t seem like you’re in a rush – take time to get your words out clearly.
          img: lts_u3_s3_p1_accordion2.svg
        -
          title: Don’t be too general
          text: |
            It’s best to keep the conversation specific and to have examples to hand of the inappropriate behaviour with you. You should also make the impact of their behaviour clear to them, in this case Marcus’ feeling discriminated against. 
          img: lts_u3_s3_p1_accordion3.svg
        -
          title: What do you want to see instead?
          text: |
            Don’t just focus on the inappropriate behaviour, make sure you explain the alternative that you want to see. In this case, Shannon emphasised to Jason the importance of following Magico Co.’s policies around equality, diversity and inclusivity. 
          img: lts_u3_s3_p1_accordion4.svg
        -
          title: Be calm and professional
          text: |
            Inappropriate behaviour around equality, diversity and inclusivity can be difficult and emotional to deal with. It’s very important to stay calm and treat the matter professionally.
          img: lts_u3_s3_p1_accordion5.svg
        -
          title: Consult and escalate
          text: |
            If this intervention doesn’t help solve this issue, you’re first step should be to consult with the HR team about what to do next. It may be necessary to escalate matters, for example by making a formal grievance report.
          img: lts_u3_s3_p2_image1.svg
  -
  -
    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Case study - Magic Co.

      Shannon has an informal meeting with Jason where she discusses what he’s been saing about Marcus. 
    subInc: 
      type: accordion
      content:
        - 
          title: The outcome
          copy: |
            Shannon talks to Jason in a non-accustory tone about what Marcus has said. Jason admits right away to starting the rumour, explaining that he was resentful that Marcus had been promoted so quickly. He is very sorry that he’s upset a colleague, and he only made the remark to blow off steam because he was angry. 

            They agree that Jason will write Marcus a letter of apology and take sensitivity training.  

            Marcus is satisfied with the outcome, and everyone involved is happy to put it behind them. 
          img: /images/svg/lts/lts_u3_s3_p1_casestudy3.svg
  -
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        Make a note of what counts as inappropriate behaviour in relation to equality and diversity in the workplace and how it should be addressed. You could also carry out additional research to find examples that you could use in your assessment. Make a note of these in the box provided.

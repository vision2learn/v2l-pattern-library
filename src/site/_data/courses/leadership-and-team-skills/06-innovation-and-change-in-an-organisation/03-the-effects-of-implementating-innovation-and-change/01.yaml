title: Innovation and change - human effects 
intro: |
  In this session, you will learn about the possible human effects of innovation and change upon people and teams in an organisation. 
banner: lts_u6_s3_p1_innovation_human_effects.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * possible human effects of innovation and change upon people and teams in an organisation. 
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure you can explain the possible human effects of innovation and change upon people and teams in an organisation. 
  -
    title: What are the human effects of innovation and change?
    layout: media
    theme: t-bg-primary
    copy: |
      When we talk about “human effects”, we mean the ways that innovation and change impact on people as people. The fact is that innovation and change always involves unknowns, and even when everyone in a team understands the need for change and what the change will mean, they will still be dealing with uncertainties.  

    img: /images/svg/lts/lts_u6_s3_p1_image1.svg
  -
  -
    title: The human effects and what they mean
    theme: t-bg-supporting3
    copy: |
      These are some of the common human effects of innovation and change, and the impact they can have on teams. 
      
      By being aware of these effects, you will be in a better position to respond to them. 
    subInc: 
      type: accordion
      content:
        - 
          title: Anger
          copy: |
            Innovation and change can sometimes mean peoples’ jobs will change or even become redundant. This can cause a lot of anger, and not just from the people directly affected. This kind of atmosphere produces a lot of tension and possible disruption in a team.   
            
          img: /images/svg/lts/lts_u6_s3_p1_accordion1.svg
        - 
          title: Anxiety
          copy: |
            People can become very anxious about innovation and change, especially if there are unclear goals or a lack of leadership. This is bad for team morale and also for the physical and mental health of individuals in the team.    
            
          img: /images/svg/lts/lts_u6_s3_p1_accordion2.svg
        - 
          title: Confusion
          copy: |
            Even if a lot of effort is being made with communications, people may still feel very confused about what innovation and change mean. This can contribute to anxiety and anger in others around them, especially if there’s a situation where someone who should have answers can’t answer questions. This can also lead to mistakes being made that can have knock-on effects on the innovation.   
            
          img: /images/svg/lts/lts_u6_s3_p1_accordion3.svg
        - 
          title: Excitement
          copy: |
            It’s important to remember that the human effects aren’t all negative. Some people thrive during times of change, especially if they perceive this as a challenge for them to overcome. However, if there are other people in a team who aren’t excited or are even hostile to the change, this can contribute to divisions in the team.   
            
          img: /images/svg/lts/lts_u6_s3_p1_accordion4.svg     
  -
  -
    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Case study - Magic Co.

      We’re going to take a look at a single team at Magic Co. and see what the human effects of the innovations there have been.
    subInc: 
      type: accordion
      content:
        - 
          title: Human effects and the team
          copy: |
            In this developer team, all of the human effects we’ve mentioned have manifested. 

            George, the team leader, is __angry__. He feels like he wasn’t consulted about the change and feels like his job is at risk. He recognises the need for innovation but hates how it’s being done. 

            Rachel, the deputy leader, is __anxious__ about job losses in the team. She isn’t too worried about her own job role, but she’s worried about other people in the team becoming unemployed if there are redundancies.  

            Abishek, a junior developer, is __confused__. He doesn’t understand why the changes are being made or what they mean for him.  

            But Gary is __excited__. He’s a senior developer and he’s aware that the Magic Co. have lost their reputation as being a forward-thinking tech company. Although he understands why other people are experiencing negative feelings, he thinks that this will ultimately be good for the business and is keen to play his part. 

          img: /images/svg/lts/lts_u6_s3_p1_casestudy1.svg

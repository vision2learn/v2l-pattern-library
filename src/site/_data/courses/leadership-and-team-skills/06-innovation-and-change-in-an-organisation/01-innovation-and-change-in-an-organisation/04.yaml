  -
    title: Importance of digital skills
    layout: media
    theme: t-bg-primary
    copy: |
      In the modern world, digital is a fact of life. Most jobs will have at least a small digital portion to them, even if they’re not desk jobs. Many employers will expect you to have a lot of general digital skills, even if you’re not experienced with specialist programmes or possess skills like coding and software development. 

      By spending time improving your digital skills and experience, you’ll be making yourself more employable. If you feel like you want to expand your digital skills, speak to your line manager or the HR team to see if there are training programmes available to you. There are also lots of free digital skills training schemes available online too.   

    img: /images/svg/lts/lts_u6_s1_p4_image1.svg
  
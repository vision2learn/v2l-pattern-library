title: Innovation and change - the barriers 
intro: |
  On this page you will learn barriers to change and innovation in an organisation. 
banner: lts_u6_s1_p3_innovation_change_barriers1.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure you can identify the barriers to change and innovation in the organisation.
  -
  -
    title: What are the barriers to innovation and change?
    theme: t-bg-supporting3
    copy: |
      When an organisation begins the exciting process of innovating and changing, there will inevitably be some barriers that will have to be overcome or adapted to. 
    subInc: 
      type: accordion
      content:
        - 
          title: Fear of the unknown
          copy: |
            Change and innovation inevitably mean going from what’s known, into what’s unknown. Even relatively small, localised changes, like mixing job roles in a team, still involve leaving the familiar for the unfamiliar. People being scared of the unknown is one of the most important barriers to innovation and change. 
            
          img: /images/svg/lts/lts_u6_s1_p3_accordion1.svg
        - 
          title: Unclear goals
          copy: |
            Innovation isn’t just making a change for the sake of making a change. It’s about improving and enhancing. But sometimes the goal that the innovation will achieve is unclear to people in an organisation. They might then worry that the changes they’re undergoing lack any justification, making them resentful and unenthusiastic.  
            
          img: /images/svg/lts/lts_u6_s1_p3_accordion2.svg
        - 
          title: Lack of leadership
          copy: |
            This is related to unclear goals. Change and innovation don’t necessarily require a single leader to be in charge of them, but there does need to be some designated leadership roles. They need to be there to give strategic direction, clarify goals, and be there to reassure people and dispel their worry and anxiety.  
            
          img: /images/svg/lts/lts_u6_s1_p3_accordion3.svg
        - 
          title: Unwillingness to change
          copy: |
            Sometimes, people just don’t want to embrace change for any reason. That might be because of natural human resistance to change, but sometimes it can be for more difficult reasons to overcome, such as someone being concerned the change in the organisation will cost them authority or prestige.   
            
          img: /images/svg/lts/lts_u6_s1_p3_accordion4.svg
        - 
          title: Lack of planning
          copy: |
            Even if you have successfully won people’s trust, inspired their willingness to embrace change, and have clearly defined goals and leadership roles, you still need a plan. Without this, even with everyone’s good faith, the change or innovation is at risk because it simply won’t be clear how you want to achieve your goals.  
            
          img: /images/svg/lts/lts_u6_s1_p3_accordion5.svg     
  -
  -
    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Case study - Magic Co.

      Magic Co. are going through a big change. They’ve got a new senior leadership team in place, and they want to rapidly innovate. They worry that Magic Co. is falling behind competitors, so they want to transform it into a cutting-edge company.  

      But it isn’t a smooth journey…  
    subInc: 
      type: accordion
      content:
        - 
          title: What went wrong?
          copy: |
            The new management team called an all-company meeting to explain what they want to do, but everyone felt that it was short on details. Instead of defining clear objectives, they used a lot of buzzwords and jargon that didn’t really contain anything helpful. They talked a lot about how it’s important to embrace change but didn’t do anything to try and reassure people worried about what all these changes mean. And although they nominated leaders in each department to guide the innovations, they didn’t describe a clear plan of action. 
            
            This has left everyone at Magic Co. feeling worried and anxious about the future, meaning that the changes will be much harder to carry out. 

          img: /images/svg/lts/lts_u6_s1_p3_casestudy1.svg
  -
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        Make a note of the barriers to change and innovation in the organisation. You could also carry out additional research to find examples that you could use in your assessment. Make a note of these in the box provided.

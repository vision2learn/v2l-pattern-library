title: Welcome to Unit 6
intro: |
    ### Understanding innovation and change in an organisation
    
    In Unit 6, you will discover the benefits of innovation and change for an organisation. You will also learn about the barriers to innovation and change, as well as practical ways for overcoming these barriers. 
    
    You will also learn about planning, monitoring, and review techniques that can be used to manage innovation and change, learn about the importance of communication for successful innovation and change, and the possible human effects of innovation and change.  

banner: lts_u6_s1_p1_innovation_change.jpg

    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit you will gain the knowledge and understanding required to be able to meet the learning outcomes in your learning goals. 

      You will understand the importance of: 

      1. innovation and change in an organisation 
      2. how to plan, monitor and review the implementation and communication of innovation and change in an organisation 
      3. the effects of innovation and change on people and teams in an organisation.


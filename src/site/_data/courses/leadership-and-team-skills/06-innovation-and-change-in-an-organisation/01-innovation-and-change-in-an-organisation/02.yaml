    title: Eco-literacy and innovation
    layout: media
    theme: t-bg-primary
    copy: |
      As the world becomes more aware of the importance of responding to climate change, organisations and businesses must become more eco-literate. That means understanding the importance of the environment and taking steps to limit the negative impact they have on the natural world.  

      A lot of businesses and other organisations are actively innovating and changing to become greener and more environmentally friendly. This is a way of doing business responsibly. Making green and eco-friendly innovations not only helps businesses do their bit to fight climate change, it also will make them more competitive in the long run as the rest of the economy adapts to climate change.  

    img: /images/svg/lts/lts_u6_s1_p2_image1.svg
  
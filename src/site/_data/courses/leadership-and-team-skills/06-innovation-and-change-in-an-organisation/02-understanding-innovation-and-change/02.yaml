title: Innovation and change - communication and success  
intro: |
  On this page, you will learn about why communication is important in the successful implementation of innovation and change. 
banner: lts_u6_s2_p2_innovation_communication.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure you can explain why communication is important in the successful implementation of innovation and change. 
  -
  -
    title: Communication during innovation and change 
    theme: t-bg-primary
    copy: |
      Communication is one of the most important elements of any project, no matter the size or scale. When it comes to changes and innovations in an organisation, even if these are relatively modest, communication must always be clear, relevant, and effective.

      If this isn’t done, then it’ll become much more difficult to deliver the changes and innovations needed to keep your organisation on the cutting edge. 

      These are some of the key principles of communication that you should bear in mind.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Pay attention
          text: |
            Pay attention when you’re communicating, whether that’s in a face-to-face conversation, a video call, or when you’re writing an email. Focus on what you need to communicate to make sure you’re being accurate. 
          img: lts_u6_s2_p2_slide1.svg
        -
          title: Be receptive
          text: |
            When you’re receiving a communication, try to do so without any assumptions. If we let our preconceptions or biases get in the way, we risk missing important pieces of information. As well as that, being receptive is a respectful attitude to have which will be appreciated by your team: no one likes the feeling of not being listened to.  
          img: lts_u6_s2_p2_slide2.svg
        -
          title: Be clear and keep it relevant
          text: |
            With all communication, you should be clear about what you’re saying and should avoid including irrelevant details. This makes communication easier to understand. With something as potentially complicated and anxiety-producing as change and innovation, this is especially important. 
          img: lts_u6_s2_p2_slide3.svg
        -
          title: Understand your audience
          text: |
            Who is it that you’re communicating with? How do they prefer to receive news? How do they feel about the change or innovation? Knowing the answers to these questions will help you tailor the communication so it’s right for the audience. That means they’ll be more receptive and understanding.  
          img: lts_u6_s2_p2_slide4.svg
        -
          title: Use the different channels
          text: |
            You can use whichever communication channels and methods – like emails, instant messages, video calls, face-to-face conversations – that you judge to be right for the message you’re communicating. Always think about the best channel to use before you communicate. 
          img: lts_u6_s2_p2_slide5.svg
  -
  -
    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Case study - Magic Co.

      Let’s check back in with Magic Co. Do you remember that the all-company meeting didn’t help people understand the need to change and innovate, or what those changes and innovations would mean? 

      The senior leadership team have realised they communicated poorly, so they’ve made the effort to better reach their employees. 
    subInc: 
      type: accordion
      content:
        - 
          title: Communications campaign 
          copy: |
            The first thing the new leadership team did when they realised the problem was to nominate someone with experience to be in charge of communication with the company. They chose Keyaama, who is very experienced in communications. 

            She plans a communication campaign that will use multiple channels and methods to reach everyone in a way that works for them. There are weekly voluntary virtual meetings, regular email updates, a channel on the instant messenger platform for questions, and even posters put up in the company’s offices. 

            She also puts rules in place about how the changes and innovations are discussed with people outside the business, with a list of approved terms and suggested tone of voice. This helps make sure the message is kept uniform, reassuring everyone that Magic Co. are changing for the better. 

            This helps boost the morale in the company, making people more receptive and enthusiastic about change. 

          img: /images/svg/lts/lts_u6_s2_p2_casestudy1.svg

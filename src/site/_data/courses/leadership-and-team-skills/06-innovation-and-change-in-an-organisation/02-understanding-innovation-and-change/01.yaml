title: Understanding innovation 
intro: |
  In this session you will learn how to plan, monitor, review and communicate the effects of implementing innovation and change in an organisation. 
banner: lts_u6_s2_p1_understanding_innovation.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * Planning, monitoring, and review techniques that could be used to manage innovation and change 
      * Why communication is important in the successful implementation of innovation and change 
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      Make sure you can explain planning, monitoring, and review techniques that could be used to manage innovation and change. 
  -

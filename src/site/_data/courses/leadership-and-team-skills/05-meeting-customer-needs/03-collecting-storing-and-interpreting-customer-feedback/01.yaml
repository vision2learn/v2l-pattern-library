  -
    title: Collecting formal and informal feedback
    theme: t-bg-supporting2
    copy: |
      Before we talk about feedback collection, let’s define formal and informal feedback. 

      * __Formal feedback__ is organised and systematic. It tends to be done in a highly structured way, which can make it easier to be objective, though can also put customers off if it feels too complicated. 

      * __Informal feedback__ is looser and more organic. It can be easy to engage with customers this way, but it’s more difficult to separate facts from opinions.  

      Both of these forms of feedback are important for any organisation to stay on top of customer needs and expectations. 
    subInc: 
      type: accordion
      content:
        - 
          title: Conversations and observations 
          copy: |
            These are examples of __informal feedback__. 

            Having a chat with a customer about their experiences with and opinions of your product or service can help you know if customer expectations are being met or not. Likewise, watching how customers behave when handling the product (if this applies to you) can help you gauge what they think about it.  
          img: /images/svg/lts/lts_u5_s3_p1_accordion1.svg
        - 
          title: Social media comments and topics 
          copy: |
            These are examples of __informal feedback__. 
            
            What are people saying about your organisation, product, or service on social media? Take a look at the comments on social media updates your organisation puts out to discover more informal customer feedback. You can also read comments on consumer discussion forums.  
            
            Another thing you can do is keep an eye on trending topics on social media, to see if any are relevant to your organisation, product, service, or industry. 
          img: /images/svg/lts/lts_u5_s3_p1_accordion2.svg
        - 
          title: Surveys
          copy: |
            This is an example of __formal feedback__. 
            
            A survey is a systematic, proactive exercise in gathering customer feedback. It can take a lot of different forms: 

            * Asking customers in-store to answer survey questions 
            * Online surveys on your website that are open to everyone 
            * Targeted surveys sent to known customers, either by post, email, or via a telephone consultation 

            Surveys allow you to gather large amounts of customer feedback in a rigorous and systematised way, which helps you stay objective and stick to the facts. 
          img: /images/svg/lts/lts_u5_s3_p1_accordion3.svg
        - 
          title: Customer feedback forms
          copy: |
            This is an example of __formal feedback__. 
            
            A customer feedback form – either paper or digital – allows the customer to express their opinions to you in a clear and direct way. Often, organisations will have a formal channel through which customers can express themselves by using a feedback form. 
          img: /images/svg/lts/lts_u5_s3_p1_accordion4.svg

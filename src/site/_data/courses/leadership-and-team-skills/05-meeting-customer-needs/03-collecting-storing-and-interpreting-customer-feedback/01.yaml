title: Customer feedback
intro: |
  In this session you will learn how to collect, store, and interpret customer feedback.  you will also learn how to improve customer satisfaction, and the Data Protectin Act.
banner: lts_u5_s3_p1_customer_feedback.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * the importance of customer feedback 
      * different methods of collecting formal and informal feedback from customers 
      * how to interpret feedback from customers 
      * how to improve customer satisfaction 
      * implications of the Data Protection Act for collecting, storing and using customer feedback. 
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure you can:
        * explain the importance of customer feedback, and 
        * describe the different methods of collecting formal and informal feedback from customers.
  -
    title: The importance of customer feedback 
    layout: media
    theme: t-bg-primary
    copy: |
      Customer feedback is a stream of useful information about your product or service. It allows you to hear from the end user how well, or not, things are going.  

      Customer feedback can help you identify problems that otherwise would have been missed. This is because customers are engaging with the product or service in a direct and practical way. You might not realise that there are inefficiencies or errors until they’re discovered out in the real world. 

      Giving customers the opportunity to give feedback can also help them to feel like your organisation listens and cares. It can help create a sense of loyalty to your brand because the customer feels like their opinion matters to you. Even if the customer is unhappy, being given a feedback opportunity can help convince them to stay with you, rather than go to a competitor. Receiving feedback in the form of public reviews can also attract more customers if the reviews are positive. 

    img: /images/svg/lts/lts_u5_s3_p1_image1.svg

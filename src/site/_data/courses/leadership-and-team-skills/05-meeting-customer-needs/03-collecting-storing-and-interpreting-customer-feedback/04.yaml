  -
    title: E-safety
    layout: media
    theme: t-bg-primary
    copy: |
      It’s very important to make sure that you stay safe when you use the internet, social media, and other digital services. This is important for you as an individual and as a member of an organisation too.  

      E-safety means staying safe online, especially when it comes to online abuse. This can take the form of: 

      * cyberbullying – where digital services are used to harass someone 
      * sexual exploitation – such as tricking or forcing someone to share sexually explicit images of themselves  
      * grooming – where an abuser targets a vulnerable person, especially a child, and establishes an emotional 
      * relationship with them so they can gain the opportunity to abuse them 
      * emotional abuse – where digital services are used to deliberately damage someone’s emotional wellbeing  
      * phishing and other scams – these are when an individual or a group uses digital services to trick someone into sharing important personal data like passwords or bank details, or transferring money or other important assets. 

      It’s very important to be aware of the potential risks involved in using the internet, social media, and other digital services. Speak to your HR team or line manager if you ever have concerns about this, whether it’s a personal concern or about someone in your team. 

    img: /images/svg/lts/lts_u5_s3_p4_image1.svg

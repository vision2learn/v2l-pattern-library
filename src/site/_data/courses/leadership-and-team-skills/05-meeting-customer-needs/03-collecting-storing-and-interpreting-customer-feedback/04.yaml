title: The Data Protection Act 
intro: |
  On this page, you’ll learn about the implications of the Data Protection Act for collecting, storing and using customer feedback.  
banner: lts_u5_s3_p4_data_protection_act.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure you can outline the implications of the Data Protection Act for collecting, storing and using customer feedback.  
  -
  -
    title: What is the Data Protection Act and what does it mean for you? 
    theme: t-bg-supporting3
    copy: |
      It’s important to understand the responsibilities you have under the Data Protection Act.  
    subInc: 
      type: accordion
      content:
        - 
          title: What is the Data Protection Act? 
          copy: |
            The Data Protection Act 2018 is the UK’s implementation of the General Data Protection Regulation (GDPR). GDPR is an EU regulation that tells organisations what they can do with individuals’ data and outlines a set of responsibilities they have to protect that data.   
            
          img: /images/svg/lts/lts_u5_s3_p4_accordion1.svg
        - 
          title: What are the data protection principles? 
          copy: |
            The Data Protection Act states several data protection principles which have to be followed when you store or use customer information. 
            
            You have to make sure the information is: 
            * used fairly, lawfully and transparently 
            * used for specified, explicit purposes 
            * used in a way that is adequate, relevant and limited to only what is necessary 
            * accurate and, where necessary, kept up to date 
            * kept for no longer than is necessary 
            * handled in a way that ensures appropriate security, including protection against unlawful or unauthorised processing, access, loss, destruction or damage. 
            
          img: /images/svg/lts/lts_u5_s3_p4_accordion2.svg
        - 
          title: What are an individual’s rights under the Data Protection Act? 
          copy: |
            You have the right to find out what data the government or other organisations store about you. 
            
            You have the right to:
            * be informed about how your data is being used 
            * access your personal information 
            * have incorrect data updated 
            * have your data erased 
            * stop or restrict the processing of your data 
            * move and reuse your data (this is called data portability) 
            * object to how your data is being processed in certain circumstances. 
            
          img: /images/svg/lts/lts_u5_s3_p4_accordion3.svg
        - 
          title: What does this all mean for collecting, storing, and using customer feedback? 
          copy: |
            In short, you must make sure that you respect the data protection principles. In particular, you have to make sure that the data subject (that means the individual whose data you’re using) gives __consent__ for you to collect, store, and process their data. You must also make sure that you have a __legitimate interest__ in doing this; that means you should only collect, store, and use customer feedback information because it’s in the best interests of both your organisation and your customer to do so. 

            You should also make sure you only collect the data that is __relevant__ to your organisation. This is called data minimisation. That means you don’t have to record every single piece of information there is about the customer (such as their gender or ethnic background) just because you can; there has to be a __legitimate interest__ in that data to justify collecting, storing, and using it. 

            You also must make sure the data is stored in a way that is appropriate under the Act too. There is a stronger legal protection for __sensitive information__ about individuals, including: 

            * race 
            * ethnic background 
            * sexual life or orientation 
            * political and religious beliefs 
            * trade union membership.   
            
          img: /images/svg/lts/lts_u5_s3_p4_accordion4.svg     

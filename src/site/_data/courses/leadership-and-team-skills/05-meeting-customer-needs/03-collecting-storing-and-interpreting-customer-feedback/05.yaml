sections:
  -
    title: Summary
    theme: t-bg-primary i-summary
    copy: |
      In this session, you have learnt about:
      * the importance of customer feedback 
      * different methods of collecting formal and informal feedback from customers 
      * how to interpret feedback from customers 
      * how to improve customer satisfaction 
      * implications of the Data Protection Act for collecting, storing and using customer feedback. 
  
title: Improving customer satisfaction 
intro: |
  On this page, you’ll learn about improving customer satisfaction. 
banner: lts_u5_s3_p3_improving_customer_satisfaction.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure you can describe how to improve customer satisfaction. 
  -
  -
    title: What is customer satisfaction? 
    layout: media
    theme: t-bg-primary
    copy: |
      Customer satisfaction is the feeling and attitude experienced when they’re happy with the service or product you supply. Customer satisfaction is based on __meeting or exceeding__ a customer’s expectations. If you fail to do this, the customer will not be satisfied, and they won’t have positive feelings towards you or your organisation.

    img: /images/svg/lts/lts_u5_s3_p3_image1.svg
  -
  -
  -
    title: Steps you can take to improve customer satisfaction 
    theme: t-bg-supporting3
    copy: |
      Here are some steps you can take to improve customer satisfaction.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Collect and respond to feedback 
          text: |
            By regularly collecting both formal and informal feedback from customers, you’re creating a constant channel of important information for your organisation. Your customers won’t hesitate to tell you what they think, especially if they’re unhappy! 
            
            By collecting and responding to feedback, you can quickly correct mistakes and build a reputation as an organisation that values customer satisfaction.  
          img: lts_u5_s3_p3_slide1.svg
        -
          title: Put the customer first 
          text: |
            The customer should always feel like they’re at the centre of your attention. This means actively listening to them, asking follow-up questions to clarify their needs and requests, and putting on a friendly though professional demeanour. Be proactive too – don’t wait for them to come and ask you a question, ask them the first question instead. 
          img: lts_u5_s3_p3_slide2.svg
        -
          title: Make it easy for the customer 
          text: |
            The customer journey should be easy at all points. They should be able to find the product or service they want quickly and without complications. If complications or errors start to occur during the customer journey, eventually they’ll reach a point where they’ll cut their losses and go elsewhere. 
          img: lts_u5_s3_p3_slide3.svg
        -
          title: Think about it from their perspective 
          text: |
            If you were one of your customers, what kind of experience would you want? What would make you feel special? What would satisfy your needs and expectations? By asking yourself questions like this and reflecting on your own experiences, you’ll be able to empathise with your own customers and satisfy their needs and expectations.  
          img: lts_u5_s3_p3_slide4.svg
  -
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        Make a note of how to improve customer satisfaction. You could also carry out additional research to find examples that you could use in your assessment. Make a note of these in the box provided.

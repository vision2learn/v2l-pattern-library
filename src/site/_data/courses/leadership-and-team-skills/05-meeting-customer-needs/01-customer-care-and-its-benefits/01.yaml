title: Welcome to Unit 5
intro: |
    ### Meeting customer needs
    
    In Unit 5, you are going to learn about the basic principles of good customer care, customer care policies, and the benefits of an organisation having customer service standards.  

banner: lts_u5_s1_p1_meeting-customer-needs.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit you will gain the knowledge and understanding required to be able to meet the learning outcomes in your learning goals. 

      You will understand the importance of: 

      1. customer care and the benefits of good customer care 
      2. meeting customer needs 
      3. collecting, storing, and interpreting customer feedback. 

      [View the complete set of learning outcomes for this unit.](/pdfs/v2l_lts_learning_outcomes_u5.pdf)
  -
  -
    title: Introduction
    theme: t-bg-primary
    copy: |
      We will outline the common barriers to good customer care, give examples of good practice in customer care, and cover the difference between external and internal customers. We will also talk about how to identify the needs and expectations of a customer.  

      We will explain why it’s important to meet or exceed customer expectations, and how to effectively deal with complaints in our own area of responsibility. We will talk about how to deal with difficult customers’ behaviour, the importance of customer feedback, methods for collecting both formal and informal feedback, and how to interpret feedback. 

      Lastly, we will describe how to improve customer satisfaction and the implications of the Data Protection Act for collecting, storing, and using customer feedback. 
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      
      * the basic principles associated with good customer care 
      * companies’ customer care policies 
      * the benefits of an organisation having customer service standards.

title: Customer care – barriers and good practice 
intro: |
  On this page, you will learn about:
  * common barriers to good customer care
  * examples of good practice in customer care.  
banner: lts_u5_s1_p3_customer_barriers.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure you can outline common barriers to good customer care. 
  -
  -
    title: Common barriers to good customer care
    theme: t-bg-primary
    copy: |
      These are the most common barriers to good customer care. Being aware of these will help you to avoid them and deliver excellent service, which will keep customers coming back.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Complexity
          text: |
            omething that customers in all areas increasingly value is ease of access. When there are competitors that can take, process, and deliver their orders in less than 24 hours at the touch of a couple of buttons, why would they go somewhere that makes the experience harder?
          img: lts_u5_s1_p3_reveal1.svg
        -
          title: Not knowing the customer
          text: |
            Many organisations spend a lot of time and money understanding their customers. They’ll study the demographics and habits of their customers, as well as seeking feedback from them, to get an idea of the kind of person that uses their business. This helps them deliver a service tailored to their customer. Not having that kind of information means you don’t know – and can’t understand – your customer, making it much harder to deliver the experience they want.
          img: lts_u5_s1_p3_reveal2.svg
        -
          title: Lack of time, energy, and resources 
          text: |
            All of these contribute to the same problem; not being able to treat the customer in the way the customer expects. If there’s a lack of time, the customer will feel rushed. A lack of energy; they’ll feel ignored. A lack of resources; they’ll feel unvalued. It can be difficult to do, but it’s very important to make sure the customer service team always has the time, energy and resources necessary to deliver the right customer experience. 
          img: lts_u5_s1_p3_reveal3.svg
        -
          title: Lack of training and experience 
          text: |
            If your customer service people haven’t been trained in customer interaction, or if they’re not experienced enough to deal with customers who have complicated requests, this is a huge barrier to delivering good service. You need to make sure your people are fully trained, have the experience that’s right for their role, and have a clear line of escalation if there’s a difficult situation.  
          img: lts_u5_s1_p3_reveal4.svg
        -
          title: Failure to put the customer first 
          text: |
            In some ways, this isn’t a barrier on its own – it’s the core of every other barrier. Failing to position the customer at the heart of the customer service experience is a fundamental error. The customer’s satisfaction should always be your priority if you want to deliver good service. 
          img: lts_u5_s1_p3_reveal5.svg

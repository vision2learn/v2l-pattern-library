    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure you describe examples of good practice in customer care.  
  -
  -
    title: Good practice in customer care
    theme: t-bg-supporting3
    copy: |
      What good customer service looks like will sometimes depend on the industry, but familiarising yourself with these examples of good practice will help support you in your role. 
    subInc: 
      type: accordion
      content:
        - 
          title: Proactively sharing information 
          copy: |
            Being uncertain if our order is going to be fulfilled in time is never a nice feeling. That uncertainty can be worse than the actual reality of something being late. Being proactive and letting a customer know about potential or actual issues in fulfilling their order might not make them happy, but it will eliminate the worry they’re experiencing. Customers will appreciate that you kept them in the loop, as it helps make them feel like their needs are your central concern.   
        - 
          title: Keeping it personal 
          copy: |
            Whether it’s the barista who remembers how you like your coffee or the bookseller who keeps a spare copy of your favourite author’s latest bestseller under the desk, we all like it when customer service is a little bit more personal. This again helps make the customer feel like their needs are your central concern. Taking time to learn who your customer is, what’s behind their requests, and personal details like their name and interests, are vital ingredients in making the customer experience more personal, and more memorable.  
        - 
          title: Going the extra mile 
          copy: |
            Suppose there’s a particular model of plasma TV you want. You go to one shop, they check the system, and just tell you they don’t have it in stock. Then you go across the road to a competitor. They don’t have it in stock either, but they ring their supplier to ask if they have any they can dispatch. Even if they still can’t deliver on the customer’s request, they’ve shown they’re more willing to put the effort in. This will create a lasting positive impression in the customer’s mind.
  -
  -
    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Case study - The Pickled Cucumber 

      Gareth and his wife Wendy are celebrating their second wedding anniversary. The Pickled Cucumber is their favourite restaurant, and Gareth has booked it as a surprise for her. But when they arrive at the restaurant and talk to the concierge, Michelle, Gareth is horrified to realise he booked for __next week__ instead of that week. 
    subInc: 
      type: accordion
      content:
        - 
          title: How did Michelle make this a good customer care experience? 
          copy: |
            Michelle could see how disappointed Gareth and Wendy were.  

            She told them that there’s almost always at least one or two cancellations every night. She took Gareth’s phone number and told them that, if there was a cancellation in the next hour she would ring him and let him know. She told him that there was a good bar with a nice atmosphere a five minute walk away where they might want to wait, and she wrote down directions for them.  

            She also said that she would ring in an hour if there were no cancellations and arrange a reservation for them as soon as she could get them in. 

            Although no tables became free that night, and Gareth and Wendy were disappointed they didn’t get their meal, they were very happy with how Michelle handled the situation. She went the extra mile for them and kept them in the loop. They managed to get a booking for later in the week, and The Pickled Cucumber has remained their favourite restaurant.  

          img: /images/svg/lts/lts_u5_s1_p3_casestudy1.svg

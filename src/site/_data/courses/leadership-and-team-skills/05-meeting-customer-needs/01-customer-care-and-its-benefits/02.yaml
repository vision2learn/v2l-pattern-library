title: Customer care – principles, policies and standards
intro: |
  On this page you will learn about: 
    * the basic principles associated with good customer care
    * companies’ customer care policies 
    * the benefits of an organisation having customer service standards. 
banner: lts_u5_s1_p2_customer_care.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure you can list the basic principles associated with good customer care.
  -
  -
    title: Basic principles of good customer care
    theme: t-bg-primary
    copy: |
      We will begin by looking at the fundamentals of good customer care. These are the behaviours you should aim to manifest when dealing with a customer, whatever industry or line of service you’re in.  

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Timeliness
          text: |
            It’s important to always aim to deliver the service the customer wants as quickly as possible. That doesn’t mean rushing and cutting corners – it means considering the customer’s time to be as valuable as your own. No one likes to be kept waiting, so try to respond to the customer’s requests in as timely a way as possible. 
          img: lts_u5_s1_p2_slide1.svg
        -
          title: Right first time
          text: |
            It doesn’t matter if the product in question is a three-piece suite or a tasty meal, no one is happy if they don’t get the service they asked for. Good customer service works to avoid mistakes and makes sure that every delivery is right first time, meaning no mistakes have been made and the customer receives what they asked for.  
          img: lts_u5_s1_p2_slide2.svg
        -
          title: Personal
          text: |
            It’s always best to try and make the customer’s interaction with you as personal as possible. This helps put the customer at ease – which is important in high-stress situations – and makes it more likely they’ll remember the experience for the right reasons. Even small actions like remembering the customer’s name, or asking follow-up questions if they’re a repeat customer, can make a big difference.
          img: lts_u5_s1_p2_slide3.svg
        -
          title: Openness
          text: |
            It’s best to keep the customer “in the loop” about their order or the service they’ve requested, especially if things don’t go according to plan. Even if they’re unhappy that there’s a problem, most customers would prefer to know what’s going on than be left guessing. This is also true when things are going right! If possible, give the customer updates about how their order is progressing.  
          img: lts_u5_s1_p2_slide4.svg
        -
          title: Simplicity
          text: |
            For as much as you can, keep the experience as simple for the customer as possible. If the process of ordering or accessing a service feels too complicated, the customer is less likely to return or recommend it, because they may find the experience too frustrating. By keeping things open, efficient, and accessible, you make the customer’s experience more pleasant. 
          img: lts_u5_s1_p2_slide5.svg
  -

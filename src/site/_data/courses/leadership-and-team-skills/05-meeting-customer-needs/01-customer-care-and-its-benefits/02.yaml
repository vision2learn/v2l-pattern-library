  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure you can outline a company’s customer care policy. 
  -
  -
    title: Customer care policies
    layout: media
    theme: t-bg-primary
    copy: |
      Companies have customer care policies so that their customer care teams all understand the expectations the organisation has for them. They provide a dynamic blueprint for how the organisation wants customers to be treated, usually stating the organisation’s values, including a mission statement.  

      The policy will commit customer care workers to behave in alignment with the organisation’s values. It will explain the kinds of behaviour the organisation wants to see from customer care workers (you might find words like “professional”, “courteous”, and “efficient”). This means that all customers can expect a similar level of service from the organisation, making for a more consistent and predictable customer experience.  

      The policy might also describe the areas of customer service that the organisation will train its people in, such as communication techniques, how to follow up with past customers, and how to build long-term customer relationships.   

    img: /images/svg/lts/lts_u5_s1_p2_image1.svg

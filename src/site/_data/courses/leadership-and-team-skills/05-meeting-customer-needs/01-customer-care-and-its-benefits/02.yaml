    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      Make sure you can explain the benefits of an organisation having customer service standards.  
  -
  -
    title: Benefits of customer service standards 
    theme: t-bg-supporting2
    copy: |
      Service standards define how an organisation delivers to its customers. For example, they might state that all customer enquiries should be responded to within 48 hours, or that all orders should be processed within 12 hours.  

      The content of the service standard will depend on the organisation’s industry and purpose, but these are the benefits every organisation can enjoy by having service standards in place: 
    subInc: 
      type: accordion
      content:
        - 
          title: Consistent customer experience  
          copy: |
            An important part of building a good customer relationship is ensuring a consistent customer experience. If a customer has been using your organisation for years, it can still sometimes take just one bad experience to send them elsewhere. Customer service standards help guarantee that the customer will always receive the experience that they’ve come to expect, helping create greater customer loyalty.  
        - 
          title: Direction and guidance
          copy: |
            Having clearly written customer service standards available will help everyone understand what they should be doing. They will know the time windows they have to process customer orders and respond to queries and complaints. This helps eliminate doubt and confusion in the workforce, helping everyone be more efficient and self-directed.  
        - 
          title: Conduct and capability
          copy: |
            If disciplinary issues emerge, it’s important to have a set of standards for reference. This helps narrow these issues down into individual points that can be actioned or worked on.  
            
            For example, if you tell a customer service worker in your team that their work “just isn’t good enough”, they’d probably find that very unhelpful statement. But, if you can say, “we aim to always respond to customer enquiries within 48 hours, and you’ve been leaving enquires unanswered for over three days,” you’ve already narrowed the situation down to a particular point. 

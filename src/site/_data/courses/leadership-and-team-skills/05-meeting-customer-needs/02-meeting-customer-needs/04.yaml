    theme: t-bg-primary i-summary
    copy: |
      In this session, you have learnt about:
      * the difference between external and internal customers
      * how to identify the needs and expectations of a customer 
      * why it is important to meet or exceed customer expectations 
      * how to effectively deal with complaints in your own area of responsibility 
      * how to deal with difficult customers’ behaviour. 
  
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure you can describe how to deal with difficult customer behaviour.
  -
  -
  -
    title: Dealing with difficult customers
    theme: t-bg-supporting3
    copy: |
      Sometimes a customer will behave in a very difficult way. This could be because they’re acting in a way that’s unfair or aggressive, or because they don’t know what they want and their requests are too vague.

      There will be different ways of responding depending on the type of difficulty, but in each of these scenarios: 
      * stay calm 
      * stay patient 
      * listen carefully, respond clearly  
      * don’t be afraid to escalate if you have to.
    subInc: 
      type: accordion
      content:
        - 
          title: Angry or unhappy
          copy: |
            If the customer is angry about or unhappy with the product or service being offered, even if it isn’t your fault, you should begin by apologising. This can be on your own behalf, or on the behalf of your organisation. Stay calm and try to respond to their grievances as precisely and clearly as you can.
            
            However, if the customer becomes aggressive, don’t hesitate to escalate to someone more senior. You’re within your rights to ask an aggressive customer to leave.
            
          img: /images/svg/lts/lts_u5_s2_p3_accordion1.svg
        - 
          title: Indecisive or vague
          copy: |
            This is difficult in a different way – the customer’s indecisiveness or vagueness makes it harder for you to secure the sale. Ask them questions that focus on the specific things that seem to be causing their indecision; this will also help you respond to a customer who’s being vague. Try not to be pushy though, as this can change an indecisive customer into a customer who decides they don’t want to make the purchase.
            
          img: /images/svg/lts/lts_u5_s2_p3_accordion2.svg
        - 
          title: Demanding
          copy: |
            This is a customer who knows what they want and doesn’t care how they get it. They can take up a lot of your time and energy. Be patient with them, listen closely to what it is they want and keep your answers and responses as honest as possible.
            
          img: /images/svg/lts/lts_u5_s2_p3_accordion3.svg
        - 
          title: Disappointed
          copy: |
            If a customer is very disappointed with a product or service, they may demand a refund. You will have to refer to your organisation’s refund policies to see if you’re allowed to do this. Some organisations will allow you to make your own decision about whether or not to give a refund – either in the form of cash or credit – so you can use your discretion. Once again, remember to always stay calm, and to listen to what the customer is saying so your responses can be as precise as possible. 
            
          img: /images/svg/lts/lts_u5_s2_p3_accordion4.svg
  -
  -
    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Case study - Magic Co.

      Hussein is a team leader at Magic Co.’s app division. The marketing team are an internal customer of the app division, because they require services from the app division to do their job. In this case, marketing needed an accurate description of the features for a new app Magic Co. are working on so they can start a new advert campaign.  

      Felix from marketing storms into Hussein’s office looking very angry.  

      “The summary of features your team sent me was late and inaccurate! We’d already started putting ads out when we realised, now we look like idiots! There are already bloggers making fun of us because we had to withdraw all our ads!” 
    subInc: 
      type: accordion
      content:
        - 
          title: Hussein manages a difficult customer situation 
          copy: |
            Felix is clearly very angry with the situation and he’s got a valid complaint. The app division didn’t fulfil what he needed from them: an accurate summary of app features delivered on time. But he’s also being very loud and impatient. 

            Hussein’s team wasn’t involved with the new app – he’s just the first person from the division that Felix came across. But Hussein apologises on behalf of all the developers. 

            “I’m sorry this has happened. I agree that it’s unacceptable and on behalf of the whole division, I apologise.” 

            He also knows that Felix is expecting to hear what they’re going to do about this situation. 

            “I’m going to personally investigate what’s happened here. Obviously, there are big problems if important information is being delivered late and inaccurately, so I’m going to find out what’s caused this.” 

            Felix will also want to be kept in the loop about his complaint. 

            “I’ve got your email address already, so what I’m going to do is email a summary of this conversation to you and cc both our managers to keep a record of it. I’m also going to update you regularly with the progress of my investigation. Thank you for bringing this to my attention, hopefully we can stop this happening again, and I’m sorry it’s had such an adverse impact on your ad campaign.” 

            Throughout, Hussein stayed calm and patient. He made sure to listen to what Felix was saying carefully so he could give him answers that were clear and accurate. He also outlined the positive next steps he’s going to take to resolve the complaint and prevent it from reoccurring.  

          img: /images/svg/lts/lts_u5_s2_p3_casestudy1.svg

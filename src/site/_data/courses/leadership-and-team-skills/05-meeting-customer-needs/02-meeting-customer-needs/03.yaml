title: Customer complaints and difficult behaviour 
intro: |
  On this page, you will learn about:
  * how to effectively deal with complaints in your own area of responsibility 
  * how to deal with difficult customer behaviour. 
banner: lts_u5_s2_p3_customer_complaints.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure you can explain how to effectively deal with complaints in your own area of responsibility. 
  -
  -
    title: Complaints 
    theme: t-bg-primary
    copy: |
      Nobody likes to be on the receiving end of a customer complaint, but they’re both an inevitable part of any business and important learning opportunities. Customer complaints can reveal problems with the products and services your organisation supplies that might otherwise go unnoticed. Although it should be acknowledged, sometimes customer complaints are unreasonable and unkind – we’ll look at dealing with customers with difficult behaviour shortly. 
      
      Here are the best things you can do to respond to, and take ownership of, a customer complaint.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Remain calm
          text: |
            Customer complaints, especially in person, can be distressing to deal with. It can feel like the customer is calling into question your ability to do your job. But if you stay calm, you’ll be better equipped to deal with the situation effectively and professionally. 
          img: lts_u5_s2_p3_slide1.svg
        -
          title: Pay attention
          text: |
            Nothing will frustrate a customer more if you don’t understand what their complaint is even about. Listen or read what is said carefully – if you don’t understand something, ask a clarifying question in a calm and polite way.  
          img: lts_u5_s2_p3_slide2.svg
        -
          title: Be sensitive
          text: |
            The cause of the complaint could be very emotional for a customer. They could be complaining about a gift that arrived late for a loved one, or something equally personal. Try to empathise with the customer and understand the emotions they’re feeling. Even if you feel the customer is being unreasonable, understanding their emotions will help you resolve the situation more quickly.  
          img: lts_u5_s2_p3_slide3.svg
        -
          title: Acknowledge and take ownership 
          text: |
            Customers will want to know their complaint has been taken seriously. Apologising, either for yourself, your team, or your organisation, and acknowledging that the cause of their complaint should never have occurred is how you can let them know you care.  
          img: lts_u5_s2_p3_slide4.svg
        -
          title: Explain how you’ll fix it 
          text: |
            The customer will want to hear how you’re going to fix the issue. If it’s within your area of responsibility, you should explain how you will respond, even if it does mean handing it over to someone else. If it falls outside your area of responsibility, explain to the customer how you’ll escalate it. If appropriate, explain to them how you’ll follow up on their complaint, or how they can follow it up themselves, for example by giving them a number they can ring or an email address to contact.
          img: lts_u5_s2_p3_slide5.svg

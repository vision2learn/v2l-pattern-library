    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure you can identify customer needs and expectations. 
  -
  -
    title: Customer needs and expectations 
    theme: t-bg-primary
    copy: |
      All customers, whether they’re internal or external, have a need that they want to satisfy. That’s why they’ve come to you!  
      
      Here are the different categories of customer need you’re likely to encounter. Being able to identify the customer’s need will help you deliver better service. 

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Functional needs
          text: |
            These are the most basic kind of customer need. They relate to things the customer needs in a very direct, uncomplicated kind of way. If you’re hungry, you __need__ food. If you’re thirsty, you __need__ water. Functional needs tend to be fairly specific and are tied closely to physical requirements.  
          img: lts_u5_s2_p1_slide1.svg
        -
          title: Psychological and emotional needs 
          text: |
            These are more complicated. They relate less to things we __need__ in a direct way, and more to what we want to have. Wanting to have the same kind of watch as a popular movie star, or a shirt with the face of our favourite singer on it are examples of psychological or emotional needs. Psychological or emotional needs don’t relate to direct physical needs in the same way as functional needs, although sometimes the line is blurry; everyone __needs__ to eat, but they may want to eat at their favourite fast-food place.  
          img: lts_u5_s2_p1_slide2.svg
        -
          title: What does the customer expect? 
          text: |
            It’s important to be aware of what the customer expects from the goods or services you provide. If their expectations aren’t met, this makes them less likely to return or recommend you. By making sure you understand how the customer expects to have their needs fulfilled, you can help steer them towards the product or service that’s right for them. Otherwise, you risk having an unhappy customer.  
          img: lts_u5_s2_p1_slide3.svg

title: Meeting customer needs 
intro: |
  In this session you will learn about how to meet customer needs. 
banner: lts_u5_s2_p1_meeting_customer_needs.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * the difference between external and internal customers
      * how to identify the needs and expectations of a customer 
      * why it is important to meet or exceed customer expectations 
      * how to effectively deal with complaints in your own area of responsibility 
      * how to deal with difficult customers’ behaviour. 
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure you can describe the difference between an internal and an external customer. 
  -
    title: Internal customers vs external customers 
    layout: media
    theme: t-bg-primary
    copy: |
      We usually associate the word “customer” with “someone seeking a service or product in exchange for money”. But the word actually has a broader meaning than that. In essence, a customer is anyone seeking a potential service or product that we have available. 

      __Internal customer__

      An internal customer is anyone who wants the service or product you provide __and is a member of the same organisation as you__. Someone who works at a café who also buys their lunch there is an internal customer. Likewise, if there’s another department of your organisation that needs the service or product your department offers so that they can do their job – like a marketing team that needs to know what the finished product looks like – they’re also an internal customer. 

      __External customer__

      An external customer is anyone who wants the service or product you provide __and is not associated with your organisation__. Someone who comes in for a coffee from your café is an external customer. Someone who’s buying a game your company has developed is also an external customer.   

    img: /images/svg/placeholder_icon.svg

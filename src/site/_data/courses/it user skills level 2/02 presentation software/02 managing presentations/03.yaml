title: What did you learn? 
intro: Well done, you’ve now completed the second session of Presentations Level 2! 
banner: ba-u1-s1-p6.jpg

sections:
  -
    title: Summary
    theme: t-bg-primary i-summary
    copy: |
      In this session, you have learnt about:
      
      * How to create and manage folders so that you can store your documents effectively
      * The different ways to save your files, including saving as a webpage or standalone presentation
      * The best way to compress files and images, and the importance of saving disk space
      * How to preview your files before you print them, as well as how to print handouts and speaker's notes to accompany your presentation
  -

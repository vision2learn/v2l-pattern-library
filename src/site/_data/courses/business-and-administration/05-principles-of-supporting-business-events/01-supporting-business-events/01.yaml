title: Welcome to Unit Five
intro: |
    ### Principles of supporting business events
    
    This unit will help you to gain an understanding of supporting business events.

banner: ba_u5_s1_p1_events_1.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this session, you will cover the following criteria of your Level 2 Certificate in the Principles of Business and Administration qualification.

      You will:

      1. Understand how to deal with problems encountered when supporting a business event

      At the end of the session you can:

      1. Identify the types of problems that may occur when supporting a business event
      2. Identify ways of dealing with problems when supporting a business event

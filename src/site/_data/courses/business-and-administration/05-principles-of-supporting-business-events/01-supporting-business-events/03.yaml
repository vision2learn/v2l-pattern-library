title: The three stages of supporting business events
intro: |
    On this page you will learn more about the three stages of supporting a business event, these are: 
    * Before
    * During
    * After
banner: ba_u5_s1_p3_events_3.jpg
sections:
  -
    title: Support before events
    theme: t-bg-primary
    copy: |
      The early work before an event will involve careful planning. This should start with having clear objectives for the event. The people planning an event should know exactly what they are trying to achieve. Then they should work out what has to be done and when so that the outcomes can be achieved.
      
      Select the images below to find out more about plan details and pre-event activities.

    subInc: 
      type: reveal
      content:
        -
          title: Pre-event activities
          copy: |
            Following the plan there will be pre-event activities and tasks. If the support tasks are not done or are done badly it increases the likelihood that the event will be unsuccessful.
          img: ba_u5_s1_p3_reveal_1.svg
        -
          title: Plan details
          copy: |
            The details of the plan should indicate the tasks that need to be done and their deadlines. The plan should also address the resources that will be needed to make the business event a success. This will highlight the people who are needed to support the event and the tasks they will undertake.
          img: ba_u5_s1_p3_reveal_2.svg
  
  -
    title: Support during events
    theme: 
    copy: |
      ### During the event
      
      On the day or days of the event there are a wide range of support activities that will significantly influence whether the event is a success or a failure.  Select the images below to learn more.
    subInc: 
      type: reveal
      content:
        -
          title: Attendees
          copy: Some of these activities and tasks may involve face-to-face interaction with attendees. For example, greeting attendees at a conference would include offering a warm and friendly welcome, completing registrations and handing out badges and packs.
          img: ba_u5_s1_p3_slide_1.svg
        -
          title: Behind the scenes
          copy: Other activities may be behind the scenes and not involve face-to-face contact with attendees. Some typical tasks would include liaising with venue staff or caterers and organising suppliers and speakers.
          img: ba_u5_s1_p3_slide_2.svg
        -
          title: Busy
          copy: Events can be very busy occasions so it is important that staff know exactly what they should be doing and their range of responsibilities.
          img: ba_u5_s1_p3_slide_3.svg
        
  -
    title: Support after the event
    layout: media
    theme: t-bg-supporting2
    copy: |
      ### Was it a success?

        For many events it would be foolish to run them efficiently and to the satisfaction of those attending and then not follow things up.

        Certain tasks are needed to bring a business event to a close. Without them attendees may be dissatisfied and resources may be wasted. It is often the follow-up activities that determine whether the event is successful.

        These activities continue the relationship that has been established during the event. They carry the momentum of the event forward. Examples include ensuring the relevant people know their action points after a meeting and ensuring items bought at a trade fair are delivered as requested. 
            
    img: /images/svg/ba/ba_u5_s1_p3_image_1.svg
  -
    title: Case study - No Limits Adventure Holidays
    theme: t-bg-primary1a i-casestudy
    copy: |
      There are a wide range of tasks that had to be completed before the No Limits annual event took place to ensure its success. 
      
      Scroll through the slides below to learn more:
    subInc: 
      type: slider
      title: 
      slides:
        - 
          title: Before
          text: |
            A clear plan of action was discussed and agreed before any activities took place. This ensured that everyone knew what needs to be achieved, by when and who was responsible for the various tasks. As well as the most common pre event activities discussed on page 2, No Limits specialises in holidays for people with disabilities so booking a venue with suitable access and facilities was critical. As each pre-event activity was complete the plan was updated so progress could be monitored and any problems could be looked at well in advance of the event.
          img: ba_u5_s1_p3_casestudy_1.svg
        - 
          title: During
          text: |
            On the day of the event sufficient staff were on hand to welcome attendees, provide direct support and to answer any questions. As well as having staff working to satisfy the needs of attendees face to face, members of the team were working with the venue management to ensure that the attendees specific needs were met and everything was going to schedule. 
          img: ba_u5_s1_p3_casestudy_2.svg
        - 
          title: After
          text: |
            While the event was deemed a success by the team at No Limits, a meeting was held the next day to review the event and plan the follow up activities that were required.  The team know that it is essential to contact attendees for feedback, follow up on potential bookings and respond to client’s questions and queries as soon as possible after the event. Failure to do so will create a negative impression with clients and affect the success of the business.
          img: ba_u5_s1_p3_casestudy_3.svg
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: Can you think of an example for a pre-event, during event and post-event task? Think about it and write it down in the box to the right.
  -
    title: Summary
    theme: t-bg-primary i-summary
    copy: |
      * The effort made to prepare and plan the event may be wasted if staff on the day fail to support it. Conversely if the support is done professionally the event can be enhanced and the chance of the event achieving the objectives is more likely.
      * It is important after an event to review it and highlight what went well and what may be improved. If this post-event activity is not done then mistakes may be repeated and opportunities to make improvements will be lost when the event, or something similar, is repeated.
  -
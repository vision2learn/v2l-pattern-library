title: Developing budgets
intro: |
  In this session you will learn about how budgets are developed.
banner: ba_u6_s2_p1_devbudgets_1.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-primary
    copy: |
        By working through this session, you will cover the following criteria of your Level 2 Certificate in the Principles of Business and Administration qualification:

        You will:
        1. Understand how to develop budgets

        At the end of the session you can:
        1. Explain the purpose of agreeing the format in which a budget will be presented
        2. Explain the purpose of using estimations when developing a budget and ways of doing so
        3. Explain the purpose of identifying timescales, priorities and financial resources needed when preparing a budget and ways of doing so
        4. Describe the purpose of negotiating and agreeing a budget
  -
    title: Agreeing a format
    theme: t-bg-supporting2
    copy: |
      When an organisation uses a budgeting process, great care should be taken to decide on the format that they will use.

      There are **five** helpful questions that may be asked when agreeing the format for a budget. These questions should be answered clearly and accurately. 
      Select each image below to see these questions.

    subInc: 
      type: reveal
      content:
        -
          title: What is the purpose of the budget?
          copy: |
            Each organisation should be explicit and spell out the precise purpose of the budget. The purpose(s) should then be communicated to all appropriate staff members.
          img: ba_u6_s2_p1_reveal_1.svg
        -
          title: Which budgets will be used?
          copy: |
            The type and number of budgets will be influenced by the nature of the organisation. Within each specified budget there will be the items that the organisation wants to have included. An organisation must select the budgets it needs which will help it to operate as efficiently as possible.
          img: ba_u6_s2_p1_reveal_2.svg
        -
          title: What is the duration of the budget?
          copy: |
            Most budgets are created over a twelve month period. They may then be subdivided into shorter time intervals that suit the objectives and operations of the organisation. For example, an organisation with monthly performance reviews may wish to have monthly figures.
          img: ba_u6_s2_p1_reveal_3.svg
        -
          title: Who receives the information?
          copy: |
            The organisation should specify who will be responsible for holding, monitoring and controlling each budget.
          img: ba_u6_s2_p1_reveal_4.svg
        -
          title: How will the information be presented?
          copy: |
            Consideration should be given to the best way to present information. If each person had information to meet their unique point of view, there would be contrasting formats, which could lead to confusion. The organisation should therefore have a budget with a consistent format and appearance.
          img: ba_u6_s2_p1_reveal_5.svg
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: What do you think would happen if an organisation could not answer all five questions clearly and precisely? Write your ideas in the box to the right.
  -
    title: Example format 
    theme: t-bg-supporting3
    copy: |
      This type of budget shows the **total sales** expected over a given timescale (often twelve months). The budgeted sales will be shown in terms of their quantities (and / or values) and may be broken down by product or product groups, salesperson, target markets, etc.

      See below to see example.
    subInc: 
      type: accordion
      content:
        - 
          title: Sales budget
          copy: |
            Here is an example of a sales budget.

            **Altitude Peaks Ltd**

            Extract budget in £ for first and second quarter  

            | Sales 2019 | Q1 Estimate| Q1 Actual | Q1 Variance | Q2 Estimate | Q2 Actual| Q2 Variance |
            ||||||||
            | **Basic skis** | |  |  |  |  |  |
            | Volume |  1000|  |  |   1300|  |  |
            | Price |     80|  |  |     80|  |  |
            | Value | 80000|  |  | 104000|  |  |
            | | | | | | | |
            | **Premier skis** | |  |  |  |  |  |
            | Volume | 700 |  |  | 900 |  |  |
            | Price | 90 |  |  | 90 |  |  |
            | Value | 63000 |  |  | 81000 |  |  |
            | | | | | | | |
            | **Supreme skis** | |  |  |  |  |  |
            | Volume | 400 |  |  | 600 |  |  |
            | Price | 120 |  |  | 120 |  |  |
            | Value | 48000 |  |  | 72000 |  |  |
            || | | | | | | |
            | **Total values** | **191000** |  |  | **257000**|  |  |

  -
    title: Creating a standardised format
    theme: t-bg-primary
    copy: |
        If budgets are to be coordinated and readily understood, a standard budgeting format should be used. It should be able to answer the 5 questions posed in the reveal images above.

        To establish a standardised and agreed format, many organisations create a **budget manual**, which is a short document listing the organisation-wide key facts to ensure budgets are worked on in the **same way**.
  -
    title: Read - Budget manual
    theme: t-bg-primary2 i-read
    copy: | 
      Take a look at the following example of a budget manual which lists the **key points** that Budget Managers will need to consider:

      [Budget manual example](/pdfs/ba_u6_s2_p1_budget_manual.pdf)
  -
    title: Preparing a standardised format
    theme: 
    copy: |
      To prepare a standardised format, the organisation may review the previous year’s activities and identify potential improvements. 
      Organisations should use a form with a consistent and standardised layout, incorporating the following features:
      * Simple and straightforward
      * Logical structure
      * Consistent design and layout
      * Typeface
      * No artwork
      * Cleary written 
      * Jargon free
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        How might the absence of a standard format influence the budgeting process in an organisation? Write your ideas in the box to the right.
  -
    title: Quick quiz
    copy: |
        ### The purpose of agreeing a format

        When there is no agreed and understood format for budgets, the organisation risks confusion and chaos. By establishing a standardised format, the organisation may simultaneously achieve several important outcomes.  Try the following questions to see what agreeing a format means.
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Budgets can be easily understood.
          answer: easily understood
        -
          sentence: There is consistency in budgets across the organisation, so staff moving across the organisation will be familiar with standardised formats and there is less scope for confusion.
          answer: standardised formats
        -
          sentence: Cross-organisational comparisons and agreements are easier to achieve.
          answer: easier to achieve
        -
          sentence: It is easier to monitor actual financial performance against the planned income and expenditure.
          answer: easier to monitor
    theme: i-quiz
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      For your Unit 6 assessment, you must be able to explain the purpose of agreeing the format in which a budget will be presented. Looking back over the information on this page will help you when it comes to tackling this question in your assessment.
  -


    title: Learning points
    theme: t-bg-primary
    copy: |
      
      ### In brief

      By working through this session, you have learned all about:

      * Reasons for agreeing the purpose, content, layout, quality standards and deadlines for the production of documents
      * Ways of checking finished documents for accuracy and correctness, and the purpose of doing so
      * The purpose of confidentiality and data protection procedures when preparing documents
      * Comparing different types of documents that may be produced from notes and the formats to be followed
      * The procedures to be followed when preparing text from notes.

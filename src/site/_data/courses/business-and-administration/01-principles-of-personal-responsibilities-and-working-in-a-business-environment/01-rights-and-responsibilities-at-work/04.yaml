title: "The importance of legislation"
intro: |
  On this page you will learn about:
  * The importance of legislation
  * Being informed
  * The role of Representitve bodies
banner: ba-u1-s1-p4.jpg
sections:
  -
    title: Why have laws?
    theme: t-bg-primary
    copy: |
      Laws are created in business to protect employers, employees, customers and third parties.

      If laws didn’t exist, people would be unprotected and things may get out of control. There would be no clear way to resolve differences or difficulties.

      Laws help businesses to have rules of conduct that apply to all relevant parties. Other methods can also be used to resolve differences of opinion or behaviour that break these rules – such as courts / tribunals.

      Courts use an objective, evidence-based approach to solve problems to do with breaking the law, rather than using force or power to resolve an issue.
  -
    title: Be informed
    theme: t-bg-grey
    copy: |
      You can find useful information about employment rights and responsibilities in many different places!

      Some sources of information may be found within an organisation (known as internal sources) while other sources are found outside the organisation (known as external sources).

      See below to see some examples.
    subInc: 
      type: accordion
      content:
        - 
          title: Internal
          copy: |
            Internal sources of information may include

            - Line managers
            - Personnel specialists
            - Human Resources department
            - Informed colleagues
            - Staff association representatives
            - Trade union representatives
            - Books and documents held within the organisation.
          img: /images/svg/ba/ba_u1_s1_p4_accordion_1.svg
        - 
          title: External
          copy: |
            External sources of information may include

            - Libraries
            - Citizens Advice Bureau
            - Legal professionals
            - Educational establishments / courses
            - Trade unions – regional and / or head office
            - Chambers of Commerce
            - Employer / industry organisations
            - ACAS
            - Business Link
            - Government
            - Equality and Human Rights Commission
          img: /images/svg/ba/ba_u1_s1_p4_accordion_2.svg
  -
    title: Summary
    theme: t-bg-primary i-summary
    copy: As you can see, there are many sources of high quality information out there. By taking time to explore this information, most people should be able to find out what they need to know.

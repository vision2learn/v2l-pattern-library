  -
    title: Representative bodies
    theme: 
    layout: media
    copy: |
      ### Support for staff

      One of the ways that employees can receive help and support in the workplace is through representative bodies.

      The best known examples of representative bodies are trade unions.  Non-trade union representation may also be found in certain organisations.  According to ACAS, there are 50% trade union and 50% non-trade union representatives in the UK.
      
      There are also other sources of support, including staff associations and trade associations.

    img: /images/svg/ba/ba_U1_S1_p4_Fiftypercent.svg
    #image needs to be large
  -
    title: What is representation
    theme: t-bg-supporting3
    copy: |
      Representation at work is the system by which individual employees – either union or non-union representatives – are given the right to speak on behalf of their colleagues on important issues in the workplace. Representation is a way of formalising the employer-employee relationship by establishing channels for people at work to
      - share information 
      - communicate 
      - consult 
      - negotiate 
      - protect their employment rights 
      - build positive relationships based on trust and co-operation.

      Please select the following images to see for each of the four areas what -
      1. representation is most commonly used for, and 
      2. what the law says

      Then have a look at the Time to think.

    subInc:
      type: reveal
      content:
        -
          title: Individual - 1. Representation is most commonly used for -
          copy: |
            Individual issues, where an employer and employee need to discuss often sensitive issues. For example, an employee may have a complaint with their manager about bullying or discrimination, or a manager may feel an employee’s performance or conduct is falling below the required standard.
          img: ba_u1_s1_p4_rep1a.svg
        -
          title: Individual - 2. The law says -
          copy: |
            Workers have a statutory right to be accompanied by a fellow worker or trade union official at disciplinary or grievance hearings.
          img: BA_U1_S1_P4_Rep1b.svg
        -
          title: Group - 1. Representation is most commonly used for -
          copy: |
            Group issues, when employers need to communicate and consult with the whole workforce. This is often done in employee forums – also known as joint consultative committees or works councils.
          img: BA_U1_S1_P4_Rep2a.svg
        -
          title: Group - 2. The law says -
          copy: |
            Employers are required to consult employee representatives on many issues including - 
            * collective redundancies 
            * health and safety 
            * transfer of undertakings.
          img: BA_U1_S1_P4_Rep2b.svg
        -
          title: Collective bargaining - 1. Representation is most commonly used for -
          copy: |
            Collective bargaining, related to the terms and conditions of employment, where negotiation often takes place between senior management and union representatives on an ongoing basis.
          img: BA_U1_S1_P4_Rep3a.svg
        -
          title: Collective bargaining - 2. The law says -
          copy: |
            Recognised trade unions have the legal right to bargain about pay, hours and holidays. Most agreements by employers to recognise trade unions for collective bargaining are entirely voluntary.
          img: BA_U1_S1_P4_Rep3b_1.svg
        -
          title: Change issues - 1. Representation is most commonly used for -
          copy: |
            Change issues, for example where new products have to be developed or new equipment introduced as a result of economic circumstances.
          img: BA_U1_S1_P4_Rep4a.svg
        -
          title: Change issues - 2. The law says -
          copy: |
            The Information and Consultation of Employees (ICE) Regulations were introduced on 6 April 2005 and give all employees of businesses with 50 or more employees the right to request an information and consultation agreement.

          img: BA_U1_S1_P4_Rep4b.svg

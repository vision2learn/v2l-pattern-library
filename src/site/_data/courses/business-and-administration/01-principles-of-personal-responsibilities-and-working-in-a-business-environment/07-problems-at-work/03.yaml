intro: Well done, you've now completed session 7 of this unit! By working through this session, you have learned all about ?   .
banner: ba-u1-s1-p6.jpg
sections:
  -
    title: Unit Quiz
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        Which of the following must be included in a contract of employment?:
          answers:
            Home address: false
            Place of work: true
            Training days: false
        True or false? “Non union representatives tend to have a collective bargaining role.”:
          answers:
            True: false
            False: true
        Which one of the following is not a reason for exemption under data   protection legislation?:
          answers:
            National security: false
            Crime prevention: false
            Embarrassing photo's on facebook: true
        True or false? “If there is a serious health and safety hazard you should report it to an appropriate manager immediately.”:
          answers:
            True: true
            False: false
        True or false? “Active listening is best done in a bustling office environment.”:
          answers:
            True: false
            False: true
        Select one option to complete this sentence. "Being honest in the workplace _____________.":
          answers:
            Is the behaviour of a loser: false
            Encourages suspicion: false
            Encourages good working relationships: true
        Which one of the following should you do if there is a delay in a piece of work which needs to be given to a colleague?:
          answers:
            Pass the piece on when it is eventually finished: false
            Inform the colleague that there is a problem and let them know when the job will be done: false
            Inform the colleague as soon as you know there is a delay and provide a new workable completion time: true
        True or false? “People who continuously improve their performance are more likely to be better paid.”:
          answers:
            True: true
            False: false
        Which one of the following is not a likely career pathway?:
          answers:
            Resigning: true
            Looking for greater managerial responsibilities: false
            Looking for a chance to specialise (e.g. In business or finance): false
        Which one of the following should an employee do if the failure to solve a problem quickly or the solution to a problem will impact upon many people?:
          answers:
            Seek assistance: true
            Solve it him/her self: false
            Solve it with permission: false

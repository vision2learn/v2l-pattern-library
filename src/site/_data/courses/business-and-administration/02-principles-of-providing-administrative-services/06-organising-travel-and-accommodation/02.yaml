title: "Travel arrangements, Rules and Records"
intro: |
  On this page you will learn about :
  * The types of travel arrangements
  * Company rules for booking travel
  * Why it is important to keep records
banner: ba_u2_s6_p2_travel2.jpg
sections:
  -
    title: Types of arrangements
    layout: media
    theme: t-bg-primary
    copy: |
      ### Different needs and requirements

      The sector a business operates in will determine the type of travel and accommodation arrangements it makes.

      There may be executives who travel worldwide while others travel extensively throughout the UK. Some staff travel locally while others do not travel at all.

      This means that you could be responsible for a wide variety of travel arrangements such as booking international flights, national rail travel and local travel. Or the focus may be on extensive rail travel to UK towns and cities.

    img: /images/svg/ba/ba_u2_s6_p2_image_2.svg
  -
    title: Follow the rules
    theme: t-bg-supporting3
    copy: |
      ###  Rules for booking travel

      Many businesses have established rules for booking travel and accommodation.

      See below to to get an overview of these rules.
    subInc: 
      type: accordion
      content:
        - 
          title: Money rules
          copy: |
            * Spending limits on accommodation, meals and refreshments
            * Payment methods
            * Clean clothes (style appropriate for the business)
          img: /images/svg/ba/ba_u2_s6_p2_accordion_1.svg
        - 
          title: Miscellaneous rules
          copy: |
            * Approved travel firms, travel agents and hotel booking agents
            * The rules on the class of travel (such as first class or standard tickets on the train)
            * Mileage allowances for using their own cars
            * The rules on the use of hire vehicles
            * The distance travelled (or travel time) before overnight accommodation is allowed
          img: /images/svg/ba/ba_u2_s6_p2_accordion_2.svg

    copy2: In some businesses, senior managers and frequent travellers may be given credit cards. Others will claim any money back through an expenses claim.
  -
    title: Keeping records
    theme: t-bg-primary
    copy: |
      ### Being meticulous pays off

      Keeping travel and accommodation records allows a business to be well-organised.

      Select the images below to learn more about the types of travel and accommodation arrangements that will need to be recorded.

    subInc: 
      type: reveal
      content:
        -
          title: Staff requirements
          copy: The requirements of staff members.
          img: ba_u2_s6_p2_reveal_1.svg
        -
          title: Research options
          copy: Research into different options.
          img: ba_u2_s6_p2_reveal_2.svg
        -
          title: Bookings
          copy: Bookings made.
          img: ba_u2_s6_p2_reveal_3.svg
        -
          title: Expenditure
          copy: Expenditure on tickets, mileage, rooms, food etc.
          img: ba_u2_s6_p2_reveal_4.svg
        -
          title: Discounts
          copy: Discounts and refunds received.
          img: ba_u2_s6_p2_reveal_5.svg
        -
          title: Feedback
          copy: Feedback from staff on their transport and accommodation.
          img: ba_u2_s6_p2_reveal_6.svg
    copy2: This means that you could be responsible for a wide variety of travel arrangements such as booking international flights, national rail travel and local travel. Or the focus may be on extensive rail travel to UK towns and cities.
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: Take a moment to list some of the reasons why it's good practice to keep business records.
  -
    title: Why keep records?
    theme: 
    copy: |
      ### Financial and organisational purposes

      Look back at the notes you made in the _Time to Think_ above.

      It's possible they included some of the reasons listed in the slides below.
      Scroll through the slides below to find out more.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Financial records
          text: |
            By keeping good records it is possible to account for all the expenditure being made on travel and accommodation. The expenditure may be compared with and reviewed against the budget. The spending patterns for individuals and departments may also be monitored.

            The accurate financial information will be used by the accountants in the organisation when drawing up accounts. It can also be used to determine future travel budgets.
          img: ba_u2_s6_p2_slide_1.svg
        -
          title: Information retrieval
          text: |
            By keeping good records it is possible for people to easily retrieve information. If small details need to be checked such as train times and check-out times, it can be done so promptly. By keeping well-organised records this information can be easily accessed even if the people arranging the travel are unavailable.
          img: ba_u2_s6_p2_slide_2.svg
        -
          title: Knowledge
          text: By keeping good records it is possible for the organisation to build up valuable information on the travel processes, for example, whether a hotel in an important location is worth using again or whether an airline is offering cheap flights. In this way the business can build up a knowledge bank and some expertise in its travel arrangements.
          img: ba_u2_s6_p2_slide_3.svg
        -
          title: Business improvement
          text: |
            By keeping good records the business is better placed to look for ways of improving its travel and accommodation bookings. This could involve cutting costs and making savings. Without good records these judgements cannot be made. 
            
            It is also possible that there will be places where additional spending brings a better overall return. For example an earlier train may be more expensive but it would allow a colleague to make some speculative visits to potential clients.
          img: ba_u2_s6_p2_slide_4.svg 
  -
    title: Summary
    theme: t-bg-primary i-summary
    copy: |
      * The skills needed to make these arrangements are transferable from one context to another. The focus is on being thoughtful and well organised.
      * It is important that employees with responsibility for arranging travel and accommodation understand what rules, if any, their employer uses.
      * If a business keeps good records of travel and accommodation it can eliminate errors, cut wasted money and time. This contributes to the wider long term effectiveness of the organisation.

title: "What did you learn?" 
intro: Well done, you’ve now completed the second session of this unit! 
banner: ba-u1-s1-p6.jpg

sections:
  -
    title: Learning points
    theme: t-bg-primary
    copy: |
      
      ### In brief

      By working through this session, you have learned all about:

      * Reasons for reviewing working methods, products or services
      * Types of support needed during change
      * The benefits of working with others during change
  -
    title: Session Quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: If important changes are occuring, the impact on the organisation needs to be reviewed.
          answer: reviewed
        -
          sentence: When change occurs in business, there are several types of support that can help people to successfully make the change.
          answer: support
        -
          sentence: When a business goes through change it can cause employees to feel stressed or anxious.
          answer: stressed
        -
          sentence: A great way to support people going through a change process is to behave in ways that offer encouragement and assistance.
          answer: assistance
        -
          sentence: Typical support behaviours include smiling and being willing to listen to others.
          answer: smiling
    theme: i-quiz

title: Energy requirements and malnutrition risk
intro: |
  On this page you will learn about the energy requirements of older people and the risk of malnutrition for older people.
banner: placeholder.jpg
sections:
  -
    title: Circumstances affect meals, food and nutrition
    layout: media
    theme: t-bg-primary1a
    copy: |
      ### Circumstances play a big part in how older people satisfy their nutritional needs

      Some older people:
      * Live alone
      * Rely on family and friends for support
      * Rely on meal delivery services
      * Are in care homes
      * Are immobile

    img: /images/svg/placeholder_icon.svg
  -
  -
    title: Reasons for different energy requirements
    theme: t-bg-primary
    copy: |      
      Scroll through the slides below to learn more.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Physical changes
          text: |
            As people grow older their physical powers diminish. For example the heart becomes slower, arteries stiffen, bones shrink in size and density, muscles lose strength and flexibility, coordination diminishes and eyesight may worsen. These and other age related changes may result in lower levels of activity and consequently lower energy requirements. 
          img: placeholder_icon.svg
        -
          title: Employment changes
          text: |
            When people are employed, their daily work routine will naturally involve some physical activity. As people retire, it is likely that their activity levels will fall significantly. As activity levels fall, so too will the energy requirements. 
          img: placeholder_icon.svg
        -
          title: Social and cultural changes
          text: |
            In society there is a general expectation that as people get older they become far less active. This is reflected in the early compulsory retirement age imposed by the government or the stereotype of old people requiring wheelchairs and walking sticks to get around. More recently, social attitudes have changed and older people are now encouraged to increase their activity levels although this is not always possible. 
          img: placeholder_icon.svg
        -
          title: Summary
          text: |
            These changes come together, meaning that older people need to eat far fewer calories than younger people.

            Older people need to make sure that they keep active and acknowledge that cutting food consumption does not lead to the loss of important nutrients. Often, when older people eat less they risk not getting enough fibre, vitamins or minerals.

            Although older people do require fewer calories, it is important that older people continue to have a healthy, balanced and varied diet. 
          img: placeholder_icon.svg
  -

    copy: |
      ### The risk of malnutrition for older people

       There is a lot of evidence to show that older people can suffer from malnutrition as a result of having a poor diet. Watch the following video to learn about the potential causes of malnutrition for older people. 
    video: placeholder_pc.mp4

  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your Unit 2 assessment, you will need to describe reasons why older people may have different energy requirements and be at risk of malnutrition. The materials on this page will help you to do this. 
  -
  -
    title: Summary
    theme: t-bg-primary i-summary
    copy: |
      With so many factors influencing diets and potentially leading to malnutrition, it is important that the diet and well-being of older people is carefully monitored. 
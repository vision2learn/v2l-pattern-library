      type: quick-quiz
      content:
        Is the following statement true or false? "There are no special dietary rules in Christianity and Buddhism.":
          answers:
            True: true
            False: false
        Halal food is consumed by members of which religion?:
          answers:
            Judaism: false
            Hinduism: false
            Islam: true
        What is Ramadam?:
          answers:
            A day when Jews fast and pray: false
            A period of fasting in the Islamic calendar: true
            A period when Christians fast before Easter: false

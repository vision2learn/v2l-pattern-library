title: Religious groups and food
intro: |
   People choose to cut out certain foods for many reasons. The religious group that a person belongs to can have a significant influence on what they do and do not eat. 
banner: placeholder.jpg
sections:
  -
    title: Religious groups
    theme: t-bg-primary
    copy: |
      Many groups have very strict rules on which foods may be eaten and when. Scroll through the slides below to learn more.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Buddhist
          text: |
            There are no food restrictions placed on Buddhists. However, depending on which school of Buddhism a person belongs to they may choose to be vegetarian.
          img: placeholder_icon.svg
        -
          title: Hindu
          text: |
            Hindus are not allowed to eat meat, fish, poultry or eggs. While some may occasionally eat meat, almost all avoid beef or any leftover food and especially food that has gone stale.
          img: placeholder_icon.svg
        -
          title: Jew
          text: |
            Porcine products are forbidden and other meat must be killed in a specific way (kosher). Jews do not eat meat and milk together and utensils must be kept separate. Some Jews will fast at certain times of the year, most prominently at Yom Kippur.
          img: placeholder_icon.svg
        -
          title: Muslim
          text: |
            Pork, carrion and blood are forbidden and other meat must be killed in a specific way (halal). Any products that contain pork fat or other non-halal animal fat must be avoided. Muslims do not drink alcohol and fast during Ramadan.
          img: placeholder_icon.svg
        -
          title: Sikh
          text: |
            Sikhs do not eat beef or drink alcohol. Some Sikhs will not eat any meat, but especially meats killed in ritual such as halal or kosher. Sikhs may fast during a full moon or on certain holidays.
          img: placeholder_icon.svg
  -
  -
    title: Case study
    theme: t-bg-primary1a i-case-study
    copy: |
      ### Case study - Religions and food

      Students at a school in London have decided to investigate the things that different religions believe about food. They investigated Buddhism, Christianity, Hinduism, Islam and Judaism. 
      
      Once the research was complete, the students discovered that there were a number of dietary differences between and within the different religions. It’s important to understand and respect the dietary choices of other people, as it can help to support and promote diversity and differences in dietary preferences. 

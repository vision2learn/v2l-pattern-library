title: What did you learn? 
intro: |
  Well done, you’ve now completed the third session of this unit! In this session you have learnt about 
  
banner: summary.jpg
sections:
  -
    title: Summary and learning points
    theme: t-bg-primary
    copy: |
      In this session, you have learnt about different values and beliefs and how they can affect what people eat or don't eat. You have learnt about:

      * Special dietary requirements for various religious / ethnic groups
      * Different types of vegetarian diet
      * Preparing food for people who have specific dietary requirements
      
      Take a look at the following learning points to see a summary of what you have covered in this session:
      

  -
    title: Why do people have specific dietary requirements?
    theme: t-bg-primary
    copy: |
      Some people have specific dietary requirements. This usually means they do not eat certain things because of health reasons, or personal choice. In this Session we will look at some of the different reasons in more detail. Scroll through the slides below to read the reasons why some people might have special dietary requirements. 

      _ID note: text is from p2 accordion - this slider could be an introduction to the video?_

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Allergies
          text: |
            If someone has an allergy it means that their body’s immune system is particularly sensitive to some foods. When this food is eaten it will cause an allergic reaction. They therefore need to eliminate this food from their diet.
          img: placeholder_icon.svg
        -
          title: Intolerance
          text: |
            Intolerance means that the body is unable to properly digest certain foods. When a food is eaten it tends to be longer before a reaction occurs than for an allergy, but the symptoms may last for several hours, if not longer. They need to eliminate this food from their diet.
          img: placeholder_icon.svg
        -
          title: Coeliac disease and diabetes
          text: |
            Coeliac disease and diabetes are conditions which demand specific diets. People who are coeliacs are unable to eat gluten products and those with diabetes have to limit their intake of sugary foods.
          img: placeholder_icon.svg
        -
          title: Religious / ethnic groups
          text: |
            Certain religious and ethnic groups have strict beliefs about what can and cannot be eaten. People belonging to these groups will have diets that follow these rules.
          img: placeholder_icon.svg
        -
          title: Personal values and lifestyle choices 
          text: |
            Some people deliberately choose a specific diet for personal or moral reasons. For example, someone may choose to eliminate meat from their diet because they believe killing animals for food is immoral.
          img: placeholder_icon.svg

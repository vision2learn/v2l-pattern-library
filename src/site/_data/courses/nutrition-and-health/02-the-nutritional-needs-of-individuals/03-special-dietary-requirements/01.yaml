title: Special dietary requirements 
intro: |
  ### Nutritional needs
  
  In this Session, we’ll look at the impact that different health conditions, personal values and religious beliefs can have on our diet. 
   
banner: placeholder.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about different values and beliefs and how they can affect what people eat or don't eat:
      * Special dietary requirements for various religious / ethnic groups
      * Different types of vegetarian diet
      * Preparing food for people who have specific dietary requirements
  -
  -
    title: Factors affecting diet 
    theme: t-bg-supporting2
    copy: |
      There are many different factors which affect why someone might have special dietary requirements. In this Session, we will focus on three of the most common factors.


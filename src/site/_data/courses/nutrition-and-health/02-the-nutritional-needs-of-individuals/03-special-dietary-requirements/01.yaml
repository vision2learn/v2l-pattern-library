  -
    title: Quick quiz
    copy: How much do you know about different health conditions which have special dietary requirements?
    subInc: 
      type: word-quiz
      content:
        -
          sentence: An allergy could cause an anaphylactic shock.
          answer: allergy
        -
          sentence: A person that suffers with intolerance may not be able to eat lactose products. 
          answer: intolerance
        -
          sentence: Diabetes causes problems with insulin production or function.
          answer: Diabetes
        -
          sentence: Someone who cannot not eat shellfish would have an allergy. 
          answer: allergy
        -
          sentence: Coeliac is when a person cannot eat wheat, barley or rye.
          answer: Coeliac
        -
          sentence: An intolerance is when the body is unable to digest a certain food.
          answer: intolerance
        -
          sentence: Coeliac is when the body attacks itself when certain foods are eaten.
          answer: Coeliac
        -
          sentence: Diabetes is when there is a need to control blood sugar levels.
          answer: Diabetes
    theme: i-quiz
  -
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Think about how you would summarise the different reasons why someone might have specific dietary requirements. This will come in handy when you complete your Unit 2 Assessment.

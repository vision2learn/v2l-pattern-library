    title: Why do people become vegetarians?
    layout: media
    theme: t-bg-supporting3
    copy: |
      People can become vegetarians for various reasons. Some do so because of health problems or because they don’t like the taste of meat products, while others believe that a vegetarian diet is healthier.
      
      Ethical concerns are perhaps the most common reason why people become vegetarians. This is where they believe it is wrong to kill and eat animals. 

    img: /images/svg/placeholder_icon.svg

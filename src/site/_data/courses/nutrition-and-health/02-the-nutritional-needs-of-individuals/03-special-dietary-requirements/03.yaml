    title: Case study
    theme: t-bg-primary1a i-case-study
    copy: |
      ### Case study - Eating a vegan diet

      Both vegetarians and vegans have to be careful that by cutting out certain foods they are not cutting out important nutrients! Have a look at the case study on the right to see how this can be avoided. 

      Mr Brown’s daughter, Erika, has become a vegan whilst studying at university. Before Erika comes home for the summer, Mr Brown wants to make sure that she is eating a healthy diet. Mr Brown made a list of the foods that Erika would no longer be eating. He then did a bit of research into the nutrients that Erika might be missing out on, and how they could be replaced. 

      To help Erika, Mr Brown collected the following information about the food she no longer eats.

      _ID Note: Accordion or video?_
      
      * Milk, cheese and yoghurt
      * Red meat
      * Oily fish
    subInc: 
      type: accordion
      content:
        - 
          title: Milk, cheese and yoghurt
          copy: |
            **Nutrient missed: calcium**
            Calcium is needed for strong and healthy bones and teeth.

            Other sources of this nutrient:
            * Dried fruit
            * Pulses
            * Sesame seeds

            **Nutrient missed: vitamin D**
            Vitamin D is needed to help calcium absorption.

            Other sources of this nutrient:
            * Sunshine
            * Fortified fat spreads
            * Fortified cereals
        - 
          title: Red meat
          copy: |
            **Nutrient missed: iron**
            Iron is essential for the production of red blood cells. It is harder for the body to absorb iron from plant-based food than from meat.

            Other sources of this nutrient:
            * Dark green vegetables
            * Nuts
            * Wholemeal bread

            **Nutrient missed: vitamin B12**
            Vitamin B12 is essential for a healthy blood and nervous system. It is only found naturally in animal food sources.

            Other sources of this nutrient:
            * Fortified cereals 
            * Fortified soya milk
            * Yeast extract spreads
        -
          title: Oily fish
          copy: |
            **Nutrient missed: omega-3 fatty acids**
            Can help maintain a healthy heart and reduce the risk of heart disease when eaten as part of a healthy diet

            Other sources of this nutrient:
            * Walnuts
            * Linseed / flaxseed oil
            * Tofu

  -
    title: Case study
    layout: media
    theme: t-bg-primary1a i-case-study
    copy: |
      ### Agnes

      Agnes is in her late 80s and lives alone. She is mobile but struggles to walk long distances. Agnes is unable to drive and she does not like using buses when she has stuff to carry such as shopping bags. She prefers to use her local village shop as it is a convenient distance from her home and if she goes twice a week she has little to carry. 
      
      Agnes enjoys the convenience of her local shop but finds it expensive with limited options for healthy meals, so she makes the trip to the large supermarket in the nearby town every couple of weeks. 
      
      Agnes likes the larger choice of food and the choice of healthier options, but she does struggle with the 30 minute bus trip to the supermarket. Agnes also finds the large store hard to navigate with its narrow aisles, high shelves and deep freezers.

    img: /images/svg/placeholder_icon.svg

  -
    title: What did you find?
    theme: t-bg-primary3
    copy: |
      
    subInc: 
      type: accordion
      content:
        - 
          title: 
          copy: |
            Fresh and healthy ingredients are not necessarily more expensive. When you are feeding a large family you need more food and buying in bulk is usually cheaper.

            Janine could do the following to keep her costs low:

            * Research some meals which are quick and easy
            * Look out for multibuy offers to stock up on certain ingredients when they are cheaper
            * Make up large quantities when she is cooking so that she can freeze some portions and not need to cook every day
            * Purchase fruit and vegetables that are in season.



  
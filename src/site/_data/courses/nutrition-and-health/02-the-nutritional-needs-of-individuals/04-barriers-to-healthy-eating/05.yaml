title: Individual lifestyle choices
intro: |
  On this page we will look at how a busy lifestyle can often mean an unhealthy lifestyle. 
banner: placeholder.jpg
sections:
  -
    title: Lifestyle and diet choices
    theme: t-bg-primary
    copy: |
      We have already looked at some lifestyle issues on the previous page. This includes the shift of many people becoming ‘money-rich and time-poor’ and the growth of convenience foods.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Eating on the move
          text: |
            With many people trying to find their work-life balance there has been a shift towards ‘eating on the move’, rather than preparing and eating meals at home. This has led to a larger ‘fast food’ market as well as the increasing availability of a wide range of takeaway meals and convenience foods that can be warmed up quickly to maximise spare time.
          img: placeholder_icon.svg
        -
          title: Seems easier to buy ready-made food
          text: |
            Also, as people become better travelled or try new types of cuisine they develop a taste for food that they have never seen being cooked. It appears easier to buy ready-made food than to try and cook it from scratch. Within this context new generations of children grow up without seeing their parents prepare healthy food; encouraging them to grow up and do the same. 
          img: placeholder_icon.svg
  -
  -
    title: Case study
    layout: media
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Emma and Doug

      Emma and Doug are young professionals who both work in central London and live nearby. They grab a coffee and a croissant on the way to work and often have business lunches with clients. Working late means that Emma and Doug usually do not have any time to go home for dinner before their evening plans. They have a busy social life and usually eat out with friends or will pick up some food on-the-go such as a fast food meal on the way to the cinema, theatre or a music gig. They have a comfortable income and are rarely at home. When Emma and Doug are at home they find that there is little food in the cupboards so usually treat themselves to a takeaway! 

    img: /images/svg/placeholder_icon.svg
  -
  -
    title: Stats and Facts
    layout: media
    theme: t-bg-supporting2
    copy: |
      * The biggest consumers of fast food in the UK are people aged 25-34.
      * the average Briton spends £110 on takeaways each month.
    img: /images/svg/ln/LM_Stats.svg
  -
  -
    title: Summary
    theme: t-bg-primary i-summary
    copy: |
       For many people, there will be more than one barrier stopping them from eating a healthy diet. These barriers can influence many generations and lead to bad eating habits that are very difficult to break.
       
       By taking time to learn about health and nutrition, it becomes possible to make informed choices that can improve the quality of life. 
  -
  -
    title: Lifestyle changes
    theme: 
    copy: |
      Eating pre-prepared ready meals and takeaways is usually the result of someone’s lifestyle. It is only through changes to a person’s lifestyle that they can begin to eat a healthier diet.

      Making lifestyle changes to overcome barriers to healthy eating may sound like a major effort but in reality it needn’t be. 
  -
  -
    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Emma and Doug's lifestyle changes

      In an effort to eat healthier, Emma and Doug have set about making a number of changes in their day-to-day life. 

      Select the images below to see how small lifestyle changes have allowed Emma and Doug to eat healthier. 

    subInc: 
      type: reveal
      content:
        -
          title: Plan
          copy: |
            At the beginning of the week they plan out their meals for the next 7 days and the ingredients that are required. 
          img: placeholder_icon.svg
        -
          title: Portion sizes
          copy: |
            When preparing meals they only eat the recommended portion sizes and freeze any leftovers.
          img: placeholder_icon.svg
        -
          title: Healthy packed lunches
          copy: |
            Also, they have both started getting up half an hour earlier they can prepare healthy packed lunches and aren’t eating on the move. 
          img: placeholder_icon.svg
        -
          title: Long-life foods
          copy: |
            They have also stocked up on long-life foods such as cans of tuna, frozen peas and tinned fruit so that whenever they do run out of fresh food they still have the option of nutritious meals. 
          img: placeholder_icon.svg
  -
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      For your Unit 2 assessment you must be able to give examples of how individual lifestyle choices may prevent people from choosing a balanced diet and suggest how this may be overcome. Thinking about some of the changes Emma and Doug made will help you when it comes to answering this question in your assessment. 
  -
  -
    title: Summary
    theme: t-bg-primary i-summary
    copy: |
      Regardless of lifestyle, everyone’s diet could benefit from:

      * Planning and preparing meals
      * Eating smaller portions
      * Eating meals with your partner or family
      * Cutting out convenience foods altogether.

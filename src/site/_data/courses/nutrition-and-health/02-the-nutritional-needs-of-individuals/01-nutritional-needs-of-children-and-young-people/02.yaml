    title: Case study
    theme: t-bg-primary1a i-case-study
    copy: |
      ### Planning balanced meals and snacks 

      It can be easy to lose track or forget about the calorie and nutritional content of food – particularly for children and young people who may not find calorie counting very interesting!

      Planning meals and snacks is the best way to ensure a child or young person is getting all the nutrients they need in their diet.

      Click on the example meal plan to find out what you need to know to put together a really good meal plan. The numbers in brackets represent the number of servings. 

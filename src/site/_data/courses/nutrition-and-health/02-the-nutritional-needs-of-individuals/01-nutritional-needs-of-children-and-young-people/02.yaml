  -
    title: Summary
    theme: t-bg-primary i-summary
    copy: |
      Before putting together a meal plan you must plan exactly what is needed for a healthy, balanced diet and work out which food and drink provides these nutrients.

      Meal plans are useful for parents of young children to make sure they’re getting all the correct nutrients.

      Meal plans are also useful for schools, particularly when children attend a breakfast or after school club as the school has a duty to provide balanced, healthy meals. 

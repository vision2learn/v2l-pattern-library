  -
    title: Servings and Portions
    layout: media
    theme: t-bg-primary
    copy: |
      A serving and a portion are different things.  _too wordy - to be rewritten_

      Servings are recommended amounts of food; portions are the amount of food you choose to eat. 
      
      Portion sizes are completely in your control – you can choose whether to have a big or small portion. Servings are a measure, representing the recommended amount of food that we should eat. Portions can be smaller or bigger than the recommended serving. For example, the label on a box of cake may advise that the cake serves 6 people, but the portion you choose to eat may be more or less than the recommended serving.
    img: /images/svg/nh/placeholder_icon.svg

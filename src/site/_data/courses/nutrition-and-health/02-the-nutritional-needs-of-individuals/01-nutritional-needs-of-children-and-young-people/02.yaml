          title: Who, how and what...
          copy: |

            **Who is it for?**

            Children and teenagers require different amounts of nutrients and calories depending on their age. Knowing exactly who your meal plan is for will help you know exactly what their energy requirements, and nutritional requirements, are.

            **How is this achieved?**

            Knowing who the meal plan is for and what nutrients they need will then help you plan exactly which foods they should eat. The most important factor here is knowing which foods contain which nutrients and making sure they cover the correct portions of the five food groups.

            **What is needed?**

            You’ll learn more about the specific nutritional and energy requirements of children and young people later in the Session but for all age groups a balanced diet of the five food groups (you learned about in Unit 1) should be the aim.

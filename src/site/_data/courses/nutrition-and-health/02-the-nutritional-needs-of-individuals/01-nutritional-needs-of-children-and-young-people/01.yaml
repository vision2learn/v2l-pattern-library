title: Welcome to Unit two
intro: |
    ### The nutritional needs of individuals
    
    Welcome to the second unit of your Level 2 Certificate in Nutrition and Health.  This unit will help you to gain an understanding of how the nutritional needs of individuals can vary.
banner: placeholder.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit, you will cover the following criteria of your Nutrition and Health qualification.

      You will:

      Know the nutritional needs of children and young people.

      [View the complete set of learning outcomes for this unit.]()
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about the following in Nutrition needs of children and young people:

      * Planning balanced meals and snacks for different age groups
      * The factors influencing the nutritional needs and eating patterns of different age groups
      * The energy requirements for different age groups
      * Recommended daily intake of the five food groups
      * Good food sources of key nutrients for children, and young people
  -

    title: The nutritional needs of young children
    theme: t-bg-primary
    copy: |
      Planning balanced meals and snacks isn’t just about making sure children get all the energy they require. Meal plans must also ensure that the child or young person is getting all the nutrients they need.

      However, just like energy requirements, nutritional needs also change as a child gets older.

      Scroll through the slides to find out more about the nutritional needs of young children. 


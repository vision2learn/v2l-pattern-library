    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      For your Unit 2 assessment you must be able to describe factors that can influence the eating patterns of children and teenagers. Familiarising yourself with the information on this page will help you when it comes to doing your assessment. 
  -
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Eating patterns

      Everyone has an eating pattern. This refers to what you eat, when you eat and where you eat! Some people might have strict eating patterns which include three meals a day and no snacks in between, whereas others may snack on food throughout the day and never plan when they will have their meals.

      Please see the following video for some of the different factors which might affect eating patterns and then compare them in the case studie below.
    video: placeholder_pc.mp4

title: Nutritional needs of children and young people
intro: |
    Intro text
banner: placeholder.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      As part of your Unit 2 assessment you must be able to identify good food sources for the key nutrients that children and young people need. Looking over the information on this page will help you when you it comes to tackling your assessment. 
  -
  -
    title: The nutritional needs of children and young people
    theme: t-bg-primary
    copy: |
      Not only will a balanced diet ensure a child is getting all the required nutrients but it will also encourage good eating habits that carry on into adulthood.  Scroll through the slides below to find out which foods are good sources of key nutrients.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Calcium
          text: |
            Found in milks, cheese and dairy. Some other calcium-rich foods include:
            * Plain yoghurt
            * Ricotta cheese
            * Whole grain bread
            * Cheddar cheese

            Research indicates that 25% of teens have a calcium intake below the recommended level, which can have serious implications for their future bone health. For older people, brittle and weak bones caused by low calcium intake are a significant root of health problems. 

          img: placeholder_icon.svg
        -
          title: Iron
          text: |
            Found in red meats such as beef, pork and lamb as well as beans and leafy green vegetables. Sources for children might include:
            * Lean meat
            * Fortified cereal
            * Broccoli

            Iron deficiency is very common in the UK. The National Diet and Nutrition Survey of 2008/09 showed that up to 13% of teenage boys and 27% of teenage girls were found to have low iron levels. Rapid growth, combined with an active lifestyle and poor diet, can result in iron-deficiency anaemia. 

          img: placeholder_icon.svg
        -
          title: Vitamin A
          text: |
            Good sources of vitamin A include:
            * Cheese
            * Eggs
            * Carrots
            * Low-fat spreads
            * Yoghurt

          img: placeholder_icon.svg
        -
          title: Vitamin C
          text: |
            Fruit and vegetables are rich in vitamin C, including:
            * Oranges
            * Peppers
            * Strawberries
            * Blackcurrants
            * Broccoli
            * Potatoes

          img: placeholder_icon.svg
        -
          title: Vitamin D
          text: |
            Humans get a lot of their vitamin D from sunlight but it can also be found in foods such as:
            * Oily fish
            * Eggs
            * Fortified cereals

            Vitamin D is important for good health, growth and strong bones. A lack of vitamin D is very common and can cause general aches and pains. A severe lack of Vitamin D can cause serious problems such as rickets in children and osteomalacia in adults. 

          img: placeholder_icon.svg
        -
          title: Protein
          text: |
            Beans, meats, cheese and nuts are a useful source of protein. Good sources for children include:
            * Turkey breast
            * Cheese
            * Milk
            * Peanut butter

          img: placeholder_icon.svg
        -
          title: Carbohydrates
          text: |
            As with adults, carbohydrates should make up 50 – 60% of a child’s nutritional intake. Good sources include:
            * Fresh fruit and veg
            * Wholegrain cereals
            * Wholegrain breads
            * Brown rice

          img: placeholder_icon.svg
        -
          title: Fats
          text: |
            While unhealthy fats such as those found in junk food should be avoided, good sources of dietary fat include:
            * Full-fat milk
            * Nuts
            * Peanut butter
            * Trout, salmon

          img: placeholder_icon.svg
        -
          title: Fibre
          text: |
            text
          img: placeholder_icon.svg

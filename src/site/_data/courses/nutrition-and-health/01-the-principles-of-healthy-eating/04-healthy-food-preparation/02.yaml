    title: On the web
    theme: t-bg-secondary2 i-on-web
    include:
      type: on-the-web
      copy: |
        For more information on different cooking methods and their benefits, take a look at the following website: 

      links:
        Student cook - cooking methods: http://www.studentcook.co.uk/CookingMethodsAndTechniquesCategory.html
  -
  -
    title: Summary
    theme: t-bg-primary i-summary
    copy: |
      Many people use a range of cooking methods when preparing meals. This encourages variation in their diet and they get to experiment with different cooking methods for different foods. 

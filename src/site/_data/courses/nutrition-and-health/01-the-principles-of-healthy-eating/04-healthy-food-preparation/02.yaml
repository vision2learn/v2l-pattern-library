    title: Summary
    theme: t-bg-primary i-summary
    copy: |
      Many people use a range of cooking methods when preparing meals. This encourages variation in their diet and they get to experiment with different cooking methods for different foods. 
  -
  -
    title: Quick quiz
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        Which method of cooking vegetables retains the most nutrients:
          answers:
            Boiling: false
            Frying: false
            Steaming: true
            Roasting: false
        The healthiest oil for cooking and using with salads is:
          answers:
            Coconut: false
            Olive: true
            Avocado: false
            Sunflower: false
        Is the following statement true or false? "Margarine is healthier than butter.":
          answers:
            True: false
            False: true
        The healthiest way to cook meat is:
          answers:
            Roasting: true
            Frying: false
            Poaching: false
            Grilling: false
        Is the following statement true or false? "Cooking food quickly retains more nutrients than slowly cooking food.":
          answers:
            True: true
            False: false

  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Cooking methods and nutritional needs
      Please see the following video for .....

      _Include all the info from all slides - Cooking methods and nutritional needs, Advantages and disadvantges - old pages 4 and 5_
    video: placeholder_pc.mp4
  -
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      It’s important that you can identify healthy food preparation methods for a range of different food types. You should also be aware that different cooking methods can affect the nutritional value of foods.
  -
  -
    title: Forum
    layout: media
    theme: t-bg-primary2
    copy: |
      Think about five ways that you could make your diet healthier without giving up the pleasure you get from eating meals.

      If you get stuck, why not take to the forum to get some ideas from other learners!

    img: /images/svg/ln/LM_Forum.svg
  -
  -
    title: Time to think
    theme: t-bg-primary2 i-think
    include: 
      type: time-to-think
      copy: |
        Think about what you have eaten in the last three days. Which preparation methods did you use most?

        Can you identify ways of preparing the same food more healthily?
  -

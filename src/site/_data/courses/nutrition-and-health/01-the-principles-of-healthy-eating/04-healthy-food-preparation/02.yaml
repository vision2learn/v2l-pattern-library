    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      It’s important that you can identify healthy food preparation methods for a range of different food types. You should also be aware that different cooking methods can affect the nutritional value of foods.
  -
  -
    title: Forum
    layout: media
    theme: t-bg-primary2
    copy: |
      Think about five ways that you could make your diet healthier without giving up the pleasure you get from eating meals.

      If you get stuck, why not take to the forum to get some ideas from other learners!

    img: /images/svg/ln/LM_Forum.svg

    layout: media
    theme: t-bg-primary2
    copy: |
      Think about five ways that you could make your diet healthier without giving up the pleasure you get from eating meals.

      If you get stuck, why not take to the forum to get some ideas from other learners!

    img: /images/svg/ln/LM_Forum.svg

title: Healthy food preparation
intro: |
  In this session we’ll look at some of the principles behind healthy food preparation.
   
banner: placeholder.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:      
      * Factors to be considered when planning healthy meals
      * How a variety of cooking methods affect the nutritional values of foods
      * Healthy food preparation methods for a range of types of food
  -
  -
    title: Making choices
    theme: t-bg-primary
    copy: |
      In order to prepare healthy meals you need to use all the information you’ve learnt so far.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Factors to be considered
          text: |
            Remember how age, fitness levels, health conditions and even gender can affect nutritional needs. 

            We’ve looked at each of the five food groups and why they are important.

            We looked at which nutrients we need and what they do/why we need them.

            In this session we’ll look at these ideas and the different ways we can cook food.
          img: placeholder_icon.svg
        -
          title: Making choices
          text: |
            When asked to decide between a balanced meal that does not taste very nice, and a tasty meal with limited nutritional value, most people would choose the second option!

            This is because people get instant pleasure from nice tasting food, but it takes a while to see any benefits from nutrients.

            However, it is possible to eat a balanced nutritional meal that is also enjoyable. You need to consider prefferred falouvrs, textures, colours and varieties within food groups when planning enjoyable meals.
          
          img: placeholder_icon.svg
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will need to identify factors to be considered when planning healthy meals.
  -
  -
    title: Case study
    layout: media
    theme: t-bg-primary1a i-case-study
    copy: |
      ### Case study - Mim

      Mim often chooses tasty, unhealthy foods over nutritionally balanced meals. She thinks that healthy food tastes awful and doesn’t make any effort to try and enjoy it.

      Although there are very few immediate problems for Mim, over time she begins to feel tired and notices that her skin does not look as clear. After years of eating like this, she could face some of the problems that you learnt about session 1.

      Mim’s friends are encouraging her to eat more healthily. Although she does not like eating boiled vegetables, she finds she likes them as part of a meal, such as stir-fry or a curry. Similarly, even though Mim doesn’t like fruit, she really enjoys smoothies.

      By understanding her own tastes, she has been able to improve her diet and feel healthier.
    
    img: /images/svg/placeholder_icon.svg
  -
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        Make some notes about the things that you like and dislike. Could any of your preferences make it harder to eat for pleasure AND nutrition? 
  -
  -
    title: Reveal
    theme: t-bg-primary
    copy: |
       A simple way of making meals healthier is to use healthy alternatives. This involves substituting some ingredients for others that are lower in fat, salt or sugar.
       
       Another option is to reduce the amounts of a particular ingredient. Click on the images to see some examples of each method. 
    subInc: 
      type: reveal
      content:
        -
          title: Substitution
          copy: |
            * Use lean steak mince instead of mince beef
            * Use low fat crème fraiche instead of cream
            * Use brown and whole-wheat varieties of rice, bread and pasta instead of white ones.

          img: placeholder_icon.svg
        -
          title: Reduction
          copy: |
            * Use less cheese when making a pizza
            * Use less meat and more vegetables in casseroles and pies
            * Use less sugar in cakes and biscuits.

          img: placeholder_icon.svg
  -
  -
    title: Activity - Case study
    layout: media
    theme: t-bg-primary2
    copy: |

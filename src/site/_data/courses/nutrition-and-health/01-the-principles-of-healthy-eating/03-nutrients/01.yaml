    title: The six classes of nutrients - PLACEHOLDER
    layout: media
    theme: t-bg-primary
    copy: |
      _Type of element to be decided - Slider, Accordion, Activity, Case study etc - to replace 5 slides on old page 2 - https://www.vision2learn.com/uploaded_programme_files/nutrition-health-2015/unit01/session03/pg2.asp_

      A nutrient is a chemical substance that provides nourishment to the body.
      
      Nutrients are essential for growth, development and maintenance of health. There are six classes of nutrients.


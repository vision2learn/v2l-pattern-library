  -
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your Assessment, you will need to define the term nutrients, describe the six key classes of nutrients, how they maintain health and good sources of food for each of these. You will also need to know the factors that influence how much of each nutrient a person needs.
  -
  -
    title: Foods that are high in nutrients - NEW - TO BE DECIDED
    theme: t-bg-primary
    copy: |
      Scroll through the slides below to see some examples of foods high in nutrients.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Salmon
          text: |
            Salmon is an oily fish and contains high levels of omega-3s fatty acids, along with many other vitamins and minerals such as magnesium, potassium and B-vitamins. Good for wellbeing and reducing risk of dementia and heart disease. 

          img: placeholder_icon.svg
        -
          title: Kale
          text: |
            Kale is said to be even healthier than spinach. It contains a range of minerals and is loaded with vitamin A, C and K1.

            This nutrient rich green can help reduce the risk of cancer. 

          img: placeholder_icon.svg
        -
          title: Garlic
          text: |
            Garlic is great for flavour and contains vitamins C, B1 and B6 plus many minerals. It can help lower blood pressure, reduce the risk of heart disease and some cancers. 
          img: placeholder_icon.svg
        -
          title: Potatoes
          text: |
            Potatoes also have lots of minerals and vitamin C plus most of the B vitamins. So they’re filling and nutritious. Studies have found that boiled potatoes keep you fuller for longer and if you allow them to cool they form ‘resistant starch’ which increases the health benefits. 
          img: placeholder_icon.svg
        -
          title: Liver
          text: |
            Liver, as with all organ meats, is more nutritious than the more common muscle meat regularly eaten today. It’s function is to store important nutrients for your body to use and contains many vitamins itself. 
          img: placeholder_icon.svg
        -
          title: Shellfish
          text: |
            Shellfish, particularly clams and oysters are very nutritious and provide vitamin B12, vitamin C and D and many minerals. 
          img: placeholder_icon.svg
        -
          title: Blueberries
          text: |
            Blueberries are possibly the most nutrient rich fruit and contain a high quantity of antioxidants. Studies have found that by adding some to their diet, overweight people have lowered their blood pressure and cholesterol levels. 
          img: placeholder_icon.svg
        -
          title: Egg yolks
          text: |
            Egg yolks are considered to be the most nutritious of all foods. They’re full of vitamins, minerals and other nutrients. They are a high quality protein and healthy fat with studies showing that they can help with weight loss. 
          img: placeholder_icon.svg
        -
          title: Dark chocolate / Cacao ?
          text: |
            Dark Chocolate contains many antioxidants and is highly nutritious. It is full of copper, magnesium, iron, fibre and other nutrients. It’s important to buy at least 70% cocoa and ideally 85% or higher. Reports show that eating one square a day can offer multiple health benefits.  
          img: placeholder_icon.svg

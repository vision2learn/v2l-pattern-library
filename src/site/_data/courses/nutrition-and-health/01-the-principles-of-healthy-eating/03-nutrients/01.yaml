  -
    title: Stretch
    layout: media
    theme: t-bg-primary2 i-stretch
    copy: |
      ###  What foods provide which nutrients

      There are many nutrient dense foods to choose from. By having a whole food diet, you can increase the range of natural foods that you eat and choose macronutrients that provide you with a host of micronutrients to ensure you get the most of what you eat. Remember that having a good variety will ensure that you’re obtaining the most amount of nutrients and supplying your body with everything that it needs to be as healthy as possible. 
      
      There are too many good foods to list here, click on the owl to go to a website to find foods that you might like to start including in your diet.

    img: /images/svg/stretch_button.svg
    link: https://www.webmd.com/vitamins-and-supplements/features/healthy-foods

title: Nutrients
intro: |
  In this session we’ll look at some of the key nutrients, and their role in maintaining health.
   
banner: placeholder.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn how to:
      * Define the term nutrients
      * Describe the nutrients needed by the body
      * Identify foods that are a good source of each nutrient
      * Describe the role of nutrients in maintaining health
      * Describe the factors that influence how much of each nutrient a person needs
      * Explain the importance of adequate fluid intake  

  -
    title: Summary
    theme: t-bg-primary i-summary
    copy: |
      Dehydration can negatively affect a person’s body and mind. It’s very important that a person is properly hydrated. 

      The amount of water that a person should consume depends on their lifestyle and how much water they are getting from their diet! 
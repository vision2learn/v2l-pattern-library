title: Water, hydration and exercise
intro: |
  On this page you will learn about: 
  * Water and hydration
  * Water and exercise
banner: placeholder.jpg
sections:
  -
    title: Poor hydration
    theme: t-bg-primary
    copy: |
      People are, by weight, about two thirds water. So a person weighing 75kg will contain about 45l of water.
      
      There is strong evidence to suggest that dehydration can lead to asthma, high blood pressure, ulcers, joint problems and high cholesterol.

      See the images below to learn more about the effects of poor hydration.

    subInc: 
      type: reveal
      content:
        -
          title: Joint aches and pains
          copy: |
            Poor hydration can lead to joint aches and pains, which can negatively affect physical activity.
          img: placeholder_icon.svg
        -
          title: CNS function
          copy: |
            The function of the CNS and the brain (which is 85% water by weight) can be negatively affected by dehydration. 
          img: placeholder_icon.svg
        -
          title: Digestive system function
          copy: |
            Dehydration can have a negative impact on a person’s digestive system. This in turn can have a negative impact on the energy and nutrients that are absorbed by the body. 
          img: placeholder_icon.svg
        -
          title: Body temperature
          copy: |
            If you don’t drink enough water, there is a risk of overheating. Lack of water affects the body’s ability to keep cool and maintain a safe body temperature. 
          img: placeholder_icon.svg
        -
          title: new
          copy: |
            text 
          img: placeholder_icon.svg
        -
          title: new
          copy: |

title: What did you learn? 
intro: Well done, you’ve now completed the third session of this unit!
banner: summary.jpg
sections:
  -
    title: Summary and learning points
    theme: t-bg-primary
    copy: |
      In this session you have learnt about    . You have learnt about:
      * What is meant by the term ‘nutrients’
      * The six classes of nutrient, including carbohydrate, fat, protein, vitamins, minerals and water
      * The links between nutrients and health
      * The factors that influence how much of each nutrient a person requires
      * The importance of staying hydrated, including the effects of dehydration
      * How exercise affects your fluid requirements


      Take a look at the following learning points to see a summary of what you have covered in this session:
      
    subInc: 
      type: accordion
      content:
        - 
          title: Six classes of nutrients
          copy: |
            * Carbohydrates
            * Fats
            * Proteins
            * Water
            * Vitamins
            * Minerals
        -
          title: Need for nutrients
          copy: |
            Factors that affect nutrient need:
            * Amount of activity
            * Health / condition
            * Age
            * Physical changes
        -
          title: Effects of poor hydration
          copy: |
            * Joint aches and pains
            * Central nervous system function
            * Digestive system function
            * Body temperature

        -
          title: Water and exercise
          copy: |
            What's important?
            * Hydration before exercise
            * Hydration during exercise
            * Hydration after exercise
            * Carbohydrates and electrolytes

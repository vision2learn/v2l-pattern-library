  -
    title: Eating a variety of foods
    theme: t-bg-supporting2
    copy: |
      There are many advantages to eating a wide variety of foods. A narrower range can be unhealthy, less enjoyable and more expensive. Scroll through the slides below to learn more.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Nutritional needs
          text: |
            If people want to stay healthy, they need to meet a variety of nutritional needs. These needs can’t be met by just one food! People should eat a variety of different foods to make sure they get everything they need.

            For example, a person who only ate brown rice and apples would be missing out on many essential nutrients. This lack of variety would lead to an unhealthy diet! 
          img: nh_u1_s2_p2_slide1.svg
        -
          title: Pleasure
          text: |
            By eating a variety of different foods, people are able to enjoy a wide variety of texture, flavours and combinations. This means that people’s meals are more enjoyable and appealing.
             
            Eating a variety of different foods means enjoying food more! Leading a healthy lifestyle is something that many people enjoy. 
          img: nh_u1_s2_p2_slide2.svg
        -
          title: Variety
          text: |
            When there is little variation in meals, a person may be more likely to eat unhealthily. Eating a wide variety of healthy foods will help a person eat healthily.
             
            By liking a range of different foods, people are in an easier position to choose healthy options rather than unhealthy ones.
          img: nh_u1_s2_p2_slide3.svg
        -
          title: Availability
          text: |
            People who eat a limited range of foods may struggle with their diet if the food they eat becomes unavailable or is in short supply. They may have difficulty getting all the nutrients they need.
            
            If a person likes a variety of foods, they have more choice over what to eat. Someone who eats a wide variety of foods has a better chance of finding the nutrition they need in the food available. 
          img: nh_u1_s2_p2_slide4.svg


  -
    title: Quick quiz
    copy: Guess the food group
    subInc: 
      type: word-quiz
      content:
        -
          sentence: A glass of milk is in the Milk and dairy group 
          answer: Milk and dairy
        -
          sentence: Cake is in the Fatty or sugary foods group
          answer: Fatty or sugary foods
        -
          sentence: Bread is in the Carbohydrates group
          answer: Carbohydrates
        -
          sentence: Tuna fish is in the Meat and protein group
          answer: Meat and protein
        -
          sentence: Pasta is in the Carbohydrates group
          answer: Carbohydrates
        -
          sentence: Broccoli is in the Fruit and veg group
          answer: Fruit and veg
        -
          sentence: Butter is in the Milk and dairy group
          answer: Milk and dairy
        -
          sentence: An apple is in the Fruit and veg group
          answer: Fruit and veg
    theme: i-quiz

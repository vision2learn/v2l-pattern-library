  -
    title: The five food groups
    theme: t-bg-primary
    copy: |
      The food you eat can be divided into five groups. A person with a healthy diet eats a balance of food from all of these five groups. Scroll through the slides below to read about each group and the _main_ nutritional benefits for each:

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Carbohydrates
          text: |
            * Main nutritional benefits are energy, fibre, vitamins and minerals
            * The NHS recommends we have 33% or a third of our energy requirements from carbohydrates
            * Include - wholemeal bread, cereals, pasta, potatoes, beans and lentils
            * Some fruit and veg also provides carbohydrates e.g. bananas, apples, sweet potatoes, beetroot and corn
          img: nh_u1_s2_p1_slide1.svg
        -
          title: Fruit and veg
          text: |
            * Main nutritional benefits are vitamins, minerals and fibre
            * Like carbohydrates this should make up 33% (a third) of our daily intake with 5-10 portions
            * Include - fresh, frozen, tinned and fresh juice (not from concentrate)
          img: nh_u1_s2_p1_slide2.svg
        -
          title: Protein
          text: |
            * Main nutritional benefits are energy, cell maintenance, protection against disease, promoting growth and weight management
            * The NHS recommends we should have 50g/15% or 2 to 3 portions a day
            * Include - chicken, fish, beans, tofu, eggs, pulses, diary, nuts and seeds
          img: nh_u1_s2_p1_slide3.svg
        -
          title: Oils, spreads and other fats
          text: |
            * Healthy fats help build cells, absorb vital vitamins and minerals, provide energy and muscle movement
            * Good fats include monosaturated and polyunsaturated. Bad fats are man-made e.g. trans fats. Saturated fats are in the middle of these and should be kept to a minimum. 
            * Different fats have different recommended daily intake amounts. Saturated is under 11% and trans fat under 2%
            * Good fats come from olive oil, sunflower oil, avocados, nuts, nut spread, fatty fish (salmon, mackeral, sardines) flaxseed

          img: nh_u1_s2_p1_slide4.svg
        -
          title: Milk and dairy
          text: |
            * Main nutritional benefits are protein and calcium. healthy bones, teeth, skin and eyes. Supports brain development, maintains healthy blood pressure and immune function. 
            * The NHS recommends we should have 15% or 2 to 3 portions
            * Include - yogurt, cheese, cream. Diary alternatives are often fortified with calcium and vitamin B12 to provide the same health benefits as real diary. 

          img: nh_u1_s2_p1_slide5.svg
  -

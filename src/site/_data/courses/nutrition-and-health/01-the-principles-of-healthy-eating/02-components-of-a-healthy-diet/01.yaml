    copy: |
      ### Current healthy eating advice

       There are many sources of information offering advice and tips on healthy eating. It’s best to stick to official sources of information, such as the NHS and Government websites.

      The Food Standards Agency is a Government body for food and nutrition. Please see the following video for some of its tips for eating well. 


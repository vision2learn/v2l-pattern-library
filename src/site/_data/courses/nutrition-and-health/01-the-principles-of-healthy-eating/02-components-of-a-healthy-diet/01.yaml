    title: The five food groups
    theme: t-bg-supporting3
    copy: |
      The food you eat can be divided into five groups. A person with a healthy diet eats a balance of food from all of these five groups. Select the images below to read about each group:

    subInc: 
      type: reveal
      content:
        -
          title: Carbohydrates
          copy: |
            * Nutritional benefits are energy, fibre, vitamins and minerals
            * We should have 33% or a third of our diet a day
            * Include - bread, cereals, potatoes, pasta, beans and lentils
          img: placeholder_icon.svg
        -
          title: Fruit and veg
          copy: |
            * Nutritional benefits are vitamins, minerals and fibre
            * We should have 33% or 5 portions a day
            * Include - fresh, frozen, tinned
          img: placeholder_icon.svg
        -
          title: Meat and protein
          copy: |
            * Nutritional benefits are protein, vitamins and minerals
            * We should have 15% or 2 to 3 portions a day
            * Include - chicken, Tofu, fish
          img: placeholder_icon.svg
        -
          title: Fatty or sugary foods
          copy: |
            * Nutritional benefits are energy
            * We should have 4% or 1 portion or less a day
            * Include - sweets, cakes, biscuits
          img: placeholder_icon.svg
        -
          title: Milk and dairy
          copy: |
            * Nutritional benefits are protein and calcium.
            * We should have 15% or 2 to 3 portions
            * Include - yogurt, cheese, cream
          img: placeholder_icon.svg

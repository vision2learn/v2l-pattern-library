title: Components of a healthy diet
intro: |
  In this session we’ll look at some of the components of a healthy diet and how these can affect health.
   
banner: nh_u1_s2_p1_components.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn how to: 
      * Identify the five food groups
      * Identify foods belonging to each of the five food groups
      * Give examples of current healthy eating advice
      * Describe the importance of eating a wide variety of foods to provide a healthy diet

title: What did you learn? 
intro: Well done, you’ve now completed the second session of this unit! In this session you have learnt about 
banner: summary.jpg

sections:
  -
    title: Learning points
    theme: t-bg-primary
    copy: |
      In this Session you have learnt about the links between diet and health. You have learnt about:
      * Calories and the energy that comes from food.
      * The relationship between calories, weight loss and weight gain.
      * Basal Metabolic Rate and Physical Activity Levels, and their effect on weight.
      

      Take a look at the following learning points to see a summary of what you have covered in this session:
      * Influences on diet and health
      * Diet and disease
    subInc: 
      type: accordion
      content:
        - 
          title: Activity levels
          copy: |
            * Physical activity level (PAL)
            * Basic metabolic rate (BMR)
            * Total Energy Required = BMR x PAL

        -
          title: Diet features
          copy: |
            * Energy intake
            * Weight

sections:
  -
    title: Understanding activity levels
    theme: t-bg-primary
    copy: |
      In the last 50 years, advances in technology and changes to working life have led to many people doing less physical activity.
      
      In the past, there were many jobs that were vigorous and physically demanding. These jobs, such as coal mining, construction or agricultural work would have required a large amount of physical effort. Housework was also more demanding with the need to beat carpets, sweep floors and scrub many areas of the home. 
      
      Nowadays, modern appliance make household chores much easier, many jobs are desk based and most people struggle to get enough exercise.

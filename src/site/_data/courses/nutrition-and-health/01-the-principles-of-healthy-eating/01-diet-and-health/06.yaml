title: Activity levels and energy
intro: |
  On this page you will learn about: 
  * Understanding activity levels
  * Energy requirements

banner: placeholder.jpg
sections:
  
  -
    title: Understanding activity levels
    theme: t-bg-primary
    copy: |
      In the last 50 years, advances in technology and changes to working life have led to many people doing less physical activity.

      In the past, there were many jobs that were vigorous and physically demanding. These jobs, such as coal mining, construction or agricultural work would have required a large amount of physical effort.

      Nowadays, many jobs are desk based and most people struggle to get enough exercise.

  -
  -
    title: NHS recommendations
    theme: t-bg-supporting2
    copy: |
      Select the images below to learn more about the different recommended exercise levels. 

    subInc: 
      type: reveal
      content:
        -
          title: Moderate intensity aerobic activity 
          copy: |
            150 minutes of moderate intensity aerobic activity each week plus muscle strengthening activities on two or more days. The aerobic activity may be spread across the week, such as 30 minutes a day over 5 days. 
          img: placeholder_icon.svg
        -
          title: Vigorous intensity aerobic activity
          copy: |
            75 minutes of vigorous intensity aerobic activity and muscle strengthening activities two or more days a week. The aerobic activity may be spread across the week, such as 15 minutes a day over 5 days. 
          img: placeholder_icon.svg
        -
          title: Muscle strengthening
          copy: |
            A mix of moderate and vigorous aerobic activity and muscle strengthening.
          img: placeholder_icon.svg
  -
  -
    title: Aerobic activity levels
    theme: t-bg-primary
    copy: |
      Select the images below to learn more about the different recommended exercise levels. 

    subInc: 
      type: reveal
      content:
        -
          title: What is moderate intensity aerobic activity?
          copy: |
            There are a number of different activities that could be classed as moderately intense, these include:
            * Golf
            * Tennis
            * Skateboarding
            * Swimming
            * Volleyball. 
          img: placeholder_icon.svg
        -
          title: What is vigorous intensity aerobic activity?
          copy: |
            Vigorous intensity aerobic activities include:
            * Aerobics
            * Football
            * Basketball
            * Hockey
            * Running. 
          img: placeholder_icon.svg
        -
          title: What is muscle strengthening?
          copy: |
            Muscle strengthening activities are anything that helps to build and maintain muscles. This could include:
            * Press ups
            * Sit ups
            * Lifting weights
            * Yoga
            * Using resistance bands. 
          img: placeholder_icon.svg

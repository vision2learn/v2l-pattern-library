  -
    title: Case study
    theme: t-bg-primary1a i-case-study
    copy: |
      _ID Note - include this case study in a video or with the above interactive item_

      ### Case study - Gerry

      Gerry is 40 lbs overweight. His PAL is around 1.5. His BMR is 2200 calories per day and his total energy requirement is 3300 calories. However, he eats about 4000 calories every day. He is continuing to put on weight. 
    subInc: 
      type: accordion
      content:
        - 
          title: item 1
          copy: |
             Gerry wants to lose weight. He starts by increasing his exercise regime so that his PAL is 1.8. This means his energy requirement becomes:
             
             2200 x 1.8 = 3960 calories

             If Gerry keeps on eating the same amount but increases his activity level, he will more or less stop putting on weight. However, if he decided to eat 10% (400 calories per day) less he would lose about 1 lb. every 9 days. In a year this will be close to his target weight! 
            
          img: /images/svg/placeholder_icon.svg
  -
  -
    title: Summary
    theme: t-bg-primary i-summary
    copy: |
      * Daily energy requirements vary wildly from one person to the next. This is due to a number of different factors including sex, body size, body weight, climate and physical activity levels. 

      * Understanding the different activity levels can help you to understand your own energy requirements. The challenge for many adults is to find moderate or intense activities that will enable them to remain fit and healthy. By knowing exactly what the NHS guidelines mean, people can make informed choices and aim to meet the recommended physical activity levels. 

      * By thinking in terms of calories, total energy requirement, BMR and PAL, you will have a better understanding of how to manage your weight. 
    title: Knowing what you need
    theme: t-bg-supporting3
    copy: |
       Different activity levels require different proportions of carbohydrates, fats and proteins. The dietary needs of a marathon runner are very different from those of a weightlifter!
       
       The types and quantities of food that you need to eat will be influenced by several factors. Select the images below to learn more. 
       _On old course was originally in Session 3 page 3_

    subInc: 
      type: reveal
      content:
        -
          title: Amount of activity
          copy: |
            Children, teenagers and adults should all follow a diet that is low in fat. Different levels of activity and the variations in this through the day will affect how much of each nutrient a person needs.  
          img: placeholder_icon.svg
        -
          title: Health / condition
          copy: |
            If someone is ill, recovering from an injury or pregnant, then they may need different nutrients than someone who is not. 
          img: placeholder_icon.svg
        -
          title: Age
          copy: |
            People of different ages will require different levels of each nutrient.
          img: placeholder_icon.svg
        -
          title: Physical changes
          copy: |
            If a person is trying to lose or gain weight, they may require different nutrients to someone who is trying to build muscle.
          img: placeholder_icon.svg

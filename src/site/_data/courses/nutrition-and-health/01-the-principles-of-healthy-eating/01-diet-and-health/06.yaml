  -
    title: Summary
    theme: t-bg-primary i-summary
    copy: |
      * Daily energy requirements vary wildly from one person to the next. This is due to a number of different factors including sex, body size, body weight, climate and physical activity levels. 

      * Understanding the different activity levels can help you to understand your own energy requirements. The challenge for many adults is to find moderate or intense activities that will enable them to remain fit and healthy. By knowing exactly what the NHS guidelines mean, people can make informed choices and aim to meet the recommended physical activity levels. 

      * By thinking in terms of calories, total energy requirement, BMR and PAL, you will have a better understanding of how to manage your weight. 
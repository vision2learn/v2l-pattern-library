title: Teens and Adults
intro: |
  On this page you will learn about: 
  * Diets for teenagers
  * Diets for adults
  * Key differences between diets for adults and children
banner: placeholder.jpg
sections:
  -
    title: Diets for teenagers
    theme: t-bg-primary
    copy: |
      Children gain about 20% of adult height and 50% of adult weight during adolescence. Because growth and change is so rapid during this period, the nutritional and dietary requirements for the child also change. Scroll through the slides to see nutritional requirements of teens.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Salt
          text: |
            The maximum recommended daily amount of salt for all people aged over 11 years (and for adults) is no more than 6g per day (or 2.4g sodium).
          img: placeholder_icon.svg
        -
          title: Iron
          text: |
            Adolescents need to make sure they get enough iron as this nutrient helps growth. Teenage girls in particular need to make sure they get enough iron.

            11-18 year old males need 8 to 11 mg per day.

            11-18 year old females need 10 to 15 mg per day.
          img: placeholder_icon.svg
        -
          title: Calories
          text: |
            Due to all their growth and activity, adolescent boys need 2,500-2,800 per day, while girls need around 2,200 per day. It’s best to get these extra calories from lean protein, low-fat dairy, whole grains, and fruits and veggies. 
          img: placeholder_icon.svg
        -
          title: Protein
          text: |
            In order for the body to grow and maintain muscle, teens need 45-55g per day. Most teenagers easily meet this need from eating meat, fish, and dairy, but vegetarians may need to increase their protein intake from non-animal sources like soy foods, beans, and nuts. 
          img: placeholder_icon.svg
        -
          title: Calcium
          text: |
            Many teens do not get sufficient amounts of calcium, leading to weak bones and osteoporosis later in life. Encourage teens to cut back on fizzy drinks and other overly-sugary foods, which suck calcium from bones. The 800-1000mg of calcium needed per day should come from dairy, calcium-fortified juice and cereal, and other calcium-rich foods such as sesame seeds and leafy greens like spinach. 
          img: placeholder_icon.svg

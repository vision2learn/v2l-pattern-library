title: Salt, diet and disease
intro: |
  On this page you will learn about: 
  * Controlling salt intake
  * Foods high in salt
  * Diet and disease
   
banner: placeholder.jpg
sections:
  -
    title: Controlling salt intake
    theme: 
    copy: |
      Salt (or sodium) is present in many pre-prepared and packaged foods and it’s important to be aware of how much you are consuming. 
      
      Most people are aware that too much salt is bad for your health, but so is too little. Sodium plays a vital role in maintaining good circulation and a healthy heart. 
      
      Select the images below to read more on some of the negative impacts on the body of too much sodium.

    subInc: 
      type: reveal
      content:
        -
          title: Salt and blood presure
          copy: |
            If a person eats too much salt, it can lead to raised blood pressure. This may increase the likelihood of someone suffering from heart disease and strokes. If a person eats a safe amount of salt then the risk of these problems developing is minimised. 
          img: placeholder_icon.svg
        -
          title: Can salt affect children?
          copy: |
            When children are very young, their kidneys can find it difficult to deal with more than 1g of salt per day. Giving children too much salty food can mean that they develop a taste for it and are more likely to eat too much salt when they are adults. 
          img: placeholder_icon.svg
        -
          title: Checking salt content
          copy: |
            Many pre-prepared and processed foods already contain salt, so monitoring how much is consumed can be difficult. Some foods tend to have higher salt content, while others will vary according to the manufacturer or brand.
             
            The introduction of food labelling has made it easier to check the salt content of what you want to eat.
          img: placeholder_icon.svg
  -
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      You will need to be able to explain why maintaining control of your salt intake is important and understand how unhealthy diets can lead to lifestyle diseases.
  -
  -
    title: Quick quiz
    theme: i-quiz
    copy: Have a go at the following questions about foods that may contain a high amount of salt.
    subInc:
      type: quick-quiz
      mode: multi-choice
      content:
        Select the foods below that are almost ALWAYS high in salt content:
          answers:
            Bacon: true
            Cheese: true
            Chicken: false
            Ham: true
            Gravy granules: true
            Pickles: true
            Salami: true
            Raw nuts: false
            Prawns: true
            Jumbo oats: false
          feedback: Bacon, cheese, ham, gravy granules, pickles, salami, and prawns almost always have a high amount of salt.
        Select the foods below that MAY be high in salt content:
          answers:
            Breakfast cereals: true
            Crumpets / Bagels: true
            Lentils: false
            Pasta sauces: true
            Ready meals: true
            Tomato ketchup / mayonnaise: true
            Rice: false
            Oat cakes: false
          feedback: Breakfast cereals, crumpets, bagels, pasta sauces and ready meals may have a high amount of salt.
  -
  -
    title: Stats and Facts
    layout: media
    theme: t-bg-supporting2
    copy: |
      Take a look at the table below to see the recommended maximum quantity of salt per day:

      | Age group | Salt quantity |
      |------|------|
      | Under 1 year | 1 gram |
      | 1 - 3 years old | 2 grams|
      | 4 - 6 years old | 3 grams |
      | 7 - 10 years old | 5 grams |
      | 11+ years old | 6 grams |

    img: /images/svg/ln/LM_Stats.svg
  -
    title: Diet and disease
    theme: t-bg-primary
    copy: |
      There are many diseases that are caused by or made worse by having an unhealthy diet.

      Scroll through the slides below to learn more about the potential consequences of having a poor diet.  

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Obesity
          text: |
            It is estimated that over half of people in the UK are overweight and that 25% are clinically obese. These figures have been steadily rising over the last 25 years.

            When people are obese, they are often at greater risk of developing illnesses such as angina, heart disease, diabetes, some cancers and lower back / joint pains.

          img: placeholder_icon.svg
        -
          title: Heart disease
          text: |
            In the UK, heart disease is a major cause of ill health. Bad cholesterol collects and hardens on the inside of the blood vessel walls, which narrows them and reduces the flow of blood to the heart. This can lead to angina, and eventually heart attacks or strokes. Risk factors include age, gender and family history.

            Some lifestyle factors may increase how likely a person is to develop heart disease.

          img: placeholder_icon.svg
        -
          title: Cancer
          text: |
            An obese person is 50% more likely to develop colon cancer than someone who is not obese.

            Smoking is another lifestyle factor associated with cancer. A person smoking 20 cigarettes a day is 20 – 40% more likely to develop lung, throat or mouth cancer than a non-smoker.

            Every year, over a quarter of a million people are diagnosed with cancer. Half of these cancers are breast, lung, bowel or prostate.

          img: placeholder_icon.svg
        -
          title: Diabetes
          text: |
            With diabetes, a person’s body can’t use glucose properly, but the condition can be managed. If it is not managed successfully, this can lead to blindness, kidney failure, foot ulceration, nerve damage and even heart disease.

            Type 2 diabetes (where the body has problems with insulin) is strongly linked with obesity. If obesity is avoided by eating healthily and exercising then the risk of Type 2 diabetes is significantly reduced.

          img: placeholder_icon.svg
        -
          title: Dental disease
          text: |
            Tooth decay is very common – over 50% of people in the UK suffer from some form of tooth decay. It is caused by acids breaking down the tooth. The acids come from fermented sugars and starches.
            
            Young children are particularly vulnerable to tooth decay because their enamel is still developing. Older people can suffer tooth decay because the enamel has been worn down.

          img: placeholder_icon.svg

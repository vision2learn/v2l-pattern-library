  -
    title: Stats and Facts
    layout: media
    theme: t-bg-supporting2
    copy: |
      Teens are more at risk of developing eating disorders than any other age group. We’ll look at eating disorders in a later unit.
    img: /images/svg/ln/LM_Stats.svg

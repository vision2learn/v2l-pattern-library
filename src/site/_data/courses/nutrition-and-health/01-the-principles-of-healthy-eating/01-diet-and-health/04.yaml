  -
  -
    title: Diets for adults
    theme: t-bg-supporting2
    copy: |
      A healthy diet for adults is balanced. It provides everything that the body needs to stay fit and healthy.

      However, many adults in the UK are overweight as most of us overeat or consume more calories than we should. Adults need to eat a healthy diet for their weight and lifestyle.

      Adults should eat diets rich in fresh fruit and vegetables, protein, starchy foods and a little fat. Click the tiles to the right to discover more about adult diets.

      You’ll learn more about the importance of each of these later on in the Unit.

      Select the images below to read more.

    subInc: 
      type: reveal
      content:
        -
          title: Low in fat
          copy: |
            Adults should all follow a diet that is low in fat. Many of us consume too much fat and eat too much of the wrong fat – the saturated kind! This is found in many processed foods such as cakes, biscuits and ready meals. 
          img: placeholder_icon.svg
        -
          title: High in fibre
          copy: |
            Fibre is vital for proper digestive function. It can also help to prevent some lifestyle-associated diseases, such as heart disease. Lots of us do not eat enough fibre and should look to eat more of it. Adults should eat 18 grams a day. 
          img: placeholder_icon.svg
        -
          title: Low in sugar and salt
          copy: |
            Too much sugar and salt in the diet can cause obesity and cardiovascular problems. Many people eat too much sugar and salt. Sugar is a source of energy but it is added to food and drink by manufacturers. Often we consume it without even thinking about it. 
          img: placeholder_icon.svg
        -
          title: 5 portions of fruit and veg
          copy: |
            Eating 5 portions of fruit and veg a day has many health benefits. They contain vitamins and minerals as well as help to reduce the risk of heart disease and some cancers. They also contain lots of fibre, which helps to aid healthy digestion. 
          img: placeholder_icon.svg
    copy2: It’s important to remember that the dietary needs of adults will vary depending on their life stage and their lifestyle.
  -
  -
    title: Interactivity - Key differences
    theme: 
    
    copy: |
      You’ve looked at what is needed for a healthy diet in both adults and children. Now let us look at the differences between the two.

      A healthy diet for adults provides everything that the body needs to stay fit and healthy.

      A healthy diet for children under 5 provides everything that they need to stay fit and healthy, as well as grow properly. 


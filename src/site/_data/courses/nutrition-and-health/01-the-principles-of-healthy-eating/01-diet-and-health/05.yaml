  -
    title: Summary
    theme: t-bg-primary i-summary
    copy: |
      The calorie is a useful measure that helps us to know how much energy certain foods have, and how many calories are needed so that people can live and function. 
  -
  -
    title: Basal Metabolic Rate (BMR) and Physical activity levels (PAL)
    theme: t-bg-supporting2
    copy: |
      The Basal Metabolic Rate (BMR) is the rate at which a person uses energy to maintain the basic functions of the body. This includes breathing, keeping warm and keeping the heart beating! Not everybody will have the same BMR. It’s important to remember that Basal Metabolic Rate is affected by a person’s physical activity levels and age. 

      Everything you do burns calories. While most calories are used for basic living, the rest of the calories are burned through exercise and activity.  Calories are burned even when an activity has stopped. By combining basal requirements with needs based on physical activity levels (PAL), you can calculate your total energy requirement.

      Please see below for the formulaes
    subInc: 
      type: accordion
      content:
        - 
          title: BMR formula
          copy: |
            Male = 66 + (6.23 x weight in pounds) + (12.7 x height in inches) – (6.8 x age in years)

            Female = 655 + (4.35 x weight in pounds) + (4.7 x height in inches ) – (4.7 x age in years) 
        -
          title: PAL Table
          copy: |
            A person's PAL is determined by the things a person does in a 24 hour period. It can also be estimated from the physical activities that person performs each day. Each activity is connected to a particular level of activity.
      
            | Level | Description| PAL factor |
            |------|------|------|
            | 1 - Sedentary | This level of activity is described as little or no exercise. | 1.2 | 
            | 2 - Light exercise | This level of activity includes frequent walking in a job / daily activity or 60mins of intense activity in one week. | 1.375 |
            | 3 - Moderate exercise | This level of activity could be a job that is quite physical throughout the day e.g. shop work or intense physical activity 30 – 60 minutes three or four times a week. | 1.55 |
            | 4 - Very active | This level of activity could include a highly physical job such as brick laying or farming or intense exercise for 60 minutes five to seven days per week. | 1.725 |
            | 5 - Extreme| This level of activity could include full time training for a sporting event; this level of activity is usually only reached by elite athletes.| 1.9
        -
          title: PAL formula
          copy: |
            The higher the level of activity that a person does, the more energy they will need to burn. The equation used to calculate the total energy requirement is: 
            
            Total Energy Required = BMR x PAL

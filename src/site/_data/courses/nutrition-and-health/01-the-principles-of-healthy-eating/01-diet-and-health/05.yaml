  On this page you will learn about: 
  * Diet and disease
  * Controlling salt intake
banner: placeholder.jpg
sections:
  -
    title: Diet and disease
    theme: t-bg-primary
    copy: |
      There are many diseases that are caused by or made worse by having an unhealthy diet.

      Scroll through the slides below to learn more about the potential consequences of having a poor diet.  

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Obesity
          text: |
            It is estimated that over half of people in the UK are overweight and that 25% are clinically obese. These figures have been steadily rising over the last 25 years.

            When people are obese, they are often at greater risk of developing illnesses such as angina, heart disease, diabetes, some cancers and lower back / joint pains.

          img: placeholder_icon.svg
        -
          title: Heart disease
          text: |
            In the UK, heart disease is a major cause of ill health. Bad cholesterol collects and hardens on the inside of the blood vessel walls, which narrows them and reduces the flow of blood to the heart. This can lead to angina, and eventually heart attacks or strokes. Risk factors include age, gender and family history.

            Some lifestyle factors may increase how likely a person is to develop heart disease.

          img: placeholder_icon.svg
        -
          title: Cancer
          text: |
            An obese person is 50% more likely to develop colon cancer than someone who is not obese.

            Smoking is another lifestyle factor associated with cancer. A person smoking 20 cigarettes a day is 20 – 40% more likely to develop lung, throat or mouth cancer than a non-smoker.

            Every year, over a quarter of a million people are diagnosed with cancer. Half of these cancers are breast, lung, bowel or prostate.

          img: placeholder_icon.svg
        -
          title: Diabetes
          text: |
            With diabetes, a person’s body can’t use glucose properly, but the condition can be managed. If it is not managed successfully, this can lead to blindness, kidney failure, foot ulceration, nerve damage and even heart disease.

            Type 2 diabetes (where the body has problems with insulin) is strongly linked with obesity. If obesity is avoided by eating healthily and exercising then the risk of Type 2 diabetes is significantly reduced.

          img: placeholder_icon.svg
        -
          title: Dental disease
          text: |
            Tooth decay is very common – over 50% of people in the UK suffer from some form of tooth decay. It is caused by acids breaking down the tooth. The acids come from fermented sugars and starches.
            
            Young children are particularly vulnerable to tooth decay because their enamel is still developing. Older people can suffer tooth decay because the enamel has been worn down.

          img: placeholder_icon.svg

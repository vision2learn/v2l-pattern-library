  -
    title: Stats and Facts
    layout: media
    theme: t-bg-supporting2
    copy: |
      Take a look at the table below to see the recommended maximum quantity of salt per day:

      | Age group | Salt quantity |
      |------|------|
      | Under 1 year | 1 gram |
      | 1 - 3 years old | 2 grams|
      | 4 - 6 years old | 3 grams |
      | 7 - 10 years old | 5 grams |
      | 11+ years old | 6 grams |

    img: /images/svg/ln/LM_Stats.svg
  
title: Energy, BMR and PAL
intro: |
  On this page you will learn about: 
  * Energy in food
  * Converting grams to calories
  * Basal Metabolic Rate (BMR)
  * Physical activity levels (PAL)
   
banner: placeholder.jpg
sections:
  -
    title: Energy in food
    theme: t-bg-primary
    copy: |
       Your body uses food as a source of energy. This energy is measured in calories.
       
       A calorie is the amount of energy needed to raise the temperature of 1g of water by 1°C. Scroll through the slides below to learn more.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Calories and energy
          text: |
            A calorie is one unit of energy. This energy is used to walk, talk, breathe, sleep or run. All activities burn calories! The human body receives energy in the form of calories from food. 
          img: placeholder_icon.svg
        -
          title: Calories and food
          text: |
            Food contains calories. These can come from carbohydrates, fats or proteins. These terms are measured in grams. Each gram is defined as a number of calories. 
          img: placeholder_icon.svg
        -
          title: Calories and health
          text: |
            Your body needs a certain amount of calories in order to maintain itself properly. Everything you do (including breathing and sleeping!) burns calories. The rate that these calories are burned is called the Basal Metabolic Rate (BMR). 
          img: placeholder_icon.svg
        -
          title: Calories and weight
          text: |
             If people consume 3,500 calories more than they use they will gain 1lb in body fat.
             
             If they use 3,500 calories more than they consume they will lose 1lb in body fat. 
          img: placeholder_icon.svg

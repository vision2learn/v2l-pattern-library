          title: Checking salt content
          text: |
            Many pre-prepared and processed foods already contain salt, so monitoring how much is consumed can be difficult. Some foods tend to have higher salt content, while others will vary according to the manufacturer or brand.
            The introduction of food labelling has made it easier to check the salt content of what you want to eat.

title: Diet and health
intro: |
    When you have a balanced and healthy diet you feel good, have plenty of energy and avoid a number of health risks.

    There is no one food plan that suits everybody. Each person will have slightly different nutrient requirements, depending on a number of different factors.
banner: placeholder.jpg
sections:
  -
    title: Diet and health
    theme: t-bg-primary
    copy: |
      Select the images below to learn more about the factors that can influence your diet.

    subInc: 
      type: reveal
      content:
        -
          title: Age
          copy: |
            People of different ages need different proportions of food. You will learn more about how age affects diet in Unit 2. 
          img: placeholder_icon.svg
        -
          title: Lifesyle circumstances
          copy: |
            People’s dietary requirements change as their circumstances change. For example, pregnant women need to take on additional calories to support the developing baby. People who have gone through major operations may require diet changes. 
          img: placeholder_icon.svg
        -
          title: Health conditions
          copy: |
            People with certain illnesses or health conditions may have to eat more or less of certain foods. For example, diabetics often need to manage their sugar intake. 
          img: placeholder_icon.svg
        -
          title: Activity levelsC
          copy: |
            The levels and type of activity that a person does every day will influence what makes their diet healthy or unhealthy. A healthy diet for an Olympic sprinter will be very different from an office worker who goes running once a week! 
          img: placeholder_icon.svg
  -
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      A healthy diet is something that covers all of your body’s needs, and ensures that your body gets all the nutrients that it requires to stay healthy in day to day life.
      The things that you require will vary depending on a number of different factors including age, gender and activity levels. 

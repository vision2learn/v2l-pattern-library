  -
    title: Diets for over 5s
    theme: t-bg-supporting2
    copy: |
      Children aged between 5 and 12 need different nutrition and more variety than other age groups.

      As children develop, they require the same healthy foods adults eat, but with more vitamins and minerals to support their growing bodies. This means they need more whole grains, more calcium for growing bones, and more healthy proteins.

      To learn more about the diets of over 5s select the images below.

    subInc: 
      type: reveal
      content:
        -
          title: Variety
          copy: |
            At this age it is important that children try a variety of different foods. Experiencing different types of food allows children to find food that they like and can lead to more varied tastes. This means it will be easier for them to get the right nutrients and will help encourage healthy eating habits in later life. You will learn more about the importance of variety later in this unit. 
          img: placeholder_icon.svg
        -
          title: Quantity
          copy: |
            Children at this age are still growing, not as quickly as before but enough that their diet must support them. Their calorie intake should reflect this. Children have small stomachs which they fill up and empty quickly. They therefore need to eat every few hours. 
          img: placeholder_icon.svg
        -
          title: Nutrition
          copy: |
            As children approach school age, they should gradually move towards a diet that is higher in fibre and lower in fat.

            Their iron intake will vary at this stage; children aged 4-6 years should have 6 to 7 mg of iron per day and those aged 7-10 years should have 8 to 10 mg per day. 
          img: placeholder_icon.svg
        -
          title: Salt
          copy: |
            Their salt intake also varies; 4-6 year olds should have no more than 3g a day and 11 years and over should have no more than 6g a day. You may have noticed salt is an important feature of diet; we’ll look at this in more detail later in this Session. 
          img: placeholder_icon.svg

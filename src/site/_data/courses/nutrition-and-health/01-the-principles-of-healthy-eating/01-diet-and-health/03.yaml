  -
    title: Diets for children under 5
    theme: t-bg-primary
    copy: |
      Children under 5 usually only have access to the foods their parents, or guardians, buy or prepare for them.

      One of the most important things about a child’s diet is to get them into good habits so they can have a healthy diet throughout their life.

      Children should have food that is freshly prepared. Menus should include plenty of fruit and vegetables, wholegrains, starchy foods (such as pasta or potatoes), and protein (from meat, fish or pulses).

      Children also need plenty of fluids, from water, milk or diluted unsweetened juice – not fizzy or sugary drinks!

      To learn more about an under 5’s diet scroll through the slides below.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Calories
          text: |
            Children need fewer calories than adults because their bodies are not as big. However, children are usually very active – a child aged between one and three years needs approximately 1,165 to 1,230 calories per day. A child between four and six should have around 1,545 to 1,715 per day. Children should not be given the same size portions as adults. 
          img: placeholder_icon.svg
        -
          title: Salt
          text: |
            Salt should never be added to young children’s food. The salt needed for a healthy diet comes from eating other foods. A baby’s kidneys can’t cope with high levels of salt. 
          img: placeholder_icon.svg
        -
          title: Sugar
          text: |
            Never add processed sugar to a baby’s food, introducing sugar too early can lead to a preference for sweet foods and potentially lead to health issues. Fruit, such as apples, contain safe levels of sugar. Children should never be given sugary or fizzy drinks and babies should only drink milk or water.
          img: placeholder_icon.svg
        -
          title: Milk
          text: |
            Until they are six months old the only food babies need is baby milk. Babies should drink about 600ml of milk every day until they are at least 12 months old. At a year old, children can have cow’s milk to drink. This should be full fat until they are two years old because they need the fat and calories found in full fat milk. While baby milk provides all of the nutrients needed in the first six months, as the baby grows their needs change and this means they need a more varied diet. 
          img: placeholder_icon.svg
        -
          title: Solid food
          text: |
            Solid food is more difficult to digest and also contains more salt than milk. Starting solid food too early can cause stomach cramps, illness, allergies and even internal bleeding and long-term damage. From about 6 – 9 months children can eat mashed and finger foods like potato, vegetables and fruits, pieces of cheese, yogurt and pieces of toast cut into strips. At 9 months the baby should be able to eat small portions of chopped meat, pasta, fish, rice, beans and pulses. 
          img: placeholder_icon.svg
        -
          title: Nutrients
          text: |
            A lack of vitamin D and calcium can cause a bone disease called rickets and a lack of iron in the diet can lead to anaemia. Children under 5 shouldn’t eat too much fibre as this can prevent them from eating food that contains other nutrients.

            Some health professionals recommend a vitamin A or vitamin D supplement for children under five.

            You’ll learn more about the importance of each of these later on in the Unit. 
          img: placeholder_icon.svg

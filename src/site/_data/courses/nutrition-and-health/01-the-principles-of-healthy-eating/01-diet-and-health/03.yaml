  -
    title: Case study
    theme: t-bg-primary1a i-case-study
    copy: |
      ### Kate and Jake's lifestyle differences

      The lifestyles of adults and children can differ greatly and this has an effect on the foods that they eat.

      Kate has decided to keep a food diary for herself and her son Jake (aged 4). She wants to compare their diets so that she can see whether they are both eating healthily.

      She calculated the average intake they had over a two week period. They were both active for approximately 30 minutes a day, and they both drink enough water.

      *Interactive item here showing the food diary*  (reference https://www.vision2learn.com/uploaded_programme_files/nutrition-health-2015/unit01/session01/pg7-a.asp)

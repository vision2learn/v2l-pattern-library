  -
    title: Activity - Key differences
    layout: media
    theme: t-bg-primary2
    copy: |
      _ID Note - these next two items could be replaced with a video?_
      
      You’ve looked at what is needed for a healthy diet in both adults and children. Now let us look at the differences between the two.

      A healthy diet for adults provides everything that the body needs to stay fit and healthy.

      A healthy diet for children under 5 provides everything that they need to stay fit and healthy, as well as grow properly. 

      Select the following icon to see the key differences between adults and children.

      *Content in activity:*

      Fat in diets
      Milk in diets
      Fibre in diets

      https://www.vision2learn.com/uploaded_programme_files/nutrition-health-2015/unit01/session01/pg7.asp


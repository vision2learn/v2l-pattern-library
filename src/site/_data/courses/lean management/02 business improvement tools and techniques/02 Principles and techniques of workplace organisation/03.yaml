
title: Stages 1, 2 and 3
intro: | 
  You have already learnt about the five stages that make up the 5C/5S approach and the various factors that must also be considered.

  Now, let’s take a look at the first three stages of the 5C/5S approach in more detail. 

banner: LM_U2_S2_P3_Stage1-3_V2.svg
sections:
  -
    title: The first three stages
    theme: t-bg-primary
    copy: |
      The first three stages focus on **setting and maintaining the initial standards**.
    subInc: 
      type: accordion
      content:
        - 
          title: Clear out
          copy: |
            The first stage, ‘Clear Out’ is all about separating essential items from non-essential items. The aim of this stage is to clarify what is necessary and what is unnecessary in a given work area. 

            Essential items should be checked to ensure that they are safe and fully operational. Any unwanted items (such as surplus raw materials, equipment and spare parts) should be disposed of in an appropriate manner. 

            Steps that organisations must take as part of the ‘Clear Out’ stage: 

            1. It should be ensured that the workplace is safe and that health and safety procedures are fully understood.
            2. All items must be moved to a ‘clear out’ area.
            3. Items should be separated out into two categories: essential and non-essential.
            4. A designated quarantine area should be created for items that are not needed in the work area.
            5. The workplace should be cleaned down and assessed. Essential tools and machinery should also be assessed.
            6. ‘Red tags’ should be attached to any abnormal conditions.
            7. A red tag log should be used to monitor tagging activities and help detect repeat problems.

            Once you have completed the Clear Out phase, you are ready to move on to the **Configure** phase.
        - 
          title: Configure
          copy: |
            The purpose of this second stage is to **find a place for everything** in order to achieve **improved efficiency**. Improved efficiency is the result of more effective use of the workspace, equipment and inventory. 

            Typical steps that make up the ‘Configure’ stage:

            * Essential items must be returned to the workplace.
            * When locating items, safety should be evaluated.
            * Frequency of use (ergonomics) should be considered.
            * Clear visual management systems should be created.

            The workplace should be organised in such a way that minimises any unnecessary reaching, walking and bending. When deciding where items should be located, the safety and protection of staff and the prevention of damage are of paramount importance.

            Any stored items should be **accessible, visible, classified and labelled**. Cords should be attached to tools, items should be stacked correctly and colour coding should be implemented. The size of containers and the way they are moved is very important and **double handling** should be avoided.

        - 
          title: Clean & Check
          copy: |
            The aim of this stage is to **clean all the essential items and equipment**. This makes it possible to **identify any abnormal conditions**. For example, some surface liquid on the floor could be the result of a spillage that needs to be avoided or a leak that must be repaired.

            Steps that make up the ‘Clean and Check’ stage:

            1. The current conditions of the workplace must be reviewed.
            2. A check sheet must be devised.
            3. The workplace should be manually cleaned and checked.
            4. Any abnormal conditions should be recognised.
            5. Abnormal conditions should be eliminated (with immediate effect).
            6. Action should be taken to eliminate red tags.

            Once the ‘clean and check’ activities have been completed, the new **standard conditions** are established. These are the operating standards of the clean and organised work environment.

            With the development of new standard conditions, a **check sheet** can be created. The check sheet is used to assist with audits. Each employee is responsible for cleaning and checking the appropriate items listed on the check sheet, and for maintaining their own neat and tidy workplace.
  -
    title: Stats and Facts
    layout: media
    theme: t-bg-supporting2
    copy: |
      * In many organisations which apply the 5C/5S technique, there is a **5-minute clean up routine**. Each person develops their own ‘Clean and Check’ routine for each work day, made up of a list of timed and documented actions.  

      * A simple way to assess the work area before and after the application of the 5C/5S technique is by taking before and after photographs. 


    img: /images/svg/ln/LM_Stats.svg
  -
    title: Quick quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: The purpose of the Configure (Straighten/Simplify) stage is to find a place for everything in order to achieve improved efficiency.
          answer: Configure (Straighten/Simplify)
        -
          sentence: The purpose of the Clear Out (sort) stage is to separate essential items from non-essential items in order to see what is necessary and what is unnecessary in a work area.
          answer: Clear Out (sort)
        -
          sentence: The purpose of the Clean and Check (Sweep/Shine/Scrub) stage is to clean all the essential items and equipment, making it possible to identify any abnormal conditions.
          answer: Clean and Check (Sweep/Shine/Scrub)
    theme: i-quiz
  -
    title: Red tagging
    theme: t-bg-primary
    copy: |
      When abnormal conditions that require attention are identified (during the ‘Clear Out’ stage), they need to be recorded in a way that can be clearly seen. A **red tag** is attached as close to the abnormality as safely possible.

      The colour red is usually associated with danger or a hazard. Using red tags is a way of emphasising the need to see and act upon the abnormality. 

      Select the following images to learn about the items that should be tagged in the workplace.
    subInc: 
      type: reveal
      content:
        -
          title: Safety critical
          copy: |
              Fraying computer cables and other trip hazards should be tagged. 
          img: LM_U2_S2_P3_Reveal_1.svg
        -
          title: Quality critical items 
          copy: |
              Damaged tools and faulty calibration must be tagged. 
          img: LM_U2_S2_P3_Reveal_2.svg
        -
          title: Broken items
          copy: |
              Broken items, such as damaged or defective equipment must be tagged. 
          img: LM_U2_S2_P3_Reveal_3.svg
        -
          title: Homeless items
          copy: |
              Essential items should go to a designated place and non-essential items should go to a quarantine area. Homeless items should be tagged. 
          img: LM_U2_S2_P3_Reveal_4.svg
        -
          title: Inventory
          copy: |
              Inventory such as raw materials and work in progress may need to be tagged. 
          img: LM_U2_S2_P3_Reveal_5.svg
        -
          title: Physical factors
          copy: |
              Floors and storage areas are examples of physical factors that may need to be tagged. 
          img: LM_U2_S2_P3_Reveal_6.svg
    copy2: |
      ‘Invitations’ to take part in the redeployment activities are sent to everyone with a possible interest so that the process is inclusive. The aim is to conduct the redeployment work efficiently and promptly in order to minimise disruption. Action must be taken if any items are found to be different from their required condition. 

      Any non-essential items should be held in a designated **quarantine area** for a defined period (such as 3 months). This prevents the items from hindering performance without having to throw them away. If it is decided that an item is not wanted, at the end of the quarantine time it can be ‘auctioned’ and used in other work areas.
  -
    title: The red tag log
    theme: t-bg-supporting3
    copy: |
      Every work area should have a **red tag log**. The log provides a systematic way of tracking the progress of improvement. 

      Ultimately, the red tags should be logged and then permanently eliminated. To do this successfully the staff in the work area must be very thorough. If any items are of uncertain designation they should be tagged and addressed.

      Here is an example of a red tag log. 
      
    interactive: 
      file: lm/u2_s2_p3_interactive_redtaglog
      width: 800
      height: 415
      composition: B459E4802A3A47C988A11F6CF58E183B
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      For your assessment, you must be able to (2.1) explain areas of weakness and suggest ways to improve poor workplace organisation. Remember, in order to identify and eliminate problems, red tagging is a crucial part of the continuous improvement process in the workplace.

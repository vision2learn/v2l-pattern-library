    theme: t-bg-grey i-keypoint
    copy: |
      key point text
  -
  -
    title: Using tables and charts
    theme: t-bg-primary1a
    copy: |
      As well as inserting images into your presentation, you can also insert a table or a chart in PowerPoint.

      Using the same technique as for images, you can resize and position your table or chart so that it fits with the rest of your presentation layout.

      Select the images below for more information.

    subInc: 
      type: reveal
      content:
        -
          title: Using tables
          copy: |
            As well as adding charts into your presentation, you can also insert tables of data into your slides. 
            
            As with charts, you have the option to either insert an existing table or create a new table in PowerPoint.
          img: it1_u3_s3_p2_reveal1.svg
        -
          title: Using charts
          copy: |
            you can choose to insert an existing chart within your presentation – for example, you might have a chart that you have created in Microsoft Word or Excel.

            PowerPoint also has tools that you can use to create your own from scratch within your presentation.
          img: it1_u3_s3_p2_reveal2.svg
  -
  -

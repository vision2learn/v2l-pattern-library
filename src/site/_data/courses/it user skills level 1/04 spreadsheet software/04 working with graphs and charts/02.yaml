    title: Chart elements
    theme: 
    copy: |
      Charts and graphs have several different parts. Some of these parts are included by default, and others can be added as and when you need them.

      Two of the most important parts of a chart are the titles and labels it has. It is important that you display this information on a chart as it gives very useful information about the content and purpose of the chart.

      You can change the display of the chart elements by moving them to other locations in the chart, resizing them, or by changing the format. You can also remove chart elements that you don’t want to display.

      Using your mouse, click on the various areas on the chart in the below activity to learn about the different components.
    interactive: 
      file: it2/u3_s5_p1_chart_elements
      width: 1200
      height: 600
      composition: 1A9338FEE8584755AB48BB991EF417A3

title: Speech and language
intro: |
  In this session you will learn about speech, language and communication in individuals with autism we will start by looking at the processes required to communicate using speech and language.
banner: ua_u3_s1_p2_speech.jpg
sections:
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to outline the processes required to communicate using speech and language.
  -
    title: Speech, language and communication
    theme: t-bg-primary
    copy: |
      Let’s look at what is meant by speech and language and how we use them to communicate. Select the images below to learn more about each term.

    subInc: 
      type: reveal
      content:
        -
          title: Speech
          copy: |
            Speech consists of a sender or speaker, a message and a recipient. The speaker is the initiator of communication. Effective speakers will speak clearly, in a way that makes speech interesting and meaningful without too much hesitation or repetition of words or sounds.
          img: placeholder_icon.svg
        -
          title: Language
          copy: |
            Language refers to knowing and choosing the right words to explain what you mean. Joining words together into sentences, using those to create conversations and stories, and to put forward thoughts, ideas, information or instructions. It also involves using words to describe objects, actions and meanings and to question, clarify, describe and debate.
          img: placeholder_icon.svg
        -
          title: Communication
          copy: |
            Communication includes spoken language but also includes many other non-verbal signals or signs which are essential for interacting and communicating with others. It is common that a person who has proper speech and language, may still struggle with communication such as individuals with Autism.
          img: placeholder_icon.svg
  -
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to describe how speech and language development may be delayed or affected for individuals with autism.

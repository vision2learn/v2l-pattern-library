      You will:

      1. one
      2. two
      3. three

      [View the complete set of learning outcomes for this unit.](/pdfs/)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      
      * The processes required to communicate using speech and language
      * How speech and language development may be delayed or affected for individuals with autism 
      * Different forms of communication used by individuals with autism
      * Difficulties an individual with autism may have in communicating verbally when processing or interpreting information

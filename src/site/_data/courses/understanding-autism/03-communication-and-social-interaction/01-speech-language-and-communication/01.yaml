title: Welcome to Unit 3
intro: |
    ### Communication and social interaction in individuals with autism
    
    Welcome to the third unit of your Level 2 Certificate in Understanding autism.  This unit is all about communication and social interaction in individuals with autism. 

banner: placeholder.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit, you will cover the following criteria of your Level 2 Certificate in Understanding autism qualification.

      You will:

      1. Understand speech, language and communication in individuals with autism
      2. Understand how social interaction may differ in individuals with autism
      3. Know strategies that are used to support communication and social interaction for individuals with autism

      [View the complete set of learning outcomes for this unit.](/pdfs/v2l_ua_learning_outcomes_u3.pdf)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      
      * The processes required to communicate using speech and language
      * How speech and language development may be delayed or affected for individuals with autism 
      * Different forms of communication used by individuals with autism
      * Difficulties an individual with autism may have in communicating verbally when processing or interpreting information

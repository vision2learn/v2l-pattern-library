title: Forms of communication
intro: |
  On this page we will look at different forms of communication used by individuals with Autism.
banner: ua_u3_s1_p3_communication.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to describe different forms of communication used by individuals with autism.
  -
    title: Different forms of communication
    theme: t-bg-primary
    copy: |
      Individuals with Autism have unique methods of communication even when they are verbally fluent. We tend to think of communication as a language-based tool, however, a large portion of communication relies on body-language, gestures, and tone of voice. 

      Let’s look at different forms of communication used by individuals with Autism in the following slides.
    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Non verbal
          text: |
            Individuals with Autism who have developed little in the way of language skills, rely on on non-verbal communication techniques. These can include, gestures, pictures or drawings, crying or other emotive sounds or physically taking someone to something they want. Parents and caregivers often become quite adept at reading these non-linguistic communications through context clues and repetition.

          img: placeholder_icon.svg
        -
          title: Echolalia
          text: |
            Echolalia can be immediate or delayed and refers to the repetition of phrases that the autistic person may have heard, perhaps in a favourite movie or television program. Often the phrases may or may not “fit” the immediate context in which it is used, however, they typically do mean something and can relate to an answer indirectly. Often using Echolalia can be self soothing for an individual or give them time to process a question and they may even repeat the question as their answer.
          img: placeholder_icon.svg
        -
          title: Focusing on the literal meaning of words
          text: |
            Individuals with some form of Autism typically have trouble understanding idiomatic language and metaphors and have difficulty understanding jokes and humour which rely on sarcasm. Individuals with autism focus on the “key words” of a sentence so it is best to speak in simple, plain sentences without idioms or figures of speech that hide the “true message”of what is being said.
          img: placeholder_icon.svg
        -
          title: Moving from topic to topic
          text: |
            Individuals with autism often find difficulty with staying on topic as their minds are moving very quickly and processing many stimuli, their thoughts may often seem disorganised or unfocused. However, this usually isn’t the case unless the individual has expressed the desire to stop talking about a given topic, they’re usually open to revisiting previous conversation topics.
          img: placeholder_icon.svg
        -
          title: No eye contact
          text: |
            Often an individual with Autism will not make eye contact when they speak with you. this is usually because they are highly attuned to sensory details, and looking into someone’s eyes can cause an overload of information. Some may prefer to speak with their eyes shut entirely, so as to focus only on the conversation.
          img: placeholder_icon.svg

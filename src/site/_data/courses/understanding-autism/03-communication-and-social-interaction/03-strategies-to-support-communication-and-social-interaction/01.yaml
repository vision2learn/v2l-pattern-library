title: Strategies to support communication and social interaction
intro: |
  In this session you will learn how strategies can be used to support communication and social interaction for individuals with autism.
banner: placeholder.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * Methods that could be used when communicating with an individual with autism
      * Strategies that could be used to support communication and social interaction 
      * How communication can be adapted to meet the needs and preferences of each individual
      * How a constructive environment can be created to aid communication and social interaction
      * The role of specialists in supporting communication and social interaction

  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to identify a range of methods that could be used when communicating with an individual with autism.
  -
  -
    title: Communication Methods
    theme: t-bg-primary
    copy: |
      Being able to communicate is one of the most important skills we need in life. Nearly everything we do involves communication such as learning, asking for food and drink, sorting out problems, making friends and having fun. These all rely on our ability to communicate with each other. If children with autism spectrum disorder can be encouraged to communicate from an early stage this can help them as they get older.

      Select the images below to look at a range of methods that can be used to help with communication.

    subInc: 
      type: reveal
      content:
        -
          title: Follow their lead
          copy: |
            By following the person's lead, rather than directing them, they will be more likely to pay attention to the activity, and focus on it, which will in turn help them to make choices for themselves. 
          img: placeholder_icon.svg
        -
          title: Repeating words
          copy: |
            Try labelling their favourite toy and repeat that word when they reach for it. Try adding another word, they say ‘box'  you say yes ‘red box’ giving them one more piece of information to process.
          img: placeholder_icon.svg
        -
          title: Face to face
          copy: |
            Be face-to-face allowing them to see the variety of facial expressions that are used in communication.They may eventually get used to you playing or interacting with them.
          img: placeholder_icon.svg
        -
          title: Imitate
          copy: |
            Imitate their actions and words or sensory behaviours once they notice this they may begin to imitate back, creating the opportunity to add something new for them to copy.
          img: placeholder_icon.svg
        -
          title: Gestures and visual supports
          copy: |
            Make a gesture to show something, Nod/shake your head for "yes" and "no". Wave a hand for "hello" and "goodbye"  show photographs of things or people being discussed.
          img: placeholder_icon.svg
        -
          title: Songs and role play
          copy: |
            Sing songs with them, pausing to see if they can sing the next part. Or use role play to suggest social interaction and explore how things can go wrong.
          img: placeholder_icon.svg
        -
          title: Give praise
          copy: |
            By using praise and commenting on what has been achieved, the person can make a connection between their own actions and your specific words.
          img: placeholder_icon.svg
        -
          title: Encourage requests
          copy: |
            Put something they want out of reach so they have to ask for it. play with something then stop so they ask for more.
          img: placeholder_icon.svg

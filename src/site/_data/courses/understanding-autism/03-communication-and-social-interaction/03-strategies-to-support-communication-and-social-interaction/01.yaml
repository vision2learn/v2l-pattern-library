  -
    title: Quick quiz
    copy: Now you have watched the above video, select from each of the strategies in the dropdown list to complete the following statements.
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Makaton is a language programme using symbols, signs and speech in spoken word order to enable communication. 
          answer: Makaton
        -
          sentence: Children with autism seem to respond to emotions conveyed through music better than to other forms of communication. 
          answer: music
        -
          sentence: Comic strip conversations use stick figures and symbols to represent social interactions and abstract aspects of conversation, and colour to represent the emotional content of a statement or message.
          answer: Comic strip
        -
          sentence: PECS is a unique alternative/augmentative communication system that works for children who do not speak, who are unintelligible or who are minimally communicators.
          answer: PECS
        -
          sentence: Visual supports help to provide structure and routine and improve understanding, avoiding frustration. 
          answer: Visual supports
        -
          sentence: Social stories present information in a literal way, which may improve a person's understanding of a difficult situations or activities. 
          answer: Social stories
    theme: i-quiz

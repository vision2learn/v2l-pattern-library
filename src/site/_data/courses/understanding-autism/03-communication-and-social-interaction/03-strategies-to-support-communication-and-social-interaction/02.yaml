title: Supporting communication and social interaction
intro: |
  On this page we will learn:
  * How a constructive environment can be created to aid communication and social interaction 
  * The role of specialists to support communication and social interaction. 
banner: placeholder.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to explain how a constructive environment can be created to aid communication and social interaction.
  -
    title: introduction text
    layout: media
    theme: t-bg-primary
    copy: |
      To most people their environment doesn’t overly affect their ability to communicate or socially interact but to individuals with autism it can make all the difference in the world.
      
      If they have issues with sensory overload no amount of trying different methods or strategies will help unless something is done to improve the environment.

    img: /images/svg/placeholder_icon.svg

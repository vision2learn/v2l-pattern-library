title: Social interaction
intro: |
  In this session you will learn how social interaction may differ in Individuals with Autism, lets start by looking at how social development may be delayed of affected.
banner: ua_u3_s2_p1_strategies.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * How social development may be delayed or affected
      * The difficulties individuals may experience with social interaction
      * The links between social development and speech and language development
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to describe how social development may be delayed or affected for individuals with autism.
  -
    title: Social Development
    layout: media
    theme: t-bg-supporting2
    copy: |
      Many children and to some extent adults on the autism spectrum need help with their social development. They often have the desire to interact with others, but may not know how to engage friends or may be overwhelmed by the idea of new experiences. By improving their social skills with practice it can help to enhance participation in social environments. 
    img: /images/svg/ua/ua_u3_s2_p1_image.svg
  -
    title: Delayed or affected social development
    theme: t-bg-primary
    copy: |
      Let’s look at how social development may be delayed or affected in individuals with autism, select the images below to find out more. 
    subInc: 
      type: reveal
      content:
        -
          title: Feelings
          copy: |
            Many children with autism have a limited understanding of other people's feelings and ideas or that their words and actions will affect other people.
          img: ua_u3_s2_p1_reveal1.svg
        -
          title: Not wait their turn
          copy: |
            They may not wait their turn and instead interrupt the person talking.
          img: ua_u3_s2_p1_reveal2.svg
        -
          title: Eye contact
          copy: |
            They have trouble with eye contact and may not show any facial expressions.
          img: ua_u3_s2_p1_reveal3.svg
        -
          title: Friends
          copy: |
            Children with autism can lack the ability to make or keep friends.
          img: ua_u3_s2_p1_reveal4.svg
        -
          title: Play
          copy: |
            They do not engage in normal imaginative play activities with others.
          img: ua_u3_s2_p1_reveal5.svg
        -
          title: Non verbal communication
          copy: |
            Individuals with autism typically have trouble with nonverbal communication for example, understanding the purpose of waving to say hello or goodbye. 
          img: ua_u3_s2_p1_reveal6.svg
  -
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to describe the difficulties individuals with autism may experience with social interaction.
  -
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Difficulties with social interactions

      Individuals with Autism spectrum disorder can have difficulties with social interaction, social communication, and social imagination. Difficulties often include the desire for social interaction but also the frustration of finding social interaction confusing. Watch the video to learn more. 
    video: ua_u3_s2_p1_difficulties_with_social.mp4
  -
    title: Quick quiz
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        Is the following statement true or false? "Many people with autism see social interaction as stressful so may try to avoid them":
          answers:
            True: true
            False: false
        What can be a tendency of a person with autism when having a conversation with another?:
          answers:
            Wait their turn when the other person is talking: false
            Respond with empathy to the other person talking: false
            Interupt the other person talking: true
        Select one option to complete the following sentence:"People with autism may be more interested in things rather than __________________.":
          answers:
            television: false
            books: false
            other people: true
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to explain the links between social development and speech and language development.
  -
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      _Presentation style - 1 Presenter with video clips to support content_
      
      ### Links between social development and speech and language
      
      Let’s look at some links between social development and speech and language development in the following video.

    video: ua_u3_s2_p1_links_between.mp4

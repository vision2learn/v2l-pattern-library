  -
    title: The benefit of therapies and sensory activities
    layout: media
    theme: t-bg-primary
    copy: |
      Let’s look at the benefits of sensory activities for individuals with autism. 

      Occupational therapists can use physical activities and strategies to help individuals with autism to meet their sensory needs and help them to process sensory input in everyday environments. Autism feeding programs can address aversions to food textures or tastes, and sensitivities that can hamper chewing and swallowing. Speech therapy can include both sensitivity reducing and stimulating activities that improve speech, swallowing and related muscle movements. Cognitive behavioural therapy can gradually help to increase tolerance to overwhelming sensory experiences.
    img: /images/svg/placeholder_icon.svg
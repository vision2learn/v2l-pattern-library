  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to give examples of ways to increase sensory stimulation.
  -
  -
    title: Ways to increase sensory stimulation
    theme: t-bg-primary
    copy: |
      For those who are under sensitive there is often a need to increase sensory stimulation. Let’s look at how to increase sensory stimulation.

    subInc: 
      type: reveal
      content:
        -
          title: Visual supports
          copy: |
            Visual supports can be used to back up difficulty with spoken information.
          img: placeholder_icon.svg
        -
          title: Toys
          copy: |
            Using toys like ‘fidgets’ and ‘chewies’ can be used successfully to improve sensory stimulation.
          img: placeholder_icon.svg
        -
          title: Activities
          copy: |
            Making opportunities for rocking or swinging using swings, toys or chairs, as sensory stimulating activities.
          img: placeholder_icon.svg
        -
          title: Odours
          copy: |
            Those who fail to notice extreme odours such as body odour, could be instructed in better personal hygiene.
          img: placeholder_icon.svg
        -
          title: Weighted blankets
          copy: |
            Using weighted blankets to calm those who are under sensitive to touch.
          img: placeholder_icon.svg
  -
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to describe the benefits of sensory activities for individuals with autism.
  -
  -
    title: The benefit of therapies and sensory activities
    layout: media
    theme: t-bg-primary
    copy: |
      Let’s look at the benefits of sensory activities for individuals with autism. 

      Occupational therapists can use physical activities and strategies to help individuals with autism to meet their sensory needs and help them to process sensory input in everyday environments. Autism feeding programs can address aversions to food textures or tastes, and sensitivities that can hamper chewing and swallowing. Speech therapy can include both sensitivity reducing and stimulating activities that improve speech, swallowing and related muscle movements. Cognitive behavioural therapy can gradually help to increase tolerance to overwhelming sensory experiences.
    img: /images/svg/placeholder_icon.svg
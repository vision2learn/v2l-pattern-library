title: Sensory stimulation and activities
intro: |
  On this page. you will learn more about sensory stimulation and various activities to help with sensory stimulation
banner: ua_u4_s2_p2_stimulate.jpg
sections:
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to describe how to create a ‘low arousal’ sensory environment.
  -
    title: What is a low arousal sensory environment?
    theme: t-bg-primary
    copy: |
      Let’s look at how to create a low arousal sensory environment.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Dimmed lighting
          text: |
            A low arousal sensory environment should have natural lighting or dimmed lights which are incandescent rather than fluorescent. Tinted glasses or visors can also help to dim natural or artificial light.
          img: placeholder_icon.svg
        -
          title: Subdued sound
          text: |
            Sounds should be kept to a minimum and any mechanical noise should be eliminated where possible. Ear plugs or headphones can be used in noisy environments to subdue or block out sound.
          img: placeholder_icon.svg
        -
          title: Enclosed spaces
          text: |
            Rooms with closed doors can block out external sounds and high walled enclosed work areas can block out distracting sights.
          img: placeholder_icon.svg
        -
          title: Low odour
          text: |
            Avoidance of strongly scented products such as perfumes, air fresheners, soaps and other cleaning products can help to create a low odour environment. Vented food preparation areas can also help to reduce cooking smells.
          img: placeholder_icon.svg
        -
          title: Touch sensitivity
          text: |
            Food options should avoid personal aversions and clothing should accommodate personal sensitivities. Requesting permission before touching can help with personal contact.
          img: placeholder_icon.svg

  -
    title: Quick quiz
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        Is the following statement true or false? "Sensory overload happens when there is more input from the five senses than a brain can sort through and process":
          answers:
            True: true
            False: false
          feedback: Sensory overload happens when there is more input from the five senses than a brain can sort through and process, such as multiple conversations, flashing overhead lights, lots of music or loud noise.
        Sensory overload in people with autism can mean them focusing on?:
          answers:
            What another person is talking about to them: false
            The smallest most insignificant thing over other things: true
        Select one option to complete the following sentence:"Individuals with autism may find focusing on one sense more of a problem, because they may suffer from _________________ and therefore things that might not normally cause sensory overload can seem much worse.":
          answers:
            proprioception: false
            hyposensitivity: false
            hypersensitivity: true
          feedback: In most people the brain prioritises what sensory information to focus on, but with individuals in autism this is not straightforward.
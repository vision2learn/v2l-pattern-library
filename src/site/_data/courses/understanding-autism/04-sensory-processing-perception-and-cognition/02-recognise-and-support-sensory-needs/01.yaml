title: Recognise and support sensory needs
intro: |
  In this session you will learn how to support sensory needs looking at different environments and how to support individuals who may experience sensory overload. You will also learn about dietary preferences.
banner: ua_u4_s2_p1_recognise.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * The type of environments and situations that can cause an individual to experience sensory overload
      * How individuals with autism may respond when experiencing sensory overload
      * Strategies that can be used to support individuals experiencing sensory overload
      * How to create a ‘low arousal’ sensory environment 
      * Ways to increase sensory stimulation
      * The benefits of sensory activities for individuals with autism 
      * How sensory differences may have an influence on an individual’s dietary preferences
      * How to support the dietary preferences of individuals with autism

  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to identify examples of the type of environments and situations that might contribute to an individual experiencing sensory overload.
  -
    title: Environments and situations that may cause sensory overload
    theme: t-bg-primary
    copy: |
      Let’s have a look at some environments and situations that we use every day that may cause an individual to experience sensory overload.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Home
          text: |
            In the home everyday sounds a family may create along with noise from white goods, TV’s or music systems can be problematic. Bright lights like fluorescents or TV screens, bright colours, patterned and textured textiles or wallpapers may pose problems. The smell of cooking, pets or cleaning products may also be an issue as well as clutter and overcrowded furniture.
          img: ua_u4_s2_p1_slide1.svg
        -
          title: Education
          text: |
            In schools and colleges or even universities problems of bright or flashing lighting and mechanical sounds can cause issues along with digital equipment and other students. Canteens and public spaces can provide a great deal of problematic sensory stimuli especially smells.
          img: ua_u4_s2_p1_slide2.svg
        -
          title: Public buildings
          text: |
            Public buildings can cause major issues with all stimuli but especially vision and sound. Textures, patterns, lights and smells are especially an issue in places such as hospitals. Also, by their nature public building are full of people who add to this.

          img: ua_u4_s2_p1_slide3.svg
        -
          title: Workplace
          text: |
            Workplaces often involve machinery and lots of noise along with a variety of different smells related to the business or from a canteen. Lighting maybe an issue and overcrowded facilities may also cause problems.
          img: ua_u4_s2_p1_slide4.svg
  -

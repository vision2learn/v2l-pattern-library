title: What did you learn? 
intro: Well done, you’ve now completed the second session of this unit! 
banner: ba-u1-s1-p6.jpg
sections:
  -
    title: Summary
    theme: t-bg-primary i-summary
    copy: |
      In this session, you have learnt about:
      * The type of environments and situations that can cause an individual to experience sensory overload
      * How individuals with autism may respond when experiencing sensory overload
      * Strategies that can be used to support individuals experiencing sensory overload
      * How to create a ‘low arousal’ sensory environment 
      * Ways to increase sensory stimulation
      * The benefits of sensory activities for individuals with autism 
      * How sensory differences may have an influence on an individual’s dietary preferences
      * How to support the dietary preferences of individuals with autism
  
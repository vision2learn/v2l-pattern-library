      Let’s look at how sensory differences may have an influence on an individual’s dietary preferences.

    subInc: 
      type: reveal
      content:
        -
          title: Sensory differences
          copy: |
            Many Individuals with autism experience sensory differences that can affect their experience of meals and their relationship with food. 
          img: placeholder_icon.svg
        -
          title: Environment
          copy: |
            They might find it too distracting to eat in a noisy canteen but would rather eat in a quiet room instead.
          img: placeholder_icon.svg
        -
          title: Smells and Taste
          copy: |
            People who are very sensitive to smells and taste may prefer to eat quite bland food and may find strong food smells overpowering.
          img: placeholder_icon.svg

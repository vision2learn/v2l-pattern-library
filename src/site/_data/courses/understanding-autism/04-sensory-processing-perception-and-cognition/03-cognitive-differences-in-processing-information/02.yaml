      ### Interview with professionals / key workers
      
      Please see the following interview video of professionals' responses to the following question:

      1. Has anyone you have worked with or supported, had any problems processing information such as time perception, routines and prioritising things?
      2. What strategies did you use to help them with these difficulties?

    video: ua_u4_s3_p2_interview_processing_group.mp4

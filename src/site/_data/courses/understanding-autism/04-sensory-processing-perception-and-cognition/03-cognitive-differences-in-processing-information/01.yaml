title: Cognitive differences in processing information
intro: |
  In this session you will learn about the difficulties individuals with autism have in processing information and strategies that can be used to help them.
banner: ua_u4_s3_p1_cognitive.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * Difficulties an individual with autism may have processing information 
      * Strategies to support an individual with autism to complete activities and tasks

  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to Outline the difficulties an individual with autism may have with:
      * processing information
      * predicting the consequences of an action
      * organising, prioritising and sequencing
      * understanding the concept of time
  -
    title: Processing information
    theme: t-bg-primary
    copy: |
      Select the images below to learn about the difficulties an individual with autism may have processing information.

    subInc: 
      type: reveal
      content:
        -
          title: Processing information
          copy: |
            Difficulties in areas such as personal organisation, behaviour, planning, perception, generalising, predicting and understanding concepts.
          img: placeholder_icon.svg
        -
          title: Consequences of an action
          copy: |
            Difficulty in predicting the consequences of an action such as ‘if I do this, what happens next? 
          img: placeholder_icon.svg
        -
          title: Organising and prioritising
          copy: |
            Difficulties with organising and prioritising makes it harder to plan daily activities and manage time effectively. 
          img: placeholder_icon.svg
        -
          title: Sequencing
          copy: |
            Difficulties with activities that involve a process, such as coping with daily tasks like tidying up or cooking or doing laundry.
          img: placeholder_icon.svg
        -
          title: Concept of time
          copy: |
            Difficulty planning what to do over the course of a day or a week.
          img: placeholder_icon.svg

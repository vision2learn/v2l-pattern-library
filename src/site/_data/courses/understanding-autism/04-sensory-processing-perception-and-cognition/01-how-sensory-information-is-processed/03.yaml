title: Balance and body awareness
intro: |
  Problems with balance and body awareness may cause individuals with autism to look clumsy and uncoordinated let’s learn more about this.
banner: ua_u4_s1_p3_balance.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to outline why individuals with autism may experience balance difficulties (vestibular sense).
  -
    title: Balance and body awareness difficulties
    theme: t-bg-primary
    copy: |
      Let’s look at 2 other senses that are affected by Hyposensitivity and Hypersensitivity.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Experiencing balance difficulties
          text: |
            Vestibular sense or balance can cause a range of problems depending on whether the individual is ‘hyposensitive’ or ‘hypersensitive. Those who are hyposensitive or under sensitive, often need to rock, swing or spin to gain some sensory input.  Using toys like rocking horses swing and roundabouts can help with children and an adult could use a rocking chair. Hypersensitive individuals struggle with activities like sport where they need to control their movements, they may also have problems changing direction quickly and suffer from motion sickness.
          img: ua_u4_s1_p3_slide1.svg
        -
          title: Experiencing Body Awareness difficulties
          text: |
            Proprioception or Body awareness can also cause a range of different problems depending on whether the individual is ‘hyposensitive’ or ‘hypersensitive. Hyposensitive individuals stand very close to others and cannot judge personal space they also find it hard to avoid obstructions and navigate their way around spaces often bumping into people or things. Hypersensitive individuals may have problems with fine motor skills like tying shoes laces or fastening buttons and they may have to move their whole body to look at something.
          img: ua_u4_s1_p3_slide2.svg
  -
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint

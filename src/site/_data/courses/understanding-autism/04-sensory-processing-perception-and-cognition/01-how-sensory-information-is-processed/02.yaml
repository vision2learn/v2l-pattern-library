title: How sensory information is processed
intro: |
  In this session you will learn how individuals process sensory information, how this affects their senses and how they may experience difficulties.
banner: ua_u4_s1_p2_sensory.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to outline how differences in processing sensory information may affect each of the senses.
  -
    title: How processing sensory information may affect the senses.
    theme: t-bg-primary
    copy: |
      Select the images below to learn how processing sensory information may affect the senses.

    subInc: 
      type: reveal
      content:
        -
          title: Vision
          copy: |
            Some may find things too dark or may lose some of their features, others find objects too bright and can appear to jump around.
          img: placeholder_icon.svg
        -
          title: Hearing
          copy: |
            Some may not acknowledge particular sounds; others may be able to hear conversations in the distance.

          img: placeholder_icon.svg
        -
          title: Touch
          copy: |
            Some hold onto people or things very tightly, others don’t like to be touched at all.
          img: placeholder_icon.svg
        -
          title: Taste
          copy: |
            Some individuals like really spicy food, others find foods too strong or overpowering.
          img: placeholder_icon.svg
        -
          title: Smell
          copy: |
            Some individuals have no sense of smell and fail to notice extreme odours, whereas others dislike strong smells such as cleaning products and perfumes. 
          img: placeholder_icon.svg

  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to define what is meant by hypersensitivity and hyposensitivity.
  -
    title: What is meant by Hypersensitivity and Hyposensitivity?
    layout: media
    theme: t-bg-primary
    copy: |
      Hypersensitivity is when individuals are extremely reactive to sensory stimulation to the extent that they may find stimuli overwhelming. Lights can be too bright or sounds that would not bother others, can cause them to cover their ears. Hyposensitivity is the opposite and involves individuals being under-sensitive to stimulation with decreased sensitivity to sensory input. Individuals have a harder time stimulating their senses than normally.

    img: /images/svg/placeholder_icon.svg
  -
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to give examples of behaviours that may suggest an individual is hyposensitive or hypersensitive.

      [View the complete set of learning outcomes for this unit.](/pdfs/)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      
      * How differences in processing sensory information may affect each of the senses 
      * Definition of what is meant by hypersensitivity and hyposensitivity  
      * Why individuals with autism may experience balance difficulties
      * How individuals with autism may experience difficulties with body awareness
      * Behaviours that may indicate an individual is hyposensitive or hypersensitive

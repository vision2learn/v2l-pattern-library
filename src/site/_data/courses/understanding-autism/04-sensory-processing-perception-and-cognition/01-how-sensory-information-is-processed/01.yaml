title: Welcome to Unit 4
intro: |
    ### Sensory processing, perception and cognition in individuals with autism
    
    Welcome to the fourth unit of your Level 2 Certificate in Understanding autism.  In this unit you will learn about sensory processing, perception and cognition in individuals with autism.

banner: ua_u4_s1_p1_welcome.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit, you will cover the following criteria of your Level 2 Certificate in Understanding autism qualification.

      You will:

      1. Understand how individuals with autism process sensory information
      2. Know how to recognise and support sensory needs
      3. Understand the cognitive differences individuals with autism may have in processing information

      [View the complete set of learning outcomes for this unit.](/pdfs/v2l_ua_learning_outcomes_u4.pdf)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      
      * How differences in processing sensory information may affect each of the senses 
      * Definition of what is meant by hypersensitivity and hyposensitivity  
      * Why individuals with autism may experience balance difficulties
      * How individuals with autism may experience difficulties with body awareness
      * Behaviours that may indicate an individual is hyposensitive or hypersensitive

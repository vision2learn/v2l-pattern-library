title: Characteristics that may be present in individuals with autism
intro: |
  In this session you will learn about the characteristics associated with autism and how theses vary from individual to individual.

banner: placeholder.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * The main characteristic found in individuals with autism
      * How these characteristics can vary from individual to individual
      * What is meant by the ‘triad of impairments’
      * The positive and negative points of the triad of impairments

  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to describe the main characteristics found in individuals with autism.
  -
    title: Characteristics of Autism
    layout: media
    theme: t-bg-primary
    copy: |
      There are several characterisics of Austism which could include the following:
      * Communication
      * Social interaction
      * Repetitive and restrictive behaviour
      * Sensory sensitivity
      * Fixation
      * Fluctuation of skills

      Please see the below video for a more indepth look at these characteristics.

    img: /images/svg/placeholder_icon.svg

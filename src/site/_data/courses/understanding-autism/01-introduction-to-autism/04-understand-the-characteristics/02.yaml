title: Triad of impairments
intro: |
  The 'Triad of Impairments' is a term used to describe the main features all people with autism have difficulty with to some degree.  Lets learn more about this.
banner: ua_u1_s4_p2_triad.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to outline what is meant by the ‘triad of impairments’.
  -
    title: Triad of impairments
    layout: media
    theme: t-bg-primary
    copy: |
      What is meant by the Triad of Impairments? The ‘triad’ was established in the 1970’s by Lorna Wing and her colleague Judith Gould, and this was used to define Autism. Her work showed the clustering of social and communication impairments, and lack of pre-tend play, which was in turn replaced by repetitive behaviour and this signified the basis for Autism as a syndrome.

    img: /images/svg/ua/ua_u1_s2_p1_slide4.svg
  -
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to identify positive and negative points of the triad of impairments.
  -
  -
    title: How do we define the ‘triad of impairments’?
    theme: t-bg-primary
    copy: |
      Everyone with ‘Autism spectrum disorder’ has difficulties in 3 main areas;

    subInc: 
      type: reveal
      content:
        -
          title: Social interaction
          copy: |
            The difficulty in understanding social 'rules', behaviour and relationships, for example, appearing indifferent to other people or not understanding how to take turns or share with others. 

          img: ua_u1_s4_p2_reveal1.svg
        -
          title: Communication and language
          copy: |
            Not being able to fully process and understand dialogue. difficulties in being involved involved in the natural flow of conversation or understanding instructions.

          img: ua_u1_s4_p2_reveal2.svg
        -
          title: Imagination or rigidity of thinking
          copy: |
            They have a strong preference for a set routine or way of doing things and can feel great discomfort if this does not happen or is done incorrectly.
          img: ua_u1_s4_p2_reveal3.svg
  -
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      _Presenter with images/video clips to support content_
      
      Let’s look at a short video about the positive and negatives of the Triad of Impairments.
    video: ua_u1_s4_p2_triad_of_imparments.mp4

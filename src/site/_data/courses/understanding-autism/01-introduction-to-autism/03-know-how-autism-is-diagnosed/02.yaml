title: Importance of diagnosis, reluctance and prevalence
intro: |
  intro text
banner: ua_u1_s3_p2_importance.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to give reasons why people may be reluctant to seek a diagnosis.
  -
    title: Reluctance
    theme: t-bg-primary
    copy: |
      Lets look at some reasons why people may be reluctant to seek a diagnosis
    
      Scroll through the slides below to learn more about ...

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Formal diagnosis or not?
          text: |
            It may seem strange but some parents prefer not to get a formal diagnosis for their child or young person, as they feel that they will make more progress if they don't have a label. A person may also feel their hope for a ‘normal’ life has been crushed if they are labelled with a diagnosis. 

          img: placeholder_icon.svg
        -
          title: Labelling
          text: |
            By labelling a person there is a certain perception of ability and a label can hide the vast differences amongst individuals on the spectrum.  Diagnostic labels may alter how other people treat the individual, for example, teachers may expect less from a student who has a diagnosis and therefore may be reluctant to challenge them.
          img: placeholder_icon.svg
        -
          title: Generalisations
          text: |
            Those that have little knowledge of ‘Autism spectrum disorder’ can make generalisations believing that all people behave the same way when in fact this is far from the case. Some see only the diagnosis, not the person, and this can negatively define the individual by focusing on the specific problem, and downplaying many positive personal characteris-tics

          img: placeholder_icon.svg
        -
          title: Possible limitations
          text: |
            Parents who don’t want to limit opportunities for their child may be concerned that adiagnosis can prevent a young person from pursuing certain careers, for example thepolice or armed forces due to the nature of the disorder.

          img: placeholder_icon.svg
        -
          title: Workplace discrimination
          text: |
            Once the young person reaches working age, there can be negative discrimination in theworkplace, and a diagnosis can lead to stigma and stereotyping and unkind people mightuse a diagnostic term for name calling or bullying.

          img: placeholder_icon.svg

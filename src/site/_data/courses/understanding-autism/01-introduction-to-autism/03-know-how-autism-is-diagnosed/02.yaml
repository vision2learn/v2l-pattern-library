    title: Prevalence
    theme: t-bg-primary
    copy: |
      Here are some facts showing the prevalence of Autism in the UK. 

    subInc: 
      type: reveal
      content:
        -
          title: 700,000 people
          copy: |
            It’s estimated that around 700,000 people in the UK have a diagnosis of autism. 
          img: placeholder_icon.svg
        -
          title: one in 100
          copy: |
            One in 100 children in the UK have a diagnosis of autism spectrum disorder.
          img: placeholder_icon.svg
        -
          title: Increase in diagnosis
          copy: |
            Over the last 30 years, there has been a 25-fold increase in the diagnosis of autism and it is estimated that over 1% of the UK’s population are autistic.
          img: placeholder_icon.svg
        -
          title: Boys more than girls
          copy: |
            Autism is between 3 and 4 times more prevalent in boys than girls.
          img: placeholder_icon.svg
        -
          title: Undetected
          copy: |
            Although diagnosis rates have increased over the years, many children with autism still remain undetected.

          img: placeholder_icon.svg

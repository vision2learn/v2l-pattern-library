    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to describe the difficulties surrounding the diagnosis of autism.
  -
  -
    title: The difficulties surrounding the diagnosis of autism
    layout: media
    theme: t-bg-primary
    copy: |
      It's not always easy to get an autism assessment. Waiting times can also be very long. If a person finds it hard to get an assessment they can approach the National Autistic Society who can give advice about options, including private assessments. There is no actual ‘medical’ test but diagnosis is made with a comprehensive behaviour evaluation and developmental screening.

    img: /images/svg/ua/ua_u1_s3_p1_image.svg

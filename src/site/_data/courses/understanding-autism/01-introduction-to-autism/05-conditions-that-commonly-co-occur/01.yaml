title: Conditions that commonly co-occur with autism
intro: |
  In this session you will learn about the different conditions that commonly co-occur with Autism let’s start by looking at the most common.
banner: placeholder.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * Certain conditions that may co-occur with autism
      * Other conditions that may co-occur with autism
      * Concerns that can arise from these co-occurring conditions
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to explain the following conditions that may co-occur with autism:
      * Mental ill-health
      * Learning disability.
  
  -
    title: Common conditions
    theme: t-bg-primary
    copy: |
      
    
      Let’s look at some of the common conditions that may co-occur with Autism.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Introduction
          text: |
            Alongside the usual characteristics of Autism Spectrum Disorder, there are a range of common conditions that may co-occur, and these conditions can vary from one individual to another. Many individuals on the spectrum have at least one of these conditions some may have four or more. However it is often difficult to isolate the condition from the characteristics of Autism spectrum disorder.

          img: placeholder_icon.svg
        -
          title: Mental-health conditions
          text: |
            ‘Mental-health conditions’, such as attention deficit hyperactivity disorder (ADHD), obsessive-compulsive disorder (OCD), anxiety or depression; ADHD traits may be mistaken or mask those of autism, delaying a diagnosis. Symptoms of ADHD include finding it hard to concentrate and getting easily distracted acting without thinking and not sitting still. 

          img: placeholder_icon.svg
        -
          title: Anxiety
          text: |
            Anxiety can assume unusual forms in people with autism, turning uncertainty, disruption to routine or even a colour, fabric, or sound, into a constant worry. Depression has been shown by several studies to be one of the most common co conditions in those with Au-tism spectrum disorder, and can develop and occur more in high-functioning individuals during adolescence, when the individual develops greater insight into their differences from others.
          img: placeholder_icon.svg
        -
          title: Learning disability
          text: |
            ‘Developmental diagnoses’ such as intellectual disability or language delay, problems with reading, writing and spelling (dyslexia), clumsy movements and problems with or-ganisation and following instructions (dyspraxia). 
          img: placeholder_icon.svg
        -
          title: Difficult to diagnose
          text: |
            A diagnosis for Autism which can be more difficult in those with intellectual disability or severe language delays. A person with a learning disability may find it hard to understand new or complicated information, look after themselves, learn new skills all of which can impact on their Autism.

          img: placeholder_icon.svg
  -

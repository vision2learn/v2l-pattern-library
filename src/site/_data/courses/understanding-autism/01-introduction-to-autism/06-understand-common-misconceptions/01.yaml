    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        Discussion on how discrimination can occur inadvertently in society
        
        Let’s look at some of the ways a person could be discriminated against because of their autism spectrum disorder.

        possible choices or points for discussion:
          
        a)“further expanded discussion on Greta Thunberg”

        b)“ autism should be seen not as a disability,”

        c)“once someone is labelled as having a ‘disability’ such as ‘Autism spectrum disorder’ they are automatically in some people’s eyes seen as ‘disabled’ and not capable.”

        d)“This is just pure discrimination as there are so many people, especially high function-ing ASD individuals today that maintain successful and high profile careers without oth-ers being aware of their diagnosis.”


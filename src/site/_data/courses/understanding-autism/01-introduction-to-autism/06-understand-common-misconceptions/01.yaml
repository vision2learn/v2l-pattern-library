title: Understand common misconceptions surrounding autism
intro: |
  In this session you will learn about the common misconceptions surrounding Autism.
banner: ua_u1_s6_p1_misconceptions.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn how:
      * Attitudes and lack of understanding can compound the difficulties of individuals with autism
      * Autism can be misrepresented in the media
      * Discrimination against individuals with autism can occur inadvertently in society
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to describe how attitudes and lack of understanding can compound the difficulties of individuals with autism. 
  -
    title: Attitudes and lack of understanding
    theme: t-bg-primary
    copy: |
      Let’s start by looking at the different attitudes and lack of understanding and how it can impact individuals with Autism.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Stigma
          text: |
            Stigma towards Autism is hard to tackle as it affects individuals differently with a wide range of characteristics. Stigma involves negative attitudes or discrimination against someone based on their behaviour and manner.

          img: ua_u1_s6_p1_slider1.svg
        -
          title: Negative public attitude and lack of understanding
          text: |
            Negative public attitude and lack of understanding for those on the Autism spectrum contributes to the difficulties they have participating in society, as focus tends to be on the condition and perceived limitations, rather than looking at what they contribute to the community.

          img: ua_u1_s6_p1_slider2.svg
        -
          title: Intolerance or ignorance
          text: |
            Intolerance or ignorance leads people to have a negative view of all disability and make jokes, and use offensive terms.  Name calling based on autism can affect young children in school, as they are teased by their peers due to their condition.
          img: ua_u1_s6_p1_slider3.svg
        -
          title: Judgement
          text: |
            People pass judgement, think about how often a parent seems to have trouble handling a child who seems to be misbehaving in a shop. Comments like bad parent, bad child may often be used, however the child may be on the spectrum and has had their senses affected and this is why they are reacting.

          img: ua_u1_s6_p1_slider4.svg
        -
          title: Unsuitable
          text: |
            Some employers see individuals with Autism as unsuitable for the workforce as they are not good at taking direction or working with others on tasks. They make not respond well to the surroundings or those around them. However employers should try to give an opportunity to see how their skills can be accommodated.

          img: ua_u1_s6_p1_slider5.svg
  -

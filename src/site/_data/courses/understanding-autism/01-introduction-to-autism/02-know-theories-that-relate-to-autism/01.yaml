title: Theories that relate to Autism
intro: |
  In this session you will be introduced to the theories and terms that relate to Autism and what they mean for those on the spectrum.
banner: ua_u2_s1_p1_person-centred.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * The theoretical models related to identifying Autism
      * What the terms ‘neurodiverse’ and ‘neurotypical’ mean in relation to Autism


  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to outline theoretical models in relation to identifying autism.
  
  -
    title: Theoretical models
    theme: t-bg-primary
    copy: |
      Let’s look at the different diagnoses relating to Autism and theoretical models in the following slides.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Autism spectrum disorder
          text: |
            In the past Autism consisted of different diagnoses including Aspergers syndrome, autistic disorder, Kanner’s syndrome, childhood autism, atypical autism and pervasive developmental disorder not otherwise specified (PDD-NOS). However all of these have similar characteristics and therefore the term Autism spectrum disorder is used. 

          img: placeholder_icon.svg
        -
          title: Kanner syndrome
          text: |
            ‘Kanner syndrome’ was first recognised in 1943, when Leo Kanner a Ukrainian, Austrian, American child psychiatrist first described a specific pattern of ‘abnormal behaviour’ known as the syndrome of ‘early infantile autism’. He concluded that it was a ‘neurodevelopmental disorder’ and children were born with an inability to form the usual bonds and communication links. His clinical descriptions and results of his research have helped us to learn more about autism.

          img: placeholder_icon.svg
        -
          title: Asperger syndrome
          text: |
            ‘Asperger syndrome’ was derived from a study by Hans Asperger an Austrian paediatri-cian in the 1940’s who observed ‘autism-like’ behaviours and difficulties with social and communication skills, in boys who had intelligence and abilities, including grammatical language, in the average or superior range. What distinguishes Asperger’s syndrome from classic autism, is that children may be only mildly affected, and they frequently have good language and cognitive skills.

          img: placeholder_icon.svg
        -
          title: Triad of Impairments
          text: |
            Judith Gould, together with Lorna Wing, set up the first service in the UK to provide a complete diagnostic, assessment and advice service for children, adolescents and adults with social and communication disorders. The term ‘triad of Impairments’ was established in the 1970’s by Lorna Wing who had a daughter with severe autism. She and her colleague Judith Gould, used this term to define Autism. Lorna Wing also introduced the concept of an autism ‘spectrum’ being one of the first to realise it affected people of all ages and abilities and it was not a rare disorder and actually affected 1 or 2 per 1,000 people to some degree.

          img: placeholder_icon.svg

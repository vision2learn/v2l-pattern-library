title: Introduction to Autism
intro: |
  On this course you will learn about Autism, which will help you with your general understanding and appreciation of the subject. To start with we are going to look at Autism and what it means.

banner: ua_u1_s1_p3_autism.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      * Social and communication disorders
      * How autism can be considered as a spectrum disorder
      * Why it is important to recognise that autism is a lifelong condition
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to define the following:
      * Autistic spectrum disorder 
      * Asperger syndrome 
      * High-functioning autism (HFA) 
  -
  -
    title: Social and Communication Disorders
    theme: t-bg-primary
    copy: |
      Let’s look at 3 social and communication orders, what they mean and how they relate to each other. Scroll through the slides below  below to learn more.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Autism spectrum disorder
          text: |
            'Autism spectrum disorder’ is a lifelong developmental condition, relative to brain development and impacts how a person perceives others, causing problems with com-munication and social interaction. It can also include limited and repetitive patterns of behaviour.  

          img: ua_u1_s1_p3_slide1.svg
        -
          title: Asperger syndrome
          text: |
            Those with ‘Asperger syndrome’ don't have the learning disabilities that many autistic people have, but may have specific learning difficulties with understanding and pro-cessing language. Some with Asperger syndrome say the world feels overwhelming and this can cause considerable anxiety especially relating to other people, and taking part in everyday family, school, work and social life.

          img: ua_u1_s1_p3_slide2.svg
        -
          title: High functioning autism
          text: |
            'High-functioning’ autism isn’t an official medical term but its seen as more informative. It describes a milder form of autism or level 1 on the autism spectrum. Those with Aspergers syndrome are often described as having high functioning autism showing symptoms but with little need for support and mostly living independent lives.
          img: ua_u1_s1_p3_slide3.svg
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to explain why autism is considered a spectrum disorder.
  -
    title: Why is autism considered a spectrum disorder?
    layout: media
    theme: t-bg-primary
    copy: |
      What is meant by Autism, the definition of autism has changed and will probably keep on changing as we understand more. Autism is a ‘spectrum’ condition and this refers to the wide range of symptoms and the severity. All autistic people share certain difficulties, but being autistic will affect them in different ways. 
      
      Some feel that the spectrum is too broad, as a person who needs full time support cannot be compared with someone who just finds things ‘too bright’ or ‘too loud’. But what is needed by all is understanding of what it is to be Autistic.
    img: /images/svg/ua/ua_u1_s1_p3_image.svg
  -
    title: Quick quiz
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        Select one option to complete the following sentence:"Those with ________________ don't have the learning disabilities that many autistic people have":
          answers:
            Kanner syndrome: false
            an associated illness: false
            Asperger syndrome: true
        Is the following statement true or false? "Autism is a spectrum condition and this refers to the wide range of symptoms and the severity.":
          answers:
            True: true
            False: false
        Which of the following is considered a milder form of autism?:
          answers:
            Autistic disorder: false
            Asperger syndrome: false
            High functioning autism: true
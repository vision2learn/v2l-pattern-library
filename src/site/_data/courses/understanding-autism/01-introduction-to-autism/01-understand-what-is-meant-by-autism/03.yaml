title: Introduction to Autism
intro: |
  This unit will give you an introduction to autism, and cover what is meant by ‘autism’, theories and diagnosis. It will also look at common misconceptions associated with autism and conditions that can co-occur with autism.
banner: placeholder.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      * What is meant by Autism
      * Autism definitions
      * Spectrum disorder
      * Understanding that autism is a life-long condition
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to define the following:
      * Autistic spectrum disorder 
      * Asperger syndrome 
      * High-functioning autism (HFA) 
  -
    title: Understand what is meant by 'autism'
    layout: media
    theme: t-bg-primary
    copy: |
      What is meant by Autism, the definition of autism has changed and will probably keep on changing as we understand more. Autism is a ‘spectrum’ condition and this refers to the wide range of symptoms and the severity. All autistic people share certain difficulties, but being autistic will affect them in different ways. 
      
      Some feel that the spectrum is too broad, as a person who needs full time support cannot be compared with someone who just finds things ‘too bright’ or ‘too loud’. But what is needed by all is understanding of what it is to be Autistic.  
    img: /images/svg/placeholder_icon.svg
  -
  -
    title: Autism definitions
    theme: t-bg-supporting3
    copy: |
      Let’s look at three definitions of autism, what they mean and how they relate to each other. Select the images below to learn more about each term.
    subInc: 
      type: reveal
      content:
        -
          title: Austistic spectrum disorder
          copy: |
            ‘Autism spectrum disorder’ is a lifelong developmental condition, relative to brain devel-opment and impacts how a person perceives others, causing problems with communica-tion and social interaction. 
          img: placeholder_icon.svg
        -
          title: Asperger syndrome
          copy: |
            Those with ‘Asperger syndrome’ don't have the learning disabilities that many autistic people have, but may have specific learning difficulties with understanding and pro-cessing language. 
          img: ypmh_u1_s1_p3_reveal2.svg
        -
          title: High-functioning autism (HFA)
          copy: |
            “High-functioning’  autism isn’t an official medical term but its seen as more informative. It describes a milder form of autism or level 1 on the autism spectrum.
          img: placeholder_icon.svg
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to explain why autism is considered a spectrum disorder.
  -
    title: Why is autism considered a spectrum disorder?
    layout: media
    theme: t-bg-primary
    copy: |
      Autism is considered a spectrum disorder because of the wide variation of symptoms and severity of those symptoms experienced and It occurs in ethnic and racial groups.
    img: /images/svg/placeholder_icon.svg

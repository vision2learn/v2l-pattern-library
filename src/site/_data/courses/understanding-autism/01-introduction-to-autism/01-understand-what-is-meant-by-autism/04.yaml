title: Lifelong condition
intro: |
  On this page we are going to look at why it is important to recognise that autism is a lifelong condition
banner: ua_u1_s1_p4_lifelong.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to explain why it is important to recognise that autism is a lifelong condition.
  -
    title: Lifelong condition
    layout: media
    theme: t-bg-primary
    copy: |
      Autism spectrum disorder is a lifelong condition but there are treatments and services that can help to improve an individuals symptoms and ability to function. The way autism affects children and young people can change as they grow and develop and experience different environments.

    img: /images/svg/ua/ua_u1_s1_p4_image.svg

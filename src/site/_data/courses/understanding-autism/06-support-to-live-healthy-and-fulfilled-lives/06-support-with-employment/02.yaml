title: Organisations and agencies that support
intro: |
  intro text
banner: placeholder.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to identify organisations and agencies that support individuals with autism into employment.
  -
    title: Supporting organisations and agencies
    theme: t-bg-primary
    copy: |
      Let’s look at some government organisations that can help with supporting individuals into employment.

    subInc: 
      type: reveal
      content:
        -
          title: Work Choice 
          copy: |
            Provides an overview of the work choice programme, how to apply, eligibility criteria and what it can assist with/provide.
          img: placeholder_icon.svg
        -
          title: Access to work
          copy: |
            If you are already in employment or have an interview for a job, the government has a scheme called Access to Work. This scheme provides grants to support you in the workplace.
          img: placeholder_icon.svg
        -
          title: Specialist Employability Support 
          copy: |
            Outlines the eligibility criteria, support available and application process for access to the specialist employability support. Intensive training and support for short periods of time as well as long term assistance is offered. 
          img: placeholder_icon.svg

title: How to support individuals with employment
intro: |
  In this session you will learn about how to support individuals with employment, looking at barriers, starting and continuing in employment and organisations and agencies that can help.
banner: placeholder.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * Barriers that people with autism may face in gaining employment
      * How individuals can be supported with gaining starting and continuing employment
      * Organisations and agencies that support individuals with autism into employment

  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to identify barriers that people with autism may face in gaining employment.

  -
    title: Quick quiz
    copy: 
    subInc: 
      type: word-quiz
      content:
        -
          sentence: High functioning individuals can be very successful in many different fields including science, research, finance, banking and the arts. 
          answer: High functioning
        -
          sentence: Making the application process for individuals with autism, simpler and more inclusive will help in the beginning. 
          answer: application process
        -
          sentence: It is important that employers realise that many individuals with autism do not see themselves as ‘disabled’ but ‘neurodiverse’ meaning they just look at life differently. 
          answer: neurodiverse
        -
          sentence: Individuals with autism can offer loyalty, dedication and can be extremely skillful once trained.
          answer: extremely skillful
    theme: i-quiz
  -
  -
    title: How individuals can be supported with gaining, starting and continuing employment
    theme: t-bg-primary
    copy: |
      Individuals can be supported in different ways in gaining, starting and continuing in employment by helping them to understand the process and using different strategies to help them overcome any barriers.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Gaining employment
          text: |
            When an individual is looking for a job, they should be given some guidelines as to what to look for, such as jobs that are clear, detailing what the role is how it relates to their skills. It is also wise to see whether the company welcomes applications from ‘disabled’ people or specifically neurodiverse individuals. No one should be discriminated against for their ‘disability’ but it is often used in the selection process. Help can also be given in understanding the application process and interview techniques.
          img: ua_u6_s6_p1_slide1.svg
        -
          title: Starting employment
          text: |
            Success at the application and interview stage should be praised and should help to reassure them that they have the skills to do the job, however they may need further reassurance and support in preparing them for the formalities of starting employment. If the process is clearly laid out using timelines and visual supports to back it up, should make it easier for them to understand the process. Their job role and timetable should also be clearly defined so as not to create any ambiguity.
          img: ua_u6_s6_p1_slide2.svg
        -
          title: Continuing employment
          text: |
            The ‘work based’ environment may need reasonable adjustments, to facilitate the optimum working environment for the individual, taking into consideration any sensory needs. By supporting their needs there should be less distractions to their working day, and therefore they should be able to be more productive. HR should also be able to support their needs, by regularly reviewing their job role and any professional development needs.
          img: ua_u6_s6_p1_slide3.svg
  -

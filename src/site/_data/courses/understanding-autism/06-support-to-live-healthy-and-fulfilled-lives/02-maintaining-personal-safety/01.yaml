      In your assessment you will be required to outline ways to safeguard against the bullying and exploitation of individuals with autism.
  
  -
    title: What can be done if an individual is being bullied? 
    theme: t-bg-primary
    copy: |
      The is no definition of bullying in legislation, but bullying can involve	name calling, making fun of spreading rumours threatening or humiliating or taking money or other items from an individual.  Let’s look at some clues for a parent as to whether a child or young person with autism is being bullied.

    subInc: 
      type: reveal
      content:
        -
          title: Physical signs
          copy: |
            They come home with dirty, damaged or missing clothes, bags or books, with bruises or scratches, without money they should have or asking for more money the next day. 
          img: ua_u6_s2_p1_reveal1.svg
        -
          title: Changing routines
          copy: |
            They arrive at school or college late or get home late because they have changed their route to or from school or college.
          img: ua_u6_s2_p1_reveal2.svg
        -
          title: Reluctance to do things
          copy: |
            They may be reluctant to go to school or college and make excuses to miss attending. 
          img: ua_u6_s2_p1_reveal3.svg
        -
          title: Mood changes
          copy: |
            They may seem to be stressed, depressed, unhappy or unwell.  
          img: ua_u6_s2_p1_reveal4.svg
        -
          title: Concentration issues
          copy: |
            They may show a deterioration in concentration or the standard of work. 
          img: ua_u6_s2_p1_reveal5.svg
        -
          title: Behavioural issues
          copy: |
            They may show an increase or change in obsessional or repetitive behaviour. 
          img: ua_u6_s2_p1_reveal6.svg

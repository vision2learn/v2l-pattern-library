    title: What can be done if an individual is being bullied? 
    theme: t-bg-primary
    copy: |
      The is no definition of bullying in legislation, but bullying can involve	name calling, making fun of spreading rumours threatening or humiliating or taking money or other items from an individual.  Let’s look at some clues for a parent as to whether a child or young person with autism is being bullied.


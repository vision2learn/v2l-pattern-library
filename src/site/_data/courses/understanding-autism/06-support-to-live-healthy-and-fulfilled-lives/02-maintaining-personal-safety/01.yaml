title: Support to maintain personal safety
intro: |
  In this session you will learn about how to support individuals with autism to maintain their personal safety against bullying and exploitation and protect themselves from harm and abuse.
banner: ua_u6_s2_p1_safety.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * Factors that may compromise the personal safety of an individual with autism
      * Reasons why people with autism may be vulnerable to bullying and exploitation 
      * How to safeguard against the bullying and exploitation of individuals with autism
      * Strategies that individuals can use to protect themselves from harm and abuse 

  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to identify factors that may compromise the personal safety of an individual with autism.
  -
    title: Factors that may compromise the personal safety of an individual with autism
    theme: t-bg-primary
    copy: |
      Personal safety is a real concern for individuals with autism as most have difficulty communicating, understanding and identifying dangerous situations. Let’s look at some of the factors that may compromise personal safety.


    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Wandering off
          text: |
            Problems like wandering off can be common and can increase risks of being exposed to dangerous situations. Wandering off from a safe, supervised place is common, dangerous and puts tremendous stress on families. It may involve going to a favourite place like a park or train station, getting away from a noise, or avoiding something they are scared of like a dog.
          img: ua_u6_s2_p1_slide1.svg
        -
          title: Safety in the home
          text: |
            Safety can be important around the home with general appliances such as cookers and electric fires, which may be hot and can cause scalding or burns. Using electrical appliances and plugs, can have problems with electrocution such as using a hair dryer with wet hands. Using knives or scissors may cause danger to hands and fingers through cuts.
          img: ua_u6_s2_p1_slide2.svg
        -
          title: Safety outside
          text: |
            Using safety equipment like seatbelts in cars and making sure doors are locked when a vehicle is in traffic. The danger of open water such as being near ponds and lakes or swimming pools.
          img: ua_u6_s2_p1_slide3.svg
        -
          title: Sensory processing challenges
          text: |
            Many individuals with autism may have put themselves in unsafe situations due to sensory processing challenges. These may prevent them from feeling when something is too hot or too cold, or if an object is very sharp. They may not have the perception to understand what may pose a threat to the physical health when their sensory processing challenges put them at risk of danger.
          img: ua_u6_s2_p1_slide4.svg
        -
          title: Online security
          text: |
            Knowing what behaviour is appropriate online and how to use cameras on computers and tablets and phones safely. Realising the consequences of their online activity and signing up to things, and the proprieties of arranging to meet people through online chats and social media.
          img: ua_u6_s2_p1_slide5.svg

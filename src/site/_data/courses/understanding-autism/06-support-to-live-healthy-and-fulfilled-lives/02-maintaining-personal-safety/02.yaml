    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to outline strategies that individuals can use to protect themselves from harm and abuse.
  
  -
    title: Strategies that individuals can use to protect themselves from harm and abuse
    theme: t-bg-primary
    copy: |
      Let’s look at some of the abuse that individuals may need to protect themselves from.

    subInc: 
      type: reveal
      content:
        -
          title: Sexual abuse
          copy: |
            When they do not want to take part in a sexual activity or are not able to give consent because they may not understand what is happening.
          img: placeholder_icon.svg
        -
          title: Emotional abuse
          copy: |
            When people say bad things to them, and they hurt their feelings and making them feel frightened.
          img: placeholder_icon.svg
        -
          title: Financial abuse
          copy: |
            When someone takes money or things that belong to an individual or spends their money on things they do not want.
          img: placeholder_icon.svg
        -
          title: Domestic and institutional abuse and neglect
          copy: |
            When those who are supposed to support, care and look after an individual don’t do it properly and neglect their needs.
          img: placeholder_icon.svg

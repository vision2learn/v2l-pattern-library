    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to outline the rights of individuals with autism in relation to accessing services and facilities.
  -
  -
    title: The rights of individuals with autism in relation to accessing services and facilities
    theme: t-bg-primary
    copy: |
      We have already covered the rights of individuals with autism through various Acts and guidance in previous units but what do those rights actually mean in relation to accessing services and facilities.
    
    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Multi-agency strategy group
          text: |
            Each area in the country should have a multi-agency strategy group responsible for recognition, referral and diagnosis of children and young people. They should also provide access to the services that might be needed such as paediatricians, psychologists, speech and language therapists and social services. 
          img: placeholder_icon.svg
        -
          title: Local and national support organisations
          text: |
            Once an individual has received a diagnosis, information should be provided to prepare for the future and contact details should be given for local and national support organisations. It is the right of every individual with autism and their family to have access to these services and facilities when they need them in all aspects of their life.
          img: placeholder_icon.svg
    copy2: If you wish, you can take another look at the Acts and guidance in Unit 2 page 2.

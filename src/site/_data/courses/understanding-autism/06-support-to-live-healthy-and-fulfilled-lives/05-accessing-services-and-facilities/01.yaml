title: Accessing services and facilities
intro: |
  In this session you will learn about how to support individuals with autism to access services and facilities.
banner: ua_u6_s5_p1_services.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * Support an individual may need to access
      * Rights of individuals with autism in relation to accessing services and facilities 
      * Reasonable adjustments that could be made for individuals with autism
      * Support available for individuals and families from rights groups and community support organisations

  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to identify the support an individual may need to access:
      * healthcare
      * education and training
      * leisure services.
  -
    title: Support an individual may need to access
    theme: t-bg-primary
    copy: |
      Let’s look at the support an individual with autism may need to access.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Healthcare
          text: |
            Health and care settings aren’t always flexible enough to adapt to the needs of individuals with autism. Issues such as noisy waiting areas, and not being able to see the same GP or social worker, can make a stressful experience even more difficult.
          img: placeholder_icon.svg
        -
          title: Education and training
          text: |
            Education is a key part of every child’s life and a high proportion of children with autism attend mainstream schools. Opportunities for further education or training will vary across the country. Students at whatever level should always get the extra help and support they need.
          img: placeholder_icon.svg
        -
          title: Leisure services
          text: |
            Playing sport, visiting the theatre or cinema, and going to museums, can have so many benefits for an individual with autism. However, the needs of people with autism should be supported, for them to be able to fully appreciate the experience. Some providers of leisure facilities have begun working to become more accessible, introducing autism-friendly measures.
          img: placeholder_icon.svg
  -

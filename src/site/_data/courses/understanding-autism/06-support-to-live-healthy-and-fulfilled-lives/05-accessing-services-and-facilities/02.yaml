        Can you give three examples of reasonable adjustments that could be made for individuals with autism? 
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to outline the support available for individuals and families from rights groups and community support organisations.
  -
  -
    title: Support available from organisations
    theme: t-bg-primary
    copy: |
      Having a family member with autism can put a lot of strain on the rest of the family it but there is a wealth of support available, from many different sources, covering many different things a family might need help with.

      Let’s look at some of those sources that can offer help advice and support.
    subInc: 
      type: reveal
      content:
        -
          title: National Autistic Society
          copy: |
            For parents of autistic children, young autistic people and autistic adults.  Call: 0808 800 4104 

          img: ua_u6_s5_p2_reveal1.svg
        -
          title: Ambitious about Autism
          copy: |
            For autistic children and young people, their parents and carers.  Call: 020 8815 5444  E-mail: info@ambitiousaboutautism.org.uk

          img: ua_u6_s5_p2_reveal2.svg
        -
          title: School, college or workplace
          copy: |
            Find out what help is available by speaking to teachers or SENCO, student support services or HR in the workplace.
          img: ua_u6_s5_p2_reveal3.svg
        -
          title: Social media and forums
          copy: |
            Forums and social media can offer support with many people with experience sharing their stories. Groups run by autism charities and sites such as ‘healthtalk.org'.
          img: ua_u6_s5_p2_reveal4.svg
        -
          title: Facebook
          copy: |
            ‘National Autistic Society Facebook group’  ‘Ambitious about Autism Facebook group’  ‘Actually Autistic’, for autistic adults  and ‘Autism Research Trust’.

          img: ua_u6_s5_p2_reveal5.svg
        -
          title: Local support groups
          copy: |
            The assessment team that carried out a diagnosis should provide information on local support groups. Also search for local groups using the: ‘National Autistic Society services directory’ and ‘Autism support groups on the NHS website’.

          img: ua_u6_s5_p2_reveal6.svg
  -

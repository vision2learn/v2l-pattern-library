title: Reasonable adjustment and community support
intro: |
  On this page we will take a look at reasonable adjustments, and the support available for individuals and families from rights groups and community support organisations.
banner: ua_u6_s5_p2_adjustment_v2.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to give examples of reasonable adjustments that could be made for individuals with autism.
  -
    title: Reasonable adjustments that could be made for individuals with autism 
    theme: t-bg-primary
    copy: |
      Let’s look at some reasonable adjustments that can help individuals with autism.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Healthcare
          text: |
            In general healthcare provision, action plans informing the individual of what is happening, and when, can help the process of hospital visits. By knowing what to expect, this can help reduce anxiety levels and speed up the recovery process. For hospital stays, flexible visiting hours, supported mealtimes and overnight facilities for parents or carers, can help make the process easier and cause less challenging behaviour.
          img: ua_u6_s5_p2_slide1.svg
        -
          title: Education
          text: |
            Educational establishments should be prepared for the general needs of students or visitors with autism. Clearly signposted facilities, visual aids, sensory adjustments, space and a structured timetable, can help accommodate their needs. Also, flexibility for an individual should they need it.
          img: ua_u6_s5_p2_slide2.svg
        -
          title: Public places
          text: |
            Shops, banks, libraries, council offices and leisure facilities, can provide staff who are trained to help with the needs of autism. They can look at their facilities and address any sensory issues like flickering lights. They can have a procedure in place for when an issue occurs and provide visual aids to help an individual with their visit.
          img: ua_u6_s5_p2_slide3.svg
        -
          title: Employment
          text: |
            Employers and businesses can look at the needs of their individual employees and make the space they work in more suitable for their needs, with regards to facilities and sensory elements. Flexible working routines can accommodate any ‘timeouts’ that might be needed
          img: ua_u6_s5_p2_slide4.svg

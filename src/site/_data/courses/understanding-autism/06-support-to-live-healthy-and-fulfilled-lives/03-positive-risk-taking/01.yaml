    title: Quick quiz
    copy: 
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Supporting individuals with autism to take positive risks puts them more in control of their own lives. 
          answer: positive risks
        -
          sentence: Risk is a necessary and important part of life for everyone, but we need to think about how risk affects those with autism and manage this risk. 
          answer: manage
        -
          sentence: Carers can empower the individual to have a more fulfilling life through positive risk-taking.
          answer: empower
        -
          sentence: There is still a need for safeguarding or duty of care with all risks that may be taken.
          answer: safeguarding
    theme: i-quiz

    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to give reasons why individuals with autism may find these transitions difficult.
  -
    title: Why individuals with autism may find these transitions difficult
    theme: t-bg-primary
    copy: |
      Why individuals with autism may find these transitions difficult.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Understanding change
          text: |
            Being able to cope with life events and transitions that cause change depends on understanding why something is happening, what the underlying social rules are and having the coping strategies to overcome anxiety when things change unexpectedly. 
          img: placeholder_icon.svg
        -
          title: Comprehending change
          text: |
            Some individuals with autism may not have the communication skills and social understanding to comprehend why change is happening and the impact it will have on their lives.
          img: placeholder_icon.svg
        -
          title: Predicting consequences
          text: |
            Some individuals with autism may experience stress and anxiety when even minor changes in routine occur and to try to regain control of the situation may display rigid thinking and behaviour that is challenging. They may not understand cause and effect which can make predicting consequences difficult. 
          img: placeholder_icon.svg

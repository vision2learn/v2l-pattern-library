title: Support with transitions and life events
intro: |
  In this session you will learn about how to support individuals with transitions and life events.
banner: ua_u6_s4_p1_transitions.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * Life events and transitions that individuals may experience
      * Reasons why individuals with autism may find these transitions difficult 
      * Ways that individuals can be supported through transitions 
      * How to involve others in the transition process  

  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to identify a range of life events and transitions that individuals may experience.
  -
  -
    title: Life events and transitions
    theme: t-bg-primary
    copy: |
      Let’s look at some life events and transitions that individuals may experience.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Bereavement
          text: |
            People are affected by bereavement in different ways, and this is no different for individuals with autism. They might show significant changes in behaviour and they may behave differently to how someone would expect. Individuals may find it difficult to express their own feelings and struggle to understand the concept of death and loss and how to behave when someone dies. They will need time and space to express their feelings in a way that works for them.
          img: placeholder_icon.svg
        -
          title: Changes in care
          text: |
            A child with autism may have spent most of their childhood in the care of their parents at home but may find that when they reach the age of 18, they will transition into adult care. It’s a good idea for parents to start thinking about their future care when the child is around 14 or 15 getting them more involved when they are 16. They may also be going off to university who will take over their support needs.
          img: placeholder_icon.svg
        -
          title: Birth of a sibling
          text: |
            Preparing to welcome a new baby into a home can be an exciting and happy experience, but it can be a time of adjustment for older siblings especially when they have autism. They may need additional consideration, support and attention to assist them to cope with this dramatic change in their life, as they may feel scared that parents will have less time for them. They will also need to be prepared for the sensory changes that will inevitably happen.
          img: placeholder_icon.svg
        -
          title: Family breakup
          text: |
            Divorce is a very difficult transition for a family. Telling a child with autism, that their parents are getting a divorce should be done as soon as possible. Plans should be clearly made before they are told, so they have a clear idea of what their future holds. They should also have clear guidelines on any changes to their care and lifestyle so as to make any upheaval less dramatic.
          img: placeholder_icon.svg
        -
          title: Moving house or changing school
          text: |
            Moving house or changing schools may involve major and minor changes to an individual with autism. Their whole routine around which they day and life has been focused will change including their immediate surroundings. This can be very distressing and cause major sensory issues. It may also mean a life change in so much that the individual has to prepare to live independently.
          img: placeholder_icon.svg

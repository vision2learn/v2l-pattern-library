    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to identify ways that individuals can be supported through transitions.
  -
    title: Ways that individuals can be supported through transitions
    layout: media
    theme: t-bg-primary
    copy: |
      All individuals transition from one activity to another and from one setting to another every day, at home, school, or in the workplace. These may involve major transitions or minor transitions.

      Using strategies and different types of supports can help prepare children and adults to initiate and carry out a transitions and to demonstrate the appropriate behaviour relying less on prompting. 

    img: /images/svg/ua/ua_u6_s4_p2_image.svg

    copy: |
      In your assessment you will be required to identify positive aspects of living with autism.
  -
  -
    title: The positive aspects of living with autism 
    theme: t-bg-primary
    copy: |
      What are some of the positive aspects of living with autism? let’s look at these below.
    subInc: 
      type: reveal
      content:
        -
          title: Concentration
          copy: |
            Individuals often have good concentration levels.
          img: placeholder_icon.svg
        -
          title: Technical ability
          copy: |
            They may have advanced technical ability especially in IT.
          img: placeholder_icon.svg
        -
          title: Subject knowledge
          copy: |
            Subject knowledge may be extensive and highly detailed.
          img: placeholder_icon.svg
        -
          title: Persistence and reliability
          copy: |
            They may show persistence and determination to complete tasks at all costs.
          img: placeholder_icon.svg
        -
          title: Accuracy
          copy: |
            Attention to detail can help to produce accuracy
          img: placeholder_icon.svg

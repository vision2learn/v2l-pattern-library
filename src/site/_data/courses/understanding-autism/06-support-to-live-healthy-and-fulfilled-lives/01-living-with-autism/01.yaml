title: Welcome to Unit 6
intro: |
    ### Supporting individuals with autism to live healthy and fulfilled lives
    
    Welcome to the sixth unit of your Level 2 Certificate in Understanding children and young people's mental health.  This unit is all about how to support individuals with autism to achieve and live healthy lives. 

banner: placeholder.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit, you will cover the following criteria of your Level 2 Certificate in Understanding children and young people's mental health qualification.

      You will:

      1. Understand the experience of living with autism
      2. Know how to support individuals to maintain their personal safety
      3. Understand the purpose of positive risk-taking
      4. Know how to support individuals with transitions and life events
      5. Know how to support individuals to access services and facilities
      6. Know how to support individuals with employment

      [View the complete set of learning outcomes for this unit.](/pdfs/v2l_ua_learning_outcomes_u6.pdf)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      
      * The potential effects of living with autism on an individual’s, development and puberty, education, employment and life chances and access to services
      * The impact of family members of supporting a child, young person or and adult with autism

title: Supporting family members
intro: |
  On this page you will learn how family members can be supported to cope with behaviour that challenges.
banner: ua_u5_s3_p3_family.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to describe how family members can be supported to cope with behaviour that challenges.
  -
    title: How autism can affect family
    layout: media
    theme: 
    copy: |
      Having an autistic child or person in the family can cause a great deal of strain on their main carer as well as family members. The main carer might need to spend a lot of time helping and supporting them leaving less time for themselves or for family life. This can be very stressful and exhausting and can impact on the rest of the family and can affect relationships with each other. Siblings of an autistic child are more likely to be asked to manage their own feelings and needs, take on more household tasks, or postpone their own pleasures and may feel that their needs are being neglected or they feel left out. Adult siblings may also need to take on more and more responsibility for an autistic sibling as their parents are less able. If the individual displays challenging behaviour this can only make things worse. 

    img: /images/svg/ua/ua_u5_s3_p3_image.svg
  -
  -
    title: Support for family members
    theme: t-bg-primary
    copy: |
      let’s look at some ways family members can be supported to cope with behaviour that challenges.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Sibling responsibility
          text: |
            Individuals with autism may behave and respond better to a sibling than other members of the family putting excessive demands on them. Longterm consequences need to be considered regarding sibling dependency and the family must be aware of the impact this may have. The sibling should be able to have their own time and space to get on with their own interests so that they can lead their own life independently.
          img: ua_u5_s3_p3_slide1.svg
        -
          title: Parent or main carer
          text: |
            A parent or main carer’s own needs may vary on how much money they have, where they live, how supportive friends and family are and how many children they have. They may rely on family to take control at times of stress or may need external support such as respite care and behavioural management advice. Their own health needs are equally important, to be able to cope with the stresses of coping with challenging behaviour.
          img: ua_u5_s3_p3_slide2.svg
        -
          title: Other family member
          text: |
            Other family members may not be directly responsible for caring, but they will be affected by challenging behaviour. Their ‘normal’ family life will be disrupted, and they may feel powerless. A child they may have much responsibility placed on them and may feel unloved or forgotten about and may miss out on things. Other family members can help offering support and time to create a more normal life for them.
          img: ua_u5_s3_p3_slide3.svg
        -
          title: Partners of main carers
          text: |
            They may find their relationship under great pressure especially at time when behaviour is at its most challenging. Not only do they have the upset of the rest of the family to cope with they may feel neglected by their partner and feel guilty for feeling this. They should be able to find support from the wider family or friends who could maybe be available to talk or offer practical help.
          img: ua_u5_s3_p3_slide4.svg
  -

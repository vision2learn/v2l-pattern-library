sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * How an individual with autism behaviours can have an impact on them and others
      * Strategies that can be used in relation to behaviour that challenges 
      * Ways to support an individual who is anxious and struggling to contain their own behaviour 
      * How to support individuals to understand their behaviours in terms of events, feelings actions and consequences
      * How family members can be supported to cope with behaviour that challenges
      * Sources of support in relation to behaviours that challenge for the individual with autism and their family 


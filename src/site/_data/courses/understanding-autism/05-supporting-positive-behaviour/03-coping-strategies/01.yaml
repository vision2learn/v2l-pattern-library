title: Coping strategies
intro: |
  In this session you will learn about coping strategies that can be used to help support those who are impacted by autism behaviours.
banner: ua_u5_s3_p1_coping.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * How an individual with autism behaviours can have an impact on them and others
      * Strategies that can be used in relation to behaviour that challenges 
      * Ways to support an individual who is anxious and struggling to contain their own behaviour 
      * How to support individuals to understand their behaviours in terms of events, feelings actions and consequences
      * How family members can be supported to cope with behaviour that challenges
      * Sources of support in relation to behaviours that challenge for the individual with autism and their family 

  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to explain how an individual with autism’s behaviour can have an impact on them and others.
  -
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### How behaviours impact individuals with autism and others

      Let’s find out more about how an individual with autism behaviours can have an impact on them and others.
    video: ua_u5_s3_p1_impact_of_behaviour.mp4
  -
    title: Time to think
    theme: t-bg-primary3 i-think

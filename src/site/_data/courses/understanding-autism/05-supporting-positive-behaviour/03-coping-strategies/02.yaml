    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to describe how to support individuals to understand their behaviour in terms of:
      * events and feelings leading up to it
      * their actions
      * the consequences of their behaviour.
  -
  -
    title: When an individual is anxious and struggling to contain their behaviour
    layout: media
    theme: t-bg-primary
    copy: |
      Anxiety in individuals with autism should always be calmed where possible by using different tools and strategies. Building time for relaxation into any routine and using calming music or stress balls can help a person feel calmer. Doing something they like that incorporates their interests like playing on a computer, reading, doing puzzles or walking can help to relieve stress and make an individual with autism able to cope with something that might cause a meltdown.

    img: /images/svg/placeholder_icon.svg

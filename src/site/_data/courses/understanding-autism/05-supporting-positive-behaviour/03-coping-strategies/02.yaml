  -
    title: Stressful behaviours
    theme: t-bg-primary
    copy: |
      Some individuals with autism may behave in way that puts a lot of strain on a family. Some of these behaviours can be particularly distressing to themselves as well as to others. These can include ‘Stimming’ a kind of repetitive behaviour and ‘Meltdowns’ a complete loss of control.

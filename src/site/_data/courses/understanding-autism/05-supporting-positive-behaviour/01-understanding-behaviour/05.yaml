title: What did you learn? 
intro: Well done, you’ve now completed the first session of this unit! 
banner: ba-u1-s1-p6.jpg
sections:
  -
    title: Summary
    theme: t-bg-primary i-summary
    copy: |
      In this session, you have learnt about:
      * Why an individual’s behaviours may need to be considered
      * How behaviours may influence the way individuals with autism interact with others
      * How the behaviour of others may impact on an individual with autism
      * Why individuals with autism may find changes to their routine distressing
      * Strategies that can be used to support individuals to cope with changes to routine and structure
      * Approaches that can be used to reduce prompt dependency in individuals with autism
  
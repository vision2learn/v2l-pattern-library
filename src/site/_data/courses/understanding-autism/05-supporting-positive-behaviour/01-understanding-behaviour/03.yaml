    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to outline strategies that can be used to support individuals to cope with changes to routine and structure.
  -
  -
    title: Strategies to cope with Change
    layout: media
    theme: t-bg-primary
    copy: |
      As we know life doesn’t always stay the same for everyone and change can be exciting, but it can also be a stressful and anxious time. This can be especially challenging when there is an autistic member of the family. Changes in familiar activities, places or people can be upsetting for individuals with autism and planning and preparing for expected and unexpected changes to routines can always be helpful. 
      
      If a major change is inevitable then individuals with autism can be helped and guided through the process by using a range of strategies to prepare them for and support them through those changes.

    img: /images/svg/placeholder_icon.svg

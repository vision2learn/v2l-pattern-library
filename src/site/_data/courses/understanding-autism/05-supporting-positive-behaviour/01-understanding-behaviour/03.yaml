title: Change and strategies
intro: |
  Let’s learn more about change and what strategies can be used to cope with the effects of change.
banner: ua_u5_s1_p3_change.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to explain why individuals with autism may find changes to their routine distressing.
  -
    title: Changes to routines that may affect
    theme: t-bg-primary
    copy: |
      Let’s look at some of the changes that may affect individuals with autism.

    subInc: 
      type: reveal
      content:
        -
          title: Physical environment
          copy: |
            Changes to the physical environment such as the layout of furniture in a room.
          img: ua_u5_s1_p3_reveal1.svg
        -
          title: New faces
          copy: |
            The presence of new people or absence of familiar ones can be difficult to manage.
          img: ua_u5_s1_p3_reveal2.svg
        -
          title: Change in surroundings
          copy: |
            Big upheavals like going on holiday, changing schools or moving to a new house can cause anxiety.
          img: ua_u5_s1_p3_reveal3.svg
        -
          title: Daily routine
          copy: |
            Changes to a daily routine such as meals times or routes to school or work.
          img: ua_u5_s1_p3_reveal4.svg
        -
          title: Cancelling activities
          copy: |
            Not being able to go somewhere because of bad weather.
          img: ua_u5_s1_p3_reveal5.svg
        -
          title: Unexpected changes
          copy: |
            Unexpected changes are often most difficult to deal with.
          img: ua_u5_s1_p3_reveal6.svg

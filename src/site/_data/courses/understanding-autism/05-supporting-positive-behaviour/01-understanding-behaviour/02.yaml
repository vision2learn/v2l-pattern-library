title: Understanding behaviour
intro: |
  In this session you will learn why behaviours need to be considered within the context of autism.
banner: ua_u5_s1_p2_understanding.jpg
sections:
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to explain:
      * why an individual’s behaviours may need to be considered within the context of autism
      * how these behaviours may influence the way individuals with autism interact with others.
  -
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      Please see the following video on understanding behaviour within the context of autism.
    video: ua_u5_s1_p2_understanding_behaviour.mp4
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        Make a note of how the behaviours of individuals with autism might influence how they interact with others? 
  -
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to explain how the behaviour of others may impact on an individual with autism.
  -
  -
    title: On the web
    theme: t-bg-secondary2 i-on-web
    include:
      type: on-the-web
      copy: |
        Please see the National Autistic Society website where you can learn more about behaviour.

      links:
        Autistic behaviour: https://www.autism.org.uk/advice-and-guidance/topics/behaviour
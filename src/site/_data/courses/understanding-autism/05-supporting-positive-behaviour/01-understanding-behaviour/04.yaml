  -
  -
    title: Obsessions and special interests
    theme: t-bg-primary
    copy: |
      Many individuals with autism have routines, rituals, obsessions and special interests. This behaviour helps them feel less stressed and better able to cope with their surroundings some may have them all, others just one or two.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Rituals
          text: |
            Some have rituals like keeping a favourite object in a specific place, and then getting it out to touch at specific times to touch. Others may only drink from a specific cup or eat from a specific plate. 
          img: ua_u5_s1_p4_slide1.svg
        -
          title: Routimes
          text: |
            Daily routines are very important so that they know what is going to happen every day. They might like to eat the same breakfast, leave at the same time and travel the same way, every day and if this is not possible will get upset. 
          img: ua_u5_s1_p4_slide2.svg

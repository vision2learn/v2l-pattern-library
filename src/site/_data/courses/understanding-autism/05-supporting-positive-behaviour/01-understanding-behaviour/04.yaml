  -
    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      ### Special interest

      Being autistic doesn’t mean that an individual can’t have an interesting life and highly successful career. There are many celebrities who are on the autistic spectrum and have special interests that have help to launch them into a high profile career.
      
      Let’s look at someone who has used their special interests to do just that.
    subInc: 
      type: accordion
      content:
        - 
          title: Dan Aykroyd
          copy: |
            Dan was born in Canada and since childhood, struggled with symptoms of Tourette's syndrome and Asperger syndrome. He found education challenging being expelled from schools and dropping out of university before completing his degree in criminology and sociology. 

            He then started working in night clubs as a comedian. He was on the cast of Saturday Night Live for its first four seasons, 1975-1979, receiving an Emmy for his writing on the show in 1977.

            He was diagnosed with Asperger's in the 1980’s and he credits his Asperger's as the reason why he created Ghostbusters. Dan said that one of his symptoms of autism spectrum disorder was his obsession with ghosts and law enforcement. He was obsessed by Hans Holzer ‘the greatest ghost hunter ever’ and this was where his idea for ‘Ghostbusters’ started.

            He would also carry around a police badge and his obsession for law enforcement and his knowledge of criminology also helped with creating ‘Blues Brothers' with his friend John Belushi.

            Dan has never permitted his medical challenges to stand in his way, and his dedication to following his special interests and dreams has led him to a career as actor, producer, comedian, musician, and filmmaker.

          img: /images/svg/ua/ua_u5_s1_p4_case_study.svg
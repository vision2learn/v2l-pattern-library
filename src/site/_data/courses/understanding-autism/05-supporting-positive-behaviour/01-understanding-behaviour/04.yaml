title: Prompt dependencies and obsessions
intro: |
  Let’s look at prompt dependency and what approaches can be used to reduce prompt dependency in individuals with autism.
banner: ua_u5_s1_p4_prompt.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to outline the approaches that can be used to reduce prompt dependency in individuals with autism.
  -
    title: Prompt dependency
    layout: media
    theme: t-bg-primary
    copy: |
      Prompt dependency is a type of behaviour where an individual relies on being told what to do by a parent or caregiver. It becomes a problem when the individual knows exactly what to do but is still waiting for the prompt before taking action. Being dependent on prompts can make it difficult or impossible for them to do things by themselves and in extreme cases even something as necessary as eating or going to the bathroom might not be possible without being prompted to do so.
    img: /images/svg/ua/ua_u5_s1_p4_image.svg

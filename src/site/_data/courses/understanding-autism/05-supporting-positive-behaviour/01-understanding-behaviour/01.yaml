title: Welcome to Unit 5
intro: |
    ### Supporting positive behaviour in individuals with autism
    
    Welcome to the fifth unit of your Level 2 Certificate in Understanding autism.  This unit is all about how to support positive behaviour in individuals with autism.

banner: placeholder.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit, you will cover the following criteria of your Level 2 Certificate in Understanding autism qualification.

      You will:

      1. one
      2. two
      3. three

      [View the complete set of learning outcomes for this unit.](/pdfs/)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      
      * Why an individual’s behaviours may need to be considered
      * How behaviours may influence the way individuals with autism interact with others
      * How the behaviour of others may impact on an individual with autism
      * Why individuals with autism may find changes to their routine distressing
      * Strategies that can be used to support individuals to cope with changes to routine and structure
      * Approaches that can be used to reduce prompt dependency in individuals with autism

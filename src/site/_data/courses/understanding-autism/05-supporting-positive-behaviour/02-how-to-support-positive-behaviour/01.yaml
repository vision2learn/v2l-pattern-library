title: How to support postive behaviour
intro: |
  In this session we are going to explore behaviour and look at how positive behaviour can be supported in individuals with autism.
banner: ua_u5_s2_p1_positive.jpg
sections:
  -
    title: What you will learn
    theme: t-bg-primary
    copy: |
      In this session you will learn about:
      * How behaviour can be interpreted as a form of expression
      * Factors that may be associated with behaviour that challenges
      * The advantages and disadvantages of using proactive strategies and reactive strategies to support positive behaviour
      * The importance of positive reinforcement 
      * Approaches that could be used to support positive behaviour

  -

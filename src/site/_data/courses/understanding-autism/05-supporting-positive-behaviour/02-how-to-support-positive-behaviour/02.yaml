  -
    title: Approaches that could be used to support positive behaviour
    theme: t-bg-primary
    copy: |
      The overall aim of Positive Behaviour Support is to provide right support for a person, their family and friends to help people lead a meaningful life and learn new skills without unnecessary restrictions. It is not simply about getting rid of problematic behaviour, it is based on manipulating or changing what is going on before or after the behaviour occurs, to prevent it from occurring, or to stop that behaviour working for the individual.

      Let’s look at approaches that can be used with individuals with autism to support positive behaviour

    subInc: 
      type: reveal
      content:
        -
          title: Celebrate strengths
          copy: |
            Celebrate and build on their strengths and successes and letting them know what they do well.
          img: placeholder_icon.svg
        -
          title: Respect
          copy: |
            They should be respected and listen to verbally or via communication through their choices or actions.
          img: placeholder_icon.svg
        -
          title: Validate concerns
          copy: |
            Validate their concerns and emotions and don’t brush aside any fears they may have.
          img: placeholder_icon.svg

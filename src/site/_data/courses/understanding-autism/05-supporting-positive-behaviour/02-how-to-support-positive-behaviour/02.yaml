title: Proactive and reactive strategies 
intro: |
  Let’s look at the advantages and disadvantages of using proactive strategies and reactive strategies to support positive behaviour in individuals with autism.
banner: ua_u5_s2_p2_proactive.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to outline the advantages and disadvantages of using proactive strategies and reactive strategies to support positive behaviour in individuals with autism.
  -
    title: Advantages and disadvantages
    theme: t-bg-primary
    copy: |
      What are proactive and reactive strategies?

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Proactive strategies - advantages
          text: |
            Proactive strategies are intended to make sure the individual with autism has got what they need and want on a day-to-day basis. It also includes the ways to teach the individual appropriate communication, behaviour and life skills. Proactive Strategies include visual supports, transitional warnings, clear and simple instructions, choices, descriptive praise or positive attention and rewards. Proactive strategies clarify expectations and promote learning and positive behaviours and help to provide a more stable environment.
          img: placeholder_icon.svg
        -
          title: Proactive strategies - disadvantages
          text: |
            The disadvantage of using proactive strategies could be a potential risk to creating problems and disruption where there previously was none before. Parents, carers or support workers may become anxious and the individual with autism may detect the measures being put in place to support the reduction of their behaviour that challenges and in turn may act to challenge that, making matters worse.
          img: placeholder_icon.svg
        -
          title: Reactive strategies - advantages
          text: |
            Reactive strategies are designed to keep the individual with autism and those around them safe from harm.They provide a way to react quickly in a situation where the person is distressed or anxious and more likely to display challenging behaviour. Reactive strategies may include some form of restraining if necessary but should focus on ‘planned ignoring’, redirection and praising, and rewarding desired behaviour.
          img: placeholder_icon.svg
        -
          title: Reactive strategies - disadvantages
          text: |
            The disadvantages of using reactive strategies can mean that by trying to keep individuals safe from harm and trying to prevent damage to others, some form of restraining may in turn risk traumatising or injuring them or draw extra attention to the individual which they might repeat to seek the attention again. Frustration can be compounded if the correct communication method is not used.
          img: placeholder_icon.svg
  -

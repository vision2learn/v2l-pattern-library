title: Proactive and reactive strategies 
intro: |
  Let’s look at the advantages and disadvantages of using proactive strategies and reactive strategies to support positive behaviour in individuals with autism.
banner: ua_u5_s2_p2_proactive.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to outline the advantages and disadvantages of using proactive strategies and reactive strategies to support positive behaviour in individuals with autism.
  -
    title: Advantages and disadvantages
    theme: t-bg-primary
    copy: |
      What are proactive and reactive strategies?

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Proactive strategies - advantages
          text: |
            Proactive strategies are intended to make sure that individuals needs and wants are met on a day to day basis. It also includes ways to teach the individuals appropriate communication, behaviour and life skills. 
            
            Proactive strategies include the use of visual supports, transitional warnings, clear and simple instructions, involvement in choices, descriptive praise or positive attention and rewards. 
            
            Proactive strategies clarify expectations and promote learning and positive behaviours, and help to provide a more stable environment.
          img: placeholder_icon.svg
        -
          title: Proactive strategies - disadvantages
          text: |
            The disadvantages of using proactive strategies, is the potential risk of creating problems and disruption where there previously were none. 
            
            Parents, carers or support workers may become anxious and the individual with autism may detect the support measures being put in place and react negatively making matters worse.
          img: placeholder_icon.svg
        -
          title: Reactive strategies - advantages
          text: |
            Reactive strategies are designed to keep the individual with autism and those around them safe from harm. They provide a way to react quickly in a situation where the person is distressed or anxious and is likely to display challenging behaviour. 
            
            Reactive strategies may include some form of restraint but, first and foremost, should focus on ‘planned ignoring’, redirection, and praising and rewarding positive behaviour.
          img: placeholder_icon.svg
        -
          title: Reactive strategies - disadvantages
          text: |
            The disadvantages of using reactive strategies are that, by trying to keep individuals from harming themselves and others, the use of restraining methods may in turn risk traumatising, injuring or drawing extra attention to the individual. This can potentially lead to the individual seeking further attention. 
            
            Frustration for the individual can also be compounded if the correct communication methods are not used.
          img: placeholder_icon.svg
  -

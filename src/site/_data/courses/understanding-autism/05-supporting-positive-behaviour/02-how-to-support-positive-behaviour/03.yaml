  -
    title: Quick quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Positive behaviours that are desirable are recognised and reinforced.
          answer: recognised
        -
          sentence: A care worker would maintain a positive demeanour which would encourage the individual with autism to mirror the behaviour and reduce their anxiety.
          answer: positive demeanour
        -
          sentence: To reinforce and encourage further positive behaviour, rewards may be given to the individual with autism.
          answer: rewards
    theme: i-quiz

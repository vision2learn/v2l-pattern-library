title: Welcome to Unit two
intro: |
    ### Using a person-centred approach to support individuals with autism
    
    Welcome to the second unit of your Level 2 Certificate in Understanding autism.  This unit is all about using a person-centred approach to support individuals with autism.

banner: ua_u2_s1_p1_person-centred.jpg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit, you will cover the following criteria of your Level 2 Certificate in Understanding autism qualification.

      You will:

      1. Know how legislation and guidance underpins support for individuals with autism
      2. Understand how to support individuals with autism using a person-centred approach

      [View the complete set of learning outcomes for this unit.](/pdfs/v2l_ua_learning_outcomes_u2.pdf)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about:
      
      * What legislation and guidance relates Autism
      * How legislation and guidance underpins support for individuals with autism

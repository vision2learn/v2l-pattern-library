    title: Quick quiz
    copy: 
    subInc: 
      type: word-quiz
      content:
        -
          sentence: The Autism Act was the first ever disability specific legislation to be passed in the UK.
          answer: Autism Act
        -
          sentence: The Human Rights Act sets out the fundamental rights and freedoms that everyone in the UK is entitled to. 
          answer: Human Rights Act
        -
          sentence: The Care Act gives guidance and supports local authorities and the NHS.
          answer: Care Act
        -
          sentence: The Equality Act makes clear what public, private and voluntary sectors must legally do to ensure that people with protected characteristics such as a learning disability are not disadvantaged.

          answer: Equality Act
    theme: i-quiz
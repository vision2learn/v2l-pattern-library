  -
    title: Case study
    theme: t-bg-primary1a i-case-study
    copy: |
      ### Case study - Personalisation and needs led approach

      Personalisation means approaching support services in an entirely different way by looking at the individuals strengths, preferences and aspirations and putting them at the centre of the process, and making choices that reflect those preferences and needs. The traditional service-led approach has often meant that individuals with autism have not received the right help at the right time and have been unable to shape the kind of support they need. 
      
      Personalisation means everyone has access to the right information, advice and advocacy to make good decisions about the support they need and are able to access universal services such as transport, leisure and education, housing and health services and opportunities for employment.

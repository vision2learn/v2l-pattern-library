title: Promoting the rights of individuals with Autism
intro: |
  Let’s look at the rights of individuals with Autism and how they can be promoted to help improve understanding. 
banner: ua_u2_s2_p2_rights.jpg
sections:
  -
    title: The rights of individuals with autism 
    layout: media
    theme: t-bg-primary
    copy: |
      Legislation and guidance as we have discussed previously support the rights and best interests of people with autism but how can these rights be promoted to the wider public. Rights include independence, individuality, making own choices, fair and equal treatment, respect and dignity. Individuals with Autism and their families express that increasing public understanding of autism is the most important thing alongside improving social care, education and access to diagnosis. 

    img: /images/svg/ua/ua_u2_s2_p2_image.svg
  -
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to give examples of how the rights of individuals with autism can be promoted.
  -
    title: Promoting the rights of individuals with autism
    theme: t-bg-primary
    copy: |
      By promoting the rights of individuals with autism in everyday situations, using high profile ways such as campaigns and films, people can helped to increase their understanding.

      The National Autistic Society set about doing this by creating a range of campaigns to inform about the rights of people with Autism to be accepted and understood. Let’s look at a few campaigns that have endeavoured to do this.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: ‘Too Much Information’ campaign
          text: |
            This campaign set out to challenge myths, misconceptions and stereotypes. This campaign ran for three years from 2015-2018 to help give the public a better understanding of autism and the rights of individuals. It focused on different  things such as extra time needed to process information, the anxiety felt in social situations and with unexpected changes. Also sensitivity to noise, smells and bright lights and how these can become overwhelming.
          img: ua_u2_s2_p2_slide1.svg
        -
          title: Autism Hour
          text: |
            This was launched in 2017 to encourage more businesses and public spaces to make small changes to become more autism friendly. This campaign supported the rights of individuals with Autism to be able to use any space without being asked to leave because of behaviour associated with their needs. The small changes like lowering background noise, dimming lights, educating staff and sharing information with the public can help even if this is just for an hour.
          img: ua_u2_s2_p2_slide2.svg
        -
          title: Autism Friendly Award
          text: |
            This award is given to premises that make sure autistic visitors receive the same welcome as everyone else. Small changes can make a massive difference to autistic visitors and just a little understanding can go a long way.
          img: ua_u2_s2_p2_slide3.svg
        -
          title: Not Enough
          text: |
            The ‘not enough’ campaign demands better support and services for autistic people and families across the country because things haven’t improved enough since the 2009 Autism act promised changes.
          img: ua_u2_s2_p2_slide4.svg

title: Confidentiality
intro: |
  Let's look at the principles of confidentiality in relation to supporting individuals with autism.
banner: placeholder.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to outline the principles of confidentiality in relation to supporting individuals with autism.
  -
    title: Reveals
    theme: t-bg-primary
    copy: |
      Select the images below to learn more about the principles.

    subInc: 
      type: reveal
      content:
        -
          title: Kept confidential
          copy: |
            All confidential information must be kept confidential.
          img: placeholder_icon.svg
        -
          title: Permission
          copy: |
            Confidential Information will not be disclosed about an individual to anyone else without their permission.
          img: placeholder_icon.svg
        -
          title: Legal duty
          copy: |
            Confidential information is only shared when required by law and there is a legal duty to make a disclosure.
          img: placeholder_icon.svg
        -
          title: Prevent serious harm
          copy: |
            Confidential information is only shared when it is necessary in order to prevent serious harm to the individual or someone else.
          img: placeholder_icon.svg
        -
          title: Valid reason
          copy: |
            There must be a valid reason for confidential information to be disclosed without permission
          img: placeholder_icon.svg
  -
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      _Presentation style - short video - discussion_
      
      Let’s now listen to a discussion on the importance of confidentiality in relation to supporting individuals with Autism.
    video: placeholder_pc.mp4

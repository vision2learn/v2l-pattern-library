title: What did you learn? 
intro: Well done, you’ve now completed the second session of Understanding autism Level 2.
banner: ba-u1-s1-p6.jpg
sections:
  -
    title: Summary
    theme: t-bg-primary i-summary
    copy: |
      In this session, you have learnt about:
      * Person-centred support
      * Treating the person with autism as an individual
      * Compassionate and non-judgemental support           
      * Promoting the rights of individuals with autism.                                            
      * Incorporating the preferences and needs of individuals  
      * Importance of working with each individual’s strengths and abilities
      * The contribution of informal networks                                                                  
      * Working in partnership with the individual and others                                                   
      * The principles of confidentiality

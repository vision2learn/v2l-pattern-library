title: Informal networks
intro: |
  Let’s look at informal networks and how they can help to support individuals with autism and their families.
banner: ua_u2_s2_p3_informal.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to give examples of the contribution that informal networks can make to supporting individuals with autism and their families.
  -
    title: Informal support networks
    layout: media
    theme: t-bg-primary
    copy: |
      Informal support networks are the people who offer help and assistance to each other in daily life. This could be parents, siblings, other family members, friends, colleagues, neighbours and other people in the community. Informal support can include emotional support, physical assistance, role models, joining a group, club or activity and anything that will help a person, have a richer life. 

    img: /images/svg/placeholder_icon.svg

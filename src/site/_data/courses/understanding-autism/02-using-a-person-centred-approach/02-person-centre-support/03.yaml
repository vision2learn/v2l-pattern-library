title: Informal networks
intro: |
  Let’s look at informal networks and how they can help to support individuals with autism and their families.
banner: ua_u2_s2_p3_informal.jpg
sections:
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      In your assessment you will be required to give examples of the contribution that informal networks can make to supporting individuals with autism and their families.
  -
    title: Informal support networks
    layout: media
    theme: t-bg-primary
    copy: |
      Informal support networks are the people who offer help and assistance to each other in daily life. This could be parents, siblings, other family members, friends, colleagues, neighbours and other people in the community. Informal support can include emotional support, physical assistance, role models, joining a group, club or activity and anything that will help a person, have a richer life. 

    img: /images/svg/ua/ua_u2_s2_p3_image.svg
  -
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      Let’s look at a video on how informal networks can support individuals with Autism and their families. 
    video: ua_u2_s2_p3_informal_networks.mp4
  -
    title: Quick quiz
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        Is the following statement true or false? "Informal support networks are the people who offer help and assistance to each other in daily life.":
          answers:
            True: true
            False: false
        If someone has an autistic child or children, who can become key parts of their informal support network?:
          answers:
            Hospital doctors: false
            School teachers: false
            Extended family and friends: true
        Select one option to complete the following sentence:"_______________ usually happen because people aren’t sure how to respond, don’t understand or feel uncomfortable. ":
          answers:
            Informal support: false
            Positive responces: false
            Unhelpful reactions: true
  -
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      In your assessment you will be required to explain the importance of working in partnership with the individual and others.
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Interview with professionals / Key workers

      Supporting an Individual with autism is a collaborative process which involves effective partnerships between professionals, families and the individual where possible. These partnerships can involve a range of different people including friends & family, carers, healthcare professionals and social workers.

      Please see the following interview video of professionals' responces to the following question:

      What would you say are the benefits of partnerships and close working relationships with others, professional or otherwise when supporting individuals with autism?
    video: ua_u2_s2_p3_interview_partnerships.mp4
  -
  -
    title: Watch
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Interview with professionals / Key workers
      
      Please see the following interview video of professionals' responces to the following question:
      
      From your perspective, what other people professional or otherwise have you been involved with whilst supporting autistic individuals?
    video: ua_u2_s2_p3_interview_supporting.mp4
  -
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: |
        Working in partnership with the individual and others is important, can you explain why? 
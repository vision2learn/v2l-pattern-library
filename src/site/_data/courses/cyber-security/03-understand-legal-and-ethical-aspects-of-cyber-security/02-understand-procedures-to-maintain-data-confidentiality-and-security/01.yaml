      ### Protecting stored data
      Stored Data needs to be protected from not only the hackers but also should be kept safe in case the computer system is lost or suffers damage. Fireproof and waterproof cabinets can help to protect computer equipment and physical storage devices.
      
      Let's look at some different ways in which data can be stored and protected.


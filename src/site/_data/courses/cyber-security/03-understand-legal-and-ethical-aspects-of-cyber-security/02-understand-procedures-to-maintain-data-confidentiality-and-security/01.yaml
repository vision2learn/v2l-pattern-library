    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      Make sure that you understand the different types of encryption and the what is meant by data in transit and data at rest.
  -
    title: Encryption
    theme: t-bg-primary
    copy: |
      let's look at the two basic techniques for encrypting information and the advantages and disadvantages of each.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Symmetric key encryption
          text: |
            Symmetric encryption works by using a single key that is shared with the person you want to be able to decrypt and re-encrypt data you share between you. This is useful when communicating over a potentially unsecure channel. It is a lot quicker in the way it encrypts and decrypts and quicker to implement however it relies on the fact that you must trust the other person and if they share this key then effectively anyone can now access your encrypted data.
          img: cs_u3_s2_p1_slide1.svg
        -
          title: Asymmetric key encryption
          text: |
            Asymmetric Encryption works by having a public key and a private key. Only the private key can encrypt the data and only the public key can decrypt the data. The public key is distributed widely and can be given to semi-trusted entities. The private key however, as the name suggests, must be kept private. An example of this is HTTPS the protocol that the internet works on. The ‘S” refers to TLS which is an asymmetric encryption where only the server of the website has the private her and public keys are embedded in your browser to decrypt the data. The downfall of asymmetric encryption is that it’s more operationally intensive for computers to process and takes longer, and is more complex to set up.
          img: cs_u3_s2_p1_slide2.svg

  -
    title: Data states
    theme: t-bg-supporting3
    copy: |
      States of data is a way of categorizing structured and unstructured data. The three states of data are data at rest, data in motion and data in use. Data can change states quickly and frequently, or it may remain in a single state for the entire life cycle of a computer. Understanding the characteristics and differences between data states can help organizations handle sensitive information more securely.

      See below to learn more about 
    subInc: 
      type: accordion
      content:
        - 
          title: Data in transit
          copy: |
            Data in Transit or data in motion is data that is actively moving from one location to another which could be around a private network or across the internet. Protection of data in transit is important as it moves from network to network or storage device to the cloud as it is often considered less secure whilst in transit
          img: cs/cs_u3_s2_p1_accordian1.svg
        - 
          title: Data at rest
          copy: |
            Data at Rest is data that is not actively moving from network to network or device to device. It may be being stored on a hard drive, digital device or flash drive or archived in some other way. Data at rest is often though of as less vulnerable than data in transit.

            Unprotected Data whether in transit or at rest is vulnerable to attack without good encryption.

          img: cs/cs_u3_s2_p1_accordian2.svg 

  -
  
    title: Security Checks
    layout: media
    theme: t-bg-primary1a
    copy: |
      ### What security checks might an organisation undertake before releasing information?

      Before sharing data with third parties organisations will carry out due diligence checks which involves reviewing the personal data that has been received from external sources to confirm the data is accurate and the source of the data is known. They will also review the personal data that is shared with external sources and identify what it will be used for and who will have access to the data.  
      
      
      Other checks that can be implemented are 'Authentication and authorisation' This is an important part of granting access to an application or system. Authentication is “is this person who they say they are” an example of this is is the password they have provided the password we have on record for them therefore providing they are who they say they are. The next step is authorisation. Now we have proved they are this person, does this person have the right permissions to access what it is they’re trying to access.

      
    img: cs/cs_u3_s2_p1_image.svg


title: Welcome to Unit three
intro: |
    In unit 3 you will learn about the key legislation related to cyber security and how to maintain data confidentiality and security. You will also gain understanding about ethical and unethical conduct within cyber security.. 
    
    By working through this unit you will gain the knowledge and understanding required to be able to meet the learning outcomes in your learning goals.


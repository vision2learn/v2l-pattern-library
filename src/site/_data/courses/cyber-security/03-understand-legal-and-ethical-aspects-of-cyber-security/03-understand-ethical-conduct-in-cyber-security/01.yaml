title: Understand ethical conduct in cyber security
intro: |
    In this session you will learn about:
    * Ethical and unethical conduct within cyber security.
banner: cs_u3_s3_p1_ethical_conduct.jpeg
sections:
  -
    title: Your learning goals
    theme: t-bg-primary
    copy: |
        By working through this session, you will cover the following criteria of your Level 2 Certificate in the Principles of Cyber Security -  

        1. Describe ethical conduct within cyber security
        2. Describe unethical conduct within cyber security

  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      Make sure that you understand the difference between ethical and unethical conduct.
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### What is ethical and unethical conduct?
      A company's values are only as strong as those of it's employees. That's why employees need to take on their company's values making them part of every action and decision. This is particularly important with regards to cyber security. Having cyber security policies are one way of protecting those values and reducing risks, laying out clear ethical guidelines for employees to follow. 
      The best thing would be if everyone in the company believed in those policies and automatically shared those values without having to refer to guidelines.

      Let's have a look at ethical and unethical conduct with regards to cyber security.
    video: cs_u3_s3_p1_ethical_and_unethical.mp4
   

title: Welcome to Unit three
intro: |
    In unit 3 you will learn about the key legislation related to cyber security and how to maintain data confidentiality and security. You will also gain understanding about ethical and unethical conduct within cyber security. 
    
    By working through this unit you will gain the knowledge and understanding required to be able to meet the learning outcomes in your learning goals.

banner: cs_u1_s1_p1_welcome.jpg

sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit, you will cover the following criteria of your Level 2 Certificate in the Principles of Cyber Security.

      You will:

      1. Understand key legislation related to cyber security
      2. Understand procedures to maintain data confidentiality and security
      3. Understand ethical conduct in cyber security
      
      [View the complete set of learning outcomes for this unit.](/pdfs/v2l_it2_learning_outcomes_u2.pdf)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about the following:
      * current legislation related to cyber security and how it affects an individual, business and a nation. 


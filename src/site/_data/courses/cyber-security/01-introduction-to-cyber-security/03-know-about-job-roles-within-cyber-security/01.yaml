title: Know about job roles within cyber security
intro: |
    In this session you will learn about the role of key organisations in the cyber security industry and the job functions and key skill requirements needed to be a cyber security professional. You will also learn about different types of ‘hackers’:
banner: BA_U1_S3_p1_Communication.svg
sections:
  -
    title: Your learning goals
    theme: t-bg-primary
    copy: |
        By working through this session, you will cover the following criteria of your Level 2 Certificate in the Principles of Cyber Security -  

        1. Describe the role of key organisations in the cyber security industry
        2. Identify general job functions carried out by cyber security professionals
        3. Define the term ‘hacking’
        4. Explain the differences between 'white-hat', 'black-hat', 'grey-hat' hackers
        5. Identify the key skills requirements of a cyber security professional
  -
    title: The role of key organisations in the Cyber Security Industry.
    theme: t-bg-supporting2
    copy: |
      Cyber security affects us all in some way and it is important that government and the cyber security industry works together to protect individuals, business and all citizens and their well being from the threat of cyber attack. The UK government has taken on a leading role in protecting both the public and private sectors.
      Many businesses do not understand the extent of the risk to which they are exposed and don't realise how cyber crime affects them directly not just as part of the overall national economy.

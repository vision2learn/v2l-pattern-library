  -
    title: General Job Functions carried out by cyber security professionals.
    theme: t-bg-primary
    copy: |
      Cyber security is one of the most important roles in the fast growing technology industries. As cyber criminals and hackers become more sophisticated and ruthless, the need for equally talented cyber security specialists is increasing and specialists in cyber security are very sought after. 
      
      The cyber security profession can be entered at school leaver level as well as at graduate level. Graduates will probably have a degree related to computer science or a STEM subject ( Science, Technology, Engineering or Mathematics). Some employers also run apprenticeships in cyber security so school leavers can work and train at the same time.
      Cybersecurity professionals are responsible for protecting IT infrastructure, networks, and data and are often responsible for preventing data breaches and monitoring and reacting to attacks.
  -
    title: Job functions
    theme: t-bg-primary
    copy: |
      scroll trhough the slides to find out about the different job functions a cyber security specialist will carry out ...

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: 
          text: |
            * Working to build in security at the development stages of software and hardware systems, networks and data banks. 
            * Setting up and implementing user access controls and identity and access management systems.
            * Looking for vulnerabilities and assessing risks in hardware and software systems.
            * Building firewalls into network infrastructures and monitoring for attacks and intrusions.
            * Finding the best way to secure an organisations IT infrastructure and addressing any potential threats.

          img: cs_u1_s3_p1_slide1.svg
        -
          title: 
          text: |
            * Monitoring network and application performance to identify irregular activities or attempted breaches.
            * Performing regular audits of systems to ensure that security practices are compliant.
            * Identifying any threat actors and liaising with the police and cyber crime units where necessary.
            * Work with IT departments to set up disaster recovery plans and HR teams to educate employees on how to identify suspicious activity.

          img: cs_u1_s3_p1_slide2.svg
       

  -
    title: General Job Functions carried out by cyber security professionals.
    theme: t-bg-primary
    copy: |
      Cyber security is one of the most important roles in the fast growing technology industries. As cyber criminals and hackers become more sophisticated and ruthless, the need for equally talented cyber security specialists is increasing and specialists in cyber security are very sought after. The cyber security profession can be entered at school leaver level as well as at graduate level. Graduates will probably have a degree related to computer science or a STEM subject ( Science, Technology, Engineering or Mathematics). Some employers also run apprenticeships in cyber security so school leavers can work and train at the same time.
      Cybersecurity professionals are responsible for protecting IT infrastructure, networks, and data and are often responsible for preventing data breaches and monitoring and reacting to attacks.

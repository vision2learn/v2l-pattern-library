      Let's have a look at what hacking is and what motivates hackers in a little more detail  
    video: placeholder_pc.mp4
  -
    title: Hackers
    theme: t-bg-primary
    copy: |
      The term 'Hacker' is often portrayed negatively in the media and purely looked upon as a cybercriminal, however, this is not applicable to all. Hackers are typically divided into 3 types white, black and grey hats. scroll through the slides below to learn about the differences between hackers in more detail.


    subInc: 
      type: slider
      title: 
      slides:
        -
          title: White Hat Hackers.
          text: |
            'White Hat' hackers are also known as ethical hackers and they use their technical skills to protect the world from bad hackers. Government agencies and organisations hire white hat hackers as information security analysts, cybersecurity researchers, security specialists and penetration testers and they often work as independent consultants or freelancers.
            a White hat hackers use the same hacking techniques as black hat hackers but they do it with the system owners permission and are motivated to find and fix vulnerabilities before they are exploited and to develop tools that can detect cyberattacks. They work to build security software like antivirus, anti-malware, anti-spyware, honeypots and firewalls and strengthen the overall security of the software and hardware systems.

          img: placeholder_icon.svg
        -
          title: Black Hat Hackers
          text: |
            'Black Hat' hackers are the true cybercriminals who use their technical skills to defraud and blackmail others. The exploit security vulnerabilities to break into computer systems and networks without permission for financial gain. When we talk about Hackers it is the Black Hat type we usually think about, sending phishing emails and SMS messages, deploying DDoS attacks, writing, selling and distributing malware, blackmailing victims using ransomware and indulging in a range of corporate espionage, financial fraud and identity theft related crimes. They also ply their trade on the Dark Web where their services can be accessed by other criminals.
          img: placeholder_icon.svg
        -
          title: Grey Hat Hackers
          text: |
            'Grey Hat' hackers as the name suggests hackers fall somewhere in between white and black. On the whole their intentions are good but they don't always take the ethical route. They often access systems without permission but not to cause mischief or harm, but to draw owners attention to the existing vulnerabilities of their systems. They will launch the same cyber attacks as white hat hackers to expose loopholes in major organisations, companies and government servers and websites and the reach out to them to inform them of the issues.
            They may sometimes charge a fee to fix the problems or strengthen the security system and offer their services to resolve any issues. They don't blackmail the organisations but they will disclose the information publicly if nothing is done to rectify the problems. Grey hats do this to showcase their abilities and gain recognition in the cyber security community, subsequently aiming to advance their careers as security professionals.
          img: placeholder_icon.svg

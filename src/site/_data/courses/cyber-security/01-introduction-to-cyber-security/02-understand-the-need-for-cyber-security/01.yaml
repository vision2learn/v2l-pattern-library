title: "Understand the need for cyber security"
intro: |
  In this session you will learn about the need for cyber security and the impact of cyber crime on individuals, businesses or nations and why issues should be reported promptly so as to minimise that impact:
banner: ba_u1_s2_p1_hss.jpg
sections:
  -
    title: Your learning goals
    theme: t-bg-primary
    copy: |
      By working through this session, you will cover the following criteria of your Level 2 Certificate in the Principles of Cyber Security.
    
      1. Common cyber crime vulnerabilities of an individual, business or nation
      2. Impact of cyber crime on an individual, business or nation.
      3. The importance of cyber security for an individual, business or nation.
      4. Why cyber security issues should be reported promptly

  -
    title: Common Cyber Crime Vulnerabilities.
    theme: t-bg-supporting2
    copy: |
      'Cybercrime is now a trillion-dollar cost to the global economy' as reported by cybersecurity firm McAfee.
       Cyber criminals seek to exploit human and security vulnerabilities in order to commit their crimes. These may be used to steal data, passwords or money directly. The most common cyber threats include Hacking, Phishing, Malware and Ransomware and DD0S attacks.


      Select the images below to read about those at risk.

    subInc: 
      type: reveal
      content:
        -
          title: individuals
          copy: |
            Phishing attacks on individuals are increasing which can lead identify theft and fraud. Instances of cyber bullying are also on the increase which is also considered a type of cybercrime.
          img: cs_u1_s2_p1_reveal1.svg
        -
          title: business
          copy: |
            There has been a significant growth in cyber criminality over the last few years especially with ransomware. Breaches of personal data leaves victims vulnerable to fraud and put lives at risk.
          img: cs_u1_s2_p1_reveal2.svg
        -
          title: nations
          copy: |
            On a global scale governments and nations are also at high risk of falling victim to cyber crime in one way or another and this affects everyone.
          img: cs_u1_s2_p1_reveal3.svg
            

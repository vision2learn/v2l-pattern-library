    title: Your learning goals
    theme: t-bg-primary
    copy: |
      By working through this session, you will cover the following criteria of your Level 2 Certificate in the Principles of Cyber Security.
    
      1. Common cyber crime vulnerabilities of an individual, business or nation
      2. Impact of cyber crime on an individual, business or nation.
      3. The importance of cyber security for an individual, business or nation.
      4. Why cyber security issues should be reported promptly


    title: On the web
    theme: t-bg-secondary2 i-on-web
    include:
      type: on-the-web
      copy: |
        To find out more about some examples of high profile attacks click on the links below. 
      links:
        Sony pictures interview hack: https://en.wikipedia.org/wiki/Sony_Pictures_hack
        Microsoft Exchange breach: https://en.wikipedia.org/wiki/2021_Microsoft_Exchange_Server_data_breach 
  -
    title: The importance of reporting cyber security issues promptly.
    theme: t-bg-supporting2
    copy: |
      General reporting of cybersecurity incidents informs the public as well as businesses. It can help individuals to look out for suspicious activity, such as money disappearing from their bank accounts, and enables them to take steps to protect themselves. Being aware of scams that are going around such as bogus texts and emails make people more aware and more likely to double check authenticity. Notification can also help other companies and organisations to be prepared for similar attacks.


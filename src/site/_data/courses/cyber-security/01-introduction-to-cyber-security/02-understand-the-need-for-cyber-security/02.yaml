title:  "Importance of cyber security"
intro:  |
  On this page you will learn about:
  
  * the potential impact that cyber crime can have
  * why cyber security is important
banner: cs_u1_s2_p2_importance.jpg
sections:
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      Make sure that you understand what impact cyber crime can have and why it is important to have cyber security for individuals, businesses and nations. 
  -
    title: Impact of cyber crime and why cyber security is important?
    theme: t-bg-primary
    copy: |
      Cyber attacks are financially devastating, disrupting and upsetting to individuals and businesses and can impact us all directly or indirectly. Directly it may affect us by having a lapse of concentration and clicking on a bogus link, or by our employers being hacked and affecting our jobs. It may also affect us as part of a community or nationally as it can impact our way of life.

  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Potential impact
      Let's look at the impact of cyber crime on individuals, business and nations and the importance of having cyber security. 
    video: cs_u1_s2_p2_potential_impact_1.mp4
  -
    title: On the web
    theme: t-bg-secondary2 i-on-web
    include:
      type: on-the-web
      copy: |
        To find out more about some examples of high profile attacks click on the links below. 
      links:
        Sony pictures interview hack: https://en.wikipedia.org/wiki/Sony_Pictures_hack
        Microsoft Exchange breach: https://en.wikipedia.org/wiki/2021_Microsoft_Exchange_Server_data_breach 
  -
    title: Time to think
    include: 
      type: time-to-think
      copy: what is the potential impact of cyber crime on individuals, businesses and nations? why is cyber security so important? Make a note of your responses in the box to the right. 
    theme: t-bg-primary3 i-think
  -   
    title: The importance of reporting cyber security issues promptly.
    theme: t-bg-primary
    copy: |
      General reporting of cybersecurity incidents informs the public as well as businesses. It can help individuals to look out for suspicious activity, such as money disappearing from their bank accounts, and enables them to take steps to protect themselves. Being aware of scams that are going around such as bogus texts and emails make people more aware and more likely to double check authenticity. Notification can also help other companies and organisations to be prepared for similar attacks.

  -

    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Reporting incidents
      Let's take a more in depth look at why it is important to report on cyber security issues promptly.
    video: cs_u1_s2_p2_potential_impact_2.mp4
  -           
    title: Quick quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Cyber crime is a violation of an individual's privacy and their data security.
          answer: Cyber crime
        -
          sentence: Trojan malware enables hackers to create a backdoor into the business’ systems and access business data and login credentials.
          answer: Trojan
        -
          sentence: The increased availability of 'cyber tools' has enabled emerging threats to become established quickly. 
          answer: 'cyber tools'
        -
          sentence: Having 'up to date’ antimalware software and making sure all programs are up to date can help to keep systems secure.
          answer: antimalware
        -
          sentence: A DDoS cyber attack involves a network being flooded with excessive traffic causing it to shut down and becoming unavailable to legitimate users.
          answer: DDoS
        -
          sentence: To minimise insider attacks all data storage should be encrypted and software should be updated regularly to maintain security. 
          answer: encrypted
    theme: i-quiz
    
  -
    title: Time to think
    include: 
      type: time-to-think
      copy: If you suspect a cyber attack has taken place why is it important to report it as soon as possible? what will prompt reporting achieve? Make a note of your responses in the box to the right. 
    theme: t-bg-primary3 i-think

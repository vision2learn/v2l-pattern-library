title:  "Importance of cyber security"
intro:  |
  On this page you will learn about:
  
  * the potential impact that cyber crime can have
  * why cyber security is important
banner: ba_u1_s2_p3_procedures.jpg
sections:
  -
    title: Impact of cyber crime and why cyber security is important?
    theme: t-bg-supporting2
    copy: |
      Cyber attacks are financially devastating, disrupting and upsetting to individuals and businesses and can impact us all directly or indirectly. Directly it may affect us by having a lapse of concentration and clicking on a bogus link, or by our employers being hacked and affecting our jobs. It may also affect us as part of a community or nationally as it can impact our way of life.

  -
    title: slider
    theme: t-bg-primary
    copy: |
      Let's look at the impact of cyber crime on individuals, business and nations and the importance of having cyber security. Scroll through the slides below to learn more about ...

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Individual
          text: |
            As individuals we can have our finances and social status heavily impacted by cyber crime. Unsolicited emails and texts and those often pertaining to be from our own bank or the inland revenue can have consequences when interacted with which may be financial. Once details have been unwittingly given, the cybercriminals have access to more than just our details, they can access bank accounts and commit crimes using our identity. This can then expand into our social media circles or work based contacts. Phones and smart technology around the home can be hacked and taken control of with the opportunity for being surveilled by cameras.
            Having 'up to date'  Antivirus software and making sure all programmes are up to date can help to keep systems secure. Also taking extra precautions like having good password protection, cautious when giving out details on line, only accessing secure sites, keeping phones and storage devices safe and away from prying eyes and being careful with any documentation that may have details on it and destroying it.
          img: placeholder_icon.svg
        -
          title: Business
          text: |
            Cybercrime can devastate a company’s finances and reputation quickly or can cause a great deal of disruption to an organisation. In the long term it can cause irreparable damage to a brand or even threaten an individuals way of life. Companies need to realise what a threat cyber crime is and to stop their business falling victim to the cyber criminals should invest in reliable cyber security services. A DDoS cyber attack involves a network being flooded with excessive traffic causing it to shut down and becoming unavailable to legitimate users. Hacking, involves the cybercriminal in trying to take advantage of vulnerabilities in a company’s software and systems. Hackers will ask for a ransom to end the attack, however by using trusted and reliable technology service providers and increasing bandwidth this can be prevented.

          img: placeholder_icon.svg
        -
          title: Nation
          text: |
            Nation state attacks are usually thought of as highly complex and technology based.However social engineering is commonly used to convince individuals to download malware to create security breaches. “Spear Phishing' attacks are often used to infiltrate inserting malware which may remain dormant until triggered by an outside agency making it difficult to guard against. State-backed actors are responsible for gaining access to computer networks around the world. Countries like China seem intent on committing large scale espionage even though as part of the G20 they agreed not to conduct or support cyber enabled theft of intellectual property or personal data. In the UK The National Cyber Security Centre (NCSC) supports the government giving advice to organisations affected by state run cyber intrusions stealing trade secrets such as those by the Chinese Ministry of State Security (MSS) in 2018.
            To guard against these often changing and increasingly sophisticated attacks, organisations must have a multilayered approach to their cyber security, creating nation state threat risk models and educating employees on being hyper aware of nation state attacks. They also need to be constantly aware of the threat and training should be ongoing.


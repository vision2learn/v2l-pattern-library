title: "Cyber Crime"
intro: |
  On this page you will learn about:
  * what cyber crime is
  * the possible motives for carrying out cyber crime
  * the different threat actors  
banner: cs_u1_s1_p3_cyber.jpg
sections:
  -
    title: So what is "Cyber Crime"?
    theme: t-bg-primary
    copy: |
      

      Cyber crime is a very real threat to a range of services, businesses and private individuals around the world. In the UK, cyber crime costs billions of pounds causing untold damage to and threatening our overall security.
      

  -
    title: Cyber crime involves a computer or other digital technology. There are two main types of cyber crime.
    theme: t-bg-supporting3
    
    subInc: 
      type: accordion
      content:
        - 
          title: Cyber-dependent crime 
          copy: |
            Otherwise known as ‘illegal hacking’. This is when someone gains access to another person’s computer network or device without permission. 
          img: /images/svg/cs/cs_u1_s1_p3_image_1.svg
        - 
          title: Cyber-enabled crime 
          copy: |
            This is when technology is used to carry out or enhance another crime, for example fraud.
          img: /images/svg/cs/cs_u1_s1_p3_image_2.svg
  -
    title: Motives for cyber crime.
    theme: t-bg-primary
    copy: |
      A person who commits a cyber crime is known as a cyber criminal. They can work alone or in a team of people. Their motives are often malicious with the intention of stealing sensitive company information, personal data, generating profit and/or for their own political reasons. Scroll through the slides below for different types of m 
    subInc: 
      type: slider
      title: 
      slides:
        -
          title: For financial gain 
          text: |
            Cybercrime in finance is the act of obtaining financial gain through profit-driven criminal activity. This includes identity fraud, ransomware attacks, email and internet fraud, and attempts to steal bank account, credit card, or other payment card information.
          img: cs_u1_s1_p3_image_2.svg
        -
          title: To increase business and competition
          text: |
            Cyber attacks against businesses are on the increase. Some attacks are designed to prevent competitors from taking part in major events, while others target the complete shutdown of online businesses for months.
          img: cs_u1_s1_p3_image_1.svg
        -
          title: To make a social or political point
          text: |
            Hackers can attack government and organisational websites to make their point known. This is often by causing a website crash so that no one can use it.
          img: cs_u1_s1_p3_image_3.svg
        -
          title: Radical ‘hackerism’
          text: |
            These acts are usually carried out by bored teenagers who want to cause trouble and make a statement. They don’t usually have a financial objective and often do it for attention or to look cool.
          img: cs_u1_s1_p3_image_2.svg
        -
          title: Cyber warfare
          text: |
            This is a war on the internet and flow of information. Cyber attacks like these backed by nation-states, which means they are well-funded and well-planned actions carried out by tech-savvy professionals.
          img: cs_u1_s1_p3_image_1.svg
  -
  -
    title: Threat actors
    theme: t-bg-supporting3
    copy: |
      In cybersecurity, the threat actor is the enemy. This can be a person, group, or entity that creates all or part of an ‘incident’ with the aim to impact an organization’s security.

      Select the images below to read more about the different types of threat actors

    subInc: 
      type: reveal
      content:
        -
          title: Cyber criminals
          copy: |
            Cyber criminals are individuals who want to exploit human or security vulnerabilities in I.T. in order to steal passwords, data or money directly. 
          img: cs_u1_s1_p3_image_1.svg
        -
          title: Cyber terrorists
          copy: |
            They can target the government, military, business and individuals using cyber espionage. They use computer networks to steal large volumes of sensitive data. This might include intellectual property, research and development projects, strategic data on a company's merger and acquisition plans, or any other information that the owner might want to protect.
          img: cs_u1_s1_p3_image_2.svg
        -
          title: Inside agents and bad actors
          copy: |
            text
          img: cs_u1_s1_p3_image_3.svg
        -
          title: State sponsored threat agents
          copy: |
            States can directly employ hackers through their military forces and government authorities or fund them indirectly. This makes it easier to deny the involvement of the state if the attack is detected, which decreases the diplomatic repercussions these attacks can have. It also blurs the line between criminal organizations and government groups. 
          img: cs_u1_s1_p3_image_1.svg
        - 
          title: Script kiddies
          copy: |
            An amateur who tries to illegally gain access to a computer system using programs (scripts) that others have written. Script kiddies also tend to be indiscriminate and may try to compromise any computer on the Internet they can reach.
          img: cs_u1_s1_p3_image_2.svg
        - 
          title: Hacktivists 
          copy: |
            Hacktivists are groups of criminals who unite to carry out cyber attacks in support of political causes. Hacktivists typically target entire industries but sometimes attack specific organizations who they feel don’t align with their political views or practices. In some cases hacktivists have targeted organizations not based on the victim organization’s beliefs but the clients and partners they do business with.
          img: cs_u1_s1_p3_image_3.svg      

title: "Cyber Crime"
intro: |
  On this page you will learn about:
  * what cyber crime is
  * the possible motives for carrying out cyber crime
  * the different threat actors  
banner: cs_u1_s1_p3_cyber.jpg
sections:
  -
    title: So what is "Cyber Crime"?
    theme: t-bg-primary
    copy: |
      

      Cyber crime is a very real threat to a range of services, businesses and private individuals around the world. In the UK, cyber crime costs billions of pounds causing untold damage to and threatening our overall security.
      

  -
    title: Cyber crime involves a computer or other digital technology. There are two main types of cyber crime.
    theme: t-bg-supporting3
    
    subInc: 
      type: accordion
      content:
        - 
          title: Cyber-dependent crime 
          copy: |
            Otherwise known as ‘illegal hacking’. This is when someone gains access to another person’s computer network or device without permission. 
          img: /images/svg/cs/cs_u1_s1_p3_image_1.svg
        - 
          title: Cyber-enabled crime 
          copy: |
            This is when technology is used to carry out or enhance another crime, for example fraud.
          img: /images/svg/cs/cs_u1_s1_p3_image_2.svg

    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      Make sure that you can identify the different threat actors involved in cybercrime.
  -

    title: Threat actors.
    theme: t-bg-primary
    copy: |
      With cyber security threats on the increase we have to be aware that not only large organisations, businesses and governments are under threat, so are individuals and their home computers and personal devices. A phrase that is commonly used in cyber security is a 'threat actor' and this is anyone who has the potential to impact another's security. A threat actor can be a single person as well as a group working together working as hackers, based anywhere to launch a cyber attack. It can also be an organisation or on the largest scale a country carrying out a cyber attack.

      Let's have a look at some 'threat actors' in a little more detail.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Cybercriminals.
          text: |
            Cyber criminals aim to exploit human security vulnerabilities to steal passwords, data or money.These are the most common types of threat actors and their attacks may involve hacking into devices to gain password details and stealing or making data inaccessible to an organisation by holding it to ransom. Financial gain is usually the motive and the weapons of choice are phishing attacks, ransomware and malware. It’s important to understand that these operate very much like any legitimate business, with teams of people and management, who turn up every day with the objective to bring in as much money as possible. Some companies even offer rewards for their employees that bring in the most money under an “employee of the month scheme”!
          img: cs_u1_s1_p3_slide1.svg
        -
          title: Cyber Terrorists & Industrial Spies
          text: |
            These threat actors use computer networks to steal large volumes of sensitive data that may include a company's intellectual property, research and development plans or other information they might want to protect. They may also attack government and military targets.
          img: cs_u1_s1_p3_slide2.svg
        -
          title: Hacktivists
          text: |
            Hacktivists are groups of criminals who carry out 'attacks' in support of political causes and may target who industries or specific organisations who don't share their political views or causes. Their motives are not always financial but may be political or ideological. Perhaps the most famous example of a Hacktivist group would be "Anonymous".
          img: cs_u1_s1_p3_slide3.svg
        -
          title: State Sponsored Threats
          text: |
            Some countries may target others to steal data or disrupt their security. Their intent may be to bring down or change governments or damage a countries economy. They may also be involved in disrupting communications, espionage and seeking access to military secrets.
          img: cs_u1_s1_p3_slide4.svg
  -

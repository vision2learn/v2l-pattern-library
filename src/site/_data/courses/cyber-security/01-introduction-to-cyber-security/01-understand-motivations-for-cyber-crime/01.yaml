title: Welcome to Unit one
intro: |
    This Introduction to Cyber Security course contains six mandatory units. To achieve your Level 2 Certificate in this subject, you need to complete all six units. 
    * Introduction to cyber security
    * Understand terminology used in cyber 
    * Understand legal and ethical aspects of cyber security
    * Understand common threats to cyber security
    * Understand methods of maintaining cyber security
    * Working with others in cyber security


title: "Types of threat and attacks"
intro: |
  On this page you will learn about:
  * What is meant by internal and external threats
  * The possible motivations that could lead to external and insider threats
  * What is meant by ‘targeted’ and ‘untargeted’ attacks
banner: cs_u1_s1_p4_threats.jpg
sections:
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      Make sure that you fully understand the the terms "external threats" and "internal threats" and the possible motivations that can lead to these threats.
  -
    title: Let's have a look at some other types of threat
    theme: t-bg-primary
    copy: |
      Within companies and organisations, the risk of threats not only come from external sources they can also be from internal sources. This means that companies and organisations need to be aware of security issues both externally and internally. So let's have a look at the differences between an external and an insider threat and what the potential consequences are.

    subInc: 
      type: accordion
      content:
        - 
          title: Internal
          copy: |
            Insider threats are usually caused by individuals who may be current or former employees, contractors or affiliates who have or have had, legitimate access to the organisation's network and systems. The threat may involve deliberate leakage of data for personal gain or to maliciously damage an organisation's cybersecurity infrastructure. However, this may also be unintentional damage or accidental leakage due to incompetent behaviour. An internal threat can therefore be equally costly to a company or organisation as the data is often more readily accessible. It is important that companies have stringent security protocols in place and that all employees understand the significance of sticking to this.
          img: /images/svg/cs/cs_u1_s1_p4_accordion1.svg
        - 
          title: External
          copy: |
            External threats involve someone from outside the company who attempts to exploit vulnerabilities in the computer systems by the use of ransomware, malware or hacking. Organisations need to invest in suitable, up-to-date, fit for purpose security software to prevent external cybersecurity risks no matter what form they are in. Companies should regularly review this and work with cybersecurity firms to make sure they are fully covered for the field that they are in and for any current threats.
          img: /images/svg/cs/cs_u1_s1_p4_accordion2.svg  
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Motivation for threats
     

      Let's have a look at some possible motives that could lead to external and insider threats.

    video: cs_u1_s1_p4_motivation_for_threats.mp4
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: In the box to the right give a definition of the terms "insider threat" and "external threat". Can you also suggest what the possible motivation is for these types of threats?
  -
    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      Make sure that you fully understand the the terms "targeted" and "untargeted attacks".
  -
    title: What is meant by targeted and untargeted attacks?
    theme: t-bg-primary
    copy: |
      Scroll through the slides below to learn more about the meaning of targeted and untargeted attacks. 

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Targeted attacks
          text: |
            A term we hear most commonly used these days within the media, when focussing on cyber crime is 'a targeted attack' A targeted attack is a type of threat that involves 'threat actors' actively pursuing and compromising a company or an organisation's infrastructure whilst maintaining anonymity.This type of threat is well organised and involves a high level of expertise often taking place over a long time and not obvious initially. It may target individuals as well as the company they work for and involve launching effective ransomware which can eventually cripple a company. 
          img: cs_u1_s1_p4_slide1.svg
        -
          title: Untargeted attacks
          text: |
            Another term commonly used is an 'untargeted attack' which is not tailored to it's victim. These are sometimes referred to as ‘drive-by attacks’. It is by it's nature indiscriminate and targets many different individual devices and systems that have vulnerabilities.This may involve 'phishing' and sending emails and texts to large numbers of people asking for sensitive information such as bank details or asking them to click on a link to log on to a fake website.  We have all become unfortunately used to getting scam emails and texts. The scammer may have obtained the emails from different sources and may not have anymore information so often it may not be relevant to the recipient. However, they hope that some people will fall for it. Setting up fake websites or compromising legitimate website can also be done to exploit random visitors to the site. 
          img: cs_u1_s1_p4_slide2.svg
  -
    title: Quick quiz
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        Is the following statement true or false? "Sending emails to specific people within an organisation containing a malicious link would be classed as a targeted attack ":
          answers:
            True: true
            False: false
          feedback: This type of attack would be termed "Spear Phishing" and would indicate that the attacker has a specific interest in your business, or has been paid to target you.
        Is the following statement true or false? Internal threats have the potential to cause greater damage than external threats:
          answers:
            True: true
            False: false
          feedback: internal users have direct access to the building and its infrastructure devices 
        Select one option to complete the following sentence:"Sending emails and text messages to large numbers of people asking for sensitive information is called__________.":
          answers:
            Angling: false
            Smashing: false
            Phishing: true
          feedback: A phishing attack attempts to convice the recipient that the message is from a trusted source and may be tricked into clicking a malicious link.
  -
    title: Time to think
    include: 
      type: time-to-think
      copy: Using your learning from this page and any additional research, can you give examples of targeted and untargeted attacks? Make a note of these in the box to the right.
    theme: t-bg-primary3 i-think
  -
    title: On the web
    theme: t-bg-secondary2 i-on-web
    include:
      type: on-the-web
      copy: |
        To find out more about the specific types of attacks take a little time to look through the links below. 

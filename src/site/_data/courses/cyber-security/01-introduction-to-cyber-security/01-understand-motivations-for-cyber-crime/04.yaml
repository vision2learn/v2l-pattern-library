    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: text
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Motivation for threats
      Malicious 'threat actors' are continuously looking for ways to infiltrate an organisations network externally or by using internal threats. This may sometimes be by attacking home workers or users via a phishing message, text or by using cleverly worded emails. This can then make others become the 'threat actor' unintentionally. This means that everyone should be aware of the importance of safeguarding their data and protecting their devices.
      In order to manage cyber risk, regardless of its source, we need to fully understand the range of motivations behind possible attacks

      Let's have a look at some possible motives that could lead to external and insider threats.


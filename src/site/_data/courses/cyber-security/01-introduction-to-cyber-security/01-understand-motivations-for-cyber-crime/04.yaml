title: "Types of threat and attacks"
intro: |
  On this page you will learn about:
  * what is meant by internal and external threats
  * the possible motivations that could lead to external and insider threats
  * what is meant by ‘targeted’ and ‘untargeted’ attacks
banner: cs_u1_s1_p4_threats.jpg
sections:
  -
    title: Threat types
    theme: t-bg-grey
    copy: |
      Within companies and organisations, the risk of threats not only come from external sources they can also be from internal sources. This means that companies and organisations need to be aware of security issues both externally and internally. So let's have a look at the differences between an external and an insider threat and what the potential consequences are.

    subInc: 
      type: accordion
      content:
        - 
          title: Internal
          copy: |
            Insider threats are usually caused by individuals who may be current or former employees, contractors or affiliates who have or have had, legitimate access to the organisation's network and systems. The threat may involve deliberate leakage of data for personal gain or to maliciously damage an organisation's cybersecurity infrastructure. However, this may also be unintentional damage or accidental leakage due to incompetent behaviour. An internal threat can therefore be equally costly to a company or organisation as the data is often more readily accessible. It is important that companies have stringent security protocols in place and that all employees understand the significance of sticking to this.
          img: /images/svg/cs/cs_u1_s1_p4_accordion1.svg
        - 
          title: External
          copy: |
            External threats involve someone from outside the company who attempts to exploit vulnerabilities in the computer systems by the use of ransomware, malware or hacking. Organisations need to invest in suitable, up-to-date, fit for purpose security software to prevent external cybersecurity risks no matter what form they are in. Companies should regularly review this and work with cybersecurity firms to make sure they are fully covered for the field that they are in and for any current threats.
          img: /images/svg/cs/cs_u1_s1_p4_accordion2.svg  

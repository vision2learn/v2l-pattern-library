  -
    title: What is meant by targeted and untargeted attacks?
    theme: t-bg-primary
    copy: |
      Scroll through the slides below to learn more about the meaning of targeted and untargeted attacks. 

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: targeted attacks
          text: |
            A term we hear most commonly used these days within the media, when focussing on cyber crime is 'a targeted attack' A targeted attack is a type of threat that involves 'threat actors' actively pursuing and compromising a company or an organisation's infrastructure whilst maintaining anonymity.This type of threat is well organised and involves a high level of expertise often taking place over a long time and not obvious initially. It may target individuals as well as the company they work for and involve launching effective ransomware which can eventually cripple a company. 
          img: cs_u1_s1_p4_slide1.svg
        -
          title: untargeted attacks
          text: |
            Another term commonly used is an 'un-targeted attack' which is not tailored to it's victim. It is by it's nature indiscriminate and targets many different individual devices and systems that have vulnerabilities.This may involve 'phishing' and sending emails and texts to large numbers of people asking for sensitive information such as bank details or asking them to click on a link to log on to a fake website.  We have all become unfortunately used to getting scam emails and texts. The scammer may have obtained the emails from different sources and may not have anymore information so often it may not be relevant to the recipient. However, they hope that some people will fall for it. Setting up fake websites or compromising legitimate website can also be done to exploit random visitors to the site. 
          img: cs_u1_s1_p4_slide2.svg

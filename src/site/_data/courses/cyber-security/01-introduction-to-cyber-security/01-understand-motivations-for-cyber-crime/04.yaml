    title: Targeted and untargeted attacks
    theme: t-bg-supporting3
    copy: |
      There are two distinct types of attacks carried out by cyber criminals see below to learn more about these.

      See below to learn more about 
    subInc: 
      type: accordion
      content:
        - 
          title: Un-targeted cyber attacks
          copy: |
            This type of attack is indiscriminate and targets as many different services, devices or users as possible. They will use a range of different tools and techniques such as;

            **Phishing** - sending emails to people which are designed to encourage people to divulge sensitive information (such as bank details) or containing links which, when clicked will take them to a fake website or install malware or ransomware onto their computer

            **Water holing** - this involves setting up a fake website or compromising a genuine site in order to exploit visitors

            **Scanning** - this involves the use of specialist software and scanning large volumes of websites and networks at random to identify vulnerabilities
        - 
          title: Targeted cyber attacks
          copy: |
            In targeted cyber-attacks, organisations or individuals are singled out by attackers as they have a specific interest in the organisation or individual, they are attacking. Targeted cyber-attacks are generally more damaging as time has been taken to plan the type of attack, or attacks, that will be made. Some examples of targeted attacks are,

            **Spear-phishing** - sending emails to targeted individuals that could contain an attachment with malicious software, or a link that downloads malicious software

            **Deploying a botnet** - to deliver a DDOS (Distributed Denial of Service) attack


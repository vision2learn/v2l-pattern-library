  -
    title: We keep talking about network traffic but what exactly is it?
    layout: media
    theme: t-bg-primary
    copy: |
      Network Traffic is the term used for data travelling across a computer network at any given time. It is broken down into 'data packets' which are then reassembled by the receiving device. Data traffic can flow in two directions either north south or east west. High amounts of network traffic can lead to slower download speeds or poor connections. They can also be a sign of a security attack.

    img: /images/svg/placeholder_icon.svg
  -
    title: What is a data packet?
    theme: t-bg-supporting2
    copy: |
       A packet is a segment of data after it has been broken up into a small enough piece to be sent over a network before being reassembled on the other system. The main parts of a packet are:
        * Header-This gives information about where it came from and where it’s going and metadata about the packet itself.
        * Payload-This is the main data itself, for example, the details of the web page that is being requested. This part will be encrypted in transit for HTTPS websites as it could contain sensitive data that we would not want intercepted.
        * Trailer-This part of the packet is the data that shows the end of the packet and often contains error collection data.
        ![](/images/svg/cs/cs_u5_s3_p2_image2.svg)

  - 

    title: Firewalls
    theme: t-bg-primary
    copy: |
      So let’s have a recap on what we have learnt about what a firewall does and the advantages and disadvantages of using a firewall to protect from threats? 
      
    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Advantages of a firewall
          text: |
            Firewalls serve as a first line of defence to external threats and have a number of advantages such as:
            * Software firewalls are pre installed with the latest operating systems so are cost effective.
            * Third party software firewalls are easy to install. 
            * They monitor traffic passing through and prevent hackers from gaining access to data and systems. 
            * They protect against viruses and shield the computer system from unwanted and malicious programs.

          img: placeholder_icon.svg
        -
          title: Disadvantages of a firewall
          text: |
            Depending on the type of firewall there can be several disadvantages such as:
            * Hardware firewalls are expensive and can be difficult to configure.
            * Software firewalls can slow down system performance as they use system and memory resources.
            * Both software and hardware firewalls have to be kep up to date to deal with new and emerging threats.
            * Firewalls are designed to protect against external attacks so are unable to provide any defence against internal network attacks.
            * They can give a false sense of security.
            * They do not protect against all types of malware. 

          img: placeholder_icon.svg
        
        

  -
    title: Key point
    theme: t-bg-supporting3
    copy: |
      Make sure that you understand what user access controls are and how restrictions can be implemented.
    
  -
    title: What is user access control?
    theme: t-bg-primary
    copy: |
      UAC works by requiring a standard user to enter the credentials of an administrator with elevated privileges in order to do such high-risk actions like installing a piece of software. This means that standard users cannot install things and therefore reduces the likelihood of them accidentally clicking a link and installing malware.
      It’s important therefore that users are not given administration access by default, and that administrators are not logged in with their administrator account when doing day-to-day things such as browsing the internet and checking emails.



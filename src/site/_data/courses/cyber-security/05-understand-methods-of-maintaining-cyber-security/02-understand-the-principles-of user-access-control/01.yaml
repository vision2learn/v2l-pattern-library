  -       
    title: Quick quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: User access control generally manages user accounts particularly those with special access privileges to protect against misuse and unauthorised access.
          answer: accounts
        -
          sentence: Failure to implement an effective user access control management policy, may expose an organisations system to cyber attack.
          answer: cyber attack
        -
          sentence: To help keep a system secure, accounts should only be assigned to authorised individuals and should limit access to the minimum level needed by the individual.
          answer: authorised
        -
          sentence: Failure to implement an effective user access control management policy makes it easier for hackers to take advantage of uncontrolled administrative privileges.
          answer: hackers
        -
          sentence: One of the techniques used to attack a system involves the elevation of privileges by guessing and cracking administrator passwords to gain access to target machines. 
          answer: elevation
        
    theme: i-quiz
    

title: Welcome to Unit five
intro: |
    In this unit you will learn about preventative methods used to maintain cyber security, including the principles of user access control and use of firewalls. 
    
    By working through this unit you will gain the knowledge and understanding required to be able to meet the learning outcomes in your learning goals.

banner: placeholder.jpg

sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit, you will cover the following criteria of your Level 2 Certificate in the Principles of Cyber Security.

      You will:

      1. Understand preventative methods used to maintain cyber security
      2. Understand the principles of user access control
      3. Understand the use of firewalls
      
      [View the complete set of learning outcomes for this unit.](/pdfs/v2l_it2_learning_outcomes_u2.pdf)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about the following:

      * routine methods to maintain cyber security
      * what is meant by vulnerability testing
      * what is meant by penetration testing 
      * what is meant by security updates 
      * ‘patching’ in relation to cyber security 
      * why information and maintenance records should be accurate and up-to-date
     

  -
title: How to keep system security up to date
intro: | 
  On this page you will learn about:
  * What is meant by patching
  * Security updates
  * Keeping cyber security information updated. 
  
banner: cs_u5_s1_p3_preventative_methods.jpeg
sections: 
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure that you can explain what patching and security updates mean in relation to cyber security and why cyber security information should be kept up to date. 
  - 

    title: What are security updates? What is patching?  
    theme: t-bg-primary
    copy: |
      Let's have a look at security updates and patching in more detail.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Security updates
          text: |
           As cyber criminals develop new ways of getting into systems then the security of those systems needs to be updated. This is usually done by regular security updates to a system. While this may seem annoying to have to do, they are very important to keep on top of the latest threats that are out there.
           
           Security updates are patches released by the vendors of that hardware, firmware, OS, or software which address the known CVE vulnerabilities. Security updates should be set to automatically update where possible.

          img: cs_u5_s1_p3_slide1.svg
        -
          title: What is 'patching'?
          text: |
            Patching is a process used to make changes to a computer program or its supporting data designed to update, fix, or improve it. This includes fixing security vulnerabilities and other bugs. Vulnerabilities that are most exploited are usually old ones that have the highest impact because they allow remote code execution (RCE) which allows a criminal full access to the device. Patches exist for these and have for many years, but it is often very difficult for a business to patch certain systems. When a system is being patched it may cause downtime or unknown compatibility issues.

          img: cs_u5_s1_p3_slide2.svg
       
   
  -
    title: Keeping up to date 
    theme: t-bg-primary1a
    copy: |
      So why is it important to keep cyber security information and maintenance records accurate and up to date? 

      Let's have a look at what benefits this has.  

    subInc: 
      type: accordion
      content:
        - 
          title: Accuracy
          copy: |
            Keeping accurate and up to date information and maintenance records on cyber security is essential in helping to understand how systems are being used and collecting logs and good logging practices are fundamental in protective monitoring. They can also be used if a breach happens to evaluate its impact.
          img: /images/svg/cs/cs_u5_s1_p3_accordian1.svg
        - 
          title:  Breaches
          copy: |
            Being able to retroactively go back through audit logs of what a system and its users were doing is incredibly important especially during a breach. This helps to gain understanding on how far an attacker has managed to penetrate a system and subsequently contain and eradicate the attack. 
            If the breach is substantial and a regulator such as the ICO becomes involved, it’s important to be able to demonstrate a clear understanding of what has happened and it’s impact so as to reduce any penalties that may be issued following a breach.

          img: /images/svg/cs/cs_u5_s1_p3_accordian2.svg  
  -    
  
    title: Time to think
    include: 
      type: time-to-think
      copy: Can you think of a time when you have been prompted to make an update to software e.g. Microsoft office, or anti-virus software? What do you think the reason for this was?
    theme: t-bg-primary3 i-think

  -

  


title: Understand preventative methods used to maintain cyber security
intro: | 
  On this page you will learn about:
  * what is meant by patching
  * security updates
  * keeping cyber security information updated. 
  
banner: placeholder.jpg
sections: 
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure that you can explain what patching and security updates mean in relation to cyber security and why cyber security information should be kept up to date. 
  - 

    title: What are security updates? What is patching?  
    theme: t-bg-primary
    copy: |
      Lets have a look at security updates and patching in more detail.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Security updates.
          text: |
           As cyber criminals develop new ways of getting into systems then the security of those systems needs to be updated. This is usually done by regular security updates to a system. While this may seem annoying to have to do, they are very important to keep on top of the latest threats that are out there.Security updates are patches released by the vendors of that hardware, firmware, OS, or software which address the known CVE vulnerabilities. Security updates should be set to automatically update where possible.

          img: placeholder_icon.svg
        -
          title: What is 'patching'?
          text: |
            Patching is a process used to make changes to a computer program or its supporting data designed to update, fix, or improve it. This includes fixing security vulnerabilities and other bugs. Vulnerabilities that are most exploited are usually old ones that have the highest impact because they allow remote code execution (RCE) which allows a criminal full access to the device. Patches exist for these and have for many years, but it is often very difficult for a business to patch certain systems.  When a system is being Patched it may cause downtime or unknown compatibility issues. So imagine having a business employing 10,000 people, patching a system that everyone needs to do work on and there is a downtime of 1 hour, would have a huge impact and therefore a business may not see the value in doing it.

          img: placeholder_icon.svg
       
   

  -       
    title: Quick quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: With the large amount of malware out there it will inevitably penetrate and infect a system especially a vulnerable system.
          answer: vulnerable
        -
          sentence: Keep all devices secure and don't download anything from any dodgy sites or click on any unknown links on unreliable emails.
          answer: secure
        -
          sentence: It is possible to remove malware, by running a scan using the security software installed on the device or system.
          answer: security software
        -
          sentence: The first step in incident response if you are concerned that a device or system may be infected is containment. 
          answer: containment
        -
          sentence: Opening a system in safe mode allows only the minimum software and programs to load. 
          answer: safe mode
        -
          sentence: Check activity monitors for malicious applications especially if a suspicious update or application has been installed.
          answer: suspicious
    theme: i-quiz
    

title: Understand what is meant by malicious software
intro: |
  In this session you will learn about:
  In this session you will learn about malicious software what it is how it can infect your system and how you can remove it

banner: placeholder.jpg
sections:
  -
    title: Your learning goals
    theme: t-bg-primary
    copy: |
      By working through this session, you will cover the following criteria of your Level 2 Certificate in the Principles of Cyber Security.
    
      1. Explain what is meant by malicious software
      2. Identify ways in which malicious software can infect a system
      3. Identify methods for removing malicious software from an infected system
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure that you understand the different types of malicious software, how it can infect systems and removal methods.
  -
    title: So what is Malicious software?
    theme: t-bg-primary
    copy: |
      We hear the term malicious software all the time but what exactly is it what does it do, how do we protect ourselves from it and how can we get rid of it when we have it in our systems?
      
      Malicious software or malware is any software that is designed for the purposes of intentionally causing damage or exploiting any programmable device, computer, service, network, or system.  

      Malicious software can include Viruses, Ransomware, Spyware,Trojans, Worms, Scareware, Adware. Some of these have already been mentioned in previous units but let's refresh our memories on what they involve.

      Select the images below to read 

    subInc: 
      type: reveal
      content:
        -
          title: Ransomware
          copy: |
           This is the most profitable and therefore the most popular. It installs itself onto a machine, encrypts the files and demands a ransom for the release, usually in bitcoin.

          img: cs_u4_s2_p1_reveal1.svg
        -
          title: Spyware
          copy: |
            Once installed spyware captures and transmits personal information and browsing habits. Users of spyware include criminals, as well as security organisations and other consumers as it can also be used to spy on employees, family members and to test and monitor communications in investigations.
          img: cs_u4_s2_p1_reveal2.svg
        -
          title: Trojans
          copy: |
            These pretend to be harmless applications tricking users into downloading them, where they then launch their attack, stealing data, spying or crashing systems.
          img: cs_u4_s2_p1_reveal3.svg
        -
          title: Worms
          copy: |
           Worms copy themselves from machine to machine exploiting weaknesses in software or operating systems. 
          img: cs_u4_s2_p1_reveal4.svg
        -
          title: Scareware
          copy: |
            Tricks individuals into thinking they have a virus or their system is infected to purchase and download a fake application.
          img: cs_u4_s2_p1_reveal5.svg
        -
          title: Adware
          copy: |
            Adware programs push unwanted adverts and pop ups at users. These usually accompany the use of software for free.
          img: cs_u4_s2_p1_reveal6.svg  

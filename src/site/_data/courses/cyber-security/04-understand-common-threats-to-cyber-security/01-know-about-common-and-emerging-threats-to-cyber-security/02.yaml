title: Know about common and emerging threats to cyber security
intro: | 
  On this page you will learn about the following areas in relation to cyber security. 
  common and emerging threats to cyber security 
  
banner: cs_u4_s1_p2_emerging_threats.jpeg
sections: 
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure that you understand the common and emerging threats to cyber security.
  -
    title: Common and emerging threats to cyber security.
    theme: t-bg-primary
    copy: |
      As we all know the technology landscape is constantly changing and this is even more relevant to cybersecurity especially over the last year with the disruption caused by the pandemic. None of us could envisage what would happen to this extent and what the impact would be on our lives and for business, technology and cybersecurity. This has created so many opportunities for cyber criminals to develop new attacks and threaten our cyber security.

  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Common Threats
      So as the threat landscape changes and new threats emerge, let's look at what we have to deal with today and what may come tomorrow in the field of cyber security.
    video: cs_u4_s1_p2_common_and_emerging.mp4
  -       
    title: Quick quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Mobile malware can target systems due to unsecure usage of URL's over WiFi or other networks.
          answer: malware
        -
          sentence: Allowing devices to connect to the internet opens them up to a number of serious vulnerabilities if they are not protected properly.
          answer: vulnerabilities
        -
          sentence: The Dark Web isn't indexed by search engines but can be accessed by those who wish to use a special browser and almost anything that has a link to criminal enterprise can be found there.
          answer: Dark Web
        -
          sentence: Something we don't always think of as cyber crime is 'fake news' and video.
          answer: fake news
        -
          sentence: Deepfakes can be more worrying, as we say 'seeing is believing' however technology has advanced so much that often what we see, should not be believed. 
          answer: Deepfakes
        -
          sentence: There are many things that have the potential to be affected by cyber crime but one new advancement is the use of the technology of drones.
          answer: drones
    theme: i-quiz
    
  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Effects on us all
      The covid 19 pandemic has meant massive changes to the way we work. Lets have a look at some of the challenges that this has brought to cyber security.
    video: cs_u4_s1_p2_effects_of_covid.mp4

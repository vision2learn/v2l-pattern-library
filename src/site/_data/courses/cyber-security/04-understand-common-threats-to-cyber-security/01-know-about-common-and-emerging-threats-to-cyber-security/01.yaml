title: Welcome to Unit four
intro: |
    In unit 4 you will learn about malicious software and the ways in which a system can be infected. You will also learn about common and emerging threats, as well as physical threats to cyber security.  
    
    By working through this unit you will gain the knowledge and understanding required to be able to meet the learning outcomes in your learning goals.

banner: cs_u4_s1_p1_intro.jpeg

sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit, you will cover the following criteria of your Level 2 Certificate in the Principles of Cyber Security.

      You will:

      1. Know about common and emerging threats to cyber security
      2. Understand what is meant by malicious software
      3. Understand physical threats to cyber security
      
      [View the complete set of learning outcomes for this unit.](/pdfs/v2l_cs_learning_outcomes_u2.pdf)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about the following:
      * Common and emerging threats to cyber security. 


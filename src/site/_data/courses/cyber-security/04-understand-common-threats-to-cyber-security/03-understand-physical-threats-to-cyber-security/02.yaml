title: Threats and solutions
intro: |
  On this page you will learn about:
   * The potential threats that remote working brings
   * Best practice which can help to minimise physical threats to security.
banner: cs_u4_s3_p2_threats_and_solutions.jpeg
sections:
  -
    title: Key point
    theme: t-bg-supporting3
    copy: |
      Make sure that you understand and can give examples of the possible threats presented by remote working and best practices to minimise threats. 
  -

    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Possible threats presented by remote working
      Remote working has been around for some time but has become essential for many businesses due to the pandemic and looks likely that this will be a continuing trend for many companies for the foreseeable future.

      Lets take a look at the potential threats that remote working presents.  
    video: cs_u4_s3_p2_remote_working.mp4
  -       
    title: Quick quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Rigorous and powerful cybersecurity is needed to protect employees working remotely such as VPN or investing in the more secure zero trust model.
          answer: VPN
        -
          sentence: Zero trust works on the principle of don’t trust by default and uses additional factors to assess whether to grant access.
          answer: Zero trust
        -
          sentence: When using untrusted WiFi networks, employees should be sure to use a corporate VPN so that their connection is encrypted end-to-end. 
          answer: encrypted
        -
          sentence: Whilst working in public, employees should be wary of shoulder-surfing that people can’t view any potentially sensitive data that they may have on screen.  
          answer: shoulder-surfing
        -
          sentence: Privacy screens can be used which blur the screen of anyone who is not sat directly in front of the computer. 
          answer: Privacy screens
  
    theme: i-quiz
    
  -
    title: Time to think
    include: 
      type: time-to-think
      copy: Do you or someone that you know works remotely? Can you give examples of the threats that this has presented? 
    theme: t-bg-primary3 i-think

  -
    title: Best practice
    theme: t-bg-primary
    copy: |
      Physical threats to cyber security may come from the opportunist who steals a computer and possibly a log in, gets into the system, sets up malware by logging onto a system or goes for an all-out attack on the network through malicious means of physical attack such as arson or theft on a grand scale.
      Let's look at best practice that can help to minimise physical threats to cyber security.
    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Physical security
          text: |
            Having physical security in a building with perimeter access controls and physical perimeter barriers can help to keep the physical threat out. Having CCTV inside and outside of a building can also help by offering 24/7 monitoring of who enter and exits or tries to gain access illegally.

          img: cs_u4_s3_p2_slide1.svg
        -
          title: Access controls
          text: |
            Access controls, (like fobs which may be specific to certain areas and keypads which may be dynamic and changed regularly), help improve access problems to all areas. 
            
            Staff having photographic ID badges which may also allow access to certain areas are effective and a sure way of being able to check on the system that a person is who they say they are.

          img: cs_u4_s3_p2_slide2.svg
        -
          title: Staff training
          text: |
            Good staff training explains that security goes beyond:
             * not opening a door for others 
             * looking after personal belongings 
             * Keeping their digital identity safe
             * not leaving passwords on 'post its'
             * not leaving computers logged on when they leave a room 
            Vigilant staff can help inform security control to any issues that may pose a threat to cyber security.

          img: cs_u4_s3_p2_slide3.svg
        -
          title: Physical entry penetration tests
          text: |
            Much like how we conduct penetration tests of websites to ensure criminals can’t breach them technically, it’s becoming more common that companies will commission physical entry penetration tests. This is where a person will be tasked with assessing the physical security of a facility. They will use social engineering to try and get past front desks, tailgate through doors, and use disguises such as janitor outfits to ensure that nobody questions them for example.

          img: cs_u4_s3_p2_slide4.svg  
  -
    title: Time to think
    include: 
      type: time-to-think
      copy: Looking at your own home or workplace, what security systems are in place? How could the security be improved?
    theme: t-bg-primary3 i-think


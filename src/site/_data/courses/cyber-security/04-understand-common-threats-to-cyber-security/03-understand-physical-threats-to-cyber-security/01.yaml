title: Understand physical threats to cyber security
intro: |
    In this session you will learn about physical threats to cyber security and how technology can help with these threats.
banner: cs_u4_s3_p1_physical_threats.jpeg
sections:
  -
    title: Your learning goals
    theme: t-bg-primary
    copy: |
      By working through this session, you will cover the following criteria of your Level 2 Certificate in the Principles of Cyber Security: 

      1. Explain why perimeter access control is important.
      2. Give examples of when check and challenge on the premises may be needed.
      3. Identify the possible threats to a business presented by the use of; personal devices, removable devices, hardware, and networking infrastructure
      4. Give examples of possible threats presented by remote working.
      5. Describe best practice which can help to minimise physical threats to cyber security.
  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      Make sure that you understand the importance of perimeter access controls and the different controls that can be utilised. 
  -
    title: Perimeter access control
    theme: t-bg-primary
    copy: |
      Perimeter security and access control systems protect and monitor the external boundary of a business or facility. These systems control access to restricted areas and include the control of people, vehicles and materials through entrances and exits of a controlled area. Scroll through the slides below to learn more about perimeter access control.

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Why is perimeter access control important?
          text: |
            Perimeter access control systems control the access of people, vehicles and materials into controlled areas through external perimeters of a facility. Other systems linked to this may involve physical barriers and sensors. 
            
            Intrusion alarms identify unauthorised access or attempted entry into an area. Access controls permit or deny access to the facility. 
            If Cyber criminals can access a facility they have access to all the systems within that facility and can infiltrate the systems for the criminal activities.

          img: cs_u4_s3_p1_slide1.svg
        -
          title: What is check and challenge?
          text: |
            All staff and visitors within a facility or organisation especially those that handle sensitive data should be checked for their identity and challenged to prove who they are to make sure that they have a right to enter. 
            
            This is important especially in facilities where personal data and personal security is concerned. This is useful for educational establishments such as schools, colleges and universities as well as national security buildings and companies that would be at threat from espionage.
          img: cs_u4_s3_p1_slide2.svg
  -

    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### What are the potential threats to businesses? 
      Businesses face a range of threats ranging from personal devices, removable devices, hardware and networking infrastructure. Let's have a look at these threats in more detail. 
    video: cs_u4_s3_p1_threats_from_devices.mp4
  -       
    title: Quick quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Perimeter security and access control systems protect and monitor the external boundary of a business or facility
          answer: external
        -
          sentence: Many companies allow employees to use their own personal devices which is commonly know as a 'BYOD' policy.
          answer: BYOD
        -
          sentence: Individual are more inclined to update their apps and information on their own devices in their own time which saves the business time and money.
          answer: update
        -
          sentence: Mobile security should be just as strong as network security to ensure that the company is not put at risk. 
          answer: Mobile
        -
          sentence: The use of personal devices can cause conflicts when they are used for personal as well as business reasons. 
          answer: conflicts
    theme: i-quiz
    
  -
    title: Time to think
    include: 
      type: time-to-think
      copy: Can you identify the potential threats to businesses from the use of the different devices mentioned in the video? 
Do    theme: t-bg-primary3 i-think
    
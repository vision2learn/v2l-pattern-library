title: Understand physical threats to cyber security
intro: |
    In this session you will learn about physical threats to cyber security and how technology can help with the threat:
banner: BA_U1_S3_p1_Communication.svg
sections:
  -
    title: Your learning goals
    theme: t-bg-primary
    copy: |
        By working through this session, you will cover the following criteria of your Level 2 Certificate in the Principles of Cyber Security -  

        3.1 Explain why perimeter access control is important
        3.2 Give examples of when check and challenge on the premises may be needed
        3.3 Identify the possible threats to a business presented by the use of:
        * personal devices
        * removable devices  hardware
        * networking infrastructure
        3.4 Give examples of possible threats presented by remote working
        3.5 Describe best practice which can help to minimise physical threats to cyber security
  -

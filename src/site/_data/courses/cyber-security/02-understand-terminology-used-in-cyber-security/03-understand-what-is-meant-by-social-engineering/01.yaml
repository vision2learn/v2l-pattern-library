  -
    title: slider
    theme: t-bg-primary
    copy: |
      Scroll through the slides to see how cyber criminals use social engineering and all that open-source information to target their victims and commit their crimes. 
     

    subInc: 
      type: How information
      title: Social engineering tools and techniques
      slides:
        -
          title: Phishing
          text: |
            Phishing is a broad term for an attack that involves tricking victims into sharing sensitive information such as passwords, usernames and credit card details for malicious reasons. A phishing attack can be random.
          img: placeholder_icon.svg
        -
          title: Spear-phishing
          text: |
            Spear phishing is a more sophisticated form of phishing and involves malicious emails being sent to a specific victim often for malicious reasons. The attacker will acquire personal information on the victim often via social media sites.

          img: placeholder_icon.svg
        -
          title: Vishing
          text: |
            Vishing or voice phishing is a form of phishing that involves phone calls. The victim will be approached via a call pertaining to be from a reputable source and told there is something wrong with an account and they need their details to sort it out.
          img: placeholder_icon.svg
        -
          title: Smishing
          text: |
            Smishing or SMSishing is a form of phishing that involves SMS text messaging. It may seem as though it has come from a trusted source and ask the victim to click on a link to update something.
          img: placeholder_icon.svg


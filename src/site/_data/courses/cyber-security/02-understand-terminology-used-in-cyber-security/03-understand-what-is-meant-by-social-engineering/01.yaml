title: Know about job roles within cyber security
intro: |
    In this session, you will learn about the various job functions within cyber security and the key skills required:
banner: BA_U1_S3_p1_Communication.svg
sections:
  -
    title: Your learning goals
    theme: t-bg-primary
    copy: |
        By working through this session, you will cover the following criteria of your Level 2 Certificate in the Principles of Cyber Security -  

        1. Describe the role of key organisations in the cyber security industry
        2. Identify general job functions carried out by cyber security professionals
        3. Define the term ‘hacking’
        4. Explain the differences between the following types of hacker:
            * white-hat
            * black-hat
            * grey-hat
        5. Identify the key skills requirements of a cyber security professional
  -

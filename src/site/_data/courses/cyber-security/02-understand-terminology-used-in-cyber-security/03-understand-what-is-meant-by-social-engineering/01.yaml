  -
    title: Social Engineering
    theme: t-bg-grey
    copy: |
      
      Social engineering is a term that has become more common in recent years, so Lets take a closer look at what it means and why it is useful to cyber criminals.  

    subInc: 
      type: accordion
      content:
        - 
          title: What is Social Engineering?
          copy: |
            Social engineering is the name given to techniques used by cyber criminals to manipulate and trick people into giving out confidential information, transferring money or downloading malware. Social engineers use psychology to manipulate a victims feelings of curiosity, familiarity, fear, or urgency to draw them into a trap.
            * Curiosity – a criminal may send a phishing email titled “click here to view the prize you won!”
            * Familiarity – a criminal may build a rapport with you before asking you to send them money. This is seen a lot in phishing emails, pretending to be lonely young women looking for a partner.
            * Fear – a criminal may pretend to be your boss in a phishing email and demand you do something or else be fired.
            * Urgency – a criminal may instil a false sense of urgency in a phishing email “click here to get your 100% discount before the offer expires”
          img: cs/cs_u2_s3_p1_accordian1.svg
        - 
          title:  Why do cyber criminals use it?
          copy: |
            As technology and subsequently cyber security gets more advanced, cyber criminals are turning more to social engineering to make their initial attack on a system and exploit the weakest link in the chain "the user". Unlike cyber attacks that rely on system vulnerabilities to gain access to unauthorised devices, social engineering targets human vulnerabilities. They can use a variety of methods both online and offline to con unsuspecting users into compromising their own systems or work-based systems by installing malware and giving away information. They may also be tricked into transferring money.
          img: cs/cs_u2_s3_p1_accordian2.svg  

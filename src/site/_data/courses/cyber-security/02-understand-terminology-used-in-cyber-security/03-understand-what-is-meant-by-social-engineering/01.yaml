    title: Your learning goals
    theme: t-bg-primary
    copy: |
        By working through this session, you will cover the following criteria of your Level 2 Certificate in the Principles of Cyber Security -  

        1. What is social engineering
        2. How social engineering benefits a cyber criminal
        3. What is open source information
        4. What information a cyber criminal can gain through open sources
        5. What techniques can be used for social engineering
        6. What information a cyber criminal can gain from social engineering.

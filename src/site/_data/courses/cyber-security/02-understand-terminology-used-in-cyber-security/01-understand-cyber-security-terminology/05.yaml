      type: word-quiz
      content:
        -
          sentence: A DDoS or distributed denial of service attack involves multiple systems orchestrating a synchronised attack to a single target, overloading a server.
          answer: synchronised
        -
          sentence: A bot is a piece of malware that infects a computer to carry out the commands of the attacker remotely.
          answer: bot
        -
          sentence: A trojan is a type of malware often disguised as legitimate software. 
          answer: trojan
        -
          sentence: If a system is infected with ransomware an appropriate decryption tool will be needed to regain access. 
          answer: ransomware
        -
          sentence: Spyware is a form of malware that secretly infects a computer to gather information such as the sites visited, usernames, passwords, payment information and email activity.
          answer: Spyware
        -
          sentence: Worms are designed to spread from computer to computer and have the ability to reproduce themselves to do this.
          answer: Worms

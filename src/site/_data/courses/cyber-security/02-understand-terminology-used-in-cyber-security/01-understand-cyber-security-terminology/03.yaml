  * what networks are
  * The different types of networks 
banner: cs_u2_s1_p3_networking.jpeg
sections:
  -
    title: Networks
    theme: t-bg-primary
    copy: |
      

      A network allows computers to connect and communicate with each other and others in the network. LAN, MAN and WAN are three major types of network. The major differences between these networks is the geographical areas that they cover. All networks should have security already in place but also having each computer with extra security helps to make this more resilient.
      


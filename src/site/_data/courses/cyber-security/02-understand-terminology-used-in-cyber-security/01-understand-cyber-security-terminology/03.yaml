      Let's have a look at different types of network
    video: placeholder_pc.mp4
  -
    title: Network security.
    theme: t-bg-primary
    copy: |
      All networks should have security already in place but also having each computer with extra security helps to make this more resilient. Anti virus software should identify, block, and mitigate any targeted threats such as malware, ransomware and phishing but there are also additional ways to ensure networks are secure.

      scroll through the slides below to learn more about these. 
    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Identity verification
          text: |
            Network security is usually based on strict identity verification processes with only authenticated and authorized users and devices being able to access applications and data. At the same time, it protects those applications and users from advanced threats on the Internet. Users and devices should be able to safely connect to the Internet, as long as they follow the network guidelines
          img: cs_u2_s1_p3_slide1.svg
        -
          title: Virtual Private Networks
          text: |
            VPN's or virtual private networks are encrypted connections over the internet from a device to a network. They help ensure that sensitive data is safely transmitted and traffic remains private allowing the user to work remotely. Smartphones and tablets can also connect through VPN.
            Secure remote access also provides a safe and secure way to connect users and devices remotely to a corporate network. This includes VPN technology to authenticate the user or device.
          img: cs_u2_s1_p3_slide2.svg
  -
    title: Stretch
    layout: media
    theme: t-bg-primary2 i-stretch
    copy: |
      ###  Creating networks

      The best way to learn about networks and their differences is to build one and Cisco have created a tool to do this. Cisco Packet Tracer is a tool built by Cisco to simulate a network. It is used to help students learn the principles of networking whilst gaining hands-on experience and develop Cisco technology skills. It doesn't involve the use of routers or switches but is purely a software only method. It uses packet trace to demonstrate technical concepts and networking systems. As a software it is also used by engineers to test any protocols before implementing them and try out any changes only deploying if everything works as expected. 
      
      Click on the image to learn more.


    img: /images/svg/stretch_button.svg
    link: https://www.netacad.com/courses/packet-tracer

    title: Targets
    theme: t-bg-supporting3
    copy: |
      Cyber security is the practice of protecting computer system hardware, networks, software programmes and data from cyber attacks. Cyber attacks are offensive manoeuvres targeting  computer networks or information systems. Cyber security software is a must for all individuals and businesses to protect their network, system or applications from cyber attacks and this needs to be regularly maintained to stop threats like ransomware, malware, social engineering and phishing.

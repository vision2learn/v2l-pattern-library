title: Welcome to Unit two
intro: |
    In unit 2 you will learn about cyber security terminology, and the concept of
    social engineering. 
    
    By working through this unit you will gain the knowledge and understanding required to be able to meet the learning outcomes in your learning goals.

banner: cs_u2_s1_p1_first_page.jpeg

sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit, you will cover the following criteria of your Level 2 Certificate in the Principles of Cyber Security.

      You will:

      1. Understand cyber security terminology
      2. Understand current and emerging challenges in cyber security
      3. Understand what is meant by social engineering
      
      [View the complete set of learning outcomes for this unit.](/pdfs/v2l_cs_learning_outcomes_u2.pdf)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about the following:
      * What hardware, software, data management and networking mean in relation to cyber security
      * The difference between LAN and WAN
      * What vulnerability, threat, risk, attack, protection and recovery mean in relation to cyber security
      * Organisational strategies in relation to cyber security

  -
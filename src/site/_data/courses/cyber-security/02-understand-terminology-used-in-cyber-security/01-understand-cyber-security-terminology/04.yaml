    title: Key point
    theme: t-bg-supporting3 i-keypoint
    copy: |
      Make sure that you understand the different terminology used in cyber security. 
  -
    title: Terminology
    theme: t-bg-primary
    copy: |
      

      Vulnerability, Threat, Risk, Attack are major terms that you will often hear used in cyber security. Let’s have a look at these in more detail.


  -
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Vulnerabilities and threats 
       
    video: cs_u2_s1_p4_vulnerability_and_threats.mp4
  -      
    title: Quick quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: In terms of cybersecurity an example of a negative event is your computer being hacked.
          answer: negative
        -
          sentence: A vulnerability is a weakness that can be exploited by cybercriminals to gain unauthorised access to a computer system.
          answer: weakness
        -
          sentence: Having up-to-date antimalware software can help to cut down the threat and reduce vulnerability.
          answer: antimalware
        -
          sentence: To work out any cybersecurity risk an organisation or company should assess their system vulnerabilities.
          answer: vulnerabilities
        -
          sentence: By having a cyber security strategy in place an organisation can be prepared to act if an attack should happen but more importantly, be ready and protected from that attack.
          answer: strategy
        -
          sentence: DRP's can provide instructions to follow in the event of an attack which in turn may minimise the severity.
          answer: DRP's
    theme: i-quiz
    

  -      
    title: Quick quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Cyber crime is the use of a computer or other digital device, and the internet to commit illegal acts.
          answer: internet
        -
          sentence: Cyber crime can affect individuals, businesses, organisations and governments.
          answer: governments
        -
          sentence: Cyber crime is increasing all the time and becoming more complex.
          answer: increasing
        -
          sentence: Cybercrime is not limited to a specific location making it difficult for security services to trace.
          answer: location
        -
          sentence: The same skills used by the cyber criminals can also be used by the police to find them. 
          answer: police
        -
          sentence: Even if a cyber criminal is traced, geopolitical issues can mean it may still be impossible to bring them to justice.
          answer: geopolitical
    theme: i-quiz
    

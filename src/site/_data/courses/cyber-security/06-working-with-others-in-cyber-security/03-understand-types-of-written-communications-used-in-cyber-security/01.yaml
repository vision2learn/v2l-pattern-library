title: Understand types of written communications used in cyber security 
intro: |
    In this session you will learn about the purpose of written communications in cyber security, the potential audience, types of information and the key elements of effective written communication.
banner: cs_u6_s3_p1_written_communication.jpeg
sections:
  -
    title: Your learning goals
    theme: t-bg-primary
    copy: |
        By working through this session, you will cover the following criteria of your Level 2 Certificate in the Principles of Cyber Security -  
        1. Explain the purpose of written communications used in cyber security
        2. Identify the potential audience for the written communications used
        3. Identify the type of information that may be included in a written communication
        4. Give examples of the elements that support effective written communication
  -
    title: Key point
    theme: t-bg-supporting3
    copy: 
      Make sure that you understand the purpose and potential audience for written communication.
  - 
    title: What is the purpose of written communications used in cyber security.
    theme: t-bg-primary
    copy: |
     The field of cybersecurity has changed a lot over the last 25 years and the skill of communication has become more important and crucial to the development of cyber security initiatives. Cyber security professionals need to be able to communicate highly technical details to others who may not always have the technical knowledge. They will be asked to create a variety of written reports which will have to put forward technical details to others within a company without the same technical background in an informative but clear way that get that information across. 
      
      Let's look at some of the written reports that are used in cyber security 

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Vulnerability Reports 
          text: |
            A vulnerability report should be a succinct document which identifies the vulnerable piece of technology and the criticality of the vulnerability. These may often contain hundreds or thousands of vulnerabilities. It’s therefore important that this document prioritises the vulnerabilities in a list and details the ease of remediation because it’s often impractical to fix every vulnerability. A business needs to know which vulnerabilities can be fixed and which will have the most impact given that resources may be restricted. Because these are usually generated by vulnerability software and the volume of vulnerabilities will be high, accuracy is not as important.
          img: placeholder_icon.svg
        -
          title: Penetration Testing Reports
          text: |
           Penetration tests ( Pen Tests) should be similar to vulnerability reports but because they are created by humans in a limited time period there will often be fewer to report and higher in criticality. They therefore should go into more detail than a vulnerability report and should be able to be utilised by a non-cyber security audience. The most important part of a pen test report are the steps to fix the problem, but also contain an executive summary as a high level qualitative overview of the general security of the system for the executive team. They should also explain how the results were found. Because these are vulnerabilities found by software then validated by humans, accuracy is much more important in these documents than in a normal vulnerability report.
          img: placeholder_icon.svg
        -
          title: Incident reports
          text: |
            An incident report is often given to external customers if they have been affected, and in some cases a regulatory body such as the ICO and therefore needs to be an accurate professional document. It should contain a general overview of what has happened in non-technical language for everyone to understand. It should also include a timeline for legal purposes to show step by step what has happened. The most important part is a section detailing what lessons have been learned from the incident and what will be done to ensure that it doesn’t happen again.
          img: placeholder_icon.svg
        -
          title: Internal policy documents 
          text: |
            Internal policy documents dictate what an employee can and cannot do. Because it’s audience is wide and non-technical it is important that the language is understandable by all. The use of language is extremely important making sure that the correct tenses and words are used at all times as well as the correct tone of voice. These policies form the rules an employee has to abide by and they are often used in disciplinary hearings, they therefore need to be accurate and clear in what they require of all employees.
          img: placeholder_icon.svg

        
  -
    title: Quick quiz
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        Is the following statement true or false? "Vulnerability reports are usually generated by specialist software so accuracy is not important.":
          answers:
            True: true
            False: false
          feedback: The volume of vulnerabilities will be high as the sofware will identify every potential vulnerability. The cyber security agents role is then to prioritise how critical these are in the report.
        Is the following statement true or false? Penetration testing reports are automatically produced by specialist software.:
          answers:
            True: false
            False: true
          feedback: Penetration testing reports are produced by cyber security operatives and will go into greater detail than vulnerability reports. They will also be written with a wider audience in mind  
        Which one of the following is a regulatory body that may need to be informed of a cyber security breach":
          answers:
            FCO: false
            ICO: true
            ISO: false
          feedback: GDPR introduced a duty on all organisations to report certain personal data breaches to the ICO. This must be done within 72 hours of becoming aware of the breach, where feasible.
  -
    title: Time to think
    include: 
      type: time-to-think
      copy: Can you explain why written communication is so important in cyber security?
    theme: t-bg-primary3 i-think

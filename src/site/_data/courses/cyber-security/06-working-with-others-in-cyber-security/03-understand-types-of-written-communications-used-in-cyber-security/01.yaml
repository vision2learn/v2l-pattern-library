title: Understand types of written communications used in cyber security 
intro: |
    In this session you will learn about the purpose of written communications in cyber security and their potential audience:
banner: cs_u6_s3_p1_written_communication.jpeg
sections:
  -
    title: Your learning goals
    theme: t-bg-primary
    copy: |
        By working through this session, you will cover the following criteria of your Level 2 Certificate in the Principles of Cyber Security -  

        3.1 Explain the purpose of written communications used in cyber security
        3.2 Identify the potential audience for the written communications used
        3.3 Identify the type of information that may be included in a written communication
        3.4 Give examples of the elements that support effective written communication

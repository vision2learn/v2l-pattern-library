    copy: 
      Make sure that you understand the different audiences for written communication and the elements that.
  - 
    title: What is the purpose of written communications used in cyber security.
    theme: t-bg-primary
    copy: |
     The field of cybersecurity has changed a lot over the last 25 years and the skill of communication has become more important and crucial to the development of cyber security initiatives. Cyber security professionals need to be able to communicate highly technical details to others who may not always have the technical knowledge. They will be asked to create a variety of written reports which will have to put forward technical details to others within a company without the same technical background in an informative but clear way that get that information across. 
      
      Let's look at some of the written reports that are used in cyber security 

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Vulnerability Reports 
          text: |
            A vulnerability report should be a succinct document which identifies the vulnerable piece of technology and the criticality of the vulnerability. These may often contain hundreds or thousands of vulnerabilities. It’s therefore important that this document prioritises the vulnerabilities in a list and details the ease of remediation because it’s often impractical to fix every vulnerability. A business needs to know which vulnerabilities can be fixed and which will have the most impact given that resources may be restricted. Because these are usually generated by vulnerability software and the volume of vulnerabilities will be high, accuracy is not as important.
          img: placeholder_icon.svg
        -
          title: Penetration Testing Reports
          text: |
           Penetration tests ( Pen Tests) should be similar to vulnerability reports but because they are created by humans in a limited time period there will often be fewer to report and higher in criticality. They therefore should go into more detail than a vulnerability report and should be able to be utilised by an non-cyber security audience. The most important part of a pen test report are the steps to fix the problem, but also contain an executive summary as a high level qualitative overview of the general security of the system for the executive team. They should also explain how the results were found. Because these are vulnerabilities found by software then validated by humans, accuracy is much more important in these documents than in a normal vulnerability report.
          img: placeholder_icon.svg
        -
          title: Incident reports
          text: |
            An incident report is often given to external customers if they have been affected, and in some cases a regulatory body such as the ICO and therefore needs to be an accurate professional document. It should contain a general overview of what has happened in non-technical language for everyone to understand. It should also include a timeline for legal purposes to show step by step what has happened. The most important part is a section detailing what lessons have been learned from the incident and what will be done to ensure that it doesn’t happen again.
          img: placeholder_icon.svg
        -
          title: Internal policy documents 
          text: |
            Internal policy documents dictate what an employee can and cannot do. Because it’s audience is wide and non-technical it is important that the language is understandable by all. The use of language is extremely important making sure that the correct tenses and words are used at all times as well as the correct tone of voice. These policies form the rules an employee has to abide by and they are often used in disciplinary hearings, they therefore need to be accurate and clear in what they require of all employees.
          img: placeholder_icon.svg

        

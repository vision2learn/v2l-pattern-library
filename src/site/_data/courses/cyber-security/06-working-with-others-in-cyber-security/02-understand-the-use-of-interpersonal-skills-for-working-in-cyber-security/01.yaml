    theme: t-bg-primary
    copy: |
      By working through this session, you will cover the following criteria of your Level 2 Certificate in the Principles of Cyber Security.
    
      1. Understand the most common vulnerabilities of cyber crime
      2. understand the impact of cyber crime
      3. The importance of cyber security
      4. Understand why cyber security issues should be reported promptly

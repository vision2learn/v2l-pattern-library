title: Welcome to Unit six
intro: |
    This Introduction to Cyber Security course contains six mandatory units. To achieve your Level 2 Certificate in this subject, you need to complete all six units. 

    In unit 1 you will learn about the need for cyber security, the impact of cyber crime and the different job roles within cyber security. 
    
    By working through this unit you will gain the knowledge and understanding required to be able to meet the learning outcomes in your learning goals.


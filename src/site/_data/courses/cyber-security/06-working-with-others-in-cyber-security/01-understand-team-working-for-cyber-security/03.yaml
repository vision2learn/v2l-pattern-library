title: Conflict resolution and supporting effective teamwork
intro: |
  On this page you will learn about:
  * ways to resolve conflict within a team
  * how reviewing work activities can support effective teamwork

banner: cs_u6_s1_p3_types_of_threat.jpeg
sections:
  -
    title: Key point
    theme: t-bg-supporting3
    copy: 
      Make sure that you understand the ways that conflicts within teams can be resolved. 
  -
    
    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Conflict resolution
      So, what happens when a team isn’t functioning effectively and conflict becomes evident. Let’s look at ways to resolve conflict within a team.
    video: cs_u6_s1_p3_resolving_conflicts.mp4
  -
    title: Time to think
    include: 
      type: time-to-think
      copy: Have you ever experienced conflict within a team working environment? What effect did it have? How was it resolved? If not, what effects do you think that conflict will have on the team?
    theme: t-bg-primary3 i-think
  -    
    title: Quick quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Even in the most efficient well-run companies, teams can be affected by conflict.
          answer: conflict
        -
          sentence: Using an intermediary or trusted third party that both sides can have faith in, can help with resolving conflict by being fair and impartial and identifying the issues.
          answer: intermediary
        -
          sentence: Dominant individuals should not be allowed to bully more reserved members of the team, and everyone should be able to have their say.
          answer: Dominant
        -
          sentence: Conflict should be addressed before it gets out of hand, and this can be done using proactive strategies
          answer: proactive
        -
          sentence: By airing the grievances that may have started the conflict, things can be resolved quite amicably to suit all parties.
          answer: grievances
    theme: i-quiz 
  -
  
    title: Key requirements
    layout: media
    theme: t-bg-primary1a
    copy: |
      ### So how can reviewing work activities support effective teamwork?

      Working as part of a team whatever the industry can be both rewarding and challenging as every team member needs to feel valued and part of the group. So how can reviewing work activities support effective teamwork especially in a cyber security setting.

      Reviewing should be a valued and memorable experience. It should involve finding a way of learning from the experience and using those findings to become more dynamic and productive. Whatever an individual’s role is within the team reviewing work activities should be able to support effective teamwork by helping others to learn from the experience.

    img: /images/svg/placeholder_icon.svg 
  -  
    title: Time to think
    include: 
      type: time-to-think
      copy: Using your learning from this session or your own personal experience, what benefits does reviewing work actvities have for the individual and the wider team?
    theme: t-bg-primary3 i-think

  -
    title: The importance of reviewing work activities 
    theme: t-bg-primary1a
    copy: |
      Working as part of a team whatever the industry can be both rewarding and challenging as every team member needs to feel valued and part of the group. So how can reviewing work activities support effective teamwork especially in a cyber security setting. 

      Lets have a look at what benefits this has.  

    subInc: 
      type: accordion
      content:
        - 
          title: accuracy
          copy: |
            Keeping accurate and up to date information and maintenance records on cyber security is essential in helping to understand how systems are being used and collecting logs and good logging practices are fundamental in protective monitoring. They can also be used if a breach happens to look at the impact of it.
          img: placeholder_icon.svg
        - 
          title:  Breaches
          copy: |
            Being able to retroactively go back through audit logs of what a system and its users were doing is incredibly important especially during a breach. This helps to gain understanding on how far an attacker has managed to penetrate a system and subsequently contain and eradicate the attack. 
            If the breach is substantial and a regulator such as the ICO becomes involved, it’s important to be able to demonstrate a clear understanding of what has happened and it’s impact so as to reduce any penalties that may be issued following a breach.

          img: placeholder_icon.svg  
  -

title: Welcome to Unit six
intro: |
    In this unit you will learn about team working and the use of interpersonal skills and communication when working in a cyber security role.
    
    By working through this unit you will gain the knowledge and understanding required to be able to meet the learning outcomes in your learning goals.

banner: cs_u6_s1_p1_Intro.jpeg
sections:
  -
    title: Learning goals
    theme: t-bg-supporting2
    copy: |
      By working through this unit, you will cover the following criteria of your Level 2 Certificate in the Principles of Cyber Security.

      You will:

      1. Understand team working for cyber security
      2. Understand the use of interpersonal skills for working in cyber security
      3. Understand types of written communications used in cyber security
      
      [View the complete set of learning outcomes for this unit.](/pdfs/v2l_cs_learning_outcomes_u6.pdf)
  -
    title: What you will learn
    theme: t-bg-primary1a
    copy: |
      In this session you will learn about the following:

      * What is meant by team dynamics
      * Comparing the benefits of working with others to working alone
      * Ways in which team members can work together to make use of individual strengths
      * Ways to resolve conflict within a team
      * How reviewing work activities can support effective teamwork 
     

  -

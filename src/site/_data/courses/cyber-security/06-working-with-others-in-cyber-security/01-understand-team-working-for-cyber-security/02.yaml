    title: Team Dynamics
    theme: t-bg-primary1a
    copy: |
      ### What is meant by Team Dynamics?
      'Team Dynamics' are unconscious, psychological factors that influence how a team works together in relation to behaviour and performance. They are critical for an organisations success and allow them to access the skills and experience of all employees. 
      A Team can be defined as a group of 2 or more people working together to meet a specific goal. Team members distinct roles and behaviours will impact on other group members as well as the group as a whole and can impact the success and effectiveness of the team overall. No two teams will be the same so identifying and addressing any issues that may arise is important to make sure the team dynamic is and remains positive.
  - 
    title: Let's look at some of the aspects of team dynamics.
    theme: t-bg-primary
    copy: |

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Working relationships 
          text: |
            Group work is integral to all working relationships as it enables creativity and productivity to flourish as ideas are swapped. A leader should always pay attention to others in their team and encourage successful collaboration and sharing of ideas. This can in turn help with increasing trust and respect and an inclusive work culture.
          img: placeholder_icon.svg
        -
          title: Individual personalities
          text: |
            Teams are made up of individual personalities. Some team members may be strong and opinionated pushing their ideas forward. Others may be more intent on agreeing with the leaders or holding back on opinions for fear of looking foolish, which can lead to a lack of ideas and stagnation. There needs to be a balance within a team of personalities so that the team members complement each other in their skills and experience.
          img: placeholder_icon.svg
        -
          title: Team leadership
          text: |
            Team leaders need to be aware of the other members strengths and weaknesses and make sure that everyone has a role to play of equal standing. If a team suffers from weak leadership this can pave the way for a dominant team member to take over resulting in lack of direction and conflict. Quieter team members may fail to get their voices heard.
          img: placeholder_icon.svg
        -
          title: Building on Communication
          text: |
            These acts are usually carried out by bored teenagers who want to cause trouble and make a statement. They don’t usually have a financial objective and often do it for attention or to look cool. In cyber security this is especially important because you will often be needed to explain very technical problems to non-technical audiences and being able to explain the risk to the business generally especially in terms of financial impact.
          img: placeholder_icon.svg
        -
          title: Teams in formal and informal settings.
          text: |
            Teams exist wherever people work together towards a common goal. Some are highly formal and subjected to rules and disciplinary actions with a hierarchical structure and they have clearly defined structural goals. Others are more informal constantly changing and are based on interpersonal relationships, existing for a particular purpose with less planned or predetermined goals.
          img: placeholder_icon.svg
        -  
          title: Team Dynamics and Cyber security
          text: |
            Team Dynamics and taking on a leadership role in cyber security comes with a different set of responsibilities. A common challenge faced working in cyber security is around conflicting priorities. Good security can be costly, both in terms of money and time and implementing the tools and people necessary to deliver good security is often hard to justify as there is no immediate upfront benefit. It is however, an investment in preventing potential future security issues, but even with the best security in the world a breach can happen. Leaders often need to implement new processes adding more steps to complete in people’s day to day job, which they may be resistant to if they have tight deadlines. Being able to explain why something is important and justify the reasonings to others who have their own priorities, such as deadlines, or budgetary constraints is a very important factor in being successful in cyber security.
          img: placeholder_icon.svg


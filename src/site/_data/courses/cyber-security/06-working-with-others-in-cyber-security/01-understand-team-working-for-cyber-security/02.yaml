title: Understand team working for cyber security
intro: |
  In this session you will learn about:
  * What is meant by team dynamics
  *	Comparing the benefits of working with others and working alone
  *	Make use of individual strengths 
  *	Resolving conflict within a team 
  *	Work activities that can support effective teamwork.
   
banner: cs_u6_s1_p2_team working.jpeg
sections:
  -
    title: Key point
    theme: t-bg-supporting3
    copy: 
      Make sure that you understand what is meant by team dynamics and the benefits of teamwork
  -
  
    title: Team dynamics
    theme: t-bg-primary1a
    copy: |
      ### What is meant by team dynamics?
      'Team dynamics' are unconscious, psychological factors that influence how a team works together in relation to behaviour and performance. They are critical for an organisation's success and allow them to access the skills and experience of all employees. 
      
      A Team can be defined as a group of 2 or more people working together to meet a specific goal. Team members distinct roles and behaviours will impact on other group members as well as the group as a whole and can impact the success and effectiveness of the team overall. No two teams will be the same so identifying and addressing any issues that may arise is important to make sure the team dynamic is and remains positive.
  - 
    title: Let's look at some of the key aspects of team dynamics
    theme: t-bg-primary
    copy: |

    subInc: 
      type: slider
      title: 
      slides:
        -
          title: Working relationships 
          text: |
            Group work is integral to all working relationships as it enables creativity and productivity to flourish as ideas are swapped. A leader should always pay attention to others in their team and encourage successful collaboration and sharing of ideas. This can in turn help with increasing trust and respect and an inclusive work culture.
          img: cs_u6_s1_p2_slide1.svg
        -
          title: Individual personalities
          text: |
            Teams are made up of individual personalities. Some team members may be strong and opinionated pushing their ideas forward. Others may be more intent on agreeing with the leaders or holding back on opinions for fear of looking foolish, which can lead to a lack of ideas and stagnation. 
            There needs to be a balance within a team of personalities so that the team members complement each other in their skills and experience.
          img: cs_u6_s1_p2_slide2.svg
        -
          title: Team leadership
          text: |
            Team leaders need to be aware of the other members strengths and weaknesses and make sure that everyone has a role to play of equal standing. If a team suffers from weak leadership this can pave the way for a dominant team member to take over resulting in lack of direction and conflict. Quieter team members may fail to get their voices heard.
          img: cs_u6_s1_p2_slide3.svg
        -
          title: Building on communication
          text: |
            In cyber security this is especially important because you will often be needed to explain very technical problems to non-technical audiences and being able to explain the risk to the business in general, especially in terms of financial impact.
          img: cs_u6_s1_p2_slide4.svg
        -
          title: Teams in formal and informal settings
          text: |
            Teams exist wherever people work together towards a common goal. Some are highly formal and subjected to rules and disciplinary actions with a hierarchical structure and they have clearly defined structural goals. Others are more informal constantly changing and are based on interpersonal relationships, existing for a particular purpose with less planned or predetermined goals.
          img: cs_u6_s1_p2_slide5.svg
        -  
          title: Team dynamics and cyber security
          text: |
            Leaders often need to implement new processes adding more steps to complete in people’s day to day job, which they may be resistant to if they have tight deadlines. Being able to explain why something is important and justify the reasonings to others who have their own priorities, such as deadlines, or budgetary constraints is a very important factor in being successful in cyber security, for example good security can be costly, both in terms of money and time.
          img: cs_u6_s1_p2_slide6.svg

  -

    title: Watch 
    theme: t-bg-grey i-watch
    layout: media
    copy: |
      ### Teamwork
      Let's take a look at the advantages to working in a team to working alone and how team members can work together to make use of individual strengths.
    video: cs_u6_s1_p2_teamwork.mp4
  -      
    title: Quick quiz
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Working with others in a team can increase creativity.
          answer: creativity
        -
          sentence: Productivity can improve as more ideas can be developed and collaboration can increase.
          answer: Productivity
        -
          sentence: Working alone can increase a person’s independence and help an individual to make their own decisions.
          answer: independence
        -
          sentence: A strong team should have a good team ethic which in turn makes it successful. Successful teams have members with a range of individual strengths and qualities.
          answer: ethic
        -
          sentence: Strong and responsible leadership is one of the key aspects of maintaining a successful team.
          answer: leadership
        -
          sentence: A diverse range of team members can also bring an extra dimension to a team.
          answer: diverse
    theme: i-quiz
    
  -
    title: Time to think
    include: 
      type: time-to-think
      copy: Have you ever worked as part of a team? What made the team effective? What were the benefits of working in the team? If not, what do you think makes teams effective?
    theme: t-bg-primary3 i-think

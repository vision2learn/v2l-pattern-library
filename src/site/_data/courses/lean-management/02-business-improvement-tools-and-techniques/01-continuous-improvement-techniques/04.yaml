
title: Waste
intro: | 
  At the heart of many Kaizen activities is the **elimination of waste**. 

  Let’s look at what is meant by ‘waste’ in business and the impact that waste can have on productivity when it is not eliminated. 

banner: LM_U2_S1_p4_waste.svg
sections:
  -
    title: Three categories
    theme: t-bg-primary
    copy: |
      When thinking about waste in the workplace it is helpful to divide general work activities and business processes into three categories. 

    subInc: 
      type: accordion
      content:
        - 
          title: 1. Value added
          copy: |
            **Value added** work and processes include any changes to the product or service that increase the value of the output.  
        -
          title: 2. Non-value added
          copy: |
            The term ‘**non-value added**’ is used to describe any necessary work activities and processes that do not add value to the output. Organisations aim to minimise the amount of non-value added activity without undermining the product or service.  
        -
          title: 3. Waste
          copy: |
            Any unnecessary aspects of the business process, which do not add value, are called **waste**. Waste should be eliminated. 
  -
    title: Eliminating waste
    theme: 
    copy: |
      In a continuous improvement workplace, the aim is to identify and eliminate waste in order to lower costs and improve outputs. 

      Taiichi Ohno, the chief engineer at Toyota, devised seven types of waste (known as Muda in Japanese). His classifications apply to both product and service industries. The classification system can help organisations to identify and eliminate waste, providing a focus for activity in the workplace. 

      ### Types of waste

      The seven types of waste make the acronym ‘TIMWOOD’. Use it to help you remember them.

      Scroll through the slides below to learn more
    subInc:
      type: slider
      title: 
      slides:
        -
          title: 1. Transport
          text: |
            **Key aspects**
            * Poor layout
            * Wrong position of raw materials
            * Too much inventory
            * Insufficiently sized storage areas

            **Benefits of elimination**
            * Efficient access to materials
            * Reduced handling costs
            * Reduced internal movement of materials
            * Reduced risk of handling damage
            * Reduced risk of health and safety hazards

          img: LM_U2_S1_P4_Slide_1.svg
        -
          title: 2. Inventory
          text: |
            **Key aspects**
            * Large stocks of work in progress
            * Large stocks of raw materials
            * Work-in-progress and raw materials cluttering the workplace

            **Benefits of elimination**
            * Money not tied up
            * Workspaces not tied up
            * Easier movement and transportation
            * Lower potential hazards

          img: LM_U2_S1_P4_Slide_2.svg
        -
          title: 3. Motion (by operators)
          text: |
            **Key aspects**
            * Too much stretching and bending to do the job
            * Too much walking to get tools and materials etc.
            * Unproductive work time
            * Greater risk of injury

            **Benefits of elimination**
            * Reduction in injury and absenteeism
            * Greater productivity
            * Better environment and morale
          img: LM_U2_S1_P4_Slide_3.svg
        -
          title: 4. Waiting (idle time)
          text: |
            **Key aspects**
            * Some work areas working quicker/slower than others
            * Different or conflicting cycle times
            * Machines needing constant monitoring
            * Delays in change over

            **Benefits of elimination**
            * Better use of operator time
            * More efficient use of equipment
            * Reduced likelihood of operator boredom with potentially fewer accidents as a result.
          img: LM_U2_S1_P4_Slide_4.svg

        -
          title: 5. Overproduction
          text: |
            **Key aspects**
            * Creating an output that exceeds demand
            * Producing outputs far ahead of schedule

            **Benefits of elimination**
            * Saves money on unnecessary production
            * Exposes underlying causes of overproduction
            * Cuts the risk of being left with stock that cannot be sold
          img: LM_U2_S1_P4_Slide_5.svg
        -
          title: 6. Over-processing
          text: |
            **Key aspects**
            * Too much time spent on set-ups change overs and down time
            * Unproductive, unnecessary and complicated processes

            **Benefits of elimination**
            * Money saved by removing unnecessary processes
            * Higher levels of equipment utilisation
            * More efficient workflows
          img: LM_U2_S1_P4_Slide_6.svg
        -
          title: 7. Defects (bad quality)
          text: |
            **Key aspects**
            * Planned overproduction to meet lower targets
            * Large temporary storage areas/containers for rejects
            * Excess overtime
            * Increased customer complaints
            * Additional resources needed for quality checks

            **Benefits of elimination**
            * Higher customer satisfaction
            * Reduced rework costs
            * Reduced waste disposal costs
            * Lower overtime
            * Reduced need for overproduction
          img: LM_U2_S1_P4_Slide_7.svg
  -
    title: Case study
    layout: media
    theme: t-bg-primary1a i-case-study
    copy: |
      Anna started a new job in a big design company. After working there for a few weeks, she noticed some problems with photocopying in the office. She found that people were making unnecessary copies, the photocopier was taking too long (and therefore queues were building) and it was unreliable. 

      Anna recommended that the company buy a new, higher-quality photocopier and restrict the number of photocopies employees could make at any one time. The company took her advice on board, and found that they started to save money on paper and work activities started to speed up, enabling them to achieve more.
    img: /images/svg/ln/LM_U2_S1_P4_CaseStudy.svg
  - 
    title: "Quick quiz"
    theme: t-bg-supporting3 i-quiz
    copy: |
      Match the description to the correct category.

    subInc: 
      type: quick-quiz
      content: 
        Any work and processes which increase the value of the output.:
          answers:
            Value-added: true
            Non-value added: false
            Waste: false
        Any necessary activities and processes which do not add value to the output.:
          answers:
            Value-added: false
            Non-value added: true
            Waste: false
        Unnecessary aspects of the business process which do not add value to the output.:
          answers:
            Value-added: false
            Non-value added: false
            Waste: true
          # feedback: feedback text.     
  -
    title: How is waste eliminated?
    theme: t-bg-supporting3
    copy: |
      Waste costs money and can lead to poor quality products and services. Once waste has been identified, the company must look for ways to eliminate it.

      Companies use a three-step approach to eliminate waste:

      1. Identify
      2. Categorise
      3. Eliminate

      See below to learn more
    subInc: 
      type: accordion
      content:
        - 
          title: 1. Identify
          copy: |
            First, the company must decide upon which activities and processes to investigate. Employees who have hands-on experience in the chosen area should participate in the investigation. The process may be videoed for review. 
            
            Sometimes, investigators ‘walk through’ the process and identify sources of waste as they do so. This is called a **waste walk**. They may record each individual waste source on a sticky note and place the note near the source of waste.
            
            During the ‘identify’ step, the participants should resist the temptation to discuss solutions and counter measures. This is a distraction and people may miss further sources of waste.
          img: /images/svg/ln/LM_U2_S1_P4_Slide_1B.svg
        - 
          title: 2. Categorise
          copy: |
            Once the ‘identify’ stage has been completed, the company must consider solutions. For each source of waste, they should list as many solutions as possible. Sometimes, organisations use specific brainstorming techniques to help. The solutions may be listed alongside each source of waste.
            
            The potential solutions are then categorised using criteria such as:
            
            * **Time** – Can they be tackled short term, medium term or long term?
            * **Cost** – How much will the solution cost to implement?
            * **Benefit** – What will be the saving?

            The organisation can then prioritise its elimination actions.
          img: /images/svg/ln/LM_U2_S1_P4_Slide_2B.svg
        - 
          title: 3. Eliminate
          copy: |
            Finally, the organisation must take action to eliminate the sources of the waste. Once this is done, it is important to **check** and **evaluate** the effectiveness of the elimination actions. 
            
            When waste is produced by an organisation, it is a clear indication that there are potential inefficiencies in some way. 
            
            The effort to identify and eliminate waste shows that the organisation is seeking to improve its performance. By continuously identifying and eliminating waste, the organisation continuously improves its performance.
          img: /images/svg/ln/LM_U2_S1_P4_Slide_3B.svg
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think

  -
    title: Key point
    theme: t-bg-grey i-keypoint
    copy: |
      For your assessment you must be able to (1.1) identify the main Kaizen principles and their application. The elimination of waste is one of the most important ways in which Kaizen principles are applied to the workplace.
  -
    title: Benchmarking
    theme: t-bg-primary
    copy: |
      When an organisation wants to improve its work activities and processes, it must take a **systematic approach**. One particular approach is called **benchmarking**. 

      Benchmarking requires the organisation to **compare** its processes with other processes. These other processes set a standard (called a ‘**benchmark**’) so that comparisons can be made. The benchmarks can be **internal** or **external**. 


      Select each image to see an explanation of each type of benchmarking.
    subInc: 
      type: reveal
      layout: 
      content:
        -
          title: Internal benchmarking
          copy: The benchmark comes from an internal business process.  The current performance of a process may be used as a **starting point**. The organisation may return to a process later and compare it to the starting point. The organisation may make comparisons with different processes in other units, departments and sections.

          img: LM_U2_S1_P4_Reveal_1.svg
        -
          title: External benchmarking
          copy: |
            The benchmark comes from an external business process.  For example, the organisation may use a **competitor**, the **sector** or a similar function in a non-competitive organisation as a benchmark. 

          img: LM_U2_S1_P4_Reveal_2.svg  
  -
    title: Benchmarking is used to answer five key questions
    theme: t-bg-primary
    copy: 
    subInc: 
      type: accordion
      content:
        - 
          title: Five key questions
          copy: |
            1. Where are we now?
            2. How does this process compare with others?
            3. Can we identify areas of improvement?
            4. Can we make appropriate changes?
            5. Where are we now?

        - 
          title: Some popular benchmarking areas include
          copy: |
            * Quality
            * Productivity
            * Material costs
            * Labour costs
            * Sales levels
            * Space utilisation.
  -

  -
    title: Summary
    theme: t-bg-primary i-summary
    copy: |
      Organisations must take a systematic approach in order to improve work activities and processes. One important approach is called benchmarking. A benchmark is a standard that the organisation uses to compare its processes to. Benchmarking may be internal or external.


title: What did you learn? 
intro: Well done, you’ve now completed the ﬁrst session of this unit! In this session you have learnt about using visual indicators to improve the work environment. You should now be able to identify elements that contribute to good visual management in the workplace, and be able to prepare appropriate visual indicators.
banner: LM_Summary.svg

sections:
  -
    title: Learning points
    theme: t-bg-primary
    copy: |
      Take a look at the following learning points to see a summary of what you have covered in this session:
      * Types of visual information
      * Benefits of visual information
      * Guiding principles of visual management
      * Preparing visual management techniques
      * Effective visual management techniques
      * Making further improvements
    subInc: 
      type: accordion
      content:
        - 
          title: Elements contributing to visual management
          copy: |
            Types of visual information
            * Charts and graphs
            * Signs
            * Gauges
            * Digital displays
            * Colours
            * Shapes
            * Numbers
            * Letters
            * Arrows
            * Lines

            Benefits of visual information
            * Helps control the process
            * Provides feedback
            * Informs the initiation of action
            * Keeps people informed
            * Focuses on performance measures and issues
            * Provides the same message to everyone
        - 
          title: Visual management techniques
          copy: |
            Principles of visual management
            * Correct
            * Relevant
            * Important
            * Keep people

            Implementation of visual management
            * Inputs
            * Process
            * Outputs

            Effective visual management techniques
            * Precisely define the information required
            * Decide if presenting information visually will be effective
            * Select an appropriate visual option
            * Consider how often the information needs to be updated
            * Think about where the information should be presented
            * Keep in mind any future refinements

            Preparing and implementing visual management techniques (VMTs)
            * Materials required for VMTs
            * Utilising effective VMTs
            * Getting the cost right
            * How can the system be made more user-friendly?
            * How can the system be made more customer-friendly?
            * How can the data be simplified?
  -


title: Visual Management Techniques (VMTs)
intro: | 
  It pays to prepare systematically before introducing new visual management techniques to a team, department, process or any particular unit in a business. This is so that any new visual information is both relevant and necessary.
banner: LM_U2_S3_P3_VMT.svg
sections:
  -
    title: Introducing effective VMT
    theme: t-bg-supporting2
    copy: |
      
      Scroll through the slides below to learn more about introducing new VMTs.
    subInc:
      type: slider
      title: 
      slides:
        -
          title: Precisely define the information required
          text: Preparation should begin with precisely defining the information that is required to maintain and improve performance. Each department, office or unit of the business will have its own set of valuable information that could help improve performance, but this is likely to differ throughout the business.
          img: LM_U2_S3_P3_Slide_1.svg
        -
          title: Decide if presenting information visually will be effective
          text: Almost all information can be presented in a visual way. However, it is still important to consider whether presenting certain information visually is the most effective thing to do. This can even stretch to whether it’s even necessary to present the information at all. Think about, as an example, a business putting up a ‘No swearing’ sign in its reception area. Some people might consider such a sign to be over the top and unnecessary as they already intuitively know not to do this anyway!
          img: LM_U2_S3_P3_Slide_2.svg
        -
          title: Select an appropriate visual option
          text: For any given problem, there is usually a wide-range of different visual options that can be used, although not all VMTs are suitable for all situations. Displaying important information incorrectly, or in a way that is unsuitable, can be counter-productive as employees may not take notice of other visual indicators as a result.
          img: LM_U2_S3_P3_Slide_3.svg
        -
          title: Consider how often the information needs to be updated
          text: The purpose of the information will determine how regularly it needs to be updated. If amendments and refinements need to be made quickly, as is the case with daily or weekly sales figures or charts, then updates will be required more regularly. However, if some things are stable and unlikely to change, then the visual information rarely needs to be updated.
          img: LM_U2_S3_P3_Slide_4.svg
        -
          title: Think about where the information should be presented
          text: Employees should be able to readily see and use information that is relevant to their role. It doesn’t make any sense to bombard employees with pointless or irrelevant information! If the information that needs to be displayed is general and has to be seen by everyone, then it needs to be placed in an area that is frequented by all employees.
          img: LM_U2_S3_P3_Slide_5.svg
        -
          title: Keep in mind any future refinements
          text: As with any other aspect of the work process, businesses looking for ways to continuously improve should also keep in mind any future refinements with their VMTs. Businesses cannot assume that the implementation of visual indicators will be done exactly right the first time; reviewing and updating VMTs can help to find alternatives or make improvements.
          img: LM_U2_S3_P3_Slide_6.svg
  -
    title: Preparing and implementing VMTs
    theme: t-bg-primary
    copy: |
      When an organisation is committed to visual management techniques they will tend to be company-wide initiatives. Within this context, specific teams will participate in the visual management techniques in their work area. Usually, a designated team member will be nominated to prepare and oversee the introduction of the new visual management activity.

      To begin with, they’re likely to consider the following five factors:
      * What information needs to be displayed
      * Who will make use of the information
      * How often it will need to be updated
      * The method of updating data
      * How the information will be displayed.
  -
    title: Case studies
    theme: t-bg-primary1a i-casestudy
    copy: |

    subInc: 
      type: accordion
      content:
        - 
          title: Case study 1
          copy: |
            A team leader in a call centre is carrying out a review of the visual management techniques in her department. She has discovered that inbound call handlers often struggle to forward calls on to the correct departments as extension numbers change all the time due to the business expanding. 
      
            She decides that there should be a visual display of the correct extension numbers and who they connect to in the business. As the information is changing so often, she decides that the information should be displayed on a wipe clean whiteboard that is updated every week. 
            
            To ensure that the extension codes are accurate, the team leader nominates an employee who is in at the start of the week to be responsible for keeping the information up-to-date.
          img: /images/svg/ln/LM_U2_S3_P3_CaseStudy_1.svg
        - 
          title: Case study 2
          copy: |
            A local football club has decided to reform how its finances work. Currently, any money brought in on a match day is pooled together and counted in total. 
      
            With the new system each part of the club, from the kiosk to the bar and club shop, will submit its intake which will be counted separately. There will then be running totals for each section of the club along with an overall total. For this job to run smoothly, the cash office must have clearly defined compartments for the money from each section of the club so that the staff who collect and count the money can keep track of it. 
            
            The club secretary gets laminated signs made up for use in the cash office as the different parts of the club are unlikely to change any time soon. To ensure that the system is still working, there will be a review at the end of every season.
          img: /images/svg/ln/LM_U2_S3_P3_CaseStudy_2.svg
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: Are the visual management techniques used in the case studies on this page the most efficient way of presenting the relevant information? Can you think of any more effective ways that the information could be presented? Type your ideas in the box to the right.
  -
    title: What did you think?
    theme: t-bg-primary3
    copy: |
    subInc: 
      type: accordion
      content:
        - 
          title: 
          copy: |
            Some of the ideas you might have picked up on include:
            * Updating the presented information more often
            * Making information more visual, with icons and logos
            * Using printed notices instead of written information.

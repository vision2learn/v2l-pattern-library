
title: The role of a team leader
intro: | 
  ### Welcome to session 3

  In this final session, you will learn about **the role and qualities of team leaders in the workplace.**

banner: lm_u3_s3_p1_teamleader.svg
sections:
  -
    title: Learning goals
    theme: t-bg-primary
    copy: |
      In this third final session, you will work towards the following **learning goals.**

      You will:

      1. Understand the role of a team leader.

      At the end of the session you can:

      1. Describe the attributes needed by a team leader. 
      2. Identify ways a team leader can motivate team members.
  -
    title: The role of a team leader
    theme: t-bg-supporting3
    layout: media
    copy: |
      Effective team leadership is essential for the success of any team, which in turn is important for the wider business. To be a good team leader the person should have certain attributes.  There has been a significant amount of research into the attributes of team leaders which often come under two areas. Firstly, there are the competences needed by a team leader to perform the key tasks of their job. Secondly are the underpinning qualities that enable a team leader to lead the team and get things done. 

      One of the key roles of a team leader is to be able to motivate their team to perform to the best of their ability.

      In this session you will see how both **competencies** and **qualities** play a significant role in team leadership. You will also learn about different ways that team members can **motivate** their team members.


    img: /images/svg/ln/lm_u3_s3_p1_image_1.svg
  -
    title: Managerial competences for team leadership
    theme: 
    copy: |
       There are many models which seek to show the managerial tasks required of all team leaders. They often operate as a cycle where each task creates the foundation for work on the next task. If the work completed on the early tasks is low quality then later tasks are likely to suffer.
       
       It is important that team leaders display competence in these important areas. A team leader who does not have these competences may cause the team to fail to achieve its objectives.
    
    interactive: 
      file: lm/u3_s3_p1_interactive_competence
      width: 600
      height: 600
      composition: D3AA6E7253DD412AA82C811C9ADE6736
  -
    title: Functions of team leaders
    theme: 
    copy: |
      One of the most influential experts on leadership is Professor John Adair who wrote _Effective Leadership: How to Be a Successful Leader_ (Pan Macmillan, 2009). He identifies eight functions of leadership. Adair has studied leaders in all walks of life and at different levels in organisations and institutions. He believes that the functions are integral to high quality leadership.

    subInc: 
      type: accordion
      content:
        - 
          title: Eight functions
          copy: |
            1. Defining the task

            2. Planning

            3. Briefing

            4. Controlling

            5. Evaluating

            6. Motivating

            7. Organising

            8. Setting an example
  -
    title: Time to think
    theme: t-bg-primary3 i-think
    include: 
      type: time-to-think
      copy: Make some short notes on any overlap that you can see between the key managerial tasks and Adair’s leadership functions.
  -
    title: Summary
    theme: t-bg-primary i-summary
    copy: |
      These tasks are referred to as managerial; however, they apply to **leaders** at all levels of an organisation. 

      You have now learnt about the competencies and functions of team leaders. Move to the next page to learn about the qualities needed to deliver effective team leadership.

title: What did you learn? 
intro: Well done, you’ve now completed the ﬁrst session of this unit! In this session you have learnt about 

banner: LM_Summary.svg

sections:
  -
    title: Learning points
    theme: t-bg-primary
    copy: |
      Take a look at the following learning points to see a summary of what you have covered in this session:

    subInc: 
      type: accordion
      content:
        - 
          title: Competencies and attributes of a team leader
          copy: |
            Competencies (skills)
            * Setting objectives
            * Planning
            * Organising and coordinating
            * Motivating
            * Communicating
            * Monitoring and controlling
            * Evaluating
            
            Attributes (qualities)
            * Drive and enthusiasm
            * Honesty and integrity
            * Reliability and dependability
            * Fairness
            * Communication skills
            * People skills
            * Ability to make difficult decisions
            * Confidence
            * Vision
            * Sense of humour
            
        - 
          title: Styles of leadership
          copy: |
            Democratic
            * Mutual respect
            * Participation
            * Discussion
            
            Autocratic
            * Top-down orders
            * Fast and decisive decisions
            
            Effective visual management techniques
            * Laissez-faire
            * Free
            * Team leader does not impose
            
        -
          title: Motivational theories
          copy: |
            Motivation
            * Intrinsic
            * Extrinsic
            
            Maslow’s theory of human motivation
            * Physiological
            * Safety
            * Social
            * Esteem
            * Self-actualisation
            
            **Hertzberg**
            
            Satisfiers
            * Achievement
            * Recognition
            * Work itself
            * Responsibility
            * Advancement
            
            Dissatisfiers
            * Company policy and administration
            * Supervision
            * Salary
            * Interpersonal relations
            * Working conditions
            
            Expectancy theory
            * Effort
            * Performance
            * Reward
            
        - 
          title: Ways to motivate team members
          copy: |
            Taking action to motivate the team
            * Can action be directly taken by the team leader?
            * Can action be directly taken by others within the organisation?
            * Is action unable to be taken by anyone in the organisation?
  -
    title: Unit assessment
    theme: t-bg-primary3 i-practice
    copy: |
      Please select the following link:
      
      [Unit 3 Assessment](/resources/lean-management-l2-u3-assessment.doc) 
      
      to download your assessment document.


      _Please note the following two links do not work on this temporary site_
  -
  -
    title: Unit Quiz
    theme: i-quiz
    subInc:
      type: quick-quiz
      content:
        Which of the following are features of a team?:
          answers:
            Goals and objectives it works towards: false
            Members who work together: false
            A degree of ‘loyalty’ among members: false
            All of the above: true
        Which of the following is not a characteristic of an effective team?:
          answers:
            Undefined goals: true
            Clear instructions: false
            Effective communication: false
        Complete the following sentence - "One of the positive characteristics of a team worker according to the BELBIN approach is that they will be _____________.":
          answers:
            Unfriendly and abrasive: false
            Easily influenced: false
            Cooperative and diplomatic: true
            A strong personality and decision maker: false
        The following problem which can influence team performance could be put in which category? " There is confusion within the team about who has the authority to make decisions.":
          answers:
            Purpose: false
            Roles: false
            Relationships: false
            Processes: true
        Is the following statement true or false? "Teams can ensure that they can deal with challenges by having clear goals, roles and expected behaviour.":
          answers:
            True: true
            False: false
        Plan it is the first phrase and Do it is the second; What is the third phrase which sums up self-management?:
          answers:
            Write it down: false
            Relax: false
            Review it: true
        Giving top down orders is an example of _____________ leadership.:
          answers:
            Democratic: false
            Autocratic: true
            Permissive: false
        Is the following statement true or false? "Intrinsic motivation comes from external desires.":
          answers:
            True: false
            False: true
        Expectancy theory states that there is a relationship between effort, performance and _____________.:
          answers:
            Resources: false
            Holiday : false
            Reward: true
            Overtime: false
        If a team member stated that their motivator was to belong to the team, can the team leader take action directly?:
          answers:
            Yes: true
            No: false

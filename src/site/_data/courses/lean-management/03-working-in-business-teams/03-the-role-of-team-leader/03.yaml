
title: Motivation
intro: | 
  Why some employees have the drive to do things – whereas others do not – has been the subject of psychological study. The challenge for team leaders is to understand what motivates their team members and makes them strive for improved performance.

banner: lm_u3_s3_p3_motivate.svg
sections:
  -
    title: Workforce motivation
    theme: t-bg-primary
    copy: |
      Psychologists often refer to two different types of motivation: intrinsic and extrinsic. See below to learn more.

    subInc: 
      type: accordion
      content:
        - 
          title: Intrinsic motivation
          copy: |
            Intrinsic motivation comes from the wants and desires that are inside a person. A young child may play a sport or paint because it is fun. Simply playing a game is enjoyable so the child wishes to play more often. Many people have careers and hobbies that they do because of the intrinsic pleasure. Employees may do a job because doing that type of work gives them pleasure.

          img: /images/svg/ln/lm_u3_s3_p3_accordion_1.svg
        - 
          title: Extrinsic motivation
          copy: |
            Extrinsic motivation is when people are driven to do things by the offer of external rewards. Sometimes people may be externally rewarded for doing something that they are intrinsically motivated to do. For example, a professional footballer may be highly paid for something he would do for nothing. 
            
            There are times when the tasks being rewarded are not intrinsically appealing to an employee. Here the benefit of the external reward compensates for the person doing a task they are not intrinsically motivated to perform. A worker may find their work boring, but if it pays well the money earned can be spent on more interesting activities outside the workplace.

          img: /images/svg/ln/lm_u3_s3_p3_accordion_2.svg
  -
    title: Maslow’s theory of human motivation
    theme: 
    copy: |
      Maslow has ranked human needs and put them into a hierarchy of the order in which people are motivated to satisfy these needs. According to his theory, once a level of needs is met, people are able to move up to the next level. 

      Click on each level of the pyramid to see examples of these needs.

    interactive: 
      file: lm/u3_s3_p3_interactive_maslow
      width: 600
      height: 600
      composition: BF88F2F66EB64E2DB17EB02613B93BDE

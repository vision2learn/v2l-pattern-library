
title: Types of team structures and team roles in the workplace
intro: | 
  Different organisations may choose different team structures, or even have more than one. For example, a large organisation may have a different team structure for the Senior Management Team to the team structure of the employees within each department. Regardless of structure, teams will include a variety of roles which may fit solely within one team or be spread across different teams. This will be dependent on the team structure(s) of the organisation.
banner: lm_u3_s1_p4_types.svg
sections:
  -
    title: Team structures
    theme: t-bg-supporting2
    copy: |
        A team structure refers to how a team is made up. A well-structured team ensures that outcomes are met, that there is effective leadership, mutual support within the team and good communication. The team’s structure differs from the type of team. E.g. an organisation may have different types of teams: marketing, production, sales and so on. Each of these will be structured in a way that best serves its purpose. 
        
        Scroll along the slides below to learn more about five different team structures.
    subInc:
      type: slider
      title: 
      slides:
        -
          title: Operational teams
          text: |
              Operational teams usually have well-defined roles and responsibilities. It needs a variety of people with the right skills for the roles and responsibilities. Examples include a supermarket or bank, where services are provided and there’s a number of different roles to be carried out. Its purpose is usually specified by its level of service or quality of goods.
          img: lm_u3_s1_p4_slide_1.svg
        -
          title: Functional teams
          text: |
              A functional team structure groups employees by their skill set e.g. many organisations have departments such as human resources, IT, accounts, sales and so on. Each of these is independent of each other and is hierarchal as it will have a manager and possibly different levels of workers. The functional team allows employees to work in a group of similarly skilled people and achieve set objectives. This is more common in large organisations and helps everyone to know where to go for their specific needs e.g. when paying an invoice you would contact the accounts department.  

          img: lm_u3_s1_p4_slide_2.svg
        -
          title: Divisional teams
          text: |
              Like the functional teams a large organisation may be divided up into divisions depending on the products or service is providing e.g. a large telecommunications organisation may have separate divisions for mobile phones, TV packages and Wi-Fi. Each division may have its own functional teams to manage its own sales, accounts and services.

          img: lm_u3_s1_p4_slide_3.svg
        -
          title: Flat structure
          text: |
              Unlike the hierarchy found with the functional and divisional teams, the flat structure allows employees to freely contribute to work as it’s needed. This works well for small organisations and start ups and means that job titles and seniority do not need to be considered.

          img: lm_u3_s1_p4_slide_4.svg
        -
          title: Matrix
          text: |
              Within a matrix structure it’s usual for an employee to report to two managers. E.g. you might report to both an operational manager who oversees that the teams are moving towards to overall business objectives and you may also report to a product manager for an individual product or service you’re involved in delivering. Whilst this maintains a traditional hierarchy, it allows cross-collaboration to bring different teams together for a specific purpose.  

          img: lm_u3_s1_p4_slide_5.svg
  -
    title: Summary
    theme: t-bg-primary i-summary
    copy: |
      Although types of team structure vary, they share one main aim – to improve the performance of the organisation and enhance the experience of the customer. Within each team, there are employees with different skills. Therefore, team members usually have different team roles. These roles make a significant contribution to the effectiveness of the team.
  -
    title: Quick quiz
    copy: Match each scenario to the correct team that would deal with the issue.
    subInc: 
      type: word-quiz
      content:
        -
          sentence: Small organisations may benefit from a flat structure, which will allow free flow of employees’ contribution depending on current requirements. 
          answer: flat
        -
          sentence: Organisations that include many roles, such as banks and retail, usually have an operational structure.
          answer: operational
        -
          sentence: Large organisations with different products may have a divisional team structure.
          answer: divisional
        -
          sentence: Where different teams need to work in collaboration, a matrix structure is most suitable.
          answer: matrix
        -
          sentence: A hierarchal structure grouped by the functions of each team is known as a functional team structure.
          answer: functional
    theme: i-quiz
  -
    title: Team roles
    theme: t-bg-primary
    copy: |
      In the above sections we looked at the types of team that may be found in an organisation, such as, task, management or improvement driven teams. In addition to these different teams which are found in the workplace, people can also adopt different roles in these teams. We’ll now briefly look at the different roles within teams.
  -
    title: Case study
    theme: t-bg-primary1a i-casestudy
    copy: |
      First let’s look at the different positions individuals may hold in a team.

      Please see below to read some examples.

    subInc: 
      type: accordion
      content:
        - 
          title: Hospitality company
          copy: |
            The hierarchy found in teams such as those in bars, pubs or clubs.

            The team will focus on the same overall team objectives but will have different individual objectives. In this case bar staff (full and part time) are responsible for serving customers, keeping the bar clean and tidy and other duties such as changing kegs and restocking fridges. The bar and area managers will be concerned about profit, how much money they make each night and how they can encourage people to come to the bar.

          img: /images/svg/ln/lm_u3_s1_p4_casestudy_1.svg
        - 
          title: Distribution company
          copy: |
            Such as a team in an online shopping company.

            A team may also operate across an entire company, especially in small businesses. In this example, if one person were to neglect their role, then the customer may receive an incorrect order or they may not receive their order at all. The delivery officer relies on the post room coordinator to give them the correct post with the correct addresses, both team members rely on the packaging coordinator to ensure items are packaged appropriately for delivery.

            The packaging coordinator relies on the order picker to find the right items in the warehouse and send them through to product packaging. All rely on the order processor to make sure the correct information is distributed to all teams. No position has more or less important as they are all needed to complete the order. 

          img: /images/svg/ln/lm_u3_s1_p4_casestudy_2.svg
        - 
          title: Telesales company
          copy: |
            The hierarchy within a call centre which is sales driven.

            Similar to organisations like bars and restaurants team members in call centres will have individual targets such as call time and number of sales. The managers, directors and CEO will have other objectives such as how to increase staff productivity, attract customers or additional business and how to make the organisation more profitable.

          img: /images/svg/ln/lm_u3_s1_p4_casestudy_3.svg
  -
    title: Approaches to team roles
    theme: t-bg-primary
    copy: |
      There are many different ways to classify team roles. All classification systems identify the fact that in a team, certain things need to be done in order for the team to be effective and healthy. These may be done by different teams as in the examples above or they may be carried out by different people depending on their role within their team.

      Two main approaches to team roles are Team Management Systems (TMS) and Belbin.

      See below to see some examples of the team roles within each approach. 
    subInc: 
      type: accordion
      content:
        - 
          title: TMS roles
          copy: |
            * Creator Innovator 
            * Assessor Developer 
            * Controller Inspector 
            * Thruster Organiser 
            * Reporter Adviser
        - 
          title: Belbin
          copy: |
            * Plant
            * Implementer
            * Coordinator
            * Monitor Evaluator
            * Completer Finisher
    copy2: Don’t worry about these technical terms just yet; we’ll look at them in greater detail during the next session!
